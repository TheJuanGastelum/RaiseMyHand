<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RaiseMyHand</title>
<meta name="description" content="A live digital hand-raise queue for the classroom — students press space or tap to line up, teachers watch the queue update in real time.">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F4E8C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Explicit, hand-picked color themes -- no automatic OS dark-mode
     switching, so nobody ends up stuck with a low-contrast combo their
     system picked for them. A theme is "<hue>-<mode>" (e.g. "ocean-dark"):
     hue picks the main screen color and its paired, high-contrast text
     color; mode (light/dark) is a separate choice layered on top, shared
     across every hue via attribute-suffix selectors below. Default is
     ocean-light until someone picks another combination.

     -- Status colors + shadow/radius: shared across every hue, split only
        by brightness. */
  :root, :root[data-theme$="-light"]{
    --raise: #DFA636;
    --raise-ink: #2A1B04;
    --raise-soft: #FBF0D9;
    --good: #2F8F5B;
    --good-soft: #E1F3E8;
    --danger: #B3502E;
    --shadow: 0 1px 2px rgba(20,20,20,.06), 0 8px 24px -12px rgba(20,20,20,.18);
    --radius: 14px;
  }
  :root[data-theme$="-dark"]{
    --raise: #EFC066;
    --raise-ink: #2A1B04;
    --raise-soft: #33290F;
    --good: #56C088;
    --good-soft: #123423;
    --danger: #E08F6B;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px -12px rgba(0,0,0,.55);
    --radius: 14px;
  }

  /* -- Hue: the main screen color (--bg) paired with a readable text
        color (--ink), plus a matching accent -- one pair per hue per
        mode. --accent-icon is a separate, lightened copy of --accent
        used only for small icon strokes drawn on an --accent-soft
        badge background (see .role-card .icon-badge): in dark mode,
        --accent itself is too close in luminance to --accent-soft for
        a couple of hues (ocean/forest dip under 3:1), so --accent-icon
        is mixed toward white until every hue clears 4:1 there. Light
        mode's --accent already contrasts fine against --accent-soft,
        so --accent-icon just equals --accent there. */
  :root, :root[data-theme="ocean-light"]{
    --bg: #A3C8EC; --surface: #FFFFFF; --surface-2: #82B4E4;
    --ink: #081119; --ink-soft: #1F374B; --ink-faint: #2F5068; --line: #5E9ED8;
    --accent: #1F4E8C; --accent-ink: #FFFFFF; --accent-soft: #CCDFF8; --accent-icon: #1F4E8C;
    --swatch: #1F4E8C;
  }
  :root[data-theme="ocean-dark"]{
    --bg: #0E1D2E; --surface: #16283C; --surface-2: #1E3450;
    --ink: #F5FAF8; --ink-soft: #C3D2D8; --ink-faint: #7C8B93; --line: #2C4763;
    --accent: #2864A8; --accent-ink: #FFFFFF; --accent-soft: #1E3049; --accent-icon: #6992C2;
    --swatch: #2864A8;
  }
  :root[data-theme="slate-light"]{
    --bg: #C0C0BA; --surface: #FFFFFF; --surface-2: #A6A6A0;
    --ink: #0A0A09; --ink-soft: #34342F; --ink-faint: #4A4A42; --line: #888880;
    --accent: #33383D; --accent-ink: #FFFFFF; --accent-soft: #CACAC7; --accent-icon: #33383D;
    --swatch: #33383D;
  }
  :root[data-theme="slate-dark"]{
    --bg: #1B1C1E; --surface: #232427; --surface-2: #2E3034;
    --ink: #F7F7F6; --ink-soft: #D0D1CE; --ink-faint: #8B8C88; --line: #3D3F44;
    --accent: #7A828B; --accent-ink: #101112; --accent-soft: #2B2E32; --accent-icon: #A2A8AE;
    --swatch: #7A828B;
  }
  :root[data-theme="forest-light"]{
    --bg: #A9DA9F; --surface: #FFFFFF; --surface-2: #88C87C;
    --ink: #0A1908; --ink-soft: #24391F; --ink-faint: #365E2C; --line: #62B452;
    --accent: #1F6B3B; --accent-ink: #FFFFFF; --accent-soft: #C8DEBA; --accent-icon: #1F6B3B;
    --swatch: #1F6B3B;
  }
  :root[data-theme="forest-dark"]{
    --bg: #0E1F13; --surface: #17281B; --surface-2: #1F3826;
    --ink: #F3FAF4; --ink-soft: #C7DAC9; --ink-faint: #82988A; --line: #2C4A34;
    --accent: #2A7045; --accent-ink: #FFFFFF; --accent-soft: #1B3324; --accent-icon: #6A9B7D;
    --swatch: #2A7045;
  }
  :root[data-theme="sunset-light"]{
    --bg: #EDB998; --surface: #FFFFFF; --surface-2: #DF9E74;
    --ink: #1D1108; --ink-soft: #4A2C18; --ink-faint: #663C1C; --line: #CB8048;
    --accent: #B44A26; --accent-ink: #FFFFFF; --accent-soft: #ECCAB4; --accent-icon: #B44A26;
    --swatch: #B44A26;
  }
  :root[data-theme="sunset-dark"]{
    --bg: #1D140E; --surface: #271C14; --surface-2: #34261A;
    --ink: #FBF2EA; --ink-soft: #E3CDBC; --ink-faint: #A28A74; --line: #43301F;
    --accent: #E08549; --accent-ink: #241004; --accent-soft: #3A2415; --accent-icon: #E9AA80;
    --swatch: #E08549;
  }
  :root[data-theme="pink-light"]{
    --bg: #F4BAD8; --surface: #FFFFFF; --surface-2: #EDA1C7;
    --ink: #220915; --ink-soft: #4A1F34; --ink-faint: #6A3F58; --line: #E37BB6;
    --accent: #D42574; --accent-ink: #FFFFFF; --accent-soft: #F8D0E9; --accent-icon: #D42574;
    --swatch: #D42574;
  }
  :root[data-theme="pink-dark"]{
    --bg: #240A17; --surface: #301020; --surface-2: #3D1729;
    --ink: #FDF0F6; --ink-soft: #E3B9CC; --ink-faint: #9E7E8E; --line: #4A2038;
    --accent: #FF5CAE; --accent-ink: #22020F; --accent-soft: #401A2E; --accent-icon: #FF8DC6;
    --swatch: #FF5CAE;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Manrope", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  h1,h2,h3{ font-family:"Zilla Slab", Georgia, serif; margin:0; text-wrap:balance; }
  .mono{ font-family:"Space Mono", ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; }
  :focus-visible{ outline:2.5px solid var(--accent); outline-offset:2px; }

  .shell{ height:100vh; height:100dvh; display:flex; flex-direction:column; }
  .topbar{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px;
    border-bottom:1px solid var(--line);
    background:var(--surface);
  }
  .brand{ display:flex; align-items:center; gap:9px; font-family:"Zilla Slab"; font-weight:700; font-size:1.15rem; letter-spacing:.01em; }
  .brand svg{ width:22px; height:22px; flex:0 0 auto; }
  .topbar-meta{ display:flex; align-items:center; gap:10px; font-size:.85rem; color:var(--ink-soft); }
  .role-pill{
    font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
    padding:4px 10px; border-radius:999px; background:var(--surface-2); color:var(--ink-soft);
  }
  .exit-link{ background:none; border:none; color:var(--ink-soft); font-size:.85rem; cursor:pointer; padding:4px 6px; border-radius:6px; text-decoration:underline; text-underline-offset:2px; }
  .exit-link:hover{ color:var(--ink); }

  /* ---- Theme switcher ---- */
  .theme-switch{ position:relative; display:flex; align-items:center; }
  .theme-btn{
    width:24px; height:24px; border-radius:50%; border:2px solid var(--surface); box-shadow:0 0 0 1px var(--line);
    background:var(--swatch); cursor:pointer; padding:0; flex:0 0 auto;
  }
  .theme-btn:hover{ box-shadow:0 0 0 1px var(--ink-faint); }
  .theme-pop{
    display:none; position:absolute; top:calc(100% + 8px); right:0; z-index:40;
    background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow);
    padding:10px; gap:8px;
  }
  .theme-pop.open{ display:flex; }
  .theme-pop button{
    width:24px; height:24px; border-radius:50%; border:2px solid var(--surface); box-shadow:0 0 0 1px var(--line);
    cursor:pointer; padding:0;
  }
  .theme-pop button.active{ box-shadow:0 0 0 2px var(--accent); }
  .mode-btn{
    width:24px; height:24px; border-radius:50%; border:none; background:var(--surface-2); color:var(--ink-soft);
    cursor:pointer; padding:0; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .mode-btn svg{ width:14px; height:14px; }
  .mode-btn:hover{ color:var(--ink); }

  .feedback-switch{ position:relative; display:flex; align-items:center; }
  .feedback-pop{
    display:none; flex-direction:column; gap:8px; position:absolute; top:calc(100% + 8px); right:0; z-index:40;
    width:240px; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow);
    padding:14px;
  }
  .feedback-pop.open{ display:flex; }
  .feedback-pop-head{ font-family:"Zilla Slab"; font-weight:700; font-size:.95rem; color:var(--ink); }
  .feedback-pop-sub{ font-size:.76rem; color:var(--ink-faint); line-height:1.35; margin-top:-4px; }
  .feedback-pop textarea{ min-height:64px; font-size:.85rem; padding:8px 10px; }
  .feedback-pop .btn{ padding:8px; font-size:.85rem; }
  .feedback-thanks{ font-size:.82rem; color:var(--good); font-weight:700; text-align:center; }

  .app{ flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; padding:28px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .app.top-align{ align-items:flex-start; }
  .screen{ width:100%; max-width:560px; animation:rise .35s ease both; margin:auto; }
  .screen.wide{ max-width:640px; min-height:100%; display:flex; flex-direction:column; }
  @keyframes rise{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){ .screen{ animation:none; } }

  /* ---- Landing ---- */
  .lede{ text-align:center; margin-bottom:28px; }
  .lede h1{ font-size:2rem; margin-bottom:8px; }
  .lede p{ color:var(--ink-soft); font-size:1rem; max-width:34em; margin:0 auto; }
  .role-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:480px){ .role-grid{ grid-template-columns:1fr; } }
  .role-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px 20px; text-align:left; cursor:pointer; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:10px; transition:transform .15s ease, border-color .15s ease;
    color:var(--ink);
  }
  .role-card:hover{ transform:translateY(-2px); border-color:var(--accent); }
  .role-card .icon-badge{ width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:var(--accent-soft); }
  .role-card .icon-badge svg{ width:20px; height:20px; }
  .role-card h2{ font-size:1.15rem; }
  .role-card p{ margin:0; color:var(--ink-soft); font-size:.9rem; line-height:1.45; }

  /* ---- Cards / forms ---- */
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px; }
  .card h2{ font-size:1.3rem; margin-bottom:4px; }
  .card .sub{ color:var(--ink-soft); font-size:.9rem; margin-bottom:20px; }
  label{ display:block; font-size:.8rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-bottom:6px; }
  .field{ margin-bottom:16px; }
  .field .hint{ font-size:.78rem; color:var(--ink-faint); margin-top:5px; }
  input[type=text]{
    width:100%; font-size:1rem; padding:11px 13px; border-radius:10px;
    border:1.5px solid var(--line); background:var(--bg); color:var(--ink); font-family:inherit;
  }
  input[type=text]:focus{ border-color:var(--accent); }
  input.code-input{ font-family:"Space Mono"; font-size:1.6rem; letter-spacing:.35em; text-align:center; text-transform:uppercase; padding:13px; }
  .btn{
    appearance:none; border:none; border-radius:10px; padding:12px 18px; font-weight:700; font-size:.95rem;
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:transform .1s ease, filter .15s ease;
    width:100%;
  }
  .btn:active{ transform:scale(.98); }
  .btn:disabled{ opacity:.65; cursor:default; }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-raise{ background:var(--raise); color:var(--raise-ink); }
  .btn-raise:hover{ filter:brightness(1.05); }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1.5px solid var(--line); }
  .btn-ghost:hover{ border-color:var(--ink-faint); color:var(--ink); }
  .btn-danger-ghost{ background:transparent; color:var(--danger); border:1.5px solid var(--line); }
  .btn-danger-ghost:hover{ border-color:var(--danger); }
  .link-row{ text-align:center; margin-top:16px; font-size:.87rem; color:var(--ink-soft); }
  .link-row button{ background:none; border:none; color:var(--accent); font-weight:700; cursor:pointer; padding:2px 4px; text-decoration:underline; text-underline-offset:2px; font-size:inherit; }
  .error-box{ display:none; }
  .error-box.show{ display:block; background:#fbeae2; color:var(--danger); border:1px solid var(--danger); border-radius:8px; padding:9px 12px; font-size:.85rem; margin-bottom:14px; }

  /* ---- Teacher board ---- */
  .board-header{ flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; padding-bottom:18px; margin-bottom:18px; border-bottom:1px solid var(--line); }
  .board-title h2{ font-size:1.4rem; }
  .board-title .sub{ color:var(--ink-soft); font-size:.88rem; margin-top:2px; }
  .reopen-toggle{ background:none; border:none; color:var(--ink-faint); font-size:.76rem; cursor:pointer; padding:2px 0; margin-top:4px; text-decoration:underline; text-underline-offset:2px; }
  .reopen-toggle:hover{ color:var(--ink-soft); }
  .reopen-value{ font-family:"Space Mono"; font-size:.8rem; letter-spacing:.06em; background:var(--surface-2); color:var(--ink); padding:3px 8px; border-radius:6px; margin-left:6px; }
  .code-chip{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:8px 8px 8px 16px; box-shadow:var(--shadow); }
  .code-chip .code-label{ font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); }
  .code-chip .code-value{ font-family:"Space Mono"; font-weight:700; font-size:1.4rem; letter-spacing:.18em; color:var(--accent); }
  .icon-btn{ background:var(--surface-2); border:none; border-radius:8px; width:34px; height:34px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft); }
  .icon-btn:hover{ color:var(--ink); }
  .icon-btn svg{ width:16px; height:16px; }

  .queue-scroll{ flex:1 1 auto; min-height:0; overflow-y:auto; padding:2px 2px 2px 16px; margin-left:-16px; }
  .queue-list{ display:flex; flex-direction:column; gap:12px; }
  .empty-state{ text-align:center; padding:60px 20px; color:var(--ink-faint); }
  .empty-state svg{ width:40px; height:40px; margin-bottom:12px; opacity:.5; }
  .empty-state p{ margin:0; font-size:.95rem; }

  .stub{
    position:relative; display:flex; align-items:center; gap:14px;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px 14px 22px; box-shadow:var(--shadow);
  }
  .stub::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:14px;
    background-image: radial-gradient(circle 5px at 0 50%, var(--bg) 5px, transparent 5.5px);
    background-repeat:repeat-y; background-size:14px 17px; transform:translateX(-50%);
  }
  .stub.next{ border-color:var(--raise); background:linear-gradient(0deg, var(--surface), var(--raise-soft) 260%); }
  .stub .num{ font-family:"Space Mono"; font-weight:700; font-size:1.3rem; color:var(--ink-faint); min-width:2ch; text-align:center; }
  .stub.next .num{ color:var(--raise); }
  .stub .who{ flex:1; min-width:0; }
  .stub .who .name{ font-weight:700; font-size:1.02rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stub .who .wait{ font-size:.8rem; color:var(--ink-soft); margin-top:2px; }
  .stub .who .note{ font-size:.78rem; color:var(--ink-soft); margin-top:3px; font-style:italic; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stub .who .note-peek{ background:var(--surface-2); color:var(--ink-soft); border:none; border-radius:6px; padding:2px 8px; font-size:.72rem; font-weight:700; cursor:pointer; margin-top:4px; }
  .stub .who .note-peek:hover{ color:var(--ink); }
  .stub .who .note-hide-again{ background:none; border:none; color:var(--accent); font-size:.72rem; font-weight:700; cursor:pointer; padding:0 0 0 4px; text-decoration:underline; text-underline-offset:2px; }
  .stub .next-badge{ font-size:.68rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--raise-ink); background:var(--raise); padding:3px 8px; border-radius:999px; margin-right:2px; }
  .stub .help-btn{ background:var(--good-soft); color:var(--good); border:none; border-radius:8px; padding:9px 14px; font-weight:700; font-size:.85rem; cursor:pointer; white-space:nowrap; flex:0 0 auto; }
  .stub .help-btn:hover{ filter:brightness(.95); }

  .board-footer{ flex:0 0 auto; padding-top:16px; margin-top:16px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; }
  .board-footer .btn{ width:auto; }
  .board-footer{ gap:10px; flex-wrap:wrap; }
  .discuss-actions .btn{ width:auto; padding:5px 10px; font-size:.78rem; }
  @keyframes new-hand-flash{ 0%{ box-shadow:0 0 0 0 var(--accent); background:var(--accent-soft); } 100%{ box-shadow:0 0 0 12px transparent; } }
  .stub.flash-new{ animation:new-hand-flash 1.4s ease-out 2; }
  .offline-bar{ position:fixed; top:0; left:0; right:0; z-index:1200; background:var(--danger); color:#fff; text-align:center; font-size:.84rem; font-weight:700; padding:8px 14px; }
  .offline-bar[hidden]{ display:none; }
  .kind-row{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:16px; }
  .kind-chip{ background:transparent; color:var(--ink-soft); border:1.5px solid var(--line); border-radius:999px; padding:5px 12px; font-size:.78rem; font-weight:700; cursor:pointer; font-family:inherit; }
  .kind-chip:hover{ border-color:var(--accent); }
  .kind-chip.on{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .kind-tag{ display:inline-block; margin-left:6px; padding:1px 8px; border-radius:999px; font-size:.68rem; font-weight:800; letter-spacing:.02em; background:var(--accent-soft); color:var(--accent); font-family:inherit; }
  .kind-tag.k-stuck{ background:var(--raise); color:var(--raise-ink); }
  .undo-bar{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:1100; display:flex; align-items:center; gap:14px; background:var(--ink); color:var(--bg); padding:10px 12px 10px 18px; border-radius:999px; font-size:.86rem; font-weight:600; box-shadow:var(--shadow); max-width:calc(100vw - 32px); }
  .undo-bar button{ background:var(--accent); color:var(--accent-ink); border:none; border-radius:999px; padding:6px 14px; font-weight:800; font-size:.8rem; cursor:pointer; font-family:inherit; }
  .site-foot{ text-align:center; padding:18px 16px 26px; font-size:.78rem; color:var(--ink-faint); }
  .site-foot a{ color:var(--ink-faint); text-underline-offset:2px; }
  .site-foot a:hover{ color:var(--accent); }
  .mode-wrap{ position:relative; margin-top:6px; }
  .mode-pill{ background:var(--surface); color:var(--ink-soft); border:1.5px solid var(--line); border-radius:999px; padding:4px 12px; font-size:.78rem; font-weight:700; cursor:pointer; font-family:inherit; }
  .mode-pill:hover{ border-color:var(--accent); }
  .mode-pill.is-active{ color:var(--accent); background:var(--accent-soft); border-color:var(--accent); }
  .mode-menu{ position:absolute; z-index:50; top:calc(100% + 6px); left:0; min-width:250px; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:6px; }
  .mode-opt{ display:block; width:100%; text-align:left; background:none; border:none; border-radius:8px; padding:9px 12px; cursor:pointer; font-family:inherit; color:var(--ink); }
  .mode-opt:hover{ background:var(--surface-2); }
  .mode-opt.on{ background:var(--accent-soft); }
  .mode-opt .mode-name{ display:block; font-weight:700; font-size:.88rem; }
  .mode-opt .mode-desc{ display:block; font-size:.76rem; color:var(--ink-soft); margin-top:1px; }
  .block-btn{ flex:0 0 auto; background:transparent; color:var(--danger); border:1px solid var(--line); border-radius:8px; padding:6px 9px; font-size:.72rem; font-weight:700; cursor:pointer; margin-left:6px; font-family:inherit; }
  .block-btn:hover{ border-color:var(--danger); }
  .q-actions .block-btn{ margin-left:0; }
  .unblock-btn{ background:var(--accent-soft); color:var(--accent); border:none; border-radius:8px; padding:6px 10px; font-size:.78rem; font-weight:700; cursor:pointer; }
  .qr-overlay{ position:fixed; inset:0; z-index:1000; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:16px; }
  .qr-card{ background:var(--surface); color:var(--ink); border-radius:18px; padding:24px; width:min(92vw, 460px); text-align:center; box-shadow:var(--shadow); }
  .qr-card .qr-img{ width:100%; max-width:380px; margin:0 auto 14px; background:#fff; border-radius:10px; padding:6px; }
  .qr-card .qr-img svg{ display:block; width:100%; height:auto; }
  .qr-card .qr-code{ font-family:"Space Mono"; font-weight:700; font-size:2rem; letter-spacing:.18em; color:var(--accent); }
  .qr-card .qr-hint{ color:var(--ink-soft); font-size:.88rem; margin:4px 0 16px; word-break:break-all; }
  .qr-card .btn{ width:auto; }

  /* ---- Announcement (teacher composer) ---- */
  .announce-card{ flex:0 0 auto; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; margin-bottom:18px; transition:border-color .15s ease; }
  .announce-card.is-live{ border-color:var(--accent); border-width:2px; }
  .announce-card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .announce-card-head h3{ font-family:"Zilla Slab"; font-size:1rem; }
  .announce-status{ font-size:.75rem; color:var(--ink-faint); font-weight:700; }
  .announce-status.is-live{ color:var(--accent); text-transform:uppercase; letter-spacing:.05em; font-size:.72rem; }
  .announce-live{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; background:var(--accent-soft); border-left:4px solid var(--accent); border-radius:10px; padding:14px 16px; margin-bottom:12px; }
  .announce-live p{ margin:0; font-size:1.08rem; font-weight:600; color:var(--ink); line-height:1.35; }
  .announce-live .meta{ font-size:.76rem; color:var(--ink-soft); margin-top:6px; }
  .announce-live button{ background:none; border:none; color:var(--ink-soft); font-size:.82rem; cursor:pointer; text-decoration:underline; white-space:nowrap; }
  textarea{ width:100%; font-family:inherit; font-size:.92rem; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); resize:vertical; min-height:52px; }
  textarea:focus{ border-color:var(--accent); }
  select{ font-family:inherit; font-size:.85rem; padding:9px 10px; border-radius:8px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); }
  .announce-controls{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center; }
  .announce-controls select{ flex:1 1 180px; min-width:0; }
  .announce-controls input{ padding:9px 10px; text-align:center; min-width:0; }
  .announce-controls .btn{ flex:0 0 auto; }

  /* ---- Announcement (student banner) ---- */
  .announce-banner{ display:flex; align-items:flex-start; gap:12px; background:var(--accent-soft); border:2px solid var(--accent); border-radius:14px; padding:16px 18px; margin-bottom:18px; box-shadow:var(--shadow); animation:announce-pop .3s ease both; }
  .announce-banner .announce-icon{ flex:0 0 auto; width:24px; height:24px; color:var(--accent); margin-top:1px; }
  .announce-banner .announce-body{ flex:1 1 auto; min-width:0; }
  .announce-banner .announce-text{ font-size:1.05rem; font-weight:600; color:var(--ink); line-height:1.4; }
  .announce-banner .announce-text strong{ color:var(--accent); text-transform:uppercase; font-size:.82rem; letter-spacing:.04em; display:block; margin-bottom:2px; }
  .announce-banner .announce-dismiss{ background:none; border:none; color:var(--ink-soft); font-size:1.4rem; line-height:1; cursor:pointer; padding:0 2px; flex:0 0 auto; }
  .announce-banner .announce-dismiss:hover{ color:var(--ink); }
  @keyframes announce-pop{ from{ transform:scale(.96); opacity:0; } to{ transform:scale(1); opacity:1; } }
  @media (prefers-reduced-motion: reduce){ .announce-banner{ animation:none; } }

  /* ---- Student wait ---- */
  .raise-pad{ text-align:center; }
  .raise-pad .meta{ margin-bottom:26px; color:var(--ink-soft); font-size:.92rem; }
  .raise-pad .meta strong{ color:var(--ink); }
  .raise-btn{
    width:230px; height:230px; border-radius:50%; margin:0 auto; border:none; cursor:pointer;
    background:radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--raise) 88%, white), var(--raise));
    color:var(--raise-ink); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    box-shadow:0 14px 30px -12px color-mix(in srgb, var(--raise) 60%, transparent), var(--shadow);
    transition:transform .12s ease;
  }
  .raise-btn:hover{ transform:scale(1.02); }
  .raise-btn:active{ transform:scale(.97); }
  .raise-btn svg{ width:52px; height:52px; }
  .raise-btn .label{ font-family:"Zilla Slab"; font-weight:700; font-size:1.25rem; }
  .kbd-hint{ margin-top:22px; color:var(--ink-faint); font-size:.85rem; }
  kbd{ font-family:"Space Mono"; background:var(--surface-2); border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:2px 8px; font-size:.82rem; }

  /* ---- Student note-to-self ---- */
  .note-toggle{ background:none; border:none; color:var(--accent); font-weight:700; cursor:pointer; padding:4px 2px; font-size:.85rem; text-decoration:underline; text-underline-offset:2px; margin-top:22px; }
  .note-box{ margin-top:12px; text-align:left; }
  .note-box textarea{ min-height:64px; }
  .note-share{ display:flex; align-items:center; gap:7px; margin-top:8px; font-size:.8rem; color:var(--ink-soft); font-weight:500; text-transform:none; letter-spacing:normal; cursor:pointer; }
  .note-share input{ width:15px; height:15px; margin:0; }
  .ticket-note{ margin-top:20px; text-align:left; background:var(--surface-2); border-radius:10px; padding:12px 14px; }
  .ticket-note .k{ font-size:.7rem; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint); margin-bottom:4px; }
  .ticket-note .v-note{ font-size:.88rem; color:var(--ink); line-height:1.4; white-space:pre-wrap; }
  .note-shared-tag{ display:inline-block; margin-top:6px; font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); }

  .ticket{
    background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow);
    padding:32px 26px; text-align:center; position:relative;
  }
  .ticket .eyebrow{ font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-faint); margin-bottom:10px; }
  .ticket .position{ font-family:"Space Mono"; font-weight:700; font-size:4.6rem; line-height:1; color:var(--accent); }
  .ticket .of{ color:var(--ink-soft); font-size:.9rem; margin-top:6px; }
  .ticket .details{ margin-top:26px; display:flex; justify-content:center; gap:28px; padding-top:22px; border-top:2px dashed var(--line); }
  .ticket .detail .k{ font-size:.7rem; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint); margin-bottom:3px; }
  .ticket .detail .v{ font-family:"Space Mono"; font-weight:700; font-size:1.1rem; }
  .ticket .lower-btn{ margin-top:26px; }

  .called-flash{ text-align:center; padding:20px 10px; }
  .called-flash .check{ width:64px; height:64px; border-radius:50%; background:var(--good-soft); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }
  .called-flash .check svg{ width:32px; height:32px; color:var(--good); }
  .called-flash h2{ font-size:1.3rem; color:var(--good); }
  .called-flash p{ color:var(--ink-soft); margin-top:6px; }

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(10px); opacity:0;
    background:var(--ink); color:var(--bg); padding:9px 18px; border-radius:999px; font-size:.85rem; font-weight:600;
    pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---- Discussion mode (teacher panel) ---- */
  .discuss-card{ flex:0 0 auto; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; margin-bottom:18px; }
  .discuss-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:10px; }
  .discuss-head h3{ font-family:"Zilla Slab"; font-size:1rem; }
  .discuss-actions{ display:flex; align-items:center; gap:8px; }
  .discuss-count{ font-size:.78rem; color:var(--ink-faint); font-weight:600; }
  .discuss-empty{ text-align:center; padding:18px; color:var(--ink-faint); font-size:.88rem; }
  .discuss-hidden-notice{ background:var(--surface-2); border-radius:10px; padding:12px 14px; text-align:center; color:var(--ink-faint); font-size:.85rem; margin-bottom:8px; }
  .discuss-hidden-notice button{ background:none; border:none; color:var(--accent); font-weight:700; cursor:pointer; text-decoration:underline; text-underline-offset:2px; font-size:inherit; padding:0 2px; }
  .q-item{ display:flex; align-items:flex-start; gap:12px; background:var(--surface-2); border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .q-item:last-child{ margin-bottom:0; }
  .q-content{ flex:1 1 auto; min-width:0; }
  .q-text{ font-size:.9rem; line-height:1.45; color:var(--ink); }
  .q-meta{ font-size:.75rem; color:var(--ink-soft); margin-top:3px; }
  .q-actions{ display:flex; gap:6px; flex:0 0 auto; align-items:flex-start; flex-wrap:wrap; }
  .q-actions button{ padding:5px 11px; font-size:.78rem; font-weight:700; border-radius:6px; cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; gap:4px; }
  .q-actions button svg{ width:13px; height:13px; flex:0 0 auto; }
  .q-answered{ background:var(--good-soft); color:var(--good); border:none; }
  .q-answered:hover{ filter:brightness(.95); }
  .q-skip{ background:transparent; color:var(--ink-soft); border:1.5px solid var(--line); }
  .q-skip:hover{ border-color:var(--ink-faint); color:var(--ink); }
  .q-mute{ background:transparent; color:var(--danger); border:1.5px solid var(--line); }
  .q-mute:hover{ border-color:var(--danger); }
  .q-mute.is-muted{ opacity:.55; }
  .q-back{ background:var(--accent-soft); color:var(--accent); border:none; }
  .q-back:hover{ filter:brightness(.95); }
  .skipped-toggle-btn{ background:none; border:none; color:var(--ink-faint); font-size:.8rem; font-weight:700; cursor:pointer; padding:6px 0 2px; text-decoration:underline; text-underline-offset:2px; }
  .skipped-toggle-btn:hover{ color:var(--ink-soft); }
  .discuss-mode-active .icon-btn{ color:var(--accent); background:var(--accent-soft); }

  /* ---- Teacher board panel layout (stacked / side-by-side) ---- */
  .board-panels{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
  .board-panels-right{ display:contents; }
  @media (min-width:641px){
    /* Widen the board in split mode so both columns get enough space */
    .screen.wide.layout-split-active{ max-width:900px; }
    .board-panels.layout-split{ flex-direction:row; align-items:stretch; gap:18px; }
    .board-panels.layout-split .board-panels-right{ flex:0 0 40%; display:flex; flex-direction:column; min-width:0; overflow-y:auto; }
    /* Queue goes left; restore left padding so the ticket-punch ::before stays visible */
    .board-panels.layout-split .queue-scroll{ order:-1; flex:1 1 auto; min-width:0; overflow-y:auto; margin-left:0; padding-left:18px; }
    /* Give queue rows slightly tighter padding so names have room */
    .board-panels.layout-split .stub{ padding:10px 12px 10px 20px; gap:10px; }
    /* Allow names and notes to wrap instead of silently truncating */
    .board-panels.layout-split .stub .who .name{ white-space:normal; overflow:visible; word-break:break-word; }
    .board-panels.layout-split .stub .who .note{ white-space:normal; overflow:visible; }
    /* Stack question action buttons vertically in the narrow right panel */
    .board-panels.layout-split .q-actions{ flex-direction:column; gap:3px; min-width:76px; flex:0 0 auto; }
    .board-panels.layout-split .q-actions button{ width:100%; justify-content:center; }
  }

  /* ---- Landing role-cycle animation ---- */
  .role-cycle{ display:inline; transition:opacity .3s ease; }
  .role-cycle-fade{ opacity:0; }

  /* ---- Discussion mode (student question form) ---- */
  .question-section{ margin-top:22px; text-align:left; }
  .question-box{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow); }
  .question-box h3{ font-family:"Zilla Slab"; font-size:1rem; margin-bottom:10px; color:var(--ink); }
  .question-box textarea{ min-height:60px; }
  .question-box .q-submit-btn{ margin-top:8px; }
  .question-muted{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 18px; text-align:center; color:var(--ink-faint); font-size:.88rem; box-shadow:var(--shadow); }

  /* ---- Phone / narrow-viewport tuning ---- */
  @media (max-width: 480px){
    /* Inputs at 16px stop iOS Safari from zooming in on focus. */
    textarea, select, input[type=text]{ font-size:16px; }
    .app{ padding:18px 16px; }
    .card{ padding:20px; }
    .announce-card{ padding:14px; }
    .announce-controls{ flex-direction:column; align-items:stretch; }
    .announce-controls select, .announce-controls input, .announce-controls .btn{ width:100%; }
    .board-header{ gap:10px; }
    .code-chip{ flex-wrap:wrap; }
    .raise-btn{ width:190px; height:190px; }
    .raise-btn svg{ width:44px; height:44px; }
    .raise-btn .label{ font-size:1.1rem; }
    .ticket .position{ font-size:3.6rem; }
    .ticket .details{ gap:18px; }
    .icon-btn{ width:38px; height:38px; }
    .theme-btn, .mode-btn, .theme-pop button{ width:28px; height:28px; }
    .feedback-pop{ width:min(240px, calc(100vw - 32px)); }
    .q-actions{ flex-direction:column; gap:4px; }
    .q-actions button{ width:100%; text-align:center; }
  }
</style>
</head>
