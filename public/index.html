<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RaiseMyHand</title>
<meta name="description" content="A live digital hand-raise queue for the classroom — students press space or tap to line up, teachers watch the queue update in real time.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2220%22>✋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Explicit, hand-picked color themes -- no automatic OS dark-mode
     switching, so nobody ends up stuck with a low-contrast combo their
     system picked for them. A theme is "<hue>-<mode>" (e.g. "ocean-dark"):
     hue picks the main screen color and its paired, high-contrast text
     color; mode (light/dark) is a separate choice layered on top, shared
     across every hue via attribute-suffix selectors below. Default is
     ocean-light until someone picks another combination.

     -- Status colors + shadow/radius: shared across every hue, split only
        by brightness. */
  :root, :root[data-theme$="-light"]{
    --raise: #DFA636;
    --raise-ink: #2A1B04;
    --raise-soft: #FBF0D9;
    --good: #2F8F5B;
    --good-soft: #E1F3E8;
    --danger: #B3502E;
    --shadow: 0 1px 2px rgba(20,20,20,.06), 0 8px 24px -12px rgba(20,20,20,.18);
    --radius: 14px;
  }
  :root[data-theme$="-dark"]{
    --raise: #EFC066;
    --raise-ink: #2A1B04;
    --raise-soft: #33290F;
    --good: #56C088;
    --good-soft: #123423;
    --danger: #E08F6B;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px -12px rgba(0,0,0,.55);
    --radius: 14px;
  }

  /* -- Hue: the main screen color (--bg) paired with a readable text
        color (--ink), plus a matching accent -- one pair per hue per
        mode. */
  :root, :root[data-theme="ocean-light"]{
    --bg: #CBE0F5; --surface: #FFFFFF; --surface-2: #B3CFEE;
    --ink: #101E2C; --ink-soft: #33506B; --ink-faint: #5A7890; --line: #96BADD;
    --accent: #1F4E8C; --accent-ink: #FFFFFF; --accent-soft: #DCEAFB;
    --swatch: #1F4E8C;
  }
  :root[data-theme="ocean-dark"]{
    --bg: #0E1D2E; --surface: #16283C; --surface-2: #1E3450;
    --ink: #EAF0EE; --ink-soft: #A6B4BB; --ink-faint: #6C7A82; --line: #2C4763;
    --accent: #3E7CBF; --accent-ink: #FFFFFF; --accent-soft: #1E3049;
    --swatch: #3E7CBF;
  }
  :root[data-theme="slate-light"]{
    --bg: #DADAD6; --surface: #FFFFFF; --surface-2: #C6C6C0;
    --ink: #161615; --ink-soft: #4B4B46; --ink-faint: #726F68; --line: #ABABA4;
    --accent: #33383D; --accent-ink: #FFFFFF; --accent-soft: #D6D7D4;
    --swatch: #33383D;
  }
  :root[data-theme="slate-dark"]{
    --bg: #1B1C1E; --surface: #232427; --surface-2: #2E3034;
    --ink: #EDEDEC; --ink-soft: #B7B8B5; --ink-faint: #7B7C79; --line: #3D3F44;
    --accent: #5A6169; --accent-ink: #FFFFFF; --accent-soft: #2B2E32;
    --swatch: #5A6169;
  }
  :root[data-theme="forest-light"]{
    --bg: #CCE6C6; --surface: #FFFFFF; --surface-2: #B2D9A8;
    --ink: #132710; --ink-soft: #3A5A34; --ink-faint: #5F8256; --line: #93C287;
    --accent: #1F6B3B; --accent-ink: #FFFFFF; --accent-soft: #D3EACB;
    --swatch: #1F6B3B;
  }
  :root[data-theme="forest-dark"]{
    --bg: #0E1F13; --surface: #17281B; --surface-2: #1F3826;
    --ink: #E7F1E9; --ink-soft: #A9BDAE; --ink-faint: #6E8175; --line: #2C4A34;
    --accent: #3F9260; --accent-ink: #FFFFFF; --accent-soft: #1B3324;
    --swatch: #3F9260;
  }
  :root[data-theme="sunset-light"]{
    --bg: #F3D7C0; --surface: #FFFFFF; --surface-2: #EBC1A0;
    --ink: #2A1B10; --ink-soft: #6B4227; --ink-faint: #93684A; --line: #DDA97F;
    --accent: #B44A26; --accent-ink: #FFFFFF; --accent-soft: #F1D9C4;
    --swatch: #B44A26;
  }
  :root[data-theme="sunset-dark"]{
    --bg: #1D140E; --surface: #271C14; --surface-2: #34261A;
    --ink: #F5E9DE; --ink-soft: #C7AE9B; --ink-faint: #8C7565; --line: #43301F;
    --accent: #D9713F; --accent-ink: #241004; --accent-soft: #3A2415;
    --swatch: #D9713F;
  }
  :root[data-theme="pink-light"]{
    --bg: #F5D1E2; --surface: #FFFFFF; --surface-2: #EEB8D3;
    --ink: #33131F; --ink-soft: #6B3A52; --ink-faint: #94607C; --line: #E19BC0;
    --accent: #C43D74; --accent-ink: #FFFFFF; --accent-soft: #F8D2E4;
    --swatch: #C43D74;
  }
  :root[data-theme="pink-dark"]{
    --bg: #1D0F16; --surface: #271521; --surface-2: #331C2B;
    --ink: #F7E4EE; --ink-soft: #C79BB0; --ink-faint: #8C6478; --line: #402336;
    --accent: #E85F97; --accent-ink: #22040F; --accent-soft: #3A1B2D;
    --swatch: #E85F97;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Manrope", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  h1,h2,h3{ font-family:"Zilla Slab", Georgia, serif; margin:0; text-wrap:balance; }
  .mono{ font-family:"Space Mono", ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; }
  :focus-visible{ outline:2.5px solid var(--accent); outline-offset:2px; }

  .shell{ height:100vh; height:100dvh; display:flex; flex-direction:column; }
  .topbar{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px;
    border-bottom:1px solid var(--line);
    background:var(--surface);
  }
  .brand{ display:flex; align-items:center; gap:9px; font-family:"Zilla Slab"; font-weight:700; font-size:1.15rem; letter-spacing:.01em; }
  .brand svg{ width:22px; height:22px; flex:0 0 auto; }
  .topbar-meta{ display:flex; align-items:center; gap:10px; font-size:.85rem; color:var(--ink-soft); }
  .role-pill{
    font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
    padding:4px 10px; border-radius:999px; background:var(--surface-2); color:var(--ink-soft);
  }
  .exit-link{ background:none; border:none; color:var(--ink-soft); font-size:.85rem; cursor:pointer; padding:4px 6px; border-radius:6px; text-decoration:underline; text-underline-offset:2px; }
  .exit-link:hover{ color:var(--ink); }

  /* ---- Theme switcher ---- */
  .theme-switch{ position:relative; display:flex; align-items:center; }
  .theme-btn{
    width:24px; height:24px; border-radius:50%; border:2px solid var(--surface); box-shadow:0 0 0 1px var(--line);
    background:var(--swatch); cursor:pointer; padding:0; flex:0 0 auto;
  }
  .theme-btn:hover{ box-shadow:0 0 0 1px var(--ink-faint); }
  .theme-pop{
    display:none; position:absolute; top:calc(100% + 8px); right:0; z-index:40;
    background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow);
    padding:10px; gap:8px;
  }
  .theme-pop.open{ display:flex; }
  .theme-pop button{
    width:24px; height:24px; border-radius:50%; border:2px solid var(--surface); box-shadow:0 0 0 1px var(--line);
    cursor:pointer; padding:0;
  }
  .theme-pop button.active{ box-shadow:0 0 0 2px var(--accent); }
  .mode-btn{
    width:24px; height:24px; border-radius:50%; border:none; background:var(--surface-2); color:var(--ink-soft);
    cursor:pointer; padding:0; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .mode-btn svg{ width:14px; height:14px; }
  .mode-btn:hover{ color:var(--ink); }

  .app{ flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; padding:28px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .app.top-align{ align-items:flex-start; }
  .screen{ width:100%; max-width:560px; animation:rise .35s ease both; margin:auto; }
  .screen.wide{ max-width:640px; min-height:100%; display:flex; flex-direction:column; }
  @keyframes rise{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){ .screen{ animation:none; } }

  /* ---- Landing ---- */
  .lede{ text-align:center; margin-bottom:28px; }
  .lede h1{ font-size:2rem; margin-bottom:8px; }
  .lede p{ color:var(--ink-soft); font-size:1rem; max-width:34em; margin:0 auto; }
  .role-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:480px){ .role-grid{ grid-template-columns:1fr; } }
  .role-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px 20px; text-align:left; cursor:pointer; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:10px; transition:transform .15s ease, border-color .15s ease;
  }
  .role-card:hover{ transform:translateY(-2px); border-color:var(--accent); }
  .role-card .icon-badge{ width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; }
  .role-card.teacher .icon-badge{ background:var(--accent-soft); }
  .role-card.student .icon-badge{ background:var(--raise-soft); }
  .role-card .icon-badge svg{ width:20px; height:20px; }
  .role-card h2{ font-size:1.15rem; }
  .role-card p{ margin:0; color:var(--ink-soft); font-size:.9rem; line-height:1.45; }

  /* ---- Cards / forms ---- */
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px; }
  .card h2{ font-size:1.3rem; margin-bottom:4px; }
  .card .sub{ color:var(--ink-soft); font-size:.9rem; margin-bottom:20px; }
  label{ display:block; font-size:.8rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-bottom:6px; }
  .field{ margin-bottom:16px; }
  .field .hint{ font-size:.78rem; color:var(--ink-faint); margin-top:5px; }
  input[type=text]{
    width:100%; font-size:1rem; padding:11px 13px; border-radius:10px;
    border:1.5px solid var(--line); background:var(--bg); color:var(--ink); font-family:inherit;
  }
  input[type=text]:focus{ border-color:var(--accent); }
  input.code-input{ font-family:"Space Mono"; font-size:1.6rem; letter-spacing:.35em; text-align:center; text-transform:uppercase; padding:13px; }
  .btn{
    appearance:none; border:none; border-radius:10px; padding:12px 18px; font-weight:700; font-size:.95rem;
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:transform .1s ease, filter .15s ease;
    width:100%;
  }
  .btn:active{ transform:scale(.98); }
  .btn:disabled{ opacity:.65; cursor:default; }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-raise{ background:var(--raise); color:var(--raise-ink); }
  .btn-raise:hover{ filter:brightness(1.05); }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1.5px solid var(--line); }
  .btn-ghost:hover{ border-color:var(--ink-faint); color:var(--ink); }
  .btn-danger-ghost{ background:transparent; color:var(--danger); border:1.5px solid var(--line); }
  .btn-danger-ghost:hover{ border-color:var(--danger); }
  .link-row{ text-align:center; margin-top:16px; font-size:.87rem; color:var(--ink-soft); }
  .link-row button{ background:none; border:none; color:var(--accent); font-weight:700; cursor:pointer; padding:2px 4px; text-decoration:underline; text-underline-offset:2px; font-size:inherit; }
  .error-box{ display:none; }
  .error-box.show{ display:block; background:#fbeae2; color:var(--danger); border:1px solid var(--danger); border-radius:8px; padding:9px 12px; font-size:.85rem; margin-bottom:14px; }

  /* ---- Teacher board ---- */
  .board-header{ flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; padding-bottom:18px; margin-bottom:18px; border-bottom:1px solid var(--line); }
  .board-title h2{ font-size:1.4rem; }
  .board-title .sub{ color:var(--ink-soft); font-size:.88rem; margin-top:2px; }
  .reopen-toggle{ background:none; border:none; color:var(--ink-faint); font-size:.76rem; cursor:pointer; padding:2px 0; margin-top:4px; text-decoration:underline; text-underline-offset:2px; }
  .reopen-toggle:hover{ color:var(--ink-soft); }
  .reopen-value{ font-family:"Space Mono"; font-size:.8rem; letter-spacing:.06em; background:var(--surface-2); color:var(--ink); padding:3px 8px; border-radius:6px; margin-left:6px; }
  .code-chip{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:8px 8px 8px 16px; box-shadow:var(--shadow); }
  .code-chip .code-label{ font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); }
  .code-chip .code-value{ font-family:"Space Mono"; font-weight:700; font-size:1.4rem; letter-spacing:.18em; color:var(--accent); }
  .icon-btn{ background:var(--surface-2); border:none; border-radius:8px; width:34px; height:34px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft); }
  .icon-btn:hover{ color:var(--ink); }
  .icon-btn svg{ width:16px; height:16px; }

  .queue-scroll{ flex:1 1 auto; min-height:0; overflow-y:auto; padding:2px 2px 2px 16px; margin-left:-16px; }
  .queue-list{ display:flex; flex-direction:column; gap:12px; }
  .empty-state{ text-align:center; padding:60px 20px; color:var(--ink-faint); }
  .empty-state svg{ width:40px; height:40px; margin-bottom:12px; opacity:.5; }
  .empty-state p{ margin:0; font-size:.95rem; }

  .stub{
    position:relative; display:flex; align-items:center; gap:14px;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px 14px 22px; box-shadow:var(--shadow);
  }
  .stub::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:14px;
    background-image: radial-gradient(circle 5px at 0 50%, var(--bg) 5px, transparent 5.5px);
    background-repeat:repeat-y; background-size:14px 17px; transform:translateX(-50%);
  }
  .stub.next{ border-color:var(--raise); background:linear-gradient(0deg, var(--surface), var(--raise-soft) 260%); }
  .stub .num{ font-family:"Space Mono"; font-weight:700; font-size:1.3rem; color:var(--ink-faint); min-width:2ch; text-align:center; }
  .stub.next .num{ color:var(--raise); }
  .stub .who{ flex:1; min-width:0; }
  .stub .who .name{ font-weight:700; font-size:1.02rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stub .who .wait{ font-size:.8rem; color:var(--ink-soft); margin-top:2px; }
  .stub .who .note{ font-size:.78rem; color:var(--ink-soft); margin-top:3px; font-style:italic; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stub .who .note-peek{ background:var(--surface-2); color:var(--ink-soft); border:none; border-radius:6px; padding:2px 8px; font-size:.72rem; font-weight:700; cursor:pointer; margin-top:4px; }
  .stub .who .note-peek:hover{ color:var(--ink); }
  .stub .who .note-hide-again{ background:none; border:none; color:var(--accent); font-size:.72rem; font-weight:700; cursor:pointer; padding:0 0 0 4px; text-decoration:underline; text-underline-offset:2px; }
  .stub .next-badge{ font-size:.68rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--raise-ink); background:var(--raise); padding:3px 8px; border-radius:999px; margin-right:2px; }
  .stub .help-btn{ background:var(--good-soft); color:var(--good); border:none; border-radius:8px; padding:9px 14px; font-weight:700; font-size:.85rem; cursor:pointer; white-space:nowrap; flex:0 0 auto; }
  .stub .help-btn:hover{ filter:brightness(.95); }

  .board-footer{ flex:0 0 auto; padding-top:16px; margin-top:16px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; }
  .board-footer .btn{ width:auto; }

  /* ---- Announcement (teacher composer) ---- */
  .announce-card{ flex:0 0 auto; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; margin-bottom:18px; }
  .announce-card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .announce-card-head h3{ font-family:"Zilla Slab"; font-size:1rem; }
  .announce-status{ font-size:.75rem; color:var(--ink-faint); }
  .announce-live{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; background:var(--accent-soft); border-radius:10px; padding:10px 14px; margin-bottom:12px; }
  .announce-live p{ margin:0; font-size:.92rem; color:var(--ink); }
  .announce-live .meta{ font-size:.72rem; color:var(--ink-soft); margin-top:4px; }
  .announce-live button{ background:none; border:none; color:var(--ink-soft); font-size:.8rem; cursor:pointer; text-decoration:underline; white-space:nowrap; }
  textarea{ width:100%; font-family:inherit; font-size:.92rem; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); resize:vertical; min-height:52px; }
  textarea:focus{ border-color:var(--accent); }
  select{ font-family:inherit; font-size:.85rem; padding:9px 10px; border-radius:8px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); }
  .announce-controls{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center; }
  .announce-controls select{ flex:1 1 180px; min-width:0; }
  .announce-controls input{ padding:9px 10px; text-align:center; min-width:0; }
  .announce-controls .btn{ flex:0 0 auto; }

  /* ---- Announcement (student banner) ---- */
  .announce-banner{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; background:var(--accent-soft); border:1px solid var(--accent); border-radius:12px; padding:12px 16px; margin-bottom:16px; box-shadow:var(--shadow); }
  .announce-banner .announce-text{ font-size:.92rem; color:var(--ink); line-height:1.4; }
  .announce-banner .announce-dismiss{ background:none; border:none; color:var(--ink-soft); font-size:1.25rem; line-height:1; cursor:pointer; padding:0 2px; flex:0 0 auto; }
  .announce-banner .announce-dismiss:hover{ color:var(--ink); }

  /* ---- Student wait ---- */
  .raise-pad{ text-align:center; }
  .raise-pad .meta{ margin-bottom:26px; color:var(--ink-soft); font-size:.92rem; }
  .raise-pad .meta strong{ color:var(--ink); }
  .raise-btn{
    width:230px; height:230px; border-radius:50%; margin:0 auto; border:none; cursor:pointer;
    background:radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--raise) 88%, white), var(--raise));
    color:var(--raise-ink); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    box-shadow:0 14px 30px -12px color-mix(in srgb, var(--raise) 60%, transparent), var(--shadow);
    transition:transform .12s ease;
  }
  .raise-btn:hover{ transform:scale(1.02); }
  .raise-btn:active{ transform:scale(.97); }
  .raise-btn svg{ width:52px; height:52px; }
  .raise-btn .label{ font-family:"Zilla Slab"; font-weight:700; font-size:1.25rem; }
  .kbd-hint{ margin-top:22px; color:var(--ink-faint); font-size:.85rem; }
  kbd{ font-family:"Space Mono"; background:var(--surface-2); border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:2px 8px; font-size:.82rem; }

  /* ---- Student note-to-self ---- */
  .note-toggle{ background:none; border:none; color:var(--accent); font-weight:700; cursor:pointer; padding:4px 2px; font-size:.85rem; text-decoration:underline; text-underline-offset:2px; margin-top:22px; }
  .note-box{ margin-top:12px; text-align:left; }
  .note-box textarea{ min-height:64px; }
  .note-share{ display:flex; align-items:center; gap:7px; margin-top:8px; font-size:.8rem; color:var(--ink-soft); font-weight:500; text-transform:none; letter-spacing:normal; cursor:pointer; }
  .note-share input{ width:15px; height:15px; margin:0; }
  .ticket-note{ margin-top:20px; text-align:left; background:var(--surface-2); border-radius:10px; padding:12px 14px; }
  .ticket-note .k{ font-size:.7rem; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint); margin-bottom:4px; }
  .ticket-note .v-note{ font-size:.88rem; color:var(--ink); line-height:1.4; white-space:pre-wrap; }
  .note-shared-tag{ display:inline-block; margin-top:6px; font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); }

  .ticket{
    background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow);
    padding:32px 26px; text-align:center; position:relative;
  }
  .ticket .eyebrow{ font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-faint); margin-bottom:10px; }
  .ticket .position{ font-family:"Space Mono"; font-weight:700; font-size:4.6rem; line-height:1; color:var(--accent); }
  .ticket .of{ color:var(--ink-soft); font-size:.9rem; margin-top:6px; }
  .ticket .details{ margin-top:26px; display:flex; justify-content:center; gap:28px; padding-top:22px; border-top:2px dashed var(--line); }
  .ticket .detail .k{ font-size:.7rem; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint); margin-bottom:3px; }
  .ticket .detail .v{ font-family:"Space Mono"; font-weight:700; font-size:1.1rem; }
  .ticket .lower-btn{ margin-top:26px; }

  .called-flash{ text-align:center; padding:20px 10px; }
  .called-flash .check{ width:64px; height:64px; border-radius:50%; background:var(--good-soft); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }
  .called-flash .check svg{ width:32px; height:32px; color:var(--good); }
  .called-flash h2{ font-size:1.3rem; color:var(--good); }
  .called-flash p{ color:var(--ink-soft); margin-top:6px; }

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(10px); opacity:0;
    background:var(--ink); color:var(--bg); padding:9px 18px; border-radius:999px; font-size:.85rem; font-weight:600;
    pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---- Phone / narrow-viewport tuning ---- */
  @media (max-width: 480px){
    /* Inputs at 16px stop iOS Safari from zooming in on focus. */
    textarea, select, input[type=text]{ font-size:16px; }
    .app{ padding:18px 16px; }
    .card{ padding:20px; }
    .announce-card{ padding:14px; }
    .announce-controls{ flex-direction:column; align-items:stretch; }
    .announce-controls select, .announce-controls input, .announce-controls .btn{ width:100%; }
    .board-header{ gap:10px; }
    .code-chip{ flex-wrap:wrap; }
    .raise-btn{ width:190px; height:190px; }
    .raise-btn svg{ width:44px; height:44px; }
    .raise-btn .label{ font-size:1.1rem; }
    .ticket .position{ font-size:3.6rem; }
    .ticket .details{ gap:18px; }
    .icon-btn{ width:38px; height:38px; }
    .theme-btn, .mode-btn, .theme-pop button{ width:28px; height:28px; }
  }
</style>
