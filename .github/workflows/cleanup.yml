name: Daily cleanup and usage log

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list what would be deleted'
        default: 'true'

permissions:
  contents: write
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install SDKs
        run: npm install --no-save firebase-admin@12 @google-cloud/monitoring@4

      # Log usage first, so the numbers include data about to be cleaned up.
      - name: Record daily usage
        id: usage
        run: node scripts/usage.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Delete expired data
        run: node scripts/cleanup.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && '1' || '0' }}

      - name: Save usage log to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add usage/usage.csv
          if git diff --cached --quiet; then
            echo "No usage change to commit"
          else
            git commit -m "usage: daily log [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Warn if close to a free limit
        if: steps.usage.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WORST: ${{ steps.usage.outputs.worst }}
        run: |
          TITLE="Usage warning: RaiseMyHand is near a free-plan limit"
          BODY="In the last 24 hours the app used about ${WORST}% of its tightest free Firestore/Hosting limit. See usage/usage.csv. If this keeps happening, it's time to think about a paid plan, donations, or trimming reads."
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
