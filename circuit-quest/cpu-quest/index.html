<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CPU Quest</title><style>:root{
  --bg:#0e1020; --panel:#181b36; --panel2:#232749; --line:#3d4380; --ink:#f3f4fb; --dim:#a4a9d6;
  --accent:#7ef7c1; --accent2:#ffe66d; --bad:#ff6b6b; --good:#7ef7c1; --accent-ink:#06210f;
  --mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,"Courier New",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.55}
body{min-height:100vh;background:
  radial-gradient(1200px 500px at 50% -10%, color-mix(in srgb,var(--accent) 10%,transparent), transparent 60%), var(--bg)}
#app{max-width:980px;margin:0 auto;padding:18px 16px 60px}
h1,h2,h3{font-family:var(--mono);letter-spacing:.02em;margin:0;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
code,.code{font-family:var(--mono);background:#0b0d1c;border:1px solid var(--line);border-radius:5px;padding:.05em .35em;font-size:.92em;color:#cfe;white-space:nowrap}
pre.code{white-space:pre;padding:10px 14px;overflow-x:auto;display:block;margin:8px 0;line-height:1.5}
.m{font-family:var(--mono);color:var(--accent2)}
sub,sup{line-height:0}
.btn{background:var(--panel2);border:3px solid var(--line);border-radius:10px;padding:9px 16px;font-weight:700;box-shadow:0 4px 0 #0007;transition:transform .08s,box-shadow .08s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0007}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.dim{color:var(--dim)}
.chip{display:inline-block;font:700 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--dim)}
.chip.boss{border-color:var(--bad);color:var(--bad)}
.chip.t1{border-color:#5fd3a0;color:#5fd3a0}.chip.t2{border-color:var(--accent2);color:var(--accent2)}.chip.t3{border-color:#ff9f5a;color:#ff9f5a}

/* home */
.hero{padding:26px 0 8px}
.hero h1{font-size:clamp(2rem,6vw,3.2rem);color:var(--accent);text-shadow:0 3px 0 #0008}
.hero p{max-width:60ch;color:var(--dim);margin:8px 0 0}
.hw{margin:14px 0;padding:12px 16px;border:3px dashed var(--accent2);border-radius:12px;background:#2a2610}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin:16px 0}
.stat b{display:block;font:700 1.5rem var(--mono);color:var(--accent2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:10px}
.card{position:relative;background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:14px 16px 14px;display:flex;flex-direction:column;gap:6px;text-align:left;box-shadow:0 5px 0 #0007}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .num{font:800 1.9rem var(--mono);color:var(--accent)}
.card h3{font-size:1.05rem}
.card p{margin:0;color:var(--dim);font-size:.9rem}
.card .meta{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--dim)}
.stars{font-size:1.2rem;letter-spacing:2px;color:#4a4f7a}
.stars .on{color:var(--accent2)}
.diff{display:inline-flex;gap:3px}.diff i{width:9px;height:9px;border-radius:2px;background:#39406e;display:block}.diff i.on{background:#ff9f5a}
.badge-hw{position:absolute;top:-10px;right:12px;background:var(--accent2);color:#2b2300;font:800 .72rem var(--mono);padding:2px 9px;border-radius:999px}
details.tools{margin-top:26px;border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--panel)}
details.tools summary{cursor:pointer;font-weight:700}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.picks label{display:inline-flex;gap:6px;align-items:center;border:2px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
textarea.out{width:100%;min-height:90px;background:#0b0d1c;color:var(--ink);border:2px solid var(--line);border-radius:8px;font:.85rem var(--mono);padding:8px}

/* play */
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.bar h2{font-size:1.1rem}
.bar .lvl{color:var(--accent)}
.hearts{font-size:1.5rem;letter-spacing:3px;color:var(--bad)}
.hearts .lost{color:#3a3f6c}
.score{font:800 1.2rem var(--mono);color:var(--accent2);min-width:5ch;text-align:right}
.combo{font:700 .85rem var(--mono);color:var(--accent);min-height:1.2em}
.stage{border:3px solid var(--line);border-radius:14px;overflow:hidden;background:#070815;margin-bottom:12px;position:relative}
.stage canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.panel{background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:16px 18px}
.q{font-size:1.15rem;margin:6px 0 12px}
.q p{margin:0 0 8px}
.timer{height:8px;border-radius:6px;background:#242850;overflow:hidden;margin:8px 0}
.timer i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transition:background .3s}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:720px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--panel2);border:3px solid var(--line);border-radius:12px;padding:11px 14px;min-height:54px;box-shadow:0 4px 0 #0007}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font:800 .95rem var(--mono);color:var(--accent);border:2px solid var(--line);border-radius:6px;min-width:1.9em;text-align:center;padding:0 4px;margin-top:1px}
.opt.wrong{border-color:var(--bad);background:#3a1a2a;text-decoration:line-through;opacity:.7}
.opt.right{border-color:var(--good);background:#143a30}
.numrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numrow input{font:700 1.4rem var(--mono);width:11ch;background:#0b0d1c;color:var(--accent2);border:3px solid var(--line);border-radius:10px;padding:8px 12px}
.numrow .u{font:700 1.2rem var(--mono);color:var(--dim)}
.given{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.given span{font:700 .95rem var(--mono);background:#0b0d1c;border:2px solid var(--line);border-radius:8px;padding:3px 10px;color:var(--accent2)}
.tray,.slots,.seq{display:flex;gap:8px;flex-wrap:wrap}
.tray{min-height:54px;padding:8px;border:2px dashed var(--line);border-radius:12px;margin-bottom:10px}
.pill{background:var(--panel2);border:3px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:700;box-shadow:0 3px 0 #0007}
.pill.sel{border-color:var(--accent2);background:#3a3512;transform:translateY(-2px)}
.pill.ok{border-color:var(--good)}.pill.no{border-color:var(--bad);background:#3a1a2a}
.slotrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(130px,230px);gap:10px;align-items:center;margin:6px 0}
.slot{min-height:46px;border:3px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:4px;background:#0b0d1c}
.slot.over{border-color:var(--accent2)}
.slot .pill{box-shadow:none}
.sortcard{font:800 clamp(1rem,5vw,1.5rem) var(--mono);text-align:center;padding:18px 10px;border:3px solid var(--accent);border-radius:14px;background:#0b0d1c;margin:8px 0 12px;min-height:80px;display:flex;align-items:center;justify-content:center;white-space:pre-wrap;word-break:break-word;font-size:clamp(1rem,5vw,1.5rem)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.sortprog{display:flex;gap:5px;margin-bottom:6px}.sortprog i{flex:1;height:7px;border-radius:4px;background:#2b3060}.sortprog i.d{background:var(--accent)}
.wire{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px clamp(28px,12vw,90px);margin:10px 0}
.wire svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.wire .col{display:flex;flex-direction:column;gap:10px;z-index:1}
.wire .pill{text-align:left}
.reg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.bit{display:flex;flex-direction:column;align-items:center;gap:4px}
.bit button{width:56px;height:62px;font:800 1.7rem var(--mono);border-radius:10px;border:3px solid var(--line);background:#0b0d1c;color:#5a6296;box-shadow:0 4px 0 #0007}
.bit button.on{background:var(--accent2);color:#2b2300;border-color:var(--accent2)}
.bit button.bad{border-color:var(--bad)}
.bit small{font:700 .72rem var(--mono);color:var(--dim)}
.regread{text-align:center;font:700 1rem var(--mono);color:var(--dim)}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;border:3px solid;font-size:1rem}
.fb.good{border-color:var(--good);background:#10332b}
.fb.bad{border-color:var(--bad);background:#361a28}
.fb.info{border-color:var(--accent2);background:#2a2610}
.fb b.t{display:block;font:800 .8rem var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.prog{display:flex;gap:6px;margin:0 0 10px}
.prog i{flex:1;height:10px;border-radius:5px;background:#2b3060}.prog i.d{background:var(--accent)}.prog i.c{background:var(--accent2)}.prog i.b{background:#ff9f5a}
.concept{margin:0 0 12px;padding:10px 14px;border-left:5px solid var(--accent);background:#10152e;border-radius:0 10px 10px 0;color:var(--dim);font-size:.98rem}
.concept b{color:var(--ink)}
/* results */
.res{text-align:center;padding:24px 16px}
.res h2{font-size:2rem}
.res .big{font-size:3rem;letter-spacing:6px;margin:8px 0}
.res table{margin:12px auto;border-collapse:collapse;text-align:left}
.res td{padding:4px 14px;border-bottom:1px solid var(--line)}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pop{animation:pop .3s}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sr{position:absolute;left:-9999px}

.seg{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.tr{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin:8px 0 12px}
.trow{background:#0b0d1c;border:2px solid var(--line);border-radius:10px;padding:7px 12px}
.trow .rt{display:block;font:700 .85rem var(--mono);color:var(--accent2)}
.trow .kt{display:block;font-size:.95rem}
details.real{margin-top:8px}
details.real summary{cursor:pointer;color:var(--dim)}
.card .chip{align-self:flex-start}

/* ---- keyboard + lessons ---- */
.kfocus{outline:3px dashed var(--accent2);outline-offset:3px}
.opt.kfocus{border-color:var(--accent2);background:#2a2f5e}
.slot.kfocus{border-color:var(--accent2)}
.keyhint,.keyline{margin-top:12px;font:700 .82rem var(--mono);color:var(--dim);letter-spacing:.02em}
.kcap{display:block;font:800 .78rem var(--mono);color:var(--accent);margin-bottom:2px}
.buckets .btn{display:flex;flex-direction:column;align-items:center;gap:2px}
.lesson .ltitle{font-size:1.25rem;margin:10px 0 8px;color:var(--accent2)}
.lbody p{margin:0 0 .75em}
.lbody ul,.lbody ol{margin:.3em 0 .8em;padding-left:1.3em}
.lbody li{margin:.2em 0}
.formula{margin:.7em 0;padding:10px 14px;background:#0b0d1c;border:2px solid var(--accent);border-radius:10px;font:700 1.05rem var(--mono);color:var(--accent2);text-align:center;overflow-x:auto}
.example{margin:.8em 0;padding:10px 14px;background:#10152e;border-left:5px solid var(--accent2);border-radius:0 10px 10px 0}
.example b.eh{display:block;color:var(--accent2);font:800 .78rem var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.trap{margin:.8em 0;padding:10px 14px;background:#2a1626;border-left:5px solid var(--bad);border-radius:0 10px 10px 0}
.trap b.eh{display:block;color:var(--bad);font:800 .78rem var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.anabox{border-left-color:#4aa3ff}
details.review{margin:0 0 10px;border:2px dashed var(--line);border-radius:10px;padding:6px 12px}
details.review summary{cursor:pointer;font-weight:700;color:var(--dim)}

/* ---- workshop (lab) ---- */
.labwrap{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.labteach{background:#0f1230;border:1px solid var(--line);border-left:5px solid var(--accent2);border-radius:10px;padding:10px 14px;font-size:.95rem}
.labteach .eh,.coach b{display:block;font:800 .7rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent2);margin-bottom:2px}
.labteach p{margin:.3em 0}
.lab{position:relative;width:100%;max-width:640px;margin:0 auto;border:3px solid var(--line);border-radius:14px;overflow:hidden;container-type:inline-size;
  background:linear-gradient(#0b0d1c88,#0b0d1c88),repeating-linear-gradient(0deg,transparent 0 calc(100%/var(--rows) - 1px),#ffffff0d calc(100%/var(--rows) - 1px) calc(100%/var(--rows))),repeating-linear-gradient(90deg,transparent 0 calc(100%/var(--cols) - 1px),#ffffff0d calc(100%/var(--cols) - 1px) calc(100%/var(--cols))),#12142b}
.lab.won{border-color:var(--good);box-shadow:0 0 24px #7ef7c155}
.labwires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.labwires polyline{fill:none;stroke:#4a528f;stroke-width:.09;stroke-linecap:round;stroke-linejoin:round}
.lab.live .labwires polyline{stroke:var(--accent2);filter:drop-shadow(0 0 .08px var(--accent2));stroke-dasharray:.35 .25;animation:labflow .7s linear infinite}
@keyframes labflow{to{stroke-dashoffset:-.6}}
@media (prefers-reduced-motion:reduce){.lab.live .labwires polyline{animation:none;stroke-dasharray:none}}
.ent{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2%;border-radius:10px;font-size:max(9px,2.15cqw);line-height:1.1;text-align:center;color:var(--ink);cursor:pointer}
.ent .gly{width:78%;height:auto;color:var(--dim)}
.ent b{font:800 1em var(--mono);white-space:nowrap}
.ent small{font:600 .85em var(--mono);color:var(--dim);white-space:nowrap}
.ent.bin{background:#2a2447;border:2px solid #5a4d9a;color:#d9ccff}
.ent.bin .gly{color:#b9a8ff}
.ent.socket{border:2px dashed var(--accent2);background:#ffe66d12}
.ent.socket.full{border-style:solid;background:#ffe66d22}
.ent.socket .gly{color:var(--accent2)}
.ent.socket .q{font-size:1.6em;color:var(--accent2)}
.ent.fixed{background:#18305a;border:2px solid #3f6fc4}
.ent.fixed .gly{color:#8fb8ff}
.ent.fixed.k-LED .gly{color:#ff9fb3}.ent.fixed.k-BULB .gly{color:#ffe66d}
.ent.lever{background:#3a1d2c;border:2px solid #d4546e}
.ent.lever i{display:block;width:16%;height:38%;background:#ff6b8a;border-radius:4px;transform:rotate(-24deg);margin-bottom:4%}
.ent.target{outline:3px solid var(--accent);outline-offset:-1px;z-index:2}
.me{position:absolute;transition:left .11s linear,top .11s linear;z-index:3;pointer-events:none;display:flex;align-items:center;justify-content:center}
@media (prefers-reduced-motion:reduce){.me{transition:none}}
.me .body{width:46%;height:70%;background:linear-gradient(#ffcf8a 0 38%,#ff7b54 38% 100%);border:2px solid #0008;border-radius:6px 6px 4px 4px;position:relative}
.me .body::before,.me .body::after{content:"";position:absolute;top:18%;width:14%;height:14%;background:#1a1228;border-radius:50%}
.me .body::before{left:24%}.me .body::after{right:24%}
.me.f-u .body::before,.me.f-u .body::after{display:none}
.me.f-l .body::after{display:none}.me.f-r .body::before{display:none}
.me .carry{position:absolute;bottom:78%;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;background:#2a2447;border:2px solid #b9a8ff;border-radius:7px;padding:1px 5px;font-size:max(8px,1.9cqw);color:#d9ccff;white-space:nowrap}
.me .carry:empty{display:none}
.me .carry .gly{width:2.6em;height:auto;color:#b9a8ff}.me .carry b{font:800 1em var(--mono)}
.facemark{position:absolute;border:2px dashed #7ef7c155;border-radius:8px;pointer-events:none;opacity:0}
.facemark.on{opacity:1}
.labtip{font:700 .85rem var(--mono);color:var(--accent);min-height:1.4em;text-align:center}
.labmeters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.meter{background:#0b0d1c;border:2px solid var(--line);border-radius:10px;padding:4px 12px;min-width:7.5em;text-align:center}
.meter small{display:block;font:700 .68rem var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.meter b{font:800 1.15rem var(--mono)}
.meter.good{border-color:var(--good);color:var(--good)}.meter.bad{border-color:var(--bad);color:var(--bad)}
.labnote{background:#0f1230;border-radius:10px;padding:8px 14px;font-size:.95rem;min-height:2.6em}
.labnote .coach{margin-top:6px;color:var(--accent2)}.labnote .coach b{display:inline;margin:0 6px 0 0}
.labpad{display:none;grid-template-columns:repeat(4,1fr);gap:6px}
.labpad button{padding:12px 0;border-radius:10px;border:2px solid var(--line);background:#232749;font-weight:800}
.labpad .act{grid-column:span 2}
@media (pointer:coarse){.labpad{display:grid}}

/* ---- analogy switch, always on screen ---- */
#app{padding-top:58px}
.anabtn{position:fixed;top:10px;right:12px;z-index:50;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:#181b36ee;color:var(--ink);font:800 .8rem var(--mono);letter-spacing:.04em;box-shadow:0 3px 0 #0007;backdrop-filter:blur(4px)}
.anabtn[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.anabtn:hover{background:#232749}
.ana-off .anaonly{display:none!important}
.q code,.labteach code,.labnote code,.lbody code,.fb code{white-space:normal;overflow-wrap:anywhere}

.hubbtn{position:fixed;top:10px;left:12px;z-index:50;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:#181b36ee;color:var(--ink);font:800 .8rem var(--mono);letter-spacing:.04em;text-decoration:none;box-shadow:0 3px 0 #0007}

:root{--accent:#ffb454}</style></head><body><main id="app"></main><script>const ANA_L = {"1": {"key": "The first computers were like a factory that filled a whole warehouse. Then someone built a tiny workshop on a cart. Today's graphics chips are giant plants with thousands of workers. This class teaches you to design one good factory. Once you get one, the giant plants are just copies.", "map": [["DYSEAC (1954)", "A factory that needed two trucks to move."], ["Intel 4004", "A workshop on a cart."], ["Modern GPU", "A plant with thousands of workers."], ["This class's MIPS core", "One simple, well-run factory."]]}, "2": {"key": "The ISA is the factory's job catalog. MIPS is strict: every work order has three lines. Line 1 says where the result goes. Lines 2 and 3 name the two parts bins to use. Workers only touch parts in the 32 bins at their station. Each bin has a job.", "map": [["ISA", "The job catalog."], ["Register", "One parts bin."], ["<code>$a0</code>-<code>$a3</code>", "Bins for parts handed in."], ["<code>$t0</code>-<code>$t7</code>", "Scratch bins. Anyone can empty them."], ["<code>$s0</code>-<code>$s7</code>", "Borrowed bins. Put things back as you found them."], ["<code>$zero</code>", "A bin that always holds a zero."], ["<code>$ra</code>", "A note: where to go back to."]]}, "3": {"key": "Bins are small and fast. The warehouse is huge and far away. Workers can only build with parts in a bin. So <code>lw</code> means bring a part from the warehouse to a bin, and <code>sw</code> means send it back. A full part needs four warehouse slots in a row. So the next part is 4 slots over, not 1.", "map": [["<code>lw</code>", "Bring a part from the warehouse to a bin."], ["<code>sw</code>", "Send a part back."], ["Byte", "One warehouse slot."], ["Word", "One full part. It takes 4 slots."], ["Address", "The slot number."], ["Index &times; 4", "How many slots to walk to part number k."]]}, "4": {"key": "<code>addi</code> is an order with the amount printed on it, so nobody walks to a bin to look it up. <code>sll</code> is the speed trick: slide the digits left. Sliding once doubles a number. Slide twice and you have multiplied by 4, exactly how far you walk down the warehouse shelf. <code>and</code>, <code>or</code> and <code>nor</code> work like stencils.", "map": [["<code>addi</code>", "An order with the number printed on it."], ["<code>sll</code>", "Slide digits left. Each slide doubles."], ["<code>srl</code>", "Slide digits right. Each slide halves."], ["<code>and</code>", "A switch stays on only if it is on in both bins."], ["<code>or</code>", "A switch stays on if it is on in either bin."], ["<code>nor</code> with <code>$zero</code>", "Flip every switch."]]}, "5": {"key": "Normally the factory works through orders top to bottom. A branch order says: if these two bins match, skip ahead to order X. That is all an if-statement or a loop is. <code>j</code> always skips. There are only three order forms. R names three bins. I names two bins and a number. J is just a destination.", "map": [["<code>beq</code>", "If the bins match, skip to order X."], ["<code>bne</code>", "If they do not match, skip."], ["<code>j</code>", "Skip, no questions asked."], ["Label", "A bookmark on an order."], ["R / I / J type", "The three order forms."]]}, "6": {"key": "<code>slt</code> asks: is bin A smaller than bin B? It writes 1 for yes, 0 for no. <code>jal</code> means go build this sub-assembly, and leave a note saying where to come back. <code>$ra</code> is that note. If the sub-assembly starts another one, the new note covers the old one. The fix is the stack, a pile of trays. Park your note on the pile first, then take it back.", "map": [["<code>slt</code>", "Is A smaller than B? Write 1 or 0."], ["<code>jal</code>", "Go build this, leave a note to return."], ["<code>jr $ra</code>", "Go back to the note."], ["Stack", "A pile of trays. Top only."], ["<code>$sp</code>", "A finger on the top tray."], ["Push / pop", "Add a tray / remove one."]]}, "7": {"key": "Two workers can do the same job differently. One recalculates the shelf spot every time (array). The other keeps a finger on the current shelf and slides it along (pointer). To compare factories fairly, count time: orders times ticks per order times length of one tick. Amdahl's Law is the reality check. If painting is 90% of the work, hiring 100 painters still leaves the other 10%.", "map": [["Instruction count", "How many orders."], ["CPI", "Whistle blasts per order."], ["Clock cycle time", "Time between blasts."], ["CPU time", "Total time for the whole stack."], ["Amdahl's Law", "The slow step you did not touch caps your speedup."]]}, "8": {"key": "Orders per second is not a fair way to compare factories. One makes bolts and another makes engines. Fair comparison uses average ticks per order, counted by how often each order type shows up. Then multiply by the tick length. A faster way to make one part sounds great. But if the whistle has to slow down 15%, every order gets slower and you lose.", "map": [["MIPS (the metric)", "Orders per second. Ignores order size."], ["Instruction mix", "How often each order type comes in."], ["Weighted CPI", "Average ticks per order."], ["Slower clock", "A longer tick that slows everything."], ["Speedup", "Old time divided by new time."]]}, "9": {"key": "Every order must end up in the one language the machines read: 32 ones and zeros. Think of three versions of one order. Plain English is C code. The shorthand on the ticket is assembly. The barcode the machines scan is machine code. The barcode has fixed boxes: which job, which bins, which number.", "map": [["C code", "The order in plain English."], ["Assembly", "Shorthand on the ticket."], ["Machine code", "The barcode."], ["<code>op</code> / <code>funct</code>", "Boxes for which job."], ["<code>rs</code> / <code>rt</code> / <code>rd</code>", "Boxes naming the bins."], ["SAD", "Add up how different two parts are."]]}, "10": {"key": "The datapath is the factory floor plan: a few standard stations joined by conveyor belts. There is the order board, a clipboard for the next order, the 32 bins, the robot arm, the warehouse, and a stretcher that widens a small number. Every order uses the same floor plan. Single-cycle means one worker finishes a whole order before the next starts.", "map": [["Instruction memory", "The order board."], ["PC", "The clipboard."], ["Adder (+4)", "Moves the clipboard to the next order."], ["Register file", "The 32 bins."], ["ALU", "The robot arm."], ["Data memory", "The warehouse."], ["Sign-extend", "Widen a number to fit."]]}, "11": {"key": "The foreman (control unit) reads each order and flips a row of switches so every station does the right thing for that order. An add needs one pattern. A warehouse fetch needs another. The robot arm gets a two-step instruction: a rough hint from the foreman, then a helper reads the order's function box for the exact move.", "map": [["Control unit", "The foreman."], ["Control signal", "One switch."], ["<code>RegDst</code>", "Which bin gets the result."], ["<code>ALUSrc</code>", "Second part from a bin or from the order."], ["<code>MemtoReg</code>", "Result from the arm or the warehouse."], ["<code>ALUOp</code>", "The foreman's rough hint."], ["Stuck-at fault", "A switch jammed on or off."]]}, "12": {"key": "In a single-cycle factory, the whistle blows at the same rate for every order. So it must be slow enough for the slowest one. A bolt takes seconds, an engine takes an hour, so every bolt waits an hour. To find the tick length, trace the longest path through the stations and add up the times. That path is the critical path.", "map": [["Critical path", "The longest route through the stations."], ["Clock cycle time", "Time between whistles."], ["Component delay", "How long one station takes."], ["Pipelining (preview)", "Split the work so each tick is shorter."]]}, "15": {"key": "Turn the factory into an assembly line with five stations. Grab the order (IF). Read it and fetch parts (ID). Build (EX). Visit the warehouse (MEM). Drop the result in a bin (WB). Trays between stations hold the job for one tick. Now five cars are in progress at once. One car still takes five steps. But once the line is full, a finished car rolls out every tick.", "map": [["IF", "Grab the order."], ["ID", "Read it, fetch parts."], ["EX", "Build."], ["MEM", "Visit the warehouse."], ["WB", "Drop the result in a bin."], ["Pipeline register", "The tray between stations."], ["Latency", "One car start to finish. Does not shrink."], ["Throughput", "Cars finished per tick. Improves."]]}, "16": {"key": "An assembly line is only as good as its hand-offs. Three kinds of jam can happen. Structural: two stations need the same machine at once. Data: a station needs a part the one ahead has not finished. Control: an order says maybe switch models, but the line already started the next car. WAR and WAW jams cannot happen here. Everyone reads at station 2 and writes at station 5, in order.", "map": [["Structural hazard", "Two stations, one machine."], ["Data hazard (RAW)", "A part is not finished yet."], ["Control hazard", "Started the wrong car before the branch was decided."], ["WAR / WAW", "Cannot happen. No cutting in line."], ["<code>nop</code>", "A do-nothing slot that gives the part time."]]}, "17": {"key": "This is practice, and the question never changes. When is the part ready, and when does the next station need it? If it is needed first, someone waits. Bins refill at the start of a tick and get read at the end, so a same-tick hand-off still works. The nasty case is a part from the warehouse (<code>lw</code>). It arrives too late even for a sideways hand-off. One wait tick is unavoidable.", "map": [["RAW hazard", "Needs a part before it is made."], ["Stale value", "The old part still in the bin."], ["Write first half, read second half", "Refill at the start of a tick, read at the end."], ["Load-use hazard", "A warehouse part arrives too late."], ["Stall", "Everyone behind waits a tick."]]}, "18": {"key": "Instead of waiting for a finished part to reach a bin, the station ahead hands it sideways to the next station. A small helper watches the trays and decides where each part comes from: the bin (0), the tray just ahead (1), or the tray two ahead (2). If two trays hold the same part, take the freshest one. No waiting, and no do-nothing slots.", "map": [["Forwarding unit", "A helper watching the trays."], ["Mux value 0", "Take it from the bin."], ["Mux value 1", "Take it from the tray just ahead."], ["Mux value 2", "Take it from the tray two ahead."], ["Priority rule", "The freshest wins."]]}, "19": {"key": "Passing sideways fixes almost everything, but not a warehouse part. It arrives one station too late, and you cannot hand over something that does not exist yet. So a supervisor (the hazard detection unit) watches for that case. When she spots it, she calls freeze for one tick. The order board stops, and an empty slot (a bubble) slides down the line.", "map": [["Hazard detection unit", "The supervisor."], ["Stall", "Freeze for one tick."], ["Bubble", "An empty slot on the line."], ["Compiler <code>nop</code>", "A permanent do-nothing order."], ["Hardware stall", "A pause only when needed."]]}, "20": {"key": "A branch order is a fork: maybe build model X instead. But the line already started the next car before anyone knew. The later you decide, the more wrong cars you scrap. Deciding at station 4 scraps 3. Station 3 scraps 2. Station 2 scraps 1. So decide early. The catch: the bins being compared must already be filled.", "map": [["Branch", "A fork in the line."], ["Flush", "Scrap a car started the wrong way."], ["Resolved in MEM / EX / ID", "Decide at station 4 / 3 / 2. Scrap 3 / 2 / 1."], ["Early compare", "New risk: the numbers may not be ready."]]}, "21": {"key": "When a branch is taken, the line normally scraps the one car it started behind it. That wastes a slot. A delay slot says: do not waste it. Put a job there that has to happen either way, like cleaning a machine. The planner (compiler) picks a job that does not depend on the branch. A flag tells the line not to scrap it.", "map": [["Delay slot", "A slot used for a job needed either way."], ["Compiler's job", "Pick a job that does not depend on the branch."], ["Slot flag", "Tells the line not to scrap it."], ["Flush", "Scrapping the wrongly started car."]]}, "22": {"key": "Two questions answer everything. When is the part ready, and when does the next station need it? The gap is the number of waiting ticks. A store then a fetch from the same shelf is fine. A fetch then a store that needs it is a one-tick wait. A jump that needs a note fetched from the warehouse is worst: wait a tick, then scrap the car started behind the jump.", "map": [["Ready versus needed", "When the part arrives versus when it is wanted."], ["Stall", "Wait one tick."], ["Flush", "Scrap the wrong car."], ["<code>lw $ra</code> then <code>jr $ra</code>", "1 wait plus 1 scrap."]]}};
/* ===== Shared game kit: level select, challenge runner, scoring, progress ===== */
const Kit = (() => {
  const TEST = /[?&]test\b/.test(location.search);
  const $ = (s, r) => (r || document).querySelector(s);
  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (k === 'class') e.className = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
    return e;
  }
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const fmt = (x, d = 3) => { const r = Number(x.toFixed(d)); return String(r); };

  let cfg, S, appEl, run = null;
  const TIER_PTS = { 1: 100, 2: 150, 3: 250 };

  /* ---------- storage ---------- */
  const key = () => 'studygame_' + cfg.id;
  function load() { try { return JSON.parse(localStorage.getItem(key())) || {}; } catch (e) { return {}; } }
  function save() { try { localStorage.setItem(key(), JSON.stringify(S)); } catch (e) {} }

  /* ---------- sound ---------- */
  let AC = null;
  function beep(freq, dur, type, vol) {
    if (S.mute) return;
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type || 'square'; o.frequency.value = freq; g.gain.value = vol || 0.05;
      o.connect(g); g.connect(AC.destination); o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
      o.stop(AC.currentTime + dur);
    } catch (e) {}
  }
  const sfx = {
    good() { beep(660, .09); setTimeout(() => beep(880, .12), 80); },
    bad() { beep(160, .25, 'sawtooth', .06); },
    win() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, .18), i * 110)); },
    lose() { [300, 240, 180].forEach((f, i) => setTimeout(() => beep(f, .25, 'sawtooth'), i * 160)); },
  };

  const skin = () => cfg.skin(!!S.ana);
  const lvTitle = l => (S.ana && l.ana && l.ana.title) ? l.ana.title : l.topic;
  /* ---------- helpers ---------- */
  function hwList() {
    const m = /hw=([\d,]+)/.exec(location.hash);
    return m ? m[1].split(',').map(Number).filter(Boolean) : [];
  }
  function parseNum(s) {
    s = String(s).trim().replace(/,/g, '').replace(/[×x]/g, '*');
    if (/^-?\d*\.?\d+\s*\/\s*-?\d*\.?\d+$/.test(s)) { const [a, b] = s.split('/'); return parseFloat(a) / parseFloat(b); }
    if (!/^-?\d*\.?\d+(e-?\d+)?$/i.test(s)) return NaN;
    return parseFloat(s);
  }
  function starsHtml(n) { return '<span class="stars" aria-label="' + n + ' of 3 stars">' + [1, 2, 3].map(i => '<span class="' + (i <= n ? 'on' : '') + '">★</span>').join('') + '</span>'; }
  function diffDots(level) {
    const d = level.diff || 1;
    return h('span', { class: 'diff', role: 'img', title: 'Difficulty ' + d + ' of 5', 'aria-label': 'Difficulty ' + d + ' of 5' }, [1, 2, 3, 4, 5].map(i => h('i', { class: i <= d ? 'on' : '' })));
  }

  /* ---------- keyboard: WASD / arrows everywhere ---------- */
  const DIR = { ArrowUp: 'u', w: 'u', W: 'u', ArrowDown: 'd', s: 'd', S: 'd', ArrowLeft: 'l', a: 'l', A: 'l', ArrowRight: 'r', d: 'r', D: 'r' };
  function focusables() { return [...appEl.querySelectorAll('button:not([disabled]):not([tabindex="-1"]), summary, input:not([disabled]), textarea')].filter(el => el.offsetParent !== null); }
  function moveFocus(dir) {
    const list = focusables(); if (!list.length) return false;
    const cur = document.activeElement && list.includes(document.activeElement) ? document.activeElement : null;
    if (!cur) { list[0].focus(); return true; }
    const r0 = cur.getBoundingClientRect(), cx = r0.left + r0.width / 2, cy = r0.top + r0.height / 2;
    let best = null, bd = 1e9;
    for (const el of list) {
      if (el === cur) continue;
      const r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2, dx = x - cx, dy = y - cy;
      const ok = dir === 'u' ? dy < -4 : dir === 'd' ? dy > 4 : dir === 'l' ? dx < -4 : dx > 4;
      if (!ok) continue;
      const along = dir === 'u' || dir === 'd' ? Math.abs(dy) : Math.abs(dx), across = dir === 'u' || dir === 'd' ? Math.abs(dx) : Math.abs(dy);
      const d = along + across * 2.2;
      if (d < bd) { bd = d; best = el; }
    }
    if (best) { best.focus(); best.scrollIntoView({ block: 'nearest' }); return true; }
    return false;
  }
  function typing(e) { const t = e.target; return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT'); }
  document.addEventListener('keydown', e => {
    if (!appEl || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target && e.target.id === 'anaBtn') return;
    if (!typing(e) && (e.key === 'n' || e.key === 'N')) { e.preventDefault(); setAna(!S.ana); return; }
    if (typing(e)) { if (e.key === 'Escape') e.target.blur(); return; }
    const dir = DIR[e.key];
    if (run && !run.done) {
      if (run.mode === 'lesson') {
        if (e.key === 'Enter' || e.key === ' ' || dir === 'r') { e.preventDefault(); const g = $('#go'); if (g) g.click(); return; }
        if (e.key === 'Escape') { e.preventDefault(); leave(); return; }
        return;
      }
      if (e.key === 'Escape') { e.preventDefault(); leave(); return; }
      if (run.mode === 'chal' && !run.answered) {
        if ((e.key === 'h' || e.key === 'H')) { const hb = $('#hintbtn'); if (hb && !hb.disabled) { e.preventDefault(); hb.click(); } return; }
        if ((e.key === 'l' || e.key === 'L') && !dir) { const d = $('#reviewlesson'); if (d) { e.preventDefault(); d.open = !d.open; } return; }
        if (run.b && run.b.key && run.b.key(e, dir)) { e.preventDefault(); return; }
        return;
      }
      if (run.answered) {
        if (e.key === 'Enter' || e.key === ' ' || dir === 'r') { const nb = $('#nextbtn'); if (nb) { e.preventDefault(); nb.click(); } return; }
      }
    }
    if (run && run.done) {
      if (e.key === 'Escape') { e.preventDefault(); home(); return; }
      if (dir) { if (moveFocus(dir)) e.preventDefault(); return; }
      return;
    }
    if (dir && !e.shiftKey) { if (moveFocus(dir)) e.preventDefault(); }
  });
  function leave() { if (!TEST && run && !run.done && !confirm('Leave this level? Progress in this run is lost.')) return; home(); }

  /* ---------- home / level select ---------- */
  function home() {
    stopRun();
    document.title = cfg.title;
    const hw = hwList();
    const doneAll = cfg.levels.filter(l => (S.levels[l.n] || {}).done).length;
    const totalStars = cfg.levels.reduce((a, l) => a + ((S.levels[l.n] || {}).stars || 0), 0);
    const totalScore = cfg.levels.reduce((a, l) => a + ((S.levels[l.n] || {}).best || 0), 0);
    appEl.replaceChildren();
    const hero = h('div', { class: 'hero' }, h('h1', null, cfg.title), h('p', null, skin().tagline));
    appEl.append(hero);
    if (hw.length) {
      const doneHw = hw.filter(n => (S.levels[n] || {}).done).length;
      appEl.append(h('div', { class: 'hw', role: 'status' }, h('b', null, 'Assigned: levels ' + hw.join(' and ') + '.'), ' ', doneHw + ' of ' + hw.length + ' complete.'));
    }
    appEl.append(h('div', { class: 'stats' },
      h('div', { class: 'stat' }, h('b', null, doneAll + '/' + cfg.levels.length), 'levels cleared'),
      h('div', { class: 'stat' }, h('b', null, totalStars + '/' + cfg.levels.length * 3), 'stars'),
      h('div', { class: 'stat' }, h('b', null, totalScore), 'total best score')));
    const seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Analogy mode' },
      h('span', { class: 'dim' }, 'Analogy mode:'),
      h('button', { class: 'btn' + (S.ana ? ' primary' : ''), 'aria-pressed': S.ana ? 'true' : 'false', onclick: () => setAna(true) }, 'On: ' + cfg.modes.on),
      h('button', { class: 'btn' + (!S.ana ? ' primary' : ''), 'aria-pressed': !S.ana ? 'true' : 'false', onclick: () => setAna(false) }, 'Off: ' + cfg.modes.off));
    appEl.append(seg);
    appEl.append(h('div', { class: 'row', style: 'margin-top:10px' },
      h('label', { class: 'row' }, h('input', { type: 'checkbox', checked: !!S.calm, onchange: e => { S.calm = e.target.checked; save(); } }), cfg.timer ? ' Calm mode (no timers)' : ' Calm mode'),
      h('label', { class: 'row' }, h('input', { type: 'checkbox', checked: !!S.mute, onchange: e => { S.mute = e.target.checked; save(); } }), ' Mute sound')));
    const grid = h('div', { class: 'grid', role: 'list' });
    for (const l of cfg.levels) {
      const p = S.levels[l.n] || {};
      const c = h('button', { class: 'card', role: 'listitem', onclick: () => start(l), 'aria-label': 'Level ' + l.n + ': ' + lvTitle(l) + (p.done ? ', cleared, ' + p.stars + ' stars' : '') },
        hw.includes(l.n) ? h('span', { class: 'badge-hw' }, 'ASSIGNED') : null,
        h('div', { class: 'num' }, String(l.n).padStart(2, '0')),
        h('h3', null, lvTitle(l)),
        S.ana && l.ana ? h('p', null, h('b', null, 'Topic: '), l.topic) : null,
        h('p', null, S.ana && l.ana ? l.ana.mission : l.blurb),
        l.lec ? h('div', { class: 'chip' }, 'Lecture ' + l.lec) : null,
        h('div', { class: 'meta' }, diffDots(l), h('span', { class: 'sp' }), h('span', { html: starsHtml(p.stars || 0) }), p.best ? h('span', null, p.best + ' pts') : h('span', null, l.chals.length + ' challenges')));
      grid.append(c);
    }
    appEl.append(h('p', { class: 'dim keyline' }, 'Move with W A S D or the arrow keys. Enter or Space opens a level.'));
    appEl.append(grid);

    // teacher / progress tools
    const picks = h('div', { class: 'picks' });
    const out = h('textarea', { class: 'out', readonly: true, 'aria-label': 'Assignment link' });
    function upd() {
      const sel = [...picks.querySelectorAll('input:checked')].map(i => i.value);
      out.value = sel.length ? location.href.split('#')[0] + '#hw=' + sel.join(',') : '';
    }
    cfg.levels.forEach(l => picks.append(h('label', null, h('input', { type: 'checkbox', value: l.n, onchange: upd }), 'Level ' + l.n)));
    const rep = h('textarea', { class: 'out', readonly: true, 'aria-label': 'Progress report' });
    function report() {
      rep.value = cfg.title + ' progress\n' + cfg.levels.map(l => { const p = S.levels[l.n] || {}; return 'Level ' + l.n + ' (' + l.topic + '): ' + (p.done ? p.stars + ' stars, best ' + p.best + ' pts, ' + p.plays + ' plays' : 'not cleared'); }).join('\n');
      rep.select();
    }
    appEl.append(h('details', { class: 'tools' }, h('summary', null, 'Assign levels and progress report'),
      h('p', { class: 'dim' }, 'Pick levels to assign. The link below opens this game with those levels highlighted as homework. It only works for students once the file is hosted somewhere they can reach.'),
      picks, out,
      h('p', null, h('button', { class: 'btn', onclick: report }, 'Show my progress report')), rep,
      h('p', null, h('button', { class: 'btn ghost', onclick: () => { if (confirm('Erase all saved progress on this device?')) { S.levels = {}; save(); home(); } } }, 'Reset progress'))));
    window.scrollTo(0, 0);
    if (!TEST) { const cards = [...grid.querySelectorAll('button.card')]; const nxt = cfg.levels.findIndex(l => !(S.levels[l.n] || {}).done); (cards[nxt < 0 ? 0 : nxt] || cards[0]).focus({ preventScroll: true }); }
  }

  /* ---------- run lifecycle ---------- */
  function stopRun() {
    if (run) { clearInterval(run.tick); if (run.stage && run.stage.destroy) run.stage.destroy(); run = null; }
  }

  function start(level) {
    stopRun();
    document.title = 'Level ' + level.n + ' · ' + cfg.title;

        if (done || run.answered) return;

      autoWrong() { const combos = enumerate(); const bad = combos.find(x => !s.model(x).ok); Object.assign(placed, bad || {}); paint(); b.check(); },
      lab: { cols, rows, ents, pos: () => pos, face: () => face, carry: () => carry, placed: () => placed },

      rec(0, {}); return out;
    }
    function solve() { const ok = enumerate().find(x => s.model(x).ok); if (ok) Object.assign(placed, ok); carry = null; }
    return b;
  };

/* CPU Quest: level content. Every challenge is grounded in the computer-organization lecture guide. */
const { rnd, pick, fmt, shuffle } = Kit;
const pre = s => '<pre class="code">' + s + '</pre>';
const REGN = { t: 8, s: 16, a: 4, v: 2 };
const bin = (v, n) => v.toString(2).padStart(n, '0');

// generator for pipeline-cycle questions: 5-stage pipeline, full forwarding, hardware load-use stall
function codeGen(force) {
  for (;;) {
    const regs = ['$1', '$2', '$3', '$4', '$5', '$6'];
    const n = rnd(4, 6), ins = [];
    for (let i = 0; i < n; i++) {
      const k = Math.random() < 0.4 ? 'lw' : pick(['add', 'sub', 'and']);
      const d = pick(regs), a = pick(regs), b = pick(regs);
      ins.push(k === 'lw' ? { k, d, a } : { k, d, a, b });
    }
    let st = 0;
    for (let i = 0; i < n - 1; i++) if (ins[i].k === 'lw') { const nx = ins[i + 1], rd = nx.k === 'lw' ? [nx.a] : [nx.a, nx.b]; if (rd.includes(ins[i].d)) st++; }
    if (force && st === 0) continue;
    if (!force && st > 1) continue;
    const txt = ins.map(x => x.k === 'lw' ? 'lw ' + x.d + ', 0(' + x.a + ')' : x.k + ' ' + x.d + ', ' + x.a + ', ' + x.b).join('\n');
    return { txt, st, n };
  }
}
const cyc = force => ({ t: 'num', tier: 3, boss: force === 1, gen() {
  const g = codeGen(force); const ans = g.n + 4 + g.st;
  return { q: 'A 5-stage pipeline has full forwarding plus a hardware stall for the load-use case. Nothing else stalls. In which clock cycle does the <b>last</b> instruction finish (write back)?' + pre(g.txt), a: ans, tol: 0, abs: 0.01, hint: 'With no stalls, instruction n finishes in cycle n + 4. A lw followed right away by an instruction that reads its register costs one extra cycle.', why: g.n + ' instructions finish in cycle ' + (g.n + 4) + ' with no stalls. ' + g.st + ' load-use stall' + (g.st === 1 ? '' : 's') + ' add' + (g.st === 1 ? 's' : '') + ' ' + g.st + ', so the last one finishes in cycle ' + ans + '.' };
} });

    chals: [
      { t: 'sort', tier: 1, q: 'What does each line do?', buckets: ['Compute an address', 'Read memory', 'Write memory', 'Do math'], items: [['<code>sll $t0,$a2,2</code>', 0], ['<code>add $t0,$a0,$t0</code>', 0], ['<code>lw $s0,12($t0)</code>', 1], ['<code>sw $t0,8($t1)</code>', 2], ['<code>add $t0,$t0,$s0</code>', 3], ['<code>addi $t2,$t0,-16</code>', 0]], why: 'sll and add build addresses, lw reads memory, sw writes memory, and add does the math.' },
      { t: 'num', tier: 2, gen() { const o = pick([4, 8, 12, 16, 20, -4, -8, -12, -16, -20]); return { q: '<code>$t0</code> holds <code>&amp;A[i]</code>. For the instruction <code>lw $s0, ' + o + '($t0)</code>, the element is <code>A[i + k]</code>. What is <b>k</b>?', a: o / 4, tol: 0, abs: 0.01, hint: 'Divide the byte offset by 4.', why: o + ' bytes ÷ 4 = ' + o / 4 + ' elements.' }; } },
      { t: 'choice', tier: 2, q: '<code>$t0 = &amp;A[i]</code>. After <code>addi $t2,$t0,-16</code>, what does <code>$t2</code> hold?', opts: ['&amp;A[i−4]', '&amp;A[i−16]', 'A[i−4]', 'A[i] − 16'], a: 0, hint: '−16 bytes is −4 words, and addi works on the address.', why: '−16 bytes = −4 elements, so $t2 = &amp;A[i−4], an address, not a value.' },
      { t: 'choice', tier: 3, boss: true, q: 'Given <code>A</code> in $a0, <code>B</code> in $a1, <code>i</code> in $a2, <code>j</code> in $a3:' + pre('sll  $t0, $a2, 2\nadd  $t0, $a0, $t0\nsll  $t1, $a3, 2\nadd  $t1, $a1, $t1\nlw   $s0, 12($t0)\naddi $t2, $t0, -16\nlw   $t0, 4($t2)\nadd  $t0, $t0, $s0\nsw   $t0, 8($t1)') + 'Which single line of C does this compile from?', opts: ['B[j+2] = A[i-3] + A[i+3];', 'B[j+2] = A[i+3] + A[i+3];', 'B[j] = A[i-3] + A[i+3];', 'B[j+2] = A[i-4] + A[i+4];'], a: 0, hint: 'lw 12 → A[i+3]. addi −16 then lw 4 → A[i−4+1]. sw 8 → B[j+2].', why: '12 bytes = A[i+3]. addi −16 gives &amp;A[i−4], then +4 bytes loads A[i−3]. The store at 8 bytes is B[j+2].' },
    ] },

  /* 7 */ { n: 7, lec: '6', diff: 3, topic: 'Procedure Calls and the Stack', blurb: 'jal, jr, why one $ra is not enough, and saving registers on the stack.',
    intro: '<code>jal</code> saves the next instruction’s address in <code>$ra</code> and jumps. <code>jr $ra</code> returns. A nested call would overwrite <code>$ra</code>, so functions save what they need on the <b>stack</b>, which grows from high addresses to low.',
    ana: { title: 'Sub-Assemblies and the Tray Stack', mission: 'Send a job to a sub-assembly and leave a note for the way back. Park notes on a pile of trays.' },
    chals: [
      { t: 'choice', tier: 1, q: 'What does <code>jal Label</code> do?', opts: ['Saves the address of the next instruction in $ra, then jumps to Label', 'Jumps to Label and clears $ra', 'Returns to the caller', 'Loads a word from Label'], a: 0, hint: '“Jump and link”.', why: 'jal saves the return address in $ra and jumps. That is how a call remembers where to come back to.' },
      { t: 'choice', tier: 1, q: 'What does <code>jr $ra</code> do?', opts: ['Copies $ra into the PC, returning to right after the call', 'Jumps to the label named ra', 'Adds 4 to $ra', 'Stores $ra on the stack'], a: 0, hint: '“Jump register”.', why: 'jr $ra copies $ra into the PC, so execution resumes right after the original jal.' },
      { t: 'choice', tier: 2, q: '<code>main</code> calls <code>tomato</code>, which calls <code>potato</code>. If tomato never saves <code>$ra</code>, what goes wrong?', opts: ['potato’s jal overwrites $ra, so main’s return address is lost', 'Nothing. Each function has its own $ra', 'potato can never return', 'The stack overflows immediately'], a: 0, hint: 'There is only one $ra register.', why: 'There is one $ra. Nested calls need somewhere to stash the old value before it gets clobbered. That is the stack.' },
      { t: 'order', tier: 2, q: 'Put a function’s save-and-restore steps in order. It uses $s0 and calls another function.', items: ['<code>addi $sp,$sp,-8</code>  (make room)', '<code>sw $ra,4($sp)</code>', '<code>sw $s0,0($sp)</code>', '... do the work, including the call ...', '<code>lw $s0,0($sp)</code>', '<code>lw $ra,4($sp)</code>', '<code>addi $sp,$sp,8</code>  (free the room)', '<code>jr $ra</code>'], hint: 'Push on entry, pop in reverse before returning.', why: 'Push = subtract from $sp, pop = add it back. Restore before jr $ra.' },
      { t: 'num', tier: 2, gen() { const k = rnd(1, 4), calls = Math.random() < 0.6; return { q: 'A function uses <code>$s0</code> to <code>$s' + (k - 1) + '</code> (' + k + ' saved register' + (k > 1 ? 's' : '') + ') and ' + (calls ? '<b>calls</b> another function.' : 'calls no other function.') + ' How many bytes must it push so nothing is corrupted?', unit: 'bytes', a: 4 * k + (calls ? 4 : 0), tol: 0, abs: 0.01, hint: 'Each register is a 4-byte word. $ra needs saving only if you make a call.', why: k + ' × 4' + (calls ? ' + 4 for $ra' : '') + ' = ' + (4 * k + (calls ? 4 : 0)) + ' bytes.' }; } },
      { t: 'num', tier: 3, boss: true, gen() { const sp = pick([1000, 2000, 4096]), w = rnd(1, 4); return { q: 'The stack pointer starts at <code>$sp = ' + sp + '</code>. A function pushes ' + w + ' words with <code>addi $sp,$sp,-' + 4 * w + '</code>, then later pops them all. What is <code>$sp</code> right after the <b>push</b>?', a: sp - 4 * w, tol: 0, abs: 0.01, hint: 'The stack grows toward lower addresses.', why: sp + ' − ' + 4 * w + ' = ' + (sp - 4 * w) + '. After the pop, $sp is back to ' + sp + '.' }; } },
    ] },

  /* 8 */ { n: 8, lec: '6', diff: 3, topic: 'Name That Function', blurb: 'slt comparisons and reading short MIPS routines.',
    intro: '<code>slt rd, rs, rt</code> sets rd to 1 if rs &lt; rt, else 0. MIPS only branches on equality, so every &lt; or ≤ is built from <code>slt</code> plus <code>beq</code> or <code>bne</code>.',
    ana: { title: 'Name That Station', mission: 'Read the steps at a station and say what it makes.' },
    chals: [
      { t: 'choice', tier: 1, q: 'Which pair implements <code>if (a &lt;= b)</code> with a in $s0 and b in $s1, branching to LtEq when true?', opts: ['<code>slt $t0,$s1,$s0</code> then <code>beq $t0,$zero,LtEq</code>', '<code>slt $t0,$s0,$s1</code> then <code>beq $t0,$zero,LtEq</code>', '<code>slt $t0,$s1,$s0</code> then <code>bne $t0,$zero,LtEq</code>', '<code>beq $s0,$s1,LtEq</code> only'], a: 0, hint: 'a ≤ b is the same as NOT (b < a).', why: 'Flip the operands: t0 = (b &lt; a). That is 0 exactly when a ≤ b, so branch when t0 == 0.' },
      { t: 'num', tier: 2, gen() { const X = rnd(1, 15), Y = rnd(1, 15), askT1 = Math.random() < 0.5; return { q: '<code>$t0 = ' + X + '</code>, <code>$t1 = ' + Y + '</code>. After the three xor lines, what is <code>' + (askT1 ? '$t1' : '$t0') + '</code>?' + pre('xor $t0,$t0,$t1\nxor $t1,$t0,$t1\nxor $t0,$t0,$t1'), a: askT1 ? X : Y, tol: 0, abs: 0.01, hint: 'This is the classic XOR swap.', why: 'It swaps $t0 and $t1 without a temp register: now $t0 = ' + Y + ' and $t1 = ' + X + '.' }; } },
      { t: 'num', tier: 2, gen() { const n = rnd(3, 9); return { q: 'This loop receives <code>n = ' + n + '</code> in <code>$a0</code>:' + pre('addi $t0,$0,0\naddi $t1,$0,1\nloop: slti $t2,$a0,1\n      bne  $t2,$0,finish\n      add  $t0,$t0,$t1\n      addi $t1,$t1,2\n      addi $a0,$a0,-1\n      j loop\nfinish: add $v0,$t0,$0') + 'What ends up in <code>$v0</code>?', a: n * n, tol: 0, abs: 0.01, hint: 'It adds 1, 3, 5, ... n times.', why: 'It adds the first n odd numbers, which always equals n². For n = ' + n + ': ' + n * n + '.' }; } },
      { t: 'choice', tier: 2, q: 'In a search loop, <code>slt $t3,$t0,$a1</code> followed by <code>beq $t3,$0,exit</code> checks…', opts: ['That the index i has reached the array size, so stop', 'That the array is sorted', 'That the value was found', 'That $a1 is zero'], a: 0, hint: 't3 = (i < size).', why: 't3 is 1 while i &lt; size. When it is 0 the loop has run off the end, so it exits.' },
      { t: 'match', tier: 2, q: 'Match each routine to what it does.', pairs: [['<pre class="code">xor $t0,$t0,$t1\nxor $t1,$t0,$t1\nxor $t0,$t0,$t1</pre>', 'Swaps $t0 and $t1 with no temp register'], ['<pre class="code">sum of 1, 3, 5, ... n terms</pre>', 'Returns n² (the sum of the first n odd numbers)'], ['<pre class="code">scan array, compare each to 42,\nreturn index or −1</pre>', 'Linear search for the value 42']], why: 'Spotting the pattern is the skill: three xors swap, adding odd numbers gives n², and a scan with a compare is a search.' },
      { t: 'choice', tier: 3, boss: true, q: 'A routine scans an array of 5 numbers for the value 42, returning the index if found. The array contains <b>no</b> 42. What does it return?', opts: ['−1', '0', '5', '42'], a: 0, hint: 'The “not found” exit.', why: 'When i reaches the size, the loop exits with <code>addi $v0,$0,-1</code>, returning −1.' },
    ] },

  /* 9 */ { n: 9, lec: '7', diff: 3, topic: 'CPU Time and Amdahl’s Law', blurb: 'IC × CPI × cycle time, and why speeding up part of a program caps your gain.',
    intro: '<b>CPU time = IC × CPI × clock cycle time</b>. Amdahl’s Law: if a fraction f of a program is sped up by a factor n, then <span class="m">Speedup = 1 / (f/n + (1 − f))</span>. The untouched part is a hard ceiling.',
    ana: { title: 'The Stopwatch and the Slow Step', mission: 'Count the whistles, then see why one slow step caps your speedup.' },
    chals: [
      { t: 'match', tier: 1, q: 'Match each term of the CPU-time formula.', pairs: [['IC', 'Instructions in the program'], ['CPI', 'Cycles per instruction'], ['Clock cycle time', 'Seconds per cycle']], extra: ['Speedup'], why: 'CPU time = IC × CPI × clock cycle time. Every later performance question is this formula asked a different way.' },
      { t: 'choice', tier: 1, q: 'An array loop recomputes an address each pass. A pointer loop just increments a pointer. Which is usually faster, and why?', opts: ['The pointer version: fewer instructions per iteration', 'The array version: it uses sll', 'They are always identical', 'The pointer version: it uses fewer registers'], a: 0, hint: 'Count instructions per iteration.', why: 'The pointer is already an address, so there is no address math each pass. Fewer instructions per iteration means fewer cycles.' },
      { t: 'num', tier: 2, gen() { const IC = pick([1, 2, 4]), CPI = pick([1, 1.5, 2, 2.5]), f = pick([1, 2, 4]); return { q: 'A program runs <span class="m">' + IC + ' billion</span> instructions at an average CPI of <span class="m">' + CPI + '</span> on a <span class="m">' + f + ' GHz</span> clock. How long does it take?', unit: 's', a: IC * CPI / f, tol: 0.02, hint: 'CPU time = IC × CPI ÷ clock rate.', why: 'Time = ' + IC + 'e9 × ' + CPI + ' / ' + f + 'e9 Hz = ' + fmt(IC * CPI / f, 3) + ' s.' }; } },
      { t: 'num', tier: 2, gen() { const f = pick([0.5, 0.8, 0.9, 0.95]), n = pick([2, 4, 10, 100]); const a = 1 / (f / n + 1 - f); return { q: 'A fraction <span class="m">f = ' + f + '</span> of a program’s time is sped up by a factor of <span class="m">n = ' + n + '</span>. What is the overall speedup?', unit: '×', a, tol: 0.02, hint: 'Speedup = 1 / (f/n + (1 − f)).', why: '1 / (' + f + '/' + n + ' + ' + fmt(1 - f, 2) + ') = ' + fmt(a, 3) + '×.' }; } },
      { t: 'choice', tier: 2, q: 'FPSQR is 20% of runtime and a new unit makes it 10× faster. Alternatively, all floating-point instructions (50% of runtime) become 2× faster. Which gives the bigger speedup?', opts: ['All floating point: about 1.33× vs about 1.22×', 'FPSQR: about 1.8×', 'They are equal', 'Neither speeds anything up'], a: 0, hint: 'Compute both with Amdahl’s Law.', why: 'FPSQR: 1/(0.2/10 + 0.8) ≈ 1.22. All FP: 1/(0.5/2 + 0.5) ≈ 1.33. How much of the program you touch matters more than how much you speed up one part.' },
      { t: 'num', tier: 3, boss: true, gen() { const f = pick([0.8, 0.9, 0.95, 0.99]); return { q: 'A program is <span class="m">' + f * 100 + '%</span> parallelizable. With <b>unlimited</b> processors, what is the maximum possible speedup?', unit: '×', a: 1 / (1 - f), tol: 0.01, hint: 'As n grows, f/n goes to 0.', why: 'Speedup → 1/(1 − f) = 1/' + fmt(1 - f, 2) + ' = ' + fmt(1 / (1 - f), 1) + '×. The serial part is a hard ceiling.' }; } },
    ] },

  /* 10 */ { n: 10, lec: '8', diff: 3, topic: 'CPI from Instruction Mix and the MIPS Trap', blurb: 'Why “MIPS” is a misleading speed number, and how to average CPI properly.',
    intro: '“MIPS” (millions of instructions per second) is a trap. Use <b>CPI weighted by instruction mix</b>: <span class="m">overall CPI = Σ CPI<sub>i</sub> × (IC<sub>i</sub> / IC)</span>, then feed it into the CPU-time formula.',
    ana: { title: 'The Misleading Scoreboard', mission: 'Orders per second sounds fair, but it is a trap. Weigh each order by how often it comes.' },
    chals: [
      { t: 'sort', tier: 1, q: 'Is each a reason MIPS misleads, or a sound way to compare?', buckets: ['Reason MIPS misleads', 'Sound way to compare'], items: [['Different instruction sets do different work per instruction', 0], ['The same chip scores a different MIPS on every program', 0], ['CPU time = IC × CPI × cycle time', 1], ['Adding cheaper 1-cycle instructions can raise MIPS while runtime gets worse', 0], ['Weighted CPI from the instruction mix', 1]], why: 'MIPS ignores how much work each instruction does and varies by program. CPU time, with a weighted CPI, is the reliable measure.' },
      { t: 'num', tier: 2, gen() { const mix = pick([[50, 30, 20], [40, 40, 20], [60, 30, 10], [25, 50, 25]]), c = pick([[1, 2, 3], [1, 1, 2], [1, 2, 4]]); const a = (mix[0] * c[0] + mix[1] * c[1] + mix[2] * c[2]) / 100; return { q: 'An instruction mix: <b>ALU</b> ' + mix[0] + '% at ' + c[0] + ' cycle' + (c[0] > 1 ? 's' : '') + ', <b>Load/Store</b> ' + mix[1] + '% at ' + c[1] + ', <b>Branch</b> ' + mix[2] + '% at ' + c[2] + '. What is the overall CPI?', a, tol: 0.02, hint: 'Multiply each CPI by its fraction and add.', why: 'CPI = ' + (mix[0] / 100) + '×' + c[0] + ' + ' + (mix[1] / 100) + '×' + c[1] + ' + ' + (mix[2] / 100) + '×' + c[2] + ' = ' + fmt(a, 3) + '.' }; } },
      { t: 'num', tier: 2, q: 'Mix: ALU 43% at 1 cycle, Load 21% at 1, Store 12% at <b>1</b> (improved from 2), Branch 24% at 2. What is the <b>new</b> CPI?', a: 1.24, tol: 0.01, hint: '0.43(1) + 0.21(1) + 0.12(1) + 0.24(2).', why: 'New CPI = 0.43 + 0.21 + 0.12 + 0.48 = 1.24 (down from 1.38 when Store took 2 cycles).' },
      { t: 'choice', tier: 2, q: 'A change drops CPI from 1.38 to 1.24 but slows the clock by 15%. What should you conclude?', opts: ['Do not make it. The clock penalty hits every instruction and the net speedup is about 0.97', 'Make it. A lower CPI always wins', 'Make it. Clock speed does not matter', 'You cannot tell without MIPS'], a: 0, hint: 'Multiply the CPI change and the clock change together.', why: 'Speedup = 1.38 / (1.24 × 1.15) ≈ 0.97, slightly slower. Never judge CPI or clock in isolation.' },
      { t: 'choice', tier: 2, q: 'What is the reliable way to compare two processors on the same program?', opts: ['Compare CPU time, found from IC × CPI × cycle time', 'Compare MIPS', 'Compare clock rate only', 'Compare the number of registers'], a: 0, hint: 'Seconds are what you actually wait for.', why: 'Only total time captures instruction count, cycles per instruction and clock together.' },
      { t: 'num', tier: 3, boss: true, gen() { const oc = pick([1.38, 1.5, 1.6, 2.0]), d = pick([0.1, 0.14, 0.2]), s = pick([10, 15, 20]); const nc = oc - d; const a = oc / (nc * (1 + s / 100)); return { q: 'A redesign cuts CPI from <span class="m">' + oc + '</span> to <span class="m">' + fmt(nc, 2) + '</span> but the clock must run <span class="m">' + s + '%</span> slower (cycle time ×' + (1 + s / 100) + '). What is the speedup? (Below 1 means slower.)', unit: '×', a, tol: 0.02, hint: 'Speedup = old CPI / (new CPI × slowdown factor).', why: fmt(oc, 2) + ' / (' + fmt(nc, 2) + ' × ' + (1 + s / 100) + ') = ' + fmt(a, 3) + '.' }; } },
    ] },

  /* 11 */ { n: 11, lec: '9', diff: 3, topic: 'From C to Machine Code', blurb: 'The 32-bit instruction word, R and I layouts, and SAD block matching.',
    intro: 'Every assembly line becomes one 32-bit pattern. R-type has <code>op=000000</code> and the real operation in <code>funct</code>. I-type spends its right half on a 16-bit immediate or branch offset. Branch offsets are relative, in instructions.',
    ana: { title: 'Barcodes on Every Order', mission: 'Each order becomes a 32-box barcode the machines can scan.' },
    chals: [
      { t: 'choice', tier: 1, q: 'How many bits wide is every MIPS instruction word?', opts: ['32', '16', '26', '64'], a: 0, hint: 'R, I and J formats are all the same width.', why: 'All MIPS instructions are exactly 32 bits, which is what makes decoding regular.' },
      { t: 'match', tier: 1, q: 'Match each R-type field to its bit positions.', pairs: [['op', 'bits 31–26'], ['rs', 'bits 25–21'], ['rt', 'bits 20–16'], ['rd', 'bits 15–11'], ['shamt', 'bits 10–6'], ['funct', 'bits 5–0']], why: '6 + 5 + 5 + 5 + 5 + 6 = 32 bits.' },
      { t: 'choice', tier: 2, q: 'For an R-type instruction like <code>add</code>, what is the <code>op</code> field and how is the real operation chosen?', opts: ['op is 000000 and the funct field selects the operation', 'op is 100000 and funct is ignored', 'op holds the operation and funct holds the registers', 'op is the immediate value'], a: 0, hint: 'All R-type instructions share one op.', why: 'op is always 000000 for R-type. The 6-bit funct field at the far right says add, sub, slt and so on.' },
      { t: 'order', tier: 2, q: 'Put this compiled loop (for i = 0..2, k = k + i + 1) in order.', items: ['<code>addi $t2,$zero,3</code>', '<code>loop: add $t0,$t0,$t1</code>', '<code>addi $t0,$t0,1</code>', '<code>addi $t1,$t1,1</code>', '<code>slt $t3,$t1,$t2</code>', '<code>bne $t3,$zero,loop</code>'], hint: 'Set up the limit, run the body, test, branch back.', why: 'The loop body runs, i increments, slt tests i &lt; 3, and bne branches back while true.' },
      { t: 'num', tier: 2, gen() { const k = rnd(2, 9); return { q: 'A <code>bne</code> has the 16-bit offset field <code>' + bin(65536 - k, 16) + '</code> (two’s complement). What signed number is that?', a: -k, tol: 0, abs: 0.01, hint: 'The top bit is 1, so it is negative. Flip the bits and add 1.', why: 'It equals −' + k + ': branch back ' + k + ' instructions. Branch offsets count instructions, not bytes.' }; } },
      { t: 'num', tier: 3, boss: true, gen() { const w = [rnd(0, 9), rnd(0, 9), rnd(0, 9), rnd(0, 9)], r = [rnd(0, 9), rnd(0, 9), rnd(0, 9), rnd(0, 9)]; const a = w.reduce((s, x, i) => s + Math.abs(x - r[i]), 0); return { q: 'Motion estimation uses <b>SAD</b>, the sum of absolute differences. Window pixels: <code>' + w.join(', ') + '</code>. Frame region: <code>' + r.join(', ') + '</code>. What is the SAD score?', a, tol: 0, abs: 0.01, hint: 'Take |difference| of each pair, then add them.', why: 'Differences: ' + w.map((x, i) => Math.abs(x - r[i])).join(' + ') + ' = ' + a + '. The best match is the position with the lowest score (closest to zero).' }; } },
    ] },

  /* 12 */ { n: 12, lec: '10', diff: 3, topic: 'The Single-Cycle Datapath', blurb: 'The reusable building blocks, and wiring them for lw and sw.',
    intro: 'A CPU is built from a few reusable parts: instruction memory, PC, adder, register file, ALU, data memory and sign-extend. In the <b>single-cycle</b> design, a whole instruction happens in one clock tick.',
    ana: { title: 'The Factory Floor Plan', mission: 'Lay out the stations and conveyor belts. Every order uses the same floor plan.' },
    chals: [
      { t: 'match', tier: 1, q: 'Match each datapath block to its job.', pairs: [['Instruction memory', 'Given an address, returns the 32-bit instruction'], ['PC', 'Holds the address of the current instruction'], ['Register file', '32 slots: reads 2 at once, writes 1'], ['ALU', 'Does the math and logic'], ['Sign-extend', 'Stretches a 16-bit value to 32 bits, keeping its sign'], ['Data memory', 'Where lw reads and sw writes']], why: 'These are the Lego pieces every later diagram is built from.' },
      { t: 'choice', tier: 1, q: 'What does “single-cycle” mean?', opts: ['A whole instruction finishes in exactly one clock tick', 'The CPU has one register', 'Each stage takes one cycle', 'The clock ticks once per program'], a: 0, hint: 'Contrast with pipelining, which splits the work into stages.', why: 'In a single-cycle design every instruction starts and finishes within one clock cycle.' },
      { t: 'choice', tier: 2, q: 'Why is a sign-extend block needed?', opts: ['To stretch a 16-bit immediate to 32 bits for ALU math while keeping its sign', 'To change the sign of the result', 'To add 4 to the PC', 'To convert bytes to words'], a: 0, hint: 'The ALU works on 32-bit values.', why: 'Immediates are 16 bits wide. Sign-extend makes a 32-bit version with the same value, so negatives stay negative.' },
      { t: 'choice', tier: 2, q: 'What is the adder next to the PC used for?', opts: ['Computing PC + 4, the next instruction’s address (and branch targets)', 'Adding two register values', 'Computing the ALU result', 'Counting clock ticks'], a: 0, hint: 'Instructions are 4 bytes long.', why: 'The adder gives PC+4. The same kind of adder also does the branch-target math.' },
      { t: 'wire', tier: 2, q: 'Wire the datapath for a <code>lw</code>. Draw the data path from block to block.', left: [{ id: 'pc', label: 'PC' }, { id: 'imem', label: 'Instruction memory' }, { id: 'reg', label: 'Register file' }, { id: 'sext', label: 'Sign-extend' }, { id: 'alu', label: 'ALU' }, { id: 'dmem', label: 'Data memory' }], right: [{ id: 'imem', label: 'Instruction memory' }, { id: 'reg', label: 'Register file' }, { id: 'sext', label: 'Sign-extend' }, { id: 'alu', label: 'ALU' }, { id: 'dmem', label: 'Data memory' }], links: [['pc', 'imem'], ['imem', 'reg'], ['imem', 'sext'], ['reg', 'alu'], ['sext', 'alu'], ['alu', 'dmem'], ['dmem', 'reg']], hint: 'Fetch, read the base register and offset, ALU makes the address, memory returns the data, write it back to a register.', why: 'PC → instruction memory → register file and sign-extend → ALU (base + offset) → data memory → back into the register file.' },
      { t: 'wire', tier: 3, boss: true, q: 'Now wire the datapath for a <code>sw</code>. Remember: a store writes memory and writes no register.', left: [{ id: 'pc', label: 'PC' }, { id: 'imem', label: 'Instruction memory' }, { id: 'reg', label: 'Register file' }, { id: 'sext', label: 'Sign-extend' }, { id: 'alu', label: 'ALU' }, { id: 'dmem', label: 'Data memory' }], right: [{ id: 'imem', label: 'Instruction memory' }, { id: 'reg', label: 'Register file' }, { id: 'sext', label: 'Sign-extend' }, { id: 'alu', label: 'ALU' }, { id: 'dmem', label: 'Data memory' }], links: [['pc', 'imem'], ['imem', 'reg'], ['imem', 'sext'], ['reg', 'alu'], ['sext', 'alu'], ['alu', 'dmem'], ['reg', 'dmem']], hint: 'Two things go to data memory: the address from the ALU and the value to store from the register file.', why: 'Like lw up to the ALU. Then the ALU gives the address and the register file’s second value is the data to store. Nothing is written back to a register.' },
    ] },

  /* 13 */ { n: 13, lec: '11', diff: 4, topic: 'Control Signals and the ALU Controller', blurb: 'Set each wire to the exact 0 or 1 an instruction needs, and see what breaks when one sticks.',
    intro: 'The datapath has control wires that act like light switches: RegDst, ALUSrc, MemtoReg, RegWrite, MemRead, MemWrite, Branch and ALUOp. Each instruction needs its own setting. <b>x</b> means “don’t care”.',
    ana: { title: 'The Foreman’s Switch Board', mission: 'Flip the right switches for each order, and find what breaks when a switch jams.' },
    chals: [
      { t: 'choice', tier: 1, q: 'In the control table, what does an <b>x</b> mean?', opts: ['Don’t care: it has no effect for this instruction', 'The signal must be 0', 'The signal must be 1', 'The instruction is illegal'], a: 0, hint: 'Think sw and RegDst.', why: 'x means that signal does not matter for this instruction, so either value works.' },
      { t: 'match', tier: 1, q: 'Set the control signals for <code>lw</code>. Match each signal to its value.', pairs: [['RegDst', '0'], ['ALUSrc', '1'], ['MemtoReg', '1'], ['RegWrite', '1'], ['MemRead', '1'], ['MemWrite', '0'], ['Branch', '0'], ['ALUOp', '00']], why: 'lw: RegDst 0, ALUSrc 1, MemtoReg 1, RegWrite 1, MemRead 1, MemWrite 0, Branch 0, ALUOp 00.' },
      { t: 'sort', tier: 2, q: 'What is the 2-bit ALUOp for each instruction?', buckets: ['00 (add)', '01 (subtract)', '10 (look at funct)'], items: [['lw', 0], ['sw', 0], ['beq', 1], ['add (R-format)', 2], ['sub (R-format)', 2], ['slt (R-format)', 2]], why: 'lw and sw just add to compute an address. beq subtracts to test for zero. R-format needs the funct field.' },
      { t: 'choice', tier: 2, q: '<b>RegWrite</b> is stuck at 1. What goes wrong?', opts: ['sw and beq overwrite a random register', 'R-format instructions cannot write', 'lw reads the wrong address', 'Nothing. It only affects add'], a: 0, hint: 'Which instructions never meant to write a register?', why: 'sw and beq never intended to write a register, but with RegWrite stuck at 1 they would overwrite one with garbage.' },
      { t: 'choice', tier: 2, q: '<b>ALUOp0</b> is stuck at 0. What breaks?', opts: ['beq: the ALU adds instead of subtracts, so the equal test never works', 'lw and sw', 'Every R-format instruction', 'Nothing'], a: 0, hint: 'ALUOp 01 means subtract.', why: 'beq needs ALUOp = 01 (subtract). With ALUOp0 stuck at 0 it becomes 00 (add), and the zero-result test breaks.' },
      { t: 'match', tier: 3, boss: true, q: 'Set the control signals for <code>sw</code>. Use x where it does not matter.', pairs: [['RegDst', 'x'], ['ALUSrc', '1'], ['MemtoReg', 'x'], ['RegWrite', '0'], ['MemRead', '0'], ['MemWrite', '1'], ['Branch', '0'], ['ALUOp', '00']], why: 'sw: the register-destination and write-back signals are don’t care because nothing is written to a register. ALUSrc = 1, MemWrite = 1, ALUOp = 00.' },
    ] },

  /* 14 */ { n: 14, lec: '12', diff: 3, topic: 'Timing and the Critical Path', blurb: 'Add up component delays to find the slowest path, and see why single-cycle wastes time.',
    intro: 'In a single-cycle design the clock must fit the <b>slowest</b> instruction. Find the longest path through the datapath for any instruction and add up the delays. Memory 2 ns, ALU and adder 2 ns, register file access 1 ns, everything else about 0.',
    ana: { title: 'The Whistle and the Slowest Job', mission: 'The whistle must wait for the slowest job. Add up the station times to find out how long.' },
    chals: [
      { t: 'match', tier: 1, q: 'Match each component to its delay in this problem set.', pairs: [['Memory (instruction or data)', '2 ns'], ['ALU or adder', '2 ns'], ['Register file access', '1 ns'], ['MUXes, sign-extend, wires', '≈ 0 ns']], why: 'Treat MUXes, sign-extend and wires as negligible unless told otherwise.' },
      { t: 'choice', tier: 1, q: 'What sets the clock period in a single-cycle design?', opts: ['The longest path of the slowest instruction', 'The average instruction', 'The fastest instruction', 'The register file alone'], a: 0, hint: 'One clock for everyone.', why: 'One slow instruction sets the clock speed for every instruction, forever.' },
      { t: 'num', tier: 2, gen() { const m = pick([2, 3]), a = pick([2, 3]), r = 1; const kinds = { lw: ['lw', 'instruction memory + register read + ALU + data memory + register write', 2 * m + 2 * r + a], sw: ['sw', 'instruction memory + register read + ALU + data memory', 2 * m + r + a], add: ['an R-type add', 'instruction memory + register read + ALU + register write', m + 2 * r + a], beq: ['beq', 'instruction memory + register read + ALU', m + r + a] }; const k = pick(Object.values(kinds)); return { q: 'Memory takes <span class="m">' + m + ' ns</span>, the ALU <span class="m">' + a + ' ns</span>, and a register file read or write <span class="m">' + r + ' ns</span>. How long is the path for ' + k[0] + '?', unit: 'ns', a: k[2], tol: 0, abs: 0.01, hint: 'Path: ' + k[1] + '.', why: k[0] + ' path = ' + k[1] + ' = ' + k[2] + ' ns.' }; } },
      { t: 'num', tier: 2, gen() { const k = pick([['an R-type add', 6], ['a sw', 7], ['a beq', 5]]); return { q: 'With memory 2 ns, ALU 2 ns and register access 1 ns, <code>lw</code> needs 8 ns, so the clock period is 8 ns. ' + k[0] + ' only needs <span class="m">' + k[1] + ' ns</span>. How much time does it waste each cycle?', unit: 'ns', a: 8 - k[1], tol: 0, abs: 0.01, hint: 'Clock period minus what the instruction needs.', why: '8 − ' + k[1] + ' = ' + (8 - k[1]) + ' ns idle on every ' + k[0].replace('an ', '').replace('a ', '') + '.' }; } },
      { t: 'choice', tier: 2, q: 'In the adder-tree analogy, what does pipelining change?', opts: ['The cycle time covers one stage, not the whole chain. Latency of one result is not shorter', 'It makes one result finish in a single stage’s time', 'It removes the need for registers', 'It makes every adder faster'], a: 0, hint: 'Throughput up, latency not.', why: 'The clock shrinks to one stage’s delay and results come out faster in a stream, but any single result still needs several cycles.' },
      { t: 'num', tier: 3, boss: true, gen() { const s = [pick([1, 2, 3]), pick([1, 2]), pick([1, 2, 3]), pick([2, 3]), pick([1, 2])]; const sum = s.reduce((x, y) => x + y, 0), mx = Math.max(...s); return { q: 'A single-cycle path through five steps takes <span class="m">' + s.join(' + ') + ' = ' + sum + ' ns</span>. Pipelined into five stages with those delays (IF, ID, EX, MEM, WB), the clock must fit the slowest stage. By what factor does the <b>clock rate</b> improve?', unit: '×', a: sum / mx, tol: 0.02, hint: 'Divide the whole path by the slowest stage.', why: 'New clock period = slowest stage = ' + mx + ' ns. Improvement = ' + sum + '/' + mx + ' = ' + fmt(sum / mx, 2) + '× (an upper bound: balanced stages do better).' }; } },
    ] },

  /* 15 */ { n: 15, lec: '15', diff: 4, topic: 'The 5-Stage Pipeline', blurb: 'IF, ID, EX, MEM and WB, pipeline registers, and what pipelining can and cannot do.',
    intro: 'Chop the datapath into 5 stages with a pipeline register between each, and 5 instructions are in flight at once. The clock only has to fit the slowest <b>stage</b>. Throughput improves, but one instruction still takes 5 cycles.',
    ana: { title: 'The Five-Station Assembly Line', mission: 'Five stations, five cars at once. A finished car rolls out every tick.' },
    chals: [
      { t: 'order', tier: 1, q: 'Put the five pipeline stages in order.', items: ['Instruction Fetch (IF)', 'Instruction Decode (ID)', 'Execute (EX)', 'Memory (MEM)', 'Write Back (WB)'], why: 'IF, ID, EX, MEM, WB.' },
      { t: 'match', tier: 1, q: 'Match each stage to its job.', pairs: [['IF', 'Read the instruction at the PC; compute PC+4'], ['ID', 'Read source registers; sign-extend the immediate'], ['EX', 'ALU math, memory address or branch target'], ['MEM', 'Read or write data memory'], ['WB', 'Write the result to the register file']], why: 'Only lw and sw really use MEM, but every instruction still passes through it.' },
      { t: 'sort', tier: 2, q: 'Does pipelining improve it?', buckets: ['Improves', 'Does not improve'], items: [['Clock rate', 0], ['Throughput (instructions finished per cycle)', 0], ['Latency of one instruction', 1], ['Cycles one lw needs from start to finish (still 5)', 1]], why: 'Pipelining overlaps different instructions. It does not make any one of them faster.' },
      { t: 'num', tier: 2, gen() { const n = rnd(3, 12); return { q: 'A 5-stage pipeline runs with no stalls. Instruction number <span class="m">' + n + '</span> starts in cycle ' + n + '. In which cycle does it <b>finish</b> (write back)?', a: n + 4, tol: 0, abs: 0.01, hint: 'It spends 5 cycles in the pipeline.', why: 'It starts in cycle ' + n + ' and needs 5 cycles, so it finishes in cycle ' + n + ' + 4 = ' + (n + 4) + '.' }; } },
      { t: 'choice', tier: 2, q: 'What does a pipeline register such as IF/ID do?', opts: ['Holds an instruction’s data for one cycle so the next stage can pick it up', 'Stores the program counter forever', 'Adds a stage to the datapath', 'Replaces the register file'], a: 0, hint: 'Four of them sit between the five stages.', why: 'IF/ID, ID/EX, EX/MEM and MEM/WB carry each instruction’s data and control signals along, one stage at a time.' },
      { t: 'num', tier: 3, boss: true, gen() { const N = pick([20, 50, 100]), T = pick([2, 3]); return { q: 'A 5-stage pipeline with a clock period of <span class="m">' + T + ' ns</span> runs <span class="m">' + N + '</span> instructions with no stalls. How long does the whole run take?', unit: 'ns', a: (N + 4) * T, tol: 0.01, hint: 'The last instruction finishes in cycle N + 4.', why: '(' + N + ' + 4) cycles × ' + T + ' ns = ' + (N + 4) * T + ' ns. The first instruction takes 5 cycles. Every later one adds just 1.' }; } },
    ] },

  /* 16 */ { n: 16, lec: '16', diff: 4, topic: 'Hazard Types: Structural, Data and Control', blurb: 'Why the pipeline cannot always keep going, and which data hazards MIPS can actually have.',
    intro: 'Sometimes the next instruction cannot safely start. <b>Structural</b>: a shared resource is busy. <b>Data</b>: a value is not ready yet. <b>Control</b>: a branch has not been decided. Only <b>RAW</b> can actually happen among the data hazards in the MIPS 5-stage pipeline.',
    ana: { title: 'Jams on the Line', mission: 'Spot the three kinds of jam, and learn which ones this assembly line can never have.' },
    chals: [
      { t: 'sort', tier: 1, q: 'Which kind of hazard is each?', buckets: ['Structural', 'Data', 'Control'], items: [['Two instructions need the same memory in the same cycle', 0], ['An instruction needs a value a previous one has not produced yet', 1], ['Which instruction to fetch next depends on an undecided branch', 2]], why: 'Structural is resources, data is values, control is the branch decision.' },
      { t: 'sort', tier: 2, q: 'Can this data hazard happen in the MIPS 5-stage pipeline?', buckets: ['Can happen', 'Cannot happen'], items: [['RAW (read after write)', 0], ['WAR (write after read)', 1], ['WAW (write after write)', 1]], why: 'Only RAW is real here.' },
