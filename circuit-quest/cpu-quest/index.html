      { t: 'choice', tier: 2, q: 'Why can WAR and WAW not happen in this pipeline?', opts: ['Every instruction reads in stage 2 and writes in stage 5, in order', 'Because MIPS has no registers to conflict', 'Because forwarding prevents them', 'Because stalls prevent them'], a: 0, hint: 'Same stages for everyone.', why: 'Every instruction takes exactly 5 stages, reading in ID and writing in WB. An earlier instruction always reaches those stages first. A pipeline with variable-length stages does not get this for free.' },
      { t: 'choice', tier: 2, q: 'What are the two ways to fix a RAW hazard?', opts: ['The compiler inserts nops, or hardware forwards the value', 'Add more registers, or add more memory', 'Slow the clock, or add a stage', 'Use beq, or use bne'], a: 0, hint: 'One wastes cycles, the other costs wiring.', why: 'Nops waste cycles every time. Forwarding costs extra wiring but no cycles, and it is the real fix.' },
      { t: 'choice', tier: 2, q: 'In <code>beq $1,$2,L1</code>, what is the control hazard?', opts: ['The pipeline does not yet know whether to fetch the next instruction or the one at L1', 'The two registers are the same', 'The branch needs memory', 'L1 is too far away'], a: 0, hint: 'The branch outcome arrives cycles after the fetch.', why: 'The outcome (PCSrc) is known only when the branch reaches EX/MEM, but the pipeline already needed to fetch the next instruction 2–3 cycles earlier.' },
      { t: 'num', tier: 3, boss: true, q: 'Count the <b>RAW</b> dependencies in this code (each register read that depends on an earlier write):' + pre('add $8, $5, $5\nadd $2, $5, $8\nsub $3, $8, $4\nadd $2, $2, $3\nadd $2, $5, $7\nadd $7, $5, $4'), a: 4, tol: 0, abs: 0.01, hint: 'Line 2 reads $8. Line 3 reads $8. Line 4 reads $2 and $3.', why: 'Line 2: RAW on $8. Line 3: RAW on $8. Line 4: RAW on $2 (line 2) and on $3 (line 3). That is 4. Line 5 writes $2 again (a WAW pattern, not a RAW).' },
    ] },

  /* 17 */ { n: 17, lec: '17', diff: 4, topic: 'Tracing RAW Hazards Cycle by Cycle', blurb: 'Which reads are too early, the split-cycle register file, and the load-use case.',
    intro: 'A RAW hazard is a timing question: when is the value written (WB, stage 5) versus when does the next instruction read it (ID, stage 2)? The register file writes in the <b>first half</b> of a cycle and reads in the <b>second half</b>, so a same-cycle read still works.',
    ana: { title: 'Is the Part Ready Yet?', mission: 'Trace each part tick by tick. Is it ready when the next station needs it?' },
    chals: [
      { t: 'num', tier: 2, gen() { const d = rnd(1, 4); return { q: '<code>sub $2,$1,$3</code> writes <code>$2</code> in cycle 5. An instruction <span class="m">' + d + '</span> position' + (d > 1 ? 's' : '') + ' after it reads <code>$2</code> in its ID stage, in cycle ' + (2 + d) + '. How many cycles <b>too early</b> is the read? (0 if it is fine.)', a: Math.max(0, 5 - (2 + d)), tol: 0, abs: 0.01, hint: 'Compare cycle 5 with cycle ' + (2 + d) + '. A same-cycle read works.', why: 'Write in cycle 5, read in cycle ' + (2 + d) + ': ' + Math.max(0, 5 - (2 + d)) + ' early.' + (d === 3 ? ' Same cycle still works because of the split-cycle register file.' : '') }; } },
      { t: 'sort', tier: 2, q: 'After <code>sub $2,$1,$3</code> (writes $2 in cycle 5), does each instruction get the right value without forwarding?', buckets: ['Stale value (hazard)', 'Correct value'], items: [['<code>and $12,$2,$5</code>  (reads in cycle 3)', 0], ['<code>or $13,$6,$2</code>  (reads in cycle 4)', 0], ['<code>add $14,$2,$2</code>  (reads in cycle 5)', 1], ['<code>sw $15,100($2)</code>  (reads in cycle 6)', 1]], why: 'Reads in cycles 3 and 4 are too early. Cycle 5 works thanks to write-first-half, read-second-half. Cycle 6 is simply late enough.' },
      { t: 'choice', tier: 1, q: 'Why does a read in the <b>same cycle</b> as the write still get the right value?', opts: ['The register file writes in the first half of the cycle and reads in the second half', 'Forwarding hardware fixes it', 'The ALU waits one cycle', 'Both stages share the same wires'], a: 0, hint: 'Think of a cycle as two halves.', why: 'This quiet trick resolves the case with no extra hardware. It does not help the earlier reads.' },
      { t: 'choice', tier: 2, q: 'An instruction right after a <code>lw</code> uses the loaded register. With full forwarding, how many stall cycles are needed?', opts: ['1', '0', '2', '3'], a: 0, hint: 'A load’s value is ready only at the end of MEM.', why: 'This is the load-use hazard, the one RAW case forwarding alone cannot fix. One bubble is needed no matter what.' },
      { t: 'num', tier: 2, gen() { const n = rnd(3, 8); return { q: 'With no hazards and no stalls, in which cycle does instruction number <span class="m">' + n + '</span> finish?', a: n + 4, tol: 0, abs: 0.01, hint: 'Instruction n finishes in cycle n + 4.', why: 'n + 4 = ' + (n + 4) + '.' }; } },
      cyc(1),
    ] },

  /* 18 */ { n: 18, lec: '18', diff: 4, topic: 'Forwarding: the Hardware Fix', blurb: 'Route a result straight from the pipeline register to the ALU input that needs it.',
    intro: 'A <b>forwarding unit</b> watches EX/MEM and MEM/WB. If either holds the value the current instruction needs, it steers it straight into the ALU input. Two mux controls, <b>A</b> (first ALU input) and <b>B</b> (second), choose between 0 (register file), 1 (EX/MEM) and 2 (MEM/WB). If both could apply, forward the <b>more recent</b> one.',
    ana: { title: 'Passing Parts Sideways', mission: 'A helper watches the trays and hands each part to the next station directly.' },
    chals: [
      { t: 'choice', tier: 1, q: 'What does forwarding do?', opts: ['Sends a result straight from a pipeline register to the ALU input that needs it', 'Writes the result to memory early', 'Skips the ID stage', 'Stalls the pipeline automatically'], a: 0, hint: 'No waiting for the register-file write.', why: 'The value does not wait to reach the register file. It is routed sideways from where it already sits in the pipeline.' },
      { t: 'match', tier: 1, q: 'Match each forwarding mux value to where the operand comes from.', pairs: [['0', 'The register file (normal case)'], ['1', 'EX/MEM, the instruction just ahead'], ['2', 'MEM/WB, two instructions ahead']], why: 'EX hazard gives 1. MEM hazard gives 2.' },
      { t: 'choice', tier: 2, q: '<code>sub $2,$5,$1</code> then <code>and $2,$2,$5</code>, then <code>or $13,$6,$2</code>. Two earlier instructions write $2. Which value does <code>or</code> use?', opts: ['The one from <code>and</code> (EX/MEM), the most recent', 'The one from <code>sub</code> (MEM/WB), the oldest', 'The register file value', 'It must stall'], a: 0, hint: 'More recent wins.', why: 'Check the MEM hazard only if the EX hazard condition is false (an else-if). Otherwise the older value would overwrite the newer one.' },
      { t: 'sort', tier: 2, q: 'Which forwarding mux feeds each operand?', buckets: ['Mux A (first ALU input)', 'Mux B (second ALU input)'], items: [['Base-address register (rs) of a <code>sw</code>', 0], ['Value-to-store register (rt) of a <code>sw</code>', 1], ['First source register of an <code>add</code>', 0], ['Second source register of an <code>add</code>', 1]], why: 'sw needs no special hardware. Its two sources map onto the same A and B inputs as any other instruction.' },
      { t: 'choice', tier: 3, boss: true, q: '<code>add $1,$4,$5</code> then <code>sw $1,4($7)</code>. The sw stores $1. What does the forwarding unit do?', opts: ['Sets B = 1, forwarding add’s result into the store-value input. A stays 0', 'Sets A = 1 and B = 0', 'Sets A = 2', 'Stalls for one cycle'], a: 0, hint: 'Is $1 the sw’s rs or its rt?', why: '$1 is the sw’s <b>rt</b> (value to store), so mux B takes it from EX/MEM (B = 1). The base register $7 is untouched, so A = 0.' },
      { t: 'choice', tier: 2, q: '<code>lw $2,0($5)</code>, <code>and $3,$4,$5</code>, <code>or $13,$3,$2</code>. How does <code>or</code> get both operands?', opts: ['$3 from the and (A = 1), $2 from the lw two back (B = 2). No conflict', 'It must stall for two cycles', 'Both from the register file', 'Both from EX/MEM'], a: 0, hint: 'They land on different mux inputs.', why: 'Two hazards on two different operands do not conflict, so the existing logic handles it unchanged.' },
    ] },

  /* 19 */ { n: 19, lec: '19', diff: 4, topic: 'Hazard Detection: Stalling the One Case Forwarding Cannot Fix', blurb: 'The load-use stall, the bubble, and how hardware beats a compiler nop.',
    intro: 'When the instruction right after a <code>lw</code> needs the loaded value, it is needed one stage too early. A <b>hazard detection unit</b> in ID catches it and stalls for one cycle: freeze the PC, freeze IF/ID, and deassert the control signals (a bubble).',
    ana: { title: 'The Supervisor Calls Freeze', mission: 'One part cannot be passed sideways in time. Learn when to freeze the line for one tick.' },
    chals: [
      { t: 'choice', tier: 1, q: 'Why can forwarding not fix the load-use hazard?', opts: ['The loaded value does not exist until the end of the lw’s MEM stage, one stage too late', 'There are not enough forwarding wires', 'lw has no destination register', 'Forwarding only works for sw'], a: 0, hint: 'You cannot send a value back in time.', why: 'Forwarding can route a value sideways within the same cycle, but it cannot hand over something that has not been produced yet.' },
      { t: 'match', tier: 2, q: 'Match each part of the stall condition to what it checks.', pairs: [['ID/EX.MemRead', 'The instruction ahead is a load'], ['ID/EX.RegisterRt == IF/ID.RegisterRs or Rt', 'The next instruction needs the register the load writes'], ['stall()', 'Freeze the PC and IF/ID, insert a bubble']], why: 'If the instruction ahead is a load whose destination the next instruction needs, stall for one cycle.' },
      { t: 'choice', tier: 2, q: 'What happens during the 1-cycle hardware stall?', opts: ['PC and IF/ID freeze and the control signals are cleared (a bubble goes down the line)', 'The whole pipeline is flushed', 'The load is re-fetched', 'The clock stops for the whole chip'], a: 0, hint: 'Nothing already in the pipeline is lost.', why: 'Instructions behind are pushed back one cycle, but nothing is lost or re-fetched. The bubble is functionally a nop.' },
      { t: 'sort', tier: 2, q: 'Hardware stall or compiler nop?', buckets: ['Hardware stall', 'Compiler nop'], items: [['Inserted automatically when the condition fires', 0], ['Written into the program, so the code gets bigger', 1], ['PC and IF/ID freeze for one cycle', 0], ['A real instruction that flows through all five stages', 1]], why: 'Same effect, different mechanism. The stall costs no extra instructions in the program.' },
      { t: 'num', tier: 2, gen() { const N = rnd(4, 7), s = rnd(1, 2); return { q: 'A program has <span class="m">' + N + '</span> instructions with <span class="m">' + s + '</span> load-use stall' + (s > 1 ? 's' : '') + '. The pipeline has forwarding and hardware stalls, each stall costing 1 cycle. In which cycle does the last instruction finish?', a: N + 4 + s, tol: 0, abs: 0.01, hint: 'No-stall finish is N + 4. Add one per stall.', why: N + ' + 4 + ' + s + ' = ' + (N + 4 + s) + '.' }; } },
      cyc(1),
    ] },

  /* 20 */ { n: 20, lec: '20', diff: 5, topic: 'Branch Hazards: Resolve Earlier', blurb: 'Where the branch is decided sets the penalty, and deciding early creates new data hazards.',
    intro: 'The earlier a branch is decided, the fewer wrong instructions get fetched. Decided in <b>MEM</b>: 3 bubbles when taken. In <b>EX</b>: 2. In <b>ID</b>: 1. The catch: if decided in ID, the two registers it compares must already be correct.',
    ana: { title: 'Decide at the First Gate', mission: 'Check the ticket at the last gate and every wrong car turns around. Check early, but be sure the ticket is ready.' },
    chals: [
      { t: 'match', tier: 1, q: 'Match where the branch is resolved to the bubbles when it is taken.', pairs: [['MEM stage', '3 bubbles'], ['EX stage', '2 bubbles'], ['ID stage', '1 bubble']], why: 'The later you decide, the more wrong-path instructions you have already fetched.' },
      { t: 'num', tier: 2, gen() { const st = pick([['MEM', 3], ['EX', 2], ['ID', 1]]), t = pick([10, 20, 40]); return { q: 'A loop’s branch is taken <span class="m">' + t + '</span> times and is resolved in the <b>' + st[0] + '</b> stage. How many cycles are lost to bubbles in total?', unit: 'cycles', a: t * st[1], tol: 0, abs: 0.01, hint: 'Bubbles per taken branch × number of taken branches.', why: st[1] + ' bubble' + (st[1] > 1 ? 's' : '') + ' × ' + t + ' = ' + t * st[1] + ' cycles.' }; } },
      { t: 'choice', tier: 2, q: 'What is the catch of resolving the branch in the ID stage?', opts: ['The registers it compares must already be correct, so nearby adds or loads can force a stall', 'It needs a second ALU for every instruction', 'Branches can no longer be taken', 'It makes the clock twice as slow'], a: 0, hint: 'The compare happens early, before earlier results may be written.', why: 'A nearby add can be forwarded into ID, but a lw right before the branch cannot be helped by forwarding alone.' },
      { t: 'choice', tier: 2, q: 'The branch is decided in ID. A <code>lw $1,...</code> comes <b>immediately</b> before <code>beq $1,$4,L</code>. How many stall cycles?', opts: ['2', '0', '1', '3'], a: 0, hint: 'This is the worst of the four cases.', why: 'Case 4: lw right before the beq needs 2 stall cycles. Forwarding alone cannot help. With one instruction between them, 1 stall is needed.' },
      { t: 'choice', tier: 2, q: '<code>add $1</code>, <code>add $4</code>, <code>sub $3</code>, then <code>beq $1,$4</code> with the branch decided in ID. How many stalls?', opts: ['0. The values are already in the register file by ID', '1', '2', '3'], a: 0, hint: 'How far back were $1 and $4 written?', why: 'Case 1: the earlier instructions have already written back by the time the beq reads in ID, so no stall is needed.' },
      { t: 'num', tier: 3, boss: true, gen() { const n = pick([20, 40, 100]), st = pick([['MEM', 3], ['EX', 2], ['ID', 1]]); return { q: 'A loop runs <span class="m">' + n + '</span> iterations. Its branch is taken every iteration except the last, and is resolved in <b>' + st[0] + '</b>. How many bubble cycles are lost in total?', unit: 'cycles', a: (n - 1) * st[1], tol: 0, abs: 0.01, hint: 'The branch is taken n − 1 times.', why: '(' + n + ' − 1) × ' + st[1] + ' = ' + (n - 1) * st[1] + ' cycles.' }; } },
    ] },

  /* 21 */ { n: 21, lec: '21', diff: 5, topic: 'Branch Delay Slots and Jump Hazards', blurb: 'Fill the flushed slot with useful work, and see where jumps resolve.',
    intro: 'A taken branch still costs 1 flushed cycle. A <b>branch delay slot</b> lets the compiler put an instruction there that runs no matter what, so nothing is wasted. A flag in the branch tells the hardware not to flush it.',
    ana: { title: 'Useful Work in the Gap', mission: 'Put a job in the gap that has to happen either way, so no slot is scrapped.' },
    chals: [
      { t: 'choice', tier: 1, q: 'What is a branch delay slot for?', opts: ['To fill the cycle after a branch with an instruction that runs either way, so it is not wasted', 'To make branches slower on purpose', 'To store the branch target', 'To skip the ID stage'], a: 0, hint: 'Otherwise that cycle is flushed.', why: 'The compiler finds an instruction independent of the branch and moves it into the slot. A flag tells the hardware not to flush it.' },
      { t: 'sort', tier: 2, q: 'Can the compiler move this instruction into the delay slot?', buckets: ['Can fill the slot', 'Cannot'], items: [['An instruction independent of the branch decision', 0], ['The instruction the branch’s compared register depends on', 1], ['The lw whose result the beq compares', 1], ['A store that does not touch the compared registers', 0]], why: 'The slot runs whether or not the branch is taken, so it must not depend on the branch outcome, and the branch must not depend on it.' },
      { t: 'choice', tier: 2, q: 'What does the flag in the branch instruction tell the hardware?', opts: ['Do not flush the instruction in the delay slot', 'Flush two instructions', 'Skip the branch', 'Stall for one cycle'], a: 0, hint: 'Normally the instruction after a taken branch is flushed.', why: 'If the flag says the slot is used, the hardware does not flush the instruction after the branch.' },
      { t: 'match', tier: 2, q: 'Match each jump to where it is resolved.', pairs: [['j', 'ID'], ['jal', 'ID'], ['jr', 'ID (reads its register in ID)']], why: 'The jump-target adder sits in ID, and jr reads its register in ID. A jump therefore costs 1 flushed instruction.' },
      { t: 'num', tier: 2, gen() { const n = pick([10, 25, 50]); return { q: 'A loop’s branch is taken <span class="m">' + n + '</span> times. Without a delay slot each taken branch flushes 1 cycle. With the slot filled with useful work, how many cycles are saved?', unit: 'cycles', a: n, tol: 0, abs: 0.01, hint: 'One saved per taken branch.', why: 'Each taken branch no longer wastes its slot, so ' + n + ' cycles are saved.' }; } },
      { t: 'choice', tier: 3, boss: true, q: 'A taken branch resolved in ID has a delay slot filled with an instruction independent of the branch. How many wasted cycles does the taken branch cost?', opts: ['0', '1', '2', '3'], a: 0, hint: 'The slot now does useful work.', why: 'The one slot that would have been flushed does useful work instead, so the penalty is gone.' },
    ] },

  /* 22 */ { n: 22, lec: '22', diff: 5, topic: 'Hazard Practice: Loads, Stores and Jumps', blurb: 'Store/load pairs, where jumps resolve, and the lw / addi / jr boss.',
    intro: 'Find where the value is produced (a load makes it at the end of MEM), find where it is needed (EX for ALU math and addresses, ID for a jump’s register), and the gap is the stall count.',
    ana: { title: 'The Last Inspection', mission: 'Final inspection of the line: stores, loads and jumps.' },
    chals: [
      { t: 'choice', tier: 1, q: '<code>sw $t0,0($a0)</code> then <code>lw $t1,0($a0)</code>. Is there a pipeline hazard?', opts: ['No. No register is written by the sw, and the store reaches memory before the load', 'Yes, a RAW on $t0', 'Yes, a RAW on $a0', 'Yes, a structural hazard always'], a: 0, hint: 'Which register does the sw write?', why: 'The sw writes no register, so there is no register dependency. Both touch the same memory word, but the store reaches memory first.' },
      { t: 'choice', tier: 2, q: '<code>lw $t0,0($a0)</code> then <code>sw $t0,0($a1)</code>. How many stalls?', opts: ['1 stall, then forward from MEM/WB', '0', '2', '3'], a: 0, hint: 'The sw needs $t0 as its data in EX.', why: 'The loaded value goes through the EX-stage mux, so this is a load-use case: 1 stall, then forward.' },
      { t: 'choice', tier: 2, q: '<code>lw $t0,0($a0)</code> then <code>sw $t1,4($t0)</code>. How many stalls?', opts: ['1 stall, then forward', '0', '2', 'It cannot be fixed'], a: 0, hint: '$t0 is the address base here.', why: '$t0 is the base address, needed in EX to compute 4 + $t0. Load-use again: 1 stall.' },
      { t: 'choice', tier: 2, q: 'Which stage resolves <code>j</code>, <code>jal</code> and <code>jr</code>, and how many flush cycles does a jump cost?', opts: ['ID, with 1 flush cycle', 'EX, with 2 flush cycles', 'MEM, with 3 flush cycles', 'WB, with 4 flush cycles'], a: 0, hint: 'The jump-target adder sits in ID.', why: 'The jump is known at the end of ID, so only the one instruction fetched behind it (in IF) is wrong and gets flushed.' },
      { t: 'num', tier: 2, gen() { const j = rnd(5, 40); return { q: 'A program executes <span class="m">' + j + '</span> jumps. Each costs 1 flushed cycle. How many cycles are lost to jump flushes?', unit: 'cycles', a: j, tol: 0, abs: 0.01, hint: 'One per jump.', why: j + ' × 1 = ' + j + ' cycles.' }; } },
      { t: 'choice', tier: 3, boss: true, q: 'How many stall and flush cycles does this cost, assuming full forwarding?' + pre('lw   $ra, 0($s0)\naddi $s0, $s0, 4\njr   $ra'), opts: ['1 stall and 1 flush', '2 stalls and no flush', 'No stall and 1 flush', '1 stall and no flush'], a: 0, hint: 'jr needs $ra in ID, but lw only has it at the end of MEM.', why: 'jr wants $ra in ID, but the load produces it at the end of MEM, so jr waits one cycle (stall). Then, since it is a jump, the instruction fetched behind it is flushed. Full forwarding cannot send a value that has not been produced yet.' },
    ] },
];
CPU_LEVELS.forEach(l => { const a = ANA_L[l.lec]; if (a) { l.ana.key = a.key; l.ana.map = a.map; } });

/* Teaching pages for CPU Quest, levels 1-8. Each level has three lessons (warm-up, challenge, hard). They show before the questions. */
const F = x => '<div class="formula">' + x + '</div>';
const EX = (t, x) => '<div class="example"><b class="eh">' + t + '</b>' + x + '</div>';
const TRAP = x => '<div class="trap"><b class="eh">Watch out</b>' + x + '</div>';
const LEARN = (idx, topic, ls) => {
  const L = CPU_LEVELS[idx - 1];
  if (!L || L.topic !== topic) throw new Error('lesson/level mismatch at ' + idx + ': ' + (L && L.topic) + ' vs ' + topic);
  L.learn = { 1: ls[0], 2: ls[1], 3: ls[2] };
};

LEARN(1, 'Processor History and the Big Picture', [
 { t: 'Four chips that tell the story', h:
  '<p>A <b>processor</b> (CPU) is the chip that follows a program one instruction at a time. Four landmarks show how fast things changed:</p>' +
  '<ul><li><b>DYSEAC (1954)</b>: the first mobile computer. It was carried in <b>two tractor trailers</b>.</li>' +
  '<li><b>Intel 4004 (1971)</b>: the first microprocessor, a whole CPU on one chip with <b>2,300 transistors</b>.</li>' +
  '<li><b>Intel 8086 (1978)</b>: eight 16-bit registers. Its family name gave us the word <b>x86</b>.</li>' +
  '<li><b>Intel Core i7-8086K (2018)</b>: runs at up to <b>5 GHz</b>, forty years after the 8086.</li></ul>' +
  '<p>The order, oldest to newest: 1954, 1971, 1978, 2018.</p>' +
  EX('Today', 'The NVIDIA V100 graphics processor (GPU) has <b>21 billion transistors</b> and <b>5,120 cores</b> on one chip.'),
  a: 'The first factory filled two delivery trucks just to exist. Each new plant was smaller and could make more per hour.' },
 { t: 'Why chips shrank, and why we got many cores', h:
  '<p><b>Moore’s Law</b> is the observation that the number of transistors on a chip keeps growing, by roughly 35% a year, because transistors keep getting smaller.</p>' +
  '<p>Transistor size over time (the length of the smallest feature): <b>250 nm</b> (1997), 130, 65, 14, 7, then about <b>3 nm</b> around 2021.</p>' +
  '<p>To find how much it shrank, divide old by new:</p>' + F('shrink factor = old size ÷ new size') +
  EX('Example', 'From 130 nm to 65 nm: 130 ÷ 65 = <b>2×</b>. From 250 nm to 14 nm: 250 ÷ 14 ≈ <b>17.9×</b>.') +
  '<p>Once you can fit that many transistors, the best use is not one giant processor but <b>many cores</b> on the same chip. That is why phones, laptops and GPUs all have several.</p>',
  a: 'Each year the machines at the station get smaller, so the same floor space holds more of them. Instead of one huge worker, you hire many.' },
 { t: 'Three ways to look at a computer', h:
  '<p>This course studies the same machine from <b>three angles</b>:</p>' +
  '<ul><li><b>Compiler</b>: how code you write becomes machine language.</li>' +
  '<li><b>Software engineer</b>: writing programs that fit one specific piece of hardware.</li>' +
  '<li><b>Hardware architect</b>: designing the datapath and reasoning about performance. This is the main angle.</li></ul>' +
  '<p>What you will design is <b>one simple core</b>. A GPU with 5,120 cores is that same idea copied thousands of times (80 groups of 64 cores).</p>' +
  EX('Check yourself', '“How fast does it run if we change the design?” is a hardware architect question. “How does <code>x = y + z</code> turn into bits?” is a compiler question.'),
  a: 'You will learn to design one worker and one station. A giant plant is that same station repeated thousands of times.' }
]);

LEARN(2, 'Registers and the 3-Operand Rule', [
 { t: 'Registers: the 32 fast bins', h:
  '<p>An <b>ISA</b> (instruction set architecture) is the contract between software and hardware: the list of instructions the chip understands. The one we use is <b>MIPS</b>.</p>' +
  '<p>MIPS has <b>32 registers</b>. Each holds one <b>32-bit word</b>. Registers are the only place arithmetic can read from and write to. They have names and numbers:</p>' +
  '<ul><li><code>$zero</code> = register <b>0</b>. It always holds 0.</li><li><code>$v0–$v1</code> = 2–3: return values.</li><li><code>$a0–$a3</code> = 4–7: arguments.</li><li><code>$t0–$t7</code> = 8–15: temporaries.</li><li><code>$s0–$s7</code> = 16–23: saved.</li><li><code>$t8–$t9</code> = 24–25: more temporaries.</li><li><code>$sp</code> = <b>29</b>: stack pointer.</li><li><code>$ra</code> = <b>31</b>: return address.</li></ul>' +
  EX('Example', '<code>$s0</code> is 16 and <code>$s3</code> is 16 + 3 = <b>19</b>. <code>$t2</code> is 8 + 2 = <b>10</b>.'),
  a: 'Your station has 32 labelled parts bins, each holding one part. All the work happens on parts taken from these bins.' },
 { t: 'The 3-operand rule', h:
  '<p>MIPS is rigid on purpose: every arithmetic instruction has <b>exactly three operands</b>, and the <b>destination comes first</b>.</p>' + F('add rd, rs, rt      means      rd = rs + rt') +
  EX('Example', '<code>add $s0, $s1, $s2</code> puts $s1 + $s2 into $s0.') +
  '<p>Since an add only has two sources, adding three things takes two instructions.</p>' +
  EX('Example: a = b + c + d', pre('add a, b, c\nadd a, a, d')) +
  '<p>A bit more code buys much simpler hardware. That trade is a theme of the whole course.</p>',
  a: 'Every work order has exactly three lines: where to put the result, then the two bins to take parts from. A job with three inputs needs two work orders.' },
 { t: 'Temporary or saved?', h:
  '<p>Two registers can look identical but come with a promise:</p>' +
  '<ul><li><b>$t registers</b> are <b>temporary</b>. Any function may overwrite them freely.</li>' +
  '<li><b>$s registers</b> are <b>saved</b>. If a function wants to use one, it must save the old value first and <b>restore</b> it before returning.</li></ul>' +
  EX('Example', 'A function wants to use <code>$t0</code>, <code>$s0</code> and <code>$a0</code>. Only <b>$s0</b> must be saved and restored, because the caller expects its saved registers back unchanged.') +
  TRAP('Do not confuse the number with the group. “Register number” means the number (like 16 for $s0). “Register name” means the label.'),
  a: 'Scratch bins can be emptied by anyone. Reserved bins belong to the caller, so if you borrow one you must put the original part back.' }
]);

LEARN(3, 'Memory Operands: lw, sw and Byte Addressing', [
 { t: 'Memory is outside the registers', h:
  '<p>Registers are few. Big data (arrays, variables) lives in <b>memory</b>. The ALU only works on registers, so we move values with two instructions:</p>' +
  '<ul><li><code>lw</code> (load word): memory → register.</li><li><code>sw</code> (store word): register → memory.</li></ul>' +
  F('lw  $t0, offset($s2)      t0 = Memory[ $s2 + offset ]') +
  '<p>Memory is addressed by the <b>byte</b>, not the word. A 32-bit word is 4 bytes, so a word’s address is always a multiple of 4.</p>' +
  EX('Example', 'Can <code>g = h + A[3]</code> be done in one instruction? No. First <code>lw</code> A[3] into a register, then <code>add</code>.'),
  a: 'The warehouse across the lot is where big parts live. You cannot work on a part in the warehouse. You fetch it to a bin, work on it, and send it back.' },
 { t: 'Why array steps are 4 apart', h:
  '<p>Elements of an <code>int</code> array are 4 bytes each, so the next element is 4 bytes away, not 1.</p>' + F('address of A[k] = base + 4 × k') +
  EX('Example', 'Array A starts at byte 2000. A[5] is at 2000 + 4 × 5 = <b>2020</b>.') +
  '<p>Going the other way, an <b>offset in bytes</b> divided by 4 gives the element number.</p>' +
  EX('Example', '<code>lw $s1, 12($s2)</code> with $s2 holding A’s start loads element 12 ÷ 4 = <b>A[3]</b>.') +
  TRAP('The offset in <code>lw</code> is in <b>bytes</b>. Writing 3 would not give you A[3].'),
  a: 'Every part in the warehouse takes four slots on the shelf. To reach the 5th part, skip 5 × 4 slots.' },
 { t: 'Looking up a computed index', h:
  '<p>When the index is in a register (<code>A[k]</code>), the hardware cannot multiply for you inside <code>lw</code>. You build the address in three steps:</p>' +
  '<ol><li>Multiply the index by 4: <code>sll $t1, $a2, 2</code> (shifting left by 2 is ×4).</li><li>Add the base address: <code>add $t2, $t1, $a0</code>.</li><li>Load from that address: <code>lw $t3, 0($t2)</code>.</li></ol>' +
  EX('Example: f = A[B[k]]', 'Do the three steps for B[k] to get its value. Then do the three steps again using that value as the index into A. That is <b>6 instructions</b>.') +
  EX('Reading code', pre('lw $t0, 4($s0)\nlw $t1, 12($s0)\nadd $t2, $t0, $t1') + 'Offsets 4 and 12 mean A[1] and A[3]. $t2 = A[1] + A[3].'),
  a: 'To fetch the part named by a ticket: multiply the ticket number by four to find the shelf slot, add where the shelf starts, then go and get it. If the part itself is another ticket, repeat.' }
]);

LEARN(4, 'Bits and Immediates', [
 { t: 'Constants inside the instruction', h:
  '<p>An <b>immediate</b> is a constant written right inside the instruction. It saves a trip to memory.</p>' + F('addi rt, rs, imm      rt = rs + imm') +
  '<p>The immediate is a 16-bit <b>signed</b> number, so it can be negative. MIPS has no <code>subi</code>. To subtract a constant, add a negative one.</p>' +
  EX('Example', 'Subtract 1 from $s1 into $s2: <code>addi $s2, $s1, -1</code>.'),
  a: 'Some work orders have the number already printed on them, so nobody has to fetch it from a bin.' },
 { t: 'Shifting: multiply and divide by 2', h:
  '<p>Shifting moves all the bits sideways. Each step left <b>doubles</b> the number. Each step right <b>halves</b> it.</p>' +
  '<ul><li><code>sll rd, rt, n</code>: shift left logical = multiply by 2<sup>n</sup>.</li><li><code>srl rd, rt, n</code>: shift right logical = divide by 2<sup>n</sup>.</li></ul>' +
  EX('Example', '$t1 = 3. After <code>sll $t0, $t1, 2</code>, $t0 = 3 × 2² = <b>12</b>. In binary, 0011 shifted left twice is 1100.') +
  '<p>A shift is cheaper in hardware than an add, which is why array indexing uses <code>sll</code> to multiply by 4.</p>',
  a: 'A slide rule: slide the number one notch left and it doubles. Slide two notches and it quadruples.' },
 { t: 'and, or, nor: working bit by bit', h:
  '<p>These compare two numbers <b>one bit at a time</b>.</p>' +
  '<ul><li><code>and</code>: the result bit is 1 only if <b>both</b> are 1. Use it as a <b>mask</b> to keep some bits and clear the rest.</li><li><code>or</code>: 1 if <b>either</b> is 1. Use it to <b>set</b> bits without disturbing others.</li><li><code>nor</code>: NOT of or. Since MIPS has no <code>not</code>, use <code>nor rd, rs, $zero</code>, which flips every bit.</li></ul>' +
  EX('Example: and', '1100 <b>and</b> 1010 = 1000. In decimal, 12 and 10 = <b>8</b>.') +
  EX('Example: or', '1100 <b>or</b> 1010 = 1110. In decimal, 12 or 10 = <b>14</b>.') +
  EX('Example: NOT in 8 bits', 'v = 00001101 (13). nor with $zero flips every bit: 11110010 = 242, which is <b>255 − 13</b>.'),
  a: 'A stencil laid over a part lets only certain spots through (and). A stamp adds marks without touching the others (or). A flip switch turns every mark to its opposite (nor).' }
]);

LEARN(5, 'Branches and Instruction Formats', [
 { t: 'Making decisions', h:
  '<p>Normally the CPU runs instructions one after another. A <b>branch</b> changes that.</p>' +
  '<ul><li><code>beq rs, rt, Label</code>: branch to Label if rs <b>equals</b> rt.</li><li><code>bne rs, rt, Label</code>: branch if they are <b>not equal</b>.</li><li><code>j Label</code>: always jump.</li></ul>' +
  '<p>If the branch is not taken, the CPU just runs the next line. These three build every <code>if</code> and every loop.</p>' +
  EX('Example', '<code>beq $s1, $s2, L1</code> goes to L1 when $s1 and $s2 hold the same value.'),
  a: 'A skip-ahead work order says: if these two bins match, jump to order number X. Otherwise carry on with the next one.' },
 { t: 'Compiling if / else', h:
  '<p>Compilers write the test <b>inverted</b>: branch away when the condition is false, so the “then” block simply falls through.</p>' +
  EX('Example: if (i == j) f = g + h; else f = g − h;', pre('      bne $s3, $s4, Else\n      add $s0, $s1, $s2\n      j   Exit\nElse: sub $s0, $s1, $s2\nExit: ...') + 'The <code>j Exit</code> ends the “then” block so it skips the else block.') +
  '<p>Counting instructions run: if $s3 equals $s4, the bne is not taken, so <b>bne, add, j</b> run = 3. If they differ, the bne is taken and runs <b>bne, sub</b> = 2.</p>',
  a: 'To handle “if the tickets match, do A, otherwise B”, the order says: if they do NOT match, skip over A and go to B. After A, a jump skips over B.' },
 { t: 'The three instruction shapes', h:
  '<p>Every MIPS instruction is exactly <b>32 bits</b>, and it has one of three shapes. The first 6 bits are always the <b>op</b> code.</p>' +
  '<ul><li><b>R-type</b> (register math): op, rs, rt, rd, shamt, funct. Examples: add, sub, slt.</li><li><b>I-type</b> (immediate or memory): op, rs, rt, 16-bit constant or address. Examples: lw, sw, addi, beq, bne.</li><li><b>J-type</b> (jump): op, 26-bit address. Example: j.</li></ul>' +
  '<p>Because every instruction is the same width and shaped like one of three templates, the hardware can decode any of them quickly.</p>' +
  TRAP('<code>beq</code> and <code>bne</code> are I-type, not J-type. <code>j</code> is the only plain jump format here.'),
  a: 'All the barcode stickers are the same size. There are only three layouts for what is printed on them, so the scanner never has to guess.' }
]);

LEARN(6, 'Reverse-Engineer tomato()', [
 { t: 'What each kind of line is for', h:
  '<p>To read compiled code, sort each line into a job:</p>' +
  '<ul><li><b>Build an address</b>: <code>sll</code> (scale an index by 4) and <code>add</code> (add the base), or <code>addi</code> applied to an address.</li><li><b>Read memory</b>: <code>lw</code>.</li><li><b>Write memory</b>: <code>sw</code>.</li><li><b>Do math</b>: <code>add</code> on values.</li></ul>' +
  EX('Example', pre('sll $t0, $a2, 2    ; i × 4\nadd $t0, $a0, $t0  ; &amp;A[i]  (an address)') + 'After these two lines <code>$t0</code> holds the <b>address</b> of A[i], not a value.'),
  a: 'Some lines figure out which shelf to go to. Some fetch from the shelf. Some put something back. Some just combine parts.' },
 { t: 'Offsets are bytes: turn them into elements', h:
  '<p>Any constant added to a base address is in <b>bytes</b>. Divide by 4 to get how many elements away it is.</p>' + F('element offset = byte offset ÷ 4') +
  EX('Example', '$t0 holds &amp;A[i]. Then <code>lw $s0, 12($t0)</code> loads A[i + 12÷4] = <b>A[i+3]</b>. And <code>lw $s0, -8($t0)</code> loads <b>A[i−2]</b>.') +
  EX('Address arithmetic', '<code>addi $t2, $t0, -16</code> moves the address back 16 bytes = 4 elements. $t2 now holds <b>&amp;A[i−4]</b>, an address, not A[i−4] itself.'),
  a: 'The sheet says to go 12 slots further. Each part takes 4 slots, so that is 3 parts further down the shelf.' },
 { t: 'Writing the C line from the code', h:
  '<p>Follow it step by step and track what each register holds:</p>' +
  EX('Example', pre('sll  $t0,$a2,2     ; t0 = 4i\nadd  $t0,$a0,$t0   ; t0 = &amp;A[i]\nsll  $t1,$a3,2\nadd  $t1,$a1,$t1   ; t1 = &B[j]\nlw   $s0,12($t0)   ; s0 = A[i+3]\naddi $t2,$t0,-16   ; t2 = &amp;A[i-4]\nlw   $t0,4($t2)    ; t0 = A[i-4+1] = A[i-3]\nadd  $t0,$t0,$s0   ; t0 = A[i-3] + A[i+3]\nsw   $t0,8($t1)    ; B[j+2] = ...') + 'The whole thing is <b>B[j+2] = A[i-3] + A[i+3];</b>') +
  TRAP('Chained offsets add up. A −16 byte move (−4 elements) followed by a +4 byte load (+1 element) lands on A[i−3].'),
  a: 'Retrace the worker’s steps one at a time: where did he walk, what did he pick up, where did he put the result. The final note tells you the one-line order that made it.' }
]);

LEARN(7, 'Procedure Calls and the Stack', [
 { t: 'Calling and returning', h:
  '<p>A <b>procedure</b> (function) is a piece of code you jump to and then come back from. Two instructions make that work:</p>' +
  '<ul><li><code>jal Label</code> (jump and link): saves the address of the <b>next instruction</b> in <code>$ra</code>, then jumps to Label.</li><li><code>jr $ra</code> (jump register): copies $ra into the PC, so execution continues right after the original call.</li></ul>' +
  EX('Example', pre('jal  tomato   ; $ra = address of the next line\nadd  $s0,$v0,$zero  ; runs after tomato returns')),
  a: 'To send a job to a sub-assembly, leave a note saying where to come back to. When the sub-assembly finishes, it reads the note and returns there.' },
 { t: 'Why one $ra is not enough', h:
  '<p>There is only <b>one</b> <code>$ra</code>. If <code>main</code> calls <code>tomato</code>, which calls <code>potato</code>, the second <code>jal</code> overwrites main’s return address. Tomato can never find its way back.</p>' +
  '<p>The fix: before making a call, a function saves its own <code>$ra</code> in memory. That memory area is the <b>stack</b>.</p>' +
  '<p>The stack grows toward <b>lower addresses</b>. <code>$sp</code> points at the top.</p>' +
  TRAP('Only functions that <b>call others</b> need to save $ra. A function that never calls anything can leave it alone.'),
  a: 'If a sub-assembly sends its own job further down the line, its note would overwrite yours. So it first parks your note on a pile of trays.' },
 { t: 'Push and pop', h:
  '<p><b>Push</b> = make room, then store. <b>Pop</b> = load, then free the room. Each saved register is one 4-byte word.</p>' +
  EX('A function using $s0 that calls another function', pre('addi $sp,$sp,-8   ; make room\nsw   $ra,4($sp)\nsw   $s0,0($sp)\n   ...work, including the call...\nlw   $s0,0($sp)\nlw   $ra,4($sp)\naddi $sp,$sp,8    ; free the room\njr   $ra')) +
  '<p>Bytes to push: <b>4 × (number of saved registers) + 4 if you call another function</b> (for $ra).</p>' +
  EX('Stack pointer', '$sp = 2000. Pushing 3 words runs <code>addi $sp,$sp,-12</code>, so $sp = <b>1988</b>. After the matching pop it is back at 2000.'),
  a: 'Put notes on the pile before the job, take them back in reverse order after. When the pile is back to its original height, you are done.' }
]);

LEARN(8, 'Name That Function', [
 { t: 'Comparing with slt', h:
  '<p>MIPS can only branch on equal or not equal. To compare sizes it first makes a 0 or 1 with <b>slt</b> (set on less than):</p>' + F('slt rd, rs, rt      rd = 1 if rs < rt, else 0') +
  '<p><code>slti</code> compares with a constant. Then <code>beq</code> or <code>bne</code> with $zero branches on that 0 or 1.</p>' +
  EX('Example: a ≤ b', 'a ≤ b is the same as NOT (b &lt; a). So <code>slt $t0,$s1,$s0</code> (t0 = b &lt; a) and then <code>beq $t0,$zero,LtEq</code>: when t0 is 0, a ≤ b is true.'),
  a: 'To ask “which part is smaller?”, the checker stamps a 1 or a 0 on a card. Then the next order skips ahead depending on the card.' },
 { t: 'Reading short routines', h:
  '<p>Learn to recognise common patterns:</p>' +
  '<ul><li><b>Three xors in a row</b> swap two registers with no temporary.</li></ul>' +
  EX('XOR swap', pre('xor $t0,$t0,$t1\nxor $t1,$t0,$t1\nxor $t0,$t0,$t1') + 'Afterwards $t0 and $t1 have traded values. The first xor stores both in $t0, the second extracts the old $t0 into $t1, the third extracts the old $t1 into $t0.') +
  '<ul><li><b>Adding 1, 3, 5, … n terms</b> gives <b>n²</b>. For n = 4: 1 + 3 + 5 + 7 = 16.</li></ul>',
  a: 'Some station layouts are famous. Three identical swaps that trade two bins without a spare bin. A counter that adds the next odd number each time makes a perfect square.' },
 { t: 'Searching an array', h:
  '<p>A <b>linear search</b> checks each element in turn.</p>' +
  pre('loop: slt $t3,$t0,$a1     ; t3 = (i < size)\n      beq $t3,$0,exit    ; i reached the size: stop\n      ...load A[i], compare with 42...\n      ...found: return i...\n      addi $t0,$t0,1\n      j loop\nexit: addi $v0,$0,-1       ; not found') +
  '<p>If the value is not in the array, the loop runs until i reaches the size and returns <b>−1</b> as the “not found” signal.</p>' +
  TRAP('The slt tells you whether to <b>keep going</b>. When it becomes 0, you have run out of elements.'),
  a: 'Walk down the shelf checking each part. If you reach the end without finding it, write −1 on the form.' }
]);

/* Teaching pages for CPU Quest, levels 9-14. */

LEARN(9, 'CPU Time and Amdahl’s Law', [
 { t: 'How long does a program take?', h:
  '<p>Three things decide how long a program runs:</p>' +
  '<ul><li><b>IC</b>: instruction count, how many instructions the program executes.</li><li><b>CPI</b>: average clock cycles per instruction.</li><li><b>Clock cycle time</b>: seconds per cycle. The clock rate is its inverse (1 GHz means 1 ns per cycle).</li></ul>' +
  F('CPU time = IC × CPI × clock cycle time = IC × CPI ÷ clock rate') +
  EX('Example', '2 billion instructions, CPI 1.5, on a 3 GHz clock: time = 2×10<sup>9</sup> × 1.5 ÷ 3×10<sup>9</sup> = <b>1 s</b>.') +
  '<p>Fewer instructions per loop pass lowers IC. That is why a loop that just increments a <b>pointer</b> usually beats one that rebuilds an array address every pass.</p>',
  a: 'Total time = number of orders × whistles per order × length of a whistle. Shrink any one of the three and the job finishes sooner.' },
 { t: 'Amdahl’s Law', h:
  '<p>Speeding up part of a program does not speed up the whole thing by the same amount. If a fraction <b>f</b> of the time is sped up by a factor <b>n</b>:</p>' + F('Speedup = 1 ÷ ( f/n + (1 − f) )') +
  EX('Example', 'f = 0.5, n = 2: Speedup = 1 ÷ (0.5/2 + 0.5) = 1 ÷ 0.75 = <b>1.33×</b>.') +
  EX('Which upgrade is better?', 'A: square root is 20% of time, made 10× faster: 1 ÷ (0.2/10 + 0.8) = 1.22×.<br>B: all floating point is 50% of time, made 2× faster: 1 ÷ (0.5/2 + 0.5) = <b>1.33×</b>. B wins.') +
  '<p>How much of the program you touch matters more than how much you speed up a small piece.</p>',
  a: 'If one slow step takes half the time, even an infinitely fast machine for the other half cannot make the job more than twice as fast.' },
 { t: 'The ceiling', h:
  '<p>Even if the sped-up part became <b>instant</b> (n → ∞), the untouched part (1 − f) remains. So the best you can ever get is:</p>' + F('maximum speedup = 1 ÷ (1 − f)') +
  EX('Example', 'A program is 80% parallelizable. With unlimited processors the best speedup is 1 ÷ (1 − 0.8) = 1 ÷ 0.2 = <b>5×</b>.') +
  TRAP('The serial part is a hard ceiling. At 95% parallel, the limit is 20×, no matter how many processors you buy.'),
  a: 'The part of the job you did not speed up is still waiting at the end of the line. It sets the minimum time.' }
]);

LEARN(10, 'CPI from Instruction Mix and the MIPS Trap', [
 { t: 'Why “MIPS” misleads', h:
  '<p><b>MIPS</b> here means “millions of instructions per second”. It sounds fair but it is a trap:</p>' +
  '<ul><li>Instructions do different amounts of work. One chip’s instruction may do what another needs three for.</li><li>The number changes from program to program on the same chip.</li></ul>' +
  '<p>A higher MIPS number does not mean a faster computer. The only reliable measure is <b>total time</b> on the same program.</p>',
  a: 'Orders per second sounds fair, but a factory that runs a thousand tiny orders per second may still finish the whole job later than one that does fewer big orders.' },
 { t: 'Averaging CPI by instruction mix', h:
  '<p>Different instruction types take different numbers of cycles. Weight each CPI by how often that type appears.</p>' + F('CPI = Σ ( CPI<sub>i</sub> × fraction of instructions of type i )') +
  EX('Example', 'ALU 50% at 1 cycle, Load/Store 30% at 2, Branch 20% at 3: CPI = 0.5×1 + 0.3×2 + 0.2×3 = 0.5 + 0.6 + 0.6 = <b>1.7</b>.') +
  EX('After an improvement', 'If stores drop from 2 cycles to 1: new CPI = (ALU 0.43×1) + (Load 0.21×1) + (Store 0.12×1) + (Branch 0.24×2) = 0.43 + 0.21 + 0.12 + 0.48 = <b>1.24</b>.'),
  a: 'Count the whistles each kind of order takes and weigh them by how often each kind comes in. That is the average.' },
 { t: 'Trade-offs: CPI versus clock', h:
  '<p>A change can lower CPI but slow the clock. Compare using the whole formula (IC stays the same here, so it cancels):</p>' + F('speedup = old CPI × old cycle time ÷ ( new CPI × new cycle time )') +
  EX('Example', 'CPI drops from 1.38 to 1.24 but the clock is 15% slower (cycle time × 1.15): speedup = 1.38 ÷ (1.24 × 1.15) = 1.38 ÷ 1.426 ≈ <b>0.97</b>. It is slightly <b>slower</b>.') +
  TRAP('A speedup below 1 means slower. Never judge CPI or clock speed by itself.'),
  a: 'Fewer whistles per order is not a win if each whistle now takes longer. Multiply them together before you decide.' }
]);

LEARN(11, 'From C to Machine Code', [
 { t: 'One word, three layouts', h:
  '<p>Every instruction becomes one 32-bit word. The two shapes you need now:</p>' +
  '<ul><li><b>R-type</b>: op (6) | rs (5) | rt (5) | rd (5) | shamt (5) | funct (6). Total 6+5+5+5+5+6 = <b>32</b>.</li><li><b>I-type</b>: op (6) | rs (5) | rt (5) | immediate (16).</li></ul>' +
  '<p>For R-type, the op is always <b>000000</b>. The real operation (add, sub, slt, …) is chosen by the 6-bit <b>funct</b> field at the far right.</p>',
  a: 'Each order is a barcode with 32 boxes. The boxes are grouped into labelled fields, and the scanner reads the same fields in the same places every time.' },
 { t: 'Loops and branch offsets', h:
  '<p>A <code>for</code> loop compiles to: body, update the counter, test with <code>slt</code>, and branch back while the test is true.</p>' +
  EX('for (i = 0; i < 3; i++) k = k + i + 1;', pre('      add  $t0,$zero,$zero   ; i = 0\nloop: add  $s0,$s0,$t0         ; k += i\n      addi $s0,$s0,1           ; k += 1\n      addi $t0,$t0,1           ; i++\n      slti $t1,$t0,3           ; t1 = (i < 3)\n      bne  $t1,$zero,loop      ; repeat while true')) +
  '<p>The branch’s 16-bit offset counts <b>instructions</b>, not bytes, relative to the next instruction. It is a <b>two’s complement</b> number, so a leading 1 means negative.</p>' +
  EX('Reading an offset', '1111111111111110 means −2 (all ones is −1, one less is −2). The branch goes back 2 instructions.'),
  a: 'A skip order says “go back two orders”, not “go to line 40”. The offset is how many places to move from here.' },
 { t: 'A real use: finding the best match', h:
  '<p>Video compression finds where a small window of pixels best matches a larger frame. One way to score a match is <b>SAD</b>, the sum of absolute differences:</p>' + F('SAD = |w1 − f1| + |w2 − f2| + … ') +
  EX('Example', 'Window: 10, 20, 30, 40. Frame region: 12, 18, 33, 40. Differences: 2 + 2 + 3 + 0 = <b>7</b>.') +
  '<p>The <b>lowest</b> SAD is the best match (0 would be a perfect match).</p>',
  a: 'Lay the stencil over each spot on the sheet. Count how far off each point is. The spot with the smallest total is where it fits best.' }
]);

LEARN(12, 'The Single-Cycle Datapath', [
 { t: 'The building blocks', h:
  '<p>The <b>datapath</b> is the set of parts an instruction travels through. A CPU is built from a few reusable blocks:</p>' +
  '<ul><li><b>PC</b>: holds the address of the current instruction.</li><li><b>Instruction memory</b>: gives back the instruction at that address.</li><li><b>Adder</b>: computes PC + 4 (the next instruction) and branch targets.</li><li><b>Register file</b>: the 32 registers. Two reads and one write.</li><li><b>Sign-extend</b>: turns a 16-bit immediate into a 32-bit number with the same value.</li><li><b>ALU</b>: does the arithmetic and logic.</li><li><b>Data memory</b>: for lw and sw.</li></ul>' +
  '<p>In a <b>single-cycle</b> design, each instruction starts and finishes within <b>one</b> clock cycle.</p>',
  a: 'The factory floor plan: stations, conveyor belts and bins laid out once. Every order uses the same floor plan.' },
 { t: 'Why sign-extend, and the PC adder', h:
  '<p>Immediates are 16 bits, but registers are 32 bits. <b>Sign-extend</b> copies the top bit into the new upper bits, so a negative number stays negative (−1 is 1111…1 in both).</p>' +
  EX('Example', '16-bit 1111111111111100 (−4) becomes 32-bit 11111111111111111111111111111100 (still −4).') +
  '<p>The adder next to the PC computes <b>PC + 4</b>, the next instruction in memory (each instruction is 4 bytes). A similar adder computes the branch target.</p>',
  a: 'A short barcode is padded so that the bigger machine still reads the same number.' },
 { t: 'Wiring lw and sw', h:
  '<p>Follow the data from block to block:</p>' +
  EX('lw', 'PC → instruction memory → register file (base register) and sign-extend (offset) → ALU (adds base + offset to get the address) → data memory (read) → back into the register file (write the loaded value).') +
  EX('sw', 'Same up to the ALU. The ALU gives the address. The register file’s <b>second</b> value is the data to store. It goes into data memory (write). Nothing is written back to a register.') +
  TRAP('A store writes memory and writes <b>no register</b>.'),
  a: 'A fetch order walks from the filing cabinet to the bins to the warehouse and brings a part back. A store order takes a part from the bin and leaves it in the warehouse with nothing coming back.' }
]);

LEARN(13, 'Control Signals and the ALU Controller', [
 { t: 'Switches on the datapath', h:
  '<p>The same datapath serves every instruction. <b>Control signals</b> are wires set to 0 or 1 that act like light switches:</p>' +
  '<ul><li><b>RegDst</b>: which field names the destination register.</li><li><b>ALUSrc</b>: is the ALU’s second input a register (0) or the immediate (1)?</li><li><b>MemtoReg</b>: write the ALU result (0) or the memory data (1)?</li><li><b>RegWrite</b>: write a register?</li><li><b>MemRead / MemWrite</b>: read / write data memory.</li><li><b>Branch</b>: this is a branch.</li><li><b>ALUOp</b>: a 2-bit hint to the ALU controller.</li></ul>' +
  '<p>An <b>x</b> means “don’t care”: that signal makes no difference for this instruction, so either value works.</p>',
  a: 'The foreman’s switch board: each order flips a particular set of switches to route the part through the stations it needs.' },
 { t: 'The signal table', h:
  '<p>Learn what each instruction needs:</p>' +
  EX('lw', 'RegDst 0, ALUSrc 1, MemtoReg 1, RegWrite 1, MemRead 1, MemWrite 0, Branch 0, ALUOp 00') +
  EX('sw', 'RegDst x, ALUSrc 1, MemtoReg x, RegWrite 0, MemRead 0, MemWrite 1, Branch 0, ALUOp 00') +
  EX('beq', 'RegDst x, ALUSrc 0, MemtoReg x, RegWrite 0, MemRead 0, MemWrite 0, Branch 1, ALUOp 01') +
  EX('R-format (add, sub, …)', 'RegDst 1, ALUSrc 0, MemtoReg 0, RegWrite 1, MemRead 0, MemWrite 0, Branch 0, ALUOp 10') +
  '<p>For sw, nothing is written to a register, so RegDst and MemtoReg are x.</p>',
  a: 'Every kind of order has its own pattern of switches. You can memorise four patterns.' },
 { t: 'ALUOp and what breaks when a wire sticks', h:
  '<p>The 2-bit <b>ALUOp</b> tells the ALU controller what to do:</p>' +
  '<ul><li><b>00</b>: add (lw and sw use the ALU to compute an address).</li><li><b>01</b>: subtract (beq subtracts to test for zero).</li><li><b>10</b>: look at the <b>funct</b> field (R-format: add, sub, slt, …).</li></ul>' +
  EX('Stuck-wire reasoning', 'If <b>RegWrite is stuck at 1</b>, sw and beq (which should write nothing) would overwrite some register with garbage.') +
  EX('Another one', 'beq needs ALUOp = 01. If ALUOp0 is stuck at 0, beq gets 00 (add) instead, and the zero-result test is wrong.'),
  a: 'If one switch jams in the “on” position, the orders that needed it off start doing things they were never meant to do.' }
]);

LEARN(14, 'Timing and the Critical Path', [
 { t: 'The slowest path sets the clock', h:
  '<p>A signal takes time to pass through each block. In a single-cycle design, the clock period must be long enough for the <b>slowest</b> instruction to finish. This longest path is the <b>critical path</b>.</p>' +
  '<p>Delays used in these problems: memory (instruction or data) <b>2 ns</b>, ALU and adders <b>2 ns</b>, register file read or write <b>1 ns</b>. Multiplexers, sign-extend and wires count as zero.</p>' +
  '<p>Because one slow instruction sets the clock for all of them, every other instruction spends part of each cycle waiting.</p>',
  a: 'The whistle must wait for the slowest job. Every job, even a quick one, waits for the whole whistle.' },
 { t: 'Adding up a path', h:
  '<p>Add the delays of the blocks the instruction passes through.</p>' +
  EX('lw', 'instruction memory 2 + register read 1 + ALU 2 + data memory 2 + register write 1 = <b>8 ns</b>.') +
  EX('R-type (add)', 'instruction memory 2 + register read 1 + ALU 2 + register write 1 = <b>6 ns</b>. No data memory.') +
  '<p>Since the clock is 8 ns, every add wastes 8 − 6 = <b>2 ns</b> each cycle.</p>',
  a: 'Add up the time at each station on the route. The longest route is the length of the whistle.' },
 { t: 'How pipelining shortens the clock', h:
  '<p>Split the datapath into stages. Now the clock only has to fit the <b>slowest stage</b>, not the whole path.</p>' +
  EX('Example', 'Single-cycle path: 1 + 1 + 1 + 2 + 1 = <b>6 ns</b>. Five stages (IF, ID, EX, MEM, WB) with those delays: the slowest stage is 2 ns, so the new clock period is 2 ns. The clock rate improves by 6 ÷ 2 = <b>3×</b>.') +
  TRAP('3× is a limit set by the unbalanced stages. Balanced stages would do better. And one instruction still needs several cycles. What gets faster is the stream of results.'),
  a: 'Cut the long job into five short steps on a line. The whistle now only has to fit the slowest step, and a finished car rolls out every whistle.' }
]);

/* Teaching pages for CPU Quest, levels 15-22. */

LEARN(15, 'The 5-Stage Pipeline', [
 { t: 'Five stages', h:
  '<p>Pipelining chops the datapath into <b>5 stages</b>. Each instruction moves through them in order:</p>' +
  '<ol><li><b>IF</b> (instruction fetch): read the instruction from memory.</li><li><b>ID</b> (instruction decode): read registers and set the control signals.</li><li><b>EX</b> (execute): the ALU does its work or computes an address.</li><li><b>MEM</b>: read or write data memory (only lw and sw really use it, but every instruction still passes through).</li><li><b>WB</b> (write back): write the result into a register.</li></ol>',
  a: 'A five-station assembly line: fetch the order, read the parts list, assemble, move the car, and sign it off.' },
 { t: 'Five cars at once', h:
  '<p>While one instruction is in EX, the next is in ID and the one after is in IF. Up to 5 instructions are in flight, one per stage. Between the stages sit <b>pipeline registers</b> (IF/ID, ID/EX, EX/MEM, MEM/WB) that carry each instruction’s data and control signals along.</p>' +
  '<p>With no stalls, instruction number <b>n</b> starts in cycle n and finishes in cycle <b>n + 4</b>.</p>' +
  EX('Example', 'Instruction 3 starts in cycle 3 and finishes in cycle 3 + 4 = <b>7</b>.'),
  a: 'Five cars on the line at once, each at a different station. When the whistle blows, every car moves forward one station.' },
 { t: 'What pipelining does and does not do', h:
  '<p>Pipelining overlaps instructions. It does <b>not</b> make any single instruction faster: one still takes 5 cycles. What improves is <b>throughput</b>, how many finish per second.</p>' +
  F('total cycles = N + 4 (for N instructions, no stalls)') +
  EX('Example', '20 instructions, clock period 2 ns: (20 + 4) × 2 = <b>48 ns</b>. The first takes 5 cycles. Each later one adds just 1.') +
  TRAP('Latency (time for one instruction) stays the same. Throughput (instructions per second) goes up.'),
  a: 'The first car takes five whistles to come out. After that, a finished car rolls out every whistle.' }
]);

LEARN(16, 'Hazard Types: Structural, Data and Control', [
 { t: 'Three kinds of hazard', h:
  '<p>A <b>hazard</b> is a reason the next instruction cannot safely start in the next cycle.</p>' +
  '<ul><li><b>Structural</b>: two instructions need the same hardware resource at once.</li><li><b>Data</b>: an instruction needs a value that an earlier instruction has not produced yet.</li><li><b>Control</b>: the pipeline does not yet know which instruction comes next, because a branch has not been decided.</li></ul>',
  a: 'Three kinds of jam on the line: two cars need the same tool, a car needs a part that is not ready, or nobody knows which way the next car should go.' },
 { t: 'Data hazards: only RAW is real here', h:
  '<p>There are three data-hazard patterns, named by the order of the read (R) and write (W):</p>' +
  '<ul><li><b>RAW</b> (read after write): an instruction reads a register that an earlier one has not yet written. <b>This can happen.</b></li><li><b>WAR</b> (write after read) and <b>WAW</b> (write after write): <b>cannot</b> happen in this pipeline.</li></ul>' +
  '<p>Why: every instruction takes exactly 5 stages, reads in ID and writes in WB. An earlier instruction always reaches those stages first, so order is preserved.</p>' +
  EX('Spot the RAW', pre('add $8, $5, $5\nadd $2, $5, $8   ; reads $8 just written: RAW\nsub $3, $8, $4   ; reads $8: RAW')),
  a: 'Only one kind of data jam is possible on this line: a car asks for a part that the car ahead has not finished making.' },
 { t: 'Fixes and control hazards', h:
  '<p>Two ways to fix a RAW hazard:</p>' +
  '<ul><li><b>Insert nops</b> (empty instructions). They waste cycles every time.</li><li><b>Forwarding</b>: extra wiring that sends the value along early. It costs no cycles and is the real fix.</li></ul>' +
  '<p>A <b>control hazard</b> comes from a branch. <code>beq $1,$2,L1</code> is only decided when it reaches EX/MEM, but the pipeline already needed to fetch the next instruction 2 or 3 cycles earlier.</p>' +
  EX('Counting RAWs', 'Count every register read that depends on an earlier write. An instruction that reads two registers can contribute two RAWs.'),
  a: 'Waiting (nops) works but wastes time. Handing the part sideways (forwarding) is faster, and the fix for the branch jam comes in the next lessons.' }
]);

LEARN(17, 'Tracing RAW Hazards Cycle by Cycle', [
 { t: 'When is the value written, and when is it read?', h:
  '<p>An instruction <b>writes</b> its result in <b>WB</b> (stage 5) and the next instruction <b>reads</b> its operands in <b>ID</b> (stage 2). That is a timing question.</p>' +
  EX('Example', '<code>sub $2,$1,$3</code> writes $2 in cycle 5. An instruction right after it reads $2 in its ID, which is cycle 3. That read is <b>2 cycles too early</b>.') +
  '<p>An instruction 2 places after reads in cycle 4 (1 early). 3 places after reads in cycle 5 (same cycle as the write). 4 places after reads in cycle 6 (late enough).</p>',
  a: 'Trace each part tick by tick: when is it ready, and when does the next station reach for it?' },
 { t: 'The same-cycle trick', h:
  '<p>The register file <b>writes in the first half</b> of a clock cycle and <b>reads in the second half</b>. So a read in the same cycle as the write already sees the new value, with no extra hardware.</p>' +
  EX('Which instructions after sub $2,… (write in cycle 5) are fine without forwarding?', 'Reads in cycles 3 and 4: <b>too early</b>. Cycle 5: fine, thanks to the half-cycle trick. Cycle 6 and later: fine.') +
  '<p>With no stalls, instruction n finishes in cycle <b>n + 4</b>. For instruction 3 that is 7.</p>',
  a: 'The helper puts the new part in the tray at the start of the whistle. The next station checks the tray at the end of the same whistle, so it already sees it.' },

  F('last instruction finishes in cycle = N + 4 + (number of load-use stalls)') +
  EX('Example', pre('add $1,$1,$1\nadd $1,$1,$1\nlw  $1,0($1)\nlw  $1,0($1)') + 'N = 4 gives cycle 8. The second lw reads $1 from the first lw right away: 1 load-use stall. Last finish: 8 + 1 = <b>9</b>.') +
  TRAP('A load-use stall is only counted when the instruction <b>immediately after</b> a lw reads the lw’s destination.'),
  a: 'You cannot hand over a part that is still being made. The next station has to wait one whistle.' }

LEARN(18, 'Forwarding: the Hardware Fix', [
 { t: 'Sending the value sideways', h:
  '<p><b>Forwarding</b> sends a result straight from where it sits in the pipeline to the ALU input that needs it, without waiting for it to reach the register file.</p>' +
  '<p>A <b>forwarding unit</b> watches the EX/MEM and MEM/WB pipeline registers. If one holds the register the current instruction needs, it steers that value into the ALU input.</p>',
  a: 'A helper who watches the trays and hands each part to the next station directly, without going through the stockroom.' },
 { t: 'The two mux controls', h:
  '<p>Each ALU input has a mux. <b>A</b> controls the first input, <b>B</b> the second. Each can choose:</p>' +
  '<ul><li><b>0</b>: the register file (normal).</li><li><b>1</b>: EX/MEM (the result of the instruction one ahead). An <b>EX hazard</b>.</li><li><b>2</b>: MEM/WB (the result of the instruction two ahead). A <b>MEM hazard</b>.</li></ul>' +
  EX('Example', pre('add $1,$2,$3\nsub $4,$1,$5   ; $1 is the first operand, from EX/MEM: A = 1')),
  a: 'Three places to take a part from: the main stockroom, the tray right ahead, or the tray two ahead.' },
 { t: 'Two writers, loads and stores', h:
  '<p>If <b>both</b> EX/MEM and MEM/WB hold a value for the register you need, forward the <b>more recent</b> one (EX/MEM). Check the MEM hazard only if the EX hazard condition is false (an else-if).</p>' +
  EX('Example', pre('sub $2,$5,$1\nand $2,$2,$5\nor  $13,$6,$2   ; both earlier instructions wrote $2') + 'The or uses the value from the <b>and</b> (EX/MEM), not the older sub.') +
  EX('sw', '<code>add $1,$4,$5</code> then <code>sw $1,4($7)</code>. The sw stores $1 (its rt), so mux B takes it from EX/MEM: B = 1. The base register $7 is untouched: A = 0.') +
  '<p>Two hazards on two different operands do not conflict. The existing logic handles both at once.</p>',
  a: 'If two parts ahead have the right label, you take the newer one. A different part on each hand is no problem.' }
]);

LEARN(19, 'Hazard Detection: Stalling the One Case Forwarding Cannot Fix', [
 { t: 'Why forwarding falls short', h:
  '<p>Forwarding can route a value sideways, but it cannot hand over something that has <b>not been produced yet</b>.</p>' +
  '<p>A <code>lw</code> produces its value at the <b>end of MEM</b>. The next instruction wants it at the <b>start of EX</b>, one cycle too early. Only a one-cycle wait fixes it.</p>',
  a: 'You cannot pass on a part that has not come off the machine yet. The next station has to pause.' },
 { t: 'The hazard detection unit', h:
  '<p>A <b>hazard detection unit</b> in ID spots the load-use case. The condition: the instruction ahead (in EX) is a load, and its destination register is one the instruction in ID needs.</p>' +
  '<p>To stall for one cycle it does three things:</p>' +
  '<ul><li>Freeze the <b>PC</b> so the same instruction is fetched again.</li><li>Freeze <b>IF/ID</b> so the instruction in ID stays put.</li><li>Zero the control signals going into EX, which makes a <b>bubble</b>, a harmless nop.</li></ul>' +
  '<p>Instructions behind are delayed one cycle, but nothing is lost or re-fetched.</p>',
  a: 'The supervisor calls freeze for one whistle: the early stations hold, and an empty slot moves forward so nothing is damaged.' },
 { t: 'Hardware stall versus compiler nop', h:
  '<p>Both give the same effect, one wasted cycle.</p>' +
  '<ul><li><b>Compiler nop</b>: the compiler inserts a real nop instruction into the program. It makes the program longer.</li><li><b>Hardware stall</b>: the hardware makes the bubble itself. The program does not grow.</li></ul>' +
  EX('Counting', 'Four instructions with 1 load-use stall: 4 + 4 + 1 = <b>9</b>. Four lw in a row, each using the previous destination: 3 stalls, so 4 + 4 + 3 = <b>11</b>.') +
  F('finish cycle = N + 4 + stalls'),
  a: 'The same empty slot, but made by the supervisor on demand rather than written into every work order in advance.' }
]);

LEARN(20, 'Branch Hazards: Resolve Earlier', [
 { t: 'Where the branch is decided', h:
  '<p>Until a branch is decided, the pipeline keeps fetching the next instructions in order. If the branch turns out to be <b>taken</b>, those instructions are wrong and are thrown away as <b>bubbles</b>.</p>' +
  '<p>The later the decision, the more bubbles:</p>' +
  '<ul><li>Decided in <b>MEM</b>: <b>3</b> bubbles.</li><li>Decided in <b>EX</b>: <b>2</b> bubbles.</li><li>Decided in <b>ID</b>: <b>1</b> bubble.</li></ul>' +
  EX('Example', 'A loop’s branch is taken 10 times and is decided in MEM: 3 × 10 = <b>30</b> cycles lost.'),
  a: 'Check the ticket at the last gate and every wrong car must turn around from far down the line. Check at the first gate and only one car turns back.' },
 { t: 'Loops and the last iteration', h:
  '<p>A loop with <b>n</b> iterations usually branches back <b>n − 1</b> times. The last pass falls through, so the branch is not taken.</p>' + F('bubble cycles = (n − 1) × bubbles per taken branch') +
  EX('Example', '20 iterations, branch resolved in MEM: (20 − 1) × 3 = <b>57</b> cycles.'),
  a: 'Every time the loop sends cars back round, you pay the turn-around cost. The final pass does not turn around.' },
 { t: 'The catch with deciding in ID', h:
  '<p>If you decide in ID, the two registers being compared must already hold the right values. Nearby instructions can still be writing them.</p>' +
  '<ul><li>The value was written 3 or more instructions earlier: already in the register file, <b>0 stalls</b>.</li><li>An ALU instruction right before the branch: forward into ID, <b>1 stall</b>.</li><li>A <code>lw</code> <b>right before</b> the branch: <b>2 stalls</b>. Forwarding cannot help.</li><li>A <code>lw</code> with one instruction between: <b>1 stall</b>.</li></ul>' +
  EX('Example', pre('lw  $1, 0($5)\nbeq $1, $4, L   ; lw immediately before') + '2 stall cycles.') +
  EX('Example', pre('add $1,...\nadd $4,...\nsub $3,...\nbeq $1,$4,L') + '$1 and $4 were written long enough ago: <b>0 stalls</b>.'),
  a: 'Deciding early means you must be sure the ticket is already ready. If the last part has not been made yet, the gate keeper has to wait.' }
]);

LEARN(21, 'Branch Delay Slots and Jump Hazards', [
 { t: 'Filling the wasted slot', h:
  '<p>Even when a branch is decided in ID, a taken branch still wastes <b>1</b> cycle (the instruction fetched behind it is flushed).</p>' +
  '<p>A <b>branch delay slot</b> turns that wasted slot into useful work. The instruction right after the branch <b>always runs</b>, taken or not. The compiler finds an instruction that has to happen anyway and moves it there.</p>' +
  '<p>A <b>flag</b> in the branch tells the hardware: do not flush the slot.</p>',
  a: 'Put a job in the gap that has to happen either way, so no slot is scrapped.' },
 { t: 'What can go in the slot?', h:

  '<ul><li>Not depend on the branch outcome.</li><li>Not change anything the branch itself compares.</li></ul>' +
  EX('Example', pre('add $4,$5,$6      ; independent of the branch\nbeq $1,$2,L') + 'The add does not touch $1 or $2, so it can be moved into the delay slot after the beq.') +
  EX('Counting', 'A loop’s branch is taken 10 times. With the slot filled, each taken branch wastes nothing: <b>10</b> cycles saved. A taken branch with a well-filled slot costs <b>0</b> wasted cycles.'),
  a: 'Only a job that does not depend on the ticket outcome can go in the gap.' },
 { t: 'Jumps are also resolved in ID', h:
  '<p><code>j</code>, <code>jal</code> and <code>jr</code> are all resolved in <b>ID</b>:</p>' +
  '<ul><li>The jump-target adder sits in ID.</li><li><code>jr</code> reads its register in ID.</li></ul>' +
  '<p>So only the one instruction fetched behind the jump is wrong. A jump costs <b>1 flushed cycle</b>.</p>' +
  EX('Example', '5 jumps at 1 flushed cycle each = <b>5</b> cycles lost.'),
  a: 'The last inspection of the line: stores, loads and jumps.' }
]);

LEARN(22, 'Hazard Practice: Loads, Stores and Jumps', [

/* Shared helpers for the workshop builds. Game-neutral. */

const par = (a, b) => a * b / (a + b);
const pickR = (list, n, must) => { const m = Array.isArray(must) ? must : [must]; const out = m.slice(); shuffle(list.filter(v => !m.includes(v))).slice(0, Math.max(0, n - m.length)).forEach(v => out.push(v)); return shuffle(out).sort((a, b) => a - b); };
// engineering format: E(0.0153,'A') -> "15.3 mA"
const E = (x, u) => { if (x === 0) return '0 ' + u; const a = Math.abs(x), P = [[1e9, 'G'], [1e6, 'M'], [1e3, 'k'], [1, ''], [1e-3, 'm'], [1e-6, 'µ'], [1e-9, 'n']]; const p = P.find(q => a >= q[0] * 0.9995) || P[P.length - 1]; const v = x / p[0]; return (Math.round(v * 100) / 100) + ' ' + p[1] + u; };
const N2 = x => String(Math.round(x * 1000) / 1000);
// a simple generic part
const PT = (label, v, kind) => ({ label, v, kind: kind || 'BOX' });
const ohm = v => v >= 1e6 ? (v / 1e6) + ' MΩ' : v >= 1000 ? (v / 1000) + ' kΩ' : v + ' Ω';

const LP = v => PT(E(v, 'H'), v, 'L'), CP = v => PT(E(v, 'F'), v, 'C');

/* ---- layouts. All are 11 wide, 7 tall. The bins fill row 6. ---- */
// a loop: left part, right part, sockets/fixed parts along the top row
function benchRig(o) {
  const sockets = (o.sockets || []).map(k => ({ id: k.id, label: k.label, x: k.x, y: k.y == null ? 1 : k.y }));
  const fixed = [];
  if (o.left !== null) fixed.push(Object.assign({ x: 1, y: 3, kind: 'BAT', label: '', info: '' }, o.left || {}));
  if (o.right !== null) fixed.push(Object.assign({ x: 9, y: 3, kind: 'BOX', label: '', info: '' }, o.right || {}));
  (o.top || []).forEach(f => fixed.push(Object.assign({ y: 1 }, f)));
  (o.extra || []).forEach(f => fixed.push(f));
  return { cols: 11, rows: 7, sockets, fixed, wires: o.wires || [[[1, 3], [1, 1], [9, 1], [9, 3], [9, 5], [1, 5], [1, 3]]], start: o.start || { x: 5, y: 3 }, lever: o.lever || { x: 10, y: 5 } };
}
// sockets along a row (ordering, matching, picking settings)
function rowRig(o) {
  const n = o.sockets.length, xs = n === 1 ? [5] : n === 2 ? [3, 7] : n === 3 ? [2, 5, 8] : n === 4 ? [1, 4, 7, 10] : n === 5 ? [1, 3, 5, 7, 9] : n === 6 ? [0, 2, 4, 6, 8, 10] : [0, 1, 3, 4, 6, 7, 9].slice(0, n);
  const sockets = o.sockets.map((k, i) => ({ id: k.id, label: k.label, x: xs[i], y: o.y == null ? 1 : o.y }));
  const wires = o.wires === undefined ? [[[Math.min(...xs), sockets[0].y], [Math.max(...xs), sockets[0].y]]] : o.wires;
  return { cols: 11, rows: 7, sockets, fixed: o.fixed || [], wires, start: o.start || { x: 5, y: 3 }, lever: o.lever || { x: 10, y: 4 } };
}
// two rows of sockets (e.g. cause on top, effect below)
function gridRig(o) {
  const sockets = [], rows = o.rows; const ys = rows.length === 1 ? [1] : rows.length === 2 ? [1, 3] : [1, 2, 3];
  rows.forEach((row, r) => { const n = row.length, xs = n === 1 ? [5] : n === 2 ? [3, 7] : n === 3 ? [2, 5, 8] : n === 4 ? [1, 4, 7, 10] : [1, 3, 5, 7, 9]; row.forEach((k, i) => sockets.push({ id: k.id, label: k.label, x: xs[i], y: ys[r] })); });
  return { cols: 11, rows: 7, sockets, fixed: o.fixed || [], wires: o.wires || [], start: o.start || { x: 5, y: 5 }, lever: o.lever || { x: 10, y: 5 } };
}

  model(p) { const need = (o.rig.sockets || []).every(k => p[k.id]); if (!need) return { meters: o.idle || [], note: o.idleNote || '' }; return Object.assign({ live: true }, o.calc(p)); } });

function dial(o) {

    calc(p) { const x = rd(p[id]), ok = near(x, tgt, tol), ms = [meterOf(o.label || 'Reading', show(x), ok ? 'good' : 'bad'), meterOf('Target', show(tgt))].concat(o.extra ? o.extra(p[id], x) : []);

  };

    const nb = o.parts.slice().sort((a, b) => a.v - b.v), i = nb.findIndex(q => q.label === p[id].label), e = q => Math.abs(rd(q) - tgt), up = nb[i + 1], dn = nb[i - 1];

    idle: o.count === false ? [] : [meterOf('In place', '0 of ' + n)], idleNote: o.idleNote || '',
    calc(p) { const good = o.slots.filter(s => p[s.id].label === s.want).length, ok = good === n; const ms = o.count === false ? [] : [meterOf('In place', good + ' of ' + n, ok ? 'good' : '')].concat(o.meters ? o.meters(p, good) : []);
      return { ok, meters: ms, note: o.note ? o.note(p, good) : (ok ? 'Everything is in place.' : (o.count === false ? '' : good + ' of ' + n + ' are right.')), why: o.why, fail: o.fail || '' }; } };

}
