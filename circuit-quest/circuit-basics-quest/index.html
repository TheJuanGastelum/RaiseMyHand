<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Circuit Basics Quest</title><style>:root{
  --bg:#0e1020; --panel:#181b36; --panel2:#232749; --line:#3d4380; --ink:#f3f4fb; --dim:#a4a9d6;
  --accent:#7ef7c1; --accent2:#ffe66d; --bad:#ff6b6b; --good:#7ef7c1; --accent-ink:#06210f;
  --mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,"Courier New",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.55}
body{min-height:100vh;background:
  radial-gradient(1200px 500px at 50% -10%, color-mix(in srgb,var(--accent) 10%,transparent), transparent 60%), var(--bg)}
#app{max-width:980px;margin:0 auto;padding:18px 16px 60px}
h1,h2,h3{font-family:var(--mono);letter-spacing:.02em;margin:0;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
code,.code{font-family:var(--mono);background:#0b0d1c;border:1px solid var(--line);border-radius:5px;padding:.05em .35em;font-size:.92em;color:#cfe;white-space:nowrap}
pre.code{white-space:pre;padding:10px 14px;overflow-x:auto;display:block;margin:8px 0;line-height:1.5}
.m{font-family:var(--mono);color:var(--accent2)}
sub,sup{line-height:0}
.btn{background:var(--panel2);border:3px solid var(--line);border-radius:10px;padding:9px 16px;font-weight:700;box-shadow:0 4px 0 #0007;transition:transform .08s,box-shadow .08s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0007}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.dim{color:var(--dim)}
.chip{display:inline-block;font:700 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--dim)}
.chip.boss{border-color:var(--bad);color:var(--bad)}
.chip.t1{border-color:#5fd3a0;color:#5fd3a0}.chip.t2{border-color:var(--accent2);color:var(--accent2)}.chip.t3{border-color:#ff9f5a;color:#ff9f5a}

/* home */
.hero{padding:26px 0 8px}
.hero h1{font-size:clamp(2rem,6vw,3.2rem);color:var(--accent);text-shadow:0 3px 0 #0008}
.hero p{max-width:60ch;color:var(--dim);margin:8px 0 0}
.hw{margin:14px 0;padding:12px 16px;border:3px dashed var(--accent2);border-radius:12px;background:#2a2610}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin:16px 0}
.stat b{display:block;font:700 1.5rem var(--mono);color:var(--accent2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:10px}
.card{position:relative;background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:14px 16px 14px;display:flex;flex-direction:column;gap:6px;text-align:left;box-shadow:0 5px 0 #0007}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .num{font:800 1.9rem var(--mono);color:var(--accent)}
.card h3{font-size:1.05rem}
.card p{margin:0;color:var(--dim);font-size:.9rem}
.card .meta{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--dim)}
.stars{font-size:1.2rem;letter-spacing:2px;color:#4a4f7a}
.stars .on{color:var(--accent2)}
.diff{display:inline-flex;gap:3px}.diff i{width:9px;height:9px;border-radius:2px;background:#39406e;display:block}.diff i.on{background:#ff9f5a}
.badge-hw{position:absolute;top:-10px;right:12px;background:var(--accent2);color:#2b2300;font:800 .72rem var(--mono);padding:2px 9px;border-radius:999px}
details.tools{margin-top:26px;border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--panel)}
details.tools summary{cursor:pointer;font-weight:700}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.picks label{display:inline-flex;gap:6px;align-items:center;border:2px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
textarea.out{width:100%;min-height:90px;background:#0b0d1c;color:var(--ink);border:2px solid var(--line);border-radius:8px;font:.85rem var(--mono);padding:8px}

/* play */
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.bar h2{font-size:1.1rem}
.bar .lvl{color:var(--accent)}
.hearts{font-size:1.5rem;letter-spacing:3px;color:var(--bad)}
.hearts .lost{color:#3a3f6c}
.score{font:800 1.2rem var(--mono);color:var(--accent2);min-width:5ch;text-align:right}
.combo{font:700 .85rem var(--mono);color:var(--accent);min-height:1.2em}
.stage{border:3px solid var(--line);border-radius:14px;overflow:hidden;background:#070815;margin-bottom:12px;position:relative}
.stage canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.panel{background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:16px 18px}
.q{font-size:1.15rem;margin:6px 0 12px}
.q p{margin:0 0 8px}
.timer{height:8px;border-radius:6px;background:#242850;overflow:hidden;margin:8px 0}
.timer i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transition:background .3s}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:720px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--panel2);border:3px solid var(--line);border-radius:12px;padding:11px 14px;min-height:54px;box-shadow:0 4px 0 #0007}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font:800 .95rem var(--mono);color:var(--accent);border:2px solid var(--line);border-radius:6px;min-width:1.9em;text-align:center;padding:0 4px;margin-top:1px}
.opt.wrong{border-color:var(--bad);background:#3a1a2a;text-decoration:line-through;opacity:.7}
.opt.right{border-color:var(--good);background:#143a30}
.numrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numrow input{font:700 1.4rem var(--mono);width:11ch;background:#0b0d1c;color:var(--accent2);border:3px solid var(--line);border-radius:10px;padding:8px 12px}
.numrow .u{font:700 1.2rem var(--mono);color:var(--dim)}
.given{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.given span{font:700 .95rem var(--mono);background:#0b0d1c;border:2px solid var(--line);border-radius:8px;padding:3px 10px;color:var(--accent2)}
.tray,.slots,.seq{display:flex;gap:8px;flex-wrap:wrap}
.tray{min-height:54px;padding:8px;border:2px dashed var(--line);border-radius:12px;margin-bottom:10px}
.pill{background:var(--panel2);border:3px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:700;box-shadow:0 3px 0 #0007}
.pill.sel{border-color:var(--accent2);background:#3a3512;transform:translateY(-2px)}
.pill.ok{border-color:var(--good)}.pill.no{border-color:var(--bad);background:#3a1a2a}
.slotrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(130px,230px);gap:10px;align-items:center;margin:6px 0}
.slot{min-height:46px;border:3px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:4px;background:#0b0d1c}
.slot.over{border-color:var(--accent2)}
.slot .pill{box-shadow:none}
.sortcard{font:800 clamp(1rem,5vw,1.5rem) var(--mono);text-align:center;padding:18px 10px;border:3px solid var(--accent);border-radius:14px;background:#0b0d1c;margin:8px 0 12px;min-height:80px;display:flex;align-items:center;justify-content:center;white-space:pre-wrap;word-break:break-word;font-size:clamp(1rem,5vw,1.5rem)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.sortprog{display:flex;gap:5px;margin-bottom:6px}.sortprog i{flex:1;height:7px;border-radius:4px;background:#2b3060}.sortprog i.d{background:var(--accent)}
.wire{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px clamp(28px,12vw,90px);margin:10px 0}
.wire svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.wire .col{display:flex;flex-direction:column;gap:10px;z-index:1}
.wire .pill{text-align:left}
.reg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.bit{display:flex;flex-direction:column;align-items:center;gap:4px}
.bit button{width:56px;height:62px;font:800 1.7rem var(--mono);border-radius:10px;border:3px solid var(--line);background:#0b0d1c;color:#5a6296;box-shadow:0 4px 0 #0007}
.bit button.on{background:var(--accent2);color:#2b2300;border-color:var(--accent2)}
.bit button.bad{border-color:var(--bad)}
.bit small{font:700 .72rem var(--mono);color:var(--dim)}
.regread{text-align:center;font:700 1rem var(--mono);color:var(--dim)}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;border:3px solid;font-size:1rem}
.fb.good{border-color:var(--good);background:#10332b}
.fb.bad{border-color:var(--bad);background:#361a28}
.fb.info{border-color:var(--accent2);background:#2a2610}
.fb b.t{display:block;font:800 .8rem var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.prog{display:flex;gap:6px;margin:0 0 10px}
.prog i{flex:1;height:10px;border-radius:5px;background:#2b3060}.prog i.d{background:var(--accent)}.prog i.c{background:var(--accent2)}.prog i.b{background:#ff9f5a}
.concept{margin:0 0 12px;padding:10px 14px;border-left:5px solid var(--accent);background:#10152e;border-radius:0 10px 10px 0;color:var(--dim);font-size:.98rem}
.concept b{color:var(--ink)}
/* results */
.res{text-align:center;padding:24px 16px}
.res h2{font-size:2rem}
.res .big{font-size:3rem;letter-spacing:6px;margin:8px 0}
.res table{margin:12px auto;border-collapse:collapse;text-align:left}
.res td{padding:4px 14px;border-bottom:1px solid var(--line)}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pop{animation:pop .3s}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sr{position:absolute;left:-9999px}

.seg{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.tr{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin:8px 0 12px}
.trow{background:#0b0d1c;border:2px solid var(--line);border-radius:10px;padding:7px 12px}
.trow .rt{display:block;font:700 .85rem var(--mono);color:var(--accent2)}
.trow .kt{display:block;font-size:.95rem}
details.real{margin-top:8px}
details.real summary{cursor:pointer;color:var(--dim)}
.card .chip{align-self:flex-start}

/* ---- keyboard + lessons ---- */
.kfocus{outline:3px dashed var(--accent2);outline-offset:3px}
.opt.kfocus{border-color:var(--accent2);background:#2a2f5e}
.slot.kfocus{border-color:var(--accent2)}
.keyhint,.keyline{margin-top:12px;font:700 .82rem var(--mono);color:var(--dim);letter-spacing:.02em}
.kcap{display:block;font:800 .78rem var(--mono);color:var(--accent);margin-bottom:2px}
.buckets .btn{display:flex;flex-direction:column;align-items:center;gap:2px}
.lesson .ltitle{font-size:1.25rem;margin:10px 0 8px;color:var(--accent2)}
.lbody p{margin:0 0 .75em}
.lbody ul,.lbody ol{margin:.3em 0 .8em;padding-left:1.3em}
.lbody li{margin:.2em 0}
.formula{margin:.7em 0;padding:10px 14px;background:#0b0d1c;border:2px solid var(--accent);border-radius:10px;font:700 1.05rem var(--mono);color:var(--accent2);text-align:center;overflow-x:auto}
.example{margin:.8em 0;padding:10px 14px;background:#10152e;border-left:5px solid var(--accent2);border-radius:0 10px 10px 0}
.example b.eh{display:block;color:var(--accent2);font:800 .78rem var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.trap{margin:.8em 0;padding:10px 14px;background:#2a1626;border-left:5px solid var(--bad);border-radius:0 10px 10px 0}
.trap b.eh{display:block;color:var(--bad);font:800 .78rem var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.anabox{border-left-color:#4aa3ff}
details.review{margin:0 0 10px;border:2px dashed var(--line);border-radius:10px;padding:6px 12px}
details.review summary{cursor:pointer;font-weight:700;color:var(--dim)}

/* ---- workshop (lab) ---- */
.labwrap{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.labteach{background:#0f1230;border:1px solid var(--line);border-left:5px solid var(--accent2);border-radius:10px;padding:10px 14px;font-size:.95rem}
.labteach .eh,.coach b{display:block;font:800 .7rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent2);margin-bottom:2px}
.labteach p{margin:.3em 0}
.lab{position:relative;width:100%;max-width:640px;margin:0 auto;border:3px solid var(--line);border-radius:14px;overflow:hidden;container-type:inline-size;
  background:linear-gradient(#0b0d1c88,#0b0d1c88),repeating-linear-gradient(0deg,transparent 0 calc(100%/var(--rows) - 1px),#ffffff0d calc(100%/var(--rows) - 1px) calc(100%/var(--rows))),repeating-linear-gradient(90deg,transparent 0 calc(100%/var(--cols) - 1px),#ffffff0d calc(100%/var(--cols) - 1px) calc(100%/var(--cols))),#12142b}
.lab.won{border-color:var(--good);box-shadow:0 0 24px #7ef7c155}
.labwires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.labwires polyline{fill:none;stroke:#4a528f;stroke-width:.09;stroke-linecap:round;stroke-linejoin:round}
.lab.live .labwires polyline{stroke:var(--accent2);filter:drop-shadow(0 0 .08px var(--accent2));stroke-dasharray:.35 .25;animation:labflow .7s linear infinite}
@keyframes labflow{to{stroke-dashoffset:-.6}}
@media (prefers-reduced-motion:reduce){.lab.live .labwires polyline{animation:none;stroke-dasharray:none}}
.ent{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2%;border-radius:10px;font-size:max(9px,2.15cqw);line-height:1.1;text-align:center;color:var(--ink);cursor:pointer}
.ent .gly{width:78%;height:auto;color:var(--dim)}
.ent b{font:800 1em var(--mono);white-space:nowrap}
.ent small{font:600 .85em var(--mono);color:var(--dim);white-space:nowrap}
.ent.bin{background:#2a2447;border:2px solid #5a4d9a;color:#d9ccff}
.ent.bin .gly{color:#b9a8ff}
.ent.socket{border:2px dashed var(--accent2);background:#ffe66d12}
.ent.socket.full{border-style:solid;background:#ffe66d22}
.ent.socket .gly{color:var(--accent2)}
.ent.socket .q{font-size:1.6em;color:var(--accent2)}
.ent.fixed{background:#18305a;border:2px solid #3f6fc4}
.ent.fixed .gly{color:#8fb8ff}
.ent.fixed.k-LED .gly{color:#ff9fb3}.ent.fixed.k-BULB .gly{color:#ffe66d}
.ent.lever{background:#3a1d2c;border:2px solid #d4546e}
.ent.lever i{display:block;width:16%;height:38%;background:#ff6b8a;border-radius:4px;transform:rotate(-24deg);margin-bottom:4%}
.ent.target{outline:3px solid var(--accent);outline-offset:-1px;z-index:2}
.me{position:absolute;transition:left .11s linear,top .11s linear;z-index:3;pointer-events:none;display:flex;align-items:center;justify-content:center}
@media (prefers-reduced-motion:reduce){.me{transition:none}}
.me .body{width:46%;height:70%;background:linear-gradient(#ffcf8a 0 38%,#ff7b54 38% 100%);border:2px solid #0008;border-radius:6px 6px 4px 4px;position:relative}
.me .body::before,.me .body::after{content:"";position:absolute;top:18%;width:14%;height:14%;background:#1a1228;border-radius:50%}
.me .body::before{left:24%}.me .body::after{right:24%}
.me.f-u .body::before,.me.f-u .body::after{display:none}
.me.f-l .body::after{display:none}.me.f-r .body::before{display:none}
.me .carry{position:absolute;bottom:78%;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;background:#2a2447;border:2px solid #b9a8ff;border-radius:7px;padding:1px 5px;font-size:max(8px,1.9cqw);color:#d9ccff;white-space:nowrap}
.me .carry:empty{display:none}
.me .carry .gly{width:2.6em;height:auto;color:#b9a8ff}.me .carry b{font:800 1em var(--mono)}
.facemark{position:absolute;border:2px dashed #7ef7c155;border-radius:8px;pointer-events:none;opacity:0}
.facemark.on{opacity:1}
.labtip{font:700 .85rem var(--mono);color:var(--accent);min-height:1.4em;text-align:center}
.labmeters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.meter{background:#0b0d1c;border:2px solid var(--line);border-radius:10px;padding:4px 12px;min-width:7.5em;text-align:center}
.meter small{display:block;font:700 .68rem var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.meter b{font:800 1.15rem var(--mono)}
.meter.good{border-color:var(--good);color:var(--good)}.meter.bad{border-color:var(--bad);color:var(--bad)}
.labnote{background:#0f1230;border-radius:10px;padding:8px 14px;font-size:.95rem;min-height:2.6em}
.labnote .coach{margin-top:6px;color:var(--accent2)}.labnote .coach b{display:inline;margin:0 6px 0 0}
.labpad{display:none;grid-template-columns:repeat(4,1fr);gap:6px}
.labpad button{padding:12px 0;border-radius:10px;border:2px solid var(--line);background:#232749;font-weight:800}
.labpad .act{grid-column:span 2}
@media (pointer:coarse){.labpad{display:grid}}

/* ---- analogy switch, always on screen ---- */
#app{padding-top:58px}
.anabtn{position:fixed;top:10px;right:12px;z-index:50;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:#181b36ee;color:var(--ink);font:800 .8rem var(--mono);letter-spacing:.04em;box-shadow:0 3px 0 #0007;backdrop-filter:blur(4px)}
.anabtn[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.anabtn:hover{background:#232749}
.ana-off .anaonly{display:none!important}
.q code,.labteach code,.labnote code,.lbody code,.fb code{white-space:normal;overflow-wrap:anywhere}

.hubbtn{position:fixed;top:10px;left:12px;z-index:50;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:#181b36ee;color:var(--ink);font:800 .8rem var(--mono);letter-spacing:.04em;text-decoration:none;box-shadow:0 3px 0 #0007}
.hubbtn:hover{background:#232749}

:root{--accent:#4aa3ff}</style></head><body><main id="app"></main><script>const ANA_L = {};
/* ===== Shared game kit: level select, challenge runner, scoring, progress ===== */
const Kit = (() => {
  const TEST = /[?&]test\b/.test(location.search);
  const $ = (s, r) => (r || document).querySelector(s);
  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (k === 'class') e.className = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
    return e;
  }
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const fmt = (x, d = 3) => { const r = Number(x.toFixed(d)); return String(r); };

  let cfg, S, appEl, run = null;
  const TIER_PTS = { 1: 100, 2: 150, 3: 250 };

  /* ---------- storage ---------- */
  const key = () => 'studygame_' + cfg.id;
  function load() { try { return JSON.parse(localStorage.getItem(key())) || {}; } catch (e) { return {}; } }
  function save() { try { localStorage.setItem(key(), JSON.stringify(S)); } catch (e) {} }

  /* ---------- sound ---------- */
  let AC = null;
  function beep(freq, dur, type, vol) {
    if (S.mute) return;
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();

      auto() { v = s.target.split('').map(Number); paint(); b.check(); },
      autoWrong() { v = s.target.split('').map(Number); v[n - 1] ^= 1; paint(); b.check(); },
    };
    return b;
  };

  /* ---------- lab: walk, carry parts, build the thing, test it ---------- */
  const GLY = {
    R: '<path d="M1 10h6l2-6 4 12 4-12 4 12 4-12 2 6h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
    C: '<path d="M1 10h15M16 3v14M24 3v14M24 10h15" fill="none" stroke="currentColor" stroke-width="2"/>',
    L: '<path d="M1 12h5a4 6 0 0 1 8 0a4 6 0 0 1 8 0a4 6 0 0 1 8 0h9" fill="none" stroke="currentColor" stroke-width="2"/>',
    BAT: '<path d="M1 10h13M14 3v14M20 6v8M20 10h19" fill="none" stroke="currentColor" stroke-width="2"/><text x="26" y="6" font-size="7" fill="currentColor">+</text>',
    LED: '<path d="M1 10h12M13 3l10 7-10 7zM24 3v14M24 10h15M26 2l5-3M30 5l5-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
    BULB: '<circle cx="20" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M14 4l12 12M26 4L14 16M1 10h5M34 10h5" stroke="currentColor" stroke-width="2"/>',
    SRC: '<circle cx="20" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M14 10c2-5 4-5 6 0s4 5 6 0M1 10h5M34 10h5" fill="none" stroke="currentColor" stroke-width="2"/>',
    MOTOR: '<circle cx="20" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="2"/><text x="15.5" y="14" font-size="11" font-weight="700" fill="currentColor">M</text><path d="M1 10h5M34 10h5" stroke="currentColor" stroke-width="2"/>',
    BOX: '<rect x="8" y="2" width="24" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M1 10h7M32 10h7" stroke="currentColor" stroke-width="2"/>',
  };
  const glyph = k => '<svg class="gly" viewBox="0 0 40 20" aria-hidden="true">' + (GLY[k] || GLY.BOX) + '</svg>';

  BUILD.lab = (s, c) => {
    const cols = s.cols || 11, rows = s.rows || 7;
    const ents = [];
    const parts = s.parts;
    if (parts.length > cols - 1) throw new Error('lab has too many parts: ' + parts.length);
    parts.forEach((p, i) => ents.push({ type: 'bin', x: parts.length === 1 ? Math.floor(cols / 2) : parts.length > cols - 2 ? i : Math.round(1 + i * (cols - 3) / (parts.length - 1)), y: rows - 1, part: p }));
    (s.sockets || []).forEach(k => ents.push(Object.assign({ type: 'socket' }, k)));
    (s.fixed || []).forEach(k => ents.push(Object.assign({ type: 'fixed' }, k)));
    const lev = Object.assign({ x: cols - 1, y: Math.floor(rows / 2) }, s.lever || {});
    ents.push({ type: 'lever', x: lev.x, y: lev.y });
    const at = (x, y) => ents.find(e => e.x === x && e.y === y);
    const sockets = ents.filter(e => e.type === 'socket');
    const placed = {}; sockets.forEach(k => placed[k.id] = null);
    let pos = Object.assign({ x: Math.floor(cols / 2), y: Math.floor(rows / 2) - 1 }, s.start || {}), face = 'u', carry = null, done = false, busy = false;
    const DV = { u: [0, -1], d: [0, 1], l: [-1, 0], r: [1, 0] };
    const pct = (x, y) => 'left:' + (x / cols * 100) + '%;top:' + (y / rows * 100) + '%;width:' + (100 / cols) + '%;height:' + (100 / rows) + '%';

    const wiresSvg = '<svg class="labwires" viewBox="0 0 ' + cols + ' ' + rows + '" preserveAspectRatio="none" aria-hidden="true">' +
      (s.wires || []).map(w => '<polyline points="' + w.map(p => (p[0] + .5) + ',' + (p[1] + .5)).join(' ') + '" />').join('') + '</svg>';
    const room = h('div', { class: 'lab', role: 'group', 'aria-label': 'Workshop. Walk with W A S D or the arrow keys.', style: '--cols:' + cols + ';--rows:' + rows + ';aspect-ratio:' + cols + '/' + rows, html: wiresSvg });
    const els = new Map();
    ents.forEach(e => {
      let el;
      if (e.type === 'bin') el = h('div', { class: 'ent bin', style: pct(e.x, e.y), html: glyph(e.part.kind || 'R') + '<b>' + e.part.label + '</b>', 'aria-label': 'Parts bin: ' + e.part.label });
      else if (e.type === 'socket') el = h('div', { class: 'ent socket', style: pct(e.x, e.y), 'aria-label': 'Socket ' + (e.label || e.id) });
      else if (e.type === 'lever') el = h('div', { class: 'ent lever', style: pct(e.x, e.y), html: '<i></i><b>TEST</b>', 'aria-label': 'Test lever' });
      else el = h('div', { class: 'ent fixed k-' + (e.kind || 'BOX'), style: pct(e.x, e.y), html: glyph(e.kind) + '<b>' + (e.label || '') + '</b>' + (e.sub ? '<small>' + e.sub + '</small>' : ''), 'aria-label': (e.label || '') + ' ' + (e.sub || '') });
      el.addEventListener('click', () => clickEnt(e));
      els.set(e, el); room.append(el);
    });
    const me = h('div', { class: 'me', style: pct(pos.x, pos.y), 'aria-hidden': 'true' }, h('div', { class: 'carry' }), h('div', { class: 'body' }));
    room.append(me);
    const marker = h('div', { class: 'facemark', 'aria-hidden': 'true' }); room.append(marker);

    const note = h('div', { class: 'labnote', 'aria-live': 'polite' });
    const meters = h('div', { class: 'labmeters', 'aria-live': 'polite' });
    const tipbar = h('div', { class: 'labtip' });
    const teach = s.teach ? h('div', { class: 'labteach', html: '<b class="eh">Lab notebook</b>' + s.teach }) : null;
    const pad = h('div', { class: 'labpad' },
      h('button', { tabindex: -1, 'aria-label': 'Up', onclick: () => step('u') }, '▲'), h('button', { tabindex: -1, 'aria-label': 'Left', onclick: () => step('l') }, '◀'),
      h('button', { tabindex: -1, 'aria-label': 'Down', onclick: () => step('d') }, '▼'), h('button', { tabindex: -1, 'aria-label': 'Right', onclick: () => step('r') }, '▶'),
      h('button', { class: 'act', tabindex: -1, onclick: () => act() }, 'Grab / place'), h('button', { class: 'act', tabindex: -1, onclick: () => b.check() }, 'TEST'));
    const el = h('div', { class: 'labwrap' }, teach, room, tipbar, meters, note, pad);

    const target = () => { const d = DV[face]; return at(pos.x + d[0], pos.y + d[1]); };
    const free = (x, y) => x >= 0 && y >= 0 && x < cols && y < rows && !at(x, y);
    function step(dir) {
      if (done || run.answered) return; face = dir;
      const d = DV[dir], nx = pos.x + d[0], ny = pos.y + d[1];
      if (free(nx, ny)) { pos = { x: nx, y: ny }; sfx.tick && sfx.tick(); }
      paint();
    }
    function snapshot() { return Object.assign({}, placed); }
    function act() {
      if (done || run.answered) return;
      const t = target(); if (!t) { tipbar.textContent = 'Nothing in front of you. Face a bin, a socket or the lever.'; return; }
      if (t.type === 'bin') { carry = t.part; }
      else if (t.type === 'socket') {
        if (carry) { const prev = placed[t.id]; placed[t.id] = carry; carry = prev || null; }
        else if (placed[t.id]) { carry = placed[t.id]; placed[t.id] = null; }
      } else if (t.type === 'lever') { return b.check(); }
      else if (t.type === 'fixed') { tipbar.textContent = t.info || ((t.label || '') + ' ' + (t.sub || '')); return; }
      paint();
    }
    function clickEnt(e) {
      if (done || run.answered) return;
      // stand on any free neighbour and face the thing
      const opts = [['u', 0, 1], ['d', 0, -1], ['l', 1, 0], ['r', -1, 0]].map(([f, dx, dy]) => ({ f, x: e.x + dx, y: e.y + dy })).filter(o => free(o.x, o.y));
      if (!opts.length) return; opts.sort((a, b2) => Math.abs(a.x - pos.x) + Math.abs(a.y - pos.y) - Math.abs(b2.x - pos.x) - Math.abs(b2.y - pos.y));
      pos = { x: opts[0].x, y: opts[0].y }; face = opts[0].f; act();
    }
    function result() {
      const filled = sockets.every(k => placed[k.id]);
      const r = s.model(snapshot()) || {};
      return { filled, r };
    }
    function paint() {
      me.style.cssText = pct(pos.x, pos.y);
      me.className = 'me f-' + face + (carry ? ' has' : '');
      me.firstChild.innerHTML = carry ? glyph(carry.kind || 'R') + '<b>' + carry.label + '</b>' : '';
      const d = DV[face], t = target();
      marker.style.cssText = pct(pos.x + d[0], pos.y + d[1]); marker.classList.toggle('on', !!t);
      ents.forEach(e => {
        const x = els.get(e); x.classList.toggle('target', e === t);
        if (e.type === 'socket') { const p = placed[e.id]; x.classList.toggle('full', !!p); x.innerHTML = p ? glyph(p.kind || 'R') + '<b>' + p.label + '</b>' : '<b class="q">?</b>' + (e.label ? '<small>' + e.label + '</small>' : ''); x.setAttribute('aria-label', 'Socket ' + (e.label || e.id) + (p ? ' holds ' + p.label : ' empty')); }
      });
      if (t) tipbar.textContent = t.type === 'bin' ? (carry ? 'Space: swap what you hold for ' : 'Space: pick up ') + t.part.label : t.type === 'socket' ? (carry ? (placed[t.id] ? 'Space: swap ' + carry.label + ' with ' + placed[t.id].label : 'Space: place ' + carry.label + ' here') : (placed[t.id] ? 'Space: take ' + placed[t.id].label + ' back' : 'Hold a part first')) : t.type === 'lever' ? 'Space or Enter: TEST the circuit' : 'Look: ' + (t.label || '');
      else tipbar.textContent = carry ? 'You are holding ' + carry.label + '. Walk to a socket.' : 'Walk to a parts bin and press Space to pick one up.';
      const { filled, r } = result();
      meters.replaceChildren(...(r.meters || []).map(m => h('div', { class: 'meter ' + (m.st || '') }, h('small', null, m.k), h('b', null, m.v))));
      const coach = s.coach && !done ? s.coach(snapshot(), carry) : '';
      note.innerHTML = (filled ? (r.note || '') : (r.note || '')) + (coach ? '<div class="coach"><b>Next:</b> ' + coach + '</div>' : '');
      room.classList.toggle('live', !!(filled && r.live));
    }
    paint();
    const b = {
      el, checkLabel: 'Test circuit (Enter)', keys: 'W A S D or arrows walk · Space / E grab or place · Q put down · Enter / T test',
      key(e, dir) {
        if (done) return false;
        if (dir) { step(dir); return true; }
        if (e.key === ' ' || e.key === 'e' || e.key === 'E') { act(); return true; }
        if (e.key === 'q' || e.key === 'Q' || e.key === 'Backspace') { carry = null; paint(); return true; }
        if (e.key === 'Enter' || e.key === 't' || e.key === 'T') { b.check(); return true; }
        return false;
      },
      check() {
        if (done || run.answered) return;
        const { filled, r } = result();
        if (!filled) { note.innerHTML = '<b>Fill every socket first.</b> ' + (r.note || ''); tipbar.textContent = 'Some sockets are still empty.'; return; }
        if (r.ok) { done = true; run.spec.why = r.why || r.note; room.classList.add('live', 'won'); }
        else { note.innerHTML = '<b>Not working yet.</b> ' + (r.fail || r.note || ''); }
        c.attempt(!!r.ok);
      },
      retry() { room.classList.remove('won'); },
      reveal() { done = true; solve(); paint(); },
      auto() { solve(); paint(); b.check(); },
      autoWrong() { const combos = enumerate(); const bad = combos.find(x => !s.model(x).ok); Object.assign(placed, bad || {}); paint(); b.check(); },
      lab: { cols, rows, ents, pos: () => pos, face: () => face, carry: () => carry, placed: () => placed },
    };
    function enumerate() {
      const out = [], ids = sockets.map(k => k.id);
      const rec = (i, cur) => { if (i === ids.length) return void out.push(Object.assign({}, cur)); parts.forEach(p => { cur[ids[i]] = p; rec(i + 1, cur); }); };
      rec(0, {}); return out;
    }
    function solve() { const ok = enumerate().find(x => s.model(x).ok); if (ok) Object.assign(placed, ok); carry = null; }
    return b;
  };

  /* ---------- analogy switch: always visible, works mid-level ---------- */
  function anaLabel() { const b = $('#anaBtn'); if (!b) return; b.setAttribute('aria-pressed', S.ana ? 'true' : 'false'); b.firstChild.textContent = 'Analogy: ' + (S.ana ? 'ON' : 'OFF'); b.title = (S.ana ? 'Now showing: ' + cfg.modes.on : 'Now showing: ' + cfg.modes.off) + '. Click or press N to switch.'; document.body.classList.toggle('ana-off', !S.ana); }
  function setAna(v) {
    S.ana = !!v; save(); anaLabel();
    if (!run) return home();
    if (run.briefing) return start(run.level);
    const box = $('.stage');
    if (box && cfg.stage && run.stage) {
      const total = run.level.chals.length;
      if (run.stage.destroy) run.stage.destroy(); box.replaceChildren();
      run.stage = cfg.stage(run.level, box, !!S.ana);
      if (run.stage && run.stage.setProgress) run.stage.setProgress(0, total);
      const dn = run.i + (run.answered && run.results[run.i] && run.results[run.i].ok ? 1 : 0);
      if (run.stage && run.stage.advance) run.stage.advance(dn, total);
      if (run.stage && run.stage.bad && run.hearts < (cfg.hearts || 3)) run.stage.bad(run.hearts);
    }
    drawHud();
    const t = $('#lvtitle'); if (t) t.replaceChildren(h('span', { class: 'lvl' }, 'Level ' + run.level.n), ' · ' + lvTitle(run.level));
  }

  /* ---------- public ---------- */
  function init(config) {
    cfg = config; S = Object.assign({ levels: {}, calm: false, mute: false, ana: true }, load());
    appEl = $('#app');
    const ab = h('button', { id: 'anaBtn', class: 'anabtn', onclick: e => { setAna(!S.ana); e.currentTarget.blur(); } }, h('span'));
    document.body.append(ab); anaLabel();
    document.body.append(h('a', { class: 'hubbtn', href: '../', title: 'Back to the main screen' }, '⌂ Hub'));
    cfg.levels.forEach(l => { l.chals = l.chals.map((c, i) => [c, i]).sort((a, b) => ((a[0].t === 'lab' ? 0 : 1) - (b[0].t === 'lab' ? 0 : 1)) || ((a[0].boss ? 1 : 0) - (b[0].boss ? 1 : 0)) || ((a[0].tier || 1) - (b[0].tier || 1)) || a[1] - b[1]).map(x => x[0]); });
    home();
    if (TEST) window.__kit = {
      cfg, start: n => start(cfg.levels.find(l => l.n === n)), home,
      run: () => run, auto: () => run && run.b && run.b.auto(), autoWrong: () => run && run.b && run.b.autoWrong(),
      next: () => { const b = $('#nextbtn'); if (b) b.click(); else { const g = $('#go'); if (g) g.click(); } let n = 0; while ($('#body .lesson') && $('#go') && n++ < 5) $('#go').click(); },
      key: (k) => document.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true })),
      mode: () => run && run.mode,
      state: () => S,
    };
  }

  return { init, h, rnd, pick, shuffle, fmt, $, TEST, isAna: () => !!(S && S.ana) };
})();

/* Basic Circuits Quest: level content. Challenges follow the lecture goals lists and the op amp guide; analogy copy is water pipes. */
const { rnd, pick, fmt, shuffle } = Kit;
const M = s => '<span class="m">' + s + '</span>';
const WATER_LEVELS = [];
const LV = (_n, lec, diff, topic, blurb, intro, ana, chals, parts) => WATER_LEVELS.push({ n: WATER_LEVELS.length + 1, lec, diff, topic, blurb, intro, ana, chals, theme: { parts: parts || ['R'], phase: WATER_LEVELS.length * 17 } });

/* ---------------------------------------------------------------- 1 */
LV(1, '1.2', 1, 'Circuit Variables', 'Charge, current, voltage, power and energy, and the units that go with them.',
  'Four quantities describe every circuit. <b>Current</b> is the rate charge flows: <span class="m">i = dq/dt</span>. <b>Voltage</b> is energy per charge. <b>Power</b> is the rate energy is used: <span class="m">p = dw/dt</span>. Energy is power added up over time.',
  { title: 'Meet the Water System', mission: 'Learn what flows, what pushes, and how fast the work gets done.', key: 'Charge is the water itself. Current is how much water passes a point each second. Voltage is the pressure pushing it. Power is how quickly the water does work, and energy is the total work done over time.', map: [['Charge (C)', 'Gallons of water'], ['Current (A)', 'Gallons per second'], ['Voltage (V)', 'Water pressure'], ['Power (W)', 'Work per second'], ['Energy (J)', 'Total work done']] },
  [
    { t: 'choice', tier: 1, q: 'Which equation defines current?', opts: ['i = dq/dt', 'i = dw/dt', 'i = v/q', 'i = p·t'], a: 0, hint: 'Current is how fast charge moves past a point.', why: 'Current is the rate of change of charge, i = dq/dt. One ampere is one coulomb per second.', ana: 'Current is gallons per second, so it is the rate the water amount changes.' },
    { t: 'match', tier: 1, q: 'Match each quantity to its unit.', pairs: [['Current', 'Ampere (A)'], ['Voltage', 'Volt (V)'], ['Power', 'Watt (W)'], ['Energy', 'Joule (J)'], ['Charge', 'Coulomb (C)']], extra: ['Henry (H)'], why: 'Current in amperes, voltage in volts, power in watts, energy in joules, charge in coulombs.' },
    { t: 'num', tier: 2, gen() { const i = pick([2, 3, 5, 10]), t = pick([3, 4, 6, 8]); return { q: 'A steady current of ' + M(i + ' A') + ' flows for ' + M(t + ' s') + '. How much charge passes?', given: ['i = ' + i + ' A', 't = ' + t + ' s'], unit: 'C', a: i * t, tol: 0.02, hint: 'For a steady current, q = i · t.', why: 'q = i·t = ' + i + ' × ' + t + ' = ' + i * t + ' C.', ana: 'Flow rate times time is the total water that went by.' }; } },
    { t: 'num', tier: 2, gen() { const P = pick([40, 60, 100, 150]), t = pick([10, 20, 30, 60]); return { q: 'A device uses constant power ' + M(P + ' W') + ' for ' + M(t + ' s') + '. How much energy does it use?', given: ['p = ' + P + ' W', 't = ' + t + ' s'], unit: 'J', a: P * t, tol: 0.02, hint: 'Energy is power times time when power is steady.', why: 'w = p·t = ' + P + ' × ' + t + ' = ' + P * t + ' J.' }; } },
    { t: 'num', tier: 3, boss: true, gen() { const i1 = pick([2, 3, 4]), t1 = pick([2, 3, 5]), i2 = pick([1, 2]), t2 = pick([4, 6, 8]); return { q: 'A current of ' + M(i1 + ' A') + ' flows for ' + M(t1 + ' s') + ', then ' + M(i2 + ' A') + ' flows for ' + M(t2 + ' s') + '. Find the total charge that passed.', given: ['i₁ = ' + i1 + ' A for ' + t1 + ' s', 'i₂ = ' + i2 + ' A for ' + t2 + ' s'], unit: 'C', a: i1 * t1 + i2 * t2, tol: 0.02, hint: 'Add the charge from each interval.', why: 'q = ' + i1 + '×' + t1 + ' + ' + i2 + '×' + t2 + ' = ' + (i1 * t1 + i2 * t2) + ' C.' }; } },
    { t: 'choice', tier: 2, q: 'A car starter draws ' + M('500 A') + ' for ' + M('2 s') + '. A lightning bolt carries ' + M('10,000 A') + ' for ' + M('0.1 s') + '. How do the charges compare?', opts: ['About the same: 1,000 C each', 'The lightning bolt moves far more charge', 'The car starter moves far more charge', 'The bolt moves 20 times more charge'], a: 0, hint: 'q = i·t for each.', why: 'Car: 500 × 2 = 1,000 C. Bolt: 10,000 × 0.1 = 1,000 C. The bolt just delivers its charge 20 times faster.', ana: 'Same amount of water, but the bolt pours it in a tenth of a second.' },
  ]);

/* ---------------------------------------------------------------- 2 */
LV(2, '1.3', 1, 'Power and the Passive Sign Convention', 'Positive power means absorbing, negative means delivering, and power always balances.',
  'The <b>passive sign convention</b>: if the current enters the <b>positive</b> terminal, then <span class="m">p = v·i</span>. If <span class="m">p &gt; 0</span> the element <b>absorbs</b> power. If <span class="m">p &lt; 0</span> it <b>delivers</b> power. In any circuit the delivered power equals the absorbed power.',
  { title: 'Who Is Pumping?', mission: 'Tell which parts drink water and which parts push it, and check the books balance.', key: 'Some parts take water and use its pressure (they absorb power). The pump pushes water out (it delivers power). Add up every part and the total pushed always equals the total used: no water is created or lost.', map: [['p > 0', 'The part is drinking water (absorbing)'], ['p < 0', 'The part is pumping water (delivering)'], ['Power balance', 'Total pumped = total used']] },
  [
    { t: 'choice', tier: 1, q: 'Under the passive sign convention, what does <span class="m">p &gt; 0</span> mean?', opts: ['The element absorbs power', 'The element delivers power', 'The element is an ideal source', 'The current is zero'], a: 0, hint: 'Current enters the + terminal, like it does for a resistor.', why: 'With current into the + terminal, p = vi &gt; 0 means energy flows into the element: it absorbs power.' },
    { t: 'sort', tier: 1, q: 'Sort each element by what it is doing.', buckets: ['Absorbing power', 'Delivering power'], items: [['p = +30 W', 0], ['p = −12 W', 1], ['A resistor with 2 A through it', 0], ['A battery that is discharging', 1], ['p = −0.5 W', 1], ['p = +8 W', 0]], why: 'Positive p absorbs. Negative p delivers. A resistor can only absorb. A discharging battery delivers.' },
    { t: 'num', tier: 2, gen() { const v = pick([5, 9, 12, 24]), i = pick([-3, -2, 2, 4]); return { q: 'Current ' + M(i + ' A') + ' enters the + terminal of an element with ' + M(v + ' V') + ' across it. Find p (use the sign: negative means delivering).', given: ['v = ' + v + ' V', 'i = ' + i + ' A'], unit: 'W', a: v * i, abs: 0.01, tol: 0.02, hint: 'p = v · i, keep the sign.', why: 'p = ' + v + ' × (' + i + ') = ' + v * i + ' W. ' + (v * i < 0 ? 'Negative, so it delivers power.' : 'Positive, so it absorbs power.') }; } },
    { t: 'choice', tier: 2, q: 'The current enters the <b>negative</b> terminal of an element. How do you find its absorbed power?', opts: ['p = −v·i', 'p = v·i', 'p = v/i', 'p = i²'], a: 0, hint: 'The passive sign convention needs the current entering the + terminal.', why: 'If the current enters the − terminal, the reference directions are opposite to the passive convention, so p = −vi.' },
    { t: 'num', tier: 3, boss: true, gen() { const a = pick([20, 30, 45, 60]), b = pick([10, 15, 25, 40]); return { q: 'In a circuit, one element absorbs ' + M(a + ' W') + ' and another absorbs ' + M(b + ' W') + '. One more element, a source, supplies all the power. How much does the source deliver?', given: ['absorbed: ' + a + ' W and ' + b + ' W'], unit: 'W', a: a + b, tol: 0.02, hint: 'Power delivered = power absorbed.', why: 'Power balance: delivered = ' + a + ' + ' + b + ' = ' + (a + b) + ' W.' }; } },
  ]);

/* ---------------------------------------------------------------- 3 */
LV(3, '2.1', 1, 'Sources and Ohm’s Law', 'Ideal sources, dependent sources, v = iR and resistor power.',
  '<b>Ohm’s law</b>: <span class="m">v = iR</span>. A resistor absorbs <span class="m">p = vi = i²R = v²/R</span>. An ideal voltage source fixes the voltage, an ideal current source fixes the current. Dependent sources have a value set by another voltage or current in the circuit.',
  { title: 'Pumps and Narrow Pipes', mission: 'Learn how pressure, flow and pipe width tie together.', key: 'A voltage source is a pump that holds the pressure steady. A current source is a pump that holds the flow steady. A resistor is a narrow pipe: more squeeze (bigger R) means less flow for the same pressure, and the squeeze wastes energy as heat.', map: [['Voltage source', 'Pump with set pressure'], ['Current source', 'Pump with set flow'], ['Resistor', 'Narrow pipe'], ['v = iR', 'Pressure drop = flow × squeeze'], ['Dependent source', 'A pump controlled by a gauge elsewhere']] },
  [
    { t: 'num', tier: 1, gen() { const R = pick([100, 220, 470, 1000]), i = pick([2, 5, 10, 20]); return { q: 'A ' + M(R + ' Ω') + ' resistor carries ' + M(i + ' mA') + '. What is the voltage across it?', given: ['R = ' + R + ' Ω', 'i = ' + i + ' mA'], unit: 'V', a: R * i / 1000, tol: 0.02, hint: 'v = iR. Convert mA to A.', why: 'v = ' + (i / 1000) + ' A × ' + R + ' Ω = ' + fmt(R * i / 1000, 3) + ' V.' }; } },
    { t: 'match', tier: 1, q: 'Match each dependent source to what controls it.', pairs: [['VCVS', 'Voltage source controlled by a voltage'], ['CCVS', 'Voltage source controlled by a current'], ['VCCS', 'Current source controlled by a voltage'], ['CCCS', 'Current source controlled by a current']], extra: ['An independent source'], why: 'The first letter after the V/C says what is controlled; the first V/C says what the control signal is. VCVS = voltage controls voltage source.' },
    { t: 'sort', tier: 2, q: 'Sort each interconnection: allowed with ideal sources, or not allowed?', buckets: ['Allowed', 'Not allowed'], items: [['An ideal voltage source in parallel with a resistor', 0], ['Two different ideal voltage sources in parallel', 1], ['An ideal current source in series with a resistor', 0], ['Two different ideal current sources in series', 1], ['An ideal voltage source shorted by a wire', 1], ['An ideal current source with its terminals open', 1]], why: 'Ideal sources cannot break their own definition. Two voltage sources in parallel with different values, or two current sources in series with different values, contradict each other. A voltage source with a short or a current source with an open circuit also fails.' },
    { t: 'num', tier: 2, gen() { const R = pick([10, 20, 50, 100]), v = pick([5, 10, 12, 20]); return { q: 'A resistor of ' + M(R + ' Ω') + ' has ' + M(v + ' V') + ' across it. How much power does it absorb?', given: ['R = ' + R + ' Ω', 'v = ' + v + ' V'], unit: 'W', a: v * v / R, tol: 0.02, hint: 'p = v²/R.', why: 'p = v²/R = ' + v * v + '/' + R + ' = ' + fmt(v * v / R, 3) + ' W.' }; } },
    { t: 'num', tier: 3, boss: true, gen() { const R = pick([100, 220, 330, 470]), P = pick([0.25, 0.5, 1]); return { q: 'A ' + M(R + ' Ω') + ' resistor is rated for ' + M(P + ' W') + '. What is the largest voltage you can safely put across it?', given: ['R = ' + R + ' Ω', 'rating = ' + P + ' W'], unit: 'V', a: Math.sqrt(P * R), tol: 0.02, hint: 'Use P = v²/R and solve for v.', why: 'v = √(P·R) = √(' + P + ' × ' + R + ') = ' + fmt(Math.sqrt(P * R), 2) + ' V.' }; } },
    { t: 'num', tier: 2, gen() { const cols = ['black', 'brown', 'red', 'orange', 'yellow', 'green', 'blue', 'violet', 'grey', 'white']; const d1 = rnd(1, 9), d2 = rnd(0, 9), m = rnd(0, 4); const v = (10 * d1 + d2) * Math.pow(10, m); return { q: 'A 4-band resistor is ' + M(cols[d1] + ', ' + cols[d2] + ', ' + cols[m] + ', gold') + '. What is its value in ohms?', unit: 'Ω', a: v, tol: 0.001, hint: 'Digits: black 0, brown 1, red 2, orange 3, yellow 4, green 5, blue 6, violet 7, grey 8, white 9. The third band is the multiplier (power of 10).', why: 'Digits ' + d1 + d2 + ', times 10^' + m + ' = ' + v + ' Ω. Gold means 5% tolerance.' }; } },
  ], ['R']);

/* ---------------------------------------------------------------- 4 */
LV(4, '2.2', 2, 'Kirchhoff’s Laws', 'KCL at nodes and KVL around loops.',
  '<b>KCL</b>: the currents at a node add to zero (what flows in flows out). <b>KVL</b>: the voltages around any closed loop add to zero. Together with Ohm’s law they solve any circuit.',
  { title: 'Junctions and Loops', mission: 'Keep every pipe junction balanced and every loop of pressure paid back.', key: 'KCL is about junctions: water going into a junction must come back out, nothing piles up. KVL is about a full lap around the pipe loop: every bit of pressure the pump adds gets used up by the narrow pipes and fittings before you get back to the start.', map: [['KCL', 'Water in = water out at a junction'], ['KVL', 'Pressure added = pressure used on a full lap'], ['Node', 'A pipe junction'], ['Loop', 'A closed circuit of pipe']] },
  [
    { t: 'sort', tier: 1, q: 'Sort each statement by the law it describes.', buckets: ['KCL', 'KVL'], items: [['Currents leaving a node sum to zero', 0], ['Voltages around a closed path sum to zero', 1], ['What flows into a junction equals what flows out', 0], ['The sources’ rises equal the resistors’ drops in a loop', 1]], why: 'KCL is about currents at a node. KVL is about voltages around a loop.' },
    { t: 'num', tier: 1, gen() { const a = pick([3, 4, 5, 6]), b = pick([1, 2, 3]), c = pick([2, 3, 4]); return { q: 'At a node, ' + M(a + ' A') + ' and ' + M(b + ' A') + ' flow in, and ' + M(c + ' A') + ' flows out on one wire. A fourth wire carries the rest out. How much?', given: ['in: ' + a + ' A, ' + b + ' A', 'out: ' + c + ' A and i₄'], unit: 'A', a: a + b - c, tol: 0.02, hint: 'In = out.', why: 'i₄ = ' + a + ' + ' + b + ' − ' + c + ' = ' + (a + b - c) + ' A out.' }; } },
    { t: 'num', tier: 2, gen() { const Vs = pick([9, 12, 15, 24]), v1 = pick([2, 3, 4]), v2 = pick([1, 2, 3]); return { q: 'A ' + M(Vs + ' V') + ' source drives three resistors in series. The first two have drops of ' + M(v1 + ' V') + ' and ' + M(v2 + ' V') + '. What is the drop across the third?', given: ['Vs = ' + Vs + ' V', 'v₁ = ' + v1 + ' V', 'v₂ = ' + v2 + ' V'], unit: 'V', a: Vs - v1 - v2, tol: 0.02, hint: 'KVL: the source equals the sum of the drops.', why: 'v₃ = ' + Vs + ' − ' + v1 + ' − ' + v2 + ' = ' + (Vs - v1 - v2) + ' V.' }; } },
    { t: 'choice', tier: 2, q: 'A 10 V battery connects to a resistor with a gap in the wire (an open circuit). What is the voltage across the gap?', opts: ['10 V', '0 V', '5 V', 'Cannot be found'], a: 0, hint: 'No current means no drop across the resistor. Apply KVL around the loop including the gap.', why: 'With the gap, no current flows, so the resistor drops 0 V. KVL around the loop puts the whole 10 V across the gap.' },
    { t: 'num', tier: 3, boss: true, gen() { const Vs = pick([12, 18, 24]), R1 = pick([100, 200, 300]), R2 = pick([100, 200, 600]); const i = Vs / (R1 + R2); return { q: 'A ' + M(Vs + ' V') + ' source drives ' + M(R1 + ' Ω') + ' in series with ' + M(R2 + ' Ω') + '. Find the voltage across the second resistor.', given: ['Vs = ' + Vs + ' V', 'R₁ = ' + R1 + ' Ω', 'R₂ = ' + R2 + ' Ω'], unit: 'V', a: i * R2, tol: 0.02, hint: 'Find i with KVL and Ohm’s law, then v = iR₂.', why: 'i = ' + Vs + '/(' + R1 + '+' + R2 + ') = ' + fmt(i * 1000, 2) + ' mA, so v₂ = ' + fmt(i * R2, 2) + ' V.' }; } },
  ]);

LV(5, '2.3', 2, 'Kirchhoff with Dependent Sources', 'KCL and KVL practice, including dependent sources.',
  'Dependent sources follow the same laws. Write KVL or KCL as usual, treat the dependent source value as an expression in the control variable, then solve for it.',
  { title: 'The Pump That Reads a Gauge', mission: 'Use the same junction and loop rules when a pump listens to a gauge.', key: 'A dependent source is a pump whose strength is set by a gauge somewhere else in the pipes. The loop and junction rules do not change. Just write the pump’s strength in terms of the gauge reading and solve for the gauge.', map: [['Dependent source', 'Pump driven by a gauge'], ['Control variable', 'The gauge reading']] },
  [
    { t: 'choice', tier: 1, q: 'When solving a circuit with a dependent source, what should you do first?', opts: ['Write its value in terms of the control variable, then use KVL/KCL as usual', 'Replace it with a short circuit', 'Ignore it until the end', 'Treat it as an independent source with the same number'], a: 0, hint: 'The laws do not change.', why: 'Express the dependent source in the control variable, then write KVL or KCL like normal. The control variable becomes part of the equation.' },
    { t: 'num', tier: 1, gen() { const Vs = pick([10, 12, 20, 30]), R = pick([2, 3, 4, 5]), k = pick([1, 2, 3]); return { q: 'A single loop has a ' + M(Vs + ' V') + ' source, a ' + M(R + ' Ω') + ' resistor and a dependent voltage source of ' + M(k + '·i') + ' V (opposing the source), where i is the loop current. Find i.', given: ['Vs = ' + Vs + ' V', 'R = ' + R + ' Ω', 'v_dep = ' + k + ' i'], unit: 'A', a: Vs / (R + k), tol: 0.02, hint: 'KVL: Vs = iR + k·i.', why: 'Vs = (R + k)·i, so i = ' + Vs + '/' + (R + k) + ' = ' + fmt(Vs / (R + k), 3) + ' A.' }; } },
    { t: 'num', tier: 2, gen() { const k = pick([2, 3, 4]), ix = pick([1, 2, 3]); const T = ix * (1 + k); return { q: 'A node receives ' + M(T + ' A') + '. It leaves through a resistor branch carrying i<sub>x</sub> and through a dependent current source of ' + M(k + '·i<sub>x</sub>') + '. Find i<sub>x</sub>.', given: ['in: ' + T + ' A', 'out: ix and ' + k + ' ix'], unit: 'A', a: ix, tol: 0.02, hint: 'KCL: in = ix + k·ix.', why: 'KCL: ' + T + ' = i<sub>x</sub>(1 + ' + k + '), so i<sub>x</sub> = ' + ix + ' A.' }; } },
    { t: 'choice', tier: 2, q: 'In a loop with a dependent voltage source, what does the source’s sign tell you?', opts: ['Whether it adds to or opposes the other sources in KVL', 'Whether it is ideal', 'Nothing, you can ignore it', 'Which node is the reference'], a: 0, hint: 'KVL needs correct signs on every rise and drop.', why: 'A dependent source rises or drops like any other. Its polarity decides its sign in the KVL equation.' },
    { t: 'num', tier: 3, boss: true, gen() { const Vs = pick([12, 18, 24]), R = pick([2, 4, 5]), k = pick([2, 3]); const i = Vs / (R + k); return { q: 'Same loop as before: ' + M(Vs + ' V') + ' source, ' + M(R + ' Ω') + ', and a dependent source of ' + M(k + '·i') + ' V opposing. How much power does the <b>dependent source</b> absorb?', given: ['Vs = ' + Vs + ' V', 'R = ' + R + ' Ω', 'v_dep = ' + k + ' i'], unit: 'W', a: k * i * i, tol: 0.02, hint: 'Find i, then p = v·i = k·i².', why: 'i = ' + fmt(i, 3) + ' A, so p = ' + k + ' × i² = ' + fmt(k * i * i, 2) + ' W (absorbing, since current enters its + terminal).' }; } },
  ]);

/* ---------------------------------------------------------------- 6 */
LV(6, '3.1', 2, 'Combining Resistors', 'Series, parallel, and shrinking a network step by step.',
  'Resistors in <b>series</b> add: <span class="m">R<sub>eq</sub> = R₁ + R₂</span>. In <b>parallel</b> the conductances add; for two resistors <span class="m">R<sub>eq</sub> = R₁R₂/(R₁+R₂)</span>. Collapse the network from the far end toward the source.',
  { title: 'Merging Pipes', mission: 'Replace a tangle of pipes with one pipe that behaves the same.', key: 'Pipes in a row (series) add their squeeze. Side-by-side pipes (parallel) give the water extra paths, so the total squeeze goes down. Parallel is always easier than the easiest single pipe.', map: [['Series', 'Pipes in a row: same flow'], ['Parallel', 'Pipes side by side: same pressure'], ['Req', 'One pipe that acts the same']] },
  [
    { t: 'match', tier: 1, q: 'Match each connection to what it shares.', pairs: [['Series', 'The same current'], ['Parallel', 'The same voltage']], extra: ['The same resistance'], why: 'Series elements carry one current. Parallel elements sit across the same two nodes, so they share a voltage.' },
    { t: 'num', tier: 1, gen() { const a = pick([10, 20, 30, 50]), b = pick([10, 40, 60, 100]); return { q: M(a + ' Ω') + ' and ' + M(b + ' Ω') + ' are in series. Find R<sub>eq</sub>.', unit: 'Ω', a: a + b, tol: 0.02, hint: 'Series resistances add.', why: 'R<sub>eq</sub> = ' + a + ' + ' + b + ' = ' + (a + b) + ' Ω.' }; } },
    { t: 'num', tier: 2, gen() { const a = pick([10, 20, 30, 60]), b = pick([20, 30, 60, 90]); return { q: M(a + ' Ω') + ' and ' + M(b + ' Ω') + ' are in parallel. Find R<sub>eq</sub>.', unit: 'Ω', a: a * b / (a + b), tol: 0.02, hint: 'R₁R₂ / (R₁ + R₂).', why: 'R<sub>eq</sub> = ' + a + '×' + b + '/(' + a + '+' + b + ') = ' + fmt(a * b / (a + b), 2) + ' Ω.' }; } },
    { t: 'choice', tier: 2, q: 'Two resistors, 100 Ω and 400 Ω, are in parallel. Which statement is true about R<sub>eq</sub>?', opts: ['It is smaller than 100 Ω', 'It is between 100 Ω and 400 Ω', 'It is 500 Ω', 'It is larger than 400 Ω'], a: 0, hint: 'More paths means less total resistance.', why: 'Parallel resistance is always smaller than the smallest branch. Here it is 80 Ω.' },
    { t: 'num', tier: 3, boss: true, gen() { const R1 = pick([10, 20, 30]), R2 = pick([30, 60, 90]), R3 = pick([60, 30, 90]); const Req = R1 + R2 * R3 / (R2 + R3); return { q: M(R1 + ' Ω') + ' is in series with the parallel pair ' + M(R2 + ' Ω') + ' and ' + M(R3 + ' Ω') + '. Find R<sub>eq</sub> seen by the source.', unit: 'Ω', a: Req, tol: 0.02, hint: 'Parallel pair first, then add R₁.', why: 'R₂∥R₃ = ' + fmt(R2 * R3 / (R2 + R3), 2) + ' Ω. R<sub>eq</sub> = ' + R1 + ' + that = ' + fmt(Req, 2) + ' Ω.' }; } },
  ]);

LV(7, '3.1, 3.2', 2, 'Voltage and Current Dividers', 'Splitting voltage and current, and what a load does to a divider.',
  'Voltage divider: <span class="m">v₂ = v<sub>s</sub>·R₂/(R₁+R₂)</span>. Current divider: <span class="m">i₁ = i·R₂/(R₁+R₂)</span> (the smaller resistor gets more). Hooking a load across a divider output changes the output, because the load is in parallel with R₂.',
  { title: 'Splitting the Flow', mission: 'Share pressure and flow between pipes, and see why a thirsty load changes the split.', key: 'In a row, pipes share the pressure in proportion to their squeeze. Side by side, they share the flow, and the wider pipe takes more. Adding a load to the tap-off point is another pipe in parallel, which changes the split.', map: [['Voltage divider', 'Pressure split by squeeze'], ['Current divider', 'Flow split by pipe width'], ['Load', 'Another pipe added at the tap']] },
  [
    { t: 'num', tier: 1, gen() { const Vs = pick([9, 12, 24]), R1 = pick([1, 2, 3]), R2 = pick([1, 2, 3, 6]); return { q: 'A ' + M(Vs + ' V') + ' source feeds ' + M(R1 + ' kΩ') + ' in series with ' + M(R2 + ' kΩ') + '. Find the voltage across the second resistor.', unit: 'V', a: Vs * R2 / (R1 + R2), tol: 0.02, hint: 'v₂ = Vs·R₂/(R₁+R₂).', why: 'v₂ = ' + Vs + ' × ' + R2 + '/(' + R1 + '+' + R2 + ') = ' + fmt(Vs * R2 / (R1 + R2), 3) + ' V.' }; } },
    { t: 'choice', tier: 1, q: 'In a current divider, which branch gets more of the current?', opts: ['The branch with the smaller resistance', 'The branch with the larger resistance', 'They always split equally', 'The branch closer to the source'], a: 0, hint: 'Current follows the easier path.', why: 'Both branches share one voltage, so the smaller resistance carries the larger current.', ana: 'Flow takes the wide pipe more than the narrow one.' },
    { t: 'num', tier: 2, gen() { const I = pick([6, 9, 12]), R1 = pick([2, 3, 6]), R2 = pick([3, 6, 12]); return { q: M(I + ' A') + ' enters two parallel resistors, ' + M(R1 + ' Ω') + ' and ' + M(R2 + ' Ω') + '. Find the current through the ' + R1 + ' Ω resistor.', unit: 'A', a: I * R2 / (R1 + R2), tol: 0.02, hint: 'i₁ = i·R₂/(R₁+R₂). Note which resistance is on top.', why: 'i₁ = ' + I + ' × ' + R2 + '/(' + R1 + '+' + R2 + ') = ' + fmt(I * R2 / (R1 + R2), 3) + ' A.' }; } },
    { t: 'choice', tier: 2, q: 'A load is connected across the lower resistor of an unloaded divider. What happens to the output voltage?', opts: ['It drops', 'It rises', 'It stays the same', 'It becomes zero always'], a: 0, hint: 'The load is in parallel with R₂.', why: 'The load in parallel with R₂ lowers the effective resistance of the bottom leg, so a smaller share of Vs appears across it.' },
    { t: 'num', tier: 3, boss: true, gen() { const Vs = pick([10, 12, 15]), R1 = pick([10, 20]), R2 = pick([10, 20]), RL = pick([10, 20, 40]); const Rp = R2 * RL / (R2 + RL); return { q: 'A divider has ' + M('R₁ = ' + R1 + ' kΩ') + ' on top and ' + M('R₂ = ' + R2 + ' kΩ') + ' on the bottom, driven by ' + M(Vs + ' V') + '. A load of ' + M(RL + ' kΩ') + ' is added across R₂. Find the loaded output voltage.', unit: 'V', a: Vs * Rp / (R1 + Rp), tol: 0.02, hint: 'Combine R₂ ∥ R_L first, then divide.', why: 'R₂∥R_L = ' + fmt(Rp, 2) + ' kΩ. v = ' + Vs + ' × ' + fmt(Rp, 2) + '/(' + R1 + ' + ' + fmt(Rp, 2) + ') = ' + fmt(Vs * Rp / (R1 + Rp), 3) + ' V.' }; } },
    { t: 'num', tier: 1, gen() { const vp = pick([5, 10, 12]), al = pick([0.2, 0.25, 0.4, 0.75]); return { q: 'A potentiometer is connected across a ' + M(vp + ' V') + ' source. The wiper is set to ' + M(al * 100 + '%') + ' of the way up. What is the output voltage?', unit: 'V', a: vp * al, tol: 0.02, hint: 'v = α v_p.', why: 'v = ' + al + ' × ' + vp + ' = ' + fmt(vp * al, 3) + ' V.' }; } },
  ]);
