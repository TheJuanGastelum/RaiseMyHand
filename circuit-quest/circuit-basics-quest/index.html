    return dial({ rig: benchRig({ left: { kind: 'SRC', label: '3∠0°', sub: 'source 1', info: 'A 3 V source with phase 0°.' }, right: { kind: 'BOX', label: 'Σ', sub: 'sum', info: 'The two sources in series add as phasors.' }, sockets: [{ id: 'r', label: 'source 2 (∠90°)', x: 5 }] }), id: 'r',
      q: '<b>Build:</b> two sources in series: 3∠0° V and x∠90° V. Choose x so the total has a size of <b>5 V</b>.', teach: '<p>A sinusoid <b>V cos(ωt + θ)</b> becomes a <b>phasor V∠θ</b>: an arrow of length V at angle θ. Sinusoids of the same frequency add <b>as arrows</b>, not as plain numbers. At right angles the sizes combine like the sides of a right triangle: <b>√(3² + x²)</b>.</p>',
      parts: [1, 2, 3, 4, 5].map(v => PH(v, 'V∠90°')), read: p => mag(A, p.v), target: tgt, tol: .01, guide: true, label: 'Total size', show: x => N2(x) + ' V', note: (p, x) => '|sum| = √(3² + ' + p.v + '²) = <b>' + N2(x) + ' V</b>.', why: '√(3² + x²) = 5 gives x = 4 V (the 3-4-5 triangle).' }); } },
  { t: 'lab', tier: 2, hint: '|sum| = √(A² + x²) for sources at right angles.', q: '', gen() { const [A, B, C] = pick([[3, 4, 5], [6, 8, 10], [5, 12, 13], [8, 6, 10], [12, 5, 13]]);
    return dial({ rig: benchRig({ left: { kind: 'SRC', label: A + '∠0°', sub: 'source 1', info: A + ' V at 0°.' }, right: { kind: 'BOX', label: 'Σ', sub: 'sum', info: 'The sum of the two phasors.' }, sockets: [{ id: 'r', label: 'source 2 (∠90°)', x: 5 }] }), id: 'r', q: '<b>Build:</b> ' + A + '∠0° V plus x∠90° V must total <b>' + C + ' V</b>. Choose x.', teach: '<p>Same arrows. Work out the missing side of the right triangle first.</p>',
      parts: pickR([2, 3, 4, 5, 6, 8, 12], 5, B).map(v => PH(v, 'V∠90°')), read: p => mag(A, p.v), target: C, tol: .01, label: 'Total size', show: x => N2(x) + ' V', note: (p, x) => '√(' + A + '² + ' + p.v + '²) = ' + N2(x) + ' V.', why: 'x = √(' + C + '² − ' + A + '²) = ' + B + ' V.' }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'Two equal arrows: the sum is 10·|cos(θ/2)| for 5 V sources θ apart. Opposite arrows cancel.', q: '', gen() { const A = 5, th = pick([0, 60, 120, 180]), tgt = 2 * A * Math.abs(Math.cos(deg(th / 2)));
    return dial({ rig: benchRig({ left: { kind: 'SRC', label: A + '∠0°', sub: 'source 1', info: '5 V at 0°.' }, right: { kind: 'BOX', label: 'Σ', sub: 'sum', info: 'The sum of the phasors.' }, sockets: [{ id: 'r', label: 'source 2 (5 V, angle?)', x: 5 }] }), id: 'r', q: '<b>Build:</b> a second 5 V source joins the first (5∠0°). Choose its <b>phase angle</b> so the total is <b>' + N2(tgt) + ' V</b>.', teach: '<p>Now the size is fixed and the <b>angle</b> is yours. In phase (0°) the arrows add up fully. At 180° they cancel. In between the sum is <b>2 × 5 × cos(θ ÷ 2)</b>.</p>',
      parts: [0, 60, 90, 120, 180].map(v => PH(v, '°', 'SRC')), read: p => 2 * A * Math.abs(Math.cos(deg(p.v / 2))), target: tgt, tol: .01, label: 'Total size', show: x => N2(x) + ' V', note: (p, x) => 'Total = 2·5·cos(' + p.v / 2 + '°) = ' + N2(x) + ' V.', why: 'θ = ' + th + '° gives ' + N2(tgt) + ' V.' }); } },
]);

const ZC = (R, X) => mag(R, X);
WL(16, 'Impedance', [
  { t: 'lab', tier: 1, hint: '|Z| = √(R² + XL²), where XL = ω·L. ω = 1000 rad/s.', q: '', gen() { const R = 30, w = 1000, L = 0.04, tgt = ZC(R, w * L);
    return dial({ rig: benchRig({ left: { kind: 'SRC', label: '1000', sub: 'rad/s', info: 'The source runs at ω = 1000 rad/s.' }, right: { kind: 'BOX', label: '|Z|', sub: 'impedance', info: 'Shows the total impedance size.' }, top: [{ x: 3, kind: 'R', label: '30 Ω', sub: 'R', info: 'A 30 Ω resistor in series.' }], sockets: [{ id: 'r', label: 'coil L', x: 6 }] }),
      q: '<b>Build:</b> a 30 Ω resistor in series with a coil, at ω = 1000 rad/s. Choose the coil so the total <b>|Z| = ' + N2(tgt) + ' Ω</b>.', teach: '<p><b>Impedance Z</b> is resistance for AC: <b>Z = R + jX</b>. A coil has <b>X<sub>L</sub> = ωL</b> and a capacitor has <b>X<sub>C</sub> = −1 ÷ (ωC)</b>. The size is <b>|Z| = √(R² + X²)</b>, since R and X are at right angles.</p>',
      parts: [10, 20, 40, 60, 100].map(v => PT(v + ' mH', v / 1000, 'L')), read: p => ZC(R, w * p.v), target: tgt, tol: .01, guide: true, label: '|Z|', show: x => N2(x) + ' Ω', extra: (p) => [meterOf('XL', N2(w * p.v) + ' Ω')], note: (p, x) => 'XL = ωL = ' + N2(w * p.v) + ' Ω. |Z| = √(30² + XL²) = <b>' + N2(x) + ' Ω</b>.', why: 'XL = 40 Ω (L = 40 mH) gives |Z| = √(30² + 40²) = 50 Ω.' }); } },
  { t: 'lab', tier: 2, hint: 'A capacitor: XC = 1 ÷ (ω·C). Then |Z| = √(R² + XC²).', q: '', gen() { const R = pick([30, 60]), w = 1000, C = pick([20e-6, 25e-6, 50e-6, 100e-6]), tgt = ZC(R, 1 / (w * C));
    return dial({ rig: benchRig({ left: { kind: 'SRC', label: '1000', sub: 'rad/s', info: 'ω = 1000 rad/s.' }, right: { kind: 'BOX', label: '|Z|', sub: 'impedance', info: 'Total impedance size.' }, top: [{ x: 3, kind: 'R', label: R + ' Ω', sub: 'R', info: R + ' Ω in series.' }], sockets: [{ id: 'r', label: 'capacitor C', x: 6 }] }),
      q: '<b>Build:</b> ' + R + ' Ω in series with a capacitor at ω = 1000 rad/s. Choose C so <b>|Z| = ' + N2(tgt) + ' Ω</b>.', teach: '<p>A capacitor’s reactance falls as C grows: <b>X<sub>C</sub> = 1 ÷ (ωC)</b>.</p>',
      parts: pickR([10, 20, 25, 50, 100, 200], 5, C * 1e6).map(v => PT(v + ' µF', v * 1e-6, 'C')), read: p => ZC(R, 1 / (w * p.v)), target: tgt, tol: .01, label: '|Z|', show: x => N2(x) + ' Ω', extra: p => [meterOf('XC', N2(1 / (w * p.v)) + ' Ω')], note: (p, x) => 'XC = 1 ÷ (1000 × ' + E(p.v, 'F') + ') = ' + N2(1 / (w * p.v)) + ' Ω.', why: 'C = ' + C * 1e6 + ' µF gives XC = ' + N2(1 / (w * C)) + ' Ω and |Z| = ' + N2(tgt) + ' Ω.' }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'Resonance: the coil and the capacitor cancel when XL = XC. Then |Z| = R.', q: '', gen() { const R = 20, w = 1000;
    return mk({ rig: benchRig({ left: { kind: 'SRC', label: '1000', sub: 'rad/s', info: 'ω = 1000 rad/s.' }, right: { kind: 'BOX', label: '|Z|', sub: 'impedance', info: 'Total impedance size.' }, top: [{ x: 2, kind: 'R', label: '20 Ω', sub: 'R', info: '20 Ω in series.' }], sockets: [{ id: 'l', label: 'coil L', x: 5 }, { id: 'c', label: 'capacitor C', x: 8 }] }),
      q: '<b>Build:</b> a 20 Ω resistor, a coil and a capacitor in series at 1000 rad/s. Choose L and C so the circuit is at <b>resonance</b> (the total |Z| is as small as it can be: just 20 Ω).', teach: '<p>A coil’s <b>+jωL</b> and a capacitor’s <b>−j ÷ (ωC)</b> point in opposite directions. When <b>ωL = 1 ÷ (ωC)</b> they cancel, and only R is left. That is <b>resonance</b>.</p>',
      parts: [].concat([10, 20, 50, 100].map(v => PT(v + ' mH', v / 1000, 'L')), [10, 20, 50, 100].map(v => PT(v + ' µF', v * 1e-6, 'C'))), idle: [meterOf('|Z|', '—')],
      calc(p) { if (p.l.kind !== 'L' || p.c.kind !== 'C') return { ok: false, meters: [], note: 'The first socket takes a coil, the second a capacitor.', fail: 'Put a coil in the L socket and a capacitor in the C socket.' }; const XL = w * p.l.v, XC = 1 / (w * p.c.v), Z = ZC(R, XL - XC), ok = Math.abs(XL - XC) < 0.5;
        return { ok, meters: [meterOf('XL', N2(XL) + ' Ω'), meterOf('XC', N2(XC) + ' Ω'), meterOf('|Z|', N2(Z) + ' Ω', ok ? 'good' : 'bad')], note: 'Net reactance = ' + N2(XL) + ' − ' + N2(XC) + ' = ' + N2(XL - XC) + ' Ω.', why: 'ωL = 1 ÷ (ωC): the reactances cancel and only the 20 Ω is left.', fail: XL > XC ? 'The coil wins. Use a smaller L or a bigger C.' : 'The capacitor wins. Use a bigger L or a smaller C.' }; } }); } },
]);

WL(17, 'Source Transformations', [
  { t: 'lab', tier: 1, hint: 'A voltage source V in series with R equals a current source I = V ÷ R in parallel with the same R.', q: '', gen() { const V = 12, R = 4, tgt = 3;
    return dial({ rig: benchRig({ left: { kind: 'BAT', label: '12 V', sub: 'in series with 4 Ω', info: 'The original: 12 V in series with 4 Ω.' }, right: { kind: 'BOX', label: '= ?', sub: 'equivalent', info: 'An equivalent current source with the same 4 Ω in parallel.' }, sockets: [{ id: 'r', label: 'equivalent I', x: 5 }] }),
      q: '<b>Build:</b> replace a 12 V source in series with 4 Ω by a <b>current source</b> in parallel with 4 Ω. Choose its current.', teach: '<p><b>Source transformation:</b> a voltage source <b>V</b> with a series resistor <b>R</b> behaves exactly like a current source <b>I = V ÷ R</b> with the same <b>R</b> in parallel (and back: V = I · R). Both give the same current into any load.</p>',
      parts: [1, 2, 3, 4, 6].map(v => PT(v + ' A', v, 'SRC')), read: p => p.v, target: tgt, tol: .001, guide: true, label: 'Equivalent', show: x => N2(x) + ' A', note: (p, x) => 'I = V ÷ R = ' + V + ' ÷ ' + R + ' = 3 A. You chose <b>' + N2(x) + ' A</b>.', why: 'I = V ÷ R = 12 ÷ 4 = 3 A, with the 4 Ω now in parallel.', fail: x => x > 3 ? 'Too much.' : 'Too little.' }); } },
  { t: 'lab', tier: 2, hint: 'I = V ÷ R.', q: '', gen() { const V = pick([6, 12, 20, 24]), R = pick([2, 3, 4, 5]), I = V / R;
    return dial({ rig: benchRig({ left: { kind: 'BAT', label: V + ' V', sub: 'in series with ' + R + ' Ω', info: V + ' V with ' + R + ' Ω in series.' }, right: { kind: 'BOX', label: '= ?', sub: 'equivalent', info: 'The equivalent current source.' }, sockets: [{ id: 'r', label: 'equivalent I', x: 5 }] }),
      q: '<b>Build:</b> ' + V + ' V in series with ' + R + ' Ω. Choose the equivalent <b>current source</b> (with ' + R + ' Ω in parallel).', teach: '<p>Same rule: <b>I = V ÷ R</b>.</p>', parts: pickR([1, 2, 3, 4, 5, 6, 8, 10, 12], 5, I).map(v => PT(v + ' A', v, 'SRC')), read: p => p.v, target: I, tol: .001, label: 'Equivalent', show: x => N2(x) + ' A', note: (p, x) => 'You chose ' + N2(x) + ' A.', why: 'I = ' + V + ' ÷ ' + R + ' = ' + N2(I) + ' A.', fail: (x, t) => x > t ? 'Too much.' : 'Too little.' }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'Going back: V = I × R, with the same R now in series.', q: '', gen() { const I = pick([2, 3, 5]), R = pick([2, 4, 6]), V = I * R;
    return mk({ rig: benchRig({ left: { kind: 'SRC', label: I + ' A', sub: 'in parallel with ' + R + ' Ω', info: I + ' A source with ' + R + ' Ω in parallel.' }, right: { kind: 'BOX', label: '= ?', sub: 'equivalent', info: 'The equivalent voltage source and its series resistor.' }, sockets: [{ id: 'v', label: 'V', x: 4 }, { id: 'r', label: 'series R', x: 7 }] }),
      q: '<b>Build:</b> replace a ' + I + ' A current source with ' + R + ' Ω in parallel by a <b>voltage source</b> in series with a resistor. Choose both.', teach: '<p>The reverse transformation: <b>V = I · R</b>, and the resistor stays the same but moves to the series position.</p>',
      parts: [].concat(pickR([4, 6, 8, 10, 12, 18, 20, 30], 6, V).map(v => PT(v + ' V', v, 'BAT')), [2, 3, 4, 6].map(RP)), idle: [meterOf('Equivalent', '—')],
      calc(p) { if (p.v.kind !== 'BAT' || p.r.kind !== 'R') return { ok: false, meters: [], note: 'The V socket takes a battery and the R socket a resistor.', fail: 'A voltage goes in the first socket, a resistor in the second.' }; const ok = p.v.v === V && p.r.v === R; return { ok, meters: [meterOf('V', p.v.v + ' V', p.v.v === V ? 'good' : 'bad'), meterOf('R', p.r.v + ' Ω', p.r.v === R ? 'good' : 'bad'), meterOf('Short-circuit I', N2(p.v.v / p.r.v) + ' A'), meterOf('Target', V + ' V · ' + R + ' Ω')], note: 'Short-circuit current = V ÷ R = ' + N2(p.v.v / p.r.v) + ' A (the original gave ' + I + ' A).', why: 'V = I·R = ' + I + ' × ' + R + ' = ' + V + ' V in series with ' + R + ' Ω.', fail: 'Not equivalent yet. Both the source value and the series resistor must match.' }; } }); } },
]);

const thev = (V, R1, R2, R3) => ({ Vth: V * R2 / (R1 + R2), Rth: R3 + par(R1, R2) });
WL(18, 'Thevenin and Norton', [
  { t: 'lab', tier: 1, hint: 'Vth = V × R2 ÷ (R1 + R2): the open-circuit voltage of the divider.', q: '', gen() { const V = 12, R1 = 100, tgt = 8, R2 = 200;
    return dial({ rig: benchRig({ left: { kind: 'BAT', label: V + ' V', sub: 'source', info: '12 V source.' }, right: { kind: 'BOX', label: 'Vth', sub: 'open terminals', info: 'The voltage you would measure at the terminals with nothing connected.' }, top: [{ x: 3, kind: 'R', label: '100 Ω', sub: 'R1', info: 'R1 = 100 Ω in series.' }], sockets: [{ id: 'r', label: 'R2 (across terminals)', x: 6 }] }),
      q: '<b>Build:</b> a 12 V source, R1 = 100 Ω in series, and R2 across the output terminals. Choose R2 so the <b>Thevenin voltage Vth = 8 V</b>.', teach: '<p><b>Thevenin’s theorem:</b> any linear circuit, seen from two terminals, acts like <b>one voltage source V<sub>th</sub> in series with one resistor R<sub>th</sub></b>. V<sub>th</sub> is the voltage across the terminals with nothing attached (<b>open circuit</b>). R<sub>th</sub> is the resistance seen into the terminals with the sources turned off.</p>',
      parts: [50, 100, 200, 300, 600].map(RP), read: p => V * p.v / (R1 + p.v), target: tgt, tol: .01, guide: true, label: 'Vth', show: x => N2(x) + ' V', extra: p => [meterOf('Rth', N2(par(R1, p.v)) + ' Ω')], note: (p, x) => 'Vth = 12 × ' + p.v + ' ÷ (100 + ' + p.v + ') = <b>' + N2(x) + ' V</b>.', why: 'Vth = V·R2 ÷ (R1 + R2) = 8 V needs R2 = 2 × R1 = 200 Ω.' }); } },
  { t: 'lab', tier: 2, hint: 'Rth: turn the source off (a short) and look into the terminals. Rth = R3 + (R1 ∥ R2).', q: '', gen() { const R1 = pick([100, 200]), R2 = pick([100, 200, 300]), R3 = pick([50, 100, 150]), tgt = R3 + par(R1, R2);
    return dial({ rig: benchRig({ left: { kind: 'BAT', label: '12 V', sub: 'source', info: '12 V source.' }, right: { kind: 'BOX', label: 'Rth', sub: 'looking in', info: 'The resistance seen into the terminals with the source off.' }, top: [{ x: 3, kind: 'R', label: ohm(R1), sub: 'R1', info: 'R1.' }, { x: 6, kind: 'R', label: ohm(R2), sub: 'R2 (to ground)', info: 'R2 across the source side.' }], sockets: [{ id: 'r', label: 'R3 (in series at output)', x: 8 }] }),
      q: '<b>Build:</b> with the source off, R1 and R2 are in parallel (' + ohm(R1) + ' and ' + ohm(R2) + ') and R3 is in series with them at the output. Choose R3 so that <b>Rth = ' + N2(tgt) + ' Ω</b>.', teach: '<p>To find <b>R<sub>th</sub></b>: replace each voltage source by a <b>short</b> (a wire) and each current source by an <b>open</b>, then combine what is left. Here R1 ∥ R2, plus R3.</p>',
      parts: pickR([25, 50, 100, 150, 200, 300], 5, R3).map(RP), read: p => p.v + par(R1, R2), target: tgt, tol: .01, label: 'Rth', show: x => N2(x) + ' Ω', note: (p, x) => 'Rth = ' + p.v + ' + (' + R1 + ' ∥ ' + R2 + ') = <b>' + N2(x) + ' Ω</b>.', why: 'Rth = R3 + R1∥R2 = ' + R3 + ' + ' + N2(par(R1, R2)) + ' = ' + N2(tgt) + ' Ω.' }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'Vth = V·R2 ÷ (R1+R2) and Rth = R1 ∥ R2. Two numbers, two resistors.', q: '', gen() { const V = 12, R1 = pick([100, 200, 300]), R2 = pick([100, 200, 300]), th = thev(V, R1, R2, 0);
    return mk({ rig: benchRig({ left: { kind: 'BAT', label: V + ' V', sub: 'source', info: '12 V source.' }, right: { kind: 'BOX', label: 'Th', sub: 'Vth and Rth', info: 'The Thevenin equivalent seen at the terminals.' }, sockets: [{ id: 'a', label: 'R1 (series)', x: 4 }, { id: 'b', label: 'R2 (across)', x: 7 }] }),
      q: '<b>Build:</b> choose R1 and R2 so the circuit has <b>Vth = ' + N2(th.Vth) + ' V</b> and <b>Rth = ' + N2(th.Rth) + ' Ω</b>.', teach: '<p>Both numbers matter now. Vth tells you the <b>ratio</b> R2 ÷ (R1+R2). Rth tells you the <b>size</b> of R1 ∥ R2.</p>',
      parts: [100, 200, 300, 600].map(RP), idle: [meterOf('Vth', '—'), meterOf('Rth', '—')],
      calc(p) { const t = thev(V, p.a.v, p.b.v, 0), ok = near(t.Vth, th.Vth, .01) && near(t.Rth, th.Rth, .01); return { ok, meters: [meterOf('Vth', N2(t.Vth) + ' V', near(t.Vth, th.Vth, .01) ? 'good' : 'bad'), meterOf('Rth', N2(t.Rth) + ' Ω', near(t.Rth, th.Rth, .01) ? 'good' : 'bad'), meterOf('Targets', N2(th.Vth) + ' V · ' + N2(th.Rth) + ' Ω')], note: 'Vth = ' + N2(t.Vth) + ' V, Rth = ' + N2(t.Rth) + ' Ω.', why: 'R1 = ' + R1 + ' Ω and R2 = ' + R2 + ' Ω give these values.', fail: 'Not both targets.' }; } }); } },
]);

const pmax = (V, Rs, RL) => V * V * RL / ((Rs + RL) * (Rs + RL));
WL(19, 'Maximum Power Transfer', [
  { t: 'lab', tier: 1, hint: 'The most power goes to the load when RL equals the source resistance Rth.', q: '', gen() { const V = 12, Rs = 50, tgt = V * V / (4 * Rs);
    return dial({ rig: benchRig({ left: { kind: 'BAT', label: '12 V', sub: 'Vth', info: 'The source: 12 V behind 50 Ω.' }, right: { kind: 'BOX', label: 'P', sub: 'power in RL', info: 'Power delivered to the load.' }, top: [{ x: 3, kind: 'R', label: '50 Ω', sub: 'Rth', info: 'The source resistance (50 Ω).' }], sockets: [{ id: 'r', label: 'load RL', x: 6 }] }),
      q: '<b>Build:</b> a 12 V source behind 50 Ω feeds a load. Choose the load RL that receives the <b>most power</b> (' + N2(tgt) + ' W).', teach: '<p><b>Maximum power transfer:</b> a source with resistance <b>R<sub>th</sub></b> gives the most power to a load when <b>R<sub>L</sub> = R<sub>th</sub></b>. A smaller load wastes power in the source. A bigger load lets too little current through. The maximum is <b>P = V<sub>th</sub>² ÷ (4 R<sub>th</sub>)</b>.</p>',
      parts: [10, 25, 50, 100, 200].map(RP), read: p => pmax(V, Rs, p.v), target: tgt, tol: .01, guide: true, label: 'Power in load', show: x => N2(x) + ' W', note: (p, x) => 'P = V²·RL ÷ (Rth + RL)² = <b>' + N2(x) + ' W</b>.', why: 'The maximum comes at RL = Rth = 50 Ω: P = 12² ÷ (4 × 50) = 0.72 W.', fail: 'Not the maximum. Try a load closer to the source resistance.' }); } },
  { t: 'lab', tier: 2, hint: 'RL = Rth.', q: '', gen() { const V = pick([6, 12, 24]), Rs = pick([20, 40, 80, 100]), tgt = V * V / (4 * Rs);
    return dial({ rig: benchRig({ left: { kind: 'BAT', label: V + ' V', sub: 'Vth', info: V + ' V behind ' + Rs + ' Ω.' }, right: { kind: 'BOX', label: 'P', sub: 'power in RL', info: 'Power in the load.' }, top: [{ x: 3, kind: 'R', label: Rs + ' Ω', sub: 'Rth', info: 'Source resistance.' }], sockets: [{ id: 'r', label: 'load RL', x: 6 }] }),
      q: '<b>Build:</b> ' + V + ' V behind ' + Rs + ' Ω. Choose the load that gets the most power.', teach: '<p>Match the load to the source: <b>R<sub>L</sub> = R<sub>th</sub></b>.</p>', parts: pickR([10, 20, 40, 80, 100, 160, 200, 400], 5, Rs).map(RP), read: p => pmax(V, Rs, p.v), target: tgt, tol: .005, label: 'Power in load', show: x => N2(x) + ' W', note: (p, x) => 'P = ' + N2(x) + ' W.', why: 'RL = Rth = ' + Rs + ' Ω gives the maximum ' + N2(tgt) + ' W.', fail: 'There is a better load.' }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'AC: the load must be the CONJUGATE of the source: same resistance, opposite reactance.', q: '', gen() { const Vrms = 10, Rs = pick([20, 40]), Xs = pick([20, -20, 40]);
    return mk({ rig: benchRig({ left: { kind: 'SRC', label: Vrms + ' V', sub: 'rms, ' + Rs + (Xs >= 0 ? ' + j' : ' − j') + Math.abs(Xs) + ' Ω', info: 'The source impedance is ' + Rs + (Xs >= 0 ? ' + j' : ' − j') + Math.abs(Xs) + ' Ω.' }, right: { kind: 'BOX', label: 'P', sub: 'power in load', info: 'Real power in the load.' }, sockets: [{ id: 'r', label: 'load R', x: 4 }, { id: 'x', label: 'load X', x: 7 }] }),
      q: '<b>Build:</b> an AC source has impedance <b>' + Rs + (Xs >= 0 ? ' + j' : ' − j') + Math.abs(Xs) + ' Ω</b>. Choose the load resistance and load reactance that deliver the <b>most power</b>.', teach: '<p>With reactance in the picture the rule becomes <b>Z<sub>L</sub> = Z<sub>th</sub>*</b>: the same resistance and the <b>opposite</b> reactance, so the reactances cancel. Then <b>P<sub>max</sub> = V<sub>rms</sub>² ÷ (4 R<sub>th</sub>)</b>.</p>',
      parts: [].concat([10, 20, 40, 80].map(RP), [-40, -20, 0, 20, 40].map(v => PT((v > 0 ? '+j' : v < 0 ? '−j' : 'j') + Math.abs(v) + ' Ω', v, v < 0 ? 'C' : 'L'))), idle: [meterOf('Power', '—')],
      calc(p) { if (p.r.kind !== 'R' || p.x.kind === 'R') return { ok: false, meters: [], note: 'The first socket takes a resistance, the second a reactance.', fail: 'Put a resistor in the first socket and a +j / −j part in the second.' }; const P = Vrms * Vrms * p.r.v / ((Rs + p.r.v) * (Rs + p.r.v) + (Xs + p.x.v) * (Xs + p.x.v)), Pm = Vrms * Vrms / (4 * Rs), ok = near(P, Pm, .005); return { ok, meters: [meterOf('Power', N2(P) + ' W', ok ? 'good' : 'bad'), meterOf('Maximum', N2(Pm) + ' W')], note: 'Total reactance = ' + (Xs + p.x.v) + ' Ω.', why: 'ZL = ' + Rs + (-Xs >= 0 ? ' + j' : ' − j') + Math.abs(Xs) + ' Ω cancels the reactance and matches R.', fail: 'There is more power to get. Match R and cancel the reactance.' }; } }); } },
]);

WL(20, 'Superposition', [
  { t: 'lab', tier: 1, hint: 'Superposition: V = (effect of V1 alone) + (effect of V2 alone).', q: '', gen() { const V1 = 12, R1 = 100, R2 = 100, R3 = 100, k1 = (1 / R1) / (1 / R1 + 1 / R2 + 1 / R3), k2 = (1 / R2) / (1 / R1 + 1 / R2 + 1 / R3), V2 = 6, tgt = V1 * k1 + V2 * k2;
    return dial({ rig: nodeRig({ l: { fixed: { kind: 'BAT', label: '12 V', sub: 'V1 via 100 Ω', info: 'V1 = 12 V through 100 Ω.' } }, r: { socket: { id: 'r', label: 'V2 via 100 Ω' } }, b: { fixed: { kind: 'R', label: '100 Ω', sub: 'R3 to ground', info: 'R3 = 100 Ω to ground.' } } }),
      q: '<b>Build:</b> V1 = 12 V and a source V2 you choose each feed a node through 100 Ω. A 100 Ω resistor goes to ground. Choose V2 so the node voltage is <b>' + N2(tgt) + ' V</b>.', teach: '<p><b>Superposition:</b> in a linear circuit with several sources, the response is the <b>sum</b> of the responses to each source acting alone, with all the other sources turned off (voltage sources become shorts, current sources become opens). Watch the meters show each source’s share.</p>',
      parts: [0, 3, 6, 9, 12].map(v => PT(v + ' V', v, 'BAT')), read: p => V1 * k1 + p.v * k2, target: tgt, tol: .01, guide: true, label: 'Node voltage', show: x => N2(x) + ' V', extra: p => [meterOf('From V1 alone', N2(V1 * k1) + ' V'), meterOf('From V2 alone', N2(p.v * k2) + ' V')], note: (p, x) => 'V1 alone gives ' + N2(V1 * k1) + ' V and V2 alone gives ' + N2(p.v * k2) + ' V. Sum = <b>' + N2(x) + ' V</b>.', why: 'Each source alone sees a divider with the other source shorted: V1 gives 4 V and V2 gives V2 ÷ 3. Total ' + N2(tgt) + ' V needs V2 = ' + V2 + ' V.' }); } },
  { t: 'lab', tier: 2, hint: 'Add the two contributions.', q: '', gen() { const V1 = pick([6, 12, 24]), R1 = pick([100, 200]), R2 = pick([100, 200]), R3 = pick([100, 200]), s = 1 / R1 + 1 / R2 + 1 / R3, V2 = pick([3, 6, 9, 12, 15]), tgt = (V1 / R1 + V2 / R2) / s;
    return dial({ rig: nodeRig({ l: { fixed: { kind: 'BAT', label: V1 + ' V', sub: 'V1 via ' + ohm(R1), info: 'V1.' } }, r: { socket: { id: 'r', label: 'V2 via ' + ohm(R2) } }, b: { fixed: { kind: 'R', label: ohm(R3), sub: 'R3 to ground', info: 'R3.' } } }),
      q: '<b>Build:</b> choose V2 so the node voltage is <b>' + N2(tgt) + ' V</b>.', teach: '<p>Each source acts alone (the other is shorted). Add the node voltages.</p>', parts: pickR([0, 3, 6, 9, 12, 15, 18], 5, V2).map(v => PT(v + ' V', v, 'BAT')), read: p => (V1 / R1 + p.v / R2) / s, target: tgt, tol: .01, label: 'Node voltage', show: x => N2(x) + ' V', extra: p => [meterOf('V1 alone', N2(V1 / R1 / s) + ' V'), meterOf('V2 alone', N2(p.v / R2 / s) + ' V')], note: (p, x) => 'Sum = ' + N2(x) + ' V.', why: 'V2 = ' + V2 + ' V.' }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'The first source alone must give its share of the target, and the total must hit the target.', q: '', gen() { const R = 100, k = 1 / 3, V1 = pick([6, 12, 18]), V2 = pick([3, 9, 15]), tgt = (V1 + V2) * k, a = V1 * k;
    return mk({ rig: nodeRig({ l: { socket: { id: 'a', label: 'V1 via 100 Ω' } }, r: { socket: { id: 'b', label: 'V2 via 100 Ω' } }, b: { fixed: { kind: 'R', label: '100 Ω', sub: 'R3 to ground', info: 'R3.' } } }),
      q: '<b>Build:</b> choose V1 and V2 so the node voltage is <b>' + N2(tgt) + ' V</b>, with <b>' + N2(a) + ' V</b> of it coming from V1 alone.', teach: '<p>Two unknown sources, two numbers: V1’s share fixes V1; the total then fixes V2.</p>',
      parts: [3, 6, 9, 12, 15, 18].map(v => PT(v + ' V', v, 'BAT')), idle: [meterOf('Total', '—'), meterOf('From V1', '—')],
      calc(p) { const x1 = p.a.v * k, x2 = p.b.v * k, ok = near(x1, a, .01) && near(x1 + x2, tgt, .01); return { ok, meters: [meterOf('From V1', N2(x1) + ' V', near(x1, a, .01) ? 'good' : 'bad'), meterOf('From V2', N2(x2) + ' V'), meterOf('Total', N2(x1 + x2) + ' V', near(x1 + x2, tgt, .01) ? 'good' : 'bad'), meterOf('Targets', N2(a) + ' · ' + N2(tgt) + ' V')], note: 'Each source gives one third of its voltage here.', why: 'V1 = ' + V1 + ' V and V2 = ' + V2 + ' V.', fail: 'Not both targets.' }; } }); } },
]);

/* Workshop builds, part 6: levels 21-25 (op amps) */
const KP = v => PT(ohm(v), v, 'R');
const opamp = { x: 5, y: 3, kind: 'BOX', label: 'op amp', sub: 'ideal', info: 'An ideal op amp: infinite input resistance, zero output resistance, and with feedback it keeps its two inputs at the same voltage.' };
const oaRig = (left, right, top, sockets) => benchRig({ left, right, top, sockets, extra: [opamp] });

WL(21, 'Op Amp Basics and the Inverting Amp', [
  { t: 'lab', tier: 1, hint: 'Gain of the inverting amp = −Rf ÷ Rin.', q: '', gen() { const Vin = 0.5, Rin = 10e3, Rf = 50e3, tgt = -Vin * Rf / Rin;
    return dial({ rig: oaRig({ kind: 'SRC', label: Vin + ' V', sub: 'input', info: 'The input signal is 0.5 V.' }, { kind: 'BOX', label: 'Vout', sub: 'output', info: 'The amplifier output.' }, [{ x: 3, kind: 'R', label: '10 kΩ', sub: 'Rin', info: 'The input resistor Rin = 10 kΩ.' }], [{ id: 'r', label: 'Rf (feedback)', x: 7 }]),
      q: '<b>Build:</b> an inverting amplifier with Rin = 10 kΩ and input 0.5 V. Choose the feedback resistor Rf so that <b>Vout = ' + N2(tgt) + ' V</b>.', teach: '<p>An <b>op amp</b> with negative feedback forces its two inputs to the same voltage. In the <b>inverting</b> amplifier the + input is grounded, so the − input is a <b>virtual ground</b>. Current <b>Vin ÷ Rin</b> must flow through Rf, so <b>V<sub>out</sub> = −(R<sub>f</sub> ÷ R<sub>in</sub>) × V<sub>in</sub></b>.</p>',
      parts: [10e3, 20e3, 50e3, 100e3, 200e3].map(KP), read: p => -Vin * p.v / Rin, target: tgt, tol: .01, guide: true, label: 'Vout', show: x => N2(x) + ' V', extra: p => [meterOf('Gain', N2(-p.v / Rin))], note: (p, x) => 'Gain = −' + p.v / 1000 + 'k ÷ 10k = ' + N2(-p.v / Rin) + '. Vout = <b>' + N2(x) + ' V</b>.', why: 'Vout = −(Rf ÷ Rin)·Vin, so Rf ÷ Rin = ' + N2(-tgt / Vin) + ' and Rf = 50 kΩ.', fail: (x, t) => x < t ? 'Too negative. Use a smaller Rf.' : 'Not negative enough. Use a bigger Rf.' }); } },
  { t: 'lab', tier: 2, hint: 'Gain = −Rf ÷ Rin.', q: '', gen() { const Vin = pick([0.2, 0.5, 1]), Rin = pick([10e3, 20e3]), g = pick([2, 4, 5, 10]), Rf = g * Rin, tgt = -g * Vin;
    return dial({ rig: oaRig({ kind: 'SRC', label: Vin + ' V', sub: 'input', info: 'Input ' + Vin + ' V.' }, { kind: 'BOX', label: 'Vout', sub: 'output', info: 'Output.' }, [{ x: 3, kind: 'R', label: ohm(Rin), sub: 'Rin', info: 'Rin.' }], [{ id: 'r', label: 'Rf', x: 7 }]),
      q: '<b>Build:</b> Rin = ' + ohm(Rin) + ', Vin = ' + Vin + ' V. Choose Rf so that <b>Vout = ' + N2(tgt) + ' V</b>.', teach: '<p>Find the gain you need first: <b>Vout ÷ Vin</b>. The gain is <b>−Rf ÷ Rin</b>.</p>', parts: pickR([10e3, 20e3, 40e3, 50e3, 100e3, 200e3, 400e3], 5, Rf).map(KP), read: p => -Vin * p.v / Rin, target: tgt, tol: .01, label: 'Vout', show: x => N2(x) + ' V', note: (p, x) => 'Vout = ' + N2(x) + ' V.', why: 'Gain ' + -g + ' means Rf = ' + g + ' × Rin = ' + ohm(Rf) + '.' }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'The input resistance of an inverting amp is just Rin (the virtual ground makes Rin the load on the source).', q: '', gen() { const g = pick([2, 4, 5]), Rin0 = pick([10e3, 20e3]);
    return mk({ rig: oaRig({ kind: 'SRC', label: 'Vin', sub: 'needs 10 kΩ load', info: 'The source can only drive a 10 kΩ load.' }, { kind: 'BOX', label: 'Vout', sub: 'gain −' + g, info: 'Output.' }, [], [{ id: 'i', label: 'Rin', x: 3 }, { id: 'f', label: 'Rf', x: 7 }]),
      q: '<b>Build:</b> the source needs to see an <b>input resistance of 10 kΩ</b>, and the amplifier must have a <b>gain of −' + g + '</b>. Choose Rin and Rf.', teach: '<p>Two requirements. Input resistance of the inverting amp = <b>Rin</b> (not Rf). Gain = <b>−Rf ÷ Rin</b>.</p>', parts: [5e3, 10e3, 20e3, 40e3, 50e3, 100e3].map(KP), idle: [meterOf('Input R', '—'), meterOf('Gain', '—')],
      calc(p) { const gg = -p.f.v / p.i.v, ok = p.i.v === 10e3 && near(gg, -g, .01); return { ok, meters: [meterOf('Input R', ohm(p.i.v), p.i.v === 10e3 ? 'good' : 'bad'), meterOf('Gain', N2(gg), near(gg, -g, .01) ? 'good' : 'bad'), meterOf('Targets', '10 kΩ · −' + g)], note: 'Gain = −' + p.f.v / 1000 + 'k ÷ ' + p.i.v / 1000 + 'k = ' + N2(gg) + '.', why: 'Rin = 10 kΩ sets the input resistance. Rf = ' + g + ' × 10 kΩ = ' + ohm(g * 1e4) + ' sets the gain.', fail: 'Check the input resistance and the gain.' }; } }); } },
]);

WL(22, 'Op Amp Circuits: Follower, Non-Inverting, Summing, Difference', [
  { t: 'lab', tier: 1, hint: 'Non-inverting gain = 1 + Rf ÷ R1.', q: '', gen() { const Vin = 0.5, R1 = 10e3, tgt = 3;
    return dial({ rig: oaRig({ kind: 'SRC', label: Vin + ' V', sub: 'input (+ pin)', info: 'The input goes straight to the + input.' }, { kind: 'BOX', label: 'Vout', sub: 'output', info: 'The amplifier output.' }, [{ x: 3, kind: 'R', label: '10 kΩ', sub: 'R1 (to ground)', info: 'R1 from the − input to ground.' }], [{ id: 'r', label: 'Rf', x: 7 }]),
      q: '<b>Build:</b> a <b>non-inverting</b> amplifier: input 0.5 V on the + pin, R1 = 10 kΩ to ground. Choose Rf so that <b>Vout = 3 V</b>.', teach: '<p><b>Non-inverting amplifier:</b> the input goes to the + pin. The feedback divider (Rf and R1) holds the − pin at the same voltage as the + pin, so <b>V<sub>out</sub> = (1 + R<sub>f</sub> ÷ R<sub>1</sub>) × V<sub>in</sub></b>. The gain is never below 1. (With Rf = 0 and no R1 it becomes the <b>voltage follower</b>, gain 1.)</p>',
      parts: [10e3, 20e3, 30e3, 50e3, 100e3].map(KP), read: p => (1 + p.v / R1) * Vin, target: tgt, tol: .01, guide: true, label: 'Vout', show: x => N2(x) + ' V', extra: p => [meterOf('Gain', N2(1 + p.v / R1))], note: (p, x) => 'Gain = 1 + ' + p.v / 1000 + 'k ÷ 10k = ' + N2(1 + p.v / R1) + '. Vout = <b>' + N2(x) + ' V</b>.', why: 'Gain = 3 ÷ 0.5 = 6 = 1 + Rf ÷ R1, so Rf = 5 × 10 kΩ = 50 kΩ.' }); } },
  { t: 'lab', tier: 2, hint: 'Summing amp: Vout = −Rf × (V1 ÷ R1 + V2 ÷ R2).', q: '', gen() { const V1 = pick([0.5, 1]), V2 = pick([0.5, 1, 1.5]), R = 10e3, Rf = pick([10e3, 20e3, 40e3]), tgt = -Rf * (V1 / R + V2 / R);
    return dial({ rig: oaRig({ kind: 'SRC', label: V1 + ' V', sub: 'V1 via 10 kΩ', info: 'V1 through 10 kΩ.' }, { kind: 'BOX', label: 'Vout', sub: 'output', info: 'The output.' }, [{ x: 3, kind: 'SRC', label: V2 + ' V', sub: 'V2 via 10 kΩ', info: 'V2 through 10 kΩ.' }], [{ id: 'r', label: 'Rf', x: 7 }]),
      q: '<b>Build:</b> a <b>summing amplifier</b>: V1 = ' + V1 + ' V and V2 = ' + V2 + ' V each go through 10 kΩ into the − input. Choose Rf so that <b>Vout = ' + N2(tgt) + ' V</b>.', teach: '<p>Each input pushes its own current <b>V ÷ R</b> into the virtual ground. They all add, and flow through Rf: <b>V<sub>out</sub> = −R<sub>f</sub> (V<sub>1</sub>/R<sub>1</sub> + V<sub>2</sub>/R<sub>2</sub>)</b>.</p>',
      parts: pickR([5e3, 10e3, 20e3, 30e3, 40e3, 60e3], 5, Rf).map(KP), read: p => -p.v * (V1 / R + V2 / R), target: tgt, tol: .01, label: 'Vout', show: x => N2(x) + ' V', note: (p, x) => 'Total current in = ' + E(V1 / R + V2 / R, 'A') + '. Vout = <b>' + N2(x) + ' V</b>.', why: 'Rf = |Vout| ÷ (V1/R + V2/R) = ' + ohm(Rf) + '.' }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'Follower = buffer (gain 1, no loading). Inverting = −Rf/Rin. Non-inverting = 1 + Rf/R1. Summing adds signals.', q: '', gen() {
    const jobs = [['Isolate a weak sensor from a heavy load (gain 1)', 'Voltage follower'], ['Flip the sign and amplify a signal by 10', 'Inverting'], ['Amplify a signal by 11 without flipping it', 'Non-inverting'], ['Mix two microphones into one signal', 'Summing']];
    const sl = shuffle(jobs).map((j, i) => ({ id: 'j' + i, label: j[0].split(' (')[0].slice(0, 22), want: j[1], full: j[0] }));
    return slot({ slots: sl, parts: ['Voltage follower', 'Inverting', 'Non-inverting', 'Summing'], fixed: sl.map((s, i) => ({ x: [1, 4, 7, 10][i], y: 3, kind: 'BOX', label: 'Job ' + (i + 1), sub: s.full.length > 30 ? s.full.slice(0, 30) + '…' : s.full, info: s.full })), rig: { cols: 11, rows: 7, sockets: sl.map((s, i) => ({ id: s.id, label: 'Job ' + (i + 1), x: [1, 4, 7, 10][i], y: 1 })), fixed: sl.map((s, i) => ({ x: [1, 4, 7, 10][i], y: 3, kind: 'BOX', label: 'Job ' + (i + 1), sub: s.full.slice(0, 26), info: s.full })), wires: [], start: { x: 5, y: 5 }, lever: { x: 10, y: 5 } },
      q: '<b>Build:</b> match each job to the op amp circuit that does it. Look at each job box (walk up to it and press Space to read the whole job).', teach: '<p>Four building blocks. <b>Follower</b>: gain 1, high input / low output resistance. <b>Inverting</b>: −Rf/Rin. <b>Non-inverting</b>: 1 + Rf/R1. <b>Summing</b>: adds inputs.</p>', count: false,
      why: 'Buffer = follower. Gain −10 = inverting. Gain +11 (1 + 10) = non-inverting. Mixing = summing.' }); } },
]);

const sat = (v, r) => Math.max(-r, Math.min(r, v));
WL(23, 'Saturation, Comparators and CMRR', [
  { t: 'lab', tier: 1, hint: 'Vout = gain × Vin, but it can never go beyond the supply rails (±12 V).', q: '', gen() { const Vin = 2, R = 12, tgt = 10;
    return dial({ rig: oaRig({ kind: 'SRC', label: Vin + ' V', sub: 'input', info: 'Input 2 V.' }, { kind: 'BOX', label: 'Vout', sub: 'rails ±12 V', info: 'The output cannot go beyond the ±12 V supply rails.' }, [], [{ id: 'r', label: 'gain', x: 5 }]),
      q: '<b>Build:</b> an amplifier on ±12 V supplies has an input of 2 V. Choose the gain so that <b>Vout = 10 V</b> without clipping.', teach: '<p>An op amp cannot output more than its supply. Ask for too much gain and the output <b>saturates</b>: it flattens at the rail (about ±12 V here) and the real equation Vout = gain × Vin no longer holds.</p>',
      parts: [2, 4, 5, 8, 10].map(v => PT('×' + v, v, 'BOX')), read: p => sat(p.v * Vin, R), target: tgt, tol: .01, guide: true, label: 'Vout', show: x => N2(x) + ' V', extra: p => [meterOf('Wanted', N2(p.v * Vin) + ' V')], note: (p, x) => p.v * Vin > R ? 'Gain × Vin = ' + N2(p.v * Vin) + ' V but the rail stops it at <b>' + x + ' V</b>: saturated.' : 'Vout = ' + p.v + ' × 2 = <b>' + N2(x) + ' V</b>.', why: 'Gain = 10 ÷ 2 = 5, and 10 V is inside the ±12 V rails.', fail: (x, t) => x > t ? 'Too high.' : 'Too low.' }); } },
  { t: 'lab', tier: 2, hint: 'Gain = target ÷ Vin, as long as the target is inside the rails.', q: '', gen() { const R = pick([10, 12, 15]), Vin = pick([0.5, 1, 2]), g = pick([2, 4, 5, 6]), tgt = Math.min(g * Vin, R);
    return dial({ rig: oaRig({ kind: 'SRC', label: Vin + ' V', sub: 'input', info: 'Input.' }, { kind: 'BOX', label: 'Vout', sub: 'rails ±' + R + ' V', info: 'Rails ±' + R + ' V.' }, [], [{ id: 'r', label: 'gain', x: 5 }]),
      q: '<b>Build:</b> rails ±' + R + ' V, input ' + Vin + ' V. Choose the gain so that <b>Vout = ' + N2(tgt) + ' V</b>.', teach: '<p>Check the rail. If gain × Vin is bigger than the rail, you get the rail, not the product.</p>', parts: pickR([1, 2, 3, 4, 5, 6, 8, 10, 20], 5, g).map(v => PT('×' + v, v, 'BOX')), read: p => sat(p.v * Vin, R), target: tgt, tol: .01, label: 'Vout', show: x => N2(x) + ' V', note: (p, x) => 'Vout = ' + N2(x) + ' V.', why: 'Gain ' + g + '.' }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'A differential amp rejects the common signal imperfectly: error = Vcm ÷ 10^(CMRR/20).', q: '', gen() { const Vcm = 5, lim = 0.0001;
    return mk({ rig: oaRig({ kind: 'SRC', label: '5 V', sub: 'common to both pins', info: 'A 5 V signal appears on both inputs (common mode).' }, { kind: 'BOX', label: 'error', sub: 'must be < 0.1 mV', info: 'The unwanted output caused by the common signal.' }, [], [{ id: 'c', label: 'CMRR of op amp', x: 5 }]),
      q: '<b>Build:</b> a 5 V common-mode signal reaches both inputs of a difference amplifier. Choose an op amp whose <b>CMRR</b> makes the false output smaller than <b>0.1 mV</b>.', teach: '<p>An ideal difference amp ignores anything that is the <b>same</b> on both inputs. A real one leaks a little. <b>CMRR</b> (common-mode rejection ratio, in dB) tells you how well it rejects: <b>error = V<sub>cm</sub> ÷ 10<sup>CMRR/20</sup></b>. Every 20 dB is a factor of 10.</p>',
      parts: [40, 60, 80, 100, 120].map(v => PT(v + ' dB', v, 'BOX')), idle: [meterOf('Error', '—')],
      calc(p) { const e = Vcm / Math.pow(10, p.c.v / 20), ok = e < lim; return { ok, meters: [meterOf('Error', E(e, 'V'), ok ? 'good' : 'bad'), meterOf('Limit', '0.1 mV')], note: '5 V ÷ 10^(' + p.c.v + '/20) = ' + E(e, 'V') + '.', why: 'You need 5 ÷ 10^(CMRR/20) < 0.0001, so CMRR > 94 dB. Only 100 dB and 120 dB qualify.', fail: 'Still leaks too much. A higher CMRR rejects more.' }; } }); } },
]);

const OAS = [PT('A', 0, 'BOX'), PT('B', 1, 'BOX'), PT('C', 2, 'BOX'), PT('D', 3, 'BOX')];
// op amp models: Rin, Rout
const MOD = [{ n: 'A', Rin: 10e3, Rout: 1e3 }, { n: 'B', Rin: 1e6, Rout: 1e3 }, { n: 'C', Rin: 10e3, Rout: 10 }, { n: 'D', Rin: 1e6, Rout: 10 }];
WL(24, 'Op Amp Input and Output Properties', [
  { t: 'lab', tier: 1, hint: 'Pick the one with a HIGH input resistance (it does not load the source) and a LOW output resistance (it does not droop under load).', q: '', gen() { const Rs = 10e3, RL = 1000;
    return mk({ rig: oaRig({ kind: 'SRC', label: '1 V', sub: 'source, 10 kΩ', info: 'A sensor with 10 kΩ source resistance.' }, { kind: 'BOX', label: RL + ' Ω', sub: 'load', info: 'A 100 Ω load.' }, [], [{ id: 'm', label: 'choose op amp', x: 5 }]),
      q: '<b>Build:</b> a 1 V sensor with 10 kΩ source resistance feeds a unity-gain buffer that drives a 1 kΩ load. Choose the op amp whose output reaches at least <b>0.97 V</b>.', teach: '<p>Real op amps are not ideal. <b>Input resistance R<sub>in</sub></b> forms a divider with the source: a small R<sub>in</sub> steals signal. <b>Output resistance R<sub>out</sub></b> forms a divider with the load. We want <b>R<sub>in</sub> huge</b> and <b>R<sub>out</sub> tiny</b>.</p>',
      parts: MOD.map(m => PT('Op amp ' + m.n + ': Rin ' + ohm(m.Rin) + ', Rout ' + ohm(m.Rout), m.n, 'BOX')), idle: [meterOf('Vout', '—')],
      calc(p) { const m = MOD.find(x => x.n === p.m.v), a = m.Rin / (m.Rin + Rs), b = RL / (RL + m.Rout), Vo = a * b, ok = Vo >= 0.97; return { ok, meters: [meterOf('Input divider', N2(a)), meterOf('Output divider', N2(b)), meterOf('Vout', N2(Vo) + ' V', ok ? 'good' : 'bad')], note: 'Input divider = ' + N2(a) + ', output divider = ' + N2(b) + '.', why: 'Only the high-Rin, low-Rout amplifier (D) loses almost nothing at either end.', fail: a < .98 ? 'The op amp’s input resistance is too low: it loads the sensor.' : 'The output resistance is too high: the load pulls the output down.' }; },
      coach(p, carry) { if (!p.m) return 'try each one and watch the two dividers.'; const m = MOD.find(x => x.n === p.m.v); return (m.Rin / (m.Rin + Rs) < .98 ? 'input resistance too low. ' : '') + (RL / (RL + m.Rout) < .98 ? 'output resistance too high. ' : '') || 'both dividers are close to 1. Press Enter.'; } }); } },
  { t: 'lab', tier: 2, hint: 'The input divider is Rin ÷ (Rin + Rs). It must be above 0.99.', q: '', gen() { const Rs = pick([1e3, 10e3, 100e3]), lim = .99, need = Rs * lim / (1 - lim);
    return dial({ rig: oaRig({ kind: 'SRC', label: '1 V', sub: 'source, ' + ohm(Rs), info: 'Source resistance ' + ohm(Rs) + '.' }, { kind: 'BOX', label: 'Vin', sub: 'seen by amp', info: 'The voltage the op amp input actually sees.' }, [], [{ id: 'r', label: 'op amp Rin', x: 5 }]),
      q: '<b>Build:</b> a source with ' + ohm(Rs) + ' of its own resistance drives an op amp input. Choose an input resistance so the amp sees at least <b>0.99 V</b> of the 1 V (a loss of 1% or less).', teach: '<p>The source resistance and the op amp’s input resistance form a divider: <b>V<sub>seen</sub> = V × R<sub>in</sub> ÷ (R<sub>in</sub> + R<sub>s</sub>)</b>. Make R<sub>in</sub> about 100 times R<sub>s</sub> or more.</p>',
      parts: [1e3, 10e3, 100e3, 1e6, 10e6].map(v => PT(ohm(v), v, 'R')), read: p => p.v / (p.v + Rs) >= lim ? 1 : p.v / (p.v + Rs), target: 1, tol: 0.0001, label: 'Fraction seen', show: x => N2(x) + (x >= 1 ? ' (≥ 0.99)' : ''), note: (p, x) => 'Divider = ' + N2(p.v / (p.v + Rs)) + '.', why: 'You need Rin ≥ ' + ohm(need) + ' (99 × the source resistance).', fail: 'Too much of the signal is lost across the source resistance. Use a bigger Rin.' }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'Each side is its own divider. Make the first factor ≥ 0.99 and the second ≥ 0.99.', q: '', gen() { const Rs = pick([10e3, 20e3]), RL = pick([100, 200, 500]);
    return mk({ rig: oaRig({ kind: 'SRC', label: '1 V', sub: 'source, ' + ohm(Rs), info: 'Source resistance ' + ohm(Rs) + '.' }, { kind: 'BOX', label: ohm(RL), sub: 'load', info: 'Load ' + ohm(RL) + '.' }, [], [{ id: 'i', label: 'Rin', x: 4 }, { id: 'o', label: 'Rout', x: 7 }]),
      q: '<b>Build:</b> choose the op amp’s input resistance and output resistance so that the buffer delivers at least <b>0.97 V</b> to the ' + ohm(RL) + ' load from a 1 V source with ' + ohm(Rs) + ' source resistance.', teach: '<p>Total = (input divider) × (output divider). Make each close to 1.</p>',
      parts: [].concat([1e3, 100e3, 1e6, 10e6].map(v => PT(ohm(v) + ' in', v, 'R')), [1, 10, 100, 1000].map(v => PT(ohm(v) + ' out', -v, 'R'))), idle: [meterOf('Vout', '—')],
      calc(p) { if (p.i.v < 0 || p.o.v > 0) return { ok: false, meters: [], note: 'Rin goes in the first socket and Rout in the second.', fail: 'The first socket takes an “in” resistance, the second an “out” resistance.' }; const a = p.i.v / (p.i.v + Rs), b = RL / (RL - p.o.v + 0), Rout = -p.o.v, bb = RL / (RL + Rout), Vo = a * bb, ok = Vo >= .97; return { ok, meters: [meterOf('Input divider', N2(a)), meterOf('Output divider', N2(bb)), meterOf('Vout', N2(Vo) + ' V', ok ? 'good' : 'bad')], note: 'Vout = ' + N2(a) + ' × ' + N2(bb) + ' = ' + N2(Vo) + ' V.', why: 'A large Rin and a small Rout keep both dividers near 1.', fail: a < .985 ? 'Rin too small.' : 'Rout too large.' }; } }); } },
]);

WL(25, 'Comparators and the Schmitt Trigger', [
  { t: 'lab', tier: 1, hint: 'A comparator’s output flips when the input crosses the reference. Set Vref = the level you want to detect.', q: '', gen() { const tgt = 3;
    return dial({ rig: oaRig({ kind: 'SRC', label: 'Vin', sub: 'rises past 3 V', info: 'The input rises. We want an alarm when it passes 3 V.' }, { kind: 'LED', label: 'alarm', sub: 'output', info: 'The alarm turns on when the input is above the reference.' }, [], [{ id: 'r', label: 'Vref', x: 5 }]),
      q: '<b>Build:</b> a <b>comparator</b> must switch its alarm on when Vin rises above <b>3 V</b>. Choose the reference voltage.', teach: '<p>A <b>comparator</b> is an op amp with <b>no feedback</b>. It compares its two inputs and swings the output all the way to one rail or the other: <b>high when V<sub>in</sub> &gt; V<sub>ref</sub></b>, low when below. The reference sets the switching level.</p>',
      parts: [1, 2, 3, 4, 5].map(v => PT(v + ' V', v, 'BAT')), read: p => p.v, target: tgt, tol: .001, guide: true, label: 'Switches at', show: x => N2(x) + ' V', note: (p, x) => 'The output goes high above <b>' + x + ' V</b>.', why: 'The comparator flips when Vin = Vref, so Vref = 3 V.', fail: (x, t) => x > t ? 'It would switch too late.' : 'It would switch too early.' }); } },
  { t: 'lab', tier: 2, hint: 'Schmitt trigger thresholds: ± Vsat × R1 ÷ (R1 + R2).', q: '', gen() { const Vs = 10, R1 = pick([1e3, 2e3]), R2 = pick([4e3, 8e3]), th = Vs * R1 / (R1 + R2);
    return mk({ rig: oaRig({ kind: 'SRC', label: 'Vin', sub: 'noisy', info: 'A noisy input signal.' }, { kind: 'LED', label: 'out', sub: '±10 V', info: 'The output swings between +10 V and −10 V.' }, [], [{ id: 'a', label: 'R1', x: 4 }, { id: 'b', label: 'R2', x: 7 }]),
      q: '<b>Build:</b> a <b>Schmitt trigger</b> with output rails ±10 V must switch at <b>±' + N2(th) + ' V</b>. Choose R1 and R2.', teach: '<p>A <b>Schmitt trigger</b> adds positive feedback, so it has <b>two</b> thresholds: <b>V<sub>th</sub> = ±V<sub>sat</sub> × R<sub>1</sub> ÷ (R<sub>1</sub> + R<sub>2</sub>)</b>. The gap between them is the <b>hysteresis</b>, which ignores noise smaller than the gap.</p>',
      parts: [1e3, 2e3, 4e3, 8e3, 16e3].map(KP), idle: [meterOf('Thresholds', '—')],
      calc(p) { const t = Vs * p.a.v / (p.a.v + p.b.v), ok = near(t, th, .01); return { ok, meters: [meterOf('Thresholds', '±' + N2(t) + ' V', ok ? 'good' : 'bad'), meterOf('Hysteresis', N2(2 * t) + ' V'), meterOf('Target', '±' + N2(th) + ' V')], note: 'Vth = 10 × ' + p.a.v / 1000 + 'k ÷ (' + p.a.v / 1000 + 'k + ' + p.b.v / 1000 + 'k) = ' + N2(t) + ' V.', why: 'R1 ÷ (R1 + R2) = ' + N2(th / Vs) + ', for example R1 = ' + ohm(R1) + ' and R2 = ' + ohm(R2) + '.', fail: t > th ? 'The thresholds are too wide.' : 'The thresholds are too narrow.' }; } }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'The noise is 1 V peak-to-peak, so the gap must be wider than 1 V. The signal swings ±3 V, so each threshold must be inside ±3 V.', q: '', gen() { const Vs = 10;
    return mk({ rig: oaRig({ kind: 'SRC', label: '±3 V', sub: 'signal + 1 V noise', info: 'The signal swings ±3 V and carries 1 V peak-to-peak noise.' }, { kind: 'LED', label: 'out', sub: '±10 V', info: 'Output rails ±10 V.' }, [], [{ id: 'a', label: 'R1', x: 4 }, { id: 'b', label: 'R2', x: 7 }]),
      q: '<b>Build:</b> a Schmitt trigger on ±10 V rails must <b>ignore 1 V peak-to-peak noise</b> (hysteresis wider than 1 V) but still <b>switch on a ±3 V signal</b> (thresholds below 3 V). Choose R1 and R2.', teach: '<p>You choose a <b>band</b>, not one number. Width 2·Vth must be above 1 V, and Vth must be below 3 V.</p>',
      parts: [1e3, 2e3, 4e3, 8e3, 16e3].map(KP), idle: [meterOf('Thresholds', '—')],
      calc(p) { const t = Vs * p.a.v / (p.a.v + p.b.v), ok = 2 * t > 1 && t < 3; return { ok, meters: [meterOf('Thresholds', '±' + N2(t) + ' V'), meterOf('Hysteresis', N2(2 * t) + ' V', 2 * t > 1 ? 'good' : 'bad'), meterOf('Switches on ±3 V?', t < 3 ? 'yes' : 'no', t < 3 ? 'good' : 'bad')], note: 'Vth = ±' + N2(t) + ' V.', why: 'Any ratio with 0.5 < Vth < 3 V works, for example R1 = 2 kΩ with R2 = 8 kΩ gives ±2 V.', fail: 2 * t <= 1 ? 'The gap is too narrow: noise would cause false switching.' : 'The thresholds are too far out: the signal never reaches them.' }; } }); } },
]);

/* Workshop builds, part 7: levels 26-32 (inductors, capacitors, combining, mutual inductance, first-order, switching, RLC) */
const reRig = (left, right, sockets, top) => benchRig({ left, right, sockets, top });

WL(26, 'Inductors', [
  { t: 'lab', tier: 1, hint: 'v = L × (di/dt). The current ramps 2 A in 1 ms: di/dt = 2000 A/s.', q: '', gen() { const di = 2, dt = 0.001, tgt = 10;
    return dial({ rig: reRig({ kind: 'SRC', label: '0→2 A', sub: 'in 1 ms', info: 'The current ramps from 0 to 2 A in 1 millisecond.' }, { kind: 'BOX', label: 'v', sub: 'voltage across L', info: 'The voltage across the coil.' }, [{ id: 'r', label: 'inductor L', x: 5 }]),
      q: '<b>Build:</b> the current through a coil ramps from 0 to 2 A in 1 ms. Choose the inductance so the coil’s voltage is <b>10 V</b>.', teach: '<p>An <b>inductor</b> resists changes in current: <b>v = L · di/dt</b>. A fast change makes a big voltage; a steady current makes none. The unit is the henry (H). Energy stored: <b>w = ½ L i²</b>.</p>',
      parts: [1e-3, 2e-3, 5e-3, 10e-3, 20e-3].map(LP), read: p => p.v * di / dt, target: tgt, tol: .01, guide: true, label: 'Voltage', show: x => N2(x) + ' V', note: (p, x) => 'di/dt = 2 ÷ 0.001 = 2000 A/s. v = ' + E(p.v, 'H') + ' × 2000 = <b>' + N2(x) + ' V</b>.', why: 'L = v ÷ (di/dt) = 10 ÷ 2000 = 5 mH.' }); } },
  { t: 'lab', tier: 2, hint: 'L = v ÷ (di/dt).', q: '', gen() { const di = pick([1, 2, 4]), dt = pick([0.001, 0.002, 0.005]), L = pick([2e-3, 5e-3, 10e-3, 20e-3]), tgt = L * di / dt;
    return dial({ rig: reRig({ kind: 'SRC', label: '0→' + di + ' A', sub: 'in ' + dt * 1000 + ' ms', info: 'The current ramps 0 to ' + di + ' A in ' + dt * 1000 + ' ms.' }, { kind: 'BOX', label: 'v', sub: 'voltage across L', info: 'Coil voltage.' }, [{ id: 'r', label: 'inductor L', x: 5 }]),
      q: '<b>Build:</b> current ramps 0 → ' + di + ' A in ' + dt * 1000 + ' ms. Choose L so the coil voltage is <b>' + N2(tgt) + ' V</b>.', teach: '<p>Work out di/dt, then <b>L = v ÷ (di/dt)</b>.</p>', parts: pickR([1e-3, 2e-3, 5e-3, 10e-3, 20e-3, 50e-3], 5, L).map(LP), read: p => p.v * di / dt, target: tgt, tol: .01, label: 'Voltage', show: x => N2(x) + ' V', note: (p, x) => 'v = ' + N2(x) + ' V.', why: 'L = ' + N2(tgt) + ' ÷ ' + di / dt + ' = ' + E(L, 'H') + '.' }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'Two readings: v = L·Δi÷Δt, and the energy at the end w = ½ L i².', q: '', gen() { const i = 2, L = pick([2e-3, 5e-3, 10e-3]), dt = pick([0.5e-3, 1e-3, 2e-3]), v = L * i / dt, w = 0.5 * L * i * i;
    return mk({ rig: reRig({ kind: 'SRC', label: '0→2 A', sub: 'ramp', info: 'The current ramps from 0 to 2 A.' }, { kind: 'BOX', label: 'v · w', sub: 'volts, joules', info: 'The coil voltage during the ramp and the energy stored at the end.' }, [{ id: 'l', label: 'L', x: 4 }, { id: 't', label: 'ramp time', x: 7 }]),
      q: '<b>Build:</b> the current ramps 0 → 2 A. Choose L and the ramp time so the coil voltage is <b>' + N2(v) + ' V</b> and the energy stored at the end is <b>' + E(w, 'J') + '</b>.', teach: '<p>The <b>energy</b> depends only on L and the final current. The <b>voltage</b> also depends on how fast you ramp.</p>',
      parts: [].concat([2e-3, 5e-3, 10e-3, 20e-3].map(LP), [0.5e-3, 1e-3, 2e-3, 5e-3].map(x => PT(E(x, 's'), x, 'BOX'))), idle: [meterOf('Voltage', '—'), meterOf('Energy', '—')],
      calc(p) { if (p.l.kind !== 'L' || p.t.kind !== 'BOX') return { ok: false, meters: [], note: 'The first socket takes an inductor, the second a ramp time.', fail: 'Put an inductor in the L socket and a time in the second.' }; const vv = p.l.v * i / p.t.v, ww = 0.5 * p.l.v * i * i, ok = near(vv, v, .01) && near(ww, w, .01); return { ok, meters: [meterOf('Voltage', N2(vv) + ' V', near(vv, v, .01) ? 'good' : 'bad'), meterOf('Energy', E(ww, 'J'), near(ww, w, .01) ? 'good' : 'bad'), meterOf('Targets', N2(v) + ' V · ' + E(w, 'J'))], note: 'v = L·Δi÷Δt = ' + N2(vv) + ' V, w = ½Li² = ' + E(ww, 'J') + '.', why: 'The energy fixes L = ' + E(L, 'H') + ', and then the voltage fixes the ramp time at ' + E(dt, 's') + '.', fail: 'Not both targets.' }; } }); } },
]);

WL(27, 'Capacitors', [
  { t: 'lab', tier: 1, hint: 'i = C × (dv/dt). The voltage ramps 5 V in 1 ms: dv/dt = 5000 V/s.', q: '', gen() { const dv = 5, dt = 0.001, tgt = 0.005;
    return dial({ rig: reRig({ kind: 'SRC', label: '0→5 V', sub: 'in 1 ms', info: 'The voltage across the capacitor ramps from 0 to 5 V in 1 ms.' }, { kind: 'BOX', label: 'i', sub: 'current in C', info: 'The current into the capacitor.' }, [{ id: 'r', label: 'capacitor C', x: 5 }]),
      q: '<b>Build:</b> the voltage across a capacitor ramps 0 → 5 V in 1 ms. Choose C so the current into it is <b>5 mA</b>.', teach: '<p>A <b>capacitor</b> resists changes in voltage: <b>i = C · dv/dt</b>. A steady voltage means no current. Charge: <b>q = C·v</b>. Energy: <b>w = ½ C v²</b>.</p>',
      parts: [0.1e-6, 0.5e-6, 1e-6, 2e-6, 5e-6].map(CP), read: p => p.v * dv / dt, target: tgt, tol: .01, guide: true, label: 'Current', show: x => E(x, 'A'), note: (p, x) => 'dv/dt = 5 ÷ 0.001 = 5000 V/s. i = ' + E(p.v, 'F') + ' × 5000 = <b>' + E(x, 'A') + '</b>.', why: 'C = i ÷ (dv/dt) = 0.005 ÷ 5000 = 1 µF.' }); } },
  { t: 'lab', tier: 2, hint: 'C = i ÷ (dv/dt).', q: '', gen() { const dv = pick([2, 5, 10]), dt = pick([0.001, 0.002, 0.005]), C = pick([0.5e-6, 1e-6, 2e-6, 5e-6]), tgt = C * dv / dt;
    return dial({ rig: reRig({ kind: 'SRC', label: '0→' + dv + ' V', sub: 'in ' + dt * 1000 + ' ms', info: 'The voltage ramps.' }, { kind: 'BOX', label: 'i', sub: 'current in C', info: 'Capacitor current.' }, [{ id: 'r', label: 'capacitor C', x: 5 }]),
      q: '<b>Build:</b> the voltage ramps 0 → ' + dv + ' V in ' + dt * 1000 + ' ms. Choose C so the current is <b>' + E(tgt, 'A') + '</b>.', teach: '<p>Find dv/dt, then <b>C = i ÷ (dv/dt)</b>.</p>', parts: pickR([0.1e-6, 0.5e-6, 1e-6, 2e-6, 5e-6, 10e-6], 5, C).map(CP), read: p => p.v * dv / dt, target: tgt, tol: .01, label: 'Current', show: x => E(x, 'A'), note: (p, x) => 'i = ' + E(x, 'A') + '.', why: 'C = ' + E(C, 'F') + '.' }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'q = C·V and w = ½·C·V². Divide: w ÷ q = V ÷ 2.', q: '', gen() { const C = pick([1e-6, 2e-6, 5e-6, 10e-6]), V = pick([5, 10, 12, 24]), q = C * V, w = 0.5 * C * V * V;
    return mk({ rig: reRig({ kind: 'BAT', label: 'charge', sub: 'to V', info: 'Charge the capacitor up to the voltage you choose.' }, { kind: 'BOX', label: 'q · w', sub: 'coulombs, joules', info: 'Stored charge and energy.' }, [{ id: 'c', label: 'C', x: 4 }, { id: 'v', label: 'V', x: 7 }]),
      q: '<b>Build:</b> choose C and the charging voltage so the capacitor holds <b>' + E(q, 'C') + '</b> of charge and <b>' + E(w, 'J') + '</b> of energy.', teach: '<p>Two equations, two unknowns: <b>q = C V</b> and <b>w = ½ C V²</b>. Dividing, <b>V = 2w ÷ q</b>; then <b>C = q ÷ V</b>.</p>',
      parts: [].concat([1e-6, 2e-6, 5e-6, 10e-6].map(CP), [5, 10, 12, 24].map(v => PT(v + ' V', v, 'BAT'))), idle: [meterOf('Charge', '—'), meterOf('Energy', '—')],
      calc(p) { if (p.c.kind !== 'C' || p.v.kind !== 'BAT') return { ok: false, meters: [], note: 'The first socket takes a capacitor, the second a voltage.', fail: 'Put a capacitor in the C socket and a battery in the V socket.' }; const qq = p.c.v * p.v.v, ww = 0.5 * p.c.v * p.v.v * p.v.v, ok = near(qq, q, .01) && near(ww, w, .01); return { ok, meters: [meterOf('Charge', E(qq, 'C'), near(qq, q, .01) ? 'good' : 'bad'), meterOf('Energy', E(ww, 'J'), near(ww, w, .01) ? 'good' : 'bad'), meterOf('Targets', E(q, 'C') + ' · ' + E(w, 'J'))], note: 'q = ' + E(qq, 'C') + ', w = ' + E(ww, 'J') + '.', why: 'V = 2w ÷ q = ' + V + ' V and C = q ÷ V = ' + E(C, 'F') + '.', fail: 'Not both targets.' }; } }); } },
]);

WL(28, 'Combining Inductors and Capacitors', [
  { t: 'lab', tier: 1, hint: 'Capacitors in PARALLEL add: C = C1 + C2.', q: '', gen() { const C1 = 4e-6, tgt = 10e-6;
    return dial({ rig: reRig({ kind: 'SRC', label: 'total', sub: 'must be 10 µF', info: 'The combination must act like one 10 µF capacitor.' }, { kind: 'BOX', label: 'C total', sub: 'equivalent', info: 'The equivalent capacitance.' }, [{ id: 'r', label: 'C2 (parallel)', x: 6 }], [{ x: 3, kind: 'C', label: '4 µF', sub: 'C1', info: 'A fixed 4 µF capacitor.' }]),
      q: '<b>Build:</b> a 4 µF capacitor sits <b>in parallel</b> with C2. Choose C2 so the total is <b>10 µF</b>.', teach: '<p><b>Capacitors in parallel add</b> (more plate area): <b>C = C<sub>1</sub> + C<sub>2</sub></b>. In <b>series</b> they combine like resistors in parallel: <b>1/C = 1/C<sub>1</sub> + 1/C<sub>2</sub></b>. <b>Inductors</b> are the opposite of capacitors: series adds, parallel is the reciprocal sum.</p>',
      parts: [1e-6, 2e-6, 4e-6, 6e-6, 10e-6].map(CP), read: p => C1 + p.v, target: tgt, tol: .001, guide: true, label: 'Total C', show: x => E(x, 'F'), note: (p, x) => '4 µF + ' + E(p.v, 'F') + ' = <b>' + E(x, 'F') + '</b>.', why: 'Parallel: C = C1 + C2, so C2 = 10 − 4 = 6 µF.' }); } },
  { t: 'lab', tier: 2, hint: 'Series capacitors: C = C1·C2 ÷ (C1 + C2).', q: '', gen() { const C1 = pick([2e-6, 3e-6, 6e-6]), C2 = pick([3e-6, 6e-6, 12e-6]), tgt = par(C1, C2);
    return dial({ rig: reRig({ kind: 'SRC', label: 'series', sub: 'in line', info: 'Two capacitors in series.' }, { kind: 'BOX', label: 'C total', sub: 'equivalent', info: 'Equivalent capacitance.' }, [{ id: 'r', label: 'C2 (series)', x: 6 }], [{ x: 3, kind: 'C', label: E(C1, 'F'), sub: 'C1', info: 'C1.' }]),
      q: '<b>Build:</b> C1 = ' + E(C1, 'F') + ' in <b>series</b> with C2. Choose C2 so the total is <b>' + E(tgt, 'F') + '</b>.', teach: '<p>Series capacitors give a <b>smaller</b> total than either one.</p>', parts: pickR([1e-6, 2e-6, 3e-6, 6e-6, 12e-6, 24e-6], 5, C2).map(CP), read: p => par(C1, p.v), target: tgt, tol: .01, label: 'Total C', show: x => E(x, 'F'), note: (p, x) => 'Series: ' + E(x, 'F') + '.', why: 'C2 = ' + E(C2, 'F') + '.' }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'Inductors in series add. In parallel they combine like resistors in parallel.', q: '', gen() { const L1 = pick([10e-3, 20e-3]), L2 = pick([10e-3, 20e-3, 30e-3]), L3 = pick([5e-3, 10e-3, 20e-3]), tgt = L1 + par(L2, L3);
    return mk({ rig: reRig({ kind: 'SRC', label: 'target', sub: E(tgt, 'H'), info: 'The combination must equal ' + E(tgt, 'H') + '.' }, { kind: 'BOX', label: 'L total', sub: 'equivalent', info: 'Equivalent inductance.' }, [{ id: 'a', label: 'L2 ∥', x: 5 }, { id: 'b', label: 'L3 ∥', x: 8 }], [{ x: 3, kind: 'L', label: E(L1, 'H'), sub: 'L1 (series)', info: 'L1 in series with the parallel pair.' }]),

WL(29, 'Mutual Inductance', [
  { t: 'lab', tier: 1, hint: 'Aiding: L = L1 + L2 + 2M, with M = k·√(L1·L2). Here L1 = L2 = 10 mH, so M = 10k mH.', q: '', gen() { const L1 = 10e-3, L2 = 10e-3, k = 0.8, tgt = L1 + L2 + 2 * k * Math.sqrt(L1 * L2);

      calc(p) { const t = L1 + L2 + 2 * p.c.v * M, ok = near(t, tgt, .005); return { ok, meters: [meterOf('Total L', E(t, 'H'), ok ? 'good' : 'bad'), meterOf('Target', E(tgt, 'H'))], note: p.c.label + ': 20 mH ' + (p.c.v > 0 ? '+' : '−') + ' 2M = ' + E(t, 'H') + '.', why: (aid ? 'Aiding' : 'Opposing') + ' gives ' + E(tgt, 'H') + '.', fail: 'The other connection gives ' + E(L1 + L2 - 2 * p.c.v * M, 'H') + '.' }; } }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'v2 = M × (di1/dt), M = k·√(L1·L2). √(4 mH × 9 mH) = 6 mH. di1/dt = 1000 A/s.', q: '', gen() { const k = pick([0.25, 0.5, 0.75, 1]), M = k * 6e-3, v2 = M * 1000;
    return dial({ rig: reRig({ kind: 'SRC', label: '1000 A/s', sub: 'di1/dt', info: 'The primary current changes at 1000 A/s.' }, { kind: 'BOX', label: 'v2', sub: 'secondary voltage', info: 'The voltage induced in coil 2.' }, [{ id: 'r', label: 'coupling k', x: 5 }], [{ x: 3, kind: 'L', label: '4 mH / 9 mH', sub: 'L1 / L2', info: 'Coil 1 is 4 mH, coil 2 is 9 mH.' }]),

const expv = (V, t, tau) => V * (1 - Math.exp(-t / tau));
WL(30, 'First-Order Circuits and Time Constants', [
  { t: 'lab', tier: 1, hint: 'τ = R × C. For C = 10 µF and τ = 5 ms, R = τ ÷ C.', q: '', gen() { const C = 10e-6, tgt = 5e-3;

  { t: 'lab', tier: 3, boss: true, hint: 'v(t) = 10 × (1 − e^(−t/τ)). Find τ so that v(5 ms) hits the target.', q: '', gen() { const V = 10, C = 10e-6, R = pick([250, 500, 1000]), t = 5e-3, tgt = expv(V, t, R * C);

      q: '<b>Build:</b> a capacitor (10 µF) charges from 10 V through R. Choose R so that 5 ms after the switch closes the capacitor is at <b>' + N2(tgt) + ' V</b>.', teach: '<p>Now use the formula, not just τ: <b>v(t) = V (1 − e<sup>−t/τ</sup>)</b>.</p>',

]);

WL(31, 'Switching Time and 5τ', [

      parts: [].concat([200, 500, 1000, 2000].map(RP), [0.5e-6, 1e-6, 2e-6, 5e-6].map(CP)), idle: [meterOf('Settle', '—'), meterOf('Surge', '—')],
      calc(p) { if (p.r.kind !== 'R' || p.c.kind !== 'C') return { ok: false, meters: [], note: 'The first socket takes a resistor, the second a capacitor.', fail: 'Put a resistor in R and a capacitor in C.' }; const st = 5 * p.r.v * p.c.v, I0 = V / p.r.v, okA = st <= 5e-3, okB = I0 <= 0.02; return { ok: okA && okB, meters: [meterOf('Settle', E(st, 's'), okA ? 'good' : 'bad'), meterOf('Surge', E(I0, 'A'), okB ? 'good' : 'bad')], note: '5RC = ' + E(st, 's') + ', surge = ' + E(I0, 'A') + '.', why: 'R must be at least 500 Ω (surge ≤ 20 mA) and 5RC at most 5 ms, so for example R = 500 Ω with C = 2 µF.', fail: !okB ? 'Too much surge. Use a bigger R.' : 'Too slow. Use a smaller RC.' }; } }); } },

WL(32, 'RLC and Damping', [

      parts: [50, 100, 200, 400, 800].map(RP), read: p => (p.v / (2 * L)) / w0, target: 1, tol: .01, guide: true, label: 'ζ = α ÷ ω0', show: x => N2(x), extra: p => [meterOf('α', N2(p.v / (2 * L)) + ' /s'), meterOf('ω0', N2(w0) + ' rad/s')], note: (p, x) => 'α = ' + p.v + ' ÷ 0.02 = ' + N2(p.v / (2 * L)) + '. ω0 = ' + N2(w0) + '. ζ = <b>' + N2(x) + '</b> (' + (x > 1.01 ? 'overdamped' : x < .99 ? 'underdamped' : 'critical') + ').', why: 'R = 2√(L÷C) = 2 × √(10 mH ÷ 1 µF) = 200 Ω.', fail: x => x > 1 ? 'Overdamped: too much resistance.' : 'Underdamped: it would still ring. Add resistance.' }); } },

    return slot({ slots: sl, parts: ['Overdamped', 'Critically damped', 'Underdamped'], guide: false, rig: { cols: 11, rows: 7, sockets: sl.map((s, i) => ({ id: s.id, label: s.label, x: [2, 5, 8][i], y: 3 })), fixed: [{ x: 5, y: 1, kind: 'BOX', label: 'L = 10 mH', sub: 'C = 1 µF', info: 'In all three circuits L = 10 mH and C = 1 µF, so ω0 = 10,000 rad/s.' }], wires: [], start: { x: 5, y: 5 }, lever: { x: 10, y: 3 } },
      q: '<b>Build:</b> three RLC circuits share L = 10 mH and C = 1 µF but have different R. Label each one: overdamped, critically damped or underdamped.', teach: '<p>ω0 = 10,000 rad/s here. α = R ÷ 2L = 50 × R. Compare: <b>α &gt; ω0</b> overdamped, <b>α = ω0</b> critical, <b>α &lt; ω0</b> underdamped.</p>',

      calc(p) { if (p.r.kind !== 'R' || p.c.kind !== 'C') return { ok: false, meters: [], note: 'The first socket takes a resistor, the second a capacitor.', fail: 'Put a resistor in R and a capacitor in C.' }; const zz = (p.r.v / 2) * Math.sqrt(p.c.v / L), ok = near(zz, z, .03); return { ok, meters: [meterOf('ζ', N2(zz), ok ? 'good' : 'bad'), meterOf('Type', zz > 1.01 ? 'overdamped' : zz < .99 ? 'underdamped' : 'critical'), meterOf('Target', '0.5')], note: 'ζ = (' + p.r.v + ' ÷ 2) × √(' + E(p.c.v, 'F') + ' ÷ 10 mH) = ' + N2(zz) + '.', why: 'For example R = 100 Ω with C = 1 µF gives ζ = 50 × 0.01 = 0.5.', fail: zz > z ? 'Too much damping.' : 'Too little damping.' }; } }); } },

/* Basic circuits game art. Analogy ON: water pipes, pump, wheel, tank. OFF: circuit schematic and a city that lights up. */
function waterStage(level, box, ana) {
  const W = 480, H = 120;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; cv.setAttribute('role', 'img');
  cv.setAttribute('aria-label', ana ? 'A pump pushing water around a pipe loop into a tank that fills as you solve challenges' : 'An AC circuit loop feeding a city whose lights come on as you solve challenges');
  box.append(cv);
  const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let prog = 0, total = 1, flick = 0, state = 'play', raf = 0, dead = false, target = 0, shown = 0;
  const parts = (level.theme && level.theme.parts) || ['R'];
  const phase = ((level.theme && level.theme.phase) || 0) * Math.PI / 180;
  const seed = level.n * 7919;
  const rnd = i => { const x = Math.sin(seed + i * 12.9898) * 43758.5453; return x - Math.floor(x); };
  const B = []; for (let i = 0; i < 9; i++) B.push({ x: 292 + i * 20, w: 16 + Math.floor(rnd(i) * 4), h: 30 + Math.floor(rnd(i + 20) * 55) });
  const wins = []; B.forEach((b, bi) => { for (let y = 0; y < b.h - 8; y += 9) for (let x = 3; x < b.w - 3; x += 6) wins.push({ x: b.x + x, y: 112 - b.h + 4 + y }); });
  wins.forEach((w, i) => w.r = rnd(i + 100));
  wins.sort((a, b) => a.r - b.r);
  const P = [[24, 28], [250, 28], [250, 92], [24, 92]], LEN = [226, 64, 226, 64], TOT = 580;
  function at(d) { let s = ((d % 1) + 1) % 1 * TOT, i = 0; while (s > LEN[i]) { s -= LEN[i]; i++; } const a = P[i], b = P[(i + 1) % 4], f = s / LEN[i]; return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]; }

  function draw(ts) {
    const t = (ts || 0) / 1000;
    shown += (target - shown) * 0.08; if (Math.abs(target - shown) < 0.002) shown = target;
    ctx.fillStyle = state === 'lose' ? '#05050c' : '#070815'; ctx.fillRect(0, 0, W, H);
    const col = ana ? '#4aa3ff' : '#6a70c0';
    // loop wires
    ctx.strokeStyle = col; ctx.lineWidth = ana ? 7 : 3;
    ctx.beginPath(); P.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.stroke();
    if (ana) { ctx.strokeStyle = '#0c2a52'; ctx.lineWidth = 3; ctx.beginPath(); P.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.stroke(); }
    // source
    const sx = 24, sy = 60;
    if (ana) { ctx.fillStyle = '#16345e'; ctx.fillRect(sx - 14, sy - 16, 28, 32); ctx.strokeStyle = '#4aa3ff'; ctx.lineWidth = 3; ctx.strokeRect(sx - 14, sy - 16, 28, 32); const py = sy + Math.sin(t * 5) * 8; ctx.fillStyle = '#9fd0ff'; ctx.fillRect(sx - 10, py - 4, 20, 8); }

      ctx.lineWidth = 3;

      if (p === 'C') { if (ana) { ctx.fillStyle = '#070815'; ctx.fillRect(x - 12, y - 14, 24, 28); ctx.strokeStyle = '#7ef7c1'; ctx.strokeRect(x - 12, y - 14, 24, 28); const lvl = 12 + Math.sin(t * 2 + phase) * 6; ctx.fillStyle = '#4aa3ff'; ctx.fillRect(x - 10, y + 12 - lvl, 20, lvl); } else { ctx.strokeStyle = '#7ef7c1'; ctx.fillStyle = '#070815'; ctx.fillRect(x - 10, y - 12, 20, 24); ctx.beginPath(); ctx.moveTo(x - 4, y - 12); ctx.lineTo(x - 4, y + 12); ctx.moveTo(x + 4, y - 12); ctx.lineTo(x + 4, y + 12); ctx.stroke(); } }
    });

    const n = 22, spd = (state === 'lose' ? 0 : 0.06 + 0.06 * (prog / total));

    }

      const tx = 320, ty = 20, tw = 140, th = 88;
      ctx.fillStyle = '#0a1830'; ctx.fillRect(tx, ty, tw, th); ctx.strokeStyle = '#4aa3ff'; ctx.lineWidth = 3; ctx.strokeRect(tx, ty, tw, th);
      const lvl = (th - 6) * shown; ctx.fillStyle = state === 'lose' ? '#1b2540' : '#2c7be5'; ctx.fillRect(tx + 3, ty + th - 3 - lvl, tw - 6, lvl);
      ctx.fillStyle = '#7fc0ff'; for (let x = 0; x < tw - 6; x += 8) { const w = Math.sin(t * 3 + x / 6) * 2; ctx.fillRect(tx + 3 + x, ty + th - 3 - lvl + w, 6, 3); }
      ctx.strokeStyle = '#4aa3ff'; ctx.beginPath(); ctx.moveTo(250, 60); ctx.lineTo(tx, 60); ctx.stroke();

    } else {
      ctx.fillStyle = '#10142a'; B.forEach(b => ctx.fillRect(b.x, 112 - b.h, b.w, b.h));
      const lit = Math.round(wins.length * shown);
      wins.forEach((w, i) => { const on = i < lit && state !== 'lose'; ctx.fillStyle = on ? (flick > 0.3 && i % 3 === 0 ? '#3a3a20' : '#ffe66d') : '#1c2144'; ctx.fillRect(w.x, w.y, 3, 5); });
      ctx.fillStyle = '#10142a'; ctx.fillRect(280, 112, 200, 8);
      ctx.strokeStyle = '#6a70c0'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(250, 60); ctx.lineTo(286, 60); ctx.lineTo(286, 112); ctx.stroke();

    good(i, n) { prog = i; total = n; target = i / n; once(); },

    bad() { flick = 1; once(); },

}
