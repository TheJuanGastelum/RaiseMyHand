LV(8, '3.3, 3.4', 3, 'Bridges and Delta–Wye', 'Balanced bridges and converting between Δ and Y.',
  'A <b>balanced bridge</b> (R₁R₄ = R₂R₃) has zero voltage across its middle resistor, so you can ignore it. When a network is neither series nor parallel, a <b>Δ–Y conversion</b> reshapes it. With three equal resistors, <span class="m">R<sub>Y</sub> = R<sub>Δ</sub>/3</span>.',
  { title: 'The Diamond Junction', mission: 'Spot a bridge that carries no cross-flow, and reshape triangles into stars.', key: 'In a diamond of pipes, if the pressure at both middle taps is the same, no water crosses the bridge pipe in the middle. A triangle of pipes and a star of pipes can behave identically from the outside: the conversion swaps one for the other so you can combine them.', map: [['Balanced bridge', 'No flow in the middle pipe'], ['Δ (delta)', 'Three pipes in a triangle'], ['Y (wye)', 'Three pipes meeting at a hub']] },
  [
    { t: 'choice', tier: 1, q: 'What happens in the middle branch of a <b>balanced</b> bridge?', opts: ['No current flows and the voltage across it is zero', 'It carries all the current', 'It carries half the current', 'It acts as a voltage source'], a: 0, hint: 'Both middle nodes are at the same potential.', why: 'In a balanced bridge the two middle nodes sit at equal potential, so no current flows between them.' },
    { t: 'num', tier: 1, gen() { const R = pick([30, 60, 90, 120]); return { q: 'A Δ network has three equal resistors of ' + M(R + ' Ω') + '. Find each resistor in the equivalent Y.', unit: 'Ω', a: R / 3, tol: 0.02, hint: 'R_Y = R_Δ / 3 when all are equal.', why: 'R<sub>Y</sub> = ' + R + '/3 = ' + R / 3 + ' Ω.' }; } },
    { t: 'num', tier: 2, gen() { const R1 = pick([10, 20, 30]), R2 = pick([20, 40, 60]), k = pick([2, 3]); return { q: 'A bridge has the left leg ' + M('R₁ = ' + R1 + ' Ω') + ' (top) and ' + M('R₂ = ' + R2 + ' Ω') + ' (bottom). The right leg top is ' + M('R₃ = ' + R1 * k + ' Ω') + '. What bottom resistor R₄ balances the bridge?', unit: 'Ω', a: R2 * k, tol: 0.02, hint: 'Balance: R₁/R₂ = R₃/R₄.', why: 'R₁R₄ = R₂R₃, so R₄ = R₂R₃/R₁ = ' + R2 + '×' + R1 * k + '/' + R1 + ' = ' + R2 * k + ' Ω.' }; } },
    { t: 'num', tier: 2, gen() { const R = pick([10, 15, 25, 40]); return { q: 'A Y network has three equal resistors of ' + M(R + ' Ω') + '. Find each resistor in the equivalent Δ.', unit: 'Ω', a: 3 * R, tol: 0.02, hint: 'R_Δ = 3 R_Y.', why: 'R<sub>Δ</sub> = 3 × ' + R + ' = ' + 3 * R + ' Ω.' }; } },
    { t: 'num', tier: 3, boss: true, gen() { const a = pick([10, 20]), b = pick([20, 30]), k = pick([2, 3]); return { q: 'A balanced bridge has left leg ' + M(a + ' Ω') + ' (top) and ' + M(b + ' Ω') + ' (bottom). The right leg is ' + M(a * k + ' Ω') + ' (top) and ' + M(b * k + ' Ω') + ' (bottom). Ignoring the cross resistor, find the equivalent resistance seen by the source.', unit: 'Ω', a: k * (a + b) / (1 + k), tol: 0.02, hint: 'Two parallel legs: (a+b) and k(a+b).', why: 'Left = ' + (a + b) + ' Ω, right = ' + k * (a + b) + ' Ω in parallel: ' + fmt(k * (a + b) / (1 + k), 2) + ' Ω.' }; } },
    { t: 'num', tier: 2, q: 'A ' + M('20 mA') + ' source feeds a bridge with ' + M('R₁ = 4 kΩ') + ', ' + M('R₂ = 3 kΩ') + ', ' + M('R₃ = 20 kΩ') + ', ' + M('R₄ = 15 kΩ') + ' (R₁, R₂ on top of the two legs, R₃, R₄ on the bottoms) and a middle resistor. R₁R₄ = R₂R₃, so the bridge is balanced. Find the current in the R₁ leg (in mA).', given: ['R₁R₄ = 60, R₂R₃ = 60'], unit: 'mA', a: 20 * 18 / 42, tol: 0.02, hint: 'Balanced: the middle resistor carries 0. The left leg is R₁ + R₃ and the right leg is R₂ + R₄, in parallel. Use a current divider.', why: 'i₁ = (R₂+R₄)/(R₁+R₂+R₃+R₄) × 20 mA = 18/42 × 20 = 8.57 mA. The other leg gets 11.43 mA.' },
    { t: 'num', tier: 2, q: 'A Δ network has ' + M('R_a = 31 kΩ') + ', ' + M('R_b = 12 kΩ') + ', ' + M('R_c = 15 kΩ') + '. In the equivalent Y, the leg at the corner where R_b and R_c meet is R₁ = R_bR_c/(R_a+R_b+R_c). Find R₁ (kΩ).', unit: 'kΩ', a: 12 * 15 / 58, tol: 0.02, hint: 'Sum of all three Δ resistors goes underneath.', why: 'R₁ = 12×15/(31+12+15) = 180/58 = 3.10 kΩ.' },
  ]);

/* ---------------------------------------------------------------- 9 */
LV(9, '3.5', 2, 'Measuring Voltage and Current', 'Meters, loading, and extending the range.',
  'An ideal <b>voltmeter</b> has infinite resistance and connects <b>in parallel</b>. An ideal <b>ammeter</b> has zero resistance and connects <b>in series</b>. Real meters load the circuit. A series resistor extends a voltmeter range; a shunt resistor extends an ammeter range.',
  { title: 'Gauges on the Pipes', mission: 'Read pressure and flow without changing them.', key: 'A pressure gauge taps across a pipe and should take no water. A flow meter sits in the pipe and should not squeeze it. Real gauges are not perfect, so they slightly change what they measure. Add a big pipe beside the meter (a shunt) to read larger flows.', map: [['Voltmeter', 'Pressure gauge across a pipe'], ['Ammeter', 'Flow meter in the pipe'], ['Shunt', 'A bypass pipe to read bigger flow']] },
  [
    { t: 'match', tier: 1, q: 'Match each ideal meter to its resistance and how it connects.', pairs: [['Ideal voltmeter', 'Infinite resistance, in parallel'], ['Ideal ammeter', 'Zero resistance, in series']], extra: ['Infinite resistance, in series'], why: 'A voltmeter must not draw current, and goes across a part. An ammeter must not drop voltage, and goes in the path.' },
    { t: 'choice', tier: 1, q: 'A real voltmeter with a finite resistance is connected across a high-resistance divider leg. What is the effect?', opts: ['It loads the circuit and reads low', 'It reads higher than the true value', 'It reads exactly right', 'It opens the circuit'], a: 0, hint: 'The meter is a resistor in parallel with the leg.', why: 'The meter is in parallel with the leg, lowering its resistance, so the measured voltage is lower than the unloaded value.' },
    { t: 'num', tier: 2, gen() { const V = pick([5, 10, 50]); return { q: 'A meter movement has full-scale current ' + M('1 mA') + ' and internal resistance ' + M('50 Ω') + '. What series resistor makes a ' + M(V + ' V') + ' full-scale voltmeter?', unit: 'Ω', a: V / 0.001 - 50, tol: 0.02, hint: 'R_total = V/I_fs, minus the meter’s own 50 Ω.', why: 'R<sub>total</sub> = ' + V + '/0.001 = ' + V * 1000 + ' Ω. Series resistor = ' + (V * 1000 - 50) + ' Ω.' }; } },
    { t: 'num', tier: 2, gen() { const I = pick([0.1, 0.5, 1]); return { q: 'The same movement (1 mA, 50 Ω) must read up to ' + M(I + ' A') + '. What shunt resistor goes in parallel with it?', unit: 'Ω', a: 50 * 0.001 / (I - 0.001), tol: 0.02, hint: 'The shunt carries I − 1 mA at the same voltage (1 mA × 50 Ω).', why: 'The meter drops 0.05 V at full scale. Shunt = 0.05/(' + I + ' − 0.001) = ' + fmt(0.05 / (I - 0.001), 4) + ' Ω.' }; } },
    { t: 'num', tier: 3, boss: true, gen() { const Vs = pick([10, 12, 20]), R = pick([10, 20]), RV = pick([10, 20, 40]); const Rp = R * RV / (R + RV); return { q: 'A ' + M(Vs + ' V') + ' source drives two equal ' + M(R + ' kΩ') + ' resistors in series. A voltmeter of ' + M(RV + ' kΩ') + ' is placed across the second one. What does it read?', unit: 'V', a: Vs * Rp / (R + Rp), tol: 0.02, hint: 'Meter ∥ R₂, then divide.', why: 'R₂∥R_V = ' + fmt(Rp, 2) + ' kΩ. Reading = ' + Vs + ' × ' + fmt(Rp, 2) + '/(' + R + ' + ' + fmt(Rp, 2) + ') = ' + fmt(Vs * Rp / (R + Rp), 3) + ' V, below the true ' + Vs / 2 + ' V.' }; } },
    { t: 'num', tier: 1, gen() { const vm = pick([100, 163, 200]), im = pick([1, 2]); return { q: 'A d’Arsonval meter movement reads full scale at ' + M(vm + ' mV') + ' and ' + M(im + ' mA') + '. What is its internal resistance R<sub>m</sub>?', unit: 'Ω', a: vm / im, tol: 0.02, hint: 'R_m = v_m / i_m. mV/mA = Ω.', why: 'R<sub>m</sub> = ' + vm + ' mV / ' + im + ' mA = ' + fmt(vm / im, 2) + ' Ω.' }; } },
    { t: 'num', tier: 2, q: 'Exam-style: a meter movement has full-scale current ' + M('1 mA') + ' and internal resistance ' + M('100 Ω') + '. What series resistor R<sub>v</sub> makes a voltmeter that reads ' + M('10 V') + ' at full scale?', unit: 'Ω', a: 9900, tol: 0.005, hint: 'R_v = v_FS/i_m − R_m.', why: '10 V / 1 mA = 10,000 Ω in total, minus the 100 Ω of the movement = 9,900 Ω.' },
    { t: 'num', tier: 3, q: 'Exam-style: the same movement (' + M('1 mA') + ', ' + M('100 Ω') + ') gets a shunt ' + M('R_A = 5 Ω') + '. What is the largest current the ammeter can read (mA)?', unit: 'mA', a: 21, tol: 0.01, hint: 'The movement and the shunt share the same voltage. Full scale: the movement carries 1 mA.', why: 'The movement drops 1 mA × 100 Ω = 0.1 V, so the shunt carries 0.1/5 = 20 mA. Total = 21 mA.' },
  ]);

/* ---------------------------------------------------------------- 10 */
LV(10, '4.2', 3, 'Node Voltage Analysis', 'Pick a reference node, write KCL at each essential node, solve.',
  '<b>Node voltage analysis</b>: pick a reference (ground) node, name the other essential node voltages, write KCL at each one using Ohm’s law for the branch currents, then solve. With N essential nodes you write N − 1 equations.',
  { title: 'Pressure at Every Junction', mission: 'Give each junction a pressure and make the flows balance.', key: 'Pick one junction as sea level (the reference). Give every other junction a pressure number. At each junction the flow in must equal the flow out, and each pipe’s flow is the pressure difference divided by its squeeze. Solve those balance equations.', map: [['Reference node', 'Sea level'], ['Node voltage', 'Pressure at a junction'], ['KCL at a node', 'Flow balance at the junction']] },
  [
    { t: 'order', tier: 1, q: 'Put the steps of node voltage analysis in order.', items: ['Choose a reference node', 'Label the other essential node voltages', 'Write KCL at each essential node', 'Solve the equations for the node voltages', 'Compute branch currents or power'], why: 'Reference first, label, write KCL (branch current = voltage difference / R), solve, then find what you were asked for.' },
    { t: 'num', tier: 1, gen() { const N = pick([3, 4, 5, 6]); return { q: 'A circuit has ' + M(N + ' essential nodes') + ' (including the reference). How many independent KCL equations do you write?', unit: '', a: N - 1, tol: 0.02, hint: 'One node is the reference.', why: N + ' − 1 = ' + (N - 1) + ' equations.' }; } },
    { t: 'choice', tier: 2, q: 'In node analysis, what is a branch current from node a to node b through a resistor R?', opts: ['(v_a − v_b) / R', '(v_b − v_a) / R', 'v_a · R', '(v_a + v_b) / R'], a: 0, hint: 'Current flows from high to low voltage.', why: 'Ohm’s law: i = (v_a − v_b)/R, flowing from a to b when v_a is higher.' },
    { t: 'num', tier: 2, gen() { const V1 = pick([10, 12, 20]), V2 = pick([6, 8, 10]), R1 = pick([2, 4]), R2 = pick([2, 4]), R3 = pick([4, 8]); const v = (V1 / R1 + V2 / R2) / (1 / R1 + 1 / R2 + 1 / R3); return { q: 'Node v is joined to a ' + M(V1 + ' V') + ' source through ' + M(R1 + ' Ω') + ', to a ' + M(V2 + ' V') + ' source through ' + M(R2 + ' Ω') + ', and to ground through ' + M(R3 + ' Ω') + '. Find v.', unit: 'V', a: v, tol: 0.02, hint: 'KCL: (V1−v)/R1 + (V2−v)/R2 = v/R3.', why: 'v = (V₁/R₁ + V₂/R₂)/(1/R₁ + 1/R₂ + 1/R₃) = ' + fmt(v, 3) + ' V.' }; } },
    { t: 'num', tier: 3, boss: true, gen() { const Is = pick([2, 3, 4]), R1 = pick([2, 4, 5]), R2 = pick([4, 5, 10]); const v = Is * R1 * R2 / (R1 + R2); return { q: 'A ' + M(Is + ' A') + ' current source feeds a node. From that node, ' + M(R1 + ' Ω') + ' and ' + M(R2 + ' Ω') + ' run to ground. Find the node voltage.', unit: 'V', a: v, tol: 0.02, hint: 'KCL: Is = v/R₁ + v/R₂.', why: 'Is = v(1/R₁ + 1/R₂), so v = Is·(R₁∥R₂) = ' + fmt(v, 3) + ' V.' }; } },
    { t: 'num', tier: 2, q: 'A node has a ' + M('2 Ω') + ' resistor to a point held at ' + M('10 V') + ' by a source, a ' + M('3 Ω') + ' resistor to ground and a ' + M('4 A') + ' source pushing current into the node. Find the node voltage.', unit: 'V', a: 10.8, tol: 0.02, hint: 'KCL: (10 − v)/2 + 4 = v/3.', why: '5 − v/2 + 4 = v/3, so 9 = 5v/6 and v = 10.8 V.' },
    { t: 'num', tier: 3, q: 'Three-node example: G = [[4/3, −1, 0], [−1, 3/2, −1/2], [0, −1/2, 3/4]] and I = [−5, 5, 12] A. Solving G V = I gives v₁ = 12.9 V and v₃ = 30.8 V. Find v₂ (V).', unit: 'V', a: 22.2, tol: 0.02, hint: 'Use the first row: (4/3)v₁ − v₂ = −5.', why: 'v₂ = (4/3)(12.9) + 5 = 22.2 V.' },
  ]);

/* ---------------------------------------------------------------- 11 */
LV(11, '4.3, 4.4', 3, 'Supernodes', 'A voltage source between two nodes, and dependent sources in node analysis.',
  'A voltage source between two essential nodes makes a <b>supernode</b>. Write one KCL for the whole supernode, then add a <b>constraint equation</b> for the source: <span class="m">v<sub>a</sub> − v<sub>b</sub> = V<sub>s</sub></span>. For dependent sources, also write the control variable in terms of node voltages.',
  { title: 'Bolted-Together Junctions', mission: 'When a pump fixes the pressure gap between two junctions, treat them as one.', key: 'A pump that holds a fixed pressure difference between two junctions ties them together: you cannot balance each flow separately. Draw a box around both, balance the flow into the whole box, and use the fixed pressure gap as the extra equation.', map: [['Supernode', 'Two junctions tied by a pump'], ['Constraint equation', 'The fixed pressure gap'], ['Control variable', 'The gauge that sets a dependent pump']] },
  [
    { t: 'choice', tier: 1, q: 'What is a supernode?', opts: ['Two essential nodes joined by a voltage source, treated as one for KCL', 'A node with three or more branches', 'The reference node', 'A node with a current source'], a: 0, hint: 'The source’s current is unknown, so avoid it.', why: 'A voltage source between two non-reference nodes has an unknown current. Wrapping both nodes in a supernode lets you write KCL without that unknown.' },
    { t: 'choice', tier: 1, q: 'What extra equation does a supernode need?', opts: ['The source’s constraint: v_a − v_b = V_s', 'A second KVL around the whole circuit', 'Ohm’s law on the source', 'None'], a: 0, hint: 'You lost one equation by merging two nodes.', why: 'Two unknown node voltages need two equations: one KCL for the supernode and one constraint equation from the source.' },
    { t: 'num', tier: 2, gen() { const Vs = pick([4, 6, 10]), vb = pick([2, 3, 5]); return { q: 'A ' + M(Vs + ' V') + ' source connects node a (+) to node b (−). Node b is at ' + M(vb + ' V') + '. Find v<sub>a</sub>.', unit: 'V', a: vb + Vs, tol: 0.02, hint: 'v_a − v_b = V_s.', why: 'v<sub>a</sub> = v<sub>b</sub> + V<sub>s</sub> = ' + vb + ' + ' + Vs + ' = ' + (vb + Vs) + ' V.' }; } },
    { t: 'sort', tier: 2, q: 'Sort each situation by the move it needs in node analysis.', buckets: ['Make a supernode', 'Write normal KCL at the node'], items: [['A voltage source between two non-reference nodes', 0], ['A resistor between two nodes', 1], ['A current source feeding a node', 1], ['A voltage source between a node and ground', 1], ['A dependent voltage source between two non-reference nodes', 0]], why: 'A voltage source tied to ground just fixes that node’s voltage. Only a floating voltage source between two unknown nodes needs a supernode.' },
    { t: 'num', tier: 3, boss: true, gen() { const Is = pick([4, 6, 8]), Vs = pick([2, 4]), R1 = pick([2, 4]), R2 = pick([2, 4]); const vb = (Is - Vs / R1) / (1 / R1 + 1 / R2); return { q: 'A ' + M(Vs + ' V') + ' source sits between nodes a (+) and b (−). Node a goes to ground through ' + M(R1 + ' Ω') + ', node b through ' + M(R2 + ' Ω') + ', and a ' + M(Is + ' A') + ' source pushes current into node a. Find v<sub>b</sub>.', unit: 'V', a: vb, tol: 0.02, hint: 'Supernode KCL: Is = v_a/R₁ + v_b/R₂, with v_a = v_b + Vs.', why: 'v<sub>a</sub> = v<sub>b</sub> + ' + Vs + '. Is = (v<sub>b</sub>+' + Vs + ')/' + R1 + ' + v<sub>b</sub>/' + R2 + ' gives v<sub>b</sub> = ' + fmt(vb, 3) + ' V.' }; } },
  ]);

/* ---------------------------------------------------------------- 12 */
LV(12, '5.1', 3, 'Mesh Current Analysis', 'Clockwise mesh currents and KVL around each mesh.',
  '<b>Mesh current analysis</b>: assign a clockwise current to each mesh, write KVL around each mesh (a shared resistor sees the <i>difference</i> of the two mesh currents), then solve. A current source on an outer branch fixes that mesh current.',
  { title: 'Laps Around the Loops', mission: 'Give each loop its own lap of flow and let shared pipes feel both.', key: 'Imagine a separate stream running clockwise around each loop. A pipe shared by two loops carries the difference of the two streams. Write the pressure lap rule for each loop and solve for the streams.', map: [['Mesh current', 'A stream running a loop'], ['Shared resistor', 'Pipe in two loops: difference of streams'], ['KVL per mesh', 'Pressure lap rule for each loop']] },
  [
    { t: 'match', tier: 1, q: 'Match each analysis method to the law it is built on.', pairs: [['Node voltage analysis', 'KCL'], ['Mesh current analysis', 'KVL']], extra: ['Ohm’s law only'], why: 'Node analysis writes KCL at nodes. Mesh analysis writes KVL around meshes.' },
    { t: 'num', tier: 1, gen() { const b = pick([5, 6, 7, 8]), n = pick([3, 4, 5]); return { q: 'A planar circuit has ' + M(b + ' branches') + ' and ' + M(n + ' essential nodes') + '. How many meshes (independent loops) does it have?', unit: '', a: b - n + 1, tol: 0.02, hint: 'meshes = b − n + 1.', why: b + ' − ' + n + ' + 1 = ' + (b - n + 1) + ' meshes.' }; } },
    { t: 'choice', tier: 2, q: 'A resistor is shared by mesh 1 and mesh 2 (both clockwise). In the mesh 1 equation, what current does it use?', opts: ['i₁ − i₂', 'i₁ + i₂', 'i₁ only', 'i₂ only'], a: 0, hint: 'The meshes run in opposite directions through a shared branch.', why: 'Clockwise currents run opposite ways through a shared branch, so its current is the difference. The voltage term is R(i₁ − i₂) in mesh 1.' },
    { t: 'choice', tier: 2, q: 'An ideal current source sits on the <b>outer</b> branch of mesh 2 only. What does that tell you?', opts: ['The mesh 2 current equals the source (up to sign), so there is one fewer unknown', 'You must use a supermesh', 'The source can be ignored', 'KVL is unusable'], a: 0, hint: 'Only mesh 2 flows through that branch.', why: 'That branch is in just one mesh, so the mesh current is the source current. Skip KVL for that mesh.' },
    { t: 'num', tier: 3, boss: true, gen() { const V = pick([12, 18, 24]), R1 = pick([2, 3]), R2 = pick([2, 4]), R3 = pick([2, 4, 6]); const i1 = V / (R1 + R3 - R3 * R3 / (R2 + R3)); return { q: 'Mesh 1 has a ' + M(V + ' V') + ' source and ' + M(R1 + ' Ω') + '. Mesh 2 has ' + M(R2 + ' Ω') + ' and no source. The shared branch is ' + M(R3 + ' Ω') + '. Find i₁ (clockwise).', unit: 'A', a: i1, tol: 0.02, hint: 'Mesh 2: (R₂+R₃)i₂ = R₃i₁. Substitute into mesh 1.', why: 'i₂ = R₃i₁/(R₂+R₃). Mesh 1: V = (R₁+R₃)i₁ − R₃i₂, so i₁ = ' + fmt(i1, 3) + ' A.' }; } },
    { t: 'num', tier: 2, q: 'Mesh a (left) has a ' + M('1 V') + ' source and ' + M('3 Ω') + ', mesh b (right) has ' + M('6 Ω') + ' and a ' + M('3 V') + ' source (drop in the clockwise direction), and they share a ' + M('3 Ω') + ' resistor. The equations are 6 i_a − 3 i_b = 1 and −3 i_a + 9 i_b = −3. Find i_a (A).', unit: 'A', a: 0, abs: 0.01, tol: 0.001, hint: 'Multiply the first equation by 3 and the second by 2, then add.', why: '18 i_a − 9 i_b = 3 and −6 i_a + 18 i_b = −6 give i_b = −1/3 A and then i_a = 0. The shared 3 Ω has 1 V across it, equal to the left source.' },
  ]);

/* ---------------------------------------------------------------- 13 */
LV(13, '5.2', 3, 'Supermeshes', 'A current source shared by two meshes.',
  'If an ideal current source is on a branch shared by two meshes, its voltage is unknown. Combine the two meshes into a <b>supermesh</b>: write KVL around the outer edge (skipping the source branch) and add a <b>constraint equation</b> <span class="m">i₂ − i₁ = I<sub>s</sub></span>.',
  { title: 'Merged Loops', mission: 'When a flow-pump sits between two loops, merge them and use its fixed flow as the extra rule.', key: 'A flow pump shared by two loops holds a fixed difference between the two streams. Its pressure is unknown, so run the pressure-lap rule around the outer edge of the merged loops, and use the fixed flow as the second equation.', map: [['Supermesh', 'Two loops merged around a flow pump'], ['Constraint', 'Fixed flow difference']] },
  [
    { t: 'choice', tier: 1, q: 'When do you need a supermesh?', opts: ['An ideal current source is shared by two meshes', 'A voltage source is on an outer branch', 'Any resistor is shared', 'There are more than three meshes'], a: 0, hint: 'The source’s voltage is unknown.', why: 'A shared current source has an unknown voltage, which breaks KVL on either mesh alone. Merging them skips that branch.' },
    { t: 'num', tier: 1, gen() { const i1 = pick([1, 2, 3]), Is = pick([2, 3, 4]); return { q: 'A ' + M(Is + ' A') + ' current source is shared by mesh 1 and mesh 2 (both clockwise), pushing in the direction of i₂. If i₁ = ' + M(i1 + ' A') + ', find i₂.', unit: 'A', a: i1 + Is, tol: 0.02, hint: 'Constraint: i₂ − i₁ = Is.', why: 'i₂ = i₁ + Is = ' + (i1 + Is) + ' A.' }; } },
    { t: 'order', tier: 2, q: 'Put the supermesh steps in order.', items: ['Spot the current source shared by two meshes', 'Write the constraint equation (i₂ − i₁ = I_s)', 'Write KVL around the outer edge of the supermesh', 'Write KVL for any remaining ordinary meshes', 'Solve and check'], why: 'Find the shared source, write the constraint, run KVL around the outside, then handle any other meshes.' },
    { t: 'sort', tier: 2, q: 'Sort each case by what you do with the current source.', buckets: ['Supermesh', 'Set the mesh current equal to the source', 'Normal KVL, no special move'], items: [['A current source shared by mesh 1 and mesh 2', 0], ['A current source on an outer branch of mesh 1', 1], ['A resistor shared by two meshes', 2], ['A voltage source on an outer branch', 2]], why: 'Only a shared current source forces a supermesh. An outer current source simply sets its mesh current.' },
    { t: 'num', tier: 3, boss: true, gen() { const V = pick([12, 18, 24]), R1 = pick([2, 3]), R2 = pick([2, 4]), Is = pick([2, 3, 4]); const i1 = (V - R2 * Is) / (R1 + R2); return { q: 'Mesh 1 has a ' + M(V + ' V') + ' source and ' + M(R1 + ' Ω') + '. Mesh 2 has ' + M(R2 + ' Ω') + '. A ' + M(Is + ' A') + ' source on the shared branch gives i₂ − i₁ = ' + Is + '. The supermesh KVL is V = R₁i₁ + R₂i₂. Find i₁.', unit: 'A', a: i1, tol: 0.02, hint: 'Substitute i₂ = i₁ + Is.', why: 'V = R₁i₁ + R₂(i₁+Is), so i₁ = (V − R₂Is)/(R₁+R₂) = ' + fmt(i1, 3) + ' A.' }; } },
  ]);

/* ---------------------------------------------------------------- NVA or MCA */
LV(0, '5.3', 3, 'Node Voltage or Mesh Current?', 'The course rule: deactivate the independent sources, count n and m, pick the cheaper method.',
  'Both methods work, so pick the one with fewer equations. <b>Step 1</b>: deactivate the independent sources (voltage source → short, current source → open). <b>Step 2</b>: count the remaining essential nodes <span class="m">n</span> and essential meshes <span class="m">m</span>. <b>Step 3</b>: if <span class="m">n − 1 &lt; m</span> use NVA. If <span class="m">m &lt; n − 1</span> use MCA. If they are equal, use whichever needs fewer constraint equations when dependent sources are present.',
  { title: 'Which Plan Is Cheaper?', mission: 'Shut off the pumps, count the junctions and loops, then take the shorter plan.', key: 'You can balance the flow at every junction or the pressure around every loop. First shut off the pumps (a pressure pump becomes a plain pipe, a flow pump becomes a capped pipe). Count the junctions and the loops that are left, and pick the plan with fewer equations.', map: [['NVA', 'Balance flow at junctions'], ['MCA', 'Balance pressure around loops'], ['n − 1 vs m', 'Junction equations vs loop equations']] },
  [
    { t: 'order', tier: 1, q: 'Put the strategy for choosing NVA or MCA in order.', items: ['Deactivate the independent sources', 'Count the remaining essential nodes n and essential meshes m', 'Compare n − 1 with m', 'Use the method with fewer equations'], why: 'Deactivate first (voltage source → short, current source → open), count, compare, pick.' },
    { t: 'match', tier: 1, q: 'Match each independent source to how you deactivate it.', pairs: [['Voltage source', 'Replace with a short circuit'], ['Current source', 'Replace with an open circuit']], extra: ['Replace with a resistor'], why: 'A deactivated voltage source has 0 V (a wire). A deactivated current source has 0 A (a break).' },
    { t: 'choice', tier: 2, gen() { const n = rnd(3, 6), m = rnd(2, 6); const a = (n - 1 < m) ? 0 : (m < n - 1 ? 1 : 2); return { q: 'After deactivating the independent sources, a circuit has ' + M('n = ' + n) + ' essential nodes and ' + M('m = ' + m) + ' essential meshes. Which method does the course rule pick?', opts: ['NVA', 'MCA', 'Whichever needs fewer constraint equations'], a, hint: 'Compare n − 1 with m.', why: 'n − 1 = ' + (n - 1) + ' and m = ' + m + '. ' + (a === 0 ? 'n − 1 < m, so NVA.' : a === 1 ? 'm < n − 1, so MCA.' : 'They are equal, so pick the one with fewer constraint equations (dependent sources).') }; } },
    { t: 'num', tier: 2, q: 'Worked example from class: a circuit has a 10 A source, 30 Ω, 8 Ω, 5.2 Ω, 12 Ω, a 500 V source and a 1 V source. After deactivation the 500 V and 1 V sources are wires and the 10 A source is open, leaving n = 2 essential nodes. How many node equations (n − 1) do you need?', unit: '', a: 1, tol: 0.01, hint: 'n − 1.', why: 'n − 1 = 1 equation, versus m = 3 meshes, so NVA wins.' },
    { t: 'num', tier: 3, boss: true, gen() { const n = rnd(3, 5), m = rnd(2, 6); return { q: 'A circuit has ' + M('n = ' + n) + ' essential nodes and ' + M('m = ' + m) + ' essential meshes after deactivation. What is the smaller number of equations you have to write?', unit: '', a: Math.min(n - 1, m), tol: 0.01, hint: 'The smaller of n − 1 and m.', why: 'min(' + (n - 1) + ', ' + m + ') = ' + Math.min(n - 1, m) + '.' }; } },
  ]);

/* ---------------------------------------------------------------- 14 */
LV(14, '4.5, 5b.2', 3, 'Sinusoids and Phasors', 'Frequency, period, polar and rectangular form, and phasors.',
  'A sinusoid <span class="m">A cos(ωt + φ)</span> has angular frequency <span class="m">ω = 2πf</span> and period <span class="m">T = 1/f</span>. A <b>phasor</b> is the complex number <span class="m">A∠φ</span> that captures amplitude and phase at one fixed frequency. Rectangular form: <span class="m">a + jb</span>, with <span class="m">a = A cos φ</span>, <span class="m">b = A sin φ</span>.',
  { title: 'Waves in the Pipe', mission: 'Describe a back-and-forth water wave with just a size and a timing offset.', key: 'AC is a piston pushing water back and forth. How fast it wiggles is the frequency. A phasor is a snapshot: the size of the wave and how far its timing is shifted. Once the frequency is fixed, those two numbers are all you need.', map: [['Frequency f', 'Pushes per second'], ['Period T', 'Time for one push-pull'], ['Phasor', 'Size and timing offset of the wave']] },
  [
    { t: 'num', tier: 1, gen() { const f = pick([50, 60, 100, 1000]); return { q: 'A sinusoid has frequency ' + M(f + ' Hz') + '. What is its period in milliseconds?', unit: 'ms', a: 1000 / f, tol: 0.02, hint: 'T = 1/f.', why: 'T = 1/' + f + ' = ' + fmt(1000 / f, 3) + ' ms.' }; } },
    { t: 'num', tier: 1, gen() { const f = pick([50, 60, 100, 500]); return { q: 'Find the angular frequency ω for ' + M(f + ' Hz') + ' (in rad/s).', unit: 'rad/s', a: 2 * Math.PI * f, tol: 0.02, hint: 'ω = 2πf.', why: 'ω = 2π × ' + f + ' = ' + fmt(2 * Math.PI * f, 1) + ' rad/s.' }; } },
    { t: 'choice', tier: 2, q: 'What does the phasor transform of <span class="m">10 cos(ωt + 30°)</span> look like?', opts: ['10∠30°', '10∠−30°', '30∠10°', '10∠60°'], a: 0, hint: 'The phasor holds the amplitude and the phase angle.', why: 'Phasor = amplitude ∠ phase = 10∠30°. The frequency is understood to be ω.' },
    { t: 'num', tier: 2, gen() { const A = pick([10, 20, 50]), th = pick([30, 45, 60]); return { q: 'Write the phasor ' + M(A + '∠' + th + '°') + ' in rectangular form. What is the real part?', unit: '', a: A * Math.cos(th * Math.PI / 180), tol: 0.02, hint: 'a = A cos θ.', why: 'Real part = ' + A + ' cos ' + th + '° = ' + fmt(A * Math.cos(th * Math.PI / 180), 3) + '.' }; } },
    { t: 'num', tier: 3, boss: true, gen() { const a = pick([3, 6, 8]), b = pick([4, 8, 6]); const A = Math.hypot(a, b); return { q: 'A phasor in rectangular form is ' + M(a + ' + j' + b) + '. What is its magnitude?', unit: '', a: A, tol: 0.02, hint: '|z| = √(a² + b²).', why: '|z| = √(' + a + '² + ' + b + '²) = ' + fmt(A, 3) + '.' }; } },
  ], ['R', 'L', 'C']);

/* ---------------------------------------------------------------- 15 */
LV(15, '5b.1', 3, 'Impedance', 'Resistors, inductors and capacitors in the frequency domain.',
  'In the frequency domain each element has an <b>impedance</b> Z with <span class="m">V = Z I</span>. <span class="m">Z<sub>R</sub> = R</span>, <span class="m">Z<sub>L</sub> = jωL</span>, <span class="m">Z<sub>C</sub> = 1/(jωC)</span>. Series impedances add; use the same series/parallel rules as resistors.',
  { title: 'How Hard Is the Pipe Pushing Back?', mission: 'Give every part a push-back number that depends on how fast you wiggle the piston.', key: 'A narrow pipe resists the same at any speed. A heavy water wheel (inductor) resists fast wiggles more. A stretchy balloon (capacitor) lets fast wiggles through easily and blocks slow ones. Impedance is the combined push-back.', map: [['Impedance Z', 'Total push-back'], ['jωL', 'Wheel: more resistance at high speed'], ['1/(jωC)', 'Balloon: less resistance at high speed']] },
  [
    { t: 'match', tier: 1, q: 'Match each element to its impedance.', pairs: [['Resistor', 'R'], ['Inductor', 'jωL'], ['Capacitor', '1/(jωC)']], extra: ['jωR'], why: 'Z<sub>R</sub> = R, Z<sub>L</sub> = jωL, Z<sub>C</sub> = 1/(jωC).' },
    { t: 'num', tier: 1, gen() { const L = pick([10, 50, 100]), f = pick([100, 500, 1000]); return { q: 'An inductor of ' + M(L + ' mH') + ' is driven at ' + M(f + ' Hz') + '. What is the magnitude of its impedance?', unit: 'Ω', a: 2 * Math.PI * f * L / 1000, tol: 0.02, hint: '|Z_L| = ωL = 2πfL.', why: '|Z<sub>L</sub>| = 2π×' + f + '×' + L / 1000 + ' = ' + fmt(2 * Math.PI * f * L / 1000, 2) + ' Ω.' }; } },
    { t: 'num', tier: 2, gen() { const C = pick([1, 10, 100]), f = pick([100, 1000, 10000]); return { q: 'A capacitor of ' + M(C + ' μF') + ' is driven at ' + M(f + ' Hz') + '. What is the magnitude of its impedance?', unit: 'Ω', a: 1 / (2 * Math.PI * f * C * 1e-6), tol: 0.02, hint: '|Z_C| = 1/(ωC).', why: '|Z<sub>C</sub>| = 1/(2π×' + f + '×' + C + 'e−6) = ' + fmt(1 / (2 * Math.PI * f * C * 1e-6), 3) + ' Ω.' }; } },
    { t: 'choice', tier: 2, q: 'As the frequency goes up, what happens to an inductor’s impedance and a capacitor’s impedance?', opts: ['Inductor: larger. Capacitor: smaller', 'Inductor: smaller. Capacitor: larger', 'Both larger', 'Both unchanged'], a: 0, hint: 'ωL grows with ω; 1/(ωC) shrinks.', why: '|Z<sub>L</sub>| = ωL rises with frequency. |Z<sub>C</sub>| = 1/(ωC) falls.' },
    { t: 'num', tier: 3, boss: true, gen() { const R = pick([30, 60, 80]), X = pick([40, 80, 60]); return { q: 'A resistor of ' + M(R + ' Ω') + ' is in series with an inductor whose impedance is ' + M('j' + X + ' Ω') + '. What is the magnitude of the total impedance?', unit: 'Ω', a: Math.hypot(R, X), tol: 0.02, hint: 'Z = R + jX, |Z| = √(R² + X²).', why: '|Z| = √(' + R + '² + ' + X + '²) = ' + fmt(Math.hypot(R, X), 2) + ' Ω.' }; } },
    { t: 'num', tier: 3, q: 'A source ' + M('10∠−45° V') + ' drives ' + M('R = 3 Ω') + ' in series with an inductor of ' + M('800 mH') + ' at ' + M('ω = 5 rad/s') + '. Find the magnitude of the current (A).', unit: 'A', a: 2, tol: 0.02, hint: 'Z_L = jωL = j4, so Z = 3 + j4, |Z| = 5.', why: '|I| = 10/|3 + j4| = 10/5 = 2 A (the phase is −45° − 53.13° = −98.13°).' },
  ], ['R', 'L', 'C']);

/* ---------------------------------------------------------------- 16 */
LV(16, '6.2, 6.3', 3, 'Source Transformations', 'Swapping a voltage source with a series resistor for a current source with a parallel resistor.',
  'A voltage source <span class="m">V<sub>s</sub></span> in series with R equals a current source <span class="m">I<sub>s</sub> = V<sub>s</sub>/R</span> in parallel with the same R, as seen from the outside. The two behave the same at the terminals, but not inside: the power dissipated in R inside the source differs.',
  { title: 'Swap the Pump', mission: 'Trade a pressure pump with a narrow pipe in front for a flow pump with the pipe beside it.', key: 'A pressure pump with a squeezing pipe in series acts, to the outside world, like a flow pump with the same pipe in parallel. The tap-off pipes cannot tell the difference, but inside the box the water heating up differs.', map: [['Source transformation', 'Swap pump types, keep the pipe'], ['Is = Vs / R', 'Equivalent flow of the pump']] },
  [
    { t: 'num', tier: 1, gen() { const V = pick([10, 12, 24]), R = pick([2, 4, 6]); return { q: 'A ' + M(V + ' V') + ' source in series with ' + M(R + ' Ω') + ' is transformed. What current source value results?', unit: 'A', a: V / R, tol: 0.02, hint: 'Is = Vs / R.', why: 'I<sub>s</sub> = ' + V + '/' + R + ' = ' + fmt(V / R, 3) + ' A, with the same ' + R + ' Ω in parallel.' }; } },
    { t: 'num', tier: 1, gen() { const I = pick([2, 3, 5]), R = pick([4, 6, 10]); return { q: 'A ' + M(I + ' A') + ' current source with ' + M(R + ' Ω') + ' in parallel is transformed. What voltage source results (in series with ' + R + ' Ω)?', unit: 'V', a: I * R, tol: 0.02, hint: 'Vs = Is · R.', why: 'V<sub>s</sub> = ' + I + ' × ' + R + ' = ' + I * R + ' V.' }; } },
    { t: 'choice', tier: 2, q: 'Does a source transformation preserve the power dissipated <b>inside</b> the source?', opts: ['No, only the terminal behavior', 'Yes, everything', 'Yes, but only for current sources', 'No, and it changes the terminal voltage'], a: 0, hint: 'It is an equivalence seen from outside.', why: 'The equivalent circuits give the same terminal voltage and current, but the power lost in the internal R differs between the two forms.' },
    { t: 'choice', tier: 2, q: 'A voltage source sits directly in parallel with a resistor. What does that resistor do for the rest of the circuit?', opts: ['Nothing: it does not change the terminal voltage', 'It sets the voltage', 'It lowers the source voltage', 'It must be transformed first'], a: 0, hint: 'An ideal voltage source holds its voltage regardless.', why: 'A resistor in parallel with an ideal voltage source does not change the terminals’ behavior. A resistor in series with an ideal current source behaves the same way.' },
    { t: 'num', tier: 3, boss: true, gen() { const V1 = pick([12, 24]), R1 = pick([4, 6]), I2 = pick([2, 3]), R2 = pick([4, 12]); const Req = R1 * R2 / (R1 + R2); const Is = V1 / R1 + I2; return { q: 'A ' + M(V1 + ' V') + ' source in series with ' + M(R1 + ' Ω') + ' sits in parallel with a ' + M(I2 + ' A') + ' source (direction aiding) and ' + M(R2 + ' Ω') + '. Transform to a single Norton source: find I<sub>N</sub>.', unit: 'A', a: Is, tol: 0.02, hint: 'Transform the voltage branch to a current source, then add the parallel currents.', why: 'V₁/R₁ = ' + fmt(V1 / R1, 3) + ' A. Parallel current sources add: I<sub>N</sub> = ' + fmt(Is, 3) + ' A, with R<sub>N</sub> = ' + fmt(Req, 3) + ' Ω.' }; } },
    { t: 'num', tier: 3, q: 'Source transformations reduce a ladder: ' + M('360 V') + ' source, ' + M('36 Ω') + ' in series, ' + M('36 Ω') + ' to ground, ' + M('2 Ω') + ' in series, then ' + M('20 Ω') + ' and ' + M('80 Ω') + ' to ground. Find the current in the 80 Ω (A).', unit: 'A', a: 1, tol: 0.02, hint: '360/36 = 10 A in parallel with 36 Ω; 36∥36 = 18 Ω. Back to a voltage source: 180 V in series with 18 + 2 Ω.', why: '180 V in series with 20 Ω feeds 20∥80 = 16 Ω: v = 180 × 16/36 = 80 V, so i = 80/80 = 1 A.' },
  ]);

LV(17, '6.5', 4, 'Thevenin and Norton', 'Shrinking a circuit to one source and one resistor.',
  'Any linear two-terminal circuit equals a <b>Thevenin</b> equivalent: <span class="m">V<sub>th</sub></span> (the open-circuit voltage) in series with <span class="m">R<sub>th</sub></span>. Three ways to get R<sub>th</sub>: deactivate the independent sources and combine, <span class="m">R<sub>th</sub> = V<sub>oc</sub>/I<sub>sc</sub></span>, or apply a test source (required with dependent sources and no independent ones).',
  { title: 'One Pump, One Pipe', mission: 'Hide a whole plumbing network behind two terminals as one pump and one narrow pipe.', key: 'From the outside, any pipe network with pumps looks like a single pump (the open-circuit pressure) with a single narrow pipe in series (the equivalent squeeze). To find the squeeze: shut off the pumps and see the resistance, or compare the open pressure to the short-circuit flow.', map: [['Vth', 'Pressure with the tap closed'], ['Rth', 'Single equivalent squeeze'], ['Isc', 'Flow with the tap shorted'], ['Test source', 'Push a known flow in and read the pressure']] },
  [
    { t: 'match', tier: 1, q: 'Match each Thevenin ingredient to how you find it.', pairs: [['V_th', 'Open-circuit voltage'], ['I_N (Norton)', 'Short-circuit current'], ['R_th', 'V_oc / I_sc']], extra: ['Source voltage times 2'], why: 'V<sub>th</sub> is the open-circuit voltage. I<sub>N</sub> is the short-circuit current. R<sub>th</sub> = V<sub>oc</sub>/I<sub>sc</sub>.' },
    { t: 'num', tier: 1, gen() { const Voc = pick([12, 24, 30]), Isc = pick([2, 3, 4, 6]); return { q: 'A circuit has open-circuit voltage ' + M(Voc + ' V') + ' and short-circuit current ' + M(Isc + ' A') + '. Find R<sub>th</sub>.', unit: 'Ω', a: Voc / Isc, tol: 0.02, hint: 'R_th = V_oc / I_sc.', why: 'R<sub>th</sub> = ' + Voc + '/' + Isc + ' = ' + fmt(Voc / Isc, 3) + ' Ω.' }; } },
    { t: 'num', tier: 2, gen() { const V = pick([12, 24]), R1 = pick([2, 4, 6]), R2 = pick([4, 6, 12]); return { q: 'A ' + M(V + ' V') + ' source feeds ' + M(R1 + ' Ω') + ' in series, then ' + M(R2 + ' Ω') + ' to ground. Looking across R₂, find R<sub>th</sub> (source deactivated).', unit: 'Ω', a: R1 * R2 / (R1 + R2), tol: 0.02, hint: 'Short the voltage source: R₁ and R₂ become parallel.', why: 'Deactivated voltage source = short, so R<sub>th</sub> = R₁∥R₂ = ' + fmt(R1 * R2 / (R1 + R2), 3) + ' Ω.' }; } },
    { t: 'num', tier: 2, gen() { const V = pick([12, 24]), R1 = pick([2, 4, 6]), R2 = pick([4, 6, 12]); return { q: 'A ' + M(V + ' V') + ' source feeds ' + M(R1 + ' Ω') + ' in series, then ' + M(R2 + ' Ω') + ' to ground. Find V<sub>th</sub> across R₂ with nothing connected to it.', unit: 'V', a: V * R2 / (R1 + R2), tol: 0.02, hint: 'Open circuit means no current out of the terminals: a voltage divider.', why: 'V<sub>th</sub> = ' + V + ' × ' + R2 + '/(' + R1 + '+' + R2 + ') = ' + fmt(V * R2 / (R1 + R2), 3) + ' V.' }; } },
    { t: 'choice', tier: 3, boss: true, q: 'A circuit has <b>only dependent sources</b> and resistors. Which method finds R<sub>th</sub>?', opts: ['Apply a test source and compute v_test / i_test', 'Deactivate all sources and combine resistors', 'Use V_oc / I_sc, both of which are nonzero', 'Short the dependent source'], a: 0, hint: 'With no independent sources, V_oc = 0 and I_sc = 0.', why: 'With no independent source there is no open-circuit voltage or short-circuit current to compare. Apply a test source at the terminals and take the ratio v/i.' },
    { t: 'sort', tier: 2, q: 'Sort each circuit by the method for finding R<sub>th</sub>.', buckets: ['Deactivate sources works', 'Test source required'], items: [['Resistors and independent sources only', 0], ['Resistors and dependent sources only', 1], ['Resistors, independent and dependent sources (use direct or test source)', 0], ['No independent source anywhere', 1]], why: 'With only independent sources and resistors, deactivate them and combine. With no independent source, V_oc and I_sc are both zero, so use a test source.' },
    { t: 'num', tier: 3, q: 'A ' + M('200 V') + ' source feeds ' + M('25 Ω') + ' in series, then ' + M('100 Ω') + ' to ground, then ' + M('10 Ω') + ' to terminal a. Find V<sub>th</sub> (V).', unit: 'V', a: 160, tol: 0.02, hint: 'Open circuit: no current in the 10 Ω. A divider.', why: 'V<sub>th</sub> = 200 × 100/125 = 160 V. (R<sub>th</sub> = 10 + 25∥100 = 30 Ω.)' },
  ]);

/* ---------------------------------------------------------------- 18 */
LV(18, '6.6', 3, 'Maximum Power Transfer', 'Matching the load to the source.',
  'A load draws maximum power from a Thevenin source when <span class="m">R<sub>L</sub> = R<sub>th</sub></span>. The maximum is <span class="m">P<sub>max</sub> = V<sub>th</sub>²/(4R<sub>th</sub>)</span>. With a shorted or open load the load power is zero. At the match, the efficiency is only 50%.',
  { title: 'Matching the Tap', mission: 'Find the pipe width that pulls the most work from a given pump.', key: 'A tap pipe that is too wide lets water rush through with no pressure to spare. A tap that is too narrow chokes the flow. The most work comes when the tap matches the pump’s own internal squeeze. At that match, as much work is lost inside the pump as is delivered.', map: [['R_L = R_th', 'Tap matches the pump’s squeeze'], ['P_max', 'Most work delivered'], ['50% efficiency', 'Half the work lost inside']] },
  [
    { t: 'choice', tier: 1, q: 'For what load resistance is power transfer from a Thevenin source maximized?', opts: ['R_L = R_th', 'R_L = 0', 'R_L → ∞', 'R_L = 2 R_th'], a: 0, hint: 'Short and open both give zero load power.', why: 'Shorted (R_L = 0) gives no voltage; open gives no current. The maximum is at R<sub>L</sub> = R<sub>th</sub>.' },
    { t: 'num', tier: 1, gen() { const R = pick([4, 10, 25, 50]); return { q: 'A source has Thevenin resistance ' + M(R + ' Ω') + '. What load resistance gets the most power?', unit: 'Ω', a: R, tol: 0.02, hint: 'Match it.', why: 'R<sub>L</sub> = R<sub>th</sub> = ' + R + ' Ω.' }; } },
    { t: 'num', tier: 2, gen() { const V = pick([12, 20, 40]), R = pick([4, 5, 10]); return { q: 'A source has ' + M('V_th = ' + V + ' V') + ' and ' + M('R_th = ' + R + ' Ω') + '. What is the maximum power delivered to a load?', unit: 'W', a: V * V / (4 * R), tol: 0.02, hint: 'P_max = V_th² / (4 R_th).', why: 'P<sub>max</sub> = ' + V * V + '/(4×' + R + ') = ' + fmt(V * V / (4 * R), 3) + ' W.' }; } },
    { t: 'choice', tier: 2, q: 'At maximum power transfer, what is the efficiency of the source-plus-load system?', opts: ['50%', '100%', '25%', '75%'], a: 0, hint: 'The same current flows through R_th and R_L, which are equal.', why: 'With R<sub>L</sub> = R<sub>th</sub> the same power is lost in R<sub>th</sub> as is delivered to the load, so efficiency is 50%.' },
    { t: 'num', tier: 3, boss: true, gen() { const V = pick([12, 24]), R = pick([4, 6, 12]); const RL = pick([R * 2, R / 2]); const i = V / (R + RL); return { q: 'A source with ' + M('V_th = ' + V + ' V') + ', ' + M('R_th = ' + R + ' Ω') + ' drives a load of ' + M(RL + ' Ω') + ' (not matched). How much power does the load get?', unit: 'W', a: i * i * RL, tol: 0.02, hint: 'i = V/(R_th + R_L), then P = i²R_L.', why: 'i = ' + V + '/(' + R + '+' + RL + ') = ' + fmt(i, 3) + ' A, so P = i²R<sub>L</sub> = ' + fmt(i * i * RL, 3) + ' W, less than the matched ' + fmt(V * V / (4 * R), 3) + ' W.' }; } },
  ]);

/* ---------------------------------------------------------------- 19 */
LV(19, '6.7', 3, 'Superposition', 'One source at a time, then add the answers.',
  '<b>Superposition</b>: in a linear circuit, the response to several sources is the sum of the responses to each source acting alone. Deactivate the others: a voltage source becomes a <b>short</b>, a current source becomes an <b>open</b>. It does not work for power.',
  { title: 'One Pump at a Time', mission: 'Turn off all pumps but one, measure, repeat, then add.', key: 'With several pumps in a network, shut off all but one, see what it does to a gauge, then do the same for each pump. The real reading is the sum. A shut-off pressure pump is just a plain pipe; a shut-off flow pump is a capped pipe.', map: [['Voltage source off', 'Plain pipe (short)'], ['Current source off', 'Capped pipe (open)'], ['Add the responses', 'Gauge readings add']] },
  [
    { t: 'match', tier: 1, q: 'Match each deactivated source to what replaces it.', pairs: [['Voltage source', 'Short circuit'], ['Current source', 'Open circuit']], extra: ['Resistor'], why: 'A deactivated voltage source has 0 V, a wire. A deactivated current source has 0 A, a break.' },
    { t: 'choice', tier: 1, q: 'Superposition can be used to add up which quantities?', opts: ['Voltages and currents', 'Power', 'Resistance', 'Nothing'], a: 0, hint: 'Power depends on v·i, which is not linear.', why: 'Voltage and current responses are linear in the sources, so they add. Power is quadratic, so it does not.' },
    { t: 'num', tier: 2, gen() { const a = pick([2, 3, 4]), b = pick([1, 2, 5]); return { q: 'A source alone makes ' + M(a + ' V') + ' appear across a resistor. A second source alone makes ' + M(b + ' V') + ' appear in the same direction. What is the voltage with both on?', unit: 'V', a: a + b, tol: 0.02, hint: 'Add them.', why: a + ' + ' + b + ' = ' + (a + b) + ' V.' }; } },
    { t: 'num', tier: 2, gen() { const V = pick([12, 24]), I = pick([2, 3]), R1 = pick([4, 6]), R2 = pick([4, 12]); const v = V * R2 / (R1 + R2) + I * R1 * R2 / (R1 + R2); return { q: 'A ' + M(V + ' V') + ' source feeds ' + M(R1 + ' Ω') + ' in series, then ' + M(R2 + ' Ω') + ' to ground. A ' + M(I + ' A') + ' current source also pushes current into the junction. Find the voltage across R₂ using superposition.', unit: 'V', a: v, tol: 0.02, hint: 'Voltage source alone is a divider. Current source alone sees R₁∥R₂.', why: 'Voltage source: ' + fmt(V * R2 / (R1 + R2), 3) + ' V. Current source: ' + I + ' × ' + fmt(R1 * R2 / (R1 + R2), 3) + ' = ' + fmt(I * R1 * R2 / (R1 + R2), 3) + ' V. Sum = ' + fmt(v, 3) + ' V.' }; } },
    { t: 'num', tier: 3, boss: true, gen() { const a = pick([2, 3]), b = pick([1, 2]), R = pick([2, 5, 10]); return { q: 'Each of two sources alone sends current through a ' + M(R + ' Ω') + ' resistor: ' + M(a + ' A') + ' and ' + M(b + ' A') + ' in the same direction. By superposition, the total current is ' + (a + b) + ' A. Why can you <b>not</b> just add the two powers? Find the true power.', unit: 'W', a: (a + b) * (a + b) * R, tol: 0.02, hint: 'P = i²R with the total current.', why: 'Power is i²R with the total current: (' + a + '+' + b + ')²×' + R + ' = ' + (a + b) * (a + b) * R + ' W. Adding the separate powers (' + (a * a + b * b) * R + ' W) would be wrong.' }; } },
  ]);

/* ---------------------------------------------------------------- 20 */
LV(20, '7.1', 3, 'Op Amp Basics and the Inverting Amp', 'The ideal op amp rules and the inverting configuration.',
  'An <b>ideal op amp</b> with negative feedback follows two rules: <span class="m">v<sub>p</sub> = v<sub>n</sub></span> (inputs at equal voltage) and <span class="m">i<sub>p</sub> = i<sub>n</sub> = 0</span> (no current into the inputs). The <b>inverting amplifier</b> has gain <span class="m">v<sub>o</sub>/v<sub>s</sub> = −R<sub>f</sub>/R<sub>s</sub></span>.',
  { title: 'The Smart Valve', mission: 'Meet a valve that watches two gauges and adjusts itself until they agree.', key: 'An op amp is a smart valve with two sensing taps. It keeps opening and closing until the two taps read the same pressure, and the taps themselves take no water. With the return pipe (feedback) connected, the output pressure ends up being whatever it takes to make that happen. The supply pumps are its limits.', map: [['v_p = v_n', 'Both sensing taps read the same'], ['i_p = i_n = 0', 'Taps draw no water'], ['Rf', 'Return pipe squeeze'], ['Supply rails', 'The pumps limiting the valve']] },
  [
    { t: 'match', tier: 1, q: 'Match each ideal op amp rule to what it means.', pairs: [['v_p = v_n', 'The two inputs sit at the same voltage'], ['i_p = i_n = 0', 'No current flows into either input']], extra: ['The output is always 0 V'], why: 'With negative feedback an ideal op amp holds its inputs at equal voltage and draws no input current.' },
    { t: 'choice', tier: 1, q: 'What is the gain of an inverting amplifier?', opts: ['−R_f / R_s', '1 + R_f / R_s', 'R_f / R_s', '−R_s / R_f'], a: 0, hint: 'The input comes in through R_s, the feedback resistor is R_f.', why: 'With the + input grounded, v_n = 0 and i through R_s equals i through R_f, so v<sub>o</sub> = −(R<sub>f</sub>/R<sub>s</sub>)v<sub>s</sub>.' },
    { t: 'num', tier: 2, gen() { const Rf = pick([10, 20, 47, 100]), Rs = pick([1, 2, 5, 10]); return { q: 'An inverting amplifier has ' + M('R_f = ' + Rf + ' kΩ') + ' and ' + M('R_s = ' + Rs + ' kΩ') + '. What is its gain v<sub>o</sub>/v<sub>s</sub>?', unit: '', a: -Rf / Rs, tol: 0.02, hint: 'Gain = −R_f / R_s. Keep the minus sign.', why: 'Gain = −' + Rf + '/' + Rs + ' = ' + fmt(-Rf / Rs, 3) + '.' }; } },
    { t: 'num', tier: 2, gen() { const Rf = pick([10, 20, 50]), Rs = pick([2, 4, 5]), vs = pick([0.2, 0.5, 1]); return { q: 'Inverting amp: ' + M('R_f = ' + Rf + ' kΩ') + ', ' + M('R_s = ' + Rs + ' kΩ') + ', ' + M('v_s = ' + vs + ' V') + '. Find v<sub>o</sub> (assume the supply is large enough).', unit: 'V', a: -Rf / Rs * vs, tol: 0.02, hint: 'v_o = −(R_f/R_s)·v_s.', why: 'v<sub>o</sub> = −(' + Rf + '/' + Rs + ')×' + vs + ' = ' + fmt(-Rf / Rs * vs, 3) + ' V.' }; } },
    { t: 'num', tier: 3, boss: true, gen() { const Rf = pick([10, 20, 30]), Rs = pick([2, 5, 10]), vs = pick([0.5, 1, 2]); const i = vs / Rs; return { q: 'Inverting amp with ' + M('R_f = ' + Rf + ' kΩ') + ', ' + M('R_s = ' + Rs + ' kΩ') + ' and ' + M('v_s = ' + vs + ' V') + '. How much current (in mA) flows through R_f?', unit: 'mA', a: i, tol: 0.02, hint: 'The inverting input is a virtual ground at 0 V, so the current through R_s is v_s/R_s, and none enters the input.', why: 'v<sub>n</sub> = 0, so i = v<sub>s</sub>/R<sub>s</sub> = ' + vs + '/' + Rs + ' kΩ = ' + fmt(i, 3) + ' mA. It all passes through R<sub>f</sub> because i<sub>n</sub> = 0.' }; } },
  ], ['R']);

/* ---------------------------------------------------------------- 21 */
LV(21, '7.2, 7.4', 3, 'Op Amp Circuits: Follower, Non-Inverting, Summing, Difference', 'Applying the ideal rules to the classic op amp circuits.',
  'Same two rules, new wiring. <b>Non-inverting</b>: <span class="m">v<sub>o</sub> = (1 + R<sub>f</sub>/R<sub>s</sub>)v<sub>in</sub></span>. <b>Follower</b>: gain 1. <b>Summing</b>: <span class="m">v<sub>o</sub> = −R<sub>f</sub>(v₁/R₁ + v₂/R₂)</span>. <b>Difference</b> (matched): <span class="m">v<sub>o</sub> = (R<sub>f</sub>/R₁)(v₂ − v₁)</span>.',
  { title: 'Four Valve Layouts', mission: 'Re-plumb the smart valve into amplifiers, mixers and comparers.', key: 'The same smart valve can be wired four ways. Feed the signal to the other tap and it flips and scales. Feed it to the + tap and it scales without flipping. A follower is just a buffer that copies the pressure without drawing from the source. Add several input pipes and it mixes them. Wire two inputs the right way and it subtracts.', map: [['Non-inverting', 'Scales, keeps sign'], ['Follower', 'Copies the pressure, takes no water'], ['Summing', 'Mixes several inputs'], ['Difference', 'Subtracts two inputs']] },
  [
    { t: 'sort', tier: 1, q: 'Sort each circuit by whether its output flips the sign of the input (for a positive input).', buckets: ['Output is inverted', 'Output keeps the sign'], items: [['Inverting amplifier', 0], ['Non-inverting amplifier', 1], ['Voltage follower', 1], ['Inverting summing amplifier', 0]], why: 'Inverting and summing (inverting) configurations flip the sign. Non-inverting and follower do not.' },
    { t: 'num', tier: 1, gen() { const Rf = pick([10, 20, 50]), Rs = pick([2, 5, 10]); return { q: 'A non-inverting amplifier has ' + M('R_f = ' + Rf + ' kΩ') + ' and ' + M('R_s = ' + Rs + ' kΩ') + '. Find the gain.', unit: '', a: 1 + Rf / Rs, tol: 0.02, hint: 'Gain = 1 + R_f / R_s.', why: 'Gain = 1 + ' + Rf + '/' + Rs + ' = ' + fmt(1 + Rf / Rs, 3) + '.' }; } },
    { t: 'choice', tier: 2, q: 'Why use a voltage follower, whose gain is 1?', opts: ['It buffers the source: the input draws no current but the output can drive a load', 'It amplifies the input', 'It inverts the signal', 'It removes DC'], a: 0, hint: 'i_p = 0.', why: 'The input draws no current, so a weak source is not loaded, while the op amp output can supply current to a load.' },
    { t: 'num', tier: 2, gen() { const Rf = pick([10, 20]), R1 = pick([5, 10]), R2 = pick([10, 20]), v1 = pick([1, 2]), v2 = pick([0.5, 1]); const vo = -Rf * (v1 / R1 + v2 / R2); return { q: 'Inverting summer: ' + M('R_f = ' + Rf + ' kΩ') + ', ' + M('R₁ = ' + R1 + ' kΩ') + ' (v₁ = ' + v1 + ' V), ' + M('R₂ = ' + R2 + ' kΩ') + ' (v₂ = ' + v2 + ' V). Find v<sub>o</sub>.', unit: 'V', a: vo, tol: 0.02, hint: 'v_o = −R_f(v₁/R₁ + v₂/R₂).', why: 'v<sub>o</sub> = −' + Rf + '(' + v1 + '/' + R1 + ' + ' + v2 + '/' + R2 + ') = ' + fmt(vo, 3) + ' V.' }; } },
    { t: 'num', tier: 3, boss: true, gen() { const g = pick([2, 5, 10]), v1 = pick([1, 2, 3]), v2 = v1 + pick([0.5, 1, 2]); return { q: 'A matched difference amplifier has gain ' + M('R_f/R₁ = ' + g) + '. The inputs are ' + M('v₁ = ' + v1 + ' V') + ' (inverting side) and ' + M('v₂ = ' + v2 + ' V') + ' (non-inverting side). Find v<sub>o</sub>.', unit: 'V', a: g * (v2 - v1), tol: 0.02, hint: 'v_o = (R_f/R₁)(v₂ − v₁).', why: 'v<sub>o</sub> = ' + g + ' × (' + v2 + ' − ' + v1 + ') = ' + fmt(g * (v2 - v1), 3) + ' V.' }; } },
  ], ['R']);

/* ---------------------------------------------------------------- 22 */
LV(22, '7.6', 4, 'Saturation, Comparators and CMRR', 'What happens at the supply limits, with no feedback, and with real differences.',
  'The output cannot go beyond the <b>supply rails</b>. If the ideal formula asks for more, the output <b>saturates</b> at the rail. With <b>no feedback</b> (a comparator) the output swings to +V<sub>cc</sub> if v<sub>p</sub> &gt; v<sub>n</sub> and −V<sub>cc</sub> if v<sub>p</sub> &lt; v<sub>n</sub>. <b>CMRR</b> measures how well a difference amp rejects a common signal.',
  { title: 'When the Valve Bottoms Out', mission: 'Find what happens when the smart valve is asked for more than the pumps can give.', key: 'The smart valve cannot push harder than its supply pumps. Ask for too much and it just stays wide open at the limit (saturation). Remove the return pipe and the valve stops balancing: it just slams fully one way or the other depending on which tap reads higher (a comparator). A good difference valve ignores pressure that is common to both taps.', map: [['Saturation', 'Valve fully open at the pump limit'], ['Comparator', 'Valve slams to whichever tap is higher'], ['CMRR', 'Ignoring pressure common to both taps']] },
  [
    { t: 'choice', tier: 1, q: 'An inverting amp has gain −5 and a supply of ±10 V. The input is 3 V. What is the output?', opts: ['−10 V (saturated at the rail)', '−15 V', '−5 V', '+10 V'], a: 0, hint: 'Compare −15 V to the rail.', why: 'The ideal formula says −15 V, but the output cannot go below −10 V. It saturates at −10 V.' },
    { t: 'num', tier: 1, gen() { const g = pick([-2, -5, -10]), vs = pick([0.2, 0.5, 1.5]), Vcc = pick([12, 15]); const vo = Math.max(-Vcc, Math.min(Vcc, g * vs)); return { q: 'An inverting amp has gain ' + M(g) + ' and a supply of ' + M('±' + Vcc + ' V') + '. The input is ' + M(vs + ' V') + '. Find v<sub>o</sub>, accounting for saturation.', unit: 'V', a: vo, tol: 0.02, hint: 'Compute the ideal value, then clip it to the rails.', why: 'Ideal: ' + fmt(g * vs, 3) + ' V. After clipping to ±' + Vcc + ' V: ' + fmt(vo, 3) + ' V.' }; } },
    { t: 'sort', tier: 2, q: 'A comparator has +V<sub>cc</sub> = 5 V and −V<sub>cc</sub> = −5 V and no feedback. Sort each input pair by its output.', buckets: ['+5 V', '−5 V'], items: [['v_p = 2 V, v_n = 1 V', 0], ['v_p = 1 V, v_n = 2 V', 1], ['v_p = 0.1 V, v_n = 0 V', 0], ['v_p = −3 V, v_n = 0 V', 1]], why: 'With no feedback, the output is +V<sub>cc</sub> when v<sub>p</sub> &gt; v<sub>n</sub> and −V<sub>cc</sub> when v<sub>p</sub> &lt; v<sub>n</sub>. Here the rules v<sub>p</sub> = v<sub>n</sub> do not apply.' },
    { t: 'choice', tier: 2, q: 'Why does v<sub>p</sub> = v<sub>n</sub> <b>fail</b> for a comparator with no feedback?', opts: ['No feedback means nothing forces the inputs to match; the output just saturates', 'The op amp has no power', 'Input currents become large', 'The inputs are shorted together'], a: 0, hint: 'The rule comes from negative feedback.', why: 'The equal-inputs rule holds only when negative feedback can pull the inputs together. With no feedback the output goes to a rail.' },
    { t: 'choice', tier: 3, boss: true, q: 'What does a high CMRR tell you about a difference amplifier?', opts: ['It amplifies the difference between the inputs and rejects what they have in common', 'It amplifies the common signal', 'It has a high output resistance', 'It saturates easily'], a: 0, hint: 'CMRR = common-mode rejection ratio.', why: 'CMRR compares the differential gain to the common-mode gain. High CMRR means the common (noise) signal is suppressed and the difference is kept.' },
  ], ['R']);

/* ---------------------------------------------------------------- Op amp input and output */
LV(0, '7.5', 4, 'Op Amp Input and Output Properties', 'Input resistance, output Thevenin equivalent, and a more realistic op amp.',
  'The source sees the circuit’s <b>input resistance</b>. For the inverting amplifier it is <span class="m">R<sub>s</sub></span> (the inverting input is a virtual ground). For the non-inverting amplifier it is <b>infinite</b> (ideal). At the output, an ideal op amp circuit has a Thevenin resistance of <b>0 Ω</b>, so the output voltage does not change with the load. A <b>realistic model</b> adds a finite input resistance, a small output resistance and a large but finite gain A.',
  { title: 'What the Smart Valve Looks Like from Outside', mission: 'See how much the valve loads its source and how well it holds its output.', key: 'From the source side, an inverting valve looks like just the input pipe to a sea-level tap, so the source pushes into Rs. A non-inverting valve takes no water from its source. From the output side, an ideal valve holds its pressure no matter how thirsty the load is. A real valve has a little squeeze at its output and a very big but finite gain.', map: [['Input resistance', 'How much water it takes from the source'], ['Output Thevenin resistance', 'How much the output pressure sags under load'], ['Realistic model', 'Valve with small real-world flaws']] },
  [
    { t: 'num', tier: 1, gen() { const Rs = pick([1, 2, 5, 10]), Rf = pick([20, 50, 100]); return { q: 'An ideal inverting amplifier has ' + M('R_s = ' + Rs + ' kΩ') + ' and ' + M('R_f = ' + Rf + ' kΩ') + '. What input resistance does the source see?', unit: 'kΩ', a: Rs, tol: 0.02, hint: 'The inverting input is a virtual ground.', why: 'The source drives R<sub>s</sub> into a 0 V node, so R<sub>in</sub> = R<sub>s</sub> = ' + Rs + ' kΩ.' }; } },
    { t: 'choice', tier: 1, q: 'What input resistance does an ideal non-inverting amplifier present to its source?', opts: ['Infinite', 'R_s', 'R_f', 'Zero'], a: 0, hint: 'i_p = 0.', why: 'The source connects to the + input, which draws no current, so the input resistance is infinite.' },
    { t: 'choice', tier: 2, q: 'What is the Thevenin resistance seen at the output of an ideal op amp circuit?', opts: ['0 Ω, so the output does not depend on the load', 'R_f', 'Infinite', 'R_s'], a: 0, hint: 'An ideal op amp output acts like a perfect voltage source.', why: 'The ideal output is a voltage source set by the circuit, so R<sub>th</sub> = 0 and the load cannot change the output voltage (until the op amp saturates or runs out of current).' },
    { t: 'num', tier: 2, gen() { const Rf = pick([20, 50]), Rs = pick([5, 10]), vs = pick([0.2, 0.5]), RL = pick([1, 2, 5]); const vo = -Rf / Rs * vs; return { q: 'An ideal inverting amplifier has gain ' + M(-Rf / Rs) + ' and ' + M('v_s = ' + vs + ' V') + ', driving a ' + M(RL + ' kΩ') + ' load. How much current (mA) flows into the load, taking the output node as positive-current direction toward the load? Give the signed value.', unit: 'mA', a: vo / RL, tol: 0.02, hint: 'v_o does not depend on R_L. i_L = v_o/R_L.', why: 'v<sub>o</sub> = ' + fmt(vo, 3) + ' V regardless of the load. i<sub>L</sub> = ' + fmt(vo, 3) + '/' + RL + ' kΩ = ' + fmt(vo / RL, 4) + ' mA.' }; } },
    { t: 'choice', tier: 3, boss: true, q: 'Which list names the three main imperfections in the more realistic op amp model?', opts: ['Finite input resistance, nonzero output resistance, finite open-loop gain', 'Infinite input resistance, zero output resistance, infinite gain', 'Zero input resistance, infinite output resistance, zero gain', 'Negative gain, positive resistance, no supply'], a: 0, hint: 'Each ideal property gets a real-world limit.', why: 'A realistic op amp has a large but finite input resistance, a small nonzero output resistance, and a large but finite open-loop gain A.' },
    { t: 'num', tier: 3, q: 'Difference amp: ' + M('R_a = 10 kΩ') + ', ' + M('R_b = 100 kΩ') + ', ' + M('R_c = 33 kΩ') + ', ' + M('R_d = 47 kΩ') + ', ' + M('v_a = 670 mV') + ', ' + M('v_b = 800 mV') + '. The plus pin sits at v_p = v_b·R_d/(R_c+R_d). What resistance does the source v_a see (kΩ)?', unit: 'kΩ', a: 33.5, tol: 0.02, hint: 'v_n = v_p. Then i_a = (v_a − v_n)/R_a and R = v_a/i_a.', why: 'v_p = 0.8 × 47/80 = 0.47 V, i_a = (0.67 − 0.47)/10 k = 20 μA, so R = 0.67/20 μA = 33.5 kΩ. It is not just R_a, because v_n is held by the other input.' },
  ], ['R']);

/* ---------------------------------------------------------------- Comparators and Schmitt trigger */
LV(0, '7.7', 4, 'Comparators and the Schmitt Trigger', 'Comparators with a reference voltage, and hysteresis from positive feedback.',
  'A <b>comparator</b> has no negative feedback: its output goes to +V<sub>sat</sub> if v<sub>p</sub> &gt; v<sub>n</sub> and −V<sub>sat</sub> otherwise. Put a reference voltage on one input to choose the switching point. A <b>Schmitt trigger</b> adds <b>positive feedback</b>: it has two switching thresholds (<b>hysteresis</b>), so noise near a threshold does not make the output chatter. For the non-inverting Schmitt trigger with input resistor R₁ and feedback resistor R₂, the thresholds are <span class="m">±V<sub>sat</sub>·R₁/R₂</span>.',
  { title: 'A Valve That Snaps Open and Shut', mission: 'Build a valve that snaps one way or the other, and give it a dead zone so it does not flutter.', key: 'A comparator valve has no return pipe, so it slams fully open or fully shut depending on which tap reads higher. Set one tap to a reference level and it snaps when the other crosses it. A Schmitt trigger feeds some output back to push the valve further the way it is already going. It needs a bigger push to switch back, so ripples in the water do not make it flutter.', map: [['Comparator', 'Snaps to whichever tap reads higher'], ['Reference voltage', 'The level it snaps at'], ['Hysteresis', 'A dead zone between the two snap levels'], ['Positive feedback', 'Pushes the valve further the way it is already going']] },
  [
    { t: 'sort', tier: 1, q: 'A comparator’s non-inverting input is the signal, the inverting input is a 2 V reference, and the output swings between ±5 V. Sort each input signal by the output.', buckets: ['+5 V', '−5 V'], items: [['3 V', 0], ['1 V', 1], ['2.5 V', 0], ['−1 V', 1]], why: 'The output is +V<sub>sat</sub> when the signal is above the 2 V reference and −V<sub>sat</sub> when it is below.' },
    { t: 'choice', tier: 1, q: 'What does a Schmitt trigger have that a plain comparator does not?', opts: ['Hysteresis: two different switching thresholds', 'Negative feedback', 'Zero gain', 'Higher supply voltage'], a: 0, hint: 'It uses positive feedback.', why: 'Positive feedback gives two thresholds, one for the output rising and another for it falling, which is hysteresis.' },
    { t: 'choice', tier: 2, q: 'Why use a Schmitt trigger on a noisy signal that hovers near the switching level?', opts: ['The two thresholds stop the output from chattering', 'It amplifies the noise', 'It filters out DC', 'It lowers the supply current'], a: 0, hint: 'Noise would have to cross both thresholds.', why: 'Once the output flips, the threshold moves away, so small noise cannot flip it straight back. The output stays clean.' },
    { t: 'num', tier: 2, gen() { const Vs = pick([5, 10, 12]), R1 = pick([1, 2, 5]), R2 = pick([10, 20]); return { q: 'A non-inverting Schmitt trigger has ' + M('V_sat = ±' + Vs + ' V') + ', ' + M('R₁ = ' + R1 + ' kΩ') + ' (input) and ' + M('R₂ = ' + R2 + ' kΩ') + ' (feedback). Find the upper threshold voltage.', unit: 'V', a: Vs * R1 / R2, tol: 0.02, hint: 'V_T = V_sat · R₁ / R₂.', why: 'V<sub>T</sub> = ' + Vs + ' × ' + R1 + '/' + R2 + ' = ' + fmt(Vs * R1 / R2, 3) + ' V (and the lower threshold is its negative).' }; } },
    { t: 'num', tier: 3, boss: true, gen() { const Vs = pick([5, 10, 12]), R1 = pick([1, 2, 5]), R2 = pick([10, 20]); return { q: 'Same Schmitt trigger: ' + M('V_sat = ±' + Vs + ' V') + ', ' + M('R₁ = ' + R1 + ' kΩ') + ', ' + M('R₂ = ' + R2 + ' kΩ') + '. How wide is the hysteresis window (upper threshold minus lower threshold)?', unit: 'V', a: 2 * Vs * R1 / R2, tol: 0.02, hint: 'Thresholds are ±V_sat·R₁/R₂.', why: 'Window = 2 × ' + Vs + ' × ' + R1 + '/' + R2 + ' = ' + fmt(2 * Vs * R1 / R2, 3) + ' V.' }; } },
  ], ['R']);

/* ---------------------------------------------------------------- 23 */
LV(23, '8.1', 3, 'Inductors', 'v = L di/dt, energy, and what an inductor does at DC.',
  'An inductor’s voltage is set by how fast its current changes: <span class="m">v = L di/dt</span>. At <b>DC</b> (steady current) it looks like a <b>short</b>. Its current cannot jump. Stored energy: <span class="m">w = ½ L i²</span>. ELI the ICE man: in an inductor, voltage (E) leads current (I).',
  { title: 'The Heavy Water Wheel', mission: 'Discover why a heavy wheel resists changes in flow, but not steady flow.', key: 'An inductor is a heavy water wheel in the pipe. It takes a push to get it spinning and a push to stop it, so it fights sudden changes in flow. Once the flow is steady, the wheel just spins freely and the water passes: a short. A spinning wheel stores energy that comes back when it slows.', map: [['v = L di/dt', 'Push needed = wheel weight × change in flow'], ['DC', 'Steady flow: wheel spins freely, no push'], ['½Li²', 'Energy stored in the spinning wheel']] },
  [
    { t: 'choice', tier: 1, q: 'What does an inductor look like to a steady DC current?', opts: ['A short circuit', 'An open circuit', 'A resistor', 'A voltage source'], a: 0, hint: 'di/dt = 0, so v = 0.', why: 'Steady current means di/dt = 0, so v = 0 across the inductor: a short.' },
    { t: 'choice', tier: 1, q: 'Which quantity of an inductor cannot change instantly?', opts: ['Its current', 'Its voltage', 'Its inductance', 'Its power'], a: 0, hint: 'An instant jump in i would need infinite v.', why: 'v = L di/dt, so a sudden jump in current would need infinite voltage. Inductor current is continuous.' },
    { t: 'num', tier: 2, gen() { const L = pick([2, 5, 10]), di = pick([1, 2, 4]), dt = pick([0.5, 1, 2]); return { q: 'The current in a ' + M(L + ' H') + ' inductor rises steadily by ' + M(di + ' A') + ' in ' + M(dt + ' s') + '. What is the voltage across it?', unit: 'V', a: L * di / dt, tol: 0.02, hint: 'v = L · (di/dt).', why: 'v = ' + L + ' × ' + di + '/' + dt + ' = ' + fmt(L * di / dt, 3) + ' V.' }; } },
    { t: 'num', tier: 2, gen() { const L = pick([2, 4, 10]), i = pick([2, 3, 5]); return { q: 'A ' + M(L + ' H') + ' inductor carries ' + M(i + ' A') + '. How much energy is stored?', unit: 'J', a: 0.5 * L * i * i, tol: 0.02, hint: 'w = ½ L i².', why: 'w = ½ × ' + L + ' × ' + i + '² = ' + fmt(0.5 * L * i * i, 3) + ' J.' }; } },
    { t: 'num', tier: 3, boss: true, gen() { const L = pick([20, 50, 100]), i = pick([2, 4]), t = pick([0.01, 0.02]); return { q: 'A ' + M(L + ' mH') + ' inductor’s current drops from ' + M(i + ' A') + ' to 0 in ' + M(t * 1000 + ' ms') + ' at a steady rate. What is the magnitude of the voltage across it?', unit: 'V', a: L / 1000 * i / t, tol: 0.02, hint: 'v = L |di/dt|, with L in henries.', why: '|v| = ' + L / 1000 + ' × ' + i + '/' + t + ' = ' + fmt(L / 1000 * i / t, 2) + ' V. A sudden switch-off makes a big spike.' }; } },
  ], ['L']);

/* ---------------------------------------------------------------- 24 */
LV(24, '8.2', 3, 'Capacitors', 'i = C dv/dt, energy, and what a capacitor does at DC.',
  'A capacitor’s current is set by how fast its voltage changes: <span class="m">i = C dv/dt</span>. At <b>DC</b> it looks like an <b>open circuit</b>. Its voltage cannot jump. Stored energy: <span class="m">w = ½ C v²</span>. ICE: in a capacitor, current (I) leads voltage (E).',
  { title: 'The Stretchy Balloon Tank', mission: 'See why a balloon blocks steady pressure but passes quick changes.', key: 'A capacitor is a stretchy balloon tank across the pipe. A changing pressure pushes water in and out, so flow is felt. Once the balloon is full and the pressure steady, no more water moves: an open circuit. A stretched balloon stores energy.', map: [['i = C dv/dt', 'Flow = balloon size × change in pressure'], ['DC', 'Full balloon: no flow'], ['½Cv²', 'Energy in the stretched balloon']] },
  [
    { t: 'choice', tier: 1, q: 'What does a capacitor look like to a steady DC voltage?', opts: ['An open circuit', 'A short circuit', 'A resistor', 'A current source'], a: 0, hint: 'dv/dt = 0, so i = 0.', why: 'Steady voltage means dv/dt = 0, so i = 0: an open circuit.' },
    { t: 'choice', tier: 1, q: 'Which quantity of a capacitor cannot change instantly?', opts: ['Its voltage', 'Its current', 'Its capacitance', 'Its resistance'], a: 0, hint: 'An instant jump in v would need infinite i.', why: 'i = C dv/dt, so a sudden jump in voltage would need infinite current. Capacitor voltage is continuous.' },
    { t: 'num', tier: 2, gen() { const C = pick([2, 10, 100]), dv = pick([2, 5, 10]), dt = pick([2, 5, 10]); return { q: 'The voltage across a ' + M(C + ' μF') + ' capacitor rises steadily by ' + M(dv + ' V') + ' in ' + M(dt + ' ms') + '. Find the current (in mA).', unit: 'mA', a: C * dv / dt, tol: 0.02, hint: 'i = C dv/dt. μF/ms = mA/V.', why: 'i = ' + C + 'μF × ' + dv + '/' + dt + 'ms = ' + fmt(C * dv / dt, 3) + ' mA.' }; } },
    { t: 'num', tier: 2, gen() { const C = pick([10, 100, 1000]), v = pick([5, 12, 24]); return { q: 'A ' + M(C + ' μF') + ' capacitor is charged to ' + M(v + ' V') + '. How much energy (in mJ) is stored?', unit: 'mJ', a: 0.5 * C * 1e-6 * v * v * 1000, tol: 0.02, hint: 'w = ½ C v², with C in farads.', why: 'w = ½ × ' + C + 'e−6 × ' + v + '² = ' + fmt(0.5 * C * 1e-6 * v * v * 1000, 4) + ' mJ.' }; } },
    { t: 'sort', tier: 3, boss: true, q: 'Sort each fact into inductor or capacitor.', buckets: ['Inductor', 'Capacitor'], items: [['Current cannot change instantly', 0], ['Voltage cannot change instantly', 1], ['Short circuit at DC', 0], ['Open circuit at DC', 1], ['v = L di/dt', 0], ['i = C dv/dt', 1]], why: 'Inductor: continuous current, short at DC. Capacitor: continuous voltage, open at DC.' },
  ], ['C']);

/* ---------------------------------------------------------------- 25 */
LV(25, '8.3', 3, 'Combining Inductors and Capacitors', 'Series and parallel rules, and duality.',
  'Inductors combine like resistors: series adds, parallel is product over sum. Capacitors combine the <b>opposite</b> way: parallel adds, series is product over sum. This mirror image is called <b>duality</b>.',
  { title: 'Wheels and Balloons in Bundles', mission: 'Learn how bundled wheels and bundled balloons behave.', key: 'Wheels in a row add up their heaviness, like narrow pipes in a row. Balloons side by side add up their capacity, since there is more room to store water. Balloons in a row are like a stiffer, smaller balloon. Wheels and balloons are mirror images of each other.', map: [['Series L', 'Heaviness adds'], ['Parallel C', 'Room adds'], ['Series C', 'Stiffer: product over sum']] },
  [
    { t: 'match', tier: 1, q: 'Match each combination to its rule.', pairs: [['Inductors in series', 'L₁ + L₂'], ['Capacitors in parallel', 'C₁ + C₂'], ['Capacitors in series', 'C₁C₂/(C₁+C₂)'], ['Inductors in parallel', 'L₁L₂/(L₁+L₂)']], why: 'Inductors follow the resistor rules. Capacitors follow the inverse (conductance) rules.' },
    { t: 'num', tier: 1, gen() { const a = pick([2, 4, 6]), b = pick([3, 6, 10]); return { q: 'Two inductors, ' + M(a + ' mH') + ' and ' + M(b + ' mH') + ', are in series. Find L<sub>eq</sub> (mH).', unit: 'mH', a: a + b, tol: 0.02, hint: 'Series inductors add.', why: 'L<sub>eq</sub> = ' + a + ' + ' + b + ' = ' + (a + b) + ' mH.' }; } },
    { t: 'num', tier: 2, gen() { const a = pick([2, 4, 6]), b = pick([3, 6, 12]); return { q: 'Two capacitors, ' + M(a + ' μF') + ' and ' + M(b + ' μF') + ', are in parallel. Find C<sub>eq</sub> (μF).', unit: 'μF', a: a + b, tol: 0.02, hint: 'Parallel capacitors add.', why: 'C<sub>eq</sub> = ' + a + ' + ' + b + ' = ' + (a + b) + ' μF.' }; } },
    { t: 'num', tier: 2, gen() { const a = pick([3, 6, 12]), b = pick([6, 12, 4]); return { q: 'Two capacitors, ' + M(a + ' μF') + ' and ' + M(b + ' μF') + ', are in series. Find C<sub>eq</sub> (μF).', unit: 'μF', a: a * b / (a + b), tol: 0.02, hint: 'C₁C₂/(C₁+C₂).', why: 'C<sub>eq</sub> = ' + a + '×' + b + '/(' + a + '+' + b + ') = ' + fmt(a * b / (a + b), 3) + ' μF.' }; } },
    { t: 'num', tier: 3, boss: true, gen() { const a = pick([3, 6]), b = pick([6, 3]), c = pick([2, 4]), v = pick([10, 20]); const Ceq = a * b / (a + b) + c; return { q: 'A ' + M(a + ' μF') + ' and ' + M(b + ' μF') + ' capacitor in series sit in parallel with a ' + M(c + ' μF') + ' capacitor. Find C<sub>eq</sub> (μF).', unit: 'μF', a: Ceq, tol: 0.02, hint: 'Series pair first, then add in parallel.', why: 'Series: ' + fmt(a * b / (a + b), 3) + ' μF. Parallel with ' + c + ': ' + fmt(Ceq, 3) + ' μF.' }; } },
  ], ['L', 'C']);

LV(26, '9.1', 4, 'Mutual Inductance', 'Coupled coils, the dot convention and the coupling coefficient.',
  'Two coils that share magnetic flux are <b>coupled</b>. A changing current in one induces a voltage in the other through the <b>mutual inductance</b> M. The <b>dot convention</b> says the sign of the induced voltage. The coupling coefficient is <span class="m">k = M/√(L₁L₂)</span>, with <span class="m">0 ≤ k ≤ 1</span>.',
  { title: 'Wheels on the Same Shaft', mission: 'See how one spinning wheel can drag another through a shared shaft.', key: 'Two water wheels on shafts that nearly touch pull on each other. A change in flow through one drags the other and makes a push in its pipe. The coupling coefficient says how well the shafts are linked: 1 is locked together, 0 is not linked at all.', map: [['Mutual inductance M', 'How hard one wheel drags the other'], ['Coupling k', 'How well linked, 0 to 1'], ['Dots', 'Which way the drag pushes']] },
  [
    { t: 'choice', tier: 1, q: 'What is the allowed range of the coupling coefficient k?', opts: ['0 to 1', '0 to ∞', '−1 to 0', '1 to 10'], a: 0, hint: 'k = 1 means all flux links both coils.', why: '0 ≤ k ≤ 1. A value of 1 is perfect coupling; 0 means no mutual flux.' },
    { t: 'num', tier: 1, gen() { const L1 = pick([4, 9, 16]), L2 = pick([4, 9, 25]), k = pick([0.5, 0.8]); return { q: 'Two coils have ' + M('L₁ = ' + L1 + ' mH') + ', ' + M('L₂ = ' + L2 + ' mH') + ' and ' + M('k = ' + k) + '. Find M (mH).', unit: 'mH', a: k * Math.sqrt(L1 * L2), tol: 0.02, hint: 'M = k √(L₁L₂).', why: 'M = ' + k + ' × √(' + L1 + '×' + L2 + ') = ' + fmt(k * Math.sqrt(L1 * L2), 3) + ' mH.' }; } },
    { t: 'num', tier: 2, gen() { const L1 = pick([4, 9, 16]), L2 = pick([4, 9, 25]), Mu = pick([2, 3, 4]); const m = Math.min(Mu, Math.sqrt(L1 * L2) * 0.9); return { q: 'Two coils have ' + M('L₁ = ' + L1 + ' mH') + ', ' + M('L₂ = ' + L2 + ' mH') + ' and ' + M('M = ' + fmt(m, 2) + ' mH') + '. Find the coupling coefficient k.', unit: '', a: m / Math.sqrt(L1 * L2), tol: 0.02, hint: 'k = M / √(L₁L₂).', why: 'k = ' + fmt(m, 2) + '/√(' + L1 + '×' + L2 + ') = ' + fmt(m / Math.sqrt(L1 * L2), 3) + '.' }; } },
    { t: 'choice', tier: 2, q: 'What does the dot convention tell you?', opts: ['The polarity of the voltage induced by the other coil’s current', 'Which coil has more turns', 'The value of M', 'Whether the coils are in series'], a: 0, hint: 'Current entering the dotted end of one coil induces a voltage positive at the dotted end of the other.', why: 'A current entering the dotted terminal of one coil induces a voltage that is positive at the dotted terminal of the other. Dots fix the sign of the M terms in KVL.' },
    { t: 'choice', tier: 3, boss: true, q: 'Two coils share all their flux with no leakage. What is true of k and M?', opts: ['k = 1 and M = √(L₁L₂)', 'k = 0 and M = 0', 'k = 1 and M = L₁ + L₂', 'k = 2 and M = L₁L₂'], a: 0, hint: 'Use k = M/√(L₁L₂).', why: 'Perfect coupling means k = 1, so M = √(L₁L₂).' },
  ], ['L', 'L']);
