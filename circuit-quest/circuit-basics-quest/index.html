LV(27, '10.4, 11.1', 4, 'First-Order Circuits and Time Constants', 'RC and RL step responses, and the FIFE formula.',
  'In a circuit with one storage element, every voltage or current follows <b>FIFE</b>: <span class="m">x(t) = x(∞) + [x(0) − x(∞)] e^(−t/τ)</span> (Initial value, Final value, time constant). <span class="m">τ = RC</span> for an RC circuit and <span class="m">τ = L/R</span> for an RL circuit, where R is the Thevenin resistance seen by the element. An RC low-pass has cutoff <span class="m">f<sub>c</sub> = 1/(2πRC)</span>.',
  { title: 'Filling and Draining', mission: 'Time how long a balloon takes to fill through a narrow pipe.', key: 'A balloon filling through a narrow pipe starts fast and slows down as it fills. The time constant is how long it takes to get about two-thirds of the way. Bigger balloon or narrower pipe means slower. A heavy wheel does the same with flow.', map: [['τ = RC', 'Fill time: balloon size × squeeze'], ['τ = L/R', 'Spin-up time of the wheel'], ['Initial / final value', 'Where it starts / where it settles']] },
  [
    { t: 'num', tier: 1, gen() { const R = pick([1, 2, 5, 10]), C = pick([10, 100, 470]); return { q: 'An RC circuit has ' + M(R + ' kΩ') + ' and ' + M(C + ' μF') + '. Find τ (in ms).', unit: 'ms', a: R * C, tol: 0.02, hint: 'τ = RC. kΩ × μF = ms.', why: 'τ = ' + R + ' kΩ × ' + C + ' μF = ' + R * C + ' ms.' }; } },
    { t: 'num', tier: 1, gen() { const L = pick([10, 50, 100]), R = pick([2, 5, 10]); return { q: 'An RL circuit has ' + M(L + ' mH') + ' and ' + M(R + ' Ω') + '. Find τ (in ms).', unit: 'ms', a: L / R, tol: 0.02, hint: 'τ = L/R. mH/Ω = ms.', why: 'τ = ' + L + '/' + R + ' = ' + fmt(L / R, 3) + ' ms.' }; } },
    { t: 'order', tier: 2, q: 'Put the steps for a first-order switching problem in order.', items: ['Find the initial value just before the switch (inductor current or capacitor voltage)', 'Find the final value (inductor short, capacitor open at DC)', 'Find the Thevenin resistance seen by the storage element', 'Compute τ (RC or L/R)', 'Plug into x(t) = x(∞) + [x(0) − x(∞)]e^(−t/τ)'], why: 'Initial value, final value, effective resistance, τ, then the FIFE formula.' },
    { t: 'num', tier: 2, gen() { const x0 = pick([0, 2, 10]), xf = pick([5, 12]), tau = pick([1, 2, 5]); const v = xf + (x0 - xf) * Math.exp(-1); return { q: 'A voltage starts at ' + M(x0 + ' V') + ' and settles toward ' + M(xf + ' V') + ' with τ = ' + M(tau + ' ms') + '. What is it at t = τ?', unit: 'V', a: v, tol: 0.02, hint: 'x(τ) = x(∞) + [x(0) − x(∞)] e⁻¹.', why: 'x(τ) = ' + xf + ' + (' + x0 + ' − ' + xf + ') × 0.368 = ' + fmt(v, 3) + ' V.' }; } },
    { t: 'num', tier: 3, boss: true, gen() { const R = pick([1.6, 3.2, 8]), C = pick([0.1, 0.05]); const fc = 1 / (2 * Math.PI * R * 1000 * C * 1e-6); return { q: 'An RC low-pass filter has ' + M(R + ' kΩ') + ' and ' + M(C + ' μF') + '. Find the cutoff frequency f<sub>c</sub> (Hz).', unit: 'Hz', a: fc, tol: 0.03, hint: 'f_c = 1/(2πRC).', why: 'f<sub>c</sub> = 1/(2π × ' + R * 1000 + ' × ' + C * 1e-6 + ') = ' + fmt(fc, 1) + ' Hz.' }; } },
  ], ['R', 'C']);

LV(28, '11.2', 4, 'Switching Time and 5τ', 'How long “infinity” really takes, and unbounded responses.',
  'After a switch, the response gets within about <b>1% after 5τ</b> (e⁻⁵ ≈ 0.0067). If a second switch happens before then, the second interval starts from the value reached, not from the final value. In rare circuits with dependent sources, <span class="m">τ</span> can be <b>negative</b> and the response grows without bound.',
  { title: 'Is It Full Yet?', mission: 'Decide when the balloon counts as full, and what happens when the tap flips early.', key: 'A filling balloon never quite finishes, but after five time constants it is within a hair of full. If someone flips the tap sooner, the balloon starts its new journey from whatever level it had reached, not from full. A strange pipe system with a feedback pump can even make the level run away.', map: [['5τ', 'Practically full'], ['Switch early', 'New start = level reached'], ['Negative τ', 'Runaway growth']] },
  [
    { t: 'num', tier: 1, gen() { const tau = pick([2, 5, 10, 20]); return { q: 'A circuit has τ = ' + M(tau + ' ms') + '. After how many ms is it essentially settled (5τ)?', unit: 'ms', a: 5 * tau, tol: 0.02, hint: 'Multiply τ by 5.', why: '5τ = 5 × ' + tau + ' = ' + 5 * tau + ' ms.' }; } },
    { t: 'num', tier: 1, gen() { return { q: 'A capacitor charges from 0 V toward 10 V. How close is it to 10 V after 5τ, in percent of the final value?', unit: '%', a: 100 * (1 - Math.exp(-5)), tol: 0.01, hint: '1 − e⁻⁵.', why: '1 − e⁻⁵ ≈ 0.9933, about 99.3%.' }; } },
    { t: 'num', tier: 2, gen() { const Vf = pick([10, 12]), tau = pick([2, 5]), t = pick([1, 2]); const v = Vf * (1 - Math.exp(-t / tau)); return { q: 'A capacitor starts at 0 V and charges toward ' + M(Vf + ' V') + ' with τ = ' + M(tau + ' ms') + '. A switch flips at ' + M(t + ' ms') + '. What is the capacitor voltage at that instant?', unit: 'V', a: v, tol: 0.02, hint: 'v = V_f(1 − e^(−t/τ)).', why: 'v = ' + Vf + '(1 − e^(−' + t + '/' + tau + ')) = ' + fmt(v, 3) + ' V. This becomes the new initial value after the flip.' }; } },
    { t: 'choice', tier: 2, q: 'A capacitor’s voltage is continuous at a switch. What is the capacitor voltage <b>just after</b> the switch compared with just before?', opts: ['The same', 'Zero', 'Equal to the new final value', 'Double'], a: 0, hint: 'Capacitor voltage cannot jump.', why: 'Capacitor voltage cannot change instantly, so v(0⁺) = v(0⁻). Other voltages and currents can jump.' },
    { t: 'choice', tier: 3, boss: true, q: 'A circuit’s time constant comes out <b>negative</b>. What does the response do?', opts: ['It grows without bound', 'It decays quickly', 'It oscillates forever', 'It stays constant'], a: 0, hint: 'e^(−t/τ) with τ < 0.', why: 'With τ < 0, e^(−t/τ) grows. This unbounded response only appears in circuits with dependent sources that supply energy.' },
  ], ['R', 'C']);

LV(29, 'review', 5, 'RLC and Damping', 'α, ω₀, and the three kinds of response.',
  'A series RLC circuit has <span class="m">α = R/(2L)</span> and <span class="m">ω₀ = 1/√(LC)</span>. Compare them: <b>α &gt; ω₀</b> overdamped (two distinct real roots), <b>α = ω₀</b> critically damped (repeated root), <b>α &lt; ω₀</b> underdamped (complex roots, rings at <span class="m">ω<sub>d</sub> = √(ω₀² − α²)</span>). The characteristic equation is <span class="m">s² + (R/L)s + 1/(LC) = 0</span>.',
  { title: 'Wheel, Balloon and Pipe Together', mission: 'Put a wheel, a balloon and a narrow pipe on one line and see whether the water sloshes.', key: 'With a wheel and a balloon in the same line, water can slosh back and forth. A very narrow pipe smothers the sloshing (overdamped). A wide pipe lets it ring (underdamped). The point in between is critically damped. The comparison is between how much the pipe squeeze damps it and how fast the wheel and balloon want to swing.', map: [['α', 'How hard the pipe damps it'], ['ω₀', 'How fast it wants to swing'], ['Overdamped', 'No sloshing, slow'], ['Underdamped', 'Sloshes while settling']] },
  [
    { t: 'match', tier: 1, q: 'Match each damping type to its roots.', pairs: [['Overdamped', 'Two distinct real roots'], ['Critically damped', 'One repeated real root'], ['Underdamped', 'A complex pair']], extra: ['Imaginary only, no real part, always'], why: 'The discriminant α² − ω₀² decides: positive gives distinct real roots, zero gives a repeated root, negative gives a complex pair.' },
    { t: 'num', tier: 1, gen() { const R = pick([20, 40, 100]), L = pick([0.1, 0.2, 0.5]); return { q: 'A series RLC has ' + M('R = ' + R + ' Ω') + ' and ' + M('L = ' + L + ' H') + '. Find α.', unit: '1/s', a: R / (2 * L), tol: 0.02, hint: 'α = R/(2L).', why: 'α = ' + R + '/(2×' + L + ') = ' + fmt(R / (2 * L), 2) + ' s⁻¹.' }; } },
    { t: 'num', tier: 2, gen() { const L = pick([0.1, 0.4]), C = pick([10, 40, 100]); return { q: 'A series RLC has ' + M('L = ' + L + ' H') + ' and ' + M('C = ' + C + ' μF') + '. Find ω₀.', unit: 'rad/s', a: 1 / Math.sqrt(L * C * 1e-6), tol: 0.02, hint: 'ω₀ = 1/√(LC).', why: 'ω₀ = 1/√(' + L + ' × ' + C + 'e−6) = ' + fmt(1 / Math.sqrt(L * C * 1e-6), 1) + ' rad/s.' }; } },
    { t: 'choice', tier: 2, q: 'In a series RLC circuit, you increase R a lot while L and C stay fixed. What happens to the response?', opts: ['It moves toward overdamped', 'It moves toward underdamped', 'It stays the same', 'It becomes unbounded'], a: 0, hint: 'α = R/(2L) grows.', why: 'α grows with R while ω₀ is unchanged, so eventually α &gt; ω₀: overdamped.' },
    { t: 'choice', tier: 3, boss: true, gen() { const L = pick([0.1, 0.2, 0.5]), C = pick([10, 20, 100]); const w0 = 1 / Math.sqrt(L * C * 1e-6); const cases = [{ R: 2 * L * w0 * 2, t: 0 }, { R: 2 * L * w0 * 0.3, t: 2 }, { R: 2 * L * w0, t: 1 }]; const c = pick(cases); const R = Math.round(c.R * 10) / 10; const al = R / (2 * L); const lab = ['Overdamped', 'Critically damped', 'Underdamped']; const exact = Math.abs(al - w0) / w0 < 0.02 ? 1 : (al > w0 ? 0 : 2); return { q: 'A series RLC has ' + M('R = ' + R + ' Ω') + ', ' + M('L = ' + L + ' H') + ', ' + M('C = ' + C + ' μF') + '. (α = ' + fmt(al, 1) + ', ω₀ = ' + fmt(w0, 1) + '.) What kind of response is it?', opts: lab, a: exact, hint: 'Compare α with ω₀.', why: 'α = ' + fmt(al, 1) + ' and ω₀ = ' + fmt(w0, 1) + ', so the response is ' + lab[exact].toLowerCase() + '.' }; } },
  ], ['R', 'L', 'C']);

/* Teaching pages for Circuit Basics Quest. Each level has up to three lessons (warm-up, challenge, hard). They show before the questions. */
const F = x => '<div class="formula">' + x + '</div>';
const EX = (t, x) => '<div class="example"><b class="eh">' + t + '</b>' + x + '</div>';
const TRAP = x => '<div class="trap"><b class="eh">Watch out</b>' + x + '</div>';
const LEARN = (idx, topic, ls) => {
  const L = WATER_LEVELS[idx - 1];
  if (!L || L.topic !== topic) throw new Error('lesson/level mismatch at ' + idx + ': ' + (L && L.topic) + ' vs ' + topic);
  L.learn = { 1: ls[0], 2: ls[1], 3: ls[2] };
};

LEARN(1, 'Circuit Variables', [
 { t: 'What flows, what pushes, what it costs', h:
  '<p>A circuit is a path that electric <b>charge</b> can flow around. Charge is measured in <b>coulombs (C)</b>.</p>' +
  '<p><b>Current</b> is how fast the charge flows past a point. One <b>ampere (A)</b> means one coulomb passes every second.</p>' + F('i = dq/dt   (A = C/s)') +
  '<p><b>Voltage</b> is the push on the charge: how much energy each coulomb picks up or gives up. It is measured in <b>volts (V)</b>.</p>' +
  '<p><b>Power</b> is how fast energy is used, in <b>watts (W)</b>. <b>Energy</b> is measured in <b>joules (J)</b>.</p>' +
  '<p>Units to remember: current A, voltage V, power W, energy J, charge C.</p>' +
  EX('Example', 'A steady 5 A flows for 3 s. The charge that passed is q = i · t = 5 × 3 = <b>15 C</b>.'),
  a: 'Charge is the water. Current is gallons per second. Voltage is the pressure pushing the water. Power is how fast the water does work.' },
 { t: 'Power and energy', h:
  '<p>Power is voltage times current.</p>' + F('p = v · i      (W = V × A)') +
  '<p>Power is energy per second, so energy is power times time (when the power stays the same):</p>' + F('w = p · t      (J = W × s)') +
  EX('Example: energy', 'A 60 W lamp runs for 10 s. Energy = 60 × 10 = <b>600 J</b>.') +
  EX('Example: two very different events', 'A car starter draws 500 A for 2 s: q = 500 × 2 = 1,000 C. A lightning bolt carries 10,000 A for 0.1 s: q = 10,000 × 0.1 = 1,000 C. The charge is the <b>same</b>. The bolt just delivers it 20 times faster.'),
  a: 'A lightning bolt and a car starter move the same amount of water. The bolt pours it out in a tenth of a second.' },
 { t: 'When the current changes', h:
  '<p>If the current is not constant, split the time into pieces where it <b>is</b> constant. Find the charge in each piece with q = i · t, then add them up.</p>' +
  EX('Example', '2 A for 3 s, then 1 A for 4 s. Charge = (2 × 3) + (1 × 4) = 6 + 4 = <b>10 C</b>.') +
  '<p>The same trick works for energy when power changes: add up p · t for each piece.</p>',
  a: 'Count the gallons that went by during each stretch, then add the stretches together.' }
]);

LEARN(2, 'Power and the Passive Sign Convention', [
 { t: 'Does a part use power or give it?', h:
  '<p>Every part in a circuit either <b>absorbs</b> power (uses it up, like a lamp or a resistor) or <b>delivers</b> power (supplies it, like a battery).</p>' +
  '<p>To tell which, draw the current arrow so it <b>enters the + end</b> of the part. This is the <b>passive sign convention</b>. Then:</p>' + F('p = v · i') +
  '<ul><li>If <b>p is positive</b>, the part <b>absorbs</b> power.</li><li>If <b>p is negative</b>, the part <b>delivers</b> power.</li></ul>' +
  EX('Example', 'Current of 2 A enters the + end of a part with 4 V across it: p = 4 × 2 = +8 W. The part absorbs 8 W. If the current is −2 A instead, p = −8 W and the part is delivering power.'),
  a: 'A part that drinks water has positive power. A pump that pushes water out has negative power.' },
 { t: 'When the arrow points the other way', h:
  '<p>The rule p = v · i only works if the current arrow enters the <b>+</b> terminal.</p>' +
  '<p>If the current arrow enters the <b>− terminal</b> instead, write the formula with a minus sign:</p>' + F('p = −v · i') +
  EX('Example', 'v = 5 V and i = 3 A, but the arrow enters the − end. Then p = −(5)(3) = −15 W. The part delivers 15 W.') +
  TRAP('A negative answer is not a mistake. It tells you the part is delivering power.'),
  a: 'Check which way the water enters the part before deciding whether it is drinking or pumping.' },
 { t: 'Power always balances', h:
  '<p>In a whole circuit, the power delivered by the sources equals the power absorbed by everything else. Nothing is created or lost. This is a handy way to check your work.</p>' + F('power delivered = power absorbed') +
  EX('Example', 'Two parts absorb 20 W and 30 W. One source supplies all the power. It must deliver 20 + 30 = <b>50 W</b>.'),
  a: 'All the water pumped in is used somewhere. The total pumped equals the total drunk.' }
]);

LEARN(3, 'Sources and Ohm’s Law', [
 { t: 'Sources and resistors', h:
  '<p>A <b>voltage source</b> keeps its voltage fixed no matter what you connect. A <b>current source</b> keeps its current fixed. These are called <i>ideal</i> sources.</p>' +
  '<p>Some sources are <b>dependent</b>: their value is set by a voltage or current somewhere else in the circuit. There are four kinds, named by what controls them and what they make: <b>VCVS</b> (voltage controls a voltage source), <b>CCVS</b> (current controls a voltage source), <b>VCCS</b> (voltage controls a current source), <b>CCCS</b> (current controls a current source).</p>' +
  '<p>A <b>resistor</b> limits the current. <b>Ohm’s law</b> says the voltage across it equals the current times its resistance R (in ohms, Ω):</p>' + F('v = R · i') +
  EX('Example', 'A 470 Ω resistor carries 10 mA (0.01 A). v = 470 × 0.01 = <b>4.7 V</b>. Remember to change mA into A.') +
  TRAP('Two different ideal voltage sources cannot sit in parallel, and two different ideal current sources cannot sit in series. They would disagree with each other.'),
  a: 'A voltage source is a pump that holds the pressure steady. A current source is a pump that holds the flow steady. A resistor is a narrow pipe.' },
 { t: 'Resistor power and the color code', h:
  '<p>A resistor turns electrical energy into heat. Its power can be written three ways:</p>' + F('p = v·i = i²R = v²/R') +
  EX('Example', '12 V across a 100 Ω resistor: p = 12² / 100 = <b>1.44 W</b>.') +
  '<p><b>Resistor color code.</b> Bands tell you the value. For a 4-band resistor: the first two bands are digits, the third is the number of zeros (a power of ten), the last is the tolerance.</p>' +
  '<p>Digits: black 0, brown 1, red 2, orange 3, yellow 4, green 5, blue 6, violet 7, grey 8, white 9. Gold tolerance is 5%.</p>' +
  EX('Example', 'brown, red, brown, gold = 1, 2, then ×10¹ = <b>120 Ω</b>, 5%.'),
  a: 'The narrow pipe warms up from the squeeze. A narrower pipe (higher R) wastes more pressure.' },
 { t: 'Power ratings', h:
  '<p>Every resistor has a <b>power rating</b>, the most power it can safely turn into heat (for example 0.25 W). If you pass the rating, it overheats.</p>' +
  '<p>Since p = v²/R, the largest safe voltage is found by solving for v:</p>' + F('v_max = √(P · R)') +
  EX('Example', 'A 100 Ω resistor rated 0.25 W: v_max = √(0.25 × 100) = √25 = <b>5 V</b>.'),
  a: 'A narrow pipe can only carry so much squeeze before it gets too hot. The rating is that limit.' }
]);

LEARN(4, 'Kirchhoff’s Laws', [
 { t: 'Two rules that always hold', h:
  '<p>A <b>node</b> is a point where parts join. A <b>loop</b> is a closed path around the circuit.</p>' +
  '<p><b>KCL (Kirchhoff’s Current Law):</b> the currents at any node add up to zero. In other words, what flows into a node flows out.</p>' +
  '<p><b>KVL (Kirchhoff’s Voltage Law):</b> go around any closed loop and the voltages add up to zero. Rises (like a battery) equal drops (like resistors).</p>' +
  EX('KCL example', 'At a node, 5 A and 2 A flow in, and 3 A flows out on one wire. The last wire must carry out 5 + 2 − 3 = <b>4 A</b>.'),
  a: 'KCL: water going into a pipe junction must come out. KVL: go all the way around a ring of pipe and the pressure you gain equals the pressure you lose.' },
 { t: 'Using KVL', h:
  '<p>To use KVL, pick a loop and add the voltage rises and drops. If a source rises by 12 V, the drops must total 12 V.</p>' +
  EX('Example', 'A 12 V source drives three resistors in series. The first two drop 4 V and 3 V. The third drops 12 − 4 − 3 = <b>5 V</b>.') +
  '<p>KVL works around <b>any</b> closed loop, even one that crosses a gap in the wire. If a wire is broken, no current flows, so the resistors drop 0 V, and the full source voltage appears across the gap.</p>',
  a: 'Even a gap in the pipe belongs to the ring. If no water flows, the whole pressure difference shows up across the gap.' },
 { t: 'Putting the laws together', h:
  '<p>Combine Ohm’s law with KVL to solve a single loop. In a series loop, the same current flows through everything.</p>' + F('i = V_source / (R₁ + R₂)') +
  EX('Example', '18 V source, 100 Ω and 200 Ω in series. i = 18 / 300 = 0.06 A. Voltage across the 200 Ω = 0.06 × 200 = <b>12 V</b>.'),
  a: 'One ring of pipe has one flow. Divide the pump pressure by the total squeeze to get the flow.' }
]);

LEARN(5, 'Kirchhoff with Dependent Sources', [
 { t: 'A source that reads a gauge', h:
  '<p>A <b>dependent source</b> has a value set by a voltage or current elsewhere. Example: a voltage source worth 3·i volts, where i is the current in the loop.</p>' +
  '<p>You use KVL and KCL exactly the same way. The only new step: write the dependent source’s value in terms of the control variable, then solve for that variable.</p>',
  a: 'A dependent source is a pump whose strength is set by a gauge somewhere else. The rules for junctions and rings do not change.' },
 { t: 'Example: one loop', h:
  '<p>A 12 V source drives a 2 Ω resistor, and a dependent voltage source of 3·i opposes it (i is the loop current).</p>' +
  EX('KVL', '12 = 2·i + 3·i = 5·i, so i = 12/5 = <b>2.4 A</b>.') +
  '<p>The opposing source acts just like a 3 Ω resistor here, because its voltage is proportional to the current.</p>',
  a: 'The controlled pump pushes back in proportion to the flow, like extra squeeze.' },
 { t: 'Example: KCL with a controlled current source', h:
  '<p>A node receives 9 A. It leaves through a resistor branch carrying i_x, and through a dependent current source of 2·i_x.</p>' +
  EX('KCL', '9 = i_x + 2 i_x = 3 i_x, so i_x = <b>3 A</b>.') +
  '<p>To find the power a part absorbs, find its voltage and current, then use p = v·i with the passive sign convention.</p>',
  a: 'Count the water in and out of the junction, including the controlled pump.' }
]);

LEARN(6, 'Combining Resistors', [
 { t: 'Series and parallel', h:
  '<p>Two parts are in <b>series</b> if the same current flows through both (one after the other). They are in <b>parallel</b> if they connect across the same two nodes (same voltage).</p>' +
  '<p><b>Series:</b> resistances add.</p>' + F('R_eq = R₁ + R₂ + …') +
  '<p><b>Parallel:</b> the reciprocals add. For two resistors:</p>' + F('R_eq = R₁R₂ / (R₁ + R₂)') +
  EX('Example', '30 Ω in parallel with 60 Ω: (30 × 60)/(30 + 60) = 1800/90 = <b>20 Ω</b>.'),
  a: 'Pipes in a row add their squeeze. Pipes side by side give the water extra paths, so the squeeze goes down.' },
 { t: 'Parallel is always smaller', h:
  '<p>More paths mean less total resistance. So the parallel combination is always <b>smaller than the smallest branch</b>.</p>' +
  EX('Check', '100 Ω ∥ 400 Ω = 40000/500 = 80 Ω, smaller than 100 Ω.') +
  '<p>Shortcut: N equal resistors R in parallel give R/N.</p>',
  a: 'Open another side pipe and the water finds it easier to get through.' },
 { t: 'Reduce step by step', h:
  '<p>For a bigger network, start at the far end from the source. Combine the parts that are clearly series or parallel, redraw, and repeat.</p>' +
  EX('Example', '10 Ω in series with the parallel pair 30 Ω and 60 Ω. First 30 ∥ 60 = 20 Ω. Then 10 + 20 = <b>30 Ω</b>.'),
  a: 'Merge the side pipes first, then add the pipes in a row.' }
]);

LEARN(7, 'Voltage and Current Dividers', [
 { t: 'Splitting the voltage', h:
  '<p>Two resistors in series share the source voltage in proportion to their size. The bigger resistor gets the bigger share.</p>' + F('v₂ = v_s · R₂ / (R₁ + R₂)') +
  EX('Example', '12 V across 1 kΩ and 3 kΩ in series. The voltage across the 3 kΩ is 12 × 3/(1 + 3) = <b>9 V</b>.') +
  '<p>A <b>potentiometer</b> is a divider you can slide. With the wiper at a fraction α of the way up, the output is α · v_s.</p>',
  a: 'Pressure is shared along a row of pipes in proportion to their squeeze.' },
 { t: 'Splitting the current, and loading', h:
  '<p>Two resistors in <b>parallel</b> share the current. The <b>smaller</b> resistor gets the <b>bigger</b> share:</p>' + F('i₁ = i · R₂ / (R₁ + R₂)') +
  '<p>Notice that R₂ is on top for i₁. The current through one branch uses the <i>other</i> resistor on top.</p>' +
  EX('Example', '12 A into 2 Ω ∥ 6 Ω. The current in the 2 Ω is 12 × 6/8 = <b>9 A</b>, and the 6 Ω gets 3 A.') +
  '<p><b>Loading:</b> if you connect a load across a divider’s output, the load is in parallel with the bottom resistor, so the output drops.</p>',
  a: 'Water prefers the wide pipe. A thirsty tap added at the output pulls pressure down.' },
 { t: 'A loaded divider', h:
  '<p>To find the output with a load R_L, first combine the bottom resistor with the load, then apply the divider formula.</p>' + F('R₂ ∥ R_L = R₂R_L / (R₂ + R_L)') +
  EX('Example', '10 V, R₁ = 10 kΩ, R₂ = 10 kΩ, load 10 kΩ. R₂ ∥ R_L = 5 kΩ. Output = 10 × 5/(10 + 5) = <b>3.33 V</b>, not the unloaded 5 V.'),
  a: 'Add the side pipe to the bottom pipe first, then split the pressure.' }
]);

LEARN(8, 'Bridges and Delta–Wye', [
 { t: 'The bridge', h:
  '<p>A <b>bridge</b> is two resistor legs side by side with a fifth resistor across the middle. The legs are R₁ (top) over R₂ (bottom) on the left, and R₃ over R₄ on the right.</p>' +
  '<p>The bridge is <b>balanced</b> when the two legs divide the voltage the same way:</p>' + F('R₁ R₄ = R₂ R₃') +
  '<p>If it is balanced, the two middle points sit at the same voltage, so <b>no current flows</b> through the middle resistor. You can delete it.</p>' +
  EX('Example', 'R₁ = 4k, R₂ = 3k, R₃ = 20k, R₄ = 15k. 4 × 15 = 60 and 3 × 20 = 60. Balanced!'),
  a: 'If both middle taps have the same pressure, no water crosses the bridge pipe.' },
 { t: 'Triangles and stars', h:
  '<p>A <b>Δ (delta)</b> is three resistors in a triangle. A <b>Y (wye)</b> is three resistors meeting at a hub. Seen from outside, a Δ and a Y can behave the same, so you can swap one for the other.</p>' +
  '<p><b>Δ to Y:</b> each Y resistor is the product of the two Δ resistors beside that corner, divided by the sum of all three:</p>' + F('R₁ = R_b R_c / (R_a + R_b + R_c)') +
  '<p>If all three are equal: <b>R_Y = R_Δ / 3</b> and <b>R_Δ = 3 R_Y</b>.</p>' +
  EX('Example', 'Three 60 Ω in a Δ become three 20 Ω in a Y.'),
  a: 'A triangle of pipes can be swapped for a star of pipes that feels the same from outside.' },
 { t: 'Solving a balanced bridge', h:
  '<p>With a balanced bridge, ignore the middle resistor. Two parallel legs are left: the <b>left leg</b> R₁ + R₂ and the <b>right leg</b> R₃ + R₄.</p>' + F('R_eq = (R₁ + R₂) ∥ (R₃ + R₄)') +
  EX('Example', 'R₁ = 10, R₂ = 20, R₃ = 20, R₄ = 40 (all Ω). Balanced: 10 × 40 = 400 and 20 × 20 = 400. Left leg = 30 Ω, right leg = 60 Ω, so R_eq = 30 ∥ 60 = <b>20 Ω</b>.') +
  '<p>If a current source feeds the bridge, split its current between the two legs with the current divider rule.</p>',
  a: 'With no flow in the middle pipe, you just have two pipe paths side by side.' }
]);

LEARN(9, 'Measuring Voltage and Current', [
 { t: 'Meters and how to connect them', h:
  '<p>A <b>voltmeter</b> measures the voltage <i>across</i> a part, so you connect it <b>in parallel</b> with that part. A good voltmeter draws almost no current, so an ideal one has <b>infinite resistance</b>.</p>' +
  '<p>An <b>ammeter</b> measures the current <i>through</i> a part, so you connect it <b>in series</b>, in the path of the current. A good ammeter drops almost no voltage, so an ideal one has <b>zero resistance</b>.</p>' +
  '<p>Real analog meters use a small coil (a d’Arsonval movement). It has an internal resistance R_m and a full-scale current i_m, the current that swings the needle all the way.</p>' + F('R_m = v_m / i_m') +
  EX('Example', 'A movement that reads full scale at 163 mV and 1 mA has R_m = 0.163 V / 0.001 A = <b>163 Ω</b>.') +
  TRAP('A real voltmeter with finite resistance sits in parallel with the part and pulls the reading down. This is called loading.'),
  a: 'A pressure gauge taps across a pipe and should take no water. A flow meter sits in the pipe and should not squeeze it.' },
 { t: 'Making a bigger voltmeter or ammeter', h:
  '<p><b>Bigger voltage range:</b> add a resistor R_v <b>in series</b> with the movement so that only i_m flows at the new full-scale voltage V:</p>' + F('R_v = V / i_m − R_m') +
  EX('Example', 'Movement 1 mA, 100 Ω, want 10 V full scale. Total resistance = 10 V / 1 mA = 10,000 Ω. Subtract 100 Ω: R_v = <b>9,900 Ω</b>.') +
  '<p><b>Bigger current range:</b> add a <b>shunt</b> resistor R_A <b>in parallel</b> with the movement. Most of the current goes through the shunt. The movement and shunt share the same voltage (v_m = i_m × R_m).</p>' + F('R_A = v_m / (I − i_m)') +
  EX('Example', 'Movement 100 mV and 2 mA. To read 50 mA full scale, the shunt carries 48 mA at 0.1 V: R_A = 0.1/0.048 = <b>2.08 Ω</b>.'),
  a: 'To read bigger flow, add a bypass pipe beside the meter so most of the water goes around it.' },
 { t: 'What a meter really reads', h:
  '<p>When a voltmeter with resistance R_V is placed across a resistor R, they are in parallel. Combine them first, then use the divider formula to find what the meter reads.</p>' +
  EX('Example', '10 V source, two 10 kΩ resistors in series, a 20 kΩ voltmeter across the second. R ∥ R_V = 10 × 20 / 30 = 6.67 kΩ. Reading = 10 × 6.67/(10 + 6.67) = <b>4.0 V</b>, below the true 5 V.') +
  '<p>Shunt check: the largest current an ammeter reads is i_m plus the current in the shunt. Movement 1 mA, 100 Ω, shunt 5 Ω: the movement drops 0.1 V, the shunt carries 0.1/5 = 20 mA, total <b>21 mA</b>.</p>',
  a: 'The meter drinks a little water, so the reading is slightly off.' }
]);

LEARN(10, 'Node Voltage Analysis', [
 { t: 'Naming the pressure at every junction', h:
  '<p>A <b>node</b> is a point where parts join. An <b>essential node</b> is one where <b>three or more</b> parts join.</p>' +
  '<p>In <b>node voltage analysis (NVA)</b> you choose one node as the <b>reference</b> (0 V, like sea level). Every other essential node gets a voltage name. Then you write KCL at each of them.</p>' +
  '<p>If a circuit has N essential nodes, you write <b>N − 1</b> equations (the reference needs none).</p>' +
  '<p>The current from node A to node B through a resistor R is:</p>' + F('i = (v_A − v_B) / R'),
  a: 'Pick one junction as sea level. Give every other junction a pressure number. Flow goes from high pressure to low pressure.' },
 { t: 'Writing and solving KCL', h:
  '<p>At each node, add the currents leaving through every resistor and set the total equal to the sources.</p>' +
  EX('Example', 'A node v connects to a 10 V source through 2 Ω, to ground through 4 Ω, and has a 4 A source pushing in. KCL (currents leaving = currents arriving): (v − 10)/2 + v/4 = 4. Multiply by 4: 2v − 20 + v = 16, so 3v = 36 and <b>v = 12 V</b>.') +
  '<p>Steps: choose the reference, label the node voltages, write KCL at each essential node, solve, then compute whatever else you need (currents, power).</p>',
  a: 'At each junction the water in equals the water out.' },
 { t: 'A node held by a source', h:
  '<p>If a voltage source connects a node straight to the reference, that node’s voltage is simply known. You do not need a KCL equation for it. That saves work.</p>' +
  EX('Example', 'The middle node is held at 10 V by a source. It connects through 2 Ω to a right node with 3 Ω to ground and a 4 A source pushing in. KCL at the right node: (10 − v)/2 + 4 = v/3. Multiply by 6: 30 − 3v + 24 = 2v, so v = 54/5 = <b>10.8 V</b>.') +
  '<p>For several nodes, write the equations as a matrix <b>G·V = I</b>: G holds conductances (1/R), V the unknown voltages, I the source currents. Pick the reference at the node with the most sources attached to shorten the work.</p>',
  a: 'A pump that fixes the pressure at a junction means you already know that pressure.' }
]);

LEARN(11, 'Supernodes', [
 { t: 'A voltage source between two nodes', h:
  '<p>Sometimes a voltage source sits between two nodes and neither is the reference. The current through the source is unknown, so you cannot write KCL at either node on its own.</p>' +
  '<p>The fix is a <b>supernode</b>: draw one boundary around both nodes and the source. Write one KCL for the whole supernode (current leaving = 0). Then use the source as the second equation, the <b>constraint</b>:</p>' + F('v_A − v_B = V_s') +
  '<p>This works for dependent voltage sources too.</p>',
  a: 'A pump that holds a fixed pressure gap between two junctions ties them together. Circle both and balance the water into the whole circle.' },
 { t: 'Reading the constraint', h:
  '<p>Look at the source polarity. If the + terminal faces node A and the − terminal faces node B, then v_A is higher than v_B by the source value.</p>' +
  EX('Example', 'A 6 V source with + at node a and − at node b. Node b is at 2 V. Then v_a = 2 + 6 = <b>8 V</b>.') +
  '<p>When to use a supernode: a floating voltage source between two non-reference nodes. If the source is between a node and the reference, that node’s voltage is just known and no supernode is needed.</p>',
  a: 'The pump’s direction tells you which junction has the higher pressure.' },
 { t: 'Solving a supernode circuit', h:
  '<p>Steps: (1) box the supernode, (2) write KCL for the box, (3) write the constraint, (4) solve both equations.</p>' +
  EX('Example', 'Node a goes to ground through 2 Ω, node b through 4 Ω, a 2 V source has + at a, and a 6 A source pushes into node a. Constraint: v_a = v_b + 2. KCL on the box: v_a/2 + v_b/4 = 6. Substitute: (v_b + 2)/2 + v_b/4 = 6, so 0.75 v_b = 5, v_b = <b>6.67 V</b>.'),
  a: 'One flow balance for the circle, and the pump gives the extra rule.' }
]);

LEARN(12, 'Mesh Current Analysis', [
 { t: 'A stream around each loop', h:
  '<p>A <b>mesh</b> is a loop with no other loop inside it. In <b>mesh current analysis (MCA)</b>, you imagine a current going <b>clockwise</b> around each mesh. Then you write KVL around each mesh.</p>' +
  '<p>If a resistor is shared by two meshes, its current is the <b>difference</b> of the two mesh currents, because they run in opposite directions through it.</p>' + F('v across shared R = R · (i₁ − i₂)') +
  '<p>Number of meshes in a flat circuit: <b>branches − nodes + 1</b>.</p>',
  a: 'Picture a separate stream running clockwise around each loop. A pipe shared by two loops carries the difference of the two streams.' },
 { t: 'Writing the equations', h:
  '<p>For each mesh: add the resistor drops (own current times each resistor, plus the shared resistor times the difference) and set them equal to the source rises.</p>' +
  EX('Example', 'Mesh a: 1 V source, 3 Ω, and a shared 3 Ω. Mesh b: 6 Ω, a shared 3 Ω, and a 3 V source opposing. The equations are 6 i_a − 3 i_b = 1 and −3 i_a + 9 i_b = −3. Solving gives i_b = −1/3 A and <b>i_a = 0</b>.') +
  '<p>A negative answer just means the real current runs counter-clockwise.</p>',
  a: 'Each loop gets its own stream and its own pressure-lap rule.' },
 { t: 'A current source on the edge', h:
  '<p>If a current source is on an outside edge of a mesh (it belongs to only that one mesh), the mesh current is simply that source’s value. You get one answer for free and skip the KVL for that mesh.</p>' +
  EX('Example', 'Two meshes. The right mesh has a 2 A source on its outer edge, so i_b = 2 A (or −2 A, depending on its arrow). Only the left mesh needs a KVL equation.') +
  '<p>Elimination: 3 meshes with two known mesh currents leaves just one KVL equation to solve.</p>' +
  '<p>Mesh vs node: the mesh current equals the branch current only in a branch that belongs to one mesh.</p>',
  a: 'A flow pump on the outside pipe fixes the stream in that loop.' }
]);

LEARN(13, 'Supermeshes', [
 { t: 'A current source shared by two meshes', h:
  '<p>If a current source sits on the wall shared by two meshes, you do not know the voltage across it, so you cannot write KVL around either mesh alone.</p>' +
  '<p>Merge the two meshes into a <b>supermesh</b>. Write KVL around the outer edge of the merged loop, skipping the source branch. Then add one <b>constraint</b> equation from the source:</p>' + F('i₂ − i₁ = I_s') +
  '<p>The sign comes from which way the source arrow points.</p>',
  a: 'A flow pump on the shared pipe holds a fixed flow difference. Run the pressure lap around the outer edge and use the fixed flow as the extra rule.' },
 { t: 'The steps', h:
  '<ol><li>Spot the current source shared by two meshes.</li><li>Write the constraint (mesh current difference = source value).</li><li>Write KVL around the outside of the supermesh.</li><li>Write KVL for any other meshes.</li><li>Solve.</li></ol>' +
  EX('Example', 'Left mesh: 12 V source and 2 Ω. Right mesh: 4 Ω. A 3 A source on the shared wall gives i₂ = i₁ + 3. Supermesh KVL: 12 = 2 i₁ + 4 i₂. Substitute: 12 = 2 i₁ + 4 i₁ + 12, so i₁ = <b>0</b> and i₂ = 3 A.'),
  a: 'Merge the loops, lap the outside, and let the pump supply the second rule.' },
 { t: 'Which tool when', h:
  '<p>A quick map:</p><ul><li>Current source on an <b>outer</b> branch of one mesh: that mesh current equals the source. No supermesh.</li><li>Current source <b>shared</b> by two meshes: supermesh.</li><li>Voltage source between two non-reference nodes (in node analysis): supernode.</li></ul>' +
  '<p>The supermesh and the supernode solve the same kind of problem from opposite sides.</p>',
  a: 'A flow pump in the middle merges two loops. A pressure pump between two junctions merges those junctions.' }
]);

LEARN(14, 'Node Voltage or Mesh Current?', [
 { t: 'Two methods, pick the cheaper one', h:
  '<p>Node analysis (NVA) and mesh analysis (MCA) both solve any flat circuit. Pick the one that needs <b>fewer equations</b>.</p>' +
  '<p><b>Step 1: deactivate the independent sources.</b> A voltage source becomes a <b>short circuit</b> (a plain wire). A current source becomes an <b>open circuit</b> (a break).</p>' +
  '<p><b>Step 2:</b> count what is left: the essential nodes <b>n</b> (junctions of three or more parts) and the essential meshes <b>m</b> (loops with no loop inside).</p>',
  a: 'First shut off the pumps: a pressure pump becomes a plain pipe, a flow pump becomes a capped pipe. Then count junctions and loops.' },
 { t: 'The rule', h:
  '<p>NVA needs <b>n − 1</b> equations. MCA needs <b>m</b> equations. Compare:</p>' +
  '<ul><li>If <b>n − 1 &lt; m</b>, use <b>NVA</b>.</li><li>If <b>m &lt; n − 1</b>, use <b>MCA</b>.</li><li>If they are equal, use whichever needs fewer <b>constraint</b> equations (this matters when there are dependent sources).</li></ul>' +
  EX('Worked example', 'A 10 A source, 30 Ω, 8 Ω, 5.2 Ω, 12 Ω, a 500 V source and a 1 V source. After deactivating, the 500 V and 1 V sources are wires and the 10 A source is open. That leaves n = 2 essential nodes, so n − 1 = 1 equation, and m = 3 meshes. Since 1 &lt; 3, use <b>NVA</b>.'),
  a: 'Junction equations versus loop equations. Take the shorter list.' },
 { t: 'Try it', h:
  '<p>Count carefully after deactivation: wires from shorted voltage sources can merge nodes together, and opened current sources remove branches.</p>' +
  '<p>The number of equations you actually write is the smaller of <b>n − 1</b> and <b>m</b>.</p>' + F('equations = min(n − 1, m)'),
  a: 'Count, compare, and choose.' }
]);

LEARN(15, 'Sinusoids and Phasors', [
 { t: 'Sine waves and their numbers', h:
  '<p>Wall power and signals are <b>sinusoids</b>: smooth waves that repeat. A wave is described by its <b>frequency f</b> (cycles per second, in hertz, Hz) and its <b>period T</b>, the time for one cycle.</p>' + F('T = 1/f') +
  '<p>The <b>angular frequency</b> ω (radians per second) counts how fast the wave spins around a circle:</p>' + F('ω = 2πf') +
  EX('Example', '60 Hz: T = 1/60 s = 16.7 ms and ω = 2π × 60 = 377 rad/s.'),
  a: 'AC is a piston pushing water back and forth. The frequency is how many pushes per second.' },
 { t: 'Phasors: a wave as an arrow', h:
  '<p>A wave <b>A cos(ωt + φ)</b> has an amplitude A and a phase (timing offset) φ. Once the frequency is fixed, those two numbers say everything. Write them as one complex number called a <b>phasor</b>:</p>' + F('A cos(ωt + φ)  →  A∠φ') +
  '<p>A complex number can be written two ways. <b>Polar</b>: A∠φ (size and angle). <b>Rectangular</b>: a + jb, where j = √(−1).</p>' + F('a = A cos φ      b = A sin φ') +
  EX('Example', '10∠30° has a = 10 cos 30° = 8.66 and b = 10 sin 30° = 5, so it is 8.66 + j5.'),
  a: 'A phasor is a snapshot: how big the wave is and how far its timing is shifted.' },
 { t: 'Back to polar', h:
  '<p>To go from rectangular a + jb to polar, use the Pythagorean rule for the size and the arctangent for the angle:</p>' + F('A = √(a² + b²)      φ = atan(b / a)') +
  EX('Example', '3 + j4: A = √(9 + 16) = <b>5</b>, φ = atan(4/3) = 53.1°.') +
  '<p>Sines convert to cosines by a 90° shift: sin x = cos(x − 90°).</p>',
  a: 'Combine the two sideways and upward pushes to get the real size of the push.' }
]);

LEARN(16, 'Impedance', [
 { t: 'Push-back that depends on speed', h:
  '<p><b>Impedance (Z)</b> is the AC version of resistance. It tells you how hard a part resists a sine wave at a given frequency. In phasor form, voltage and current obey <b>V = Z · I</b>.</p>' +
  '<ul><li>Resistor: <b>Z = R</b></li><li>Inductor (coil): <b>Z = jωL</b></li><li>Capacitor: <b>Z = 1/(jωC)</b></li></ul>' +
  '<p>Series impedances add. Parallel impedances combine like resistors.</p>',
  a: 'A narrow pipe resists the same at any speed. A heavy water wheel (inductor) resists fast wiggles more. A balloon tank (capacitor) lets fast wiggles through and blocks slow ones.' },
 { t: 'Sizes (magnitudes)', h:
  '<p>The magnitude of an inductor’s impedance rises with frequency, and a capacitor’s falls:</p>' + F('|Z_L| = ωL = 2πfL      |Z_C| = 1/(ωC) = 1/(2πfC)') +
  EX('Example', 'A 100 mH coil at 500 Hz: |Z_L| = 2π × 500 × 0.1 = <b>314 Ω</b>. A 10 μF capacitor at 1 kHz: |Z_C| = 1/(2π × 1000 × 10×10⁻⁶) = <b>15.9 Ω</b>.') +
  '<p>Remember to convert mH to H and μF to F.</p>',
  a: 'Faster wiggles push the wheel harder and slip past the balloon more easily.' },
 { t: 'A series pair', h:
  '<p>A resistor and an inductor in series: Z = R + jωL. The size of that complex number is:</p>' + F('|Z| = √(R² + X²)') +
  EX('Example', 'R = 3 Ω, inductor j4 Ω. |Z| = √(9 + 16) = <b>5 Ω</b>. A source of 10∠−45° V gives a current of magnitude 10/5 = <b>2 A</b> (angle −45° − 53.13° = −98.13°).'),
  a: 'The squeeze and the wheel add at right angles, so use the Pythagorean rule.' }
]);

LEARN(17, 'Source Transformations', [
 { t: 'Swap a battery for a current source', h:
  '<p>A voltage source <b>V</b> in series with a resistor <b>R</b> behaves, seen from the two terminals, exactly like a current source <b>I = V/R</b> in parallel with the same <b>R</b>.</p>' + F('I = V / R      V = I · R') +
  EX('Example', '12 V in series with 4 Ω becomes 3 A in parallel with 4 Ω. And 5 A in parallel with 2 Ω becomes 10 V in series with 2 Ω.') +
  '<p>Why they match: both give the same open-circuit voltage and the same short-circuit current.</p>',
  a: 'A pressure pump with a squeezing pipe in series acts like a flow pump with the same pipe beside it.' },
 { t: 'What does not stay the same', h:
  '<p>The terminals cannot tell the two forms apart, but the <b>power inside</b> is different. A transformation does not preserve the power in the part you transformed.</p>' +
  EX('Example', 'In a circuit with a 12 V source, 2 Ω, and then 4 Ω in parallel with a 6 A source, the 4 Ω dissipates 64 W (16 V across it). Turn the 6 A and 4 Ω into 24 V in series with 4 Ω: the voltage at the terminals is still 16 V, but now the 4 Ω dissipates only 16 W.') +
  '<p>Two special cases: a resistor in parallel with an ideal voltage source does nothing to the rest of the circuit, and a resistor in series with an ideal current source does nothing either.</p>',
  a: 'Same taps, different heating inside the box.' },
 { t: 'Reducing a ladder', h:
  '<p>Transform back and forth to reduce a circuit: turn a source and resistor into the other form, combine parallel currents or series voltages, repeat.</p>' +
  EX('Worked ladder', '360 V, 36 Ω series, 36 Ω shunt, 2 Ω series, then 20 Ω and 80 Ω shunts. 360/36 = 10 A in parallel with 36 Ω; 36 ∥ 36 = 18 Ω, giving 180 V in series with 18 + 2 = 20 Ω. The load 20 ∥ 80 = 16 Ω sees 180 × 16/36 = 80 V, so the current in the 80 Ω is <b>1 A</b>.') +
  '<p>Parallel current sources add. Series voltage sources add (subtract if opposed).</p>',
  a: 'Swap the pumps until the whole network collapses into one pump and one pipe.' }
]);

LEARN(18, 'Thevenin and Norton', [
 { t: 'A whole circuit as one source', h:
  '<p>Any two-terminal circuit made of sources and resistors acts like <b>one voltage source V_th in series with one resistor R_th</b> (the <b>Thévenin</b> equivalent), or equivalently <b>one current source I_N with R_th in parallel</b> (the <b>Norton</b> equivalent).</p>' +
  '<ul><li><b>V_th</b> = the open-circuit voltage (terminals left open).</li><li><b>I_N</b> = the short-circuit current (terminals shorted).</li></ul>' + F('R_th = V_oc / I_sc') +
  EX('Example', 'Open-circuit voltage 24 V, short-circuit current 4 A: R_th = 24/4 = <b>6 Ω</b>.'),
  a: 'Seen from two taps, a whole pump-and-pipe network looks like one pump with one narrow pipe.' },
 { t: 'Finding the equivalent', h:
  '<p><b>Method 1, direct:</b> find V_oc, find I_sc, divide.</p>' +
  '<p><b>Method 2, deactivate the sources:</b> turn off the independent sources (voltage source → short, current source → open), then find R_th by combining resistors. Find V_th with the sources on.</p>' +
  EX('Example', '200 V, 25 Ω series, 100 Ω to ground, 10 Ω to the terminal. Deactivate: R_th = 10 + (25 ∥ 100) = 10 + 20 = <b>30 Ω</b>. Source on, open terminals: V_th = 200 × 100/125 = <b>160 V</b>.'),
  a: 'Shut the pumps off and measure the squeeze, then turn them on and measure the open-tap pressure.' },
 { t: 'Method 3: the test source', h:
  '<p>If a circuit has <b>only dependent sources</b> and resistors (no independent source), then V_oc = 0 and I_sc = 0, so methods 1 and 2 fail. Use a <b>test source</b>: deactivate every independent source, connect a known test voltage V_T (or current I_T) to the terminals, and compute</p>' + F('R_th = V_T / I_T') +
  '<p>This method always works, and it is required when there are only dependent sources.</p>',
  a: 'If there is no real pump inside, push a known flow in from outside and read the pressure it makes.' }
]);

LEARN(19, 'Maximum Power Transfer', [
 { t: 'Matching the load', h:
  '<p>A source with Thévenin values V_th and R_th drives a load R_L. How much power does the load get?</p>' +
  '<ul><li>R_L = 0 (a wire): the voltage across the load is 0, so the power is 0.</li><li>R_L very large (open): no current, power 0.</li></ul>' +
  '<p>In between there is a peak. It happens when the load matches the source:</p>' + F('R_L = R_th'),
  a: 'A tap that is too wide has no pressure; one that is too narrow lets no water through. The best work is in the middle.' },
 { t: 'How much power', h:
  '<p>At the match, the load gets the most it can ever get:</p>' + F('P_max = V_th² / (4 R_th)') +
  EX('Example', 'V_th = 12 V, R_th = 4 Ω. P_max = 144/16 = <b>9 W</b>.') +
  '<p>Where it is used: impedance matching, such as an oscilloscope that expects a 50 Ω load, or a stereo amplifier with 8 Ω speakers. Power utilities do the opposite: they want small R to waste less (efficiency).</p>' +
  '<p>At the match, only half the total power reaches the load (50% efficiency).</p>',
  a: 'At the match, as much work is lost inside the pump as is delivered.' },
 { t: 'Not matched', h:
  '<p>If the load is not matched, find the current first, then the load power:</p>' + F('i = V_th/(R_th + R_L)      P_L = i² R_L') +
  EX('Example', 'V_th = 12 V, R_th = 6 Ω, R_L = 12 Ω. i = 12/18 = 0.667 A, P_L = 0.667² × 12 = <b>5.33 W</b>. The matched value would be 144/24 = 6 W.'),
  a: 'Any other tap size gives less work than the matched one.' }
]);

LEARN(20, 'Superposition', [
 { t: 'One source at a time', h:
  '<p>In a <b>linear</b> circuit (resistors, dependent sources), the effect of several independent sources is the sum of the effects of each one acting alone.</p>' +
  '<p>To find one source’s effect, <b>turn off all the others</b>: voltage source → <b>short</b>, current source → <b>open</b>. Dependent sources stay in the circuit.</p>' +
  EX('Example', 'Source A alone puts 3 V across a resistor, source B alone puts 2 V in the same direction. Together: 3 + 2 = <b>5 V</b>.'),
  a: 'Shut off all pumps but one, see what it does to a gauge, then repeat for each pump. The real reading is the sum.' },
 { t: 'A worked case', h:
  '<p>A 12 V source feeds 6 Ω in series then 4 Ω to ground. A 2 A source also pushes current into the junction.</p>' +
  EX('Voltage source alone', 'Current source open: divider gives 12 × 4/10 = 4.8 V.') +
  EX('Current source alone', 'Voltage source shorted: 6 Ω ∥ 4 Ω = 2.4 Ω, so 2 × 2.4 = 4.8 V.') + '<p>Total = 4.8 + 4.8 = <b>9.6 V</b>.</p>',
  a: 'Each pump’s effect is found as if it were alone, then the readings are added.' },
 { t: 'Power is different', h:
  '<p>Superposition works for voltages and currents. It does <b>not</b> work for power, because power depends on the square of the current.</p>' +
  EX('Example', 'Two sources alone each push 2 A and 3 A through a 2 Ω resistor in the same direction. Total current 5 A, so the power is 5² × 2 = <b>50 W</b>. Adding the separate powers (8 + 18 = 26 W) would be wrong.') +
  '<p>If every source is scaled by the same percentage, every response scales by that percentage too.</p>',
  a: 'Add the flows first, then work out the heating. Do not add the heatings.' }
]);

LEARN(21, 'Op Amp Basics and the Inverting Amp', [
 { t: 'What an op amp is', h:
  '<p>An <b>operational amplifier (op amp)</b> is a small chip with two inputs, one output and two power pins. The inputs are the <b>plus (non-inverting)</b> input, voltage v_p, and the <b>minus (inverting)</b> input, voltage v_n. The output is v_o.</p>' +
  '<p>It makes the output equal to a huge number A (the gain, often over 10,000) times the difference of the inputs, but it can never go beyond the power supply, called the <b>rails</b> (say ±15 V).</p>' + F('v_o = A (v_p − v_n)    (until it hits a rail)') +
  '<p>A real op amp draws almost no current into its inputs (the input resistance is huge), so i_p ≈ 0 and i_n ≈ 0.</p>',
  a: 'An op amp is a smart valve with two sensing taps. It opens a lot if one tap reads higher than the other. The pump (supply) limits how hard it can push.' },
 { t: 'Negative feedback and the two rules', h:
  '<p><b>Negative feedback</b> means a wire (often through a resistor) connects the output back to the inverting input. The op amp then adjusts its output until the two inputs are nearly equal. With feedback and the op amp not at a rail, two rules hold:</p>' +
  F('v_p = v_n      i_p = i_n = 0') +
  '<p>These are the <b>ideal op amp rules</b>. They are the key to every op amp circuit.</p>' +
  TRAP('If the output is stuck at a rail, the first rule fails. Always check the answer against the rails.'),
  a: 'The return pipe keeps the two sensor pressures level, and the sensors take no water.' },
 { t: 'The inverting amplifier', h:
  '<p>Source v_s through R_s into the minus input, feedback resistor R_f from output to the minus input, plus input to ground. Since v_p = 0, then v_n = 0 (a “virtual ground”). The current through R_s, v_s/R_s, has nowhere to go but through R_f:</p>' + F('v_o = −(R_f / R_s) · v_s') +
  EX('Example', 'R_s = 2 kΩ, R_f = 10 kΩ, v_s = 0.5 V. Gain = −5, so v_o = <b>−2.5 V</b>. The current in R_f is v_s/R_s = 0.25 mA.') +
  '<p>The minus sign means the output is upside down compared with the input.</p>',
  a: 'The input pipe leads to sea level. The valve sends whatever flows in out through the return pipe, flipped.' }
]);

LEARN(22, 'Op Amp Circuits: Follower, Non-Inverting, Summing, Difference', [
 { t: 'Which way does the sign go?', h:
  '<p>Same two rules, different wiring:</p>' +
  '<ul><li><b>Inverting amplifier</b> (input on the − side): output flips sign, gain −R_f/R_s.</li><li><b>Non-inverting amplifier</b> (input on the + side): output keeps the sign, gain <b>1 + R_f/R_s</b>.</li><li><b>Voltage follower (buffer)</b>: output wired straight to the − input; gain exactly 1.</li></ul>' +
  EX('Example', 'Non-inverting with R_f = 20 k and R_s = 5 k: gain = 1 + 4 = <b>5</b>.'),
  a: 'Feed the signal to the other tap and the valve scales without flipping.' },
 { t: 'Why a buffer, and summing', h:
  '<p>A follower copies a voltage while drawing <b>no current</b> from the source (i_p = 0). A weak source can drive a heavy load through it.</p>' +
  '<p>The <b>inverting summing amplifier</b> adds several inputs. Each input pushes a current v_k/R_k into the minus node, and all of it flows through R_f:</p>' + F('v_o = −R_f (v_a/R_a + v_b/R_b + …)') +
  EX('Example', 'R_f = 10 k, input 1 V through 5 k and 0.5 V through 10 k: v_o = −10 (1/5 + 0.5/10) = −10 (0.25) = <b>−2.5 V</b>.'),
  a: 'Several input pipes feed one junction; the return pipe carries the total.' },
 { t: 'The difference amplifier', h:
  '<p>A difference amplifier subtracts two inputs. If the resistors are matched (R_c = R_a and R_d = R_b):</p>' + F('v_o = (R_b/R_a) · (v_b − v_a)') +
  '<p>It only responds to the <b>difference</b> between the inputs. Anything both inputs share (the <b>common-mode</b> part, like noise) is cancelled.</p>' +
  EX('Example', 'Gain R_b/R_a = 5, v_a = 1 V, v_b = 1.5 V: v_o = 5 × 0.5 = <b>2.5 V</b>.'),
  a: 'The valve reacts only to the pressure gap between the two taps, and ignores shaking that is common to both.' }
]);

LEARN(23, 'Saturation, Comparators and CMRR', [
 { t: 'Hitting the rails', h:
  '<p>The output can never exceed the supply. If the formula asks for more, the output <b>saturates</b> (clips) at the rail.</p>' +
  EX('Example', 'Inverting amp, gain −5, supply ±10 V, input 3 V. The formula says −15 V, but the output stops at <b>−10 V</b>.') +
  '<p>To avoid saturation, keep the ideal output between the rails. Rails can be unequal, like +15 V and −10 V.</p>',
  a: 'Ask the valve for more than the pump can give and it just stays wide open.' },
 { t: 'No feedback: the comparator', h:
  '<p>With <b>no negative feedback</b>, v_p = v_n no longer holds. The op amp becomes a <b>comparator</b>: it just compares the inputs.</p>' +
  '<ul><li>v_p &gt; v_n → output goes to the + rail.</li><li>v_p &lt; v_n → output goes to the − rail.</li></ul>' +
  EX('Example', 'Rails ±5 V. v_p = 2 V and v_n = 1 V: output +5 V. v_p = −3 V and v_n = 0: output −5 V.'),
  a: 'With no return pipe, the valve slams fully open or fully shut, depending on which tap reads higher.' },
 { t: 'Rejecting what is shared', h:
  '<p>A difference amplifier ought to amplify only the difference of its inputs. The <b>common-mode rejection ratio (CMRR)</b> says how well it ignores the part both inputs share:</p>' + F('CMRR = |A_dm| / |A_cm|') +
  '<p>A <b>high</b> CMRR is good: strong gain for the difference signal, tiny gain for common noise.</p>',
  a: 'A good valve ignores pressure noise that shakes both taps the same way.' }
]);

LEARN(24, 'Op Amp Input and Output Properties', [
 { t: 'What the source sees', h:
  '<p>The <b>input resistance</b> is the resistance the source feels looking into the circuit: R_in = v/i drawn from the source.</p>' +
  '<ul><li>Inverting amp: the minus node is a virtual ground, so the source sees just <b>R_s</b>.</li><li>Non-inverting amp: the plus input draws no current, so the source sees <b>infinite</b> resistance.</li></ul>' +
  EX('Example', 'Inverting amp with R_s = 10 kΩ, R_f = 100 kΩ: the source sees 10 kΩ.'),
  a: 'An inverting valve looks like its input pipe leading to sea level. A non-inverting valve takes no water from its source.' },
 { t: 'What the load sees', h:
  '<p>Looking back from the load, an ideal op amp circuit is a perfect voltage source: its <b>Thévenin resistance is 0 Ω</b>, so the output voltage does not change when you change the load (as long as the op amp does not saturate or run out of current).</p>' +
  EX('Example', 'Inverting amp with gain −2.5 and v_s = 0.2 V gives v_o = −0.5 V. With a 5 kΩ load, the load current is −0.5/5 k = <b>−0.1 mA</b>. A different load changes the current, not v_o.'),
  a: 'The ideal valve holds its pressure no matter how thirsty the load is.' },
 { t: 'A trickier input resistance', h:
  '<p>For a difference amplifier, the source on the − side does not see just R_a. The other input sets v_n, so you must find the actual current. Use v_p = v_b R_d/(R_c + R_d), then v_n = v_p, and i_a = (v_a − v_n)/R_a, so R_ia = v_a / i_a.</p>' +
  EX('Example', 'R_a = 10 k, R_c = 33 k, R_d = 47 k, v_a = 670 mV, v_b = 800 mV. v_p = 0.8 × 47/80 = 0.47 V. i_a = (0.67 − 0.47)/10 k = 20 μA. R_ia = 0.67/20 μA = <b>33.5 kΩ</b>. The source on the + side sees R_c + R_d = 80 kΩ.') +
  '<p>A real op amp has finite input resistance, nonzero output resistance and finite gain A. These are the three imperfections of the realistic model.</p>',
  a: 'The other tap changes how much water flows in the first pipe.' }
]);

LEARN(25, 'Comparators and the Schmitt Trigger', [
 { t: 'Comparing to a reference', h:
  '<p>Put a fixed <b>reference voltage V_ref</b> on one input. Then the output tells you whether the signal is above or below V_ref.</p>' +
  EX('Example', 'Signal on +, 2 V on −, rails ±5 V. A 3 V signal gives +5 V. A 1 V signal gives −5 V. 2.5 V gives +5 V.') +
  TRAP('A noisy signal near V_ref makes the output chatter back and forth between the rails.'),
  a: 'The valve snaps open or shut when the signal crosses the reference level.' },
 { t: 'Hysteresis', h:
  '<p>A <b>Schmitt trigger</b> cures the chatter by adding <b>positive feedback</b>: part of the output is fed back to the + input, so the switching level moves depending on the current output. It has <b>two thresholds</b>, a gap called <b>hysteresis</b>. Once it flips, small noise cannot flip it back.</p>' +
  '<p>Layout: signal v_i through R₁ to the + input, R₂ from the output to the + input, − input at 0 V.</p>',
  a: 'Feed some of the output back so the valve needs a bigger push to flip back. Ripples in the water cannot make it flutter.' },
 { t: 'The thresholds', h:
  '<p>With supply rails ±V_s, the switching thresholds are ±T:</p>' + F('T = (R₁ / R₂) · V_s') +
  '<p>If the output is high, the input must fall below −T to flip it low. If the output is low, the input must rise above +T to flip it high. The window between −T and +T is 2T wide.</p>' +
  EX('Example', 'V_s = 10 V, R₁ = 2 k, R₂ = 20 k: T = 0.1 × 10 = <b>1 V</b>. Hysteresis window = 2 V.'),
  a: 'Two snap levels instead of one gives the water a dead zone to settle in.' }
]);

LEARN(26, 'Inductors', [
 { t: 'A coil that resists change', h:
  '<p>An <b>inductor</b> is a coil of wire. It stores energy in a magnetic field. Its size is the <b>inductance L</b>, in <b>henries (H)</b>.</p>' +
  '<p>The voltage across an inductor depends on how fast the current is <b>changing</b>:</p>' + F('v = L · di/dt') +
  EX('Example', 'A 2 H inductor’s current rises steadily by 4 A in 2 s: di/dt = 2 A/s, so v = 2 × 2 = <b>4 V</b>.') +
  '<p>Steady current (di/dt = 0) means v = 0. At DC an inductor acts like a <b>short circuit</b> (a plain wire).</p>',
  a: 'An inductor is a heavy water wheel in the pipe. It takes a push to speed it up or slow it down. Steady flow needs no push.' },
 { t: 'Energy and the memory of current', h:
  '<p>The energy stored depends on the current:</p>' + F('w = ½ · L · i²') +
  EX('Example', 'A 4 H inductor carrying 3 A stores ½ × 4 × 9 = <b>18 J</b>.') +
  '<p>The current through an inductor <b>cannot change instantly</b>. That would need infinite voltage. This is how switching problems later are solved: the inductor current just before and just after the switch is the same.</p>',
  a: 'A spinning wheel keeps spinning. It cannot stop in zero time.' },
 { t: 'Sudden changes make big voltages', h:
  '<p>If you cut the current quickly, di/dt is large and so is the voltage: v = L |di/dt|.</p>' +
  EX('Example', '50 mH, current drops from 2 A to 0 in 10 ms: |v| = 0.05 × 2 / 0.01 = <b>10 V</b>.') +
  '<p>Use henries (not mH) in the formulas. 50 mH = 0.05 H.</p>' +
  '<p>Phase memory: in an inductor the voltage leads the current (ELI: voltage E, inductor L, current I).</p>',
  a: 'Stop the wheel fast and it kicks back hard.' }
]);

LEARN(27, 'Capacitors', [
 { t: 'A tank that stores charge', h:
  '<p>A <b>capacitor</b> stores energy in an electric field between two plates. Its size is the <b>capacitance C</b>, in <b>farads (F)</b>. Typical values are μF (millionths of a farad).</p>' +
  '<p>The current through a capacitor depends on how fast the voltage is <b>changing</b>:</p>' + F('i = C · dv/dt') +
  '<p>Steady voltage (dv/dt = 0) means i = 0. At DC a capacitor acts like an <b>open circuit</b>.</p>',
  a: 'A capacitor is a stretchy balloon tank across the pipe. Changing pressure pushes water in and out. A full, steady balloon passes nothing.' },
 { t: 'Energy and continuity', h:
  '<p>Energy stored:</p>' + F('w = ½ · C · v²') +
  EX('Example', '100 μF charged to 12 V: ½ × 100×10⁻⁶ × 144 = 0.0072 J = <b>7.2 mJ</b>.') +
  EX('Current example', 'The voltage across a 10 μF capacitor rises 5 V in 10 ms. i = 10×10⁻⁶ × 5/0.01 = <b>5 mA</b>.') +
  '<p>The <b>voltage</b> across a capacitor cannot change instantly (that would need infinite current).</p>',
  a: 'A stretched balloon stores energy, and it cannot be stretched in zero time.' },
 { t: 'Inductor or capacitor?', h:
  '<p>The two parts mirror each other (they are <b>duals</b>):</p>' +
  '<ul><li>Inductor: current cannot jump, short at DC, v = L di/dt.</li><li>Capacitor: voltage cannot jump, open at DC, i = C dv/dt.</li></ul>' +
  '<p>Phase: ICE: in a capacitor the current leads the voltage.</p>',
  a: 'Wheel: flow cannot jump. Balloon: pressure cannot jump.' }
]);

LEARN(28, 'Combining Inductors and Capacitors', [
 { t: 'Inductors combine like resistors', h:
  '<p>Inductors in <b>series</b> add. Inductors in <b>parallel</b> combine with the product-over-sum rule:</p>' + F('L_series = L₁ + L₂      L_parallel = L₁L₂ / (L₁ + L₂)') +
  EX('Example', '2 mH + 3 mH in series = <b>5 mH</b>.'),
  a: 'Wheels in a row add their heaviness.' },
 { t: 'Capacitors combine the opposite way', h:
  '<p>Capacitors in <b>parallel</b> add (more plate area). In <b>series</b> they use the product-over-sum rule:</p>' + F('C_parallel = C₁ + C₂      C_series = C₁C₂ / (C₁ + C₂)') +
  EX('Example', '4 μF ∥ 6 μF = <b>10 μF</b>. 3 μF in series with 6 μF = 18/9 = <b>2 μF</b>.'),
  a: 'Balloons side by side add their room. Balloons in a row act like a stiffer, smaller balloon.' },
 { t: 'Mixed networks', h:
  '<p>Reduce step by step, like resistors, remembering which rule applies to which part.</p>' +
  EX('Example', '3 μF in series with 6 μF gives 2 μF. That sits in parallel with 4 μF, so C_eq = 2 + 4 = <b>6 μF</b>.'),
  a: 'Merge the in-a-row balloons first, then add the side-by-side ones.' }
]);

LEARN(29, 'Mutual Inductance', [
 { t: 'Two coils that talk', h:
  '<p>If two coils are close, the changing current in one makes a changing magnetic field that also passes through the other and induces a voltage there. This link is the <b>mutual inductance M</b> (in henries).</p>' +
  '<p>How well they are linked is the <b>coupling coefficient k</b>:</p>' + F('k = M / √(L₁ L₂)      0 ≤ k ≤ 1') +
  '<p>k = 1 means all the field links both coils (perfect coupling). k = 0 means no link.</p>',
  a: 'Two water wheels on shafts that nearly touch. Spin one and the other gets dragged along.' },
 { t: 'Using M and k', h:
  '<p>Rearranged: <b>M = k √(L₁ L₂)</b>.</p>' +
  EX('Example', 'L₁ = 4 mH, L₂ = 9 mH, k = 0.5: M = 0.5 × √36 = 0.5 × 6 = <b>3 mH</b>.') +
  '<p>The <b>dot convention</b> shows the sign. A current entering the dotted end of one coil induces a voltage that is positive at the dotted end of the other. The dots tell you whether the M terms add or subtract in KVL.</p>',
  a: 'The dots tell you which way the drag pushes.' },
 { t: 'Perfect coupling', h:
  '<p>Perfect coupling (k = 1) means M = √(L₁L₂), the largest possible value. k can never be greater than 1.</p>' +
  '<p>Transformers use tightly coupled coils to move energy between circuits.</p>',
  a: 'Locked shafts: the second wheel follows the first exactly.' }
]);

LEARN(30, 'First-Order Circuits and Time Constants', [
 { t: 'The time constant', h:
  '<p>A circuit with one resistor and one energy-storing part (a capacitor or an inductor) responds smoothly, not instantly. How slow it is, is set by the <b>time constant τ</b> (tau).</p>' +
  F('RC circuit: τ = R · C        RL circuit: τ = L / R') +
  EX('Example', '1 kΩ and 100 μF: τ = 1000 × 100×10⁻⁶ = 0.1 s = <b>100 ms</b>. A 50 mH coil with 10 Ω: τ = 0.05/10 = <b>5 ms</b>.') +
  '<p>R means the Thévenin resistance the storage part sees.</p>',
  a: 'A balloon filling through a narrow pipe is slow. Bigger balloon or narrower pipe means a larger τ.' },
 { t: 'The FIFE formula', h:
  '<p>Any voltage or current x(t) in a first-order circuit follows the FIFE formula:</p>' + F('x(t) = x(∞) + [x(0) − x(∞)] · e^(−t/τ)') +
  '<p><b>F</b>inal value, <b>I</b>nitial value, and <b>E</b>xponential decay. At t = τ the gap to the final value has shrunk to e⁻¹ ≈ 0.368 of its start.</p>' +

LEARN(31, 'Switching Time and 5τ', [

const par = (a, b) => a * b / (a + b);
const pickR = (list, n, must) => { const m = Array.isArray(must) ? must : [must]; const out = m.slice(); shuffle(list.filter(v => !m.includes(v))).slice(0, Math.max(0, n - m.length)).forEach(v => out.push(v)); return shuffle(out).sort((a, b) => a - b); };

const E = (x, u) => { if (x === 0) return '0 ' + u; const a = Math.abs(x), P = [[1e9, 'G'], [1e6, 'M'], [1e3, 'k'], [1, ''], [1e-3, 'm'], [1e-6, 'µ'], [1e-9, 'n']]; const p = P.find(q => a >= q[0] * 0.9995) || P[P.length - 1]; const v = x / p[0]; return (Math.round(v * 100) / 100) + ' ' + p[1] + u; };

const PT = (label, v, kind) => ({ label, v, kind: kind || 'BOX' });

/* ---- layouts. All are 11 wide, 7 tall. The bins fill row 6. ---- */
// a loop: left part, right part, sockets/fixed parts along the top row
function benchRig(o) {
  const sockets = (o.sockets || []).map(k => ({ id: k.id, label: k.label, x: k.x, y: k.y == null ? 1 : k.y }));
  const fixed = [];
  if (o.left !== null) fixed.push(Object.assign({ x: 1, y: 3, kind: 'BAT', label: '', info: '' }, o.left || {}));
  if (o.right !== null) fixed.push(Object.assign({ x: 9, y: 3, kind: 'BOX', label: '', info: '' }, o.right || {}));
  (o.top || []).forEach(f => fixed.push(Object.assign({ y: 1 }, f)));
  (o.extra || []).forEach(f => fixed.push(f));
  return { cols: 11, rows: 7, sockets, fixed, wires: o.wires || [[[1, 3], [1, 1], [9, 1], [9, 3], [9, 5], [1, 5], [1, 3]]], start: o.start || { x: 5, y: 3 }, lever: o.lever || { x: 10, y: 5 } };
}
// sockets along a row (ordering, matching, picking settings)
function rowRig(o) {
  const n = o.sockets.length, xs = n === 1 ? [5] : n === 2 ? [3, 7] : n === 3 ? [2, 5, 8] : n === 4 ? [1, 4, 7, 10] : n === 5 ? [1, 3, 5, 7, 9] : n === 6 ? [0, 2, 4, 6, 8, 10] : [0, 1, 3, 4, 6, 7, 9].slice(0, n);
  const sockets = o.sockets.map((k, i) => ({ id: k.id, label: k.label, x: xs[i], y: o.y == null ? 1 : o.y }));
  const wires = o.wires === undefined ? [[[Math.min(...xs), sockets[0].y], [Math.max(...xs), sockets[0].y]]] : o.wires;
  return { cols: 11, rows: 7, sockets, fixed: o.fixed || [], wires, start: o.start || { x: 5, y: 3 }, lever: o.lever || { x: 10, y: 4 } };
}
// two rows of sockets (e.g. cause on top, effect below)
function gridRig(o) {
  const sockets = [], rows = o.rows; const ys = rows.length === 1 ? [1] : rows.length === 2 ? [1, 3] : [1, 2, 3];
  rows.forEach((row, r) => { const n = row.length, xs = n === 1 ? [5] : n === 2 ? [3, 7] : n === 3 ? [2, 5, 8] : n === 4 ? [1, 4, 7, 10] : [1, 3, 5, 7, 9]; row.forEach((k, i) => sockets.push({ id: k.id, label: k.label, x: xs[i], y: ys[r] })); });

}

// mk: wraps a calc(p) that runs only once every socket is filled
const mk = o => Object.assign({}, o.rig, { q: o.q, teach: o.teach, hint: o.hint, parts: o.parts, coach: o.coach,
  model(p) { const need = (o.rig.sockets || []).every(k => p[k.id]); if (!need) return { meters: o.idle || [], note: o.idleNote || '' }; return Object.assign({ live: true }, o.calc(p)); } });
// dial: one socket whose part sets a number; the meter shows it; match the target
function dial(o) {

  const spec = {
    rig: o.rig, q: o.q, teach: o.teach, hint: o.hint, parts: o.parts,
    idle: [meterOf(o.label || 'Reading', '—'), meterOf('Target', show(tgt))], idleNote: o.idleNote || 'Place a part to see the reading.',
    calc(p) { const x = rd(p[id]), ok = near(x, tgt, tol), ms = [meterOf(o.label || 'Reading', show(x), ok ? 'good' : 'bad'), meterOf('Target', show(tgt))].concat(o.extra ? o.extra(p[id], x) : []);
      return { ok, meters: ms, note: o.note(p[id], x), why: o.why, fail: typeof o.fail === 'function' ? o.fail(x, tgt) : (o.fail || (x > tgt ? 'Too high.' : 'Too low.')) }; },
  };

    const nb = o.parts.slice().sort((a, b) => a.v - b.v), i = nb.findIndex(q => q.label === p[id].label), e = q => Math.abs(rd(q) - tgt), up = nb[i + 1], dn = nb[i - 1];
    const cands = [up, dn].filter(q => q && e(q) < e(p[id])); const pick1 = cands.sort((a, b) => e(a) - e(b))[0];
    return (x > tgt ? 'too high. ' : 'too low. ') + (pick1 ? 'Try a <b>' + (pick1 === up ? 'bigger' : 'smaller') + '</b> one.' : 'Try a different one.'); };

}
// slot: fill labelled slots with the matching part (ordering, matching, picking settings)
function slot(o) {
  const n = o.slots.length, want = {}; o.slots.forEach((s, i) => want[s.id] = s.want);
  const rig = o.rig || rowRig({ sockets: o.slots.map(s => ({ id: s.id, label: s.label })), fixed: o.fixed });
  const spec = { rig, q: o.q, teach: o.teach, hint: o.hint, parts: o.parts.map(x => typeof x === 'string' ? PT(x, x, o.kind || 'BOX') : x),
    idle: o.count === false ? [] : [meterOf('In place', '0 of ' + n)], idleNote: o.idleNote || '',
    calc(p) { const good = o.slots.filter(s => p[s.id].label === s.want).length, ok = good === n; const ms = o.count === false ? [] : [meterOf('In place', good + ' of ' + n, ok ? 'good' : '')].concat(o.meters ? o.meters(p, good) : []);
      return { ok, meters: ms, note: o.note ? o.note(p, good) : (ok ? 'Everything is in place.' : (o.count === false ? '' : good + ' of ' + n + ' are right.')), why: o.why, fail: o.fail || '' }; } };
  if (o.guide) spec.coach = (p, carry) => { const empty = o.slots.find(s => !p[s.id]); if (!carry && empty) return 'pick a part from the bins.'; if (carry) return 'place it in a socket.'; const bad = o.slots.find(s => p[s.id].label !== s.want); return bad ? 'swap the one that does not belong: take it back with Space on the socket.' : 'all in place. Press Enter.'; };
