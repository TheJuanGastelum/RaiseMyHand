    return Object.assign(r, { q: '<b>Build:</b> the ' + V + ' V battery must deliver <b>' + tgt + ' W</b>. Choose the current.', teach: '<p><b>Power</b> is voltage times current: <b>p = v × i</b> (watts = volts × amps). Work out the current you need first.</p>',
      parts: pickR([0.5, 1, 2, 3, 4, 5], 5, I).map(v => ({ label: v + ' A', v, kind: 'BOX' })),
      model(p) { if (!p.i) return { meters: [meterOf('Power', '— W'), meterOf('Target', tgt + ' W')], note: '' }; const P = V * p.i.v, ok = near(P, tgt, .001); return { ok, live: true, meters: [meterOf('Power', P + ' W', ok ? 'good' : 'bad'), meterOf('Target', tgt + ' W')], note: 'p = ' + V + ' × ' + p.i.v + ' = <b>' + P + ' W</b>.', why: 'i = p ÷ v = ' + tgt + ' ÷ ' + V + ' = ' + I + ' A.', fail: P > tgt ? 'Too much power.' : 'Not enough power.' }; } }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'Energy w = p × t. First find the power you need: p = w ÷ t, then i = p ÷ v.', q: '', gen() { const V = pick([10, 20]), I = pick([1, 2, 3]), T = pick([5, 10]), tgt = V * I * T;
    const r = loopRig({ V, left: { kind: 'BAT', label: volt(V), sub: 'battery', info: 'The battery gives ' + volt(V) + '.' }, right: { kind: 'BULB', label: T + ' s', sub: 'runs ' + T + ' s', info: 'The load runs for ' + T + ' seconds.' }, sockets: [{ id: 'i', label: 'i', x: 5 }] });
    return Object.assign(r, { q: '<b>Build:</b> the load runs for <b>' + T + ' s</b> from the ' + V + ' V battery and must use <b>' + tgt + ' J</b> of energy. Choose the current.', teach: '<p>Energy is power times time: <b>w = p × t</b> (joules = watts × seconds).</p>',
      parts: pickR([1, 2, 3, 4, 5], 5, I).map(v => ({ label: v + ' A', v, kind: 'BOX' })),
      model(p) { if (!p.i) return { meters: [meterOf('Energy', '— J'), meterOf('Target', tgt + ' J')], note: '' }; const W = V * p.i.v * T, ok = W === tgt; return { ok, live: true, meters: [meterOf('Power', V * p.i.v + ' W'), meterOf('Energy', W + ' J', ok ? 'good' : 'bad'), meterOf('Target', tgt + ' J')], note: 'w = ' + V + ' × ' + p.i.v + ' × ' + T + ' = <b>' + W + ' J</b>.', why: 'p = w ÷ t = ' + tgt + ' ÷ ' + T + ' = ' + tgt / T + ' W, so i = ' + tgt / T + ' ÷ ' + V + ' = ' + I + ' A.', fail: W > tgt ? 'Too much energy.' : 'Not enough energy.' }; } }); } },
]);

/* ---- Level 2: who delivers, who absorbs ---- */
LABS(2, 'Power and the Passive Sign Convention', [
  Object.assign({ t: 'lab', tier: 1, hint: 'A part that supplies power is the source. The one that uses it is the load.', q: '<b>Build:</b> a circuit needs one part that <b>delivers</b> power and one that <b>absorbs</b> it. Fill the two sockets.',
    teach: '<p>Every part either <b>delivers</b> power (a battery) or <b>absorbs</b> it (a lamp, a resistor). With the passive sign convention, current entering the + end gives <b>p = v × i</b>: positive means absorbing, negative means delivering.</p>' },
    (() => { const parts = [{ label: 'Battery', kind: 'BAT', role: 'src' }, { label: 'Lamp', kind: 'BULB', role: 'load' }, { label: 'Heater', kind: 'R', role: 'load' }, { label: 'Charger', kind: 'SRC', role: 'src' }];
      const r = loopRig({ V: 0, left: { kind: 'BOX', label: 'meter', sub: 'p = v × i', info: 'Shows the sign of the power for each socket.' }, right: { kind: 'BOX', label: '2 A', sub: 'current', info: '2 A flows around the loop.' }, sockets: [{ id: 'a', label: 'A', x: 3 }, { id: 'b', label: 'B', x: 7 }] });
      return Object.assign(r, { parts, model(p) { const ra = p.a && p.a.role, rb = p.b && p.b.role; const ok = (ra === 'src' && rb === 'load') || (ra === 'load' && rb === 'src');
          return { ok, live: !!(p.a && p.b), meters: [meterOf('A', p.a ? (ra === 'src' ? 'delivers' : 'absorbs') : '—', p.a ? 'good' : ''), meterOf('B', p.b ? (rb === 'src' ? 'delivers' : 'absorbs') : '—', p.b ? 'good' : '')], note: ok ? 'One part delivers and the other absorbs. The power they trade is equal and opposite.' : 'Power must come from somewhere. You need one source and one load.', why: 'Total power in a circuit adds up to zero: what the source delivers, the load absorbs.', fail: ra === rb ? 'Two of the same kind. Something must supply the power and something must use it.' : '' }; },
        coach(p, carry) { if (!p.a && !p.b && !carry) return 'pick any part.'; if (p.a && p.b) return 'check the labels in the meters. Press Enter to test.'; return 'fill the other socket with the opposite kind.'; } }); })()),
  { t: 'lab', tier: 2, hint: 'Powers add up to zero. If the lamp absorbs 40 W, the battery delivers 40 W.', q: '', gen() { const V = pick([10, 20, 40]), I = pick([1, 2, 4]), P = V * I;
    const r = loopRig({ V, left: { kind: 'BAT', label: volt(V), sub: 'battery', info: 'The battery gives ' + volt(V) + '.' }, right: { kind: 'BOX', label: P + ' W', sub: 'absorbed', info: 'The load absorbs ' + P + ' W.' }, sockets: [{ id: 'i', label: 'i', x: 5 }] });
    return Object.assign(r, { q: '<b>Build:</b> the load must <b>absorb ' + P + ' W</b> from the ' + V + ' V battery. The battery will then deliver the same. Choose the current.', teach: '<p>The power absorbed by the load equals the power delivered by the source. <b>p = v × i</b> for each.</p>',
      parts: pickR([1, 2, 3, 4, 5], 5, I).map(v => ({ label: v + ' A', v, kind: 'BOX' })),
      model(p) { if (!p.i) return { meters: [meterOf('Battery', '— W'), meterOf('Load', '— W'), meterOf('Target', P + ' W')], note: '' }; const w = V * p.i.v, ok = w === P; return { ok, live: true, meters: [meterOf('Battery', '−' + w + ' W'), meterOf('Load', '+' + w + ' W', ok ? 'good' : 'bad'), meterOf('Target', P + ' W')], note: 'Load: +' + w + ' W (absorbs). Battery: −' + w + ' W (delivers). Sum = 0.', why: 'i = p ÷ v = ' + P + ' ÷ ' + V + ' = ' + I + ' A. The load is +' + P + ' W and the battery is −' + P + ' W.', fail: '' }; } }); } },
]);

/* ---- Level 6: combining resistors ---- */
LABS(6, 'Combining Resistors', [
  Object.assign({ t: 'lab', tier: 1, hint: 'In series the resistances add: R = R1 + R2.', q: '<b>Build:</b> the total resistance in the loop must be <b>300 Ω</b>. One resistor is already fixed at 100 Ω. Choose the other.',
    teach: '<p><b>Series</b> resistors share one path, so their resistances <b>add</b>: <b>R<sub>total</sub> = R<sub>1</sub> + R<sub>2</sub></b>.</p>' },
    (() => { const R1 = 100, tgt = 300, V = 12; const r = loopRig({ V, sockets: [{ id: 'r', label: 'R2', x: 6 }], fixed: [{ x: 3, y: 1, kind: 'R', label: '100 Ω', sub: 'fixed R1', info: 'A fixed 100 Ω resistor in series.' }] });
      return Object.assign(r, { parts: [50, 100, 200, 300, 500].map(RP), model(p) { if (!p.r) return { meters: [meterOf('Total R', ohm(R1) + ' + ?'), meterOf('Target', ohm(tgt))], note: 'Place a resistor in the socket.' }; const Rt = R1 + p.r.v, ok = Rt === tgt;
          return { ok, live: true, meters: [meterOf('Total R', ohm(Rt), ok ? 'good' : 'bad'), meterOf('Current', amp(V / Rt)), meterOf('Target', ohm(tgt))], note: 'R = 100 + ' + p.r.v + ' = <b>' + ohm(Rt) + '</b>.', why: 'Series: R = R1 + R2, so R2 = ' + tgt + ' − ' + R1 + ' = 200 Ω.', fail: Rt > tgt ? 'Total is too big. Use a smaller resistor.' : 'Total is too small. Use a bigger resistor.' }; },
        coach(p, carry) { if (!p.r && !carry) return 'grab a resistor.'; if (!p.r) return 'place it in the socket.'; const Rt = R1 + p.r.v; return Rt === tgt ? 'the total matches. Press Enter.' : Rt > tgt ? 'too big. Try a <b>smaller</b> one.' : 'too small. Try a <b>bigger</b> one.'; } }); })()),
  { t: 'lab', tier: 2, hint: 'Parallel: R = (R1 × R2) ÷ (R1 + R2). Two equal resistors in parallel give half.', q: '', gen() { const L = [60, 120, 200, 300, 600], a = pick(L), b = pick(L), tgt = par(a, b);
    const r = parRig({ V: 12, branches: [{ id: 'a', socket: true, label: 'R1', x: 4 }, { id: 'b', socket: true, label: 'R2', x: 7 }] });
    return Object.assign(r, { q: '<b>Build:</b> two resistors in <b>parallel</b> must give a total of <b>' + fmt(tgt, 3) + ' Ω</b>. Fill both sockets.', teach: '<p><b>Parallel</b> resistors give the current more paths, so the total is <b>smaller</b> than either one: <b>R = (R<sub>1</sub>R<sub>2</sub>) ÷ (R<sub>1</sub> + R<sub>2</sub>)</b>.</p>',
      parts: [60, 120, 200, 300, 600].map(RP),
      model(p) { if (!p.a || !p.b) return { meters: [meterOf('Total R', '—'), meterOf('Target', fmt(tgt, 3) + ' Ω')], note: '' }; const Rt = par(p.a.v, p.b.v), ok = near(Rt, tgt, .01); return { ok, live: true, meters: [meterOf('Total R', fmt(Rt, 3) + ' Ω', ok ? 'good' : 'bad'), meterOf('Target', fmt(tgt, 3) + ' Ω')], note: p.a.v + ' ∥ ' + p.b.v + ' = ' + p.a.v + '×' + p.b.v + ' ÷ ' + (p.a.v + p.b.v) + ' = <b>' + fmt(Rt, 3) + ' Ω</b>.', why: a + ' ∥ ' + b + ' = ' + a + '×' + b + ' ÷ ' + (a + b) + ' = ' + fmt(tgt, 3) + ' Ω.', fail: Rt > tgt ? 'Too big. Smaller resistors in parallel go lower.' : 'Too small.' }; } }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'Do the parallel pair first, then add the series resistor.', q: '', gen() { const L = [50, 100, 150, 200, 300], s0 = pick(L), a = pick(L), b = pick(L), tgt = s0 + par(a, b);
    const r = parRig({ V: 12, branches: [{ id: 'a', v: a, x: 6 }, { id: 'b', socket: true, label: 'Rb', x: 8 }], fixed: [] });
    r.sockets.push({ id: 's', label: 'Rs', x: 3, y: 1 }); r.wires = [[[1, 3], [1, 1], [8, 1]], [[1, 3], [1, 5], [8, 5]], [[6, 1], [6, 5]], [[8, 1], [8, 5]]];
    return Object.assign(r, { q: '<b>Build:</b> a series resistor <b>Rs</b> feeds a parallel pair (one fixed at ' + ohm(a) + ', one you choose). The total must be <b>' + fmt(tgt, 3) + ' Ω</b>.', teach: '<p>Combine in steps. Parallel pair first, then add the series resistor on top.</p>',
      parts: L.map(RP),
      model(p) { if (!p.s || !p.b) return { meters: [meterOf('Total R', '—'), meterOf('Target', fmt(tgt, 3) + ' Ω')], note: '' }; const pp = par(a, p.b.v), Rt = p.s.v + pp, ok = near(Rt, tgt, .01); return { ok, live: true, meters: [meterOf('Parallel pair', fmt(pp, 3) + ' Ω'), meterOf('Total R', fmt(Rt, 3) + ' Ω', ok ? 'good' : 'bad'), meterOf('Target', fmt(tgt, 3) + ' Ω')], note: ohm(a) + ' ∥ ' + ohm(p.b.v) + ' = ' + fmt(pp, 3) + ' Ω, plus ' + ohm(p.s.v) + ' in series = <b>' + fmt(Rt, 3) + ' Ω</b>.', why: ohm(a) + ' ∥ ' + b + ' Ω = ' + fmt(par(a, b), 3) + ' Ω, plus ' + s0 + ' Ω = ' + fmt(tgt, 3) + ' Ω.', fail: Rt > tgt ? 'Too big.' : 'Too small.' }; } }); } },
]);

/* ---- Level 7: dividers ---- */
LABS(7, 'Voltage and Current Dividers', [
  Object.assign({ t: 'lab', tier: 1, hint: 'Vout = Vs × R2 ÷ (R1 + R2).', q: '<b>Build:</b> the output voltage across R2 must be <b>9 V</b> from the 12 V battery. R1 is fixed at 100 Ω. Choose R2.',
    teach: '<p>Two resistors in series <b>split</b> the battery’s push in proportion to their sizes: <b>V<sub>out</sub> = V<sub>s</sub> × R<sub>2</sub> ÷ (R<sub>1</sub> + R<sub>2</sub>)</b>. The bigger resistor takes the bigger share.</p>' },
    (() => { const V = 12, R1 = 100, tgt = 9; const r = loopRig({ V, right: { kind: 'BOX', label: 'V', sub: 'across R2', info: 'A voltmeter across R2.' }, sockets: [{ id: 'r', label: 'R2', x: 6 }], fixed: [{ x: 3, y: 1, kind: 'R', label: '100 Ω', sub: 'fixed R1', info: 'R1 is 100 Ω.' }] });
      return Object.assign(r, { parts: [50, 100, 200, 300, 600].map(RP), model(p) { if (!p.r) return { meters: [meterOf('Vout', '— V'), meterOf('Target', tgt + ' V')], note: 'Place R2.' }; const Vo = V * p.r.v / (R1 + p.r.v), ok = near(Vo, tgt, .01);
          return { ok, live: true, meters: [meterOf('Vout', volt(Vo), ok ? 'good' : 'bad'), meterOf('Target', tgt + ' V')], note: 'Vout = 12 × ' + p.r.v + ' ÷ (100 + ' + p.r.v + ') = <b>' + volt(Vo) + '</b>.', why: 'Vout = Vs × R2 ÷ (R1 + R2). For 9 V out of 12 V, R2 must take 3/4 of the total, so R2 = 3 × R1 = 300 Ω.', fail: Vo > tgt ? 'Too high. Use a smaller R2.' : 'Too low. Use a bigger R2.' }; },
        coach(p, carry) { if (!p.r && !carry) return 'grab a resistor.'; if (!p.r) return 'place it as R2.'; const Vo = V * p.r.v / (R1 + p.r.v); return near(Vo, tgt, .01) ? 'right on target. Press Enter.' : Vo > tgt ? 'too high. R2 must be <b>smaller</b>.' : 'too low. R2 must be <b>bigger</b>.'; } }); })()),
  { t: 'lab', tier: 2, hint: 'The output is a fraction of the source: R2 ÷ (R1 + R2).', q: '', gen() { const V = pick([10, 12, 20]), R1 = pick([100, 200, 300]), R2 = pick([100, 200, 300, 600]), tgt = V * R2 / (R1 + R2);
    const r = loopRig({ V, right: { kind: 'BOX', label: 'V', sub: 'across R2', info: 'A voltmeter across R2.' }, sockets: [{ id: 'r', label: 'R2', x: 6 }], fixed: [{ x: 3, y: 1, kind: 'R', label: ohm(R1), sub: 'fixed R1', info: 'R1 is ' + ohm(R1) + '.' }] });
    return Object.assign(r, { q: '<b>Build:</b> with R1 = ' + ohm(R1) + ' and a ' + V + ' V battery, the output across R2 must be <b>' + fmt(tgt, 3) + ' V</b>. Choose R2.', teach: '<p>Work out what fraction of the battery you need, then match R2 to it.</p>',
      parts: pickR([50, 100, 200, 300, 600, 900], 5, R2).map(RP),
      model(p) { if (!p.r) return { meters: [meterOf('Vout', '— V'), meterOf('Target', fmt(tgt, 3) + ' V')], note: '' }; const Vo = V * p.r.v / (R1 + p.r.v), ok = near(Vo, tgt, .01); return { ok, live: true, meters: [meterOf('Vout', volt(Vo), ok ? 'good' : 'bad'), meterOf('Target', fmt(tgt, 3) + ' V')], note: 'Vout = ' + V + ' × ' + p.r.v + ' ÷ (' + R1 + ' + ' + p.r.v + ') = <b>' + volt(Vo) + '</b>.', why: 'Vout ÷ Vs = ' + fmt(tgt / V, 3) + ' = R2 ÷ (R1 + R2), which gives R2 = ' + R2 + ' Ω.', fail: Vo > tgt ? 'Too high.' : 'Too low.' }; } }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'Current divider: the branch with the SMALLER resistance gets MORE current. I1 = I × R2 ÷ (R1 + R2).', q: '', gen() { const It = pick([6, 8, 12]), R1 = pick([100, 200, 300]), R2 = pick([100, 200, 300, 600]), tgt = It * R2 / (R1 + R2);
    const r = parRig({ V: 0, battery: { kind: 'SRC', label: It + ' A', sub: 'current source', info: 'A source that pushes a steady ' + It + ' A into the two branches.' }, branches: [{ id: 'f', v: R1, x: 5, sub: 'R1 (measured)' }, { id: 'r', socket: true, label: 'R2', x: 8 }] });
    return Object.assign(r, { q: '<b>Build:</b> a ' + It + ' A source splits between two branches. The current through R1 (' + ohm(R1) + ') must be <b>' + fmt(tgt, 3) + ' A</b>. Choose R2.', teach: '<p>Current splits the opposite way from voltage: the <b>easier</b> path (smaller resistance) takes the <b>bigger</b> share. <b>I<sub>1</sub> = I × R<sub>2</sub> ÷ (R<sub>1</sub> + R<sub>2</sub>)</b>.</p>',
      parts: pickR([50, 100, 200, 300, 600, 900], 5, R2).map(RP),
      model(p) { if (!p.r) return { meters: [meterOf('I through R1', '— A'), meterOf('Target', fmt(tgt, 3) + ' A')], note: '' }; const I1 = It * p.r.v / (R1 + p.r.v), ok = near(I1, tgt, .01); return { ok, live: true, meters: [meterOf('I through R1', fmt(I1, 3) + ' A', ok ? 'good' : 'bad'), meterOf('I through R2', fmt(It - I1, 3) + ' A'), meterOf('Target', fmt(tgt, 3) + ' A')], note: 'I1 = ' + It + ' × ' + p.r.v + ' ÷ (' + R1 + ' + ' + p.r.v + ') = <b>' + fmt(I1, 3) + ' A</b>.', why: 'I1 = I × R2 ÷ (R1 + R2) gives R2 = ' + R2 + ' Ω.', fail: I1 > tgt ? 'R1 gets too much. Make R2 easier (smaller) to pull current away.' : 'R1 gets too little. Make R2 harder (bigger).' }; } }); } },
]);

/* Workshop builds, part 3: levels 4, 5, 8, 9 */
const WL = LABSET(WATER_LEVELS, 'water');
function nodeRig(o) {
  const pos = { l: [2, 3], r: [8, 3], t: [5, 1], b: [5, 4] }, sockets = [], wires = [];
  const fixed = [{ x: 5, y: 3, kind: 'BOX', label: 'node', sub: 'junction', info: 'Currents meet here. What flows in must flow out.' }];
  ['l', 'r', 't', 'b'].forEach(k => { const a = o[k]; if (!a) return; const [x, y] = pos[k]; if (a.socket) sockets.push(Object.assign({ x, y }, a.socket)); else fixed.push(Object.assign({ x, y }, a.fixed)); wires.push([[5, 3], [x, y]]); });
  return { cols: 11, rows: 7, sockets, fixed, wires, start: { x: 4, y: 2 }, lever: { x: 10, y: 5 } };
}
const AP = v => PT(v + ' A', v, 'BOX'), VP = v => PT(v + ' V', v, 'BAT');
const IN = (a, sub) => ({ kind: 'SRC', label: a + ' A', sub: sub || 'flows in', info: a + ' A flows into the node.' });
const OUT = (a) => ({ kind: 'LED', label: a + ' A', sub: 'flows out', info: a + ' A flows out of the node.' });

/* ---- Level 4: Kirchhoff's laws ---- */
WL(4, 'Kirchhoff’s Laws', [
  { t: 'lab', tier: 1, hint: 'Current in = current out at a node. 5 = 2 + x.', q: '', gen() { const a = 5, b = 2, x = 3;
    return Object.assign(mk({ rig: nodeRig({ l: { fixed: IN(a) }, r: { fixed: OUT(b) }, t: { socket: { id: 'x', label: 'out' } } }), q: '<b>Build:</b> 5 A flows into a node and 2 A leaves on the right. Choose the current that must leave through the top so the node balances.',
      teach: '<p><b>Kirchhoff’s current law (KCL):</b> charge cannot pile up at a node. The currents flowing <b>in</b> add up to the currents flowing <b>out</b>.</p>', hint: 'In = out. 5 A in, so 2 + x must equal 5.', parts: [1, 2, 3, 4, 5].map(AP),
      idle: [meterOf('Net at node', '—')], idleNote: 'Place a current to see if the node balances.',
      calc(p) { const net = a - b - p.x.v, ok = net === 0; return { ok, meters: [meterOf('In', a + ' A'), meterOf('Out', (b + p.x.v) + ' A', ok ? 'good' : 'bad'), meterOf('Net', net + ' A', ok ? 'good' : 'bad')], note: 'In ' + a + ' A. Out = ' + b + ' + ' + p.x.v + ' = ' + (b + p.x.v) + ' A.', why: 'KCL: in = out, so ' + a + ' = ' + b + ' + x and x = ' + x + ' A.', fail: net > 0 ? 'More flows in than out. Charge would pile up. Let more leave.' : 'More leaves than arrives. Let less leave.' }; },
      coach(p, carry) { if (!p.x && !carry) return 'pick a current from a bin.'; if (!p.x) return 'place it in the top socket.'; const net = a - b - p.x.v; return net === 0 ? 'balanced. Press Enter.' : net > 0 ? 'more in than out. Pick a <b>bigger</b> one.' : 'more out than in. Pick a <b>smaller</b> one.'; } }), {}); } },
  { t: 'lab', tier: 2, hint: 'Going round the loop, the rises equal the falls: V = drop1 + drop2 + drop3.', q: '', gen() { const V = pick([12, 24]), a = pick([2, 3, 4]), b = pick([1, 2, 3]), x = V - a - b;
    return mk({ rig: benchRig({ left: { kind: 'BAT', label: V + ' V', sub: 'battery', info: 'The battery raises the voltage by ' + V + ' V.' }, right: { kind: 'BOX', label: 'Σv', sub: 'loop sum', info: 'Adds all rises and falls around the loop.' }, sockets: [{ id: 'x', label: 'drop', x: 5 }], top: [{ x: 3, kind: 'R', label: a + ' V', sub: 'drops', info: 'This resistor drops ' + a + ' V.' }, { x: 7, kind: 'R', label: b + ' V', sub: 'drops', info: 'This resistor drops ' + b + ' V.' }] }),
      q: '<b>Build:</b> a ' + V + ' V battery drives a loop with drops of ' + a + ' V and ' + b + ' V. Choose the voltage the third part must drop.', teach: '<p><b>Kirchhoff’s voltage law (KVL):</b> go once around any closed loop and the voltage rises and falls add to <b>zero</b>. The battery’s rise equals the sum of the drops.</p>',
      hint: V + ' − ' + a + ' − ' + b + ' − x = 0.', parts: pickR([1, 2, 3, 4, 5, 6, 8, 10, 12, 15, 18], 5, x).map(VP), idle: [meterOf('Σ around loop', '—')],
      calc(p) { const sum = V - a - b - p.x.v, ok = Math.abs(sum) < 1e-9; return { ok, meters: [meterOf('Rise', V + ' V'), meterOf('Drops', (a + b + p.x.v) + ' V'), meterOf('Σ around loop', N2(sum) + ' V', ok ? 'good' : 'bad')], note: V + ' − ' + a + ' − ' + b + ' − ' + p.x.v + ' = <b>' + N2(sum) + ' V</b>.', why: 'KVL: ' + V + ' = ' + a + ' + ' + b + ' + x, so x = ' + x + ' V.', fail: sum > 0 ? 'The drops do not use up all the rise.' : 'The drops use more than the battery gives.' }; } }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'The two outflows must add to the net. And the top one must be twice the bottom one.', q: '', gen() { const y = pick([1, 2, 3]), x = 2 * y, c = pick([1, 2]), a = x + y + c;
    return mk({ rig: nodeRig({ l: { fixed: IN(a) }, r: { fixed: OUT(c) }, t: { socket: { id: 'x', label: 'top' } }, b: { socket: { id: 'y', label: 'bottom' } } }), q: '<b>Build:</b> ' + a + ' A flows in and ' + c + ' A leaves on the right. The top branch must carry <b>twice</b> as much as the bottom branch. Choose both.',
      teach: '<p>Two unknowns, two facts: KCL says the outflows add up to the inflow, and the rule says top = 2 × bottom.</p>', parts: [1, 2, 3, 4, 5, 6].map(AP), idle: [meterOf('Net', '—')],
      calc(p) { const net = a - c - p.x.v - p.y.v, ratio = p.x.v === 2 * p.y.v, ok = net === 0 && ratio; return { ok, meters: [meterOf('Net at node', net + ' A', net === 0 ? 'good' : 'bad'), meterOf('Top = 2 × bottom', ratio ? 'yes' : 'no', ratio ? 'good' : 'bad')], note: 'Out = ' + c + ' + ' + p.x.v + ' + ' + p.y.v + ' = ' + (c + p.x.v + p.y.v) + ' A.', why: 'x + y = ' + (a - c) + ' and x = 2y, so y = ' + y + ' A and x = ' + x + ' A.', fail: net !== 0 ? 'The node does not balance.' : 'The balance is right, but the top is not twice the bottom.' }; } }); } },
]);

/* ---- Level 5: dependent sources ---- */
WL(5, 'Kirchhoff with Dependent Sources', [
  { t: 'lab', tier: 1, hint: 'KVL: 12 = I × 2 + k × I. So I = 12 ÷ (2 + k).', q: '', gen() { const V = 12, R = 2, k = 6, tgt = V / (R + k);
    return mk({ rig: benchRig({ left: { kind: 'BAT', label: V + ' V', sub: 'battery', info: 'The battery raises the voltage by ' + V + ' V.' }, right: { kind: 'BOX', label: 'A', sub: 'ammeter', info: 'Reads the loop current I.' }, sockets: [{ id: 'k', label: 'k·I', x: 6 }], top: [{ x: 3, kind: 'R', label: R + ' Ω', sub: 'fixed', info: 'A ' + R + ' Ω resistor.' }] }),
      q: '<b>Build:</b> a <b>dependent source</b> drops <b>k × I</b> volts, where I is the loop current. Choose k so the ammeter reads <b>' + tgt + ' A</b>.', teach: '<p>A <b>dependent source</b> is a voltage that depends on a current somewhere else in the circuit. Here it drops <b>k × I</b>. KVL still works: <b>V = I·R + k·I</b>, so <b>I = V ÷ (R + k)</b>.</p>',
      hint: 'Total opposition = R + k = 12 ÷ 1.5.', parts: [1, 2, 4, 6, 10].map(v => PT(v + ' Ω', v, 'SRC')), idle: [meterOf('Current', '—'), meterOf('Target', tgt + ' A')],
      calc(p) { const I = V / (R + p.k.v), ok = near(I, tgt, .02); return { ok, meters: [meterOf('Current', N2(I) + ' A', ok ? 'good' : 'bad'), meterOf('Target', tgt + ' A')], note: 'I = ' + V + ' ÷ (' + R + ' + ' + p.k.v + ') = <b>' + N2(I) + ' A</b>.', why: 'I = V ÷ (R + k), so R + k = ' + V + ' ÷ ' + tgt + ' = ' + V / tgt + ' and k = ' + k + ' Ω.', fail: I > tgt ? 'Too much current. A bigger k holds it back.' : 'Too little. Use a smaller k.' }; },
      coach(p, carry) { if (!p.k && !carry) return 'grab a gain value.'; if (!p.k) return 'place it in the socket.'; const I = V / (R + p.k.v); return near(I, tgt, .02) ? 'matches. Press Enter.' : I > tgt ? 'too much current. Pick a <b>bigger</b> k.' : 'too little current. Pick a <b>smaller</b> k.'; } }); },
  },
  { t: 'lab', tier: 2, hint: 'I = V ÷ (R + k).', q: '', gen() { const V = pick([12, 18, 24]), R = pick([2, 4]), k = pick([2, 4, 6, 8]), tgt = V / (R + k);
    return mk({ rig: benchRig({ left: { kind: 'BAT', label: V + ' V', sub: 'battery', info: 'The battery raises the voltage by ' + V + ' V.' }, right: { kind: 'BOX', label: 'A', sub: 'ammeter', info: 'Reads the loop current.' }, sockets: [{ id: 'k', label: 'k·I', x: 6 }], top: [{ x: 3, kind: 'R', label: R + ' Ω', sub: 'fixed', info: 'A ' + R + ' Ω resistor.' }] }),
      q: '<b>Build:</b> with a ' + V + ' V battery and R = ' + R + ' Ω, the loop current must be <b>' + N2(tgt) + ' A</b>. Choose the gain k of the dependent source.', teach: '<p>Same law: <b>V = I·R + k·I</b>. Solve for k first.</p>',
      parts: pickR([1, 2, 3, 4, 6, 8, 10], 5, k).map(v => PT(v + ' Ω', v, 'SRC')), idle: [meterOf('Current', '—'), meterOf('Target', N2(tgt) + ' A')],
      calc(p) { const I = V / (R + p.k.v), ok = near(I, tgt, .02); return { ok, meters: [meterOf('Current', N2(I) + ' A', ok ? 'good' : 'bad'), meterOf('Target', N2(tgt) + ' A')], note: 'I = ' + V + ' ÷ (' + R + ' + ' + p.k.v + ') = <b>' + N2(I) + ' A</b>.', why: 'R + k = V ÷ I = ' + V + ' ÷ ' + N2(tgt) + ' = ' + (R + k) + ', so k = ' + k + ' Ω.', fail: I > tgt ? 'Too much current.' : 'Too little current.' }; } }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'Ic = β × Ib. The drop on Rc is Ic × Rc. Vout = Vcc − drop.', q: '', gen() { const Ib = 40e-6, Rc = 1000, Vcc = 12, b = pick([50, 100, 150, 200]), tgt = Vcc - b * Ib * Rc;
    return mk({ rig: benchRig({ left: { kind: 'BAT', label: Vcc + ' V', sub: 'supply', info: 'The supply is ' + Vcc + ' V.' }, right: { kind: 'BOX', label: 'Vout', sub: 'voltmeter', info: 'Measures the output voltage.' }, sockets: [{ id: 'b', label: 'β', x: 4 }], top: [{ x: 7, kind: 'R', label: '1 kΩ', sub: 'Rc', info: 'The load resistor Rc.' }, { x: 2, kind: 'SRC', label: '40 µA', sub: 'Ib', info: 'The input current Ib is 40 µA.' }] }),
      q: '<b>Build:</b> a transistor-like <b>dependent current source</b> makes Ic = β × Ib with Ib = 40 µA through Rc = 1 kΩ from a 12 V supply. Choose β so that Vout = <b>' + N2(tgt) + ' V</b>.', teach: '<p>Now the dependent source is a <b>current</b>: <b>I<sub>c</sub> = β · I<sub>b</sub></b>. The resistor drops <b>Ic · Rc</b>, and what is left is <b>Vout = Vcc − Ic·Rc</b>.</p>',
      parts: [50, 100, 150, 200].map(v => PT('β = ' + v, v, 'SRC')), idle: [meterOf('Vout', '—'), meterOf('Target', N2(tgt) + ' V')],
      calc(p) { const Ic = p.b.v * Ib, Vo = Vcc - Ic * Rc, ok = near(Vo, tgt, .02); return { ok, meters: [meterOf('Ic', E(Ic, 'A')), meterOf('Vout', N2(Vo) + ' V', ok ? 'good' : 'bad'), meterOf('Target', N2(tgt) + ' V')], note: 'Ic = ' + p.b.v + ' × 40 µA = ' + E(Ic, 'A') + '. Drop = ' + N2(Ic * Rc) + ' V. Vout = <b>' + N2(Vo) + ' V</b>.', why: 'Vout = Vcc − β·Ib·Rc, so β·40 µA·1 kΩ = ' + N2(Vcc - tgt) + ' V and β = ' + b + '.', fail: Vo > tgt ? 'Vout too high. More gain pulls it down.' : 'Vout too low. Use less gain.' }; } }); } },
]);

/* ---- Level 8: bridges, delta-wye ---- */
function bridgeRig(o) { // R1 (3,2), R3 (3,4) on the left leg; R2 (7,2), Rx (7,4) on the right leg; meter between
  const fixed = [{ x: 1, y: 3, kind: 'BAT', label: o.V + ' V', sub: 'battery', info: 'The bridge is fed by ' + o.V + ' V.' }, { x: 5, y: 3, kind: 'BOX', label: 'V', sub: 'bridge meter', info: 'Reads the voltage between the two middle points.' },
    { x: 3, y: 2, kind: 'R', label: ohm(o.R1), sub: 'R1', info: 'R1 is ' + ohm(o.R1) + '.' }, { x: 3, y: 4, kind: 'R', label: ohm(o.R3), sub: 'R3', info: 'R3 is ' + ohm(o.R3) + '.' }, { x: 7, y: 2, kind: 'R', label: ohm(o.R2), sub: 'R2', info: 'R2 is ' + ohm(o.R2) + '.' }];
  return { cols: 11, rows: 7, sockets: [{ id: 'x', label: 'Rx', x: 7, y: 4 }], fixed, wires: [[[1, 3], [1, 1], [7, 1]], [[1, 3], [1, 5], [7, 5]], [[3, 1], [3, 5]], [[7, 1], [7, 5]], [[3, 3], [7, 3]]], start: { x: 5, y: 4 }, lever: { x: 9, y: 3 } };
}
const bridgeLab = (V, R1, R2, R3, guide) => { const Rx = R2 * R3 / R1; return mk({ rig: bridgeRig({ V, R1, R2, R3 }), q: '<b>Build:</b> balance the bridge so the meter in the middle reads <b>0 V</b>. Choose Rx.',
  teach: '<p>A <b>Wheatstone bridge</b> has two voltage dividers side by side. The middle meter reads the difference between them. It reads zero when the ratios match: <b>R3 ÷ R1 = Rx ÷ R2</b>, so <b>Rx = R2 × R3 ÷ R1</b>.</p>', hint: 'Rx = R2 × R3 ÷ R1.',
  parts: pickR([50, 100, 200, 300, 400, 600, 800, 1200], 5, Rx).map(RP), idle: [meterOf('Meter', '— V')],
  calc(p) { const vl = V * R3 / (R1 + R3), vr = V * p.x.v / (R2 + p.x.v), d = vl - vr, ok = Math.abs(d) < 0.01; return { ok, meters: [meterOf('Left middle', N2(vl) + ' V'), meterOf('Right middle', N2(vr) + ' V'), meterOf('Meter', N2(d) + ' V', ok ? 'good' : 'bad')], note: 'Left = ' + V + ' × ' + R3 + ' ÷ (' + R1 + ' + ' + R3 + ') = ' + N2(vl) + ' V. Right = ' + N2(vr) + ' V.', why: 'Balanced when R3 ÷ R1 = Rx ÷ R2: Rx = ' + R2 + ' × ' + R3 + ' ÷ ' + R1 + ' = ' + Rx + ' Ω.', fail: d > 0 ? 'The right side is lower. A bigger Rx raises it.' : 'The right side is higher. A smaller Rx lowers it.' }; },
  coach: guide ? (p, carry) => { if (!p.x && !carry) return 'grab a resistor.'; if (!p.x) return 'place it as Rx (lower right).'; const vl = V * R3 / (R1 + R3), vr = V * p.x.v / (R2 + p.x.v), d = vl - vr; return Math.abs(d) < .01 ? 'balanced. Press Enter.' : d > 0 ? 'the right is lower. Try a <b>bigger</b> Rx.' : 'the right is higher. Try a <b>smaller</b> Rx.'; } : undefined }); };
const dwLab = tier => ({ t: 'lab', tier, boss: true, hint: 'Each wye leg = (the two delta legs touching that corner multiplied) ÷ (sum of all three).', q: '', gen() {
  const sc = pick([1, 2]), d = shuffle([30, 60, 90]).map(v => v * sc), [Rab, Rbc, Rca] = d, S = Rab + Rbc + Rca, Ra = Rab * Rca / S, Rb = Rab * Rbc / S, Rc = Rbc * Rca / S;
  return mk({ rig: { cols: 11, rows: 7, sockets: [{ id: 'a', label: 'Ra', x: 8, y: 1 }, { id: 'b', label: 'Rb', x: 8, y: 3 }, { id: 'c', label: 'Rc', x: 8, y: 5 }], fixed: [{ x: 2, y: 1, kind: 'R', label: ohm(Rab), sub: 'Rab', info: 'Between corners a and b.' }, { x: 2, y: 3, kind: 'R', label: ohm(Rbc), sub: 'Rbc', info: 'Between corners b and c.' }, { x: 2, y: 5, kind: 'R', label: ohm(Rca), sub: 'Rca', info: 'Between corners c and a.' }, { x: 5, y: 3, kind: 'BOX', label: 'Δ → Y', sub: 'convert', info: 'Replace the triangle by an equivalent star.' }], wires: [], start: { x: 5, y: 5 }, lever: { x: 10, y: 3 } },
    q: '<b>Build:</b> replace the delta (Rab = ' + ohm(Rab) + ', Rbc = ' + ohm(Rbc) + ', Rca = ' + ohm(Rca) + ') with its equivalent wye. Fill the three legs. Ra sits at corner a, between Rab and Rca.',
    teach: '<p><b>Delta → wye:</b> each wye leg is the product of the two delta resistors that touch its corner, divided by the sum of all three. <b>Ra = Rab·Rca ÷ (Rab + Rbc + Rca)</b>. (If all three delta resistors are equal, each wye leg is a third of one.)</p>',
    parts: pickR([5, 10, 15, 20, 30, 45, 60], 6, [Ra, Rb, Rc]).map(RP), idle: [meterOf('Legs right', '0 of 3')],
    calc(p) { const g = [[p.a.v, Ra], [p.b.v, Rb], [p.c.v, Rc]].filter(x => near(x[0], x[1], .01)).length, ok = g === 3; return { ok, meters: [meterOf('Legs right', g + ' of 3', ok ? 'good' : '')], note: 'Sum of the delta = ' + S + ' Ω.', why: 'Ra = ' + Rab + '×' + Rca + ' ÷ ' + S + ' = ' + Ra + ' Ω, Rb = ' + Rab + '×' + Rbc + ' ÷ ' + S + ' = ' + Rb + ' Ω, Rc = ' + Rbc + '×' + Rca + ' ÷ ' + S + ' = ' + Rc + ' Ω.', fail: '' }; } }); } });
WL(8, 'Bridges and Delta–Wye', [
  Object.assign({ t: 'lab', tier: 1, hint: 'Rx = R2 × R3 ÷ R1.' }, { gen() { return bridgeLab(10, 100, 200, 300, true); } }),
  { t: 'lab', tier: 2, hint: 'Rx = R2 × R3 ÷ R1.', q: '', gen() { const R1 = pick([100, 200]), R2 = pick([100, 200, 300]), R3 = pick([100, 200, 300, 400]); return bridgeLab(pick([6, 12]), R1, R2, R3, false); } },
  dwLab(3),
]);

/* ---- Level 9: measuring V and I ---- */
const METER = [PT('Ammeter', 'A', 'BOX'), PT('Voltmeter', 'V', 'BOX')];
WL(9, 'Measuring Voltage and Current', [
  { t: 'lab', tier: 1, hint: 'An ammeter goes IN SERIES (the current flows through it). A voltmeter goes ACROSS the part (in parallel).', q: '', gen() {
    return mk({ rig: { cols: 11, rows: 7, sockets: [{ id: 's', label: 'in line', x: 3, y: 1 }, { id: 'p', label: 'across R', x: 7, y: 3 }], fixed: [{ x: 1, y: 3, kind: 'BAT', label: '12 V', sub: 'battery', info: '12 V battery.' }, { x: 7, y: 1, kind: 'R', label: '100 Ω', sub: 'load', info: 'The 100 Ω load.' }], wires: [[[1, 3], [1, 1], [9, 1], [9, 5], [1, 5], [1, 3]], [[7, 1], [7, 5]]], start: { x: 5, y: 3 }, lever: { x: 10, y: 3 } },
      q: '<b>Build:</b> measure the <b>current</b> through the 100 Ω load and the <b>voltage</b> across it. Put the right meter in each socket.', teach: '<p>An <b>ammeter</b> measures current, so the current must pass <b>through</b> it: connect it <b>in series</b>, and it should have almost no resistance. A <b>voltmeter</b> measures the push <b>between</b> two points: connect it <b>across</b> the part (in parallel), and it should have a huge resistance.</p>',
      hint: 'Series = in the line. Parallel = across the part.', parts: METER, idle: [meterOf('Reading', '—')],
      calc(p) { const good = p.s.v === 'A' && p.p.v === 'V'; let msg = '', st = '';
        if (good) msg = 'The ammeter reads I = 12 ÷ 100 = 0.12 A and the voltmeter reads 12 V.'; else if (p.s.v === 'V') msg = 'A voltmeter in series has huge resistance. It blocks the current: the loop reads about 0 A.'; else if (p.p.v === 'A') msg = 'An ammeter across the load is a near-short. The battery would push a huge current through it.'; else msg = 'Check both sockets.';
        return { ok: good, meters: [meterOf('Current', good ? '0.12 A' : p.s.v === 'V' ? '≈ 0 A' : '?', good ? 'good' : 'bad'), meterOf('Voltage', good ? '12 V' : '?', good ? 'good' : 'bad')], note: msg, why: 'Ammeters go in series (low resistance). Voltmeters go in parallel (high resistance).', fail: msg }; },
      coach(p, carry) { return 'the line socket (top left) carries the current. The bottom socket sits across the load.'; } }); } },
  { t: 'lab', tier: 2, hint: 'The meter must draw much less current than the circuit. Its resistance should be much bigger than R2.', q: '', gen() { const V = 10, R1 = pick([100e3, 200e3]), R2 = R1, err = 0.01;
    return mk({ rig: benchRig({ left: { kind: 'BAT', label: V + ' V', sub: 'battery', info: '10 V battery.' }, right: { kind: 'BOX', label: 'V', sub: 'reads across R2', info: 'The voltmeter you choose reads across R2.' }, sockets: [{ id: 'm', label: 'meter Rin', x: 6 }], top: [{ x: 3, kind: 'R', label: ohm(R1), sub: 'R1', info: 'R1.' }] }),
      q: '<b>Build:</b> two ' + ohm(R1) + ' resistors divide a 10 V battery, so R2 should show 5 V. Choose a voltmeter whose own resistance changes the reading by <b>less than 1%</b>.', teach: '<p>A real voltmeter has its own resistance <b>R<sub>in</sub></b>, which sits in parallel with what you measure and <b>loads</b> the circuit. The bigger R<sub>in</sub>, the smaller the error.</p>',
      parts: [10e3, 100e3, 1e6, 10e6].map(v => PT(ohm(v) + ' in', v, 'BOX')), idle: [meterOf('Reading', '—'), meterOf('True value', '5 V')],
      calc(p) { const Rp = par(R2, p.m.v), Vm = V * Rp / (R1 + Rp), e = Math.abs(Vm - 5) / 5, ok = e < err; return { ok, meters: [meterOf('Reading', N2(Vm) + ' V', ok ? 'good' : 'bad'), meterOf('Error', N2(e * 100) + '%', ok ? 'good' : 'bad'), meterOf('True value', '5 V')], note: 'R2 in parallel with the meter = ' + E(Rp, 'Ω') + '. Reading = ' + N2(Vm) + ' V.', why: 'The meter must be much bigger than the circuit it measures: ' + ohm(1e6) + ' or more here.', fail: 'The meter loads the circuit too much and reads low. Use a meter with a larger input resistance.' }; } }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'The ammeter adds its own resistance to the loop. It should be tiny compared with the circuit.', q: '', gen() { const V = 10, R = 50;
    return mk({ rig: benchRig({ left: { kind: 'BAT', label: V + ' V', sub: 'battery', info: '10 V battery.' }, right: { kind: 'R', label: R + ' Ω', sub: 'load', info: 'A 50 Ω load.' }, sockets: [{ id: 'a', label: 'ammeter Rin', x: 4 }, { id: 'v', label: 'volt Rin', x: 7 }] }),
      q: '<b>Build:</b> a 10 V battery drives a 50 Ω load (true current 0.2 A). Choose an <b>ammeter</b> (series, left) and a <b>voltmeter</b> (across the load, right) so <b>both</b> readings are within 1% of the truth.', teach: '<p>Both meters disturb the circuit a little. The ammeter should have <b>very small</b> resistance (so it barely adds to the loop). The voltmeter should have <b>very large</b> resistance (so it barely steals current).</p>',
      parts: [0.1, 5, 1e3, 1e6].map(v => PT(ohm(v), v, 'BOX')), idle: [meterOf('Current', '—'), meterOf('Voltage', '—')],
      calc(p) { const Rl = par(R, p.v.v), I = V / (p.a.v + Rl), Vm = I * Rl, eI = Math.abs(I - 0.2) / 0.2, eV = Math.abs(Vm - V) / V, okAll = eI < .01 && eV < .01;
        return { ok: okAll, meters: [meterOf('Current', N2(I) + ' A', eI < .01 ? 'good' : 'bad'), meterOf('Voltage', N2(Vm) + ' V', eV < .01 ? 'good' : 'bad')], note: 'Loop resistance = ' + N2(p.a.v) + ' + ' + E(Rl, 'Ω') + '.', why: 'Ammeter 0.1 Ω (tiny) and voltmeter 1 MΩ (huge) keep both errors under 1%.', fail: 'One of the meters disturbs the circuit too much.' }; } }); } },
]);

/* ---- Level 2, boss: power adds up to zero ---- */
WL(2, 'Power and the Passive Sign Convention', [
  { t: 'lab', tier: 3, boss: true, hint: 'The battery delivers 80 W. Load 1 absorbs 50 W. Load 2 must absorb the rest.', q: '', gen() { const V = pick([10, 20, 40]), I = pick([2, 4]), P = V * I, p1 = pick([P * 0.25, P * 0.5, P * 0.75]), tgt = P - p1;
    return dial({ rig: benchRig({ left: { kind: 'BAT', label: V + ' V', sub: 'delivers ' + P + ' W', info: 'The battery delivers ' + V + ' V × ' + I + ' A = ' + P + ' W.' }, right: { kind: 'BULB', label: p1 + ' W', sub: 'load 1 absorbs', info: 'Load 1 absorbs ' + p1 + ' W.' }, sockets: [{ id: 'r', label: 'load 2 power', x: 5 }] }),
      q: '<b>Build:</b> a ' + V + ' V battery delivers ' + I + ' A (that is ' + P + ' W). Load 1 absorbs ' + p1 + ' W. Choose the power that <b>load 2</b> must absorb so the whole circuit balances.', teach: '<p>Power is conserved: the powers of all parts <b>add up to zero</b> (with the passive sign convention, absorbing counts as + and delivering as −). So <b>the power delivered equals the total power absorbed</b>.</p>',
      parts: pickR([5, 10, 15, 20, 25, 30, 40, 50, 60].filter(v => v <= P), 5, tgt).map(v => PT(v + ' W', v, 'BULB')), read: p => p1 + p.v, target: P, tol: .001, label: 'Absorbed total', show: x => N2(x) + ' W', extra: p => [meterOf('Delivered', N2(P) + ' W')], note: (p, x) => 'Absorbed = ' + p1 + ' + ' + p.v + ' = ' + N2(x) + ' W. Delivered = ' + P + ' W.', why: 'Load 2 = ' + P + ' − ' + p1 + ' = ' + tgt + ' W.', fail: (x, t) => x > t ? 'The loads would absorb more than the battery delivers.' : 'The battery would deliver more than the loads absorb.' }); } },
]);

/* Workshop builds, part 4: levels 10-14 (node voltage, supernodes, mesh current, supermeshes, which method) */
const GP = (v, u) => PT(v + ' ' + u, v, u === 'V' ? 'BAT' : u === 'A' ? 'SRC' : 'R');
const vtext = N2;
// two-mesh rig: battery (or socket) on the left, own resistors on the top, a shared branch in the middle
function meshRig(o) {
  const fixed = [{ x: 3, y: 1, kind: 'R', label: ohm(o.R1), sub: 'R1 (mesh a)', info: 'R1 is only in the left mesh.' }, { x: 7, y: 1, kind: 'R', label: ohm(o.R2), sub: 'R2 (mesh b)', info: 'R2 is only in the right mesh.' }, { x: 9, y: 3, kind: 'BOX', label: 'A', sub: 'reads ib', info: 'Reads the right mesh current ib.' }];
  const sockets = [];
  if (o.vSocket) sockets.push({ id: 'v', label: 'V', x: 1, y: 3 }); else fixed.push({ x: 1, y: 3, kind: 'BAT', label: o.V + ' V', sub: 'battery', info: 'The battery raises the voltage by ' + o.V + ' V.' });
  if (o.shared) fixed.push(Object.assign({ x: 5, y: 3 }, o.shared)); else sockets.push({ id: 'r', label: o.sharedLabel || 'R3 (shared)', x: 5, y: 3 });
  (o.sockets || []).forEach(k => sockets.push(k));
  return { cols: 11, rows: 7, sockets, fixed, wires: [[[1, 3], [1, 1], [9, 1], [9, 3], [9, 5], [1, 5], [1, 3]], [[5, 1], [5, 5]]], start: { x: 4, y: 3 }, lever: { x: 10, y: 5 } };
}
const meshSolve = (V, R1, R2, R3) => { const det = (R1 + R3) * (R2 + R3) - R3 * R3; return { ia: V * (R2 + R3) / det, ib: V * R3 / det }; };

const MTH = [PT('Node voltage', 'N', 'BOX'), PT('Mesh current', 'M', 'BOX')];
const methodLab = (tier, cases, guide) => ({ t: 'lab', tier, boss: tier === 3, hint: 'Count the equations: nodes − 1 for node voltage, meshes for mesh current. Pick the smaller number. (Turn independent sources off first.)', q: '', gen() {

  cs.forEach(([n, m], i) => { const id = 'c' + i; fixed.push({ x: [3, 7, 5][i] || 5, y: 1, kind: 'BOX', label: 'Circuit ' + 'ABC'[i], sub: n + ' nodes · ' + m + ' meshes', info: 'Equations: node voltage needs ' + (n - 1) + ', mesh current needs ' + m + '.' }); slots.push({ id, label: 'method', want: (n - 1 < m ? 'Node voltage' : 'Mesh current') }); });
  const rig = { cols: 11, rows: 7, sockets: slots.map((s, i) => ({ id: s.id, label: s.label, x: [3, 7, 5][i], y: cs.length === 3 ? [3, 3, 5][i] : 3 })), fixed: fixed.map((f, i) => Object.assign(f, { y: cs.length === 3 ? [1, 1, 3][i] : 1 })), wires: [], start: { x: 5, y: 3 }, lever: { x: 10, y: 3 } };
  if (cs.length === 3) { rig.sockets = [{ id: 'c0', label: 'A', x: 3, y: 2 }, { id: 'c1', label: 'B', x: 7, y: 2 }, { id: 'c2', label: 'C', x: 5, y: 4 }]; rig.fixed = [{ x: 3, y: 1, kind: 'BOX', label: 'A', sub: cs[0][0] + ' nodes · ' + cs[0][1] + ' meshes', info: '' }, { x: 7, y: 1, kind: 'BOX', label: 'B', sub: cs[1][0] + ' nodes · ' + cs[1][1] + ' meshes', info: '' }, { x: 5, y: 3, kind: 'BOX', label: 'C', sub: cs[2][0] + ' nodes · ' + cs[2][1] + ' meshes', info: '' }]; rig.start = { x: 5, y: 5 }; }
  return slot({ rig, slots, parts: MTH, q: '<b>Build:</b> for each circuit, choose the method that needs <b>fewer equations</b>.', teach: '<p>Node voltage needs <b>nodes − 1</b> equations. Mesh current needs <b>meshes</b> equations. Pick the smaller count. If the circuit has current sources, node voltage is easier; voltage sources, mesh current.</p>', guide,
    why: cs.map((c, i) => 'ABC'[i] + ': nodes − 1 = ' + (c[0] - 1) + ', meshes = ' + c[1] + ' → ' + (c[0] - 1 < c[1] ? 'node voltage' : 'mesh current')).join('. ') + '.' }); } });
