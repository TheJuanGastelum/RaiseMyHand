<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Embedded Quest</title><style>:root{
  --bg:#0e1020; --panel:#181b36; --panel2:#232749; --line:#3d4380; --ink:#f3f4fb; --dim:#a4a9d6;
  --accent:#7ef7c1; --accent2:#ffe66d; --bad:#ff6b6b; --good:#7ef7c1; --accent-ink:#06210f;
  --mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,"Courier New",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.55}
body{min-height:100vh;background:
  radial-gradient(1200px 500px at 50% -10%, color-mix(in srgb,var(--accent) 10%,transparent), transparent 60%), var(--bg)}
#app{max-width:980px;margin:0 auto;padding:18px 16px 60px}
h1,h2,h3{font-family:var(--mono);letter-spacing:.02em;margin:0;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
code,.code{font-family:var(--mono);background:#0b0d1c;border:1px solid var(--line);border-radius:5px;padding:.05em .35em;font-size:.92em;color:#cfe;white-space:nowrap}
pre.code{white-space:pre;padding:10px 14px;overflow-x:auto;display:block;margin:8px 0;line-height:1.5}
.m{font-family:var(--mono);color:var(--accent2)}
sub,sup{line-height:0}
.btn{background:var(--panel2);border:3px solid var(--line);border-radius:10px;padding:9px 16px;font-weight:700;box-shadow:0 4px 0 #0007;transition:transform .08s,box-shadow .08s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0007}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.dim{color:var(--dim)}
.chip{display:inline-block;font:700 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--dim)}
.chip.boss{border-color:var(--bad);color:var(--bad)}
.chip.t1{border-color:#5fd3a0;color:#5fd3a0}.chip.t2{border-color:var(--accent2);color:var(--accent2)}.chip.t3{border-color:#ff9f5a;color:#ff9f5a}

/* home */
.hero{padding:26px 0 8px}
.hero h1{font-size:clamp(2rem,6vw,3.2rem);color:var(--accent);text-shadow:0 3px 0 #0008}
.hero p{max-width:60ch;color:var(--dim);margin:8px 0 0}
.hw{margin:14px 0;padding:12px 16px;border:3px dashed var(--accent2);border-radius:12px;background:#2a2610}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin:16px 0}
.stat b{display:block;font:700 1.5rem var(--mono);color:var(--accent2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:10px}
.card{position:relative;background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:14px 16px 14px;display:flex;flex-direction:column;gap:6px;text-align:left;box-shadow:0 5px 0 #0007}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .num{font:800 1.9rem var(--mono);color:var(--accent)}
.card h3{font-size:1.05rem}
.card p{margin:0;color:var(--dim);font-size:.9rem}
.card .meta{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--dim)}
.stars{font-size:1.2rem;letter-spacing:2px;color:#4a4f7a}
.stars .on{color:var(--accent2)}
.diff{display:inline-flex;gap:3px}.diff i{width:9px;height:9px;border-radius:2px;background:#39406e;display:block}.diff i.on{background:#ff9f5a}
.badge-hw{position:absolute;top:-10px;right:12px;background:var(--accent2);color:#2b2300;font:800 .72rem var(--mono);padding:2px 9px;border-radius:999px}
details.tools{margin-top:26px;border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--panel)}
details.tools summary{cursor:pointer;font-weight:700}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.picks label{display:inline-flex;gap:6px;align-items:center;border:2px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
textarea.out{width:100%;min-height:90px;background:#0b0d1c;color:var(--ink);border:2px solid var(--line);border-radius:8px;font:.85rem var(--mono);padding:8px}

/* play */
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.bar h2{font-size:1.1rem}
.bar .lvl{color:var(--accent)}
.hearts{font-size:1.5rem;letter-spacing:3px;color:var(--bad)}
.hearts .lost{color:#3a3f6c}
.score{font:800 1.2rem var(--mono);color:var(--accent2);min-width:5ch;text-align:right}
.combo{font:700 .85rem var(--mono);color:var(--accent);min-height:1.2em}
.stage{border:3px solid var(--line);border-radius:14px;overflow:hidden;background:#070815;margin-bottom:12px;position:relative}
.stage canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.panel{background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:16px 18px}
.q{font-size:1.15rem;margin:6px 0 12px}
.q p{margin:0 0 8px}
.timer{height:8px;border-radius:6px;background:#242850;overflow:hidden;margin:8px 0}
.timer i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transition:background .3s}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:720px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--panel2);border:3px solid var(--line);border-radius:12px;padding:11px 14px;min-height:54px;box-shadow:0 4px 0 #0007}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font:800 .95rem var(--mono);color:var(--accent);border:2px solid var(--line);border-radius:6px;min-width:1.9em;text-align:center;padding:0 4px;margin-top:1px}
.opt.wrong{border-color:var(--bad);background:#3a1a2a;text-decoration:line-through;opacity:.7}
.opt.right{border-color:var(--good);background:#143a30}
.numrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numrow input{font:700 1.4rem var(--mono);width:11ch;background:#0b0d1c;color:var(--accent2);border:3px solid var(--line);border-radius:10px;padding:8px 12px}
.numrow .u{font:700 1.2rem var(--mono);color:var(--dim)}
.given{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.given span{font:700 .95rem var(--mono);background:#0b0d1c;border:2px solid var(--line);border-radius:8px;padding:3px 10px;color:var(--accent2)}
.tray,.slots,.seq{display:flex;gap:8px;flex-wrap:wrap}
.tray{min-height:54px;padding:8px;border:2px dashed var(--line);border-radius:12px;margin-bottom:10px}
.pill{background:var(--panel2);border:3px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:700;box-shadow:0 3px 0 #0007}
.pill.sel{border-color:var(--accent2);background:#3a3512;transform:translateY(-2px)}
.pill.ok{border-color:var(--good)}.pill.no{border-color:var(--bad);background:#3a1a2a}
.slotrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(130px,230px);gap:10px;align-items:center;margin:6px 0}
.slot{min-height:46px;border:3px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:4px;background:#0b0d1c}
.slot.over{border-color:var(--accent2)}
.slot .pill{box-shadow:none}
.sortcard{font:800 clamp(1rem,5vw,1.5rem) var(--mono);text-align:center;padding:18px 10px;border:3px solid var(--accent);border-radius:14px;background:#0b0d1c;margin:8px 0 12px;min-height:80px;display:flex;align-items:center;justify-content:center;white-space:pre-wrap;word-break:break-word;font-size:clamp(1rem,5vw,1.5rem)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.sortprog{display:flex;gap:5px;margin-bottom:6px}.sortprog i{flex:1;height:7px;border-radius:4px;background:#2b3060}.sortprog i.d{background:var(--accent)}
.wire{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px clamp(28px,12vw,90px);margin:10px 0}
.wire svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.wire .col{display:flex;flex-direction:column;gap:10px;z-index:1}
.wire .pill{text-align:left}
.reg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.bit{display:flex;flex-direction:column;align-items:center;gap:4px}
.bit button{width:56px;height:62px;font:800 1.7rem var(--mono);border-radius:10px;border:3px solid var(--line);background:#0b0d1c;color:#5a6296;box-shadow:0 4px 0 #0007}
.bit button.on{background:var(--accent2);color:#2b2300;border-color:var(--accent2)}
.bit button.bad{border-color:var(--bad)}
.bit small{font:700 .72rem var(--mono);color:var(--dim)}
.regread{text-align:center;font:700 1rem var(--mono);color:var(--dim)}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;border:3px solid;font-size:1rem}
.fb.good{border-color:var(--good);background:#10332b}
.fb.bad{border-color:var(--bad);background:#361a28}
.fb.info{border-color:var(--accent2);background:#2a2610}
.fb b.t{display:block;font:800 .8rem var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.prog{display:flex;gap:6px;margin:0 0 10px}
.prog i{flex:1;height:10px;border-radius:5px;background:#2b3060}.prog i.d{background:var(--accent)}.prog i.c{background:var(--accent2)}.prog i.b{background:#ff9f5a}
.concept{margin:0 0 12px;padding:10px 14px;border-left:5px solid var(--accent);background:#10152e;border-radius:0 10px 10px 0;color:var(--dim);font-size:.98rem}
.concept b{color:var(--ink)}
/* results */
.res{text-align:center;padding:24px 16px}
.res h2{font-size:2rem}
.res .big{font-size:3rem;letter-spacing:6px;margin:8px 0}
.res table{margin:12px auto;border-collapse:collapse;text-align:left}
.res td{padding:4px 14px;border-bottom:1px solid var(--line)}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pop{animation:pop .3s}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sr{position:absolute;left:-9999px}

.seg{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.tr{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin:8px 0 12px}
.trow{background:#0b0d1c;border:2px solid var(--line);border-radius:10px;padding:7px 12px}
.trow .rt{display:block;font:700 .85rem var(--mono);color:var(--accent2)}
.trow .kt{display:block;font-size:.95rem}
details.real{margin-top:8px}
details.real summary{cursor:pointer;color:var(--dim)}
.card .chip{align-self:flex-start}

/* ---- keyboard + lessons ---- */
.kfocus{outline:3px dashed var(--accent2);outline-offset:3px}
.opt.kfocus{border-color:var(--accent2);background:#2a2f5e}
.slot.kfocus{border-color:var(--accent2)}
.keyhint,.keyline{margin-top:12px;font:700 .82rem var(--mono);color:var(--dim);letter-spacing:.02em}
.kcap{display:block;font:800 .78rem var(--mono);color:var(--accent);margin-bottom:2px}
.buckets .btn{display:flex;flex-direction:column;align-items:center;gap:2px}
.lesson .ltitle{font-size:1.25rem;margin:10px 0 8px;color:var(--accent2)}
.lbody p{margin:0 0 .75em}
.lbody ul,.lbody ol{margin:.3em 0 .8em;padding-left:1.3em}
.lbody li{margin:.2em 0}
.formula{margin:.7em 0;padding:10px 14px;background:#0b0d1c;border:2px solid var(--accent);border-radius:10px;font:700 1.05rem var(--mono);color:var(--accent2);text-align:center;overflow-x:auto}
.example{margin:.8em 0;padding:10px 14px;background:#10152e;border-left:5px solid var(--accent2);border-radius:0 10px 10px 0}
.example b.eh{display:block;color:var(--accent2);font:800 .78rem var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.trap{margin:.8em 0;padding:10px 14px;background:#2a1626;border-left:5px solid var(--bad);border-radius:0 10px 10px 0}
.trap b.eh{display:block;color:var(--bad);font:800 .78rem var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.anabox{border-left-color:#4aa3ff}
details.review{margin:0 0 10px;border:2px dashed var(--line);border-radius:10px;padding:6px 12px}
details.review summary{cursor:pointer;font-weight:700;color:var(--dim)}

/* ---- workshop (lab) ---- */
.labwrap{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.labteach{background:#0f1230;border:1px solid var(--line);border-left:5px solid var(--accent2);border-radius:10px;padding:10px 14px;font-size:.95rem}
.labteach .eh,.coach b{display:block;font:800 .7rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent2);margin-bottom:2px}
.labteach p{margin:.3em 0}
.lab{position:relative;width:100%;max-width:640px;margin:0 auto;border:3px solid var(--line);border-radius:14px;overflow:hidden;container-type:inline-size;
  background:linear-gradient(#0b0d1c88,#0b0d1c88),repeating-linear-gradient(0deg,transparent 0 calc(100%/var(--rows) - 1px),#ffffff0d calc(100%/var(--rows) - 1px) calc(100%/var(--rows))),repeating-linear-gradient(90deg,transparent 0 calc(100%/var(--cols) - 1px),#ffffff0d calc(100%/var(--cols) - 1px) calc(100%/var(--cols))),#12142b}
.lab.won{border-color:var(--good);box-shadow:0 0 24px #7ef7c155}
.labwires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.labwires polyline{fill:none;stroke:#4a528f;stroke-width:.09;stroke-linecap:round;stroke-linejoin:round}
.lab.live .labwires polyline{stroke:var(--accent2);filter:drop-shadow(0 0 .08px var(--accent2));stroke-dasharray:.35 .25;animation:labflow .7s linear infinite}
@keyframes labflow{to{stroke-dashoffset:-.6}}
@media (prefers-reduced-motion:reduce){.lab.live .labwires polyline{animation:none;stroke-dasharray:none}}
.ent{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2%;border-radius:10px;font-size:max(9px,2.15cqw);line-height:1.1;text-align:center;color:var(--ink);cursor:pointer}
.ent .gly{width:78%;height:auto;color:var(--dim)}
.ent b{font:800 1em var(--mono);white-space:nowrap}
.ent small{font:600 .85em var(--mono);color:var(--dim);white-space:nowrap}
.ent.bin{background:#2a2447;border:2px solid #5a4d9a;color:#d9ccff}
.ent.bin .gly{color:#b9a8ff}
.ent.socket{border:2px dashed var(--accent2);background:#ffe66d12}
.ent.socket.full{border-style:solid;background:#ffe66d22}
.ent.socket .gly{color:var(--accent2)}
.ent.socket .q{font-size:1.6em;color:var(--accent2)}
.ent.fixed{background:#18305a;border:2px solid #3f6fc4}
.ent.fixed .gly{color:#8fb8ff}
.ent.fixed.k-LED .gly{color:#ff9fb3}.ent.fixed.k-BULB .gly{color:#ffe66d}
.ent.lever{background:#3a1d2c;border:2px solid #d4546e}
.ent.lever i{display:block;width:16%;height:38%;background:#ff6b8a;border-radius:4px;transform:rotate(-24deg);margin-bottom:4%}
.ent.target{outline:3px solid var(--accent);outline-offset:-1px;z-index:2}
.me{position:absolute;transition:left .11s linear,top .11s linear;z-index:3;pointer-events:none;display:flex;align-items:center;justify-content:center}
@media (prefers-reduced-motion:reduce){.me{transition:none}}
.me .body{width:46%;height:70%;background:linear-gradient(#ffcf8a 0 38%,#ff7b54 38% 100%);border:2px solid #0008;border-radius:6px 6px 4px 4px;position:relative}
.me .body::before,.me .body::after{content:"";position:absolute;top:18%;width:14%;height:14%;background:#1a1228;border-radius:50%}
.me .body::before{left:24%}.me .body::after{right:24%}
.me.f-u .body::before,.me.f-u .body::after{display:none}
.me.f-l .body::after{display:none}.me.f-r .body::before{display:none}
.me .carry{position:absolute;bottom:78%;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;background:#2a2447;border:2px solid #b9a8ff;border-radius:7px;padding:1px 5px;font-size:max(8px,1.9cqw);color:#d9ccff;white-space:nowrap}
.me .carry:empty{display:none}
.me .carry .gly{width:2.6em;height:auto;color:#b9a8ff}.me .carry b{font:800 1em var(--mono)}
.facemark{position:absolute;border:2px dashed #7ef7c155;border-radius:8px;pointer-events:none;opacity:0}
.facemark.on{opacity:1}
.labtip{font:700 .85rem var(--mono);color:var(--accent);min-height:1.4em;text-align:center}
.labmeters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.meter{background:#0b0d1c;border:2px solid var(--line);border-radius:10px;padding:4px 12px;min-width:7.5em;text-align:center}
.meter small{display:block;font:700 .68rem var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.meter b{font:800 1.15rem var(--mono)}
.meter.good{border-color:var(--good);color:var(--good)}.meter.bad{border-color:var(--bad);color:var(--bad)}
.labnote{background:#0f1230;border-radius:10px;padding:8px 14px;font-size:.95rem;min-height:2.6em}
.labnote .coach{margin-top:6px;color:var(--accent2)}.labnote .coach b{display:inline;margin:0 6px 0 0}
.labpad{display:none;grid-template-columns:repeat(4,1fr);gap:6px}
.labpad button{padding:12px 0;border-radius:10px;border:2px solid var(--line);background:#232749;font-weight:800}
.labpad .act{grid-column:span 2}
@media (pointer:coarse){.labpad{display:grid}}

/* ---- analogy switch, always on screen ---- */
#app{padding-top:58px}
.anabtn{position:fixed;top:10px;right:12px;z-index:50;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:#181b36ee;color:var(--ink);font:800 .8rem var(--mono);letter-spacing:.04em;box-shadow:0 3px 0 #0007;backdrop-filter:blur(4px)}
.anabtn[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.anabtn:hover{background:#232749}
.ana-off .anaonly{display:none!important}
.q code,.labteach code,.labnote code,.lbody code,.fb code{white-space:normal;overflow-wrap:anywhere}

.hubbtn{position:fixed;top:10px;left:12px;z-index:50;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:#181b36ee;color:var(--ink);font:800 .8rem var(--mono);letter-spacing:.04em;text-decoration:none;box-shadow:0 3px 0 #0007}

:root{--accent:#8ec5ff}</style></head><body><main id="app"></main><script>const ANA_L = {"1": {"key": "An embedded system is the brain inside one gadget, like the brain in a smart oven. It does one job. There are three kinds of chip. One is wired for a single job and never changes (ASIC). One is a reprogrammable brain with fixed doors and switches (microcontroller, this class). One is a laptop brain that runs anything (CPU).", "map": [["ASIC", "A doorbell with one fixed ring. Never changes."], ["Microcontroller", "A smart-home brain you can reprogram."], ["General CPU", "A laptop. Runs any app."], ["Embedded", "A brain built into one gadget."]]}, "2": {"key": "The brain has two separate notebooks. One holds the instructions and never changes while running. The other holds notes that change constantly. A control panel of labeled switches runs the house. Those switches are SFRs, names like <code>DDRB</code> and <code>TCNT0</code>. Write to one and you flip a real switch.", "map": [["Program Flash", "The instruction manual."], ["SRAM", "A whiteboard, wiped when the power goes out."], ["EEPROM", "A sticky note that stays."], ["SFR", "A labeled switch on the control panel."], ["Harvard design", "Two notebooks, read at the same time."], ["16 MHz clock", "A heartbeat: 16 million per second."]]}, "3": {"key": "Each pin needs three settings, like a door. <code>DDR</code>: is it a doorbell button (input) or a lamp (output)? <code>PORT</code>: if it is a lamp, on or off. If it is a button, add a spring. <code>PIN</code>: look and see what the door is actually doing right now.", "map": [["<code>DDRx</code>", "Input or output."], ["<code>PORTx</code>", "On or off (or a spring)."], ["<code>PINx</code>", "What is really happening."], ["One bit", "One door. A port has 8."]]}, "4": {"key": "One register controls eight doors at once. If you write the whole register, you accidentally reset the other seven doors. So change one door at a time. OR turns it on. AND with NOT turns it off. XOR flips it. A shift picks which door.", "map": [["<code>|= (1&lt;&lt;N)</code>", "Turn door N on, leave the rest."], ["<code>&amp;= ~(1&lt;&lt;N)</code>", "Turn door N off."], ["<code>^= (1&lt;&lt;N)</code>", "Flip door N."], ["Mask", "A stencil covering doors you do not want to touch."], ["Nibble", "Half a row: 4 doors."]]}, "5": {"key": "A pin with nothing connected is like a loose door swinging in the wind. It reads random things. A pull-up is a gentle spring that holds it shut (reads 1). Pressing the button pulls it open (reads 0). That is backwards from what you would guess. Polling means checking the door every so often. If someone rings and leaves while you are busy, you miss it.", "map": [["Floating pin", "A loose door in the wind."], ["Pull-up", "A spring holding the door shut."], ["Active-low", "Pressed is 0. Not pressed is 1."], ["Polling", "Walking to the door to look."], ["Missed press", "Someone rang and left while you were busy."]]}, "6": {"key": "Timer0 is the oven timer inside the brain. It counts up by itself, forever. In Normal mode it always counts to 255, then starts over. In CTC mode you pick the number it counts to. Every timer shares the same 16 MHz heartbeat. The prescaler just slows how often it counts. Prescaler 000 means unplugged.", "map": [["<code>TCNT0</code>", "The oven timer's display."], ["Normal mode", "Always counts to 255."], ["CTC mode", "Counts to the number you set."], ["Prescaler", "A gear that slows the counting."], ["Flag (TOV0 / OCF0A)", "The timer's ding."], ["CS bits = 000", "Timer unplugged."]]}, "7": {"key": "One formula turns I want this delay into put this number in the register. It is like turning bake 20 minutes into the timer's setting. Timer1 is the same idea with a bigger dial. It has 16 bits instead of 8, so it counts to 65,535 instead of 255. Longer delays fit in one pass.", "map": [["Delay formula", "Turns minutes into a dial setting."], ["Timer0 (8-bit)", "A small dial. Max 255."], ["Timer1 (16-bit)", "A big dial. Max 65,535."], ["High byte first", "Write the big digits before the small ones."], ["Loop + flag", "Set 1 minute and count the dings."]]}, "8": {"key": "Polling is walking to the door every few seconds. An interrupt is a doorbell. You keep doing chores and the bell tells you. But the bell only works if three things are on: the main breaker for bells (<code>sei</code>), that doorbell's own switch, and someone actually pressing it. PCINT is one bell that rings for any of 8 doors in a group, and it does not say which.", "map": [["Interrupt", "A doorbell."], ["ISR", "What you do when it rings."], ["<code>sei()</code>", "The main breaker for all bells."], ["<code>PCICR</code> / <code>PCMSK</code>", "This bell's group and door switches."], ["PCINT", "One bell for 8 doors."], ["<code>volatile</code>", "A note that may change while you are away. Re-read it."]]}, "9": {"key": "Same doorbell idea, now for the oven timer. Instead of checking its ding yourself, flip one switch (a bit in <code>TIMSK0</code>) and the oven rings the doorbell when it is done. Normal mode uses the overflow bell. CTC mode uses the compare-match bell. If you enable a bell but never write what to do when it rings, the house freezes.", "map": [["<code>TIMSK0</code>", "Connects the oven's ding to the doorbell."], ["<code>TOIE0</code> / OVF", "The overflow bell."], ["<code>OCIE0A</code> / COMPA", "The compare-match bell."], ["No ISR written", "The bell rings and nobody answers."]]}, "10": {"key": "A state machine is a washing machine cycle. It is always in exactly one step: fill, wash, rinse or spin. Certain events move it to the next step. A mechanical button is like a flickery doorbell. One push can ring 10 times. Debounce states pause briefly after each ring so the flicker settles.", "map": [["State", "The washer's current step."], ["Transition", "The event that moves to the next step."], ["Bounce", "A flickery doorbell button."], ["Debounce", "Wait a moment before trusting it."], ["enum + switch", "A list of step names and what to do in each."]]}, "11": {"key": "The LCD is a sign board with its own tiny brain. You never draw pixels. You slide it notes through a mail slot, four letters at a time, and knock (the Enable pulse). Slide too fast and it ignores you. No error, it just does not change. Waking it up needs an exact routine.", "map": [["RS", "Note type: text or command."], ["R/W", "Always write here."], ["E (Enable)", "The knock."], ["D4-D7", "The four-letter mail slot."], ["Delays", "Wait for the board to finish reading."], ["4-bit mode", "Send half a note, knock, send the other half."]]}, "12": {"key": "A pin cannot give an in-between voltage. So flip a lamp on and off super fast, like a dimmer switch. The longer it stays on in each flicker, the brighter it looks. Duty cycle is the fraction of time it is on. The timer counts up like a ramp, and a line (<code>OCR1x</code>) says when to switch off.", "map": [["PWM", "A dimmer. Flicker fast."], ["Duty cycle", "Fraction of time on."], ["TOP", "Length of one flicker."], ["<code>OCR1x</code>", "When in the flicker the lamp goes off."], ["Effective voltage", "How bright it looks."]]}, "13": {"key": "Two numbers run the show. How fast the flicker repeats (TOP), and how long each flicker is on (duty). Send that to a motor driver chip (L293). On-time is the speed. Two direction pins pick forward or reverse, like a garage door going up or down. The H-bridge is four switches that swap which wire gets power.", "map": [["TOP / frequency", "How fast flickers repeat."], ["Duty", "Motor speed."], ["L293", "The motor's power box."], ["EN pin", "Takes the flicker (speed)."], ["A pins", "Direction."], ["H-bridge", "Four switches that reverse the motor."]]}};
/* ===== Shared game kit: level select, challenge runner, scoring, progress ===== */
const Kit = (() => {
  const TEST = /[?&]test\b/.test(location.search);
  const $ = (s, r) => (r || document).querySelector(s);
  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (k === 'class') e.className = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
    return e;
  }
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const fmt = (x, d = 3) => { const r = Number(x.toFixed(d)); return String(r); };

  let cfg, S, appEl, run = null;
  const TIER_PTS = { 1: 100, 2: 150, 3: 250 };

  /* ---------- storage ---------- */
  const key = () => 'studygame_' + cfg.id;
  function load() { try { return JSON.parse(localStorage.getItem(key())) || {}; } catch (e) { return {}; } }
  function save() { try { localStorage.setItem(key(), JSON.stringify(S)); } catch (e) {} }

  /* ---------- sound ---------- */
  let AC = null;
  function beep(freq, dur, type, vol) {
    if (S.mute) return;
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type || 'square'; o.frequency.value = freq; g.gain.value = vol || 0.05;
      o.connect(g); g.connect(AC.destination); o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
      o.stop(AC.currentTime + dur);
    } catch (e) {}
  }
  const sfx = {
    good() { beep(660, .09); setTimeout(() => beep(880, .12), 80); },
    bad() { beep(160, .25, 'sawtooth', .06); },
    win() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, .18), i * 110)); },
    lose() { [300, 240, 180].forEach((f, i) => setTimeout(() => beep(f, .25, 'sawtooth'), i * 160)); },
  };

  const skin = () => cfg.skin(!!S.ana);
  const lvTitle = l => (S.ana && l.ana && l.ana.title) ? l.ana.title : l.topic;
  /* ---------- helpers ---------- */
  function hwList() {
    const m = /hw=([\d,]+)/.exec(location.hash);
    return m ? m[1].split(',').map(Number).filter(Boolean) : [];
  }
  function parseNum(s) {
    s = String(s).trim().replace(/,/g, '').replace(/[×x]/g, '*');
    if (/^-?\d*\.?\d+\s*\/\s*-?\d*\.?\d+$/.test(s)) { const [a, b] = s.split('/'); return parseFloat(a) / parseFloat(b); }
    if (!/^-?\d*\.?\d+(e-?\d+)?$/i.test(s)) return NaN;
    return parseFloat(s);
  }
  function starsHtml(n) { return '<span class="stars" aria-label="' + n + ' of 3 stars">' + [1, 2, 3].map(i => '<span class="' + (i <= n ? 'on' : '') + '">★</span>').join('') + '</span>'; }
  function diffDots(level) {
    const d = level.diff || 1;
    return h('span', { class: 'diff', role: 'img', title: 'Difficulty ' + d + ' of 5', 'aria-label': 'Difficulty ' + d + ' of 5' }, [1, 2, 3, 4, 5].map(i => h('i', { class: i <= d ? 'on' : '' })));
  }

  /* ---------- keyboard: WASD / arrows everywhere ---------- */
  const DIR = { ArrowUp: 'u', w: 'u', W: 'u', ArrowDown: 'd', s: 'd', S: 'd', ArrowLeft: 'l', a: 'l', A: 'l', ArrowRight: 'r', d: 'r', D: 'r' };
  function focusables() { return [...appEl.querySelectorAll('button:not([disabled]):not([tabindex="-1"]), summary, input:not([disabled]), textarea')].filter(el => el.offsetParent !== null); }
  function moveFocus(dir) {
    const list = focusables(); if (!list.length) return false;
    const cur = document.activeElement && list.includes(document.activeElement) ? document.activeElement : null;
    if (!cur) { list[0].focus(); return true; }
    const r0 = cur.getBoundingClientRect(), cx = r0.left + r0.width / 2, cy = r0.top + r0.height / 2;
    let best = null, bd = 1e9;
    for (const el of list) {
      if (el === cur) continue;
      const r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2, dx = x - cx, dy = y - cy;
      const ok = dir === 'u' ? dy < -4 : dir === 'd' ? dy > 4 : dir === 'l' ? dx < -4 : dx > 4;
      if (!ok) continue;
      const along = dir === 'u' || dir === 'd' ? Math.abs(dy) : Math.abs(dx), across = dir === 'u' || dir === 'd' ? Math.abs(dx) : Math.abs(dy);
      const d = along + across * 2.2;
      if (d < bd) { bd = d; best = el; }
    }
    if (best) { best.focus(); best.scrollIntoView({ block: 'nearest' }); return true; }
    return false;
  }
  function typing(e) { const t = e.target; return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT'); }
  document.addEventListener('keydown', e => {
    if (!appEl || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target && e.target.id === 'anaBtn') return;
    if (!typing(e) && (e.key === 'n' || e.key === 'N')) { e.preventDefault(); setAna(!S.ana); return; }
    if (typing(e)) { if (e.key === 'Escape') e.target.blur(); return; }
    const dir = DIR[e.key];
    if (run && !run.done) {
      if (run.mode === 'lesson') {
        if (e.key === 'Enter' || e.key === ' ' || dir === 'r') { e.preventDefault(); const g = $('#go'); if (g) g.click(); return; }
        if (e.key === 'Escape') { e.preventDefault(); leave(); return; }
        return;
      }
      if (e.key === 'Escape') { e.preventDefault(); leave(); return; }
      if (run.mode === 'chal' && !run.answered) {
        if ((e.key === 'h' || e.key === 'H')) { const hb = $('#hintbtn'); if (hb && !hb.disabled) { e.preventDefault(); hb.click(); } return; }
        if ((e.key === 'l' || e.key === 'L') && !dir) { const d = $('#reviewlesson'); if (d) { e.preventDefault(); d.open = !d.open; } return; }
        if (run.b && run.b.key && run.b.key(e, dir)) { e.preventDefault(); return; }
        return;
      }
      if (run.answered) {
        if (e.key === 'Enter' || e.key === ' ' || dir === 'r') { const nb = $('#nextbtn'); if (nb) { e.preventDefault(); nb.click(); } return; }
      }
    }
    if (run && run.done) {
      if (e.key === 'Escape') { e.preventDefault(); home(); return; }
      if (dir) { if (moveFocus(dir)) e.preventDefault(); return; }
      return;
    }
    if (dir && !e.shiftKey) { if (moveFocus(dir)) e.preventDefault(); }
  });
  function leave() { if (!TEST && run && !run.done && !confirm('Leave this level? Progress in this run is lost.')) return; home(); }

  /* ---------- home / level select ---------- */
  function home() {
    stopRun();
    document.title = cfg.title;
    const hw = hwList();
    const doneAll = cfg.levels.filter(l => (S.levels[l.n] || {}).done).length;
    const totalStars = cfg.levels.reduce((a, l) => a + ((S.levels[l.n] || {}).stars || 0), 0);
    const totalScore = cfg.levels.reduce((a, l) => a + ((S.levels[l.n] || {}).best || 0), 0);
    appEl.replaceChildren();
    const hero = h('div', { class: 'hero' }, h('h1', null, cfg.title), h('p', null, skin().tagline));
    appEl.append(hero);
    if (hw.length) {
      const doneHw = hw.filter(n => (S.levels[n] || {}).done).length;
      appEl.append(h('div', { class: 'hw', role: 'status' }, h('b', null, 'Assigned: levels ' + hw.join(' and ') + '.'), ' ', doneHw + ' of ' + hw.length + ' complete.'));
    }
    appEl.append(h('div', { class: 'stats' },
      h('div', { class: 'stat' }, h('b', null, doneAll + '/' + cfg.levels.length), 'levels cleared'),
      h('div', { class: 'stat' }, h('b', null, totalStars + '/' + cfg.levels.length * 3), 'stars'),
      h('div', { class: 'stat' }, h('b', null, totalScore), 'total best score')));
    const seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Analogy mode' },
      h('span', { class: 'dim' }, 'Analogy mode:'),
      h('button', { class: 'btn' + (S.ana ? ' primary' : ''), 'aria-pressed': S.ana ? 'true' : 'false', onclick: () => setAna(true) }, 'On: ' + cfg.modes.on),
      h('button', { class: 'btn' + (!S.ana ? ' primary' : ''), 'aria-pressed': !S.ana ? 'true' : 'false', onclick: () => setAna(false) }, 'Off: ' + cfg.modes.off));
    appEl.append(seg);
    appEl.append(h('div', { class: 'row', style: 'margin-top:10px' },
      h('label', { class: 'row' }, h('input', { type: 'checkbox', checked: !!S.calm, onchange: e => { S.calm = e.target.checked; save(); } }), cfg.timer ? ' Calm mode (no timers)' : ' Calm mode'),
      h('label', { class: 'row' }, h('input', { type: 'checkbox', checked: !!S.mute, onchange: e => { S.mute = e.target.checked; save(); } }), ' Mute sound')));
    const grid = h('div', { class: 'grid', role: 'list' });
    for (const l of cfg.levels) {
      const p = S.levels[l.n] || {};
      const c = h('button', { class: 'card', role: 'listitem', onclick: () => start(l), 'aria-label': 'Level ' + l.n + ': ' + lvTitle(l) + (p.done ? ', cleared, ' + p.stars + ' stars' : '') },
        hw.includes(l.n) ? h('span', { class: 'badge-hw' }, 'ASSIGNED') : null,
        h('div', { class: 'num' }, String(l.n).padStart(2, '0')),
        h('h3', null, lvTitle(l)),
        S.ana && l.ana ? h('p', null, h('b', null, 'Topic: '), l.topic) : null,
        h('p', null, S.ana && l.ana ? l.ana.mission : l.blurb),
        l.lec ? h('div', { class: 'chip' }, 'Lecture ' + l.lec) : null,
        h('div', { class: 'meta' }, diffDots(l), h('span', { class: 'sp' }), h('span', { html: starsHtml(p.stars || 0) }), p.best ? h('span', null, p.best + ' pts') : h('span', null, l.chals.length + ' challenges')));
      grid.append(c);
    }
    appEl.append(h('p', { class: 'dim keyline' }, 'Move with W A S D or the arrow keys. Enter or Space opens a level.'));
    appEl.append(grid);

    // teacher / progress tools
    const picks = h('div', { class: 'picks' });
    const out = h('textarea', { class: 'out', readonly: true, 'aria-label': 'Assignment link' });
    function upd() {
      const sel = [...picks.querySelectorAll('input:checked')].map(i => i.value);
      out.value = sel.length ? location.href.split('#')[0] + '#hw=' + sel.join(',') : '';
    }
    cfg.levels.forEach(l => picks.append(h('label', null, h('input', { type: 'checkbox', value: l.n, onchange: upd }), 'Level ' + l.n)));
    const rep = h('textarea', { class: 'out', readonly: true, 'aria-label': 'Progress report' });
    function report() {
      rep.value = cfg.title + ' progress\n' + cfg.levels.map(l => { const p = S.levels[l.n] || {}; return 'Level ' + l.n + ' (' + l.topic + '): ' + (p.done ? p.stars + ' stars, best ' + p.best + ' pts, ' + p.plays + ' plays' : 'not cleared'); }).join('\n');
      rep.select();
    }
    appEl.append(h('details', { class: 'tools' }, h('summary', null, 'Assign levels and progress report'),
      h('p', { class: 'dim' }, 'Pick levels to assign. The link below opens this game with those levels highlighted as homework. It only works for students once the file is hosted somewhere they can reach.'),
      picks, out,
      h('p', null, h('button', { class: 'btn', onclick: report }, 'Show my progress report')), rep,
      h('p', null, h('button', { class: 'btn ghost', onclick: () => { if (confirm('Erase all saved progress on this device?')) { S.levels = {}; save(); home(); } } }, 'Reset progress'))));
    window.scrollTo(0, 0);
    if (!TEST) { const cards = [...grid.querySelectorAll('button.card')]; const nxt = cfg.levels.findIndex(l => !(S.levels[l.n] || {}).done); (cards[nxt < 0 ? 0 : nxt] || cards[0]).focus({ preventScroll: true }); }
  }

  /* ---------- run lifecycle ---------- */
  function stopRun() {
    if (run) { clearInterval(run.tick); if (run.stage && run.stage.destroy) run.stage.destroy(); run = null; }
  }

  function start(level) {
    stopRun();
    document.title = 'Level ' + level.n + ' · ' + cfg.title;
    const SK = skin();
    const chals = level.chals;
    run = { mode: 'chal', shown: {}, level, i: 0, hearts: cfg.hearts || 3, score: 0, combo: 0, firstTry: 0, hintsUsed: 0, results: [], attempts: 0, hinted: false, done: false, tstart: 0 };
    appEl.replaceChildren();
    const head = h('div', { class: 'bar' },
      h('button', { class: 'btn ghost', onclick: leave }, '← Levels (Esc)'),
      h('h2', { id: 'lvtitle' }, h('span', { class: 'lvl' }, 'Level ' + level.n), ' · ' + lvTitle(level)),
      h('span', { class: 'sp' }),
      h('span', { class: 'hearts', id: 'hearts', role: 'img' }),
      h('span', { class: 'score', id: 'score', 'aria-live': 'off' }, '0'));
    const stageBox = h('div', { class: 'stage' });
    const prog = h('div', { class: 'prog', id: 'prog', 'aria-hidden': 'true' }, chals.map(() => h('i')));
    const combo = h('div', { class: 'combo', id: 'combo', 'aria-live': 'polite' });
    const body = h('div', { id: 'body' });
    appEl.append(head, stageBox, prog, combo, body);
    run.stage = cfg.stage ? cfg.stage(level, stageBox, !!S.ana) : null;
    if (run.stage && run.stage.setProgress) run.stage.setProgress(0, chals.length);
    drawHud();
    run.briefing = false;
    if (!level.learn && (level.intro || (S.ana && level.ana))) {
      run.briefing = true;
      const A = S.ana && level.ana;
      const bp = h('div', { class: 'panel' }, h('h3', null, A ? 'Mission: ' + level.ana.title : 'Briefing'));
      if (A) {
        bp.append(h('div', { class: 'concept', html: '<b>' + level.ana.mission + '</b>' + (level.ana.key ? '<br>' + level.ana.key : '') }));
        if (level.ana.map && level.ana.map.length) bp.append(h('div', { class: 'tr' }, level.ana.map.map(m => h('div', { class: 'trow' }, h('span', { class: 'rt', html: m[0] }), h('span', { class: 'kt', html: m[1] })))));
        if (level.intro) bp.append(h('details', { class: 'real' }, h('summary', null, 'The real thing (technical version)'), h('div', { class: 'concept', html: level.intro })));
      } else bp.append(h('div', { class: 'concept', html: level.intro }));
      body.append(h('div', { class: 'panel' }, ...bp.childNodes,
        h('div', { class: 'actions' }, h('button', { class: 'btn primary', id: 'go', onclick: next }, 'Start level  (Enter)'))));
      $('#go').focus();
    } else next();
  }

  function drawHud() {
    const hs = $('#hearts'), max = cfg.hearts || 3;
    hs.replaceChildren();
    for (let i = 0; i < max; i++) hs.append(h('span', { class: i < run.hearts ? '' : 'lost' }, skin().heartIcon || '♥'));
    hs.setAttribute('aria-label', run.hearts + ' of ' + max + ' ' + (skin().heartName || 'lives') + ' left');
    $('#score').textContent = run.score;
    const p = $('#prog');
    [...p.children].forEach((el, i) => { el.className = i < run.i ? (run.results[i] && run.results[i].ok ? 'd' : 'b') : i === run.i ? 'c' : ''; });
    $('#combo').textContent = run.combo >= 2 ? 'Streak x' + run.combo + '  (+' + Math.min(run.combo - 1, 5) * 10 + '% points)' : '';
  }

  /* ---------- lessons (teach first, then ask) ---------- */
  function lessonTiers(L) { const t = new Set(L.chals.map(c => Math.min(3, c.tier || 1))); return [1, 2, 3].filter(x => t.has(x) && L.learn && L.learn[x]); }
  const lessonTotal = L => lessonTiers(L).length;
  const lessonNo = (L, tier) => lessonTiers(L).indexOf(tier) + 1;
  function lessonHtml(les) { return h('div', { class: 'lbody' }, h('div', { html: les.h }), les.a ? h('div', { class: 'concept anabox anaonly', html: '<b>In the water pipes:</b> ' + les.a }) : null); }
  function showLesson(les, k, m) {

      next: () => { const b = $('#nextbtn'); if (b) b.click(); else { const g = $('#go'); if (g) g.click(); } let n = 0; while ($('#body .lesson') && $('#go') && n++ < 5) $('#go').click(); },
      key: (k) => document.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true })),
      mode: () => run && run.mode,
      state: () => S,
    };
  }

  return { init, h, rnd, pick, shuffle, fmt, $, TEST, isAna: () => !!(S && S.ana) };
})();

/* Embedded Quest: level content. Every challenge is grounded in the microcontroller lecture guide. */
const { rnd, pick, fmt, shuffle } = Kit;
const b8 = v => (v & 255).toString(2).padStart(8, '0');
const rb = () => rnd(0, 255);
const bitn = (suffix) => ['7', '6', '5', '4', '3', '2', '1', '0'].map(i => suffix + i);
const PB = bitn('PB'), PA = bitn('PA');
const clr = (v, ...bits) => bits.reduce((x, b) => x & ~(1 << b), v) & 255;
const setb = (v, ...bits) => bits.reduce((x, b) => x | (1 << b), v) & 255;
const pop = v => b8(v).split('').filter(c => c === '1').length;
