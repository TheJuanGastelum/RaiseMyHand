    chals: [
      { t: 'choice', tier: 1, q: 'How high can the 16-bit Timer1 count in Normal mode?', opts: ['65,535 (0xFFFF)', '255', '1,023', '4,096'], a: 0, hint: '2 to the power of 16, minus 1.', why: 'Timer0 is 8-bit (0–255). Timer1 is 16-bit (0–65,535), so it can time much longer delays directly.' },
      { t: 'num', tier: 2, gen() { const c = pick([['1 ms', 0.001, 64, 249], ['0.5 ms', 0.0005, 64, 124], ['2 ms', 0.002, 256, 124], ['4 ms', 0.004, 256, 249], ['10 µs', 0.00001, 8, 19]]); return { q: 'Clock <span class="m">16 MHz</span>, prescaler <span class="m">' + c[2] + '</span>. What value goes in <code>OCR0A</code> for a delay of <span class="m">' + c[0] + '</span>?', a: c[3], tol: 0, abs: 0.01, hint: 'OCR0A = (Td × 16,000,000 / prescaler) − 1.', why: 'OCR0A = (' + c[1] + ' × 16,000,000 / ' + c[2] + ') − 1 = ' + c[3] + '.' }; } },
      { t: 'choice', tier: 2, q: 'You need a delay longer than the counter can count in one pass. What is the standard approach?', opts: ['Set a short base period (like 1 ms) and count how many times it fires, by polling or by interrupt', 'Use a bigger clock', 'Write to OCR0A twice', 'It cannot be done'], a: 0, hint: 'Build a long delay from many short ones.', why: 'Loop and poll the flag, or better, loop and let an interrupt count the periods.' },
      { t: 'choice', tier: 2, q: 'Timer1 registers are 16 bits wide but the CPU moves 8 bits at a time. What is the rule?', opts: ['Writing: high byte first, then low byte. Reading: low byte first, then high byte', 'Writing: low byte first. Reading: high byte first', 'Write both bytes at the same instant', 'Always read twice'], a: 0, hint: 'A temporary register makes this work.', why: 'Do it backwards and you silently get the wrong number, with no error to warn you.' },
      { t: 'num', tier: 2, gen() { const p = pick([8, 64, 256, 1024]); return { q: 'Timer1 counts 0 to 65,535. With a prescaler of <span class="m">' + p + '</span> on a 16 MHz clock, about how long is that?', unit: 'ms', a: 65535 * p / 16000, tol: 0.02, hint: 'Td = count × prescaler / Fclk. Then convert µs to ms.', why: '65,535 × ' + p + ' / 16 MHz = ' + fmt(65535 * p / 16000, 1) + ' ms.' }; } },
      { t: 'num', tier: 3, boss: true, gen() { const c = pick([[5, 8], [10, 8], [20, 8], [10, 64], [20, 64]]); const a = 16000000 * c[0] / 1000 / c[1] - 1; return { q: 'Set up Timer1 in CTC mode with a prescaler of <span class="m">' + c[1] + '</span> for a <span class="m">' + c[0] + ' ms</span> period at 16 MHz. What goes in <code>OCR1A</code>?', a, tol: 0.005, hint: 'OCR1A = (Td × Fclk / prescaler) − 1.', why: 'OCR1A = (' + c[0] / 1000 + ' × 16,000,000 / ' + c[1] + ') − 1 = ' + a + '. (Leaving off the −1 is a fine estimate; including it is exact.) Write the high byte first, then the low byte.' }; } },
    ] },

  /* 9 */ { n: 9, lec: '8', diff: 4, topic: 'Interrupts: the Three Switches', blurb: 'An interrupt runs your code the instant an event happens, but only if all three switches are on.',
    intro: 'An <b>interrupt</b> runs automatically when something happens, with no checking. But three things must all be true: (1) interrupts are on chip-wide (<code>sei()</code>), (2) that feature’s own interrupt is enabled, (3) the event actually happens. Miss one and your code silently never runs.',
    ana: { title: 'The Doorbell That Rings by Itself', mission: 'Three switches must all be on before the bell rings the house.' },
    chals: [
      { t: 'match', tier: 1, q: 'Match each of the three switches to how you turn it on.', pairs: [['Chip-wide “allow interrupts”', 'Call sei();'], ['That feature’s own switch', 'A bit in PCICR or TIMSK0'], ['The event', 'The pin or timer really does it']], why: 'All three must be on at once, or the interrupt never fires.' },
      { t: 'choice', tier: 1, q: 'Who watches for the event with an interrupt, and when?', opts: ['Hardware, every cycle, completely separate from your code', 'Your main loop, once per pass', 'The compiler, at build time', 'Nobody. It just happens'], a: 0, hint: 'You never have to be “looking”.', why: 'The hardware watches every clock cycle. The instant the event happens, the chip pauses your code and jumps to your interrupt function.' },
      { t: 'sort', tier: 2, q: 'Polling or interrupt?', buckets: ['Polling', 'Interrupt'], items: [['Can miss a fast event if the code is busy', 0], ['Hardware watches every cycle', 1], ['The CPU spins checking a flag', 0], ['The CPU is free to do other work while waiting', 1]], why: 'Polling puts your code on watch duty. An interrupt moves that duty to hardware.' },
      { t: 'choice', tier: 2, q: 'What does <code>sei()</code> do?', opts: ['Turns on the one master switch that allows any interrupts at all', 'Starts Timer0', 'Clears every flag', 'Enables PCINT on Port B'], a: 0, hint: 'cli() is the opposite.', why: 'Nothing chip-wide interrupts your code until you call it, usually once near the top of main(). cli() turns the master switch off.' },
      { t: 'choice', tier: 2, q: 'You set up a pin-change interrupt and call <code>sei()</code> but forgot to arm the pin’s feature switch. What happens?', opts: ['Nothing. The ISR silently never runs, with no error', 'The chip resets', 'The ISR runs once', 'A compiler warning appears'], a: 0, hint: 'All three switches must be on.', why: 'Forget any one of the three and your code just never runs. That is the classic silent bug.' },
      { t: 'order', tier: 3, boss: true, q: 'Put what happens when an interrupt fires in order.', items: ['The real event happens (e.g. the pin changes)', 'Hardware sets the flag, and both enable switches are on', 'The CPU pauses your main code', 'Your ISR runs', 'Main resumes exactly where it left off'], hint: 'The event comes first, resume comes last.', why: 'The hardware does the watching and jumping. Your ISR should be short, with no long delays inside.' },
    ] },

  /* 10 */ { n: 10, lec: '8', diff: 4, topic: 'PCINT and Interrupt Bugs', blurb: 'Pin-change groups, who changed, and two classic interrupt bugs.',
    intro: 'A <b>pin change interrupt</b> (PCINT) fires on <i>any</i> change on an armed pin, in groups of 8 pins that share one vector. <code>PCICR</code> arms a whole group. <code>PCMSK</code> arms one pin. To find out which pin changed, XOR the new pin state with a saved history byte.',
    ana: { title: 'Which Door Rang?', mission: 'Eight doors share one bell. Work out which one changed.' },
    chals: [
      { t: 'match', tier: 1, q: 'Match each PCINT group to its port.', pairs: [['PCINT0', 'Port B'], ['PCINT1', 'Port J'], ['PCINT2', 'Port K']], extra: ['Port A'], why: 'Each group has its own enable bit in PCICR, a mask register PCMSK, and an ISR vector.' },
      { t: 'match', tier: 2, q: 'Match each item to its role.', pairs: [['PCICR', 'Arms a whole group of 8 pins'], ['PCMSK', 'Arms one specific pin in the group'], ['PCIE', 'The group-enable bit inside PCICR'], ['sei()', 'The chip-wide master switch']], why: 'Arm the group, arm the pin, then turn on the master switch.' },
      { t: 'choice', tier: 2, q: 'What can a PCINT <b>not</b> tell you?', opts: ['The direction of the change (low to high or high to low)', 'That something changed', 'Which group fired', 'That an interrupt happened'], a: 0, hint: 'It fires on any logic change.', why: 'You have to read the pin, or keep a history byte, inside the ISR to figure it out. It also fires on every flicker of switch bounce.' },
      { t: 'choice', tier: 2, q: 'Three switches all sit on Port B. How does your ISR know which one changed?', opts: ['Keep a volatile “previous state” byte and XOR it with the current PINB', 'Each pin has its own vector', 'It cannot be known', 'Read DDRB'], a: 0, hint: 'XOR shows the bits that differ.', why: 'All three land in the same PCINT0_vect. XOR of the new and old state leaves a 1 on every bit that changed.' },
      { t: 'choice', tier: 3, q: 'Your main code reads a 2-byte variable that an interrupt can change. The interrupt fires halfway through the read. What is the fix?', opts: ['Briefly turn interrupts off with cli() before reading, then back on with sei()', 'Make the variable smaller', 'Read it three times', 'Use a pull-up'], a: 0, hint: 'You do not want the value changing mid-read.', why: 'Otherwise you read a mixed-up half-old, half-new value. cli() and sei() make the read safe.' },
      { t: 'bits', tier: 3, boss: true, gen() { const h = rb(), p = rb(); return { q: 'The history byte is <code>0b' + b8(h) + '</code>. <b>PINB</b> now reads <code>0b' + b8(p) + '</code>. Show <code>changedbits = PINB ^ portbhistory;</code>.', start: '00000000', target: b8(h ^ p), labels: PB, regName: 'changedbits', hint: 'A bit is 1 exactly where the two bytes differ.', why: 'XOR gives a 1 in each position that changed: ' + b8(h ^ p) + '. Then test each bit with changedbits &amp; (1&lt;&lt;PBn).' }; } },
    ] },

  /* 11 */ { n: 11, lec: '9', diff: 4, topic: 'Timer Interrupts', blurb: 'One bit in TIMSK0 and the hardware runs your function when the timer is done.',
    intro: 'Same idea as PCINT, for timers. Instead of polling <code>TIFR0</code>, flip one bit in <code>TIMSK0</code>. <b>Normal</b> mode uses <code>TOIE0</code> and <code>TIMER0_OVF_vect</code>. <b>CTC</b> mode uses <code>OCIE0A</code> and <code>TIMER0_COMPA_vect</code>.',
    ana: { title: 'The Timer Rings the Bell', mission: 'Let the kitchen timer ring the bell automatically when it finishes counting.' },
    chals: [
      { t: 'match', tier: 1, q: 'Match each item to Normal or CTC mode.', pairs: [['Normal: enable bit', 'TOIE0'], ['Normal: ISR vector', 'TIMER0_OVF_vect'], ['CTC: enable bit', 'OCIE0A'], ['CTC: ISR vector', 'TIMER0_COMPA_vect']], why: 'Overflow goes with Normal mode. Compare match goes with CTC.' },
      { t: 'choice', tier: 1, q: 'You enable a timer interrupt but never write the ISR. What happens?', opts: ['The chip jumps to a vector with nothing there and the program gets stuck', 'Nothing. It is ignored', 'The timer stops', 'The compiler writes one for you'], a: 0, hint: 'The flag goes up and the jump happens anyway.', why: 'Always write an ISR, even an empty one, for anything you enable.' },
      { t: 'bits', tier: 2, gen() { const mode = pick([['Normal', 'TOIE0', 0], ['CTC', 'OCIE0A', 1]]); const s = rb() & ~(1 << mode[2]) & 0x07; return { q: '<b>TIMSK0</b> is <code>0b' + b8(s) + '</code>. Enable the <b>' + mode[0] + '-mode</b> interrupt (<code>' + mode[1] + '</code>) without changing any other bit.', start: b8(s), target: b8(setb(s, mode[2])), labels: ['-', '-', '-', '-', '-', 'OCIE0B', 'OCIE0A', 'TOIE0'], regName: 'TIMSK0', hint: mode[1] + ' is bit ' + mode[2] + '.', why: 'TIMSK0 |= (1&lt;&lt;' + mode[1] + '); sets bit ' + mode[2] + ' only.' }; } },
      { t: 'choice', tier: 2, q: 'A variable is changed inside an ISR and read in <code>main()</code>. What keyword does it need?', opts: ['volatile', 'static', 'const', 'register'], a: 0, hint: 'The compiler cannot see the ISR running.', why: 'Without it the compiler may assume the variable never changes and delete the check. <code>volatile</code> means “always re-read it from memory”.' },
      { t: 'order', tier: 2, q: 'Put the steps to run an ISR every 1 ms using CTC in order.', items: ['Choose CTC mode (WGM bits)', 'Choose the prescaler (CS bits)', 'Write the count to OCR0A', 'Enable OCIE0A in TIMSK0', 'Enable global interrupts with sei()'], hint: 'Configure the timer, then switch the interrupt on.', why: 'Mode, prescaler, count, feature switch, master switch.' },
      { t: 'num', tier: 3, boss: true, gen() { const c = pick([[250, 64], [125, 64], [250, 8], [200, 256], [100, 1024]]); return { q: 'A CTC interrupt uses <code>OCR0A = ' + c[0] + '</code> with a prescaler of <span class="m">' + c[1] + '</span> on a 16 MHz clock. How often does the ISR run (the period)?', unit: 'ms', a: c[0] * c[1] / 16000, tol: 0.02, hint: 'Td = (OCR0A × prescaler) / Fclk.', why: 'Td = ' + c[0] + ' × ' + c[1] + ' / 16 MHz = ' + fmt(c[0] * c[1] / 16000, 3) + ' ms.' }; } },
    ] },

  /* 12 */ { n: 12, lec: '10', diff: 4, topic: 'State Machines and Switch Debounce', blurb: 'One variable, a switch statement, and a four-state fix for a bouncy button.',
    intro: 'A <b>state machine</b> is one variable remembering which step you are on, plus a <code>switch</code> that says what to do there. A mechanical switch <b>bounces</b> for a few milliseconds, so one press looks like many. The 4-state cycle waitPress, debouncePress, waitRelease, debounceRelease fixes it.',
    ana: { title: 'The Four-Room Routine', mission: 'One note on the fridge says which room you are in. Tame the clicky switch.' },
    chals: [
      { t: 'choice', tier: 1, q: 'In plain words, what is a state machine?', opts: ['One variable that remembers which step you are on, plus a switch statement that acts on it', 'A type of memory', 'A hardware timer', 'A kind of interrupt'], a: 0, hint: 'Draw the steps and arrows first.', why: 'Draw the states and transitions on paper first, and the code almost writes itself.' },
      { t: 'choice', tier: 1, q: 'Why does a button press need debouncing?', opts: ['Contacts bounce for a few ms, so one press can look like many presses', 'The pull-up is too weak', 'The CPU is too slow', 'The pin is floating'], a: 0, hint: 'Think of rapid 0/1/0/1 flicker.', why: 'A raw PCINT fires for every flicker. The debounce states force a pause so the pin settles before you trust it.' },
      { t: 'order', tier: 2, q: 'Put the four debounce states in the order they cycle.', items: ['waitPress', 'debouncePress', 'waitRelease', 'debounceRelease'], hint: 'Press, settle, release, settle.', why: 'Then it loops back to waitPress.' },
      { t: 'match', tier: 2, q: 'Match each state to what happens there.', pairs: [['waitPress', 'Idle until the ISR sees a press'], ['debouncePress', 'Short delay, then wait for the release'], ['waitRelease', 'Idle until the ISR sees the release (the LED toggles)'], ['debounceRelease', 'Short delay, then back to waitPress']], why: 'The ISR only changes which state you are in. The delays live in main().' },
      { t: 'choice', tier: 2, q: 'Where should the blocking delay (about 100 µs) live?', opts: ['In main(), where blocking does not stall interrupt handling', 'Inside the ISR', 'In the PCINT registers', 'In the pull-up resistor'], a: 0, hint: 'ISRs must be short.', why: 'The ISR never blocks. The only slow part lives safely in main().' },
      { t: 'sort', tier: 3, boss: true, q: 'Does this belong in the ISR or in the main loop?', buckets: ['ISR', 'main()'], items: [['Change state when the pin changes', 0], ['delayUs(100) in a debounce state', 1], ['Toggle the LED on the real release', 0], ['Do nothing in waitPress, just wait', 1]], why: 'The ISR holds the conditional/transition logic. main() holds the instant actions and the short delays.' },
    ] },

  /* 13 */ { n: 13, lec: '11', diff: 4, topic: 'LCD Displays', blurb: 'Pins, 4-bit mode, the enable pulse, and the commands you actually use.',
    intro: 'The LCD has its own controller chip. Your job is to send it the right signals in the right order with the right delays. In <b>4-bit mode</b> a byte goes out as two nibbles, each latched by an <b>Enable</b> pulse. Go too fast and it silently ignores you.',
    ana: { title: 'The Literal Roommate', mission: 'Slide notes through a four-letter slot and knock politely between each one.' },
    chals: [
      { t: 'match', tier: 1, q: 'Match each LCD pin to its job.', pairs: [['RS', 'HIGH = text, LOW = command'], ['R/W', 'Wired LOW: you only write'], ['E', 'The “go” pulse'], ['D4–D7', 'The four data bits in 4-bit mode'], ['VEE', 'Contrast adjust']], why: 'RS picks command vs text. E latches the data.' },
      { t: 'choice', tier: 1, q: 'In 4-bit mode, how is one byte sent?', opts: ['Top 4 bits first, then bottom 4 bits, with two Enable pulses', 'All 8 bits at once', 'Bottom 4 bits only', 'One bit at a time'], a: 0, hint: 'Saves four GPIO pins, costs speed.', why: '4-bit mode uses only D4–D7, so each command takes two pulses.' },
      { t: 'order', tier: 2, q: 'Put the steps of sending a 4-bit command in order.', items: ['Put the 4 data bits on the data pins', 'Set RS and R/W (RS = 0 for a command, R/W = 0)', 'Set Enable HIGH', 'Delay about 1 µs', 'Set Enable LOW (the actual “go” edge)', 'Delay for however long that command takes'], hint: 'Data first, pulse in the middle, wait at the end.', why: 'The LCD reads the pins on the falling edge of Enable.' },
      { t: 'sort', tier: 2, q: 'Which command is each hex code?', buckets: ['Function set (4-bit, 2 lines)', 'Clear display', 'Display on', 'Entry mode set'], items: [['<code>0x28</code>', 0], ['<code>0x01</code>', 1], ['<code>0x0C</code>', 2], ['<code>0x06</code>', 3]], why: 'Clear display is the slowest command and needs the longest delay.' },
      { t: 'choice', tier: 2, q: 'You send the next command before the LCD finishes the last one. What happens?', opts: ['It silently ignores it. No error, the screen just does not update', 'The LCD resets', 'An error flag is set', 'The command queues up'], a: 0, hint: 'The LCD controller is slow compared to the AVR.', why: 'Every command in the datasheet lists its own delay. Skip them and the screen does nothing, quietly.' },
      { t: 'num', tier: 3, boss: true, gen() { const row = rnd(0, 1), col = rnd(0, 15); return { q: 'Move the cursor with <code>0x80 | (row&lt;&lt;6) | col</code>. For <span class="m">row = ' + row + ', col = ' + col + '</span>, what is the command byte in decimal?', a: 128 + row * 64 + col, tol: 0, abs: 0.01, hint: '0x80 is 128. row&lt;&lt;6 is row × 64.', why: '0x80 is required by the command, row&lt;&lt;6 picks row 0 or 1, col picks the column: 128 + ' + row * 64 + ' + ' + col + ' = ' + (128 + row * 64 + col) + '.' }; } },
    ] },

  /* 14 */ { n: 14, lec: '12', diff: 4, topic: 'PWM Basics', blurb: 'Fake an analog voltage with a fast digital pulse and set the duty cycle.',
    intro: '<b>PWM</b> fakes an analog voltage with a fast digital pulse. The <b>duty cycle</b> D = T<sub>pulse</sub> / T<sub>period</sub> sets the average voltage: <span class="m">V<sub>eff</sub> = D(V<sub>high</sub> − V<sub>low</sub>) + V<sub>low</sub></span>. In non-inverting mode the pin goes low when TCNT1 equals OCR1A.',
    ana: { title: 'The Dimmer Trick', mission: 'Flick the light on and off so fast it looks dimmer. Longer on means brighter.' },
    chals: [
      { t: 'choice', tier: 1, q: 'You cannot output a true in-between voltage from a pin. How does PWM fake one?', opts: ['Switch fast between high and low. The more time on, the higher the average', 'Use a very large resistor', 'Lower the clock', 'Use two pins'], a: 0, hint: 'Average over time.', why: 'The timer does the switching for you. The average voltage follows the duty cycle.' },
      { t: 'num', tier: 1, gen() { const p = pick([4, 8, 10, 20]), d = pick([0.2, 0.25, 0.5, 0.75]); const on = p * d; return { q: 'A PWM signal is high for <span class="m">' + on + ' ms</span> in every <span class="m">' + p + ' ms</span> period. What is the duty cycle?', unit: '%', a: d * 100, tol: 0.01, hint: 'D = T<sub>pulse</sub> / T<sub>period</sub>.', why: on + '/' + p + ' = ' + d + ', or ' + d * 100 + '%.' }; } },
      { t: 'num', tier: 2, gen() { const Vh = pick([5, 3.3]), D = pick([0.2, 0.25, 0.5, 0.8]); return { q: 'A PWM pin swings between 0 V and <span class="m">' + Vh + ' V</span> with a duty cycle of <span class="m">' + D * 100 + '%</span>. What is the effective (average) voltage?', unit: 'V', a: Vh * D, tol: 0.01, hint: 'V<sub>eff</sub> = D(V<sub>high</sub> − V<sub>low</sub>) + V<sub>low</sub>.', why: 'V<sub>eff</sub> = ' + D + ' × ' + Vh + ' = ' + fmt(Vh * D, 3) + ' V.' }; } },
      { t: 'order', tier: 2, q: 'Put the three things PWM needs in code in order.', items: ['Set the output-compare pin as an output (DDR)', 'Set the timer to Fast PWM, non-inverting mode', 'Pick a prescaler, then set the duty with OCR1A'], hint: 'Pin, mode, then duty.', why: 'Example: DDRB |= (1&lt;&lt;DDB5) for OC1A on pin 11, then the TCCR1A/B mode bits, then OCR1A.' },
      { t: 'choice', tier: 2, q: 'In non-inverting mode, what does a <b>bigger</b> OCR1A do?', opts: ['A longer HIGH time, so a bigger duty cycle', 'A shorter HIGH time', 'A higher frequency', 'Nothing'], a: 0, hint: 'The pin starts HIGH and goes LOW when TCNT1 equals OCR1A.', why: 'The pin starts high at the bottom of the count, goes low at OCR1A, and goes high again at TOP. Bigger OCR1A means more time high.' },
      { t: 'num', tier: 3, boss: true, gen() { const D = pick([0.1, 0.25, 0.5, 0.75]); return { q: '10-bit Fast PWM has <code>TOP = 0x3FF = 1023</code>. What value of <code>OCR1A</code> gives a duty cycle of <span class="m">' + D * 100 + '%</span>?', a: D * 1023, tol: 0.01, hint: 'Duty = OCR1A / TOP.', why: 'OCR1A = D × TOP = ' + D + ' × 1023 ≈ ' + fmt(D * 1023, 1) + '. There are 1024 possible duty steps.' }; } },
    ] },

  /* 15 */ { n: 15, lec: '13', diff: 5, topic: 'PWM Frequency and DC Motors', blurb: 'Set an exact frequency with TOP, then drive a motor with an H-bridge.',
    intro: 'In variable-TOP Fast PWM, <span class="m">TOP = 16 MHz / (N · f) − 1</span> fixes the frequency, and a second compare register holds <span class="m">D · TOP</span> for the duty. An H-bridge such as the L293 takes the PWM on <b>EN</b> (speed) and direction on its <b>A</b> pins.',
    ana: { title: 'The Fan Controller', mission: 'Set how fast the pulses repeat, how long each stays on, and which way the fan spins.' },
    chals: [
      { t: 'match', tier: 1, q: 'Match each L293 pin to its job.', pairs: [['A pins', 'Direction: clockwise or counter-clockwise'], ['EN pins', 'Take your PWM signal (this sets speed)'], ['Y pins', 'Outputs to the motor'], ['VCC1', 'Supply for the chip logic (5 V)'], ['VCC2', 'Supply for the motor (up to 36 V)']], why: 'Direction on A, speed on EN, power on VCC2.' },
      { t: 'choice', tier: 1, q: 'What does an H-bridge (four switches) do for a DC motor?', opts: ['Reverses its direction', 'Slows the clock', 'Measures current', 'Filters the PWM'], a: 0, hint: 'SW1+SW4 one way, SW2+SW3 the other.', why: 'Close SW1+SW4 for one direction, SW2+SW3 for the other.' },
      { t: 'num', tier: 2, gen() { const c = pick([[7, 1], [10, 1], [20, 8], [1, 8], [4, 1]]); const a = 16000000 / (c[1] * c[0] * 1000) - 1; return { q: 'Fast PWM with variable TOP: you want <span class="m">' + c[0] + ' kHz</span> with a prescaler <span class="m">N = ' + c[1] + '</span>. What is TOP (the value for <code>OCR1A</code>)?', a, tol: 0.01, hint: 'TOP = 16 MHz / (N · f) − 1.', why: 'TOP = 16,000,000 / (' + c[1] + ' × ' + c[0] * 1000 + ') − 1 ≈ ' + fmt(a, 1) + '.' }; } },
      { t: 'choice', tier: 2, q: 'What is a good starting PWM frequency for a DC motor, and why?', opts: ['About 10 kHz. Too fast and the motor gets hot, too slow and it jitters', 'About 1 Hz', 'As fast as possible', 'It does not matter'], a: 0, hint: 'Somewhere in the middle.', why: 'Start at about 10 kHz and adjust from there.' },
      { t: 'num', tier: 2, gen() { const T = pick([2285, 1599, 3999, 999]), D = pick([0.25, 0.5, 0.75]); return { q: 'With <code>TOP = ' + T + '</code>, what goes in the duty register (<code>OCR1C = D · TOP</code>) for <span class="m">D = ' + D * 100 + '%</span>?', a: D * T, tol: 0.01, hint: 'Multiply the duty by TOP.', why: D + ' × ' + T + ' ≈ ' + fmt(D * T, 1) + '.' }; } },
      { t: 'choice', tier: 3, boss: true, q: 'Make the motor spin the <b>other way</b> at <b>half speed</b>. What changes?', opts: ['Swap the levels on the A direction pins, and set a 50% duty PWM on EN', 'Halve the clock and swap VCC1 and VCC2', 'Set EN low and raise TOP', 'Nothing. The motor reverses by itself'], a: 0, hint: 'Direction and speed are separate controls.', why: 'A pins pick the direction. The PWM duty cycle on EN sets the average voltage, so 50% duty is about half speed. When EN is low the outputs are off.' },
    ] },
];
MCU_LEVELS.forEach(l => { const a = ANA_L[l.lec]; if (a) { l.ana.key = a.key; l.ana.map = a.map; } });

/* Teaching pages for Embedded Quest, levels 1-8. Each level has three lessons (warm-up, challenge, hard). They show before the questions. */
const F = x => '<div class="formula">' + x + '</div>';
const EX = (t, x) => '<div class="example"><b class="eh">' + t + '</b>' + x + '</div>';
const TRAP = x => '<div class="trap"><b class="eh">Watch out</b>' + x + '</div>';
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const C = s => '<code>' + esc(s) + '</code>';
const CB = s => '<pre class="code">' + esc(s) + '</pre>';
const LEARN = (idx, topic, ls) => {
  const L = MCU_LEVELS[idx - 1];
  if (!L || L.topic !== topic) throw new Error('lesson/level mismatch at ' + idx + ': ' + (L && L.topic) + ' vs ' + topic);
  L.learn = { 1: ls[0], 2: ls[1], 3: ls[2] };
};

LEARN(1, 'Three Kinds of Chips', [
 { t: 'What is an embedded system?', h:
  '<p>An <b>embedded system</b> is a small computer built into a product to do <b>one job</b>: wait for buttons, run a heater, spin a motor. You do not use it like a laptop. It just does its task.</p>' +
  '<p>Chips for such jobs come in three tiers.</p>',
  a: 'A doorbell with one fixed ring, a smart-home brain you can reprogram, and a laptop that runs any app. Three levels of flexibility.' },
 { t: 'The three tiers', h:
  '<ul><li><b>ASIC</b> (application-specific integrated circuit): wired for one job and <b>never changes</b>. Very cheap at high volume, but fixed forever.</li><li><b>Microcontroller</b>: you write code for it, cheap, reprogrammable, but tied to fixed pins and a small memory. <b>This course programs this tier.</b></li><li><b>General-purpose CPU</b>: runs a full operating system. Flexible, but expensive.</li></ul>' +
  TRAP('ASIC and RISC are not opposites. ASIC is about how the chip is <b>built</b>. RISC is about its <b>instruction set</b>. A microcontroller can be RISC-based and still not be an ASIC.'),
  a: 'The fixed doorbell rings one tune and never changes. The smart-home brain can be reprogrammed. The laptop can run anything but costs the most.' },
 { t: 'Why program the microcontroller directly?', h:
  '<p>This tier is for <b>real-time control loops</b>: read a sensor, react in an exact and predictable time. There is no operating system in the way to delay you.</p>' +
  EX('A self-driving car uses all three', '<b>ASICs</b> where speed and power efficiency beat flexibility (image processing). <b>Microcontrollers</b> for exact real-time loops (motor control, braking). <b>Full CPUs</b> for flexible big-picture software (navigation).'),
  a: 'Each device is picked for what it does best: the fixed ring where speed wins, the smart brain for exact timing, the laptop for flexibility.' }
]);

LEARN(2, 'The Memory Map and SFRs', [
 { t: 'The chip’s memories', h:
  '<p>The chip has several separate memories:</p>' +
  '<ul><li><b>Flash</b> (256 KB): holds your program. Survives power-off.</li><li><b>SRAM</b> (8 KB): holds variables while running. Erased when power goes off.</li><li><b>EEPROM</b> (4 KB): small storage for settings. Survives power-off.</li><li><b>I/O registers</b> (64 + 416 bytes): the control panel for the hardware. Not saved at power-off.</li></ul>' +
  EX('Ratio', 'Flash is 256 KB and EEPROM is 4 KB: 256 ÷ 4 = <b>64 times</b> bigger.'),
  a: 'The house has two notebooks (the manual for the program, the whiteboard for variables) and a control panel of labeled switches.' },
 { t: 'SFRs and the clock', h:
  '<p>Every piece of hardware is controlled through a named memory address called an <b>SFR</b> (special function register). Writing to an SFR is not saving a value in RAM. You are <b>flipping a physical switch</b> on the chip.</p>' +
  '<p>The chip runs on a clock. Each tick lasts the inverse of the clock frequency.</p>' + F('tick = 1 ÷ f') +
  EX('Example', 'At 1 MHz, one tick is 1 ÷ 1,000,000 s = 1 µs = <b>1000 ns</b>. Every timer counts these same ticks, slowed down by different amounts.'),
  a: 'Writing to the control panel moves a real switch. Writing to the whiteboard only changes a note.' },
 { t: 'Harvard architecture', h:
  '<p>Code and variables sit in two <b>physically separate</b> memories. This is a <b>Harvard architecture</b>.</p>' +
  '<p>Because of this, the CPU can fetch the next instruction <b>and</b> read a variable at the same time. It never waits in line for one shared memory. That is why timing on this chip is so predictable.</p>' +
  EX('Which survive power-off?', 'Flash and EEPROM: <b>yes</b>. SRAM and the I/O registers: <b>no</b>.'),
  a: 'One person reads the manual while another reads the whiteboard. Neither waits for the other.' }
]);

LEARN(3, 'Digital I/O: DDR, PORT and PIN', [
 { t: 'Three registers per port', h:
  '<p>Pins are grouped in <b>ports</b> of up to 8 pins (PORTB, PORTD, …). Every pin is controlled by three registers that share a letter (for port B):</p>' +
  '<ul><li><b>DDRB</b> (data direction): <b>1 = output, 0 = input</b>. Set this first.</li><li><b>PORTB</b>: for an output, drives the pin high (1) or low (0). For an input, a 1 turns on the <b>pull-up</b>.</li><li><b>PINB</b>: reads the live level on the pin. <b>Read only.</b></li></ul>' +
  '<p>Direction first, then the setting, then a way to check what is really happening.</p>',
  a: 'Every door needs three settings: in or out, open or shut, and what is really happening.' },
 { t: 'Making a pin an output', h:
  '<p>Bits are numbered from 0 on the right. Bit 5 of DDRB is PB5. To set a single bit, use OR with a shifted 1:</p>' +
  CB('DDRB |= (1<<DDB5);   // PB5 becomes an output') +
  '<p>To set two bits at once, OR them together:</p>' + CB('DDRB |= (1<<DDB0)|(1<<DDB3);   // PB0 and PB3 become outputs') +
  '<p>The OR sets only the named bits and keeps the other six exactly as they were.</p>',
  a: 'Flip only the doors you want, and leave the rest as they are.' },
 { t: 'Reading a button, and reading reality', h:
  '<p>To read a pushbutton, read <b>PINx</b>. PORTx is what you <i>asked</i> the pin to do. PINx is what it <i>actually</i> is. They can differ.</p>' +
  EX('Setting up pull-ups', 'DDRB makes PB7 an output and PB0–PB6 inputs. You want PB7 high and the pull-ups on PB0 and PB1. PORTB = 1000 0011 in binary: PB7 (output) high, PB1 and PB0 (inputs) pull-ups on, the rest 0.') +
  TRAP('To learn the real state of a pin, read PINx. Never read PORTx for that.'),
  a: 'The sign on the door says what you wanted. Looking through the keyhole says what is really happening.' }
]);

LEARN(4, 'Bit Surgery: Set, Clear, Toggle', [
 { t: 'Never write the whole register', h:
  '<p>One register controls 8 pins at once. If you write the whole register, you also reset the other seven pins.</p>' + CB('PORTB = 0b00100000;   // turns on PB5 but turns OFF all others!') +
  '<p>Always change <b>one bit at a time</b> and leave the rest alone.</p>',
  a: 'Flip one door without slamming the other seven.' },
 { t: 'Set, clear, toggle', h:
  '<p>Three patterns, using a mask that has a 1 in the position you want:</p>' +
  '<ul><li><b>Set</b> a bit to 1: ' + C('REG |= (1<<N);') + '</li><li><b>Clear</b> a bit to 0: ' + C('REG &= ~(1<<N);') + '</li><li><b>Toggle</b> (flip) a bit: ' + C('REG ^= (1<<N);') + '</li><li><b>Test</b> a bit: ' + C('REG & (1<<N)') + ' is non-zero if the bit is 1.</li></ul>' +
  EX('Set', 'PORTB = 01110010 and you run ' + C('PORTB |= (1<<0);') + '. OR with 0000 0001 forces bit 0 to 1: <b>01110011</b>.') +
  EX('Clear', 'PORTB = 00010110. ' + C('PORTB &= ~(1<<4);') + ' ANDs with 1110 1111, clearing bit 4: <b>00000110</b>.') +
  EX('Toggle', 'PORTB = 10111110. ' + C('PORTB ^= (1<<4);') + ' flips bit 4 (it was 1): <b>10101110</b>.'),
  a: 'One stencil per job: one that props a door open, one that slams it shut, and one that swaps its state.' },
 { t: 'Several bits at once', h:
  '<p>Combine masks with OR to change several bits in one statement:</p>' +
  CB('PORTB |= (1<<0)|(1<<5);   // set bit 0 and bit 5') +
  EX('Example', 'PORTB = 10001110. OR with 0010 0001 gives <b>10101111</b>.') +
  EX('Checking a bit', 'To check if bit 6 of PINB is set: ' + C('PINB & (1<<6)') + '. AND with a single-bit mask is non-zero only if that bit is 1.'),
  a: 'Use one stencil with two holes to flip two doors in one go.' }
]);

LEARN(5, 'Masks and Nibbles', [
 { t: 'Nibbles and masks', h:
  '<p>A <b>nibble</b> is 4 bits, half a byte. The <b>upper nibble</b> is bits 7–4. The <b>lower nibble</b> is bits 3–0. Two hex digits make a byte, one digit per nibble.</p>' +
  '<ul><li><b>0xF0</b> = 1111 0000: keeps the upper nibble.</li><li><b>0x0F</b> = 0000 1111: keeps the lower nibble.</li></ul>' +
  '<p>A <b>mask</b> is a pattern you AND with a value to force some bits to 0.</p>' +
  EX('Example', C('128 & 0xF0') + ' = 1000 0000 AND 1111 0000 = 1000 0000 = <b>128</b>.'),
  a: 'A stencil with the left four windows open and the right four covered keeps only the left four doors.' },
 { t: 'Bits have no meaning on their own', h:
  '<p>A <code>char</code> is just 8 bits. The letter <b>\'A\'</b> is ASCII 65 = 0100 0001. A function that does ' + C('num & 0x0F') + ' cannot tell whether you meant the number 65 or the letter A. It just keeps the low four bits.</p>' +
  EX('Example', C('65 & 0x0F') + ' = 0100 0001 AND 0000 1111 = 0000 0001 = <b>1</b>.'),
  a: 'The stencil does not read the label on the part. It only lets some spots through.' },
 { t: 'Writing four pins without touching the rest', h:
  '<p>To write a 4-bit number to PA0–PA3 and <b>keep</b> PA4–PA7: mask first, then OR.</p>' +
  CB('PORTA = (PORTA & 0xF0) | (num & 0x0F);') +
  '<ol><li><code>PORTA &amp; 0xF0</code> clears the lower nibble and keeps the upper one.</li><li><code>num &amp; 0x0F</code> keeps only the four bits you want to write.</li><li>OR combines them.</li></ol>' +
  EX('Example', 'PORTA = 10101110, num = 10000000. Upper nibble kept: 1010. Lower nibble from num: 0000. Result <b>10100000</b>.') +
  TRAP('Plain ' + C('PORTA = num & 0x0F;') + ' stomps PA4–PA7 every call. OR alone cannot clear a bit, and AND alone cannot set one. You need both.'),
  a: 'Cover the four doors you want to change, wipe them, then paint in the new settings. The other four are never touched.' }
]);

LEARN(6, 'Pull-ups and Polling', [
 { t: 'Floating inputs and pull-ups', h:
  '<p>An input pin with nothing connected <b>floats</b>. It reads random noise, sometimes 1, sometimes 0.</p>' +
  '<p>A <b>pull-up</b> resistor gently holds the pin at 1. A button wired to ground then pulls it to 0 when pressed. So the logic is <b>active-low</b>: pressed = 0, released = 1. That is backwards from what you might guess.</p>',
  a: 'A loose door swings in the wind. A spring pulls it shut until someone pushes it open.' },
 { t: 'Reading a switch step by step', h:
  '<p>The order:</p>' +
  '<ol><li>Make the pin an input: its DDR bit is 0.</li><li>Turn on the pull-up: write a 1 to its PORT bit.</li><li>Read PINx. A <b>0 means pressed</b>.</li></ol>' +
  CB('DDRB  &= ~(1<<DDB6);    // PB6 input\nPORTB |=  (1<<PORTB6);  // pull-up on\nif (!(PINB & (1<<PINB6))) { /* pressed */ }') +
  TRAP('With a pull-up, <b>1 = not pressed and 0 = pressed</b>. With no pull-up, the pin can float, so you cannot trust the reading.'),
  a: 'Set the door to swing in only, add the spring, then peek through the keyhole.' },
 { t: 'The weakness of polling', h:
  '<p><b>Polling</b> means re-checking the pin over and over in a loop. If the code is busy with a long calculation when a quick press-and-release happens, the pin is back to normal by the next check, and the press is <b>missed</b>.</p>' +
  '<p>That weakness is exactly why <b>interrupts</b> exist (coming up in level 9).</p>',
  a: 'If you only peek now and then, a visitor who knocks and leaves between peeks is never seen.' }
]);

LEARN(7, 'Timer0: Normal and CTC Modes', [
 { t: 'A timer is a real counter', h:
  '<p>Timer0 is a hardware counter that counts up <b>on its own</b>. Its count is the number in <b>TCNT0</b>, which goes up on every (slowed-down) clock tick, with no code running.</p>' +
  '<p>The <b>prescaler</b> slows the count: with a prescaler of 64, the timer ticks once for every 64 clock ticks. It is set by the <b>CS02:00</b> bits.</p>' +
  TRAP('If CS02:00 = 000, there is <b>no clock source</b>. The timer is off. This is the most common reason a timer never counts.'),
  a: 'A kitchen timer that counts by itself. The prescaler is the gear that makes the count slower.' },
 { t: 'Normal mode and CTC mode', h:
  '<ul><li><b>Normal</b> mode: counts 0 to 255, then overflows back to 0. The overflow sets a flag (TOV0).</li><li><b>CTC</b> (Clear Timer on Compare) mode: counts up to a number you put in <b>OCR0A</b>, then restarts. The match sets a flag (OCF0A).</li></ul>' +
  '<p>Both flags live in <b>TIFR0</b>. The four Timer0 registers: <b>TCNT0</b> (the counter), <b>TCCR0A/B</b> (control), <b>OCR0A</b> (compare value), <b>TIFR0</b> (flags).</p>',
  a: 'Normal always counts to the top before ringing. CTC lets you choose how high it counts before it rings.' },
 { t: 'How long is a tick?', h:
  '<p>A tick is not a fixed time. It depends on the prescaler and the clock.</p>' + F('tick = Prescaler ÷ F<sub>clk</sub>') +
  EX('One tick', 'Clock 16 MHz, prescaler 64: 64 ÷ 16,000,000 = <b>4 µs</b>.') +
  F('T<sub>d</sub> = count × Prescaler ÷ F<sub>clk</sub>') +
  EX('A full 0 to 255 count', '255 × 64 ÷ 16,000,000 ≈ <b>1020 µs</b>, about 1 ms. With a prescaler of 1024 it would be about 16 ms.'),
  a: 'Slow the gear down and each tick takes longer, so the same count rings later.' }
]);

LEARN(8, 'Timer Math and Timer1', [
 { t: 'Turning a delay into a number', h:
  '<p>To make CTC mode ring after a delay T<sub>d</sub>, solve for the number to put in OCR0A:</p>' + F('OCR0A = ( T<sub>d</sub> × F<sub>clk</sub> ÷ Prescaler ) − 1') +
  '<p>The <b>−1</b> is there because the counter starts at 0.</p>' +
  EX('Example', '16 MHz clock, prescaler 64, delay 0.5 ms: (0.0005 × 16,000,000 ÷ 64) − 1 = 125 − 1 = <b>124</b>.'),
  a: 'Turn “wait this long” into the number you set on the dial.' },
 { t: 'Timer1 is 16 bits wide', h:
  '<p>Timer0 is 8-bit (counts 0–255). <b>Timer1</b> is the same idea but <b>16-bit</b>: it counts 0 to <b>65,535</b>, so it can time much longer delays directly.</p>' +
  EX('Example', 'Prescaler 64, 16 MHz: 65,535 × 64 ÷ 16,000,000 = <b>262.14 ms</b> for a full count.') +
  '<p>If you need a delay longer than the counter can count in one pass, loop: poll the flag, or better, let an interrupt count the periods.</p>',
  a: 'A bigger kitchen timer with more digits can count a lot longer before it runs out.' },
 { t: 'Writing a 16-bit register', h:
  '<p>Timer1 registers are 16 bits wide, but the CPU moves only 8 bits at a time. A shared hidden byte makes it work, but you must use the right order:</p>' +
  '<ul><li><b>Write</b>: high byte first, then low byte.</li><li><b>Read</b>: low byte first, then high byte.</li></ul>' +
  TRAP('Do it backwards and you silently get the wrong number, with no error to warn you.') +
  EX('Full setup', 'Timer1 in CTC, prescaler 8, 10 ms at 16 MHz: OCR1A = (0.01 × 16,000,000 ÷ 8) − 1 = 20,000 − 1 = <b>19999</b>. Write the high byte first, then the low byte.'),
  a: 'Two half-notes go through the slot, and the order matters: high half first when writing.' }
]);

/* Teaching pages for Embedded Quest, levels 9-15. */

LEARN(9, 'Interrupts: the Three Switches', [
 { t: 'What an interrupt is', h:
  '<p>An <b>interrupt</b> runs a function automatically when something happens, with no checking by your code. The <b>hardware</b> watches every clock cycle. The instant the event happens, the chip pauses your code, runs your <b>interrupt service routine (ISR)</b>, then resumes where it left off.</p>' +
  '<p>Polling puts your code on watch duty. An interrupt moves that duty to the hardware.</p>',
  a: 'A doorbell that rings by itself, instead of you walking to the door every few seconds to look.' },
 { t: 'Three switches must all be on', h:
  '<p>For an interrupt to run, <b>all three</b> must be true:</p>' +
  '<ol><li><b>Global</b> interrupts are on: call ' + C('sei();') + ' (once, near the top of main). ' + C('cli();') + ' turns the master switch off.</li><li>That feature’s <b>own interrupt is enabled</b> (for example a bit in a mask register).</li><li>The <b>event actually happens</b>.</li></ol>' +
  TRAP('Miss any one and your code silently never runs. No error. This is the classic silent bug.'),
  a: 'Three switches must all be on before the bell rings the house.' },
 { t: 'The order of events', h:
  '<p>When an interrupt fires:</p>' +
  '<ol><li>The event happens.</li><li>The hardware sets a flag and checks that all three switches are on.</li><li>The hardware pauses the main code and jumps to the ISR.</li><li>The ISR runs.</li><li>Control returns to main, right where it left off.</li></ol>' +
  TRAP('Keep an ISR <b>short</b>. No long delays inside it.'),
  a: 'The bell rings, you answer quickly, then go back to what you were doing.' }
]);

LEARN(10, 'PCINT and Interrupt Bugs', [
 { t: 'Pin change interrupts', h:
  '<p>A <b>pin change interrupt (PCINT)</b> fires on <b>any change</b> (rising or falling) on an armed pin. Pins come in groups of 8 that share one vector. Each group has:</p>' +
  '<ul><li>an enable bit in <b>PCICR</b> (arms the whole group),</li><li>a mask register <b>PCMSK</b> (arms individual pins),</li><li>an ISR vector (for example <b>PCINT0_vect</b>).</li></ul>' +
  '<p>Three steps: arm the group, arm the pin, then turn on the master switch with ' + C('sei();') + '.</p>',
  a: 'Eight doors share one bell. Arm the bell, then pick which doors count.' },
 { t: 'Which pin changed?', h:
  '<p>A PCINT does <b>not</b> say which pin changed, or whether it went up or down. Inside the ISR, compare the new state with a saved <b>history byte</b>:</p>' +
  '<div class="formula">changedbits = PINB ^ portbhistory;</div>' +
  '<p>XOR leaves a 1 in every position that changed. Then test each bit with <code>changedbits &amp; (1&lt;&lt;PBn)</code>, and save the new state as the history.</p>' +
  EX('Example', 'History 00100110, PINB now 10111001. XOR: <b>10011111</b>. Those five bits changed.') +
  TRAP('It also fires on every flicker of switch bounce.'),
  a: 'Compare the picture of the doors now with the picture from last time. Any difference is the door that moved.' },
 { t: 'A bug: shared variables', h:
  '<p>If main code reads a <b>2-byte</b> variable that an interrupt can change, the interrupt could fire between the reading of the two bytes. You would read half-old, half-new data.</p>' +
  '<p>The fix: turn interrupts off around the read, then back on.</p>' +
  CB('cli();\nvalue = shared;   // safe read\nsei();'),
  a: 'Do not read a two-part note while someone is rewriting it. Lock the door for a moment first.' }
]);

LEARN(11, 'Timer Interrupts', [
 { t: 'Timers that ring the bell', h:
  '<p>Same idea as PCINT, for timers. Instead of polling the flag in <b>TIFR0</b>, you flip one bit in <b>TIMSK0</b> and let an ISR run.</p>' +
  '<ul><li><b>Normal</b> mode: enable <b>TOIE0</b>, ISR is <b>TIMER0_OVF_vect</b> (overflow).</li><li><b>CTC</b> mode: enable <b>OCIE0A</b>, ISR is <b>TIMER0_COMPA_vect</b> (compare match).</li></ul>' +
  EX('Enable the Normal-mode interrupt', C('TIMSK0 |= (1<<TOIE0);') + ' sets just bit 0 and leaves the rest alone.'),
  a: 'Let the kitchen timer ring the bell automatically when it finishes counting.' },
 { t: 'Always write the ISR, and use volatile', h:
  '<p>If you enable a timer interrupt but never write its ISR, the chip does something unwanted (such as reset). <b>Always write an ISR</b>, even an empty one, for anything you enable.</p>' +
  '<p>A variable changed in an ISR and read in main must be declared <b>volatile</b>.</p>' +
  CB('volatile uint8_t ticks = 0;\nISR(TIMER0_COMPA_vect) { ticks++; }') +
  '<p>Without <code>volatile</code>, the compiler may assume the variable never changes in main and remove your check. <code>volatile</code> means “always re-read it from memory”.</p>',
  a: 'If the notice on the fridge changes while you are away, you must re-read it every time, not trust your memory of it.' },
 { t: 'Setup recipe and period', h:
  '<p>To run an ISR every 1 ms with CTC:</p>' +
  '<ol><li>Set the <b>mode</b> (CTC).</li><li>Set the <b>prescaler</b> (starts the timer).</li><li>Set the <b>count</b> in OCR0A.</li><li>Enable the <b>feature switch</b> (OCIE0A).</li><li>Turn on the <b>master switch</b>: ' + C('sei();') + '.</li></ol>' +
  F('period = ( OCR0A × Prescaler ) ÷ F<sub>clk</sub>') +
  EX('Example', 'OCR0A = 125, prescaler 64, 16 MHz: period = 125 × 64 ÷ 16,000,000 = <b>0.5 ms</b>.'),
  a: 'Choose the style of timer, the gear, the count, the bell, and the main switch. Five steps.' }
]);

LEARN(12, 'State Machines and Switch Debounce', [
 { t: 'What is a state machine?', h:
  '<p>A <b>state machine</b> is one variable that remembers which step you are on, plus a <code>switch</code> statement that says what to do in each state.</p>' +
  '<p>Draw the states and the transitions on paper first. The code almost writes itself.</p>' +
  CB('switch (state) {\n  case WAIT:  if (go) state = RUN;  break;\n  case RUN:   ...                   break;\n}'),
  a: 'One note on the fridge says which room of the routine you are in.' },
 { t: 'Why buttons need debouncing', h:
  '<p>A mechanical switch <b>bounces</b>: for a few milliseconds the contact flickers, so one press looks like many presses. A raw PCINT fires on every flicker.</p>' +
  '<p>The fix is a four-state cycle that forces a pause so the pin can settle:</p>' +
  '<ol><li><b>waitPress</b>: wait for the pin to change to pressed.</li><li><b>debouncePress</b>: pause, then confirm it is still pressed.</li><li><b>waitRelease</b>: wait for the release.</li><li><b>debounceRelease</b>: pause, then confirm. Loop back to waitPress.</li></ol>',
  a: 'Ignore the first clicky bounces by waiting politely before trusting the switch.' },
 { t: 'ISR versus main', h:
  '<p>The ISR never blocks. It only decides <b>which state</b> you move to. The slow part, the short delay of about 100 µs, lives safely in <b>main()</b>.</p>' +
  '<ul><li><b>ISR</b>: conditional and transition logic (change state).</li><li><b>main()</b>: instant actions and the short delays.</li></ul>' +
  TRAP('Long delays inside an ISR stop other interrupts from being answered.'),
  a: 'The doorbell only tells you which room to go to. The slow knocking and waiting happens in the main room.' }
]);

LEARN(13, 'LCD Displays', [
 { t: 'The LCD has its own brain', h:
  '<p>The LCD has its own controller chip. Your job is to send it the right signals, in the right order, with the right delays. Go too fast and it <b>silently ignores</b> you.</p>' +
  '<ul><li><b>RS</b> (register select): 0 = a command, 1 = text to display.</li><li><b>E</b> (enable): a pulse that <b>latches</b> the data. The LCD reads the pins on the falling edge of E.</li><li><b>D4–D7</b>: the four data pins used in 4-bit mode.</li></ul>',
  a: 'A literal roommate who only reads what you slide through the slot and does exactly that, but only if you knock politely between notes.' },
 { t: 'Sending a byte in 4-bit mode', h:
  '<p>In 4-bit mode only D4–D7 are connected, so a byte goes out as <b>two nibbles</b>, high nibble first, each latched by an Enable pulse.</p>' +
  '<ol><li>Set RS (0 for a command, 1 for text).</li><li>Put the high nibble on D4–D7.</li><li>Pulse E high then low.</li><li>Put the low nibble on D4–D7.</li><li>Pulse E again.</li><li>Wait for the command’s delay.</li></ol>',
  a: 'Slide the first half of the note, knock. Slide the second half, knock. Then wait.' },
 { t: 'Commands, delays and cursor position', h:
  '<p>Every command in the datasheet lists its own delay. Skip them and the screen does nothing, quietly. <b>Clear display</b> (0x01) is the slowest command and needs the longest delay.</p>' +
  '<p>To move the cursor, send the command byte:</p>' + F('0x80 | (row &lt;&lt; 6) | col') +

/* ---- layouts. All are 11 wide, 7 tall. The bins fill row 6. ---- */
// a loop: left part, right part, sockets/fixed parts along the top row
function benchRig(o) {
  const sockets = (o.sockets || []).map(k => ({ id: k.id, label: k.label, x: k.x, y: k.y == null ? 1 : k.y }));
  const fixed = [];
  if (o.left !== null) fixed.push(Object.assign({ x: 1, y: 3, kind: 'BAT', label: '', info: '' }, o.left || {}));
  if (o.right !== null) fixed.push(Object.assign({ x: 9, y: 3, kind: 'BOX', label: '', info: '' }, o.right || {}));
  (o.top || []).forEach(f => fixed.push(Object.assign({ y: 1 }, f)));

  return { cols: 11, rows: 7, sockets, fixed, wires: o.wires || [[[1, 3], [1, 1], [9, 1], [9, 3], [9, 5], [1, 5], [1, 3]]], start: o.start || { x: 5, y: 3 }, lever: o.lever || { x: 10, y: 5 } };
}
// sockets along a row (ordering, matching, picking settings)
function rowRig(o) {
  const n = o.sockets.length, xs = n === 1 ? [5] : n === 2 ? [3, 7] : n === 3 ? [2, 5, 8] : n === 4 ? [1, 4, 7, 10] : n === 5 ? [1, 3, 5, 7, 9] : n === 6 ? [0, 2, 4, 6, 8, 10] : [0, 1, 3, 4, 6, 7, 9].slice(0, n);
  const sockets = o.sockets.map((k, i) => ({ id: k.id, label: k.label, x: xs[i], y: o.y == null ? 1 : o.y }));

// two rows of sockets (e.g. cause on top, effect below)
function gridRig(o) {

  rows.forEach((row, r) => { const n = row.length, xs = n === 1 ? [5] : n === 2 ? [3, 7] : n === 3 ? [2, 5, 8] : n === 4 ? [1, 4, 7, 10] : [1, 3, 5, 7, 9]; row.forEach((k, i) => sockets.push({ id: k.id, label: k.label, x: xs[i], y: ys[r] })); });
  return { cols: 11, rows: 7, sockets, fixed: o.fixed || [], wires: o.wires || [], start: o.start || { x: 5, y: 5 }, lever: o.lever || { x: 10, y: 5 } };
}

/* ---- builders ---- */
// mk: wraps a calc(p) that runs only once every socket is filled
const mk = o => Object.assign({}, o.rig, { q: o.q, teach: o.teach, hint: o.hint, parts: o.parts, coach: o.coach,
  model(p) { const need = (o.rig.sockets || []).every(k => p[k.id]); if (!need) return { meters: o.idle || [], note: o.idleNote || '' }; return Object.assign({ live: true }, o.calc(p)); } });
// dial: one socket whose part sets a number; the meter shows it; match the target
function dial(o) {

    idle: [meterOf(o.label || 'Reading', '—'), meterOf('Target', show(tgt))], idleNote: o.idleNote || 'Place a part to see the reading.',
    calc(p) { const x = rd(p[id]), ok = near(x, tgt, tol), ms = [meterOf(o.label || 'Reading', show(x), ok ? 'good' : 'bad'), meterOf('Target', show(tgt))].concat(o.extra ? o.extra(p[id], x) : []);
      return { ok, meters: ms, note: o.note(p[id], x), why: o.why, fail: typeof o.fail === 'function' ? o.fail(x, tgt) : (o.fail || (x > tgt ? 'Too high.' : 'Too low.')) }; },
  };
  if (o.guide) spec.coach = (p, carry) => { if (!p[id] && !carry) return 'walk to a bin, face it and press Space.'; if (!p[id]) return 'face the socket and press Space to place it.'; const x = rd(p[id]); if (near(x, tgt, tol)) return 'right on target. Press Enter to test.';
    const nb = o.parts.slice().sort((a, b) => a.v - b.v), i = nb.findIndex(q => q.label === p[id].label), e = q => Math.abs(rd(q) - tgt), up = nb[i + 1], dn = nb[i - 1];
    const cands = [up, dn].filter(q => q && e(q) < e(p[id])); const pick1 = cands.sort((a, b) => e(a) - e(b))[0];
    return (x > tgt ? 'too high. ' : 'too low. ') + (pick1 ? 'Try a <b>' + (pick1 === up ? 'bigger' : 'smaller') + '</b> one.' : 'Try a different one.'); };

function slot(o) {

  const rig = o.rig || rowRig({ sockets: o.slots.map(s => ({ id: s.id, label: s.label })), fixed: o.fixed });
  const spec = { rig, q: o.q, teach: o.teach, hint: o.hint, parts: o.parts.map(x => typeof x === 'string' ? PT(x, x, o.kind || 'BOX') : x),
    idle: o.count === false ? [] : [meterOf('In place', '0 of ' + n)], idleNote: o.idleNote || '',
    calc(p) { const good = o.slots.filter(s => p[s.id].label === s.want).length, ok = good === n; const ms = o.count === false ? [] : [meterOf('In place', good + ' of ' + n, ok ? 'good' : '')].concat(o.meters ? o.meters(p, good) : []);
      return { ok, meters: ms, note: o.note ? o.note(p, good) : (ok ? 'Everything is in place.' : (o.count === false ? '' : good + ' of ' + n + ' are right.')), why: o.why, fail: o.fail || '' }; } };

// an 8-bit register: set each bit with a 0 or a 1. meters show the register in binary as you build it.

    const sl = pairSlots([['Set a bit', 'REG |= (1<<N)'], ['Clear a bit', 'REG &= ~(1<<N)'], ['Toggle a bit', 'REG ^= (1<<N)'], ['Test a bit', 'REG & (1<<N)']], 20);
    return SL({ slots: sl, rig: pairRig(sl), parts: sl.map(s => s.want), guide: true, q: '<b>Build:</b> match each goal to its code pattern.', teach: '<p>One register controls 8 pins at once; writing the whole register resets the other seven. Change <b>one bit at a time</b>: <b>set</b> <code>REG |= (1&lt;&lt;N)</code>, <b>clear</b> <code>REG &amp;= ~(1&lt;&lt;N)</code>, <b>toggle</b> <code>REG ^= (1&lt;&lt;N)</code>, and <b>test</b> <code>REG &amp; (1&lt;&lt;N)</code> (non-zero if the bit is 1).</p>', why: 'OR sets, AND with NOT clears, XOR toggles, AND tests.' }); } },
  { t: 'lab', tier: 2, hint: 'AND with ~(1<<4) clears bit 4 and keeps the others.', q: '', gen() { return bitsLab({ reg: 'PORTB', startText: 'now 00010110', target: '00000110', q: '<b>Build:</b> PORTB is <code>00010110</code>. Run <code>PORTB &amp;= ~(1&lt;&lt;4);</code>. What is PORTB afterwards?', teach: '<p><code>~(1&lt;&lt;4)</code> is <code>11101111</code>. ANDing with it forces bit 4 to 0 and keeps every other bit.</p>', why: '00010110 AND 11101111 = 00000110.' }); } },
  { t: 'lab', tier: 3, boss: true, hint: '(1<<0)|(1<<5) is 00100001. OR sets both bits.', q: '', gen() { return bitsLab({ reg: 'PORTB', startText: 'now 10001110', target: '10101111', q: '<b>Build:</b> PORTB is <code>10001110</code>. Run <code>PORTB |= (1&lt;&lt;0)|(1&lt;&lt;5);</code>. What is PORTB afterwards?', teach: '<p>Combine masks with OR to set several bits at once. OR can set a bit but never clears one.</p>', why: '10001110 OR 00100001 = 10101111.' }); } },
]);

/* ---- 5 ---- */
ML(5, 'Masks and Nibbles', [
  { t: 'lab', tier: 1, hint: '0xF0 = 1111 0000 keeps the upper nibble. 0x0F keeps the lower nibble.', q: '', gen() {
    const sl = pairSlots([['0xF0', 'Keeps bits 7–4'], ['0x0F', 'Keeps bits 3–0']], 10);
    return SL({ slots: sl, rig: pairRig(sl), parts: ['Keeps bits 7–4', 'Keeps bits 3–0', 'Keeps every bit'], guide: true, q: '<b>Build:</b> a <b>nibble</b> is 4 bits. Which half of a byte does each mask keep?', teach: '<p>A <b>mask</b> is a pattern you AND with a value to force some bits to 0. <b>0xF0</b> = 1111 0000 keeps the <b>upper nibble</b> (bits 7–4). <b>0x0F</b> = 0000 1111 keeps the <b>lower nibble</b> (bits 3–0). Bits are numbered from 0 on the right. Bits have no meaning on their own: <code>65 &amp; 0x0F</code> = 1 whether you meant the number 65 or the letter ‘A’.</p>', why: '0xF0 keeps the top four, 0x0F keeps the bottom four.' }); } },
  { t: 'lab', tier: 2, hint: 'Upper nibble of PORTA stays (1010). Lower nibble comes from num (0000).', q: '', gen() { return bitsLab({ reg: 'PORTA', startText: 'was 10101110', target: '10100000', q: '<b>Build:</b> PORTA is <code>10101110</code> and num is <code>10000000</code>. Run <code>PORTA = (PORTA &amp; 0xF0) | (num &amp; 0x0F);</code>. What is PORTA afterwards?', teach: '<p>To write a 4-bit value to PA0–PA3 and <b>keep</b> PA4–PA7: <b>mask first, then OR</b>. <code>PORTA &amp; 0xF0</code> clears the lower nibble and keeps the upper. <code>num &amp; 0x0F</code> keeps only the bits you want. OR combines them.</p>', why: 'Upper nibble kept: 1010. Lower nibble from num: 0000. Result 10100000.' }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'Clear just the bits you replace, then OR in the new ones.', q: '', gen() {
    return slot({ slots: [{ id: 'a', label: 'the one-liner', want: 'PORTA = (PORTA & 0xF0) | (num & 0x0F);' }], rig: rowRig({ sockets: [{ id: 'a', label: 'the one-liner' }] }), parts: ['PORTA = (PORTA & 0xF0) | (num & 0x0F);', 'PORTA = num & 0x0F;', 'PORTA |= num;', 'PORTA &= num;'], count: false, q: '<b>Build:</b> which one-liner writes a 4-bit number to PA0–PA3 <b>without disturbing PA4–PA7</b>?', teach: '<p>OR alone cannot clear a bit, and AND alone cannot set one. Plain <code>PORTA = num &amp; 0x0F</code> stomps PA4–PA7 on every call. You need <b>both</b>: AND to clear the old bits, OR to bring in the new ones.</p>', why: 'Mask then OR keeps the upper nibble.' }); } },
]);

/* ---- 6 ---- */
ML(6, 'Pull-ups and Polling', [
  { t: 'lab', tier: 1, hint: 'Nothing connected = random. Pull-up with the switch open = 1. Switch pressed = 0 (active-low).', q: '', gen() {
    const sl = pairSlots([['Input with nothing connected', 'Random (floating)'], ['Pull-up on, button not pressed', '1'], ['Pull-up on, button pressed', '0']], 22);
    return SL({ slots: sl, rig: pairRig(sl), parts: ['Random (floating)', '1', '0'], guide: true, q: '<b>Build:</b> what does the pin read in each situation?', teach: '<p>An input with nothing connected <b>floats</b> and reads random noise. A <b>pull-up</b> resistor holds it at 1. A button to ground pulls it to <b>0</b> when pressed, so the logic is <b>active-low</b>: pressed = 0, released = 1.</p>', why: 'Floating is random; the pull-up gives 1; pressed gives 0.' }); } },
  { t: 'lab', tier: 2, hint: 'Direction first, then the pull-up, then read PIN. A 0 means pressed.', q: '', gen() { const items = ['Make the pin an input (DDR bit = 0)', 'Turn the pull-up on (PORT bit = 1)', 'Read PINx', 'A 0 means pressed'];
    return SL({ slots: ordSlots(items, 'step '), rig: ordRig(4, 'step '), parts: items, count: false, q: '<b>Build:</b> put the steps of reading a switch in order.', teach: '<p>Set the direction, enable the pull-up, then read <b>PINx</b>. <b>Polling</b> (re-checking in a loop) can miss a fast press: if your code is busy when a quick press-and-release happens, the pin is back to normal by the next check. That weakness is why <b>interrupts</b> exist.</p>', why: 'DDR input, pull-up, read PIN, 0 = pressed.' }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'PB6 is already an input. Only bit 6 changes to 1: PORTB |= (1<<PORTB6).', q: '', gen() { return bitsLab({ reg: 'PORTB', startText: 'now 00111000', target: '01111000', q: '<b>Build:</b> PB6 is an input (its DDRB bit is 0). PORTB is <code>00111000</code>. Turn the <b>pull-up on for PB6 only</b>. What is PORTB afterwards?', teach: '<p><code>PORTB |= (1&lt;&lt;PORTB6);</code> enables the pull-up on PB6 and changes nothing else.</p>', why: '00111000 OR 01000000 = 01111000.' }); } },
]);

/* ---- 7 ---- */
ML(7, 'Timer0: Normal and CTC Modes', [
  { t: 'lab', tier: 1, hint: 'TCNT0 is the counter, TCCR0 sets the mode and prescaler, OCR0A is the compare value, TIFR0 holds the flags.', q: '', gen() {
    const sl = pairSlots([['TCNT0', 'The counter itself'], ['TCCR0A/B', 'Control: mode and prescaler'], ['OCR0A', 'Compare value'], ['TIFR0', 'Flags']], 12);
    return SL({ slots: sl, rig: pairRig(sl), parts: sl.map(s => s.want), guide: true, q: '<b>Build:</b> match each Timer0 register to its role.', teach: '<p>Timer0 is a real counter that counts up <b>on its own</b>. <b>Normal</b> mode counts 0 to 255 then overflows. <b>CTC</b> (Clear Timer on Compare) mode counts to the number in <b>OCR0A</b> then restarts. The <b>prescaler</b> (CS bits) slows the count. If the CS bits are <b>000</b>, the timer is <b>off</b> (no clock source): the most common reason a timer never counts.</p>', why: 'TCNT0 counter, TCCR0 control, OCR0A compare, TIFR0 flags.' }); } },
  { t: 'lab', tier: 2, hint: 'tick = prescaler ÷ clock. 16 MHz: for 4 µs the prescaler is 64.', q: '', gen() { const tgt = 4;
    return dial({ rig: benchRig({ left: srcB('16 MHz', 'clock', 'The clock is 16 MHz.'), right: boxB('tick', 'one timer tick', 'One Timer0 tick.'), sockets: [{ id: 'r', label: 'prescaler', x: 5 }] }),
      q: '<b>Build:</b> the clock is 16 MHz. Choose the prescaler so one Timer0 tick lasts <b>4 µs</b>.', teach: '<p>A tick is not a fixed time. <b>tick = prescaler ÷ F<sub>clk</sub></b>.</p>', parts: [1, 8, 64, 256, 1024].map(v => PT('÷' + v, v, 'BOX')), read: p => p.v / 16, target: tgt, tol: .01, label: 'Tick', show: x => N2(x) + ' µs', note: (p, x) => p.v + ' ÷ 16 MHz = ' + N2(x) + ' µs.', why: 'prescaler 64.' }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'Td = count × prescaler ÷ Fclk. A full 0-to-255 count at ÷64 and 16 MHz is 255 × 4 µs.', q: '', gen() { const tgt = 1020;
    return dial({ rig: benchRig({ left: srcB('0 → 255', 'Normal mode', 'Timer0 in Normal mode counts 0 to 255.'), right: boxB('time', 'one full count', 'Time for one 0-to-255 count.'), sockets: [{ id: 'r', label: 'prescaler', x: 5 }] }),
      q: '<b>Build:</b> Timer0 in Normal mode on a 16 MHz clock. Choose the prescaler so one 0-to-255 count takes about <b>1 ms</b> (1020 µs).', teach: '<p><b>T<sub>d</sub> = count × prescaler ÷ F<sub>clk</sub></b>. At ÷64 and 16 MHz that is 255 × 4 µs = 1020 µs. At ÷1024 it would be about 16 ms.</p>', parts: [1, 8, 64, 256, 1024].map(v => PT('÷' + v, v, 'BOX')), read: p => 255 * p.v / 16, target: tgt, tol: .02, label: 'Count time', show: x => N2(x) + ' µs', note: (p, x) => '255 × ' + p.v + ' ÷ 16 MHz = ' + N2(x) + ' µs.', why: 'prescaler 64.' }); } },
]);

/* ---- 8 ---- */
ML(8, 'Timer Math and Timer1', [
  { t: 'lab', tier: 1, hint: 'OCR0A = (Td × Fclk ÷ prescaler) − 1. For 0.5 ms at ÷64, 16 MHz: 125 − 1 = 124.', q: '', gen() { const tgt = 500;
    return dial({ rig: benchRig({ left: srcB('÷64 · 16 MHz', 'CTC mode', 'Prescaler 64 on a 16 MHz clock.'), right: boxB('delay', 'compare match', 'The time until the compare match.'), sockets: [{ id: 'r', label: 'OCR0A', x: 5 }] }),
      q: '<b>Build:</b> a prescaler of 64 on a 16 MHz clock, CTC mode. Choose the value for OCR0A that gives a delay of <b>0.5 ms</b>.', teach: '<p>To make CTC ring after a delay: <b>OCR0A = (T<sub>d</sub> × F<sub>clk</sub> ÷ Prescaler) − 1</b>. The −1 is there because counting starts at 0. <b>Timer1</b> is the same idea but <b>16 bits</b> wide (counts to 65,535).</p>', parts: [62, 124, 249, 255, 500].map(v => PT('' + v, v, 'BOX')), read: p => (p.v + 1) * 4, target: tgt, tol: .003, guide: true, label: 'Delay', show: x => N2(x) + ' µs', note: (p, x) => '(' + p.v + ' + 1) × 4 µs = ' + N2(x) + ' µs.', why: '(0.0005 × 16,000,000 ÷ 64) − 1 = 124.' }); } },
  { t: 'lab', tier: 2, hint: 'OCR0A = Td ÷ tick − 1, with tick = 4 µs at ÷64.', q: '', gen() { const ms = pick([0.25, 0.5, 0.75, 1]), tgt = ms * 1000, ocr = ms * 250 - 1;
    return dial({ rig: benchRig({ left: srcB('÷64 · 16 MHz', 'CTC', 'A 4 µs tick.'), right: boxB('delay', 'compare match', 'Delay to the match.'), sockets: [{ id: 'r', label: 'OCR0A', x: 5 }] }),
      q: '<b>Build:</b> prescaler 64, 16 MHz (4 µs per tick). Choose OCR0A for a delay of <b>' + ms + ' ms</b>.', teach: '<p>OCR0A = (delay ÷ 4 µs) − 1.</p>', parts: pickR([61, 62, 124, 125, 187, 249, 250, 255], 5, ocr).map(v => PT('' + v, v, 'BOX')), read: p => (p.v + 1) * 4, target: tgt, tol: .003, label: 'Delay', show: x => N2(x) + ' µs', note: (p, x) => N2(x) + ' µs.', why: 'OCR0A = ' + ocr + '.' }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'Timer1 is 16-bit: OCR1A = (0.01 × 16,000,000 ÷ 8) − 1 = 19999. Write the high byte first.', q: '', gen() { const tgt = 10000;
    return dial({ rig: benchRig({ left: srcB('÷8 · 16 MHz', 'Timer1 CTC', 'Timer1 with a prescaler of 8 on a 16 MHz clock.'), right: boxB('period', '10 ms wanted', 'Wanted: 10 ms.'), sockets: [{ id: 'r', label: 'OCR1A', x: 5 }] }),
      q: '<b>Build:</b> Timer1 in CTC mode, prescaler 8, 16 MHz. Choose OCR1A for an <b>exact 10 ms</b> period.', teach: '<p>Timer1’s 16-bit registers are moved 8 bits at a time. <b>Write: high byte first, then low byte. Read: low byte first, then high byte.</b> Do it backwards and you silently get the wrong number.</p>', parts: [1999, 19999, 20000, 39999, 65535].map(v => PT('' + v, v, 'BOX')), read: p => (p.v + 1) * 0.5, target: tgt, tol: .00001, label: 'Period', show: x => N2(x) + ' µs', note: (p, x) => '(' + p.v + ' + 1) × 0.5 µs = ' + N2(x) + ' µs.', why: '(0.01 × 16,000,000 ÷ 8) − 1 = 19999.' }); } },
]);

/* Workshop builds for Embedded Quest, levels 9-15 */
ML(9, 'Interrupts: the Three Switches', [
  { t: 'lab', tier: 1, hint: 'Global (sei), the feature’s own enable, and the event itself. All three.', q: '', gen() {
    const sl = pairSlots([['Master switch', 'sei();'], ['Feature switch', 'Enable bit for that feature'], ['The trigger', 'The event happens']], 20);
    return SL({ slots: sl, rig: pairRig(sl), parts: ['sei();', 'Enable bit for that feature', 'The event happens'], guide: true, q: '<b>Build:</b> an interrupt only runs when <b>three</b> things are all true. Match each switch to how it is turned on.', teach: '<p>An <b>interrupt</b> runs automatically when something happens: the <b>hardware</b> watches every clock cycle, pauses your code the instant the event happens, runs your <b>ISR</b>, then resumes. But <b>all three</b> must be true: <b>(1)</b> interrupts are on chip-wide (<code>sei();</code>), <b>(2)</b> that feature’s own interrupt is enabled, <b>(3)</b> the event actually happens. Miss one and your code silently never runs.</p>', why: 'sei() master, enable bit per feature, the event.' }); } },
  { t: 'lab', tier: 2, hint: 'Polling puts your code on watch duty. An interrupt moves that duty to the hardware.', q: '', gen() {
    const sl = pairSlots([['Re-check the pin in a loop', 'Polling'], ['Pin change runs ISR_vect', 'Interrupt'], ['while(!(TIFR0 & 1)) {}', 'Polling'], ['ISR(TIMER0_COMPA_vect)', 'Interrupt']], 24);
    return SL({ slots: sl, rig: pairRig(sl), parts: ['Polling', 'Interrupt'], count: false, q: '<b>Build:</b> polling or interrupt?', teach: '<p>With polling your code does the watching, and can miss a fast event. With an interrupt the hardware watches.</p>', why: 'Loops that check are polling; ISRs are interrupts.' }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'The hardware does the watching and jumping. Your ISR should be short.', q: '', gen() { const items = ['The event happens', 'Hardware pauses main()', 'The ISR runs', 'Control returns to main()'];
    return SL({ slots: ordSlots(items, 'step '), rig: ordRig(4, 'step '), parts: items, count: false, q: '<b>Build:</b> put what happens when an interrupt fires in order.', teach: '<p>Keep an ISR <b>short</b>: no long delays inside it, or other interrupts are not answered. Use <code>sei()</code> to turn the master switch on and <code>cli()</code> to turn it off.</p>', why: 'Event, pause, ISR, return.' }); } },
]);

ML(10, 'PCINT and Interrupt Bugs', [
  { t: 'lab', tier: 1, hint: 'PCINT0 = Port B, PCINT1 = Port J, PCINT2 = Port K.', q: '', gen() {
    const sl = pairSlots([['PCINT0', 'Port B'], ['PCINT1', 'Port J'], ['PCINT2', 'Port K']], 10);
    return SL({ slots: sl, rig: pairRig(sl), parts: ['Port B', 'Port J', 'Port K'], guide: true, q: '<b>Build:</b> match each pin-change group to its port.', teach: '<p>A <b>pin change interrupt (PCINT)</b> fires on <b>any change</b> on an armed pin, in groups of 8 pins that share one vector. <b>PCICR</b> arms a whole group (bit PCIE), <b>PCMSK</b> arms one pin, and <code>sei()</code> is the master switch. It does not tell you <i>which</i> pin changed, or which way.</p>', why: 'PCINT0 Port B, PCINT1 Port J, PCINT2 Port K.' }); } },
  { t: 'lab', tier: 2, hint: 'XOR leaves a 1 wherever the two bytes differ.', q: '', gen() { return bitsLab({ reg: 'changedbits', startText: 'PINB ^ history', names: ['PB7', 'PB6', 'PB5', 'PB4', 'PB3', 'PB2', 'PB1', 'PB0'], target: '10011111', q: '<b>Build:</b> the history byte is <code>00100110</code> and PINB now reads <code>10111001</code>. Show <code>changedbits = PINB ^ portbhistory;</code>.', teach: '<p>To find which pin changed, <b>XOR</b> the new pin state with a saved <b>history byte</b>: a 1 appears in every position that changed. Then test each bit with <code>changedbits &amp; (1&lt;&lt;PBn)</code>. A PCINT also fires on every flicker of switch bounce.</p>', why: '00100110 XOR 10111001 = 10011111.' }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'PCICR arms a whole group, PCMSK arms one pin, sei() is the master switch.', q: '', gen() {
    const sl = pairSlots([['PCICR', 'Arms a whole group of 8 pins'], ['PCMSK', 'Arms one specific pin'], ['sei()', 'The chip-wide master switch']], 10);
    return SL({ slots: sl, rig: pairRig(sl), parts: sl.map(s => s.want), count: false, q: '<b>Build:</b> arm the pin-change interrupt: match each item to its role.', teach: '<p>Arm the group, arm the pin, then turn on the master switch. One more bug to know: if main reads a <b>2-byte</b> variable that an interrupt can change, the interrupt could fire between the two bytes and you would read half-old, half-new data. The fix: <code>cli();</code> around the read, then <code>sei();</code>.</p>', why: 'PCICR group, PCMSK pin, sei master.' }); } },
]);

ML(11, 'Timer Interrupts', [
  { t: 'lab', tier: 1, hint: 'Normal mode: TOIE0 and TIMER0_OVF_vect. CTC mode: OCIE0A and TIMER0_COMPA_vect.', q: '', gen() {
    const sl = pairSlots([['TOIE0', 'Normal mode'], ['TIMER0_OVF_vect', 'Normal mode'], ['OCIE0A', 'CTC mode'], ['TIMER0_COMPA_vect', 'CTC mode']], 18);
    return SL({ slots: sl, rig: pairRig(sl), parts: ['Normal mode', 'CTC mode'], guide: true, q: '<b>Build:</b> match each item to the timer mode it belongs to.', teach: '<p>Same idea as PCINT, for timers. Instead of polling <b>TIFR0</b>, flip one bit in <b>TIMSK0</b> and write an ISR. <b>Normal</b> mode: <b>TOIE0</b> and <b>TIMER0_OVF_vect</b> (overflow). <b>CTC</b> mode: <b>OCIE0A</b> and <b>TIMER0_COMPA_vect</b> (compare match). Always write an ISR, even an empty one, for anything you enable. A variable shared with an ISR must be <b>volatile</b>.</p>', why: 'Overflow goes with Normal. Compare match goes with CTC.' }); } },
  { t: 'lab', tier: 2, hint: 'Set only bit 0 (TOIE0) and keep the rest.', q: '', gen() { return bitsLab({ reg: 'TIMSK0', startText: 'now 00000100', names: ['bit 7', 'bit 6', 'bit 5', 'bit 4', 'bit 3', 'OCIE0B', 'OCIE0A', 'TOIE0'], target: '00000101', q: '<b>Build:</b> TIMSK0 is <code>00000100</code>. Run <code>TIMSK0 |= (1&lt;&lt;TOIE0);</code>. What is TIMSK0 afterwards?', teach: '<p>OR in the single bit and keep the others.</p>', why: '00000100 OR 00000001 = 00000101.' }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'period = OCR0A × prescaler ÷ Fclk. At ÷64 and 16 MHz each count is 4 µs, so 1 ms needs 250.', q: '', gen() { const tgt = 1000;
    return dial({ rig: benchRig({ left: srcB('÷64 · 16 MHz', 'CTC interrupt', 'A CTC timer interrupt, prescaler 64, 16 MHz.'), right: boxB('ISR', 'runs every', 'How often the ISR runs.'), sockets: [{ id: 'r', label: 'OCR0A', x: 5 }] }),
      q: '<b>Build:</b> a CTC interrupt with prescaler 64 on a 16 MHz clock. Choose OCR0A so the ISR runs every <b>1 ms</b>.', teach: '<p>Recipe: set the <b>mode</b> (CTC), the <b>prescaler</b> (this starts the timer), the <b>count</b> in OCR0A, the <b>feature switch</b> (OCIE0A), then the <b>master switch</b> <code>sei()</code>. The ISR period is <b>OCR0A × prescaler ÷ F<sub>clk</sub></b> (125 gives 0.5 ms).</p>', parts: [62, 125, 250, 255].map(v => PT('' + v, v, 'BOX')), read: p => p.v * 4, target: tgt, tol: .01, label: 'ISR period', show: x => N2(x) + ' µs', note: (p, x) => p.v + ' × 4 µs = ' + N2(x) + ' µs.', why: 'OCR0A = 250.' }); } },
]);

ML(12, 'State Machines and Switch Debounce', [
  { t: 'lab', tier: 1, hint: 'waitPress → debouncePress → waitRelease → debounceRelease → back to waitPress.', q: '', gen() { const items = ['waitPress', 'debouncePress', 'waitRelease', 'debounceRelease'];
    return SL({ slots: ordSlots(items, 'state '), rig: ordRig(4, 'state '), parts: items, guide: true, q: '<b>Build:</b> put the four debounce states in the order they cycle.', teach: '<p>A <b>state machine</b> is one variable that remembers which step you are on plus a switch that says what to do there. A mechanical switch <b>bounces</b>: for a few milliseconds the contact flickers, so one press looks like many. The four-state cycle forces a pause so the pin can settle: <b>waitPress → debouncePress → waitRelease → debounceRelease</b>, then back.</p>', why: 'The cycle loops back to waitPress.' }); } },
  { t: 'lab', tier: 2, hint: 'The ISR only changes which state you are in. The delays live in main().', q: '', gen() {
    const sl = pairSlots([['waitPress', 'Idle until the ISR sees a press'], ['debouncePress', 'Short delay, then wait for release'], ['waitRelease', 'Idle until the release (LED toggles)'], ['debounceRelease', 'Short delay, then back to waitPress']], 16);
    return SL({ slots: sl, rig: pairRig(sl), parts: sl.map(s => s.want), count: false, q: '<b>Build:</b> match each state to what happens there.', teach: '<p>Draw the states and transitions on paper first and the code almost writes itself.</p>', why: 'Each state has one job.' }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'The ISR never blocks: it only changes state. The slow delay lives safely in main().', q: '', gen() {
    const sl = pairSlots([['Change state when the pin changes', 'ISR'], ['delayUs(100) in a debounce state', 'main()'], ['Toggle the LED on the real release', 'ISR'], ['Do nothing in waitPress', 'main()']], 22);
    return SL({ slots: sl, rig: pairRig(sl), parts: ['ISR', 'main()'], count: false, q: '<b>Build:</b> does each piece belong in the ISR or in the main loop?', teach: '<p>The ISR holds the transition logic and the instant actions. <b>main()</b> holds the short blocking delays. A long delay inside an ISR stops other interrupts from being answered.</p>', why: 'Transitions in the ISR, delays in main.' }); } },
]);

ML(13, 'LCD Displays', [
  { t: 'lab', tier: 1, hint: 'RS picks command or text. E latches the data. D4–D7 carry the nibble.', q: '', gen() {
    const sl = pairSlots([['RS', 'Command (0) or text (1)'], ['E (Enable)', 'Latches the data'], ['D4–D7', 'The four data pins']], 12);
    return SL({ slots: sl, rig: pairRig(sl), parts: sl.map(s => s.want), guide: true, q: '<b>Build:</b> match each LCD pin to its job.', teach: '<p>The LCD has its own controller chip. Your job: send the right signals in the right order with the right delays, or it <b>silently ignores</b> you. In <b>4-bit mode</b> only D4–D7 are connected, so a byte goes out as <b>two nibbles</b>, high nibble first, each latched by an Enable pulse (the LCD reads the pins on the falling edge of E).</p>', why: 'RS selects, E latches, D4–D7 carry data.' }); } },
  { t: 'lab', tier: 2, hint: 'RS, high nibble, pulse E, low nibble, pulse E, wait.', q: '', gen() { const items = ['Set RS (0 for a command)', 'Put the high nibble on D4–D7', 'Pulse E', 'Put the low nibble on D4–D7', 'Pulse E again', 'Wait for the command’s delay'];

ML(14, 'PWM Basics', [

  { t: 'lab', tier: 2, hint: 'Veff = D × (Vhigh − Vlow) + Vlow.', q: '', gen() { const V = pick([3.3, 5]), d = pick([20, 50, 80]), tgt = V * d / 100;

      q: '<b>Build:</b> 10-bit Fast PWM has TOP = 1023. Choose OCR1A for a duty cycle of <b>25%</b>.', teach: '<p>In <b>non-inverting</b> mode the pin starts high at the bottom of the count and goes low when TCNT1 equals OCR1A. A bigger OCR1A means more time high: <b>OCR1A = D × TOP</b>. There are 1024 possible duty steps. Steps: make the pin an output, set the mode bits in TCCR1A/B, write OCR1A.</p>', parts: [64, 255, 512, 768, 1023].map(v => PT('' + v, v, 'BOX')), read: p => 100 * p.v / 1023, target: tgt, tol: .01, label: 'Duty', show: x => N2(x) + '%', note: (p, x) => p.v + ' ÷ 1023 = ' + N2(x) + '%.', why: '0.25 × 1023 ≈ 255.' }); } },
]);

ML(15, 'PWM Frequency and DC Motors', [
  { t: 'lab', tier: 1, hint: 'Direction on the A pins, speed on EN (the PWM), power on VCC2.', q: '', gen() {

      q: '<b>Build:</b> variable-TOP Fast PWM with a prescaler of 8 at 16 MHz. Choose TOP (the value for OCR1A) for a PWM frequency of <b>20 kHz</b>.', teach: '<p>In variable-TOP Fast PWM, TOP fixes the frequency and a second compare register holds the duty: <b>TOP = F<sub>clk</sub> ÷ (N · f) − 1</b>, and <b>duty register = D · TOP</b>. A good starting frequency for a DC motor is about 10 kHz.</p>', parts: [49, 99, 199, 999, 1999].map(v => PT('' + v, v, 'BOX')), read: p => 16e6 / (8 * (p.v + 1)), target: tgt, tol: .01, label: 'Frequency', show: x => N2(x / 1000) + ' kHz', note: (p, x) => '16 MHz ÷ (8 × ' + (p.v + 1) + ') = ' + N2(x / 1000) + ' kHz.', why: 'TOP = 99.' }); } },
