<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Power Keeper</title><style>:root{
  --bg:#0e1020; --panel:#181b36; --panel2:#232749; --line:#3d4380; --ink:#f3f4fb; --dim:#a4a9d6;
  --accent:#7ef7c1; --accent2:#ffe66d; --bad:#ff6b6b; --good:#7ef7c1; --accent-ink:#06210f;
  --mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,"Courier New",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.55}
body{min-height:100vh;background:
  radial-gradient(1200px 500px at 50% -10%, color-mix(in srgb,var(--accent) 10%,transparent), transparent 60%), var(--bg)}
#app{max-width:980px;margin:0 auto;padding:18px 16px 60px}
h1,h2,h3{font-family:var(--mono);letter-spacing:.02em;margin:0;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
code,.code{font-family:var(--mono);background:#0b0d1c;border:1px solid var(--line);border-radius:5px;padding:.05em .35em;font-size:.92em;color:#cfe;white-space:nowrap}
pre.code{white-space:pre;padding:10px 14px;overflow-x:auto;display:block;margin:8px 0;line-height:1.5}
.m{font-family:var(--mono);color:var(--accent2)}
sub,sup{line-height:0}
.btn{background:var(--panel2);border:3px solid var(--line);border-radius:10px;padding:9px 16px;font-weight:700;box-shadow:0 4px 0 #0007;transition:transform .08s,box-shadow .08s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0007}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.dim{color:var(--dim)}
.chip{display:inline-block;font:700 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--dim)}
.chip.boss{border-color:var(--bad);color:var(--bad)}
.chip.t1{border-color:#5fd3a0;color:#5fd3a0}.chip.t2{border-color:var(--accent2);color:var(--accent2)}.chip.t3{border-color:#ff9f5a;color:#ff9f5a}

/* home */
.hero{padding:26px 0 8px}
.hero h1{font-size:clamp(2rem,6vw,3.2rem);color:var(--accent);text-shadow:0 3px 0 #0008}
.hero p{max-width:60ch;color:var(--dim);margin:8px 0 0}
.hw{margin:14px 0;padding:12px 16px;border:3px dashed var(--accent2);border-radius:12px;background:#2a2610}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin:16px 0}
.stat b{display:block;font:700 1.5rem var(--mono);color:var(--accent2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:10px}
.card{position:relative;background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:14px 16px 14px;display:flex;flex-direction:column;gap:6px;text-align:left;box-shadow:0 5px 0 #0007}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .num{font:800 1.9rem var(--mono);color:var(--accent)}
.card h3{font-size:1.05rem}
.card p{margin:0;color:var(--dim);font-size:.9rem}
.card .meta{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--dim)}
.stars{font-size:1.2rem;letter-spacing:2px;color:#4a4f7a}
.stars .on{color:var(--accent2)}
.diff{display:inline-flex;gap:3px}.diff i{width:9px;height:9px;border-radius:2px;background:#39406e;display:block}.diff i.on{background:#ff9f5a}
.badge-hw{position:absolute;top:-10px;right:12px;background:var(--accent2);color:#2b2300;font:800 .72rem var(--mono);padding:2px 9px;border-radius:999px}
details.tools{margin-top:26px;border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--panel)}
details.tools summary{cursor:pointer;font-weight:700}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.picks label{display:inline-flex;gap:6px;align-items:center;border:2px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
textarea.out{width:100%;min-height:90px;background:#0b0d1c;color:var(--ink);border:2px solid var(--line);border-radius:8px;font:.85rem var(--mono);padding:8px}

/* play */
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.bar h2{font-size:1.1rem}
.bar .lvl{color:var(--accent)}
.hearts{font-size:1.5rem;letter-spacing:3px;color:var(--bad)}
.hearts .lost{color:#3a3f6c}
.score{font:800 1.2rem var(--mono);color:var(--accent2);min-width:5ch;text-align:right}
.combo{font:700 .85rem var(--mono);color:var(--accent);min-height:1.2em}
.stage{border:3px solid var(--line);border-radius:14px;overflow:hidden;background:#070815;margin-bottom:12px;position:relative}
.stage canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.panel{background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:16px 18px}
.q{font-size:1.15rem;margin:6px 0 12px}
.q p{margin:0 0 8px}
.timer{height:8px;border-radius:6px;background:#242850;overflow:hidden;margin:8px 0}
.timer i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transition:background .3s}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:720px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--panel2);border:3px solid var(--line);border-radius:12px;padding:11px 14px;min-height:54px;box-shadow:0 4px 0 #0007}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font:800 .95rem var(--mono);color:var(--accent);border:2px solid var(--line);border-radius:6px;min-width:1.9em;text-align:center;padding:0 4px;margin-top:1px}
.opt.wrong{border-color:var(--bad);background:#3a1a2a;text-decoration:line-through;opacity:.7}
.opt.right{border-color:var(--good);background:#143a30}
.numrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numrow input{font:700 1.4rem var(--mono);width:11ch;background:#0b0d1c;color:var(--accent2);border:3px solid var(--line);border-radius:10px;padding:8px 12px}
.numrow .u{font:700 1.2rem var(--mono);color:var(--dim)}
.given{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.given span{font:700 .95rem var(--mono);background:#0b0d1c;border:2px solid var(--line);border-radius:8px;padding:3px 10px;color:var(--accent2)}
.tray,.slots,.seq{display:flex;gap:8px;flex-wrap:wrap}
.tray{min-height:54px;padding:8px;border:2px dashed var(--line);border-radius:12px;margin-bottom:10px}
.pill{background:var(--panel2);border:3px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:700;box-shadow:0 3px 0 #0007}
.pill.sel{border-color:var(--accent2);background:#3a3512;transform:translateY(-2px)}
.pill.ok{border-color:var(--good)}.pill.no{border-color:var(--bad);background:#3a1a2a}
.slotrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(130px,230px);gap:10px;align-items:center;margin:6px 0}
.slot{min-height:46px;border:3px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:4px;background:#0b0d1c}
.slot.over{border-color:var(--accent2)}
.slot .pill{box-shadow:none}
.sortcard{font:800 clamp(1rem,5vw,1.5rem) var(--mono);text-align:center;padding:18px 10px;border:3px solid var(--accent);border-radius:14px;background:#0b0d1c;margin:8px 0 12px;min-height:80px;display:flex;align-items:center;justify-content:center;white-space:pre-wrap;word-break:break-word;font-size:clamp(1rem,5vw,1.5rem)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.sortprog{display:flex;gap:5px;margin-bottom:6px}.sortprog i{flex:1;height:7px;border-radius:4px;background:#2b3060}.sortprog i.d{background:var(--accent)}
.wire{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px clamp(28px,12vw,90px);margin:10px 0}
.wire svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.wire .col{display:flex;flex-direction:column;gap:10px;z-index:1}
.wire .pill{text-align:left}
.reg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.bit{display:flex;flex-direction:column;align-items:center;gap:4px}
.bit button{width:56px;height:62px;font:800 1.7rem var(--mono);border-radius:10px;border:3px solid var(--line);background:#0b0d1c;color:#5a6296;box-shadow:0 4px 0 #0007}
.bit button.on{background:var(--accent2);color:#2b2300;border-color:var(--accent2)}
.bit button.bad{border-color:var(--bad)}
.bit small{font:700 .72rem var(--mono);color:var(--dim)}
.regread{text-align:center;font:700 1rem var(--mono);color:var(--dim)}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;border:3px solid;font-size:1rem}
.fb.good{border-color:var(--good);background:#10332b}
.fb.bad{border-color:var(--bad);background:#361a28}
.fb.info{border-color:var(--accent2);background:#2a2610}
.fb b.t{display:block;font:800 .8rem var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.prog{display:flex;gap:6px;margin:0 0 10px}
.prog i{flex:1;height:10px;border-radius:5px;background:#2b3060}.prog i.d{background:var(--accent)}.prog i.c{background:var(--accent2)}.prog i.b{background:#ff9f5a}
.concept{margin:0 0 12px;padding:10px 14px;border-left:5px solid var(--accent);background:#10152e;border-radius:0 10px 10px 0;color:var(--dim);font-size:.98rem}
.concept b{color:var(--ink)}
/* results */
.res{text-align:center;padding:24px 16px}
.res h2{font-size:2rem}
.res .big{font-size:3rem;letter-spacing:6px;margin:8px 0}
.res table{margin:12px auto;border-collapse:collapse;text-align:left}
.res td{padding:4px 14px;border-bottom:1px solid var(--line)}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pop{animation:pop .3s}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sr{position:absolute;left:-9999px}

.seg{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.tr{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin:8px 0 12px}
.trow{background:#0b0d1c;border:2px solid var(--line);border-radius:10px;padding:7px 12px}
.trow .rt{display:block;font:700 .85rem var(--mono);color:var(--accent2)}
.trow .kt{display:block;font-size:.95rem}
details.real{margin-top:8px}
details.real summary{cursor:pointer;color:var(--dim)}
.card .chip{align-self:flex-start}

/* ---- keyboard + lessons ---- */
.kfocus{outline:3px dashed var(--accent2);outline-offset:3px}
.opt.kfocus{border-color:var(--accent2);background:#2a2f5e}
.slot.kfocus{border-color:var(--accent2)}
.keyhint,.keyline{margin-top:12px;font:700 .82rem var(--mono);color:var(--dim);letter-spacing:.02em}
.kcap{display:block;font:800 .78rem var(--mono);color:var(--accent);margin-bottom:2px}
.buckets .btn{display:flex;flex-direction:column;align-items:center;gap:2px}
.lesson .ltitle{font-size:1.25rem;margin:10px 0 8px;color:var(--accent2)}
.lbody p{margin:0 0 .75em}
.lbody ul,.lbody ol{margin:.3em 0 .8em;padding-left:1.3em}
.lbody li{margin:.2em 0}
.formula{margin:.7em 0;padding:10px 14px;background:#0b0d1c;border:2px solid var(--accent);border-radius:10px;font:700 1.05rem var(--mono);color:var(--accent2);text-align:center;overflow-x:auto}
.example{margin:.8em 0;padding:10px 14px;background:#10152e;border-left:5px solid var(--accent2);border-radius:0 10px 10px 0}
.example b.eh{display:block;color:var(--accent2);font:800 .78rem var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.trap{margin:.8em 0;padding:10px 14px;background:#2a1626;border-left:5px solid var(--bad);border-radius:0 10px 10px 0}
.trap b.eh{display:block;color:var(--bad);font:800 .78rem var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.anabox{border-left-color:#4aa3ff}
details.review{margin:0 0 10px;border:2px dashed var(--line);border-radius:10px;padding:6px 12px}
details.review summary{cursor:pointer;font-weight:700;color:var(--dim)}

/* ---- workshop (lab) ---- */
.labwrap{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.labteach{background:#0f1230;border:1px solid var(--line);border-left:5px solid var(--accent2);border-radius:10px;padding:10px 14px;font-size:.95rem}
.labteach .eh,.coach b{display:block;font:800 .7rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent2);margin-bottom:2px}
.labteach p{margin:.3em 0}
.lab{position:relative;width:100%;max-width:640px;margin:0 auto;border:3px solid var(--line);border-radius:14px;overflow:hidden;container-type:inline-size;
  background:linear-gradient(#0b0d1c88,#0b0d1c88),repeating-linear-gradient(0deg,transparent 0 calc(100%/var(--rows) - 1px),#ffffff0d calc(100%/var(--rows) - 1px) calc(100%/var(--rows))),repeating-linear-gradient(90deg,transparent 0 calc(100%/var(--cols) - 1px),#ffffff0d calc(100%/var(--cols) - 1px) calc(100%/var(--cols))),#12142b}
.lab.won{border-color:var(--good);box-shadow:0 0 24px #7ef7c155}
.labwires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.labwires polyline{fill:none;stroke:#4a528f;stroke-width:.09;stroke-linecap:round;stroke-linejoin:round}
.lab.live .labwires polyline{stroke:var(--accent2);filter:drop-shadow(0 0 .08px var(--accent2));stroke-dasharray:.35 .25;animation:labflow .7s linear infinite}
@keyframes labflow{to{stroke-dashoffset:-.6}}
@media (prefers-reduced-motion:reduce){.lab.live .labwires polyline{animation:none;stroke-dasharray:none}}
.ent{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2%;border-radius:10px;font-size:max(9px,2.15cqw);line-height:1.1;text-align:center;color:var(--ink);cursor:pointer}
.ent .gly{width:78%;height:auto;color:var(--dim)}
.ent b{font:800 1em var(--mono);white-space:nowrap}
.ent small{font:600 .85em var(--mono);color:var(--dim);white-space:nowrap}
.ent.bin{background:#2a2447;border:2px solid #5a4d9a;color:#d9ccff}
.ent.bin .gly{color:#b9a8ff}
.ent.socket{border:2px dashed var(--accent2);background:#ffe66d12}
.ent.socket.full{border-style:solid;background:#ffe66d22}
.ent.socket .gly{color:var(--accent2)}
.ent.socket .q{font-size:1.6em;color:var(--accent2)}
.ent.fixed{background:#18305a;border:2px solid #3f6fc4}
.ent.fixed .gly{color:#8fb8ff}
.ent.fixed.k-LED .gly{color:#ff9fb3}.ent.fixed.k-BULB .gly{color:#ffe66d}
.ent.lever{background:#3a1d2c;border:2px solid #d4546e}
.ent.lever i{display:block;width:16%;height:38%;background:#ff6b8a;border-radius:4px;transform:rotate(-24deg);margin-bottom:4%}
.ent.target{outline:3px solid var(--accent);outline-offset:-1px;z-index:2}
.me{position:absolute;transition:left .11s linear,top .11s linear;z-index:3;pointer-events:none;display:flex;align-items:center;justify-content:center}
@media (prefers-reduced-motion:reduce){.me{transition:none}}
.me .body{width:46%;height:70%;background:linear-gradient(#ffcf8a 0 38%,#ff7b54 38% 100%);border:2px solid #0008;border-radius:6px 6px 4px 4px;position:relative}
.me .body::before,.me .body::after{content:"";position:absolute;top:18%;width:14%;height:14%;background:#1a1228;border-radius:50%}
.me .body::before{left:24%}.me .body::after{right:24%}
.me.f-u .body::before,.me.f-u .body::after{display:none}
.me.f-l .body::after{display:none}.me.f-r .body::before{display:none}
.me .carry{position:absolute;bottom:78%;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;background:#2a2447;border:2px solid #b9a8ff;border-radius:7px;padding:1px 5px;font-size:max(8px,1.9cqw);color:#d9ccff;white-space:nowrap}
.me .carry:empty{display:none}
.me .carry .gly{width:2.6em;height:auto;color:#b9a8ff}.me .carry b{font:800 1em var(--mono)}
.facemark{position:absolute;border:2px dashed #7ef7c155;border-radius:8px;pointer-events:none;opacity:0}
.facemark.on{opacity:1}
.labtip{font:700 .85rem var(--mono);color:var(--accent);min-height:1.4em;text-align:center}
.labmeters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.meter{background:#0b0d1c;border:2px solid var(--line);border-radius:10px;padding:4px 12px;min-width:7.5em;text-align:center}
.meter small{display:block;font:700 .68rem var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.meter b{font:800 1.15rem var(--mono)}
.meter.good{border-color:var(--good);color:var(--good)}.meter.bad{border-color:var(--bad);color:var(--bad)}
.labnote{background:#0f1230;border-radius:10px;padding:8px 14px;font-size:.95rem;min-height:2.6em}
.labnote .coach{margin-top:6px;color:var(--accent2)}.labnote .coach b{display:inline;margin:0 6px 0 0}
.labpad{display:none;grid-template-columns:repeat(4,1fr);gap:6px}
.labpad button{padding:12px 0;border-radius:10px;border:2px solid var(--line);background:#232749;font-weight:800}
.labpad .act{grid-column:span 2}
@media (pointer:coarse){.labpad{display:grid}}

/* ---- analogy switch, always on screen ---- */
#app{padding-top:58px}
.anabtn{position:fixed;top:10px;right:12px;z-index:50;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:#181b36ee;color:var(--ink);font:800 .8rem var(--mono);letter-spacing:.04em;box-shadow:0 3px 0 #0007;backdrop-filter:blur(4px)}
.anabtn[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.anabtn:hover{background:#232749}
.ana-off .anaonly{display:none!important}
.q code,.labteach code,.labnote code,.lbody code,.fb code{white-space:normal;overflow-wrap:anywhere}

.hubbtn{position:fixed;top:10px;left:12px;z-index:50;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:#181b36ee;color:var(--ink);font:800 .8rem var(--mono);letter-spacing:.04em;text-decoration:none;box-shadow:0 3px 0 #0007}

:root{--accent:#7ef7c1}</style></head><body><main id="app"></main><script>const ANA_L = {"1": {"key": "AC is a piston pushing water back and forth. A resistor is a narrow pipe: the push turns into heat. A capacitor or coil is a balloon tank or a water wheel: it takes the push and gives it back. The power wiggles up and down. The average of that wiggle, the real power, is what does work.", "map": [["p(t)", "Push times flow, right now."], ["P (real power)", "Water that spins the mill."], ["Q (reactive power)", "Water sloshing in and out of the tank."], ["rms", "The steady push that heats the same as AC."], ["Resistor", "A narrow pipe."], ["Capacitor", "A balloon tank."], ["Inductor", "A heavy water wheel."]]}, "2": {"key": "Some of the water spins the mill (P). Some just sloshes in and out of the tank (Q). The pipe has to carry both (S). Power factor is the share that actually spins the wheel. If the push and the flow are out of step, less of it does work. ELI the ICE man helps you remember who leads.", "map": [["P", "Water spinning the mill."], ["Q", "Water sloshing."], ["S (complex)", "P and Q packed into one number."], ["|S| (apparent)", "Everything the pipe must carry."], ["Power factor", "Share that spins the wheel."], ["Lagging / leading", "Flow trails the push / runs ahead."]]}, "3": {"key": "A motor makes the pipe carry extra sloshing water that does no work, and the pipe heats up. Add a balloon tank right next to the motor (a capacitor in parallel). Now the sloshing stays local and the long pipe carries less. For maximum power, match the load to the pump. Three-phase starts here: three pistons, evenly spaced.", "map": [["PF correction", "A balloon tank beside the motor."], ["Parallel capacitor", "The tank next to the load. The right fix."], ["Series capacitor", "Wrong spot. The main pipe still carries it."], ["Max power transfer", "Match the load to the pump."], ["Three-phase set", "Three pistons, a third of a turn apart."]]}, "4": {"key": "The grid is a big water system. A power plant pumps at high pressure. Big mains carry it across town. Smaller pipes step the pressure down for your house. A Y connection is three pipes meeting at a hub. A Δ is three pipes in a triangle. If all three pipes are identical, no water returns through the hub. So solve one pipe and copy the answer to the other two.", "map": [["Y connection", "Three pipes meeting at a hub."], ["Δ connection", "Three pipes in a triangle."], ["Neutral", "The return pipe at the hub. Carries nothing when balanced."], ["Transformer", "A valve that changes the pressure."], ["Balanced", "Three identical pipes."], ["One-phase shortcut", "Solve one pipe, copy it."]]}, "5": {"key": "A triangle load is awkward. So swap it for a hub load where each pipe is one third as squeezy. Solve the easy version, then convert back. The pressure between two mains is about 1.7 times (√3) the pressure from a main to the hub, tilted 30 degrees. It is like the side of a triangle compared to the distance from the center to a corner.", "map": [["Δ to Y", "Swap triangle for hub: divide by 3."], ["Line voltage", "Pressure between two mains."], ["Phase voltage", "Pressure across one branch."], ["√3∠30°", "Triangle side versus center-to-corner."], ["abc vs acb", "Which piston fires next."]]}, "6": {"key": "Three pistons taking turns means the water never stops. Total power is constant. Safety half: the flow (current) hurts you, not the pressure (volts). A few milliamps is a tingle. Around 20 can lock your muscles. 75 and up can scramble the heart. Ground is an emergency drain to earth. A GFCI is a leak detector that shuts off if water leaves the pipe somewhere it should not.", "map": [["Three-phase power", "Three pistons. Steady flow."], ["Ground", "An emergency drain to earth."], ["Hot / neutral", "Supply pipe / return pipe."], ["GFCI", "A leak detector."], ["Breaker", "An overflow valve protecting the pipes."], ["Let-go current", "Flow too strong to release."]]}, "7": {"key": "Differential equations are hard in time land. The Laplace transform is a translator. Send the problem to s land, where it is just algebra. Solve it. Translate back. A step is turning a faucet on and leaving it on. An impulse is a hammer tap on the pipe: huge, instant, and with a total punch of exactly 1.", "map": [["Laplace transform", "A translator to easy algebra."], ["s", "A map coordinate in s land."], ["Unit step", "A faucet turned on."], ["Unit impulse", "A hammer tap."], ["Sifting", "The tap picks out the value at its moment."]]}, "8": {"key": "A rulebook lets you tweak known translations instead of starting over (shift, scale, derivative). Going back is the other half. Split a big messy fraction into small ones you recognize, like breaking a bill into coins. Look each coin up in the table. Each pole is one way the pipe drains: a plain decay or a wiggle.", "map": [["Operations", "Quick conversions of known pairs."], ["Partial fractions", "Break the bill into coins."], ["Pole", "One way the pipe drains."], ["Repeated pole", "Two drains in a row. Adds a t·e bump."], ["Improper fraction", "Divide first. Impulses appear."]]}, "9": {"key": "Redraw the circuit in s land, where every part acts like a pipe fitting: resistor R, coil sL, capacitor 1/(sC). If the tank started full or the wheel started spinning, add a small extra source for it. Then solve it like any pipe network. The starting conditions are already built in.", "map": [["<code>sL</code>", "The water wheel in s land."], ["<code>1/(sC)</code>", "The balloon tank in s land."], ["Initial condition", "Tank already full, wheel already spinning."], ["Zero-input", "What leftover water does alone."], ["Zero-state", "What the pump does from empty."], ["Total", "Both together."]]}, "10": {"key": "Four worked examples practice the method. Redraw in s land. Solve with Cramer's rule (all the loops together) or Thevenin (shrink the network first). Convert back. Then check the value at time zero. Coupled coils are two water wheels on one shaft. The T-equivalent redraws them as separate wheels.", "map": [["Cramer's rule", "Solve all the loops together."], ["Thevenin", "Replace the network with one pump and one pipe."], ["Mutual inductance", "Two wheels on one shaft."], ["T-equivalent", "Redraw as separate wheels."], ["Check t = 0", "Does the water level at the start match?"]]}, "11": {"key": "A circuit is a box. A signal goes in and a signal comes out, like a water filter. If doubling what goes in doubles what comes out, and two inputs just add, it is linear. If delaying the input just delays the output, it is time invariant. Hit it with one hammer tap and record the splash. That is the impulse response.", "map": [["System", "A pipe network."], ["Linear", "Double in, double out."], ["Time invariant", "Same shape, just delayed."], ["Impulse response h(t)", "The splash from one tap."], ["Transfer function", "How the network treats each frequency."]]}, "12": {"key": "If you know the splash from one tap, you know it for every input. Any signal is a pile of taps of different sizes at different times. Each tap makes its own scaled, delayed splash. The splashes add up. That adding-up is convolution. In s land it is just multiplication: Y = X times H.", "map": [["Convolution", "Adding up all the delayed splashes."], ["Impulse response", "The splash of one tap."], ["Flip and slide", "Line up each tap's splash with now."], ["Y(s) = X(s)H(s)", "The shortcut."], ["LTI", "A predictable pipe network."]]}};
/* ===== Shared game kit: level select, challenge runner, scoring, progress ===== */
const Kit = (() => {
  const TEST = /[?&]test\b/.test(location.search);
  const $ = (s, r) => (r || document).querySelector(s);
  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (k === 'class') e.className = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
    return e;
  }
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const fmt = (x, d = 3) => { const r = Number(x.toFixed(d)); return String(r); };

  let cfg, S, appEl, run = null;
  const TIER_PTS = { 1: 100, 2: 150, 3: 250 };

  /* ---------- storage ---------- */
  const key = () => 'studygame_' + cfg.id;
  function load() { try { return JSON.parse(localStorage.getItem(key())) || {}; } catch (e) { return {}; } }
  function save() { try { localStorage.setItem(key(), JSON.stringify(S)); } catch (e) {} }

  /* ---------- sound ---------- */
  let AC = null;
  function beep(freq, dur, type, vol) {
    if (S.mute) return;
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type || 'square'; o.frequency.value = freq; g.gain.value = vol || 0.05;
      o.connect(g); g.connect(AC.destination); o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
      o.stop(AC.currentTime + dur);
    } catch (e) {}
  }
  const sfx = {
    good() { beep(660, .09); setTimeout(() => beep(880, .12), 80); },
    bad() { beep(160, .25, 'sawtooth', .06); },
    win() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, .18), i * 110)); },
    lose() { [300, 240, 180].forEach((f, i) => setTimeout(() => beep(f, .25, 'sawtooth'), i * 160)); },
  };

  const skin = () => cfg.skin(!!S.ana);
  const lvTitle = l => (S.ana && l.ana && l.ana.title) ? l.ana.title : l.topic;
  /* ---------- helpers ---------- */
  function hwList() {
    const m = /hw=([\d,]+)/.exec(location.hash);
    return m ? m[1].split(',').map(Number).filter(Boolean) : [];
  }
  function parseNum(s) {
    s = String(s).trim().replace(/,/g, '').replace(/[×x]/g, '*');
    if (/^-?\d*\.?\d+\s*\/\s*-?\d*\.?\d+$/.test(s)) { const [a, b] = s.split('/'); return parseFloat(a) / parseFloat(b); }
    if (!/^-?\d*\.?\d+(e-?\d+)?$/i.test(s)) return NaN;
    return parseFloat(s);
  }
  function starsHtml(n) { return '<span class="stars" aria-label="' + n + ' of 3 stars">' + [1, 2, 3].map(i => '<span class="' + (i <= n ? 'on' : '') + '">★</span>').join('') + '</span>'; }
  function diffDots(level) {
    const d = level.diff || 1;
    return h('span', { class: 'diff', role: 'img', title: 'Difficulty ' + d + ' of 5', 'aria-label': 'Difficulty ' + d + ' of 5' }, [1, 2, 3, 4, 5].map(i => h('i', { class: i <= d ? 'on' : '' })));
  }

  /* ---------- keyboard: WASD / arrows everywhere ---------- */
  const DIR = { ArrowUp: 'u', w: 'u', W: 'u', ArrowDown: 'd', s: 'd', S: 'd', ArrowLeft: 'l', a: 'l', A: 'l', ArrowRight: 'r', d: 'r', D: 'r' };
  function focusables() { return [...appEl.querySelectorAll('button:not([disabled]):not([tabindex="-1"]), summary, input:not([disabled]), textarea')].filter(el => el.offsetParent !== null); }
  function moveFocus(dir) {
    const list = focusables(); if (!list.length) return false;
    const cur = document.activeElement && list.includes(document.activeElement) ? document.activeElement : null;
    if (!cur) { list[0].focus(); return true; }
    const r0 = cur.getBoundingClientRect(), cx = r0.left + r0.width / 2, cy = r0.top + r0.height / 2;
    let best = null, bd = 1e9;
    for (const el of list) {
      if (el === cur) continue;
      const r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2, dx = x - cx, dy = y - cy;
      const ok = dir === 'u' ? dy < -4 : dir === 'd' ? dy > 4 : dir === 'l' ? dx < -4 : dx > 4;
      if (!ok) continue;
      const along = dir === 'u' || dir === 'd' ? Math.abs(dy) : Math.abs(dx), across = dir === 'u' || dir === 'd' ? Math.abs(dx) : Math.abs(dy);
      const d = along + across * 2.2;
      if (d < bd) { bd = d; best = el; }
    }
    if (best) { best.focus(); best.scrollIntoView({ block: 'nearest' }); return true; }
    return false;
  }
  function typing(e) { const t = e.target; return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT'); }
  document.addEventListener('keydown', e => {
    if (!appEl || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target && e.target.id === 'anaBtn') return;
    if (!typing(e) && (e.key === 'n' || e.key === 'N')) { e.preventDefault(); setAna(!S.ana); return; }
    if (typing(e)) { if (e.key === 'Escape') e.target.blur(); return; }
    const dir = DIR[e.key];
    if (run && !run.done) {
      if (run.mode === 'lesson') {
        if (e.key === 'Enter' || e.key === ' ' || dir === 'r') { e.preventDefault(); const g = $('#go'); if (g) g.click(); return; }
        if (e.key === 'Escape') { e.preventDefault(); leave(); return; }
        return;
      }
      if (e.key === 'Escape') { e.preventDefault(); leave(); return; }
      if (run.mode === 'chal' && !run.answered) {
        if ((e.key === 'h' || e.key === 'H')) { const hb = $('#hintbtn'); if (hb && !hb.disabled) { e.preventDefault(); hb.click(); } return; }
        if ((e.key === 'l' || e.key === 'L') && !dir) { const d = $('#reviewlesson'); if (d) { e.preventDefault(); d.open = !d.open; } return; }
        if (run.b && run.b.key && run.b.key(e, dir)) { e.preventDefault(); return; }
        return;
      }
      if (run.answered) {
        if (e.key === 'Enter' || e.key === ' ' || dir === 'r') { const nb = $('#nextbtn'); if (nb) { e.preventDefault(); nb.click(); } return; }
      }
    }
    if (run && run.done) {
      if (e.key === 'Escape') { e.preventDefault(); home(); return; }
      if (dir) { if (moveFocus(dir)) e.preventDefault(); return; }
      return;
    }
    if (dir && !e.shiftKey) { if (moveFocus(dir)) e.preventDefault(); }
  });
  function leave() { if (!TEST && run && !run.done && !confirm('Leave this level? Progress in this run is lost.')) return; home(); }

  /* ---------- home / level select ---------- */
  function home() {
    stopRun();
    document.title = cfg.title;
    const hw = hwList();
    const doneAll = cfg.levels.filter(l => (S.levels[l.n] || {}).done).length;
    const totalStars = cfg.levels.reduce((a, l) => a + ((S.levels[l.n] || {}).stars || 0), 0);
    const totalScore = cfg.levels.reduce((a, l) => a + ((S.levels[l.n] || {}).best || 0), 0);
    appEl.replaceChildren();
    const hero = h('div', { class: 'hero' }, h('h1', null, cfg.title), h('p', null, skin().tagline));
    appEl.append(hero);
    if (hw.length) {
      const doneHw = hw.filter(n => (S.levels[n] || {}).done).length;
      appEl.append(h('div', { class: 'hw', role: 'status' }, h('b', null, 'Assigned: levels ' + hw.join(' and ') + '.'), ' ', doneHw + ' of ' + hw.length + ' complete.'));
    }
    appEl.append(h('div', { class: 'stats' },
      h('div', { class: 'stat' }, h('b', null, doneAll + '/' + cfg.levels.length), 'levels cleared'),
      h('div', { class: 'stat' }, h('b', null, totalStars + '/' + cfg.levels.length * 3), 'stars'),
      h('div', { class: 'stat' }, h('b', null, totalScore), 'total best score')));
    const seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Analogy mode' },
      h('span', { class: 'dim' }, 'Analogy mode:'),
      h('button', { class: 'btn' + (S.ana ? ' primary' : ''), 'aria-pressed': S.ana ? 'true' : 'false', onclick: () => setAna(true) }, 'On: ' + cfg.modes.on),
      h('button', { class: 'btn' + (!S.ana ? ' primary' : ''), 'aria-pressed': !S.ana ? 'true' : 'false', onclick: () => setAna(false) }, 'Off: ' + cfg.modes.off));
    appEl.append(seg);
    appEl.append(h('div', { class: 'row', style: 'margin-top:10px' },
      h('label', { class: 'row' }, h('input', { type: 'checkbox', checked: !!S.calm, onchange: e => { S.calm = e.target.checked; save(); } }), cfg.timer ? ' Calm mode (no timers)' : ' Calm mode'),
      h('label', { class: 'row' }, h('input', { type: 'checkbox', checked: !!S.mute, onchange: e => { S.mute = e.target.checked; save(); } }), ' Mute sound')));
    const grid = h('div', { class: 'grid', role: 'list' });
    for (const l of cfg.levels) {
      const p = S.levels[l.n] || {};
      const c = h('button', { class: 'card', role: 'listitem', onclick: () => start(l), 'aria-label': 'Level ' + l.n + ': ' + lvTitle(l) + (p.done ? ', cleared, ' + p.stars + ' stars' : '') },
        hw.includes(l.n) ? h('span', { class: 'badge-hw' }, 'ASSIGNED') : null,
        h('div', { class: 'num' }, String(l.n).padStart(2, '0')),
        h('h3', null, lvTitle(l)),
        S.ana && l.ana ? h('p', null, h('b', null, 'Topic: '), l.topic) : null,
        h('p', null, S.ana && l.ana ? l.ana.mission : l.blurb),
        l.lec ? h('div', { class: 'chip' }, 'Lecture ' + l.lec) : null,
        h('div', { class: 'meta' }, diffDots(l), h('span', { class: 'sp' }), h('span', { html: starsHtml(p.stars || 0) }), p.best ? h('span', null, p.best + ' pts') : h('span', null, l.chals.length + ' challenges')));
      grid.append(c);
    }
    appEl.append(h('p', { class: 'dim keyline' }, 'Move with W A S D or the arrow keys. Enter or Space opens a level.'));
    appEl.append(grid);

    // teacher / progress tools
    const picks = h('div', { class: 'picks' });
    const out = h('textarea', { class: 'out', readonly: true, 'aria-label': 'Assignment link' });
    function upd() {
      const sel = [...picks.querySelectorAll('input:checked')].map(i => i.value);
      out.value = sel.length ? location.href.split('#')[0] + '#hw=' + sel.join(',') : '';
    }
    cfg.levels.forEach(l => picks.append(h('label', null, h('input', { type: 'checkbox', value: l.n, onchange: upd }), 'Level ' + l.n)));
    const rep = h('textarea', { class: 'out', readonly: true, 'aria-label': 'Progress report' });
    function report() {
      rep.value = cfg.title + ' progress\n' + cfg.levels.map(l => { const p = S.levels[l.n] || {}; return 'Level ' + l.n + ' (' + l.topic + '): ' + (p.done ? p.stars + ' stars, best ' + p.best + ' pts, ' + p.plays + ' plays' : 'not cleared'); }).join('\n');
      rep.select();
    }
    appEl.append(h('details', { class: 'tools' }, h('summary', null, 'Assign levels and progress report'),
      h('p', { class: 'dim' }, 'Pick levels to assign. The link below opens this game with those levels highlighted as homework. It only works for students once the file is hosted somewhere they can reach.'),
      picks, out,
      h('p', null, h('button', { class: 'btn', onclick: report }, 'Show my progress report')), rep,
      h('p', null, h('button', { class: 'btn ghost', onclick: () => { if (confirm('Erase all saved progress on this device?')) { S.levels = {}; save(); home(); } } }, 'Reset progress'))));
    window.scrollTo(0, 0);
    if (!TEST) { const cards = [...grid.querySelectorAll('button.card')]; const nxt = cfg.levels.findIndex(l => !(S.levels[l.n] || {}).done); (cards[nxt < 0 ? 0 : nxt] || cards[0]).focus({ preventScroll: true }); }
  }

  /* ---------- run lifecycle ---------- */
  function stopRun() {
    if (run) { clearInterval(run.tick); if (run.stage && run.stage.destroy) run.stage.destroy(); run = null; }
  }

  function start(level) {
    stopRun();
    document.title = 'Level ' + level.n + ' · ' + cfg.title;
    const SK = skin();
    const chals = level.chals;
    run = { mode: 'chal', shown: {}, level, i: 0, hearts: cfg.hearts || 3, score: 0, combo: 0, firstTry: 0, hintsUsed: 0, results: [], attempts: 0, hinted: false, done: false, tstart: 0 };
    appEl.replaceChildren();
    const head = h('div', { class: 'bar' },
      h('button', { class: 'btn ghost', onclick: leave }, '← Levels (Esc)'),
      h('h2', { id: 'lvtitle' }, h('span', { class: 'lvl' }, 'Level ' + level.n), ' · ' + lvTitle(level)),
      h('span', { class: 'sp' }),
      h('span', { class: 'hearts', id: 'hearts', role: 'img' }),
      h('span', { class: 'score', id: 'score', 'aria-live': 'off' }, '0'));
    const stageBox = h('div', { class: 'stage' });
    const prog = h('div', { class: 'prog', id: 'prog', 'aria-hidden': 'true' }, chals.map(() => h('i')));
    const combo = h('div', { class: 'combo', id: 'combo', 'aria-live': 'polite' });
    const body = h('div', { id: 'body' });
    appEl.append(head, stageBox, prog, combo, body);
    run.stage = cfg.stage ? cfg.stage(level, stageBox, !!S.ana) : null;
    if (run.stage && run.stage.setProgress) run.stage.setProgress(0, chals.length);
    drawHud();
    run.briefing = false;
    if (!level.learn && (level.intro || (S.ana && level.ana))) {
      run.briefing = true;
      const A = S.ana && level.ana;
      const bp = h('div', { class: 'panel' }, h('h3', null, A ? 'Mission: ' + level.ana.title : 'Briefing'));
      if (A) {
        bp.append(h('div', { class: 'concept', html: '<b>' + level.ana.mission + '</b>' + (level.ana.key ? '<br>' + level.ana.key : '') }));
        if (level.ana.map && level.ana.map.length) bp.append(h('div', { class: 'tr' }, level.ana.map.map(m => h('div', { class: 'trow' }, h('span', { class: 'rt', html: m[0] }), h('span', { class: 'kt', html: m[1] })))));
        if (level.intro) bp.append(h('details', { class: 'real' }, h('summary', null, 'The real thing (technical version)'), h('div', { class: 'concept', html: level.intro })));
      } else bp.append(h('div', { class: 'concept', html: level.intro }));
      body.append(h('div', { class: 'panel' }, ...bp.childNodes,
        h('div', { class: 'actions' }, h('button', { class: 'btn primary', id: 'go', onclick: next }, 'Start level  (Enter)'))));
      $('#go').focus();
    } else next();
  }

  function drawHud() {
    const hs = $('#hearts'), max = cfg.hearts || 3;
    hs.replaceChildren();
    for (let i = 0; i < max; i++) hs.append(h('span', { class: i < run.hearts ? '' : 'lost' }, skin().heartIcon || '♥'));
    hs.setAttribute('aria-label', run.hearts + ' of ' + max + ' ' + (skin().heartName || 'lives') + ' left');
    $('#score').textContent = run.score;
    const p = $('#prog');
    [...p.children].forEach((el, i) => { el.className = i < run.i ? (run.results[i] && run.results[i].ok ? 'd' : 'b') : i === run.i ? 'c' : ''; });
    $('#combo').textContent = run.combo >= 2 ? 'Streak x' + run.combo + '  (+' + Math.min(run.combo - 1, 5) * 10 + '% points)' : '';
  }

  /* ---------- lessons (teach first, then ask) ---------- */
  function lessonTiers(L) { const t = new Set(L.chals.map(c => Math.min(3, c.tier || 1))); return [1, 2, 3].filter(x => t.has(x) && L.learn && L.learn[x]); }
  const lessonTotal = L => lessonTiers(L).length;
  const lessonNo = (L, tier) => lessonTiers(L).indexOf(tier) + 1;
  function lessonHtml(les) { return h('div', { class: 'lbody' }, h('div', { html: les.h }), les.a ? h('div', { class: 'concept anabox anaonly', html: '<b>In the water pipes:</b> ' + les.a }) : null); }
  function showLesson(les, k, m) {
    run.mode = 'lesson'; run.b = null;
    const body = $('#body'); body.replaceChildren();
    const L = run.level, nq = L.chals.filter(c => Math.min(3, c.tier || 1) === Math.min(3, L.chals[run.i].tier || 1)).length;
    body.append(h('div', { class: 'panel pop lesson' },
      h('div', { class: 'row' }, h('span', { class: 'chip t' + Math.min(3, L.chals[run.i].tier || 1) }, 'Lesson ' + k + ' of ' + m), h('span', { class: 'dim' }, 'then ' + nq + ' question' + (nq === 1 ? '' : 's'))),
      h('h3', { class: 'ltitle' }, les.t),

    intro: 'Total real power is <span class="m">P = √3 · V<sub>line</sub> · I<sub>line</sub> · cos θ</span>, and the three phases fill in each other’s dips so the total never wiggles. Safety half: <b>current</b>, not voltage, hurts you.',
    chals: [
      { t: 'choice', tier: 1, q: 'What does the <b>total</b> instantaneous power of a balanced three-phase load look like over time?', opts: ['Constant. The 2ω wiggles cancel', 'A wave at 2ω', 'A wave at 3ω', 'Zero at all times'], a: 0, hint: 'Think of three people pedaling a bike, each a third of a turn apart.', why: 'Each phase has a 2ω wiggle. Add all three and the wiggles cancel, leaving a constant. That gives smooth motor torque.' },
      { t: 'sort', tier: 1, q: 'Sort each current by its effect on the body (60 Hz).', buckets: ['Tingle', 'Cannot let go or breathe', 'Heart fibrillation', 'Burns'], items: [['0.5 to 3 mA', 0], ['6 to 22 mA', 1], ['75 to 400 mA', 2], ['5 to 10 A', 3], ['18 to 22 mA (breathing muscles lock)', 1]], why: 'A few mA tingles, above the let-go current you cannot release, 75 to 400 mA can fibrillate the heart, and several amps burn.' },
      { t: 'num', tier: 2, gen() { const V = pick([208, 400, 480]), I = pick([10, 20, 50]), pf = pick([0.8, 0.85, 0.9]); return { q: 'A balanced three-phase load has line voltage <span class="m">' + V + ' V</span>, line current <span class="m">' + I + ' A</span> and a power factor of <span class="m">' + pf + '</span>. Find the total real power.', unit: 'kW', a: R3 * V * I * pf / 1000, tol: 0.02, hint: 'P = √3 · V<sub>line</sub> · I<sub>line</sub> · pf.', why: 'P = √3 × ' + V + ' × ' + I + ' × ' + pf + ' = ' + fmt(R3 * V * I * pf / 1000, 2) + ' kW. The same formula works for Y and Δ.' }; } },
      { t: 'choice', tier: 2, q: 'What does a GFCI outlet measure?', opts: ['The difference between current going out and current returning (trips near 4 to 6 mA)', 'The total current (trips near 15 to 20 A)', 'The line voltage', 'The power factor'], a: 0, hint: 'A leak to ground makes the two currents differ.', why: 'A GFCI protects people by sensing leakage. A circuit breaker protects wires by sensing total current.' },
      { t: 'choice', tier: 2, q: 'You hold the hot wire in one hand and the neutral in the other, standing on a dry wood floor. Will a GFCI trip?', opts: ['No. Current goes in one hand and out the other, so out equals back', 'Yes, instantly', 'Yes, but only above 20 A', 'Only if the plug is polarized'], a: 0, hint: 'What does the GFCI compare?', why: 'The GFCI’s blind spot: the current returns through the neutral, so it sees no leak. Never rely on a GFCI alone.' },
      { t: 'num', tier: 3, boss: true, gen() { const V = pick([208, 400, 480]), I = pick([20, 25, 40]), pf = pick([0.6, 0.8]); const Q = R3 * V * I * Math.sqrt(1 - pf * pf) / 1000; return { q: 'A balanced load has line voltage <span class="m">' + V + ' V</span>, line current <span class="m">' + I + ' A</span> and <span class="m">pf = ' + pf + '</span> lagging. Find the total reactive power Q.', unit: 'kVAR', a: Q, tol: 0.02, hint: 'Q = √3 V<sub>line</sub> I<sub>line</sub> sin θ, and sin θ = √(1 − pf²).', why: 'sin θ = ' + fmt(Math.sqrt(1 - pf * pf), 2) + '. Q = √3 × ' + V + ' × ' + I + ' × ' + fmt(Math.sqrt(1 - pf * pf), 2) + ' = ' + fmt(Q, 2) + ' kVAR.' }; } },
    ] },

  /* ---------------------------------------------------------------- 8 */
  { n: 8, diff: 3, topic: 'Laplace Basics: Step, Impulse, Transform Pairs', theme: { parts: ['C', 'R'], phase: -60 },
    blurb: 'The unit step, the unit impulse, the sifting property and the first transform pairs.',
    intro: 'The Laplace transform swaps a hard calculus problem for easy algebra in a complex variable <b>s</b>. You transform, do algebra, then transform back. The <b>step</b> is a switch flipping on. The <b>impulse</b> is an instant spike with area 1.',
    chals: [
      { t: 'match', tier: 1, q: 'Match each time signal to its Laplace transform.', pairs: [['Unit step u(t)', '1/s'], ['Unit impulse δ(t)', '1'], ['e<sup>−at</sup> u(t)', '1/(s + a)'], ['t · u(t)', '1/s²']], extra: ['s'], why: 'Standard pairs: u(t) ↔ 1/s, δ(t) ↔ 1, e<sup>−at</sup>u(t) ↔ 1/(s+a), t·u(t) ↔ 1/s².' },
      { t: 'choice', tier: 1, q: 'Which description fits the <b>unit impulse</b> δ(t)?', opts: ['Zero everywhere except t = 0, with total area 1', 'Equal to 1 for all t > 0', 'A sine wave of unit amplitude', 'A ramp with slope 1'], a: 0, hint: 'It is the limit of a pulse with width ε and height 1/ε.', why: 'δ(t) has area 1 packed into an instant. The step u(t) is the one that equals 1 for t > 0.' },
      { t: 'num', tier: 2, gen() { const a = rnd(1, 5), k = rnd(1, 6); const inside = Math.random() < 0.75; if (inside) return { q: 'Evaluate <span class="m">∫ (t² + ' + k + ') δ(t − ' + a + ') dt</span> over all t.', a: a * a + k, tol: 0.001, abs: 0.001, hint: 'The impulse sifts out the value of the function at t = ' + a + '.', why: 'Sifting property: the integral equals f(' + a + ') = ' + a + '² + ' + k + ' = ' + (a * a + k) + '.' }; return { q: 'Evaluate <span class="m">∫<sub>0</sub><sup>' + (a - 1 > 0 ? a - 1 : 0.5) + '</sup> (t² + ' + k + ') δ(t − ' + a + ') dt</span>.', a: 0, tol: 0.001, abs: 0.001, hint: 'Is the spike inside the limits?', why: 'The spike at t = ' + a + ' lies outside the limits of integration, so the integral is 0.' }; } },
      { t: 'choice', tier: 2, q: 'Why use the Laplace transform for circuits?', opts: ['It turns differential equations into algebra and builds in initial conditions', 'It makes every circuit linear', 'It removes the need for sources', 'It only works for DC circuits'], a: 0, hint: 'Transform, solve, transform back.', why: 'It gives the complete response, transient plus steady state, in one go, with the starting conditions built in (values at 0⁻).' },
      { t: 'num', tier: 2, gen() { if (Math.random() < 0.5) { const a = rnd(1, 4), s = rnd(1, 5); return { q: 'The transform of <span class="m">e<sup>−' + a + 't</sup> u(t)</span> is F(s). Evaluate F(s) at <span class="m">s = ' + s + '</span>.', a: 1 / (s + a), tol: 0.02, hint: 'F(s) = 1/(s + a).', why: 'F(s) = 1/(s + ' + a + ') = 1/' + (s + a) + ' = ' + fmt(1 / (s + a), 4) + '.' }; } const s = rnd(2, 5); return { q: 'The transform of <span class="m">t · u(t)</span> is F(s). Evaluate F(s) at <span class="m">s = ' + s + '</span>.', a: 1 / (s * s), tol: 0.02, hint: 'F(s) = 1/s².', why: 'F(s) = 1/s² = 1/' + s * s + ' = ' + fmt(1 / (s * s), 4) + '.' }; } },
      { t: 'num', tier: 3, boss: true, gen() { const R = pick([0.1, 0.2, 0.5]), C = pick([50, 100, 200]); return { q: 'A source charges a <span class="m">' + C + ' µF</span> capacitor through <span class="m">' + R + ' Ω</span> of wire. The circuit settles in about <b>5τ</b>, where τ = RC. How long is that?', given: ['R = ' + R + ' Ω', 'C = ' + C + ' µF'], unit: 'µs', a: 5 * R * C, tol: 0.02, hint: 'τ = R·C. Ω × µF gives µs.', why: 'τ = RC = ' + fmt(R * C, 2) + ' µs, so 5τ = ' + fmt(5 * R * C, 2) + ' µs. The huge, brief current is modeled as an impulse.' }; } },
    ] },

  { n: 9, diff: 4, topic: 'Laplace Toolkit and Inverse by Partial Fractions', theme: { parts: ['L', 'C'], phase: 90 },
    blurb: 'Transform rules, then go back to the time domain with partial fraction expansion.',
    intro: 'Two toolkits. A short list of <b>rules</b> turns one known pair into many. To go back from F(s) to f(t), split a big fraction into small ones you recognize: <b>partial fraction expansion</b>.',
    chals: [
      { t: 'match', tier: 1, q: 'Match each time-domain operation to its s-domain form.', pairs: [['Differentiation  df/dt', 'sF(s) − f(0⁻)'], ['Integration', 'F(s)/s'], ['Time delay  f(t−a)u(t−a)', 'e<sup>−as</sup>F(s)'], ['Frequency translation  e<sup>−at</sup>f(t)', 'F(s + a)']], why: 'Derivative becomes multiply by s (with the initial value), integral becomes divide by s, a delay becomes e<sup>−as</sup>, and a decay factor shifts s.' },
      { t: 'sort', tier: 1, q: 'Which partial fraction case is each denominator?', buckets: ['Simple real poles', 'Complex poles', 'Repeated poles', 'Improper: divide first'], items: [['(s + 1)(s + 2)', 0], ['s² + 6s + 10', 1], ['(s + 2)²', 2], ['Numerator degree is bigger than or equal to denominator degree', 3]], why: 'Simple poles: A/(s+p). Complex: (Bs+C)/(quadratic). Repeated: adds a B/(s+a)² term. Improper: do long division first.' },
      { t: 'num', tier: 2, gen() { const p1 = pick([1, 2]), p2 = pick([3, 4]), N = pick([6, 12]); return { q: 'Split <span class="m">F(s) = ' + N + ' / [(s + ' + p1 + ')(s + ' + p2 + ')]</span> into <span class="m">A/(s + ' + p1 + ') + B/(s + ' + p2 + ')</span>. Find A.', a: N / (p2 - p1), tol: 0.01, hint: 'Cover-up method: multiply by (s + ' + p1 + ') then plug in s = −' + p1 + '.', why: 'Cover-up: A = ' + N + '/(' + p2 + ' − ' + p1 + ') = ' + fmt(N / (p2 - p1), 3) + '.' }; } },
      { t: 'choice', tier: 2, q: 'A <b>repeated</b> pole at s = −a adds which time-domain piece?', opts: ['A t·e<sup>−at</sup> term', 'A plain sine wave', 'An impulse', 'Nothing new'], a: 0, hint: 'The table pair for 1/(s+a)².', why: 'A repeated pole (s+a)² gives a t·e<sup>−at</sup> term, besides the usual e<sup>−at</sup>.' },
      { t: 'order', tier: 2, q: 'Put the steps of an inverse Laplace transform in order.', items: ['Check the fraction is proper (divide first if not)', 'Factor the denominator', 'Write the expansion with unknown coefficients', 'Find the coefficients (cover-up or matching terms)', 'Look each simple piece up in the table'], hint: 'You cannot expand until the denominator is factored.', why: 'Always check afterwards: plug the coefficients back in and confirm the pieces recombine into F(s).' },
      { t: 'num', tier: 3, boss: true, gen() { const K = pick([2, 4, 6]), z = pick([1, 2, 3]), p = pick([2, 4]); return { q: 'Let <span class="m">F(s) = ' + K + '(s + ' + z + ') / [ s (s + ' + p + ') ]</span>. As t → ∞ the e<sup>−' + p + 't</sup> piece dies out. What constant does f(t) settle to?', a: K * z / p, tol: 0.01, hint: 'The constant is the coefficient A of 1/s. Cover up s and plug in s = 0.', why: 'A = ' + K + '(0 + ' + z + ')/(0 + ' + p + ') = ' + fmt(K * z / p, 3) + '. The f(t) piece with e<sup>−' + p + 't</sup> decays to 0.' }; } },
    ] },

      { t: 'match', tier: 1, q: 'Match each kind of response to its meaning.', pairs: [['Zero-input', 'Natural response from stored energy, source off'], ['Zero-state', 'Forced response from the source, nothing stored'], ['Total', 'Zero-input plus zero-state'], ['Impulse response', 'Zero-state response to an impulse']], why: 'Total = zero-input + zero-state. The zero-state response is the same as convolution.' },

  { n: 11, diff: 4, topic: 'Signals and Systems', theme: { parts: ['R', 'L'], phase: 20 },
    blurb: 'Treat a circuit as a box: linearity, time invariance and the impulse response.',
    intro: 'A circuit is a <b>system</b>: input signal in, output signal out. If it is <b>linear</b> and <b>time invariant</b>, its impulse response tells you everything about it.',
    chals: [
      { t: 'sort', tier: 1, q: 'Is each system linear?', buckets: ['Linear', 'Nonlinear'], items: [['y = x/2', 0], ['y = x²', 1], ['y = x − 2 (a constant offset)', 1], ['y = 3x', 0], ['y = |x|', 1]], why: 'Linear means superposition works: S{ax₁ + bx₂} = ay₁ + by₂. Squaring, absolute value and a constant offset all break it.' },
      { t: 'choice', tier: 1, q: 'A system is linear when S{a·x₁ + b·x₂} equals…', opts: ['a·y₁ + b·y₂', 'a·b·y₁·y₂', 'y₁ + y₂ + a + b', 'y₁ / y₂'], a: 0, hint: 'Scaling plus additivity.', why: 'The linearity test: plug in a·x₁ + b·x₂ and compare with a·y₁ + b·y₂. If they ever differ, the system is nonlinear.' },
      { t: 'sort', tier: 2, q: 'Is each system time invariant?', buckets: ['Time invariant', 'Not time invariant'], items: [['y(t) = t · x(t)', 1], ['y(t) = 2 + x²(t − 1)', 0], ['y(t) = 3 · x(t)', 0], ['y(t) = x(t − 2)', 0]], why: 'Time invariant means a delayed input gives the same output, delayed. For y = t·x(t), a delay also changes the amplitude, so it fails.' },
      { t: 'choice', tier: 2, q: 'What is the <b>impulse response</b> h(t)?', opts: ['The output when the input is δ(t) and all initial conditions are 0', 'The output when the input is a step', 'The input that makes the output zero', 'The steady-state output at 60 Hz'], a: 0, hint: 'h(t) = T{δ(t)}.', why: 'h(t) = T{δ(t)} with zero initial conditions. For an LTI system that one function describes the whole circuit.' },
      { t: 'num', tier: 2, gen() { const t = pick([1, 2, 3]); const h = (2 / 3) * (Math.exp(-t / 2) - Math.exp(-2 * t)); return { q: 'A series RLC circuit has impulse response <span class="m">h(t) = ⅔ (e<sup>−t/2</sup> − e<sup>−2t</sup>) u(t)</span>. Find h at <span class="m">t = ' + t + ' s</span>.', unit: '', a: h, tol: 0.03, hint: 'Plug t into both exponentials.', why: 'h(' + t + ') = ⅔(e<sup>−' + t / 2 + '</sup> − e<sup>−' + 2 * t + '</sup>) = ' + fmt(h, 4) + '.' }; } },

    chals: [

      { t: 'order', tier: 1, q: 'Put the steps of the graphical convolution method in order.', items: ['Graph x(τ) versus τ', 'Graph h(t − τ): flip h, then slide it right by t', 'Multiply the two graphs point by point', 'The area under the product is y(t)', 'Repeat for each range of t where the overlap changes'], hint: 'Flip, then slide.', why: 'Each time an edge of one function crosses an edge of the other, you start a new case.' },
      { t: 'choice', tier: 2, q: 'What is the convolution theorem?', opts: ['y(t) = x(t) ∗ h(t) corresponds to Y(s) = X(s)H(s)', 'y(t) = x(t) · h(t) corresponds to Y(s) = X(s) + H(s)', 'y(t) = x(t) + h(t) corresponds to Y(s) = X(s)/H(s)', 'Convolution has no s-domain form'], a: 0, hint: 'Integral in time becomes a product in s.', why: 'With no initial energy, convolution in time is multiplication in the s-domain. For plain exponentials and steps this is usually the quicker route.' },
      { t: 'num', tier: 2, gen() { if (Math.random() < 0.5) { const t = pick([1, 2, 3]); return { q: 'An LTI system has <span class="m">h(t) = e<sup>−t</sup> u(t)</span> and input <span class="m">x(t) = u(t)</span>. The output is y(t) = 1 − e<sup>−t</sup>. Evaluate y at <span class="m">t = ' + t + ' s</span>.', a: 1 - Math.exp(-t), tol: 0.02, hint: 'Plug t into 1 − e<sup>−t</sup>.', why: 'y(' + t + ') = 1 − e<sup>−' + t + '</sup> = ' + fmt(1 - Math.exp(-t), 4) + '.' }; } const b = pick([2, 3]), t = pick([1, 2]); const y = (Math.exp(-t) - Math.exp(-b * t)) / (b - 1); return { q: 'Convolve <span class="m">x(t) = e<sup>−t</sup> u(t)</span> with <span class="m">h(t) = e<sup>−' + b + 't</sup> u(t)</span>. By the theorem, X(s)H(s) = 1/((s+1)(s+' + b + ')). Evaluate y at <span class="m">t = ' + t + ' s</span>.', a: y, tol: 0.03, hint: 'Partial fractions give y(t) = (e<sup>−t</sup> − e<sup>−' + b + 't</sup>) / ' + (b - 1) + '.', why: 'y(t) = (e<sup>−t</sup> − e<sup>−' + b + 't</sup>)/' + (b - 1) + ', so y(' + t + ') = ' + fmt(y, 4) + '.' }; } },

      { t: 'num', tier: 3, boss: true, gen() { const t = pick([2, 2.25, 2.5, 2.75]); return { q: 'Same setup: x(t) = e<sup>t</sup> from t = 1 to 3, and h(t) is a pulse of width 1. For <span class="m">2 ≤ t < 3</span> the pulse is fully inside, so <span class="m">y(t) = ∫<sub>t−1</sub><sup>t</sup> e<sup>τ</sup> dτ</span>. Find y at <span class="m">t = ' + t + '</span>.', a: Math.exp(t) - Math.exp(t - 1), tol: 0.02, hint: 'The antiderivative of e<sup>τ</sup> is e<sup>τ</sup>.', why: 'y(t) = e<sup>t</sup> − e<sup>t−1</sup>. At t = ' + t + ' that is ' + fmt(Math.exp(t) - Math.exp(t - 1), 3) + '. It matches the neighboring ranges at the boundaries.' }; } },

  split: { t: 'choice', tier: 2, q: 'A neighborhood transformer feeds a home with 120/240 V split-phase. How do the two hot wires relate?', opts: ['Two 120 V halves, 180° apart, sharing a neutral. Across both is 240 V', 'Two 120 V halves, 120° apart, with no neutral', 'Both are 240 V and in phase', 'One hot and one ground, 120 V'], a: 0, hint: '120 V circuits use one hot and the neutral. 240 V circuits use both hots.', why: 'Split-phase: hots at ∠0° and ∠180° share a neutral. One hot to neutral is 120 V. Hot to hot is 240 V.' },
  split2: { t: 'num', tier: 1, gen() { const V = pick([110, 120, 125]); return { q: 'In split-phase service each hot is <span class="m">' + V + ' V</span> from neutral, and the two hots are 180° apart. What is the voltage between the two hots?', unit: 'V', a: 2 * V, tol: 0.01, hint: 'Opposite angles add.', why: 'V∠0° minus V∠180° = 2V = ' + 2 * V + ' V.' }; } },
  deltaI: { t: 'num', tier: 2, gen() { const I = pick([25, 30, 60, 90]); return { q: 'A balanced Δ load draws a line current of <span class="m">' + I + ' A</span>. What is the current in each Δ leg (phase current)?', unit: 'A', a: I / R3, tol: 0.01, hint: 'In a Δ, the phase current is the line current ÷ √3.', why: '|I<sub>phase</sub>| = ' + I + '/√3 = ' + fmt(I / R3, 2) + ' A.' }; } },
  total3: { t: 'choice', tier: 1, q: 'For a balanced load, how does total real power relate to the power in one phase?', opts: ['P<sub>T</sub> = 3 P<sub>φ</sub>', 'P<sub>T</sub> = P<sub>φ</sub>', 'P<sub>T</sub> = √3 P<sub>φ</sub>', 'P<sub>T</sub> = P<sub>φ</sub> / 3'], a: 0, hint: 'Three identical copies.', why: 'Three-phase power is three copies of single-phase power. In terms of line values: P<sub>T</sub> = √3 · V<sub>line</sub> · I<sub>line</sub> · cos θ.' },
  perPhase: { t: 'num', tier: 2, gen() { const V = pick([208, 400, 480]), I = pick([10, 20, 30]), pf = pick([0.8, 0.9]); return { q: 'A balanced <b>Y</b> load: line voltage <span class="m">' + V + ' V</span>, line current <span class="m">' + I + ' A</span>, pf <span class="m">' + pf + '</span>. Find the real power in <b>one phase</b>.', unit: 'W', a: V / R3 * I * pf, tol: 0.02, hint: 'P<sub>φ</sub> = (V<sub>line</sub>/√3) · I<sub>line</sub> · pf for a Y load.', why: 'P<sub>φ</sub> = (' + V + '/√3)(' + I + ')(' + pf + ') = ' + fmt(V / R3 * I * pf, 1) + ' W.' }; } },

  bodyI: { t: 'num', tier: 3, boss: true, gen() { const V = pick([120, 240]), R = pick([500, 1000, 1500]); return { q: 'Wet skin makes the body’s hand-to-hand resistance about <span class="m">' + R + ' Ω</span>. You touch <span class="m">' + V + ' V</span>. How much current flows?', unit: 'mA', a: V / R * 1000, tol: 0.02, hint: 'I = V / R, then convert A to mA.', why: 'I = ' + V + '/' + R + ' = ' + fmt(V / R * 1000, 0) + ' mA. Compare with the table: 75 to 400 mA can cause ventricular fibrillation. Current, not voltage, is what hurts.' }; } },
  diff: { t: 'choice', tier: 1, q: 'In the s-domain, the derivative df/dt becomes…', opts: ['sF(s) − f(0⁻), so the initial value is built in', 'sF(s) with no extra term', 'F(s)/s', 'e<sup>−s</sup>F(s)'], a: 0, hint: 'Derivative becomes multiply by s.', why: 'Differentiation: df/dt ↔ sF(s) − f(0⁻). Integration is the opposite: divide by s.' },

  transl: { t: 'num', tier: 2, gen() { const a = rnd(1, 3), w = rnd(1, 3), s = rnd(0, 2); const v = (s + a) / ((s + a) ** 2 + w * w); return { q: 'Start with <span class="m">cos(ωt) ↔ s/(s² + ω²)</span>. Frequency translation gives <span class="m">e<sup>−at</sup>cos(ωt) ↔ (s + a)/((s + a)² + ω²)</span>. Evaluate it for <span class="m">a = ' + a + ', ω = ' + w + ', s = ' + s + '</span>.', a: v, tol: 0.02, hint: 'Plug in s + a = ' + (s + a) + '.', why: '(' + (s + a) + ')/(' + (s + a) + '² + ' + w * w + ') = ' + fmt(v, 4) + '.' }; } },
  tcos: { t: 'num', tier: 3, boss: true, gen() { const s = rnd(2, 4), w = rnd(1, 2); const v = (s * s - w * w) / ((s * s + w * w) ** 2); return { q: 'Multiplying by t is s-differentiation: <span class="m">t·cos(ωt) ↔ (s² − ω²)/(s² + ω²)²</span>. Evaluate it at <span class="m">s = ' + s + '</span> with <span class="m">ω = ' + w + '</span>.', a: v, tol: 0.02, hint: 'Compute the top and bottom separately.', why: 'Top: ' + s * s + ' − ' + w * w + ' = ' + (s * s - w * w) + '. Bottom: (' + (s * s + w * w) + ')² = ' + (s * s + w * w) ** 2 + '. Ratio: ' + fmt(v, 5) + '.' }; } },
  improper: { t: 'choice', tier: 2, q: '<span class="m">F(s) = 4s − 1 + (s + 3)/(s² + 3s + 2)</span> is improper before dividing. What does the polynomial part <span class="m">4s − 1</span> become in the time domain?', opts: ['4δ′(t) − δ(t), which are impulses', '4u(t) − δ(t)', '4t − 1', 'It is thrown away'], a: 0, hint: 's ↔ δ′(t), and a constant ↔ δ(t).', why: 'Improper fractions give impulses (δ and δ′). The proper leftover splits as 2/(s+1) − 1/(s+2).' },
  l10_match: { t: 'match', tier: 1, q: 'Match each situation to the tool used for it.', pairs: [['Two-loop circuit, zero start', 'Cramer’s rule on the KVL equations'], ['Shrink the circuit first', 'Thevenin equivalent in the s-domain'], ['Coupled inductors', 'T-equivalent circuit'], ['Parallel RLC with a switch', 'Rewrite the source as I₀u(t)']], why: 'Once a circuit is in the s-domain it is just algebra. Pick the easiest solver.' },
  l10_dot: { t: 'choice', tier: 2, q: 'The T-equivalent circuit assumes the dots are on the same side of each inductor. If they are not, what do you do?', opts: ['Replace each M with −M', 'Ignore the mutual inductance', 'Double M', 'Swap the two inductors'], a: 0, hint: 'The dot convention flips the sign of M.', why: 'With dots on opposite sides, replace each M with −M in the T-equivalent.' },
  l10_cramer: { t: 'num', tier: 2, gen() { let a, b, c, d, x, y; do { a = rnd(1, 5); b = rnd(1, 4); c = rnd(1, 4); d = rnd(1, 5); x = rnd(1, 6); y = rnd(1, 6); } while (a * d - b * c === 0); const e = a * x + b * y, f = c * x + d * y; return { q: 'Solve the loop equations with Cramer’s rule and report <span class="m">y</span>.<br><span class="m">' + a + 'x + ' + b + 'y = ' + e + '</span><br><span class="m">' + c + 'x + ' + d + 'y = ' + f + '</span>', a: y, tol: 0.001, abs: 0.001, hint: 'y = (a·f − c·e) / (a·d − b·c).', why: 'det = ' + a + '·' + d + ' − ' + b + '·' + c + ' = ' + (a * d - b * c) + '. y = (' + a + '·' + f + ' − ' + c + '·' + e + ')/det = ' + y + '.' }; } },
  l10_init: { t: 'num', tier: 2, gen() { const V = pick([60, 48, 24]), R1 = pick([9, 6, 4]), R2 = pick([3, 2, 4]); return { q: 'Before a make-before-break switch moves at t = 0, the circuit sits at steady state: <span class="m">' + V + ' V</span> across <span class="m">' + R1 + ' Ω + ' + R2 + ' Ω</span> in series, and the inductors act like wires. Find the starting current <span class="m">i<sub>1</sub>(0)</span>.', unit: 'A', a: V / (R1 + R2), tol: 0.01, hint: 'Steady state: inductors are shorts. Use Ohm’s law on the total resistance.', why: 'i<sub>1</sub>(0) = ' + V + '/(' + R1 + ' + ' + R2 + ') = ' + fmt(V / (R1 + R2), 3) + ' A. (The second loop starts at 0.)' }; } },
  l10_check: { t: 'choice', tier: 2, q: 'After inverting, what quick check should you always run on the answer?', opts: ['Check that the value at t = 0⁺ matches the circuit’s starting conditions', 'Check that every term is positive', 'Check that the answer has no exponentials', 'Check that the units are volts'], a: 0, hint: 'The answer must be consistent with how the circuit started.', why: 'In the worked example, i₂(0⁺) = 7 − 8.4 + 1.4 = 0, which matches a circuit that starts with zero in loop 2.' },
  l10_boss: { t: 'num', tier: 3, boss: true, gen() { const t = pick([0.05, 0.1, 0.2, 0.5]); const v = 7 - 8.4 * Math.exp(-2 * t) + 1.4 * Math.exp(-12 * t); return { q: 'Cramer’s rule gave <span class="m">i<sub>2</sub>(t) = 7 − 8.4e<sup>−2t</sup> + 1.4e<sup>−12t</sup></span> A for t ≥ 0. Find i<sub>2</sub> at <span class="m">t = ' + t + ' s</span>.', unit: 'A', a: v, tol: 0.03, abs: 0.02, hint: 'Compute each exponential, then combine.', why: 'i₂(' + t + ') = 7 − 8.4e^(−' + 2 * t + ') + 1.4e^(−' + 12 * t + ') = ' + fmt(v, 3) + ' A. As t grows it settles toward 7 A.' }; } },
};
