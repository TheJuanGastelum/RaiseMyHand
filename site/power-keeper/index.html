/* Teaching pages for Power Keeper, levels 1-8. Each level has three lessons (warm-up, challenge, hard). They show before the questions. */
const F = x => '<div class="formula">' + x + '</div>';
const EX = (t, x) => '<div class="example"><b class="eh">' + t + '</b>' + x + '</div>';
const TRAP = x => '<div class="trap"><b class="eh">Watch out</b>' + x + '</div>';
const LEARN = (idx, topic, ls) => {
  const L = GRID_LEVELS[idx - 1];
  if (!L || L.topic !== topic) throw new Error('lesson/level mismatch at ' + idx + ': ' + (L && L.topic) + ' vs ' + topic);
  L.learn = { 1: ls[0], 2: ls[1], 3: ls[2] };
};

LEARN(1, 'Power on the Wire', [
 { t: 'AC power wiggles', h:
  '<p>In an AC circuit the voltage and current both swing up and down. Power is still voltage times current, but now it changes from instant to instant.</p>' + F('p(t) = v(t) · i(t)') +
  '<p>The <b>average</b> of that wiggling power is the real work: heat, light and motion. Parts react differently:</p>' +
  '<ul><li><b>Resistor</b>: current and voltage are <b>in phase</b>. It uses all the power as heat, and p(t) never goes below zero.</li><li><b>Inductor</b> (coil): current <b>lags</b> the voltage. It borrows energy and gives it back.</li><li><b>Capacitor</b>: current <b>leads</b> the voltage. It also borrows and returns energy.</li></ul>',
  a: 'Mill water spins the wheel and gets used up. Sloshing water just rushes in and out of a tank and does no work. A resistor only has mill water. Coils and capacitors only have sloshing water.' },
 { t: 'rms: the equivalent DC value', h:
  '<p>An AC voltage with peak value V<sub>m</sub> delivers the same heating as a DC voltage called the <b>rms</b> (root mean square) value:</p>' + F('V<sub>rms</sub> = V<sub>m</sub> ÷ √2   (≈ 0.707 V<sub>m</sub>)') +
  EX('Example', 'A wall outlet with a 170 V peak is 170 ÷ 1.414 = <b>120 V rms</b>. A peak of 311 V is 311 ÷ 1.414 ≈ <b>220 V rms</b>.') +
  '<p>For power into a resistor, use rms in place of the DC value: <b>P = V<sub>rms</sub>² ÷ R</b>.</p>' +
  '<p>Because p(t) is a product of two waves at frequency ω, the power wave wiggles at <b>2ω</b>, twice the line frequency.</p>',
  a: 'The rms value is the steady flow that would turn the mill as hard as the swinging flow does on average.' },
 { t: 'Average power into a resistor', h:
  '<p>If v(t) = V<sub>m</sub> cos(ωt) is across a resistor R, the average power is:</p>' + F('P = V<sub>rms</sub>² ÷ R = V<sub>m</sub>² ÷ (2R)') +
  EX('Example', 'v(t) = 100 cos(ωt) V across 25 Ω: V<sub>rms</sub> = 100 ÷ 1.414 = 70.7 V. P = 70.7² ÷ 25 = <b>200 W</b>. Same as 100² ÷ (2 × 25) = 200 W.') +
  '<p>Two kinds of power to keep apart:</p>' +
  '<ul><li><b>Real power</b> (watts): used up as heat, light or motion.</li><li><b>Reactive power</b> (vars): energy that flows in and out of fields (coils and capacitors) and is never used up.</li></ul>',
  a: 'A resistor drinks the mill water completely. A coil or a capacitor only sloshes water back and forth.' }
]);

LEARN(2, 'Power Factor and the Phase Angle', [
 { t: 'Leading and lagging', h:
  '<p>The <b>phase angle</b> between voltage and current decides how much of the power is real. Memory trick: <b>“ELI the ICE man”</b>.</p>' +
  '<ul><li><b>ELI</b>: in an inductor (L), voltage (E) comes before current (I). The current <b>lags</b>.</li><li><b>ICE</b>: in a capacitor (C), current (I) comes before voltage (E). The current <b>leads</b>.</li></ul>' +
  '<p>Motors, fans and fridges are inductive (lagging). A resistive load is in phase. Some computer power supplies lead.</p>',
  a: 'A coil makes the push arrive before the flow. A capacitor makes the flow arrive before the push.' },
 { t: 'Power factor', h:
  '<p>The <b>power factor</b> is the share of the apparent push that does real work.</p>' + F('pf = cos( θ<sub>v</sub> − θ<sub>i</sub> )') +
  EX('Example', 'θ<sub>v</sub> = 15°, θ<sub>i</sub> = −30°. The difference is 45°, so pf = cos 45° = <b>0.707</b>.') +
  '<p>A resistor has pf = 1. A pure coil or capacitor has pf = 0.</p>' +
  TRAP('pf alone does not tell you lagging or leading. A pf of 0.5 could be either. You need the word “lagging” or “leading”, or the sign of Q.'),
  a: 'Pf is the fraction of the water that actually turns the mill. At pf = 1, all of it does.' },
 { t: 'Real power and cosine angles', h:
  '<p>For a load with v = V<sub>m</sub> cos(ωt + θ<sub>v</sub>) and i = I<sub>m</sub> cos(ωt + θ<sub>i</sub>):</p>' + F('P = ½ · V<sub>m</sub> · I<sub>m</sub> · cos( θ<sub>v</sub> − θ<sub>i</sub> )') +
  EX('Example', 'v = 120 cos(ωt + 20°), i = 5 cos(ωt + 50°). θ<sub>v</sub> − θ<sub>i</sub> = −30°. P = ½ × 120 × 5 × cos(−30°) = 300 × 0.866 = <b>259.8 W</b>.') +
  '<p>Convert sines to cosines before you read the angle: sin(x) = cos(x − 90°).</p>' +
  EX('Example', 'i = 4 sin(ωt + 135°) = 4 cos(ωt + 135° − 90°) = 4 cos(ωt + <b>45°</b>).'),
  a: 'Put every wave in the same language (cosine) before you compare how far apart they are.' }
]);

LEARN(3, 'Complex Power and the Power Triangle', [
 { t: 'P, Q and S', h:
  '<p>Bundle the two kinds of power into one complex number:</p>' + F('S = P + jQ') +
  '<ul><li><b>P</b>: real power, in <b>watts</b> (W).</li><li><b>Q</b>: reactive power, in <b>vars</b> (VAR).</li><li><b>S</b> and its size |S|: <b>apparent power</b>, in volt-amps (VA). It is what the wires must carry.</li></ul>' +
  F('|S| = √( P² + Q² )') +
  EX('Example', 'P = 100 W, Q = 240 VAR: |S| = √(100² + 240²) = √(10000 + 57600) = <b>260 VA</b>.'),
  a: 'The pipe must carry both the mill water and the sloshing water. Its size is set by the two together.' },
 { t: 'The power triangle', h:
  '<p>P, Q and |S| form a right triangle. The angle at the corner is the power-factor angle θ = θ<sub>v</sub> − θ<sub>i</sub>.</p>' + F('P = |S| cos θ,   Q = |S| sin θ,   pf = P ÷ |S|') +
  EX('Example', '|S| = 20 kVA at a lagging pf of 0.6: P = 20 × 0.6 = <b>12 kW</b>. Then Q = √(20² − 12²) = 16 kVAR.') +
  '<p>S also equals V<sub>rms</sub> · I<sub>rms</sub> ∠(θ<sub>v</sub> − θ<sub>i</sub>), so its angle is the power-factor angle.</p>',
  a: 'The long side of the triangle is the pipe. The mill side is the useful part. The sloshing side is the part that clogs the pipe.' },
 { t: 'Adding loads and line loss', h:
  '<p>When several loads share one source, add their <b>complex powers</b>:</p>' + F('S<sub>total</sub> = S<sub>1</sub> + S<sub>2</sub> + …') +
  TRAP('You cannot just add the |S| values unless the angles are the same. Add P with P and Q with Q.') +
  '<p>A line with resistance R carrying current I wastes <b>I² R</b> as heat.</p>' +
  EX('Example', 'A load draws |S| = 10 kVA at 100 V rms. Current = 10,000 ÷ 100 = 100 A. The line has 0.02 Ω, so loss = 100² × 0.02 = <b>200 W</b>.'),
  a: 'Total pipe flow is the sum of all mills’ mill water plus the sum of all sloshing. Bigger flow in the pipe means more friction loss, I² R.' }
]);

LEARN(4, 'Fix the Line: Power Factor Correction and Max Power', [
 { t: 'Why correct the power factor?', h:
  '<p>A motor-type load draws extra current just to slosh energy in and out. That extra current heats the line (I² R) without doing any work.</p>' +
  '<p>Fix: add a <b>capacitor in parallel</b> with the load. The capacitor supplies the sloshing energy locally, so the line carries less current and the source sees a pf near 1.</p>' +
  '<ul><li><b>Parallel</b> capacitor: load voltage and current unchanged, line current drops.</li><li><b>Series</b> capacitor: does not help, because the load current is unchanged.</li></ul>',
  a: 'Put a balloon tank beside the load. The tank takes the sloshing, so the main pipe carries only mill water.' },
 { t: 'How much loss do you save?', h:
  '<p>Loss is I² R. Cut the current, and the loss drops by the square.</p>' +
  EX('Example', 'Line current drops from 10 A to 6 A on a 2 Ω line. Before: 10² × 2 = 200 W. After: 6² × 2 = 72 W. Saved: <b>128 W</b>.') +
  '<p>To choose the capacitor, make the load’s <b>susceptance</b> (the imaginary part of its admittance) cancel.</p>' +
  EX('Example', 'Z<sub>L</sub> = 4 + j3 Ω at ω = 100 rad/s. Y = 1/Z = (4 − j3) ÷ 25 = 0.16 − j0.12 S. The capacitor adds +jωC, so set ωC = 0.12: C = 0.12 ÷ 100 = <b>1.2 mF</b>.'),
  a: 'Size the tank to hold exactly the sloshing the load would send into the pipe.' },
 { t: 'Maximum power transfer', h:
  '<p>A source with impedance Z<sub>s</sub> = R<sub>s</sub> + jX<sub>s</sub> delivers the most power to a load when:</p>' + F('Z<sub>L</sub> = Z<sub>s</sub>*   (R<sub>L</sub> = R<sub>s</sub>,  X<sub>L</sub> = −X<sub>s</sub>)') +
  '<p>The reactances cancel, and the resistances match.</p>' +
  F('P<sub>max</sub> = V<sub>s,rms</sub>² ÷ (4 R<sub>s</sub>)') +
  EX('Example', 'V<sub>s</sub> = 10 V rms, R<sub>s</sub> = 2 Ω: P<sub>max</sub> = 10² ÷ (4 × 2) = <b>12.5 W</b>.'),
  a: 'The mill takes the most water when its wheel is matched to the pump: same resistance, and no leftover sloshing.' }
]);

LEARN(5, 'Three-Phase Basics', [
 { t: 'Three waves, 120° apart', h:
  '<p><b>Three-phase</b> power is three AC waves of equal size, each shifted 120° from the next. In the usual <b>abc (positive) sequence</b> with V<sub>a</sub> = V<sub>m</sub>∠0°:</p>' +
  '<ul><li>V<sub>b</sub> = V<sub>m</sub>∠<b>−120°</b></li><li>V<sub>c</sub> = V<sub>m</sub>∠<b>+120°</b></li></ul>' +
  '<p>In the <b>acb (negative) sequence</b>, b and c swap angles. Note 240° is the same as −120°.</p>',
  a: 'Three pumps push in turn, each a third of a cycle after the last.' },
 { t: 'Why balanced sets are special', h:
  '<p>A set is <b>balanced</b> when the three waves have equal size, are 120° apart, and add up to zero.</p>' + F('V<sub>a</sub> + V<sub>b</sub> + V<sub>c</sub> = 0') +
  EX('Check with numbers', 'V<sub>a</sub> = 120∠0° has real part 120. V<sub>b</sub> = 120∠−120° has real part 120 cos 120° = −60. V<sub>c</sub> also −60. Sum: 120 − 60 − 60 = <b>0</b>.') +
  '<p>Because they cancel, there is nothing left to return through a neutral wire. Three wires carry three times the power of two.</p>',
  a: 'When one pump pushes hardest, the other two are partly pulling back. In total the water that must return is zero.' },
 { t: 'Where the three phases come from', h:
  '<p>A generator has a magnet that spins inside three coils (<b>stator windings</b>) placed 120° apart. The spinning field sweeps each coil at a different moment, so each produces its own sinusoid, 120° behind the previous.</p>' +
  '<p>That is why the grid uses three phases: they cancel at the neutral point, so no extra return wire is needed, and the generator makes them naturally.</p>',
  a: 'Three taps spaced around the wheel get pushed one after another as it turns.' }
]);

LEARN(6, 'The Real Grid and the Balanced Y-Y Circuit', [
 { t: 'Split-phase service at home', h:
  '<p>A neighborhood transformer feeds a home with <b>split-phase</b> power: two hot wires and a shared neutral. The hots are 180° apart.</p>' +
  '<ul><li>One hot to neutral: <b>120 V</b>.</li><li>Hot to hot: V∠0° − V∠180° = 2V = <b>240 V</b>.</li></ul>',
  a: 'Two taps on opposite sides of the pipe: each side to the middle is half the full pressure across both.' },
 { t: 'Y and Δ connections', h:
  '<p>Three-phase sources and loads connect in two shapes:</p>' +
  '<ul><li><b>Y</b> (wye): three branches meeting at a center point.</li><li><b>Δ</b> (delta): the three branches form a triangle.</li></ul>' +
  '<p>Y-Y is the most common. Big motors often use Δ loads. A Δ–Y transformer connection steps voltage up for transmission.</p>' +
  '<p>The path from generator to home: generator → step up to high voltage → transmission lines → step down in stages → neighborhood transformer (120/240 V) → home. High voltage means <b>less current and less loss</b> over the long haul.</p>',
  a: 'High pressure moves the same water through a thin pipe, so you lose less on the long trip.' },
 { t: 'The balanced Y-Y shortcut', h:
  '<p>In a balanced Y-Y circuit all three phases are identical in size, 120° apart. The three phase currents add to zero, so the <b>neutral wire carries zero current</b>. That means you can solve <b>one phase</b> and shift by ±120° for the others.</p>' +
  F('V<sub>line</sub> = √3 · V<sub>phase</sub>') +
  EX('Example', 'Phase voltage 277 V: line-to-line voltage = 1.732 × 277 ≈ <b>480 V</b>. A 120 V phase gives about 208 V line.'),
  a: 'The pushing and the pulling of the three pumps cancel at the center, so the return line has nothing to carry.' }
]);

LEARN(7, 'Y-Y and Y-Δ Analysis', [
 { t: 'Phase versus line', h:
  '<p>In a three-phase system the <b>line</b> values are measured between the wires going to the load. The <b>phase</b> values are across one branch.</p>' +
  '<ul><li><b>Y</b>: phase current = line current. Line voltage = √3 × phase voltage.</li><li><b>Δ</b>: phase voltage = line voltage. Line current = √3 × phase current.</li></ul>' +
  EX('Example', 'Y system, line-to-line 480 V: phase voltage = 480 ÷ 1.732 = <b>277 V</b>. Δ load drawing 25 A in each line: phase current = 25 ÷ 1.732 = <b>14.4 A</b>.'),
  a: 'Pressure across two pipes versus pressure from one pipe to the center: they differ by a factor of √3.' },
 { t: 'Turning a Δ into a Y', h:
  '<p>To analyze a Δ load with the one-phase shortcut, swap it for an equivalent Y. For a <b>balanced</b> load:</p>' + F('Z<sub>Y</sub> = Z<sub>Δ</sub> ÷ 3') +
  EX('Example', 'A balanced Δ load has 90 Ω in each leg. The equivalent Y has 90 ÷ 3 = <b>30 Ω</b> in each leg.') +
  '<p>For the abc sequence, the line voltage leads the phase voltage by 30°: V<sub>AB</sub> = √3 ∠+30° · V<sub>AN</sub>. For acb it is √3 ∠−30°.</p>',
  a: 'A triangle of pipes can be redrawn as a star of pipes, each a third as hard to flow through.' },
 { t: 'Solving one phase', h:
  '<p>For a balanced Y-Y circuit, draw the single-phase circuit: the source, the generator impedance Z<sub>g</sub>, the line impedance Z<sub>l</sub> and the load Z<sub>L</sub> in series. Add them and divide.</p>' + F('I<sub>aA</sub> = V<sub>a</sub> ÷ ( Z<sub>g</sub> + Z<sub>l</sub> + Z<sub>L</sub> )') +
  EX('Example', 'V<sub>a</sub> = 240∠0°. Z<sub>g</sub> = 0.5 + j1, Z<sub>l</sub> = 1.5 + j2, Z<sub>L</sub> = 38 + j27. Total = 40 + j30 Ω, size = √(40² + 30²) = 50 Ω. |I| = 240 ÷ 50 = <b>4.8 A</b>.') +
  '<p>The other two phases have the same size, shifted by −120° and +120°.</p>',
  a: 'Follow the water through one pipe from pump to mill and back. The other two pipes behave the same, just a third of a turn later.' }
]);

LEARN(8, 'Three-Phase Power', [
 { t: 'Smooth power', h:
  '<p>Each phase has a power wave that wiggles at 2ω. In a balanced set, the three wiggles are 120° apart and <b>cancel</b>, so the total instantaneous power is <b>constant</b>. That gives smooth motor torque.</p>' +
  '<p>Total real power is three times the power in one phase.</p>',
  a: 'Three pumps take turns. When one dips, the others fill the gap, so the water to the mill never pulses.' },
 { t: 'The three-phase power formula', h:
  '<p>In terms of line values (works for both Y and Δ):</p>' + F('P<sub>T</sub> = √3 · V<sub>line</sub> · I<sub>line</sub> · cos θ') +
  EX('Example', 'V<sub>line</sub> = 208 V, I<sub>line</sub> = 20 A, pf = 0.8. P<sub>T</sub> = 1.732 × 208 × 20 × 0.8 = <b>5.76 kW</b>. One phase gets a third: <b>1.92 kW</b>.'),
  a: 'Total mill power is the pressure and flow of all three pipes together, scaled by how much of it is not sloshing.' },
 { t: 'Reactive and apparent three-phase power', h:
  '<p>The same pattern gives reactive power, with sin θ in place of cos θ:</p>' + F('Q<sub>T</sub> = √3 · V<sub>line</sub> · I<sub>line</sub> · sin θ') + F('|S<sub>T</sub>| = √3 · V<sub>line</sub> · I<sub>line</sub>') +
  EX('Example', 'pf = 0.6 lagging means cos θ = 0.6, so sin θ = 0.8. With 208 V and 20 A: Q = 1.732 × 208 × 20 × 0.8 = <b>5.76 kVAR</b>.') +
  TRAP('Get sin θ from cos θ with sin θ = √(1 − cos²θ). A pf of 0.6 gives 0.8, not 0.4.'),
  a: 'The same triangle again: mill water on one side, sloshing on the other, pipe size on the long side.' }
]);

/* Teaching pages for Power Keeper, levels 9-16. */

LEARN(9, 'Plugs, Grounding and Shock Safety', [
 { t: 'What is in a wall outlet', h:
  '<p>A standard outlet has three connections:</p>' +
  '<ul><li><b>Hot</b>: the live wire (about 120 V rms to ground). It carries current to the load.</li><li><b>Neutral</b>: the return path for the load’s current.</li><li><b>Ground</b>: a safety wire connected to the metal case of an appliance. It carries no current in normal use.</li></ul>' +
  '<p>If the hot wire ever touches a metal case, the fault current returns through the <b>ground wire</b> instead of through you, and the breaker trips.</p>',
  a: 'The ground wire is an emergency drain. If the pressure leaks onto the case, it runs down the drain, not through the person touching it.' },
 { t: 'Current, not voltage, hurts', h:
  '<p>The body is hurt by the <b>current</b> that flows through it. At 60 Hz, roughly:</p>' +
  '<ul><li>A few <b>mA</b>: a tingle.</li><li>Above the <b>let-go current</b> (about 10 to 20 mA): muscles lock and you cannot release the wire.</li><li><b>75 to 400 mA</b>: can cause ventricular fibrillation (the heart quivers instead of pumping).</li><li>Several <b>amps</b>: burns.</li></ul>' +
  EX('Example', 'Wet skin gives a hand-to-hand resistance of about 500 Ω. Touching 120 V: I = 120 ÷ 500 = 0.24 A = <b>240 mA</b>. That is inside the fibrillation range.') +
  F('I = V ÷ R'),
  a: 'It is the flow of water through the body that does the harm, not the height of the tank behind it. Wet skin opens the valve wide.' },
 { t: 'GFCI and breakers', h:
  '<p>Two different protectors:</p>' +
  '<ul><li><b>Circuit breaker</b>: senses total current and protects the <b>wires</b> from overheating.</li><li><b>GFCI</b> (ground-fault circuit interrupter): compares the hot current with the neutral current. If they differ by a few mA, the current is leaking somewhere (maybe through a person), and it trips. It protects <b>people</b>.</li></ul>' +
  TRAP('A GFCI has a blind spot. If you touch hot with one hand and neutral with the other, the current goes out the hot and back the neutral. The GFCI sees no leak and does not trip. Never rely on a GFCI alone.'),
  a: 'The GFCI counts the water leaving and the water returning. If they do not match, something is leaking, and it shuts the valve. Grabbing both pipes at once makes the water match, so it stays open.' }
]);

LEARN(10, 'Laplace Basics: Step, Impulse, Transform Pairs', [
 { t: 'Why Laplace?', h:
  '<p>The <b>Laplace transform</b> turns a hard calculus problem (differential equations) into easy algebra in a complex variable <b>s</b>. The method:</p>' +
  '<ol><li>Transform the problem to the s-domain.</li><li>Do algebra.</li><li>Transform back to time.</li></ol>' +
  '<p>It gives the <b>complete response</b> (transient plus steady state) in one go, with the starting conditions (values at t = 0⁻) built in.</p>',
  a: 'Instead of tracking the water second by second, you translate the whole problem to a simpler board game, play it, and translate the answer back.' },
 { t: 'The step and the impulse', h:
  '<p>Two special signals:</p>' +
  '<ul><li><b>Unit step u(t)</b>: 0 before t = 0, then 1. A switch flipping on.</li><li><b>Unit impulse δ(t)</b>: an instant spike with <b>area 1</b>, packed into no time at all.</li></ul>' +
  '<p>The impulse has a handy <b>sifting property</b>: it picks out the value of a function at the spike.</p>' + F('∫ f(t) δ(t − t₀) dt = f(t₀)') +
  EX('Example', '∫ (t² + 4) δ(t − 5) dt = 5² + 4 = <b>29</b>.'),
  a: 'The step is turning the tap on and leaving it. The impulse is a single hammer blow on the pipe.' },
 { t: 'The standard pairs', h:
  '<p>Memorise these time ↔ s-domain pairs (for t ≥ 0):</p>' +
  '<ul><li>u(t) ↔ <b>1/s</b></li><li>δ(t) ↔ <b>1</b></li><li>e<sup>−at</sup> u(t) ↔ <b>1/(s + a)</b></li><li>t · u(t) ↔ <b>1/s²</b></li><li>cos ωt ↔ s/(s² + ω²), sin ωt ↔ ω/(s² + ω²)</li></ul>' +
  EX('Example', 'F(s) is the transform of e<sup>−t</sup>u(t), so F(s) = 1/(s + 1). At s = 5: 1/6 = <b>0.1667</b>.') +
  EX('Time constant', 'A capacitor of 50 µF charging through 0.1 Ω: τ = RC = 5 µs. It settles in about 5τ = <b>25 µs</b>. That brief huge current is modeled as an impulse.'),
  a: 'A short table of translations: step ↔ 1/s, hammer blow ↔ 1, fading decay ↔ 1/(s + a).' }
]);

LEARN(11, 'Laplace Operations', [
 { t: 'Derivative and integral', h:
  '<p>Calculus turns into algebra:</p>' + F('df/dt ↔ s F(s) − f(0⁻)') + F('∫ f dt ↔ F(s) ÷ s') +
  '<p>So a derivative is <b>multiply by s</b> (with a correction for the starting value), and an integral is <b>divide by s</b>.</p>',
  a: 'Differentiating speeds the translation up by a factor of s. Integrating slows it down by 1/s.' },
 { t: 'Shifts and scales', h:
  '<ul><li><b>Delay</b> by a: f(t − a)u(t − a) ↔ <b>e<sup>−as</sup></b> F(s).</li><li><b>Decay factor</b>: e<sup>−at</sup> f(t) ↔ <b>F(s + a)</b>. It shifts s.</li><li><b>Speeding up time</b>: f(at) ↔ (1/a) F(s/a).</li></ul>' +
  EX('Example', 'Start with cos(ωt) ↔ s/(s² + ω²). Multiply by e<sup>−at</sup>: just replace s by (s + a). So e<sup>−at</sup> cos(ωt) ↔ (s + a)/((s + a)² + ω²). For a = 3, ω = 3, s = 0: 3 ÷ (9 + 9) = <b>0.1667</b>.'),
  a: 'Wait a bit before the water starts: multiply by e<sup>−as</sup>. Let the flow fade away: shift s.' },
 { t: 'Multiplying by t', h:
  '<p>Multiplying a time signal by <b>t</b> is the same as taking <b>−d/ds</b> of its transform:</p>' + F('t · f(t) ↔ − dF(s)/ds') +
  EX('Example', 't · cos(ωt) ↔ (s² − ω²) ÷ (s² + ω²)². At s = 4 with ω = 1: top = 16 − 1 = 15, bottom = 17² = 289, ratio = <b>0.0519</b>.') +
  '<p>A short list of rules turns one known pair into many more.</p>',
  a: 'Each rule is a small trick that turns a pair you know into a new pair for free.' }
]);

LEARN(12, 'Inverse Laplace by Partial Fractions', [
 { t: 'Splitting into pieces you know', h:
  '<p>To go back from F(s) to f(t), split a big fraction into small ones that match the standard pairs. This is <b>partial fraction expansion</b>.</p>' +
  '<ul><li><b>Simple poles</b>: A/(s + p).</li><li><b>Complex poles</b>: (Bs + C)/(quadratic).</li><li><b>Repeated poles</b>: also a B/(s + a)² term.</li><li><b>Improper fraction</b> (top degree ≥ bottom): do long division first.</li></ul>',
  a: 'Break one tangled pipe into simple straight pipes you already know how to handle.' },
 { t: 'The cover-up method', h:
  '<p>For a simple pole, find its coefficient by covering up that factor and plugging in the pole.</p>' +
  EX('Example', 'F(s) = 6 ÷ [(s + 1)(s + 3)] = A/(s + 1) + B/(s + 3). Cover (s + 1) and put s = −1 in the rest: A = 6 ÷ (−1 + 3) = <b>3</b>. Likewise B = 6 ÷ (−3 + 1) = −3.') +
  EX('Time domain', 'f(t) = 3e<sup>−t</sup> − 3e<sup>−3t</sup>.') +
  TRAP('Always check afterwards: plug the coefficients back in and confirm the pieces recombine into F(s).'),
  a: 'Cover one pipe with your thumb and read the flow through the rest.' },
 { t: 'Repeated poles, impulses and the final value', h:
  '<p>A repeated pole (s + a)² adds a <b>t · e<sup>−at</sup></b> term, besides the usual e<sup>−at</sup>.</p>' +
  '<p>An improper fraction gives <b>impulses</b> (δ and its derivative) for the polynomial part. For example 4s − 1 gives 4δ′(t) − δ(t).</p>' +
  '<p>The steps: (1) make it proper, (2) factor the bottom, (3) write the partial-fraction form, (4) find the coefficients, (5) invert each piece.</p>' +
  EX('Long-term value', 'F(s) = 6(s + 1) ÷ [s(s + 2)]. The pole at s = 0 gives a constant A = 6(0 + 1) ÷ (0 + 2) = <b>3</b>. The e<sup>−2t</sup> piece dies out, so f(t) settles to 3.'),
  a: 'After the fast-fading pipes close, only the steady one is left running. Its coefficient is the final flow.' }
]);

LEARN(13, 'Circuits in the s-Domain', [
 { t: 'Impedances in s', h:
  '<p>Turn every part into an s-domain impedance:</p>' +
  '<ul><li>Resistor: <b>R</b>.</li><li>Inductor: <b>sL</b>.</li><li>Capacitor: <b>1/(sC)</b>.</li></ul>' +
  '<p>Then use the ordinary tools (KVL, KCL, dividers, Thevenin) with these impedances. The answer comes out as a function of s, and you invert it for the time response.</p>',
  a: 'Each part gets a flow-resistance label that depends on s. Then it is ordinary pipe arithmetic.' },
 { t: 'Initial conditions as extra sources', h:
  '<p>Parts that start with stored energy get a small extra source:</p>' +
  '<ul><li><b>Inductor</b> starting at current I₀: series form has a voltage source <b>L · I₀</b>. Parallel form has a current source I₀/s.</li><li><b>Capacitor</b> starting at voltage V₀: series form has a voltage source <b>V₀/s</b>. Parallel form has a current source C · V₀.</li></ul>' +
  '<p>Series and parallel forms give the same answer.</p>' +
  '<p>The recipe: (1) transform the sources, (2) transform the parts, (3) add initial-condition sources, (4) solve in s, (5) invert.</p>',
  a: 'A tank that starts with water in it or a pipe that is already flowing becomes a small extra pump in the s-domain picture.' },
 { t: 'Total, zero-input and zero-state responses', h:
  '<p>The total response splits in two:</p>' +
  '<ul><li><b>Zero-input</b>: the response to the starting energy alone, with the source off.</li><li><b>Zero-state</b>: the response to the source alone, with everything starting at rest. This is the same as the convolution result.</li></ul>' +
  F('total = zero-input + zero-state') +
  EX('Example: a discharging capacitor', 'A capacitor at 24 V discharges through 4 kΩ, C = 0.5 mF. τ = RC = 4000 × 0.0005 = 2 s. v(t) = 24 e<sup>−t/2</sup>. At t = 2 s: 24 e<sup>−1</sup> = <b>8.83 V</b>.'),
  a: 'The water already in the tank drains out on its own. New water from the pump adds to it.' }
]);

LEARN(14, 'Laplace Circuit Examples', [
 { t: 'Picking the right tool', h:
  '<p>Once a circuit is in the s-domain, it is just algebra. Pick the easiest solver:</p>' +
  '<ul><li><b>Loop equations with Cramer’s rule</b> when you have several loops.</li><li><b>Thevenin</b> to shrink a part of the circuit.</li><li>A <b>T-equivalent</b> circuit for coupled inductors. If the dots are on <b>opposite</b> sides, replace each M with −M.</li></ul>' +
  '<p>Finish with a partial-fraction inverse.</p>',
  a: 'Choose the simplest way to solve the pipe network, then translate back.' },
 { t: 'Cramer’s rule', h:
  '<p>For two equations a<sub>1</sub>x + b<sub>1</sub>y = c<sub>1</sub> and a<sub>2</sub>x + b<sub>2</sub>y = c<sub>2</sub>:</p>' + F('det = a₁b₂ − a₂b₁,   x = (c₁b₂ − c₂b₁) ÷ det,   y = (a₁c₂ − a₂c₁) ÷ det') +
  EX('Example', '3x + 3y = 9 and 4x + 2y = 8. det = 3·2 − 3·4 = −6. y = (3·8 − 4·9) ÷ (−6) = (24 − 36) ÷ (−6) = <b>2</b>.'),
  a: 'A fixed recipe of cross-multiplying that always gives the answer for a pair of loops.' },
 { t: 'Starting values and the t = 0 check', h:
  '<p>Before a switch moves at t = 0, find the circuit’s steady state. Inductors act like wires then, so the starting currents are just DC values.</p>' +
  EX('Example', '60 V across 9 Ω + 4 Ω in series: i<sub>1</sub>(0) = 60 ÷ 13 = <b>4.62 A</b>.') +
  '<p>After you invert, <b>always check the answer at t = 0⁺</b>. For i₂(t) = 7 − 8.4e<sup>−2t</sup> + 1.4e<sup>−12t</sup>: i₂(0⁺) = 7 − 8.4 + 1.4 = 0, which matches a loop that started with zero current.</p>' +
  EX('Evaluate', 'At t = 0.1 s: 7 − 8.4e<sup>−0.2</sup> + 1.4e<sup>−1.2</sup> = 7 − 6.877 + 0.422 = <b>0.544 A</b>. As t grows it settles to 7 A.'),
  a: 'A quick sanity check at the moment the valve first opens tells you if the translation back was right.' }
]);

LEARN(15, 'Signals and Systems', [
 { t: 'A circuit is a system', h:
  '<p>A <b>system</b> takes an <b>input</b> signal x(t) and produces an <b>output</b> signal y(t). A circuit is a system: a source goes in, a voltage or current comes out.</p>' +
  '<p>The nicest systems are <b>LTI</b>: <b>L</b>inear and <b>T</b>ime-<b>I</b>nvariant. For these, one function describes everything.</p>',
  a: 'Water goes into the machine and something else comes out. The machine is the system.' },
 { t: 'Linear and time-invariant', h:
  '<p><b>Linear</b>: superposition works. Scaling and adding inputs scales and adds outputs.</p>' + F('S{ a·x₁ + b·x₂ } = a·y₁ + b·y₂') +
  '<p>Squaring, absolute value and adding a constant offset all break linearity.</p>' +
  '<p><b>Time invariant</b>: a delayed input gives the same output, just delayed. For y = t · x(t), a delay also changes the amplitude, so it fails.</p>' +
  EX('Example', 'y = x/2 scales its input (linear) and does not care when the input arrives (time invariant). It is LTI.'),
  a: 'Double the water, double the output. Start the water later, get the same output later.' },
 { t: 'The impulse response', h:
  '<p>The <b>impulse response</b> h(t) is the output when the input is an impulse δ(t), starting from rest.</p>' + F('h(t) = T{ δ(t) }') +
  '<p>For an LTI system, h(t) describes the whole circuit.</p>' +
  EX('Example', 'A series RLC circuit has h(t) = ⅔ (e<sup>−t/2</sup> − e<sup>−2t</sup>) u(t). At t = 1 s: ⅔ (0.6065 − 0.1353) = <b>0.314</b>.'),
  a: 'Hit the pipe once with the hammer. How the sound rings out tells you everything about the pipe.' }
]);

LEARN(16, 'Convolution', [
 { t: 'Why convolution works', h:
  '<p>If the system is LTI and starts with <b>no initial energy</b>, any input can be seen as a stream of tiny impulses. Each impulse produces a delayed, scaled copy of h(t). Adding them all up is the <b>convolution integral</b>:</p>' + F('y(t) = x(t) * h(t) = ∫ x(τ) h(t − τ) dτ'),
  a: 'A long flow is just a stream of tiny hammer blows. The machine rings once for each, and the ringing adds up.' },
 { t: 'The shortcut: multiply in s', h:
  '<p>The convolution integral is tedious. The <b>convolution theorem</b> says that, with no initial energy, convolution in time is multiplication in the s-domain.</p>' + F('Y(s) = X(s) · H(s)') +
  EX('Example', 'x(t) = e<sup>−t</sup>u(t) and h(t) = e<sup>−2t</sup>u(t). X(s)H(s) = 1 ÷ ((s + 1)(s + 2)) = 1/(s + 1) − 1/(s + 2). So y(t) = e<sup>−t</sup> − e<sup>−2t</sup>. At t = 2 s: 0.1353 − 0.0183 = <b>0.117</b>.'),
  a: 'Instead of adding up every ring, multiply the two translations and translate back.' },
 { t: 'Graphical convolution', h:
  '<p>For pulse-shaped signals, convolve graphically: flip h, slide it across x, and find the overlap area at each position. Each time an edge of one function crosses an edge of the other, a <b>new case</b> starts.</p>' +
  '<p>Steps: flip h(τ) to h(−τ), shift it by t, find where the two overlap, integrate the product over the overlap, then repeat for each range of t.</p>' +
  EX('Example', 'x(t) = e<sup>t</sup> from t = 1 to 3, h(t) a pulse of width 1. The overlap changes at t = 1, 2, 3, 4. The output is zero before 1 and after 4. For 2 ≤ t ≤ 3 the pulse is fully inside: y(t) = ∫ e<sup>τ</sup> dτ from t − 1 to t = e<sup>t</sup> − e<sup>t−1</sup>. At t = 2: e² − e = 7.389 − 2.718 = <b>4.67</b>.'),
  a: 'Slide a window along the long flow and measure what is under the window at each step.' }
]);

/* Shared helpers for the workshop builds. Game-neutral. */
const meterOf = (k, v, st) => ({ k, v, st });
const near = (x, t, tol) => Math.abs(x - t) <= Math.abs(t) * tol + 1e-12;
const par = (a, b) => a * b / (a + b);
const pickR = (list, n, must) => { const m = Array.isArray(must) ? must : [must]; const out = m.slice(); shuffle(list.filter(v => !m.includes(v))).slice(0, Math.max(0, n - m.length)).forEach(v => out.push(v)); return shuffle(out).sort((a, b) => a - b); };
// engineering format: E(0.0153,'A') -> "15.3 mA"
const E = (x, u) => { if (x === 0) return '0 ' + u; const a = Math.abs(x), P = [[1e9, 'G'], [1e6, 'M'], [1e3, 'k'], [1, ''], [1e-3, 'm'], [1e-6, 'µ'], [1e-9, 'n']]; const p = P.find(q => a >= q[0] * 0.9995) || P[P.length - 1]; const v = x / p[0]; return (Math.round(v * 100) / 100) + ' ' + p[1] + u; };
const N2 = x => String(Math.round(x * 1000) / 1000);
// a simple generic part
const PT = (label, v, kind) => ({ label, v, kind: kind || 'BOX' });
const ohm = v => v >= 1e6 ? (v / 1e6) + ' MΩ' : v >= 1000 ? (v / 1000) + ' kΩ' : v + ' Ω';
const RP = v => PT(ohm(v), v, 'R');
const LP = v => PT(E(v, 'H'), v, 'L'), CP = v => PT(E(v, 'F'), v, 'C');

/* ---- layouts. All are 11 wide, 7 tall. The bins fill row 6. ---- */
// a loop: left part, right part, sockets/fixed parts along the top row
function benchRig(o) {
  const sockets = (o.sockets || []).map(k => ({ id: k.id, label: k.label, x: k.x, y: k.y == null ? 1 : k.y }));
  const fixed = [];
  if (o.left !== null) fixed.push(Object.assign({ x: 1, y: 3, kind: 'BAT', label: '', info: '' }, o.left || {}));
  if (o.right !== null) fixed.push(Object.assign({ x: 9, y: 3, kind: 'BOX', label: '', info: '' }, o.right || {}));
  (o.top || []).forEach(f => fixed.push(Object.assign({ y: 1 }, f)));
  (o.extra || []).forEach(f => fixed.push(f));
  return { cols: 11, rows: 7, sockets, fixed, wires: o.wires || [[[1, 3], [1, 1], [9, 1], [9, 3], [9, 5], [1, 5], [1, 3]]], start: o.start || { x: 5, y: 3 }, lever: o.lever || { x: 10, y: 5 } };
}
// sockets along a row (ordering, matching, picking settings)
function rowRig(o) {
  const n = o.sockets.length, xs = n === 1 ? [5] : n === 2 ? [3, 7] : n === 3 ? [2, 5, 8] : n === 4 ? [1, 4, 7, 10] : n === 5 ? [1, 3, 5, 7, 9] : n === 6 ? [0, 2, 4, 6, 8, 10] : [0, 1, 3, 4, 6, 7, 9].slice(0, n);
  const sockets = o.sockets.map((k, i) => ({ id: k.id, label: k.label, x: xs[i], y: o.y == null ? 1 : o.y }));
  const wires = o.wires === undefined ? [[[Math.min(...xs), sockets[0].y], [Math.max(...xs), sockets[0].y]]] : o.wires;
  return { cols: 11, rows: 7, sockets, fixed: o.fixed || [], wires, start: o.start || { x: 5, y: 3 }, lever: o.lever || { x: 10, y: 4 } };
}
// two rows of sockets (e.g. cause on top, effect below)
function gridRig(o) {
  const sockets = [], rows = o.rows; const ys = rows.length === 1 ? [1] : rows.length === 2 ? [1, 3] : [1, 2, 3];
  rows.forEach((row, r) => { const n = row.length, xs = n === 1 ? [5] : n === 2 ? [3, 7] : n === 3 ? [2, 5, 8] : n === 4 ? [1, 4, 7, 10] : [1, 3, 5, 7, 9]; row.forEach((k, i) => sockets.push({ id: k.id, label: k.label, x: xs[i], y: ys[r] })); });
  return { cols: 11, rows: 7, sockets, fixed: o.fixed || [], wires: o.wires || [], start: o.start || { x: 5, y: 5 }, lever: o.lever || { x: 10, y: 5 } };
}

/* ---- builders ---- */
// mk: wraps a calc(p) that runs only once every socket is filled
const mk = o => Object.assign({}, o.rig, { q: o.q, teach: o.teach, hint: o.hint, parts: o.parts, coach: o.coach,
  model(p) { const need = (o.rig.sockets || []).every(k => p[k.id]); if (!need) return { meters: o.idle || [], note: o.idleNote || '' }; return Object.assign({ live: true }, o.calc(p)); } });
// dial: one socket whose part sets a number; the meter shows it; match the target
function dial(o) {
  const id = o.id || 'r', rd = v => o.read(v), tgt = o.target, tol = o.tol == null ? 0.03 : o.tol, show = o.show || (x => N2(x));
  const spec = {
    rig: o.rig, q: o.q, teach: o.teach, hint: o.hint, parts: o.parts,
    idle: [meterOf(o.label || 'Reading', '—'), meterOf('Target', show(tgt))], idleNote: o.idleNote || 'Place a part to see the reading.',
    calc(p) { const x = rd(p[id]), ok = near(x, tgt, tol), ms = [meterOf(o.label || 'Reading', show(x), ok ? 'good' : 'bad'), meterOf('Target', show(tgt))].concat(o.extra ? o.extra(p[id], x) : []);
      return { ok, meters: ms, note: o.note(p[id], x), why: o.why, fail: typeof o.fail === 'function' ? o.fail(x, tgt) : (o.fail || (x > tgt ? 'Too high.' : 'Too low.')) }; },
  };
  if (o.guide) spec.coach = (p, carry) => { if (!p[id] && !carry) return 'walk to a bin, face it and press Space.'; if (!p[id]) return 'face the socket and press Space to place it.'; const x = rd(p[id]); if (near(x, tgt, tol)) return 'right on target. Press Enter to test.';
    const nb = o.parts.slice().sort((a, b) => a.v - b.v), i = nb.findIndex(q => q.label === p[id].label), e = q => Math.abs(rd(q) - tgt), up = nb[i + 1], dn = nb[i - 1];
    const cands = [up, dn].filter(q => q && e(q) < e(p[id])); const pick1 = cands.sort((a, b) => e(a) - e(b))[0];
    return (x > tgt ? 'too high. ' : 'too low. ') + (pick1 ? 'Try a <b>' + (pick1 === up ? 'bigger' : 'smaller') + '</b> one.' : 'Try a different one.'); };
  return mk(spec);
}
// slot: fill labelled slots with the matching part (ordering, matching, picking settings)
function slot(o) {
  const n = o.slots.length, want = {}; o.slots.forEach((s, i) => want[s.id] = s.want);
  const rig = o.rig || rowRig({ sockets: o.slots.map(s => ({ id: s.id, label: s.label })), fixed: o.fixed });
  const spec = { rig, q: o.q, teach: o.teach, hint: o.hint, parts: o.parts.map(x => typeof x === 'string' ? PT(x, x, o.kind || 'BOX') : x),
    idle: o.count === false ? [] : [meterOf('In place', '0 of ' + n)], idleNote: o.idleNote || '',
    calc(p) { const good = o.slots.filter(s => p[s.id].label === s.want).length, ok = good === n; const ms = o.count === false ? [] : [meterOf('In place', good + ' of ' + n, ok ? 'good' : '')].concat(o.meters ? o.meters(p, good) : []);
      return { ok, meters: ms, note: o.note ? o.note(p, good) : (ok ? 'Everything is in place.' : (o.count === false ? '' : good + ' of ' + n + ' are right.')), why: o.why, fail: o.fail || '' }; } };
  if (o.guide) spec.coach = (p, carry) => { const empty = o.slots.find(s => !p[s.id]); if (!carry && empty) return 'pick a part from the bins.'; if (carry) return 'place it in a socket.'; const bad = o.slots.find(s => p[s.id].label !== s.want); return bad ? 'swap the one that does not belong: take it back with Space on the socket.' : 'all in place. Press Enter.'; };
  const m = mk(spec); m.coach = spec.coach; return m;
}

      calc(p) { const r = pfc(R, X, w, p.r.v), ok = Math.abs(r.Bnet) < 0.04 * r.B; return { ok, meters: [meterOf('Susceptance', N2(r.B) + ' S'), meterOf('ωC', N2(w * p.r.v) + ' S'), meterOf('Left over', N2(Math.abs(r.Bnet)) + ' S', ok ? 'good' : 'bad')], note: 'Y = 1/(4 + j3) = 0.16 − j0.12 S. ωC = ' + N2(w * p.r.v) + ' S. Net susceptance = <b>' + N2(r.Bnet) + ' S</b>.', why: 'ωC = 0.12 S gives C = 0.12 ÷ 100 = 1.2 mF.', fail: r.Bnet > 0 ? 'Over-corrected: now the load is capacitive. Use a smaller C.' : 'Under-corrected. Use a bigger C.' }; },
      coach(p, carry) { if (!p.r && !carry) return 'grab a capacitor.'; if (!p.r) return 'place it in the parallel socket.'; const r = pfc(R, X, w, p.r.v); return Math.abs(r.Bnet) < .04 * r.B ? 'cancelled. Press Enter.' : r.Bnet > 0 ? 'too much capacitance. Pick a <b>smaller</b> one.' : 'not enough. Pick a <b>bigger</b> one.'; } }); } },
  { t: 'lab', tier: 2, hint: 'C = B ÷ ω where B = X ÷ (R² + X²).', q: '', gen() { const R = pick([3, 4, 6]), X = pick([4, 8]), w = pick([100, 200]), B = X / (R * R + X * X), C = B / w;
    return mk({ rig: benchRig({ left: src(R + ' + j' + X + ' Ω', 'load, ω = ' + w, 'The load Z.'), right: box('Q', 'reactive left', 'Remaining reactive part.'), sockets: [{ id: 'r', label: 'parallel C', x: 5 }] }),
      q: '<b>Build:</b> load Z = ' + R + ' + j' + X + ' Ω at ω = ' + w + ' rad/s. Choose the parallel capacitor that best cancels its reactive part.', teach: '<p>Compute <b>B = X ÷ (R² + X²)</b>, then <b>C = B ÷ ω</b>.</p>', parts: [].concat([C], shuffle([0.2e-3, 0.5e-3, 1e-3, 1.5e-3, 2e-3, 3e-3, 5e-3, 8e-3]).slice(0, 4)).sort((a, b) => a - b).map(CP), idle: [meterOf('Left over', '—')],
      calc(p) { const r = pfc(R, X, w, p.r.v), ok = Math.abs(r.Bnet) < 0.04 * r.B; return { ok, meters: [meterOf('Net susceptance', N2(r.Bnet) + ' S', ok ? 'good' : 'bad')], note: 'B = ' + N2(r.B) + ' S, ωC = ' + N2(w * p.r.v) + ' S.', why: 'C = B ÷ ω = ' + E(C, 'F') + '.', fail: r.Bnet > 0 ? 'Too much.' : 'Too little.' }; } }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'Max power: ZL = Zs*. Same resistance, opposite reactance.', q: '', gen() { const V = 10, Rs = pick([2, 4]), Xs = pick([2, 3, 4]), Pm = V * V / (4 * Rs);
    return mk({ rig: benchRig({ left: src(V + ' V rms', Rs + ' + j' + Xs + ' Ω source', 'Source impedance ' + Rs + ' + j' + Xs + ' Ω.'), right: box('P', 'in load', 'Real power in the load.'), sockets: [{ id: 'r', label: 'load R', x: 4 }, { id: 'x', label: 'load X', x: 7 }] }),
      q: '<b>Build:</b> a ' + V + ' V rms source has impedance ' + Rs + ' + j' + Xs + ' Ω. Choose the load R and X for <b>maximum power</b> (' + N2(Pm) + ' W).', teach: '<p>Choose <b>Z<sub>L</sub> = Z<sub>s</sub>*</b>: equal resistance, opposite reactance. Then <b>P<sub>max</sub> = V² ÷ (4R<sub>s</sub>)</b>.</p>', parts: [].concat([1, 2, 4, 8].map(RP), [-4, -3, -2, 0, 2, 4].map(v => PT((v < 0 ? '−j' : v > 0 ? '+j' : 'j') + Math.abs(v) + ' Ω', v, v < 0 ? 'C' : 'L'))), idle: [meterOf('Power', '—')],
      calc(p) { if (p.r.kind !== 'R' || p.x.kind === 'R') return { ok: false, meters: [], note: 'The first socket takes a resistance, the second a reactance.', fail: 'Put a resistor first and a +j / −j part second.' }; const P = V * V * p.r.v / ((Rs + p.r.v) ** 2 + (Xs + p.x.v) ** 2), ok = near(P, Pm, .005); return { ok, meters: [meterOf('Power', N2(P) + ' W', ok ? 'good' : 'bad'), meterOf('Maximum', N2(Pm) + ' W')], note: 'Net reactance = ' + (Xs + p.x.v) + ' Ω.', why: 'ZL = ' + Rs + ' − j' + Xs + ' Ω.', fail: 'There is more power to get. Match R and cancel the reactance.' }; } }); } },

/* ---- 5: three-phase basics ---- */
GL(5, 'Three-Phase Basics', [
  { t: 'lab', tier: 1, hint: 'abc sequence: b is 120° behind a (−120°), c is 120° ahead (+120°).', q: '', gen() {
    const sl = [{ id: 'b', label: 'Vb', want: '−120°' }, { id: 'c', label: 'Vc', want: '+120°' }];
    return SL({ slots: sl, parts: ['−120°', '+120°', '0°', '180°'], guide: true, q: '<b>Build:</b> Va = Vm∠0°. In a balanced <b>abc</b> (positive) set, set the angle of each of the other two phases.', teach: '<p><b>Three-phase</b> power is three AC waves of equal size, spaced 120° apart. In the usual <b>abc</b> sequence: <b>V<sub>b</sub> = V<sub>m</sub>∠−120°</b> and <b>V<sub>c</sub> = V<sub>m</sub>∠+120°</b>. (In <b>acb</b> they swap.) A balanced set adds to zero at every instant.</p>', why: 'abc: Vb = Vm∠−120°, Vc = Vm∠+120°.' }); } },
  { t: 'lab', tier: 2, hint: 'In acb the order is reversed: b is +120°, c is −120°.', q: '', gen() {
    const sl = [{ id: 'b', label: 'Vb', want: '+120°' }, { id: 'c', label: 'Vc', want: '−120°' }];
    return SL({ slots: sl, parts: ['−120°', '+120°', '0°', '180°'], q: '<b>Build:</b> now the set runs in the <b>acb</b> (negative) sequence. Set the angle of Vb and Vc.', teach: '<p>Reverse the sequence and the two angles swap places. 240° is the same angle as −120°.</p>', why: 'acb: Vb = Vm∠+120°, Vc = Vm∠−120°.' }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'To make the three phasors add to zero, Vc must be 120 V at +120°.', q: '', gen() { const A = pick([120, 208]), ang = rad(120);
    return mk({ rig: benchRig({ left: src('Va', A + '∠0°', 'Phase a: ' + A + ' V at 0°.'), right: box('Σ', 'Va + Vb + Vc', 'The sum of the three phases.'), top: [{ x: 3, kind: 'SRC', label: A + '∠−120°', sub: 'Vb', info: 'Phase b: ' + A + ' V at −120°.' }], sockets: [{ id: 'm', label: 'Vc size', x: 6 }, { id: 'a', label: 'Vc angle', x: 8 }] }),
      q: '<b>Build:</b> Va = ' + A + '∠0° and Vb = ' + A + '∠−120°. Choose the size and angle of Vc so the three <b>add up to zero</b> (a balanced set).', teach: '<p>Add the arrows. Va + Vb = ' + A + '∠−60° (check: real part ' + A + ' × (1 − 0.5) and imaginary part −' + A + ' × 0.866). For the total to be <b>zero</b>, Vc must be the exact opposite arrow: ' + A + '∠(−60° + 180°) = ' + A + '∠+120°.</p>',
      parts: [].concat([A / 2, A, 2 * A].map(v => PT(v + ' V', v, 'SRC')), [-120, 0, 60, 120, 180].map(v => PT(v + '°', v, 'BOX'))), idle: [meterOf('|Sum|', '—')],
      calc(p) { if (p.m.kind !== 'SRC' || p.a.kind !== 'BOX') return { ok: false, meters: [], note: 'Size goes in the first socket, angle in the second.', fail: 'Put a voltage in the size socket and an angle in the angle socket.' }; const re = A + A * Math.cos(rad(-120)) + p.m.v * Math.cos(rad(p.a.v)), im = A * Math.sin(rad(-120)) + p.m.v * Math.sin(rad(p.a.v)), s = mag2(re, im), ok = s < 0.02 * A; return { ok, meters: [meterOf('|Sum|', N2(s) + ' V', ok ? 'good' : 'bad')], note: 'Sum = ' + N2(re) + ' + j' + N2(im) + ' V.', why: 'Vc = ' + A + '∠+120° makes the sum zero.', fail: 'The three phases do not cancel yet.' }; } }); } },
]);

/* ---- 6: real grid ---- */
GL(6, 'The Real Grid and the Balanced Y-Y Circuit', [
  { t: 'lab', tier: 1, hint: 'Two hots 180° apart: V∠0° − V∠180° = 2V.', q: '', gen() { const tgt = 240;

  { t: 'lab', tier: 2, hint: 'Line voltage = √3 × phase voltage.', q: '', gen() { const Vp = pick([120, 277]), tgt = Math.sqrt(3) * Vp;
    return dial({ rig: benchRig({ left: src('Y source', 'phase voltage', 'A Y-connected source.'), right: box('VL-L', 'line to line', 'The voltage between two lines.'), sockets: [{ id: 'r', label: 'phase voltage', x: 5 }] }),
      q: '<b>Build:</b> a balanced Y source. Choose the phase voltage so the <b>line-to-line voltage is ' + N2(tgt) + ' V</b>.', teach: '<p>In a Y connection the line-to-line voltage is <b>√3 × the phase voltage</b> (about 1.732×). 120 V phase gives 208 V line; 277 V phase gives 480 V line.</p>', parts: pickR([100, 120, 150, 200, 240, 277, 400], 5, Vp).map(v => PT(v + ' V', v, 'SRC')), read: p => Math.sqrt(3) * p.v, target: tgt, tol: .01, label: 'Line voltage', show: x => N2(x) + ' V', note: (p, x) => '√3 × ' + p.v + ' = ' + N2(x) + ' V.', why: 'Vphase = ' + N2(tgt) + ' ÷ √3 = ' + Vp + ' V.' }); } },

]);

  { t: 'lab', tier: 2, hint: 'Y: Vphase = Vline ÷ √3.', q: '', gen() { const VL = pick([208, 480]), tgt = VL / Math.sqrt(3);

      q: '<b>Build:</b> a Y system has ' + VL + ' V line to line. Choose the phase voltage.', teach: '<p>In a Y connection <b>V<sub>line</sub> = √3 · V<sub>phase</sub></b>, and the phase current equals the line current.</p>', parts: pickR([100, 120, 208, 240, 277, 400, 480], 5, Math.round(tgt)).map(v => PT(v + ' V', v, 'SRC')), read: p => p.v, target: tgt, tol: .01, label: 'Phase voltage', show: x => N2(x) + ' V', note: (p, x) => 'You chose ' + x + ' V.', why: VL + ' ÷ √3 = ' + N2(tgt) + ' V.' }); } },
  { t: 'lab', tier: 3, boss: true, hint: '|I| = Vphase ÷ |Zφ|. Add the series impedances (real with real, imaginary with imaginary).', q: '', gen() { const V = 240, Zg = [0.5, 1], Zl = [1.5, 2], tgt = 4.8;

      parts: [].concat([8, 18, 28, 38, 48].map(RP), [0, 7, 17, 27, 37].map(v => PT('j' + v + ' Ω', v, 'L'))), idle: [meterOf('|I|', '—')],
      calc(p) { if (p.r.kind !== 'R' || p.x.kind !== 'L') return { ok: false, meters: [], note: 'R goes in the first socket, reactance in the second.', fail: 'Put a resistor first and a j-reactance second.' }; const Z = mag2(2 + p.r.v, 3 + p.x.v), I = 240 / Z, ok = near(I, tgt, .02); return { ok, meters: [meterOf('|Zφ|', N2(Z) + ' Ω'), meterOf('|I|', N2(I) + ' A', ok ? 'good' : 'bad'), meterOf('Target', '4.8 A')], note: '|Zφ| = √((2+' + p.r.v + ')² + (3+' + p.x.v + ')²) = ' + N2(Z) + ' Ω.', why: 'For example R = 38 Ω and X = 27 Ω give Zφ = 40 + j30 = 50 Ω, so I = 240 ÷ 50 = 4.8 A.', fail: I > tgt ? 'Too much current. Use a bigger load impedance.' : 'Too little current.' }; } }); } },

      q: '<b>Build:</b> choose the trip level of a GFCI so it <b>does not trip</b> on the 4 mA that a normal appliance leaks, but <b>does trip</b> on a 30 mA dangerous leak.', teach: '<p>A <b>circuit breaker</b> protects the <b>wires</b> (it senses total current). A <b>GFCI</b> protects <b>people</b>: it compares the current out on the hot with the current back on the neutral. If they differ by more than a few mA, current is leaking somewhere (maybe through you) and it cuts the power. (Its blind spot: touching hot and neutral together leaks nothing, so it does not trip.)</p>',

]);

/* ---- 11: Laplace operations ---- */
GL(11, 'Laplace Operations', [
  { t: 'lab', tier: 1, hint: 'Derivative ↔ multiply by s. Integral ↔ divide by s. Delay ↔ e^(−as). Decay factor ↔ shift s.', q: '', gen() {
    const sl = [['Derivative df/dt', 'sF(s) − f(0⁻)'], ['Integral ∫f dt', 'F(s) ÷ s'], ['Delay by a', 'e^(−as) F(s)'], ['Decay e^(−at) f(t)', 'F(s + a)']].map((x, i) => ({ id: 's' + i, label: x[0], want: x[1] }));

]);

/* ---- 12: inverse Laplace ---- */
GL(12, 'Inverse Laplace by Partial Fractions', [
  { t: 'lab', tier: 1, hint: 'Cover-up: A = K ÷ (3 − 1) = K ÷ 2. For A = 3 you need K = 6.', q: '', gen() { const tgt = 3;
    return dial({ rig: benchRig({ left: src('F(s)', 'K / [(s+1)(s+3)]', 'F(s) = K divided by (s + 1)(s + 3).'), right: box('A', 'coefficient of 1/(s+1)', 'The partial-fraction coefficient A in A/(s+1) + B/(s+3).'), sockets: [{ id: 'r', label: 'K', x: 5 }] }),
      q: '<b>Build:</b> F(s) = K ÷ [(s + 1)(s + 3)] = A/(s + 1) + B/(s + 3). Choose K so that <b>A = 3</b>.', teach: '<p>To go from F(s) back to f(t), split a big fraction into small ones you recognise: <b>partial fractions</b>. For a simple pole use <b>cover-up</b>: cover the factor (s + 1) and put s = −1 in the rest: <b>A = K ÷ (−1 + 3) = K ÷ 2</b>. Then <b>f(t) = A e<sup>−t</sup> + B e<sup>−3t</sup></b>.</p>',
      parts: [2, 4, 6, 8, 12].map(v => PT('K = ' + v, v, 'BOX')), read: p => p.v / 2, target: tgt, tol: .001, guide: true, label: 'A', show: x => N2(x), extra: p => [meterOf('B', N2(-p.v / 2))], note: (p, x) => 'A = K ÷ 2 = <b>' + N2(x) + '</b>, B = −K ÷ 2 = ' + N2(-p.v / 2) + '.', why: 'A = K ÷ 2 = 3 means K = 6.' }); } },
  { t: 'lab', tier: 2, hint: 'A = K ÷ (b − a) for K / [(s+a)(s+b)] at the pole s = −a.', q: '', gen() { const a = pick([1, 2]), b = pick([3, 4, 5]), A = pick([1, 2, 3]), K = A * (b - a);
    return dial({ rig: benchRig({ left: src('F(s)', 'K / [(s+' + a + ')(s+' + b + ')]', 'F(s) with poles at −' + a + ' and −' + b + '.'), right: box('A', 'coefficient of 1/(s+' + a + ')', 'The coefficient A.'), sockets: [{ id: 'r', label: 'K', x: 5 }] }),
      q: '<b>Build:</b> F(s) = K ÷ [(s + ' + a + ')(s + ' + b + ')]. Choose K so that A (the coefficient of 1/(s + ' + a + ')) is <b>' + A + '</b>.', teach: '<p>Cover-up: put s = −' + a + ' in the other factor: A = K ÷ (' + b + ' − ' + a + ').</p>', parts: pickR([1, 2, 3, 4, 6, 8, 9, 12], 5, K).map(v => PT('K = ' + v, v, 'BOX')), read: p => p.v / (b - a), target: A, tol: .001, label: 'A', show: x => N2(x), note: (p, x) => 'A = ' + p.v + ' ÷ ' + (b - a) + ' = ' + N2(x) + '.', why: 'K = A × (b − a) = ' + K + '.' }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'As t → ∞ the decaying pieces die out. F(s) = K(s+1)/[s(s+2)] settles to the pole-at-zero coefficient: K ÷ 2.', q: '', gen() { const tgt = pick([2, 3, 5]);
    return dial({ rig: benchRig({ left: src('F(s)', 'K(s+1) / [s(s+2)]', 'F(s) = K(s + 1) divided by s(s + 2).'), right: box('f(∞)', 'final value', 'What f(t) settles to for large t.'), sockets: [{ id: 'r', label: 'K', x: 5 }] }),
      q: '<b>Build:</b> F(s) = K(s + 1) ÷ [s(s + 2)]. The e^(−2t) piece dies out, so f(t) settles to a constant. Choose K so that it settles to <b>' + tgt + '</b>.', teach: '<p>The pole at <b>s = 0</b> gives a constant term in f(t); every pole to the left of the origin gives a term that decays. The constant is the cover-up coefficient at s = 0: <b>A = K(0 + 1) ÷ (0 + 2) = K ÷ 2</b>.</p>', parts: [2, 4, 6, 8, 10, 12].map(v => PT('K = ' + v, v, 'BOX')), read: p => p.v / 2, target: tgt, tol: .001, label: 'f(∞)', show: x => N2(x), note: (p, x) => 'A = K ÷ 2 = ' + N2(x) + '.', why: 'K = 2 × ' + tgt + ' = ' + 2 * tgt + '.' }); } },
]);

/* ---- 15: signals and systems ---- */
GL(15, 'Signals and Systems', [
  { t: 'lab', tier: 1, hint: 'Linear means superposition works. Squaring, absolute value and a constant offset break it.', q: '', gen() {
    const sl = [['y = 3x', 'Linear'], ['y = x²', 'Not linear'], ['y = x + 5', 'Not linear']].map((x, i) => ({ id: 's' + i, label: x[0], want: x[1] }));

]);

/* ---- 16: convolution ---- */
GL(16, 'Convolution', [
  { t: 'lab', tier: 1, hint: 'Flip, shift, multiply, integrate. A new case starts whenever an edge of one function crosses an edge of the other.', q: '', gen() {
    const order = ['Flip h(τ) to h(−τ)', 'Shift it by t', 'Find where they overlap', 'Integrate the product'];
    const sl = order.map((x, i) => ({ id: 's' + i, label: 'step ' + (i + 1), want: x }));
    return SL({ slots: sl, parts: order, guide: true, q: '<b>Build:</b> put the steps of graphical convolution in order.', teach: '<p>Analyze the circuit once to find its impulse response <b>h(t)</b>. After that, for an LTI system starting at rest, the output for any input is the <b>convolution</b> <b>y(t) = ∫ x(τ) h(t − τ) dτ</b>. Graphically: flip, shift, overlap, integrate, then repeat for each range of t.</p>', why: 'Flip, shift, find the overlap, integrate. Repeat for each range of t.' }); } },
  { t: 'lab', tier: 2, hint: 'Convolution theorem: Y(s) = X(s)·H(s) = 1/((s+1)(s+2)) → y(t) = e^(−t) − e^(−2t).', q: '', gen() { const t0 = pick([0.5, 1, 2]), f = x => Math.exp(-x) - Math.exp(-2 * x), tgt = f(t0);
    return dial({ rig: benchRig({ left: src('x = e^(−t)u(t)', '× h = e^(−2t)u(t)', 'Input e^(−t) convolved with the impulse response e^(−2t).'), right: box('y', 'output at t', 'The output at the time you choose.'), sockets: [{ id: 'r', label: 'time t', x: 5 }] }),
      q: '<b>Build:</b> convolve x(t) = e^(−t)u(t) with h(t) = e^(−2t)u(t). The output is y(t) = e^(−t) − e^(−2t). Choose t so that y = <b>' + N2(tgt) + '</b>.', teach: '<p>With no initial energy, <b>convolution in time is multiplication in the s-domain</b>: <b>Y(s) = X(s) · H(s)</b>. For exponentials this is usually the quick route.</p>', parts: [0.25, 0.5, 1, 2, 4].map(v => PT('t = ' + v + ' s', v, 'BOX')), read: p => f(p.v), target: tgt, tol: .01, label: 'y(t)', show: x => N2(x), note: (p, x) => 'y(' + p.v + ') = ' + N2(x) + '.', why: 't = ' + t0 + ' s.' }); } },
  { t: 'lab', tier: 3, boss: true, hint: 'x lives on [1, 3]. A pulse of width w makes the output nonzero from t = 1 until t = 3 + w.', q: '', gen() { const w = pick([0.5, 1, 1.5]), end = 3 + w;
    return dial({ rig: benchRig({ left: src('x on [1, 3]', 'e^t', 'The input x(t) = e^t exists only from t = 1 to t = 3.'), right: box('y ≠ 0', 'until t = ' + end, 'The output is nonzero until the pulse has slid completely past.'), sockets: [{ id: 'r', label: 'pulse width w', x: 5 }] }),
      q: '<b>Build:</b> x(t) = e^t exists from t = 1 to 3. Convolve it with a pulse h of width w. Choose w so the output is non-zero up to t = <b>' + end + '</b> and zero after.', teach: '<p>The overlap changes (a new case starts) each time an edge of one function crosses an edge of the other. The output begins when the front of the pulse meets x (t = 1) and ends when the back of the pulse leaves x (t = 3 + w).</p>', parts: [0.5, 1, 1.5, 2].map(v => PT('w = ' + v, v, 'BOX')), read: p => 3 + p.v, target: end, tol: .001, label: 'Output ends at', show: x => N2(x), note: (p, x) => 'The output ends at t = 3 + ' + p.v + ' = ' + N2(x) + '.', why: 'w = ' + w + '.' }); } },
]);

/* Circuits game art. Analogy ON: water pipes, pump, flywheel, tank. OFF: circuit schematic and a city that lights up. */
function gridStage(level, box, ana) {
  const W = 480, H = 120;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; cv.setAttribute('role', 'img');
  cv.setAttribute('aria-label', ana ? 'A pump pushing water around a pipe loop into a tank that fills as you solve challenges' : 'An AC circuit loop feeding a city whose lights come on as you solve challenges');
  box.append(cv);
  const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let prog = 0, total = 1, flick = 0, state = 'play', raf = 0, dead = false, target = 0, shown = 0;
  const parts = (level.theme && level.theme.parts) || ['R'];
  const phase = ((level.theme && level.theme.phase) || 0) * Math.PI / 180;
  const seed = level.n * 7919;
  const rnd = i => { const x = Math.sin(seed + i * 12.9898) * 43758.5453; return x - Math.floor(x); };
  const B = []; for (let i = 0; i < 9; i++) B.push({ x: 292 + i * 20, w: 16 + Math.floor(rnd(i) * 4), h: 30 + Math.floor(rnd(i + 20) * 55) });
  const wins = []; B.forEach((b, bi) => { for (let y = 0; y < b.h - 8; y += 9) for (let x = 3; x < b.w - 3; x += 6) wins.push({ x: b.x + x, y: 112 - b.h + 4 + y }); });
  wins.forEach((w, i) => w.r = rnd(i + 100));
  wins.sort((a, b) => a.r - b.r);
  const P = [[24, 28], [250, 28], [250, 92], [24, 92]], LEN = [226, 64, 226, 64], TOT = 580;
  function at(d) { let s = ((d % 1) + 1) % 1 * TOT, i = 0; while (s > LEN[i]) { s -= LEN[i]; i++; } const a = P[i], b = P[(i + 1) % 4], f = s / LEN[i]; return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]; }

  function draw(ts) {
    const t = (ts || 0) / 1000;
    shown += (target - shown) * 0.08; if (Math.abs(target - shown) < 0.002) shown = target;
    ctx.fillStyle = state === 'lose' ? '#05050c' : '#070815'; ctx.fillRect(0, 0, W, H);
    const col = ana ? '#4aa3ff' : '#6a70c0';
    // loop wires
    ctx.strokeStyle = col; ctx.lineWidth = ana ? 7 : 3;
    ctx.beginPath(); P.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.stroke();
    if (ana) { ctx.strokeStyle = '#0c2a52'; ctx.lineWidth = 3; ctx.beginPath(); P.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.stroke(); }
    // source
    const sx = 24, sy = 60;
    if (ana) { ctx.fillStyle = '#16345e'; ctx.fillRect(sx - 14, sy - 16, 28, 32); ctx.strokeStyle = '#4aa3ff'; ctx.lineWidth = 3; ctx.strokeRect(sx - 14, sy - 16, 28, 32); const py = sy + Math.sin(t * 5) * 8; ctx.fillStyle = '#9fd0ff'; ctx.fillRect(sx - 10, py - 4, 20, 8); }
    else { ctx.fillStyle = '#070815'; ctx.beginPath(); ctx.arc(sx, sy, 15, 0, 7); ctx.fill(); ctx.strokeStyle = '#7ef7c1'; ctx.lineWidth = 3; ctx.stroke(); ctx.beginPath(); for (let x = -8; x <= 8; x++) { const y = Math.sin(x / 8 * Math.PI * 2 - t * 4) * 5; x === -8 ? ctx.moveTo(sx + x, sy + y) : ctx.lineTo(sx + x, sy + y); } ctx.stroke(); }
    // parts along the top
    parts.forEach((p, i) => {
      const x = 70 + i * (170 / Math.max(parts.length, 1)) + (parts.length === 1 ? 40 : 0), y = 28;
      ctx.lineWidth = 3;
      if (p === 'R') { if (ana) { ctx.fillStyle = '#070815'; ctx.fillRect(x - 14, y - 6, 28, 12); ctx.fillStyle = '#6a7a93'; ctx.fillRect(x - 14, y - 9, 28, 3); ctx.fillRect(x - 14, y + 6, 28, 3); ctx.fillStyle = '#4aa3ff'; ctx.fillRect(x - 14, y - 2, 28, 4); } else { ctx.strokeStyle = '#ffe66d'; ctx.fillStyle = '#070815'; ctx.fillRect(x - 16, y - 7, 32, 14); ctx.beginPath(); ctx.moveTo(x - 16, y); for (let k = 0; k < 6; k++) ctx.lineTo(x - 13 + k * 5, y + (k % 2 ? 7 : -7)); ctx.lineTo(x + 16, y); ctx.stroke(); } }
      if (p === 'L') { if (ana) { ctx.fillStyle = '#070815'; ctx.beginPath(); ctx.arc(x, y, 13, 0, 7); ctx.fill(); ctx.strokeStyle = '#ffb454'; ctx.stroke(); const a = t * 3 + phase; for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a + k * Math.PI / 2) * 12, y + Math.sin(a + k * Math.PI / 2) * 12); ctx.stroke(); } } else { ctx.strokeStyle = '#ff9f5a'; ctx.fillStyle = '#070815'; ctx.fillRect(x - 16, y - 8, 32, 14); ctx.beginPath(); for (let k = 0; k < 4; k++) ctx.arc(x - 12 + k * 8, y, 4, Math.PI, 0); ctx.stroke(); } }
      if (p === 'C') { if (ana) { ctx.fillStyle = '#070815'; ctx.fillRect(x - 12, y - 14, 24, 28); ctx.strokeStyle = '#7ef7c1'; ctx.strokeRect(x - 12, y - 14, 24, 28); const lvl = 12 + Math.sin(t * 2 + phase) * 6; ctx.fillStyle = '#4aa3ff'; ctx.fillRect(x - 10, y + 12 - lvl, 20, lvl); } else { ctx.strokeStyle = '#7ef7c1'; ctx.fillStyle = '#070815'; ctx.fillRect(x - 10, y - 12, 20, 24); ctx.beginPath(); ctx.moveTo(x - 4, y - 12); ctx.lineTo(x - 4, y + 12); ctx.moveTo(x + 4, y - 12); ctx.lineTo(x + 4, y + 12); ctx.stroke(); } }
    });
    // flowing dots
    const n = 22, spd = (state === 'lose' ? 0 : 0.06 + 0.06 * (prog / total));
    for (let i = 0; i < n; i++) {
      const d = i / n + t * spd; const dir = ana ? 1 : Math.sin(t * 3 + phase);
      const [x, y] = at(ana ? d : (i / n) + Math.sin(t * 1.5) * 0.02 + t * spd * 0.3 * (dir > 0 ? 1 : 1));
      ctx.fillStyle = ana ? '#bfe3ff' : '#7ef7c1'; ctx.fillRect(x - 2, y - 2, 4, 4);
    }
    // right side: tank (analogy) or city (circuit)
    if (ana) {
      const tx = 320, ty = 20, tw = 140, th = 88;
      ctx.fillStyle = '#0a1830'; ctx.fillRect(tx, ty, tw, th); ctx.strokeStyle = '#4aa3ff'; ctx.lineWidth = 3; ctx.strokeRect(tx, ty, tw, th);
      const lvl = (th - 6) * shown; ctx.fillStyle = state === 'lose' ? '#1b2540' : '#2c7be5'; ctx.fillRect(tx + 3, ty + th - 3 - lvl, tw - 6, lvl);
      ctx.fillStyle = '#7fc0ff'; for (let x = 0; x < tw - 6; x += 8) { const w = Math.sin(t * 3 + x / 6) * 2; ctx.fillRect(tx + 3 + x, ty + th - 3 - lvl + w, 6, 3); }
      ctx.strokeStyle = '#4aa3ff'; ctx.beginPath(); ctx.moveTo(250, 60); ctx.lineTo(tx, 60); ctx.stroke();
      // mill wheel
      const wx = 300, wy = 60; ctx.strokeStyle = '#ffe66d'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(wx, wy, 10, 0, 7); ctx.stroke(); const a = t * (state === 'lose' ? 0 : 2 + 4 * shown); for (let k = 0; k < 6; k++) { ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx + Math.cos(a + k * 1.047) * 10, wy + Math.sin(a + k * 1.047) * 10); ctx.stroke(); }
    } else {
      ctx.fillStyle = '#10142a'; B.forEach(b => ctx.fillRect(b.x, 112 - b.h, b.w, b.h));
      const lit = Math.round(wins.length * shown);
      wins.forEach((w, i) => { const on = i < lit && state !== 'lose'; ctx.fillStyle = on ? (flick > 0.3 && i % 3 === 0 ? '#3a3a20' : '#ffe66d') : '#1c2144'; ctx.fillRect(w.x, w.y, 3, 5); });
      ctx.fillStyle = '#10142a'; ctx.fillRect(280, 112, 200, 8);
      ctx.strokeStyle = '#6a70c0'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(250, 60); ctx.lineTo(286, 60); ctx.lineTo(286, 112); ctx.stroke();
    }
    if (flick > 0) { ctx.fillStyle = 'rgba(255,60,80,' + (flick * 0.35) + ')'; ctx.fillRect(0, 0, W, H); flick = Math.max(0, flick - 0.04); }
    if (state === 'win') { ctx.fillStyle = 'rgba(255,230,109,' + (0.1 + 0.08 * Math.sin(t * 6)) + ')'; ctx.fillRect(0, 0, W, H); }
    if (!reduce && !dead) raf = requestAnimationFrame(draw);
  }
  function once() { if (reduce) { shown = target; draw(0); } }
  raf = requestAnimationFrame(draw);
  return {
    setProgress(i, n) { prog = i; total = n; target = i / n; once(); },
    good(i, n) { prog = i; total = n; target = i / n; once(); },
    miss(i, n) { prog = i; total = n; target = i / n; flick = 1; once(); },
    bad() { flick = 1; once(); },
    advance() {},
    win() { state = 'win'; target = 1; once(); },
    lose() { state = 'lose'; once(); },
    destroy() { dead = true; cancelAnimationFrame(raf); },
  };
}

Kit.init({
  id: 'power-keeper', title: 'Power Keeper', hearts: 3,
  timer: { 1: 45, 2: 75, 3: 120 },
  modes: { on: 'Water pipes', off: 'Circuit schematic' },
  skin: ana => ana
    ? { heartName: 'pressure bars', heartIcon: '💧', tagline: 'You run a water system. Each level is a repair job on the pipes: keep the pressure up, answer fast for bonus points, and fill the reservoir. Every puzzle is the real circuit idea in plumbing clothes.', winText: 'Reservoir full!', loseText: 'The pipes ran dry' }
    : { heartName: 'stability', heartIcon: '⚡', tagline: 'You keep a city’s power grid alive. Each level is a substation under stress: answer the faults before the grid falters, answer fast for bonus points, and light up the skyline.', winText: 'Grid restored!', loseText: 'Blackout' },
  levels: GRID_LEVELS, stage: gridStage,
});
